# 서버 한 대에 API + Postgres + Caddy(HTTPS 자동 발급)를 올린다.
# 사용법은 server/README.md의 "배포" 참고. 비밀값은 같은 폴더의 .env에 둔다 (커밋 금지).
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: room
      POSTGRES_USER: room
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 적어 주세요}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U room -d room"]
      interval: 5s
      retries: 10

  app:
    image: ${ROOM_IMAGE:-ghcr.io/juhee77/simple_game-room-server:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/room
      DATABASE_USERNAME: room
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      ROOM_ALLOWED_ORIGINS: ${ROOM_ALLOWED_ORIGINS:-https://juhee77.github.io}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      ROOM_DOMAIN: ${ROOM_DOMAIN:?ROOM_DOMAIN을 .env에 적어 주세요}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  db-data:
  caddy-data:
