<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D 네온 주사위 & 동전 | 미니게임 천국</title>
  <script src="../scripts/game-common.js?v=b7c7301f"></script>
  <link rel="stylesheet" href="../styles/game-common.css?v=bed20c1e">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root {
      --bg: #0b0b1a;
      --card-bg: rgba(22, 22, 45, 0.7);
      --card-border: rgba(255, 255, 255, 0.1);
      --cyan: #00d4ff;
      --purple: #7c3aed;
      --pink: #ff006e;
      --yellow: #ffd166;
      --green: #06d6a0;
      --text-main: #ffffff;
      --text-dim: #94a3b8;
      --radius-card: 16px;
      --radius-btn: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      padding: 0;   /* 공용 CSS의 body 패딩을 쓰지 않는다 */
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Outfit', 'Pretendard', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 10px 0;
    }

    .back-btn {
      position: absolute;
      left: 0;
      background: none;
      border: none;
      color: var(--cyan);
      font-size: 24px;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      transition: background 0.2s;
    }

    .back-btn:hover { background: rgba(0, 212, 255, 0.1); }

    h1 {
      font-size: 24px;
      font-weight: 800;
      background: linear-gradient(90deg, var(--cyan), var(--purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(10px);
      border-radius: var(--radius-card);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .tab-row {
      display: flex;
      gap: 10px;
    }

    .tab-btn {
      flex: 1;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--card-border);
      color: var(--text-dim);
      padding: 12px;
      border-radius: var(--radius-btn);
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: rgba(0, 212, 255, 0.15);
      border-color: var(--cyan);
      color: var(--cyan);
    }

    .display-area {
      width: 100%;
      height: 280px;
      background: rgba(0, 0, 0, 0.4);
      border-radius: var(--radius-card);
      border: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .result-overlay {
      position: absolute;
      bottom: 16px;
      background: rgba(11, 11, 26, 0.85);
      padding: 8px 20px;
      border-radius: 20px;
      border: 1px solid var(--cyan);
      font-size: 18px;
      font-weight: 800;
      color: var(--yellow);
      box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
    }

    .roll-btn {
      width: 100%;
      padding: 16px;
      font-size: 18px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--cyan), var(--purple));
      border: none;
      color: white;
      border-radius: var(--radius-btn);
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
    }

    .help-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      cursor: pointer;
      border: 1px solid var(--card-border);
      z-index: 100;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-content {
      background: var(--bg);
      border: 1px solid var(--card-border);
      padding: 24px;
      border-radius: var(--radius-card);
      max-width: 400px;
      width: 100%;
    }

    .modal h2 { margin-bottom: 16px; color: var(--cyan); }
    .modal p { margin-bottom: 12px; line-height: 1.5; color: var(--text-dim); }
    .close-modal { margin-top: 16px; width: 100%; padding: 12px; background: var(--purple); border: none; border-radius: 8px; color: white; cursor: pointer; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <a href="../index.html" class="back-btn">←</a>
      <h1>3D 네온 주사위 & 동전</h1>
    </header>

    <div class="card">
      <div class="tab-row">
        <button class="tab-btn active" onclick="setMode('dice', this)">🎲 주사위 던지기</button>
        <button class="tab-btn" onclick="setMode('coin', this)">🪙 동전 던지기 (앞/뒤)</button>
      </div>

      <div class="display-area">
        <canvas id="renderCanvas"></canvas>
        <div class="result-overlay" id="resultOverlay">결과: 준비 완료</div>
      </div>

      <button class="roll-btn" id="rollBtn" onclick="triggerRoll()">🎲 3D 주사위 굴리기!</button>
    </div>
  </div>



  <script type="application/json" id="game-rules">
{
 "title": "3D 네온 주사위 & 동전",
 "players": "1~30인",
 "time": "1분",
 "goal": "주사위나 동전이 없을 때 대신 굴려 줍니다.",
 "steps": [
  "주사위와 동전 중 필요한 것을 고릅니다.",
  "버튼을 누르면 회전 애니메이션과 함께 결과가 정해집니다.",
  "결과를 보고 순서를 정하거나 내기를 가리세요."
 ],
 "tips": [
  "결과는 매번 새로 뽑습니다. 직전 결과가 다음에 영향을 주지 않습니다.",
  "순서 정하기, 벌칙 뽑기, 내기 등 무엇이든 이 한 번으로 정할 수 있습니다."
 ]
}
  </script>

  <script>
    let mode = 'dice';
    let isRolling = false;
    let animId = null;

    const canvas = document.getElementById('renderCanvas');
    const ctx = canvas.getContext('2d');
    const resultOverlay = document.getElementById('resultOverlay');

    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
      drawStatic();
    }
    window.addEventListener('resize', resizeCanvas);

    // Audio Context Setup
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function playSound(type) {
      if (!audioCtx) audioCtx = new AudioContext();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const now = audioCtx.currentTime;

      if (type === 'roll') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(400 + Math.random() * 200, now);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.1);
      } else if (type === 'finish') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.2);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.3);
      }
    }

    function setMode(m, el) {
      mode = m;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');

      const rollBtn = document.getElementById('rollBtn');
      if (mode === 'dice') {
        rollBtn.innerHTML = '🎲 3D 주사위 굴리기!';
        resultOverlay.textContent = '결과: 주사위 준비 완료';
      } else {
        rollBtn.innerHTML = '🪙 3D 동전 던지기!';
        resultOverlay.textContent = '결과: 동전 준비 완료';
      }

      drawStatic();
    }

    function drawStatic() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;

      if (mode === 'dice') {
        // Draw 3D Cube
        ctx.fillStyle = '#7c3aed';
        ctx.strokeStyle = '#00d4ff';
        ctx.lineWidth = 3;
        ctx.fillRect(cx - 40, cy - 40, 80, 80);
        ctx.strokeRect(cx - 40, cy - 40, 80, 80);

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(cx, cy, 10, 0, Math.PI * 2);
        ctx.fill();
      } else {
        // Draw Coin
        ctx.fillStyle = '#ffd166';
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(cx, cy, 50, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#111122';
        ctx.font = 'bold 24px Outfit, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('FRONT', cx, cy + 8);
      }
    }

    function triggerRoll() {
      if (isRolling) return;
      isRolling = true;
      resultOverlay.textContent = '굴러가는 중... 🌀';

      let startTime = performance.now();
      let duration = 1200;

      const finalDiceVal = Math.floor(Math.random() * 6) + 1;
      const finalCoinVal = Math.random() < 0.5 ? '앞면 (HEADS)' : '뒷면 (TAILS)';

      function animate(nowTime) {
        let elapsed = nowTime - startTime;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const cx = canvas.width / 2;
        const cy = canvas.height / 2;

        if (elapsed < duration) {
          if (Math.random() < 0.3) playSound('roll');

          ctx.save();
          ctx.translate(cx, cy);

          const rot = elapsed * 0.02;
          ctx.rotate(rot);

          if (mode === 'dice') {
            ctx.fillStyle = '#ff006e';
            ctx.strokeStyle = '#00d4ff';
            ctx.lineWidth = 3;
            ctx.fillRect(-35, -35, 70, 70);
            ctx.strokeRect(-35, -35, 70, 70);

            const tempVal = Math.floor(Math.random() * 6) + 1;
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 28px Outfit, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(tempVal, 0, 10);
          } else {
            const scaleY = Math.cos(elapsed * 0.03);
            ctx.scale(1, scaleY);
            ctx.fillStyle = '#ffd166';
            ctx.beginPath();
            ctx.arc(0, 0, 50, 0, Math.PI * 2);
            ctx.fill();
          }

          ctx.restore();
          animId = requestAnimationFrame(animate);
        } else {
          // Finish Animation
          isRolling = false;
          playSound('finish');
          drawFinalResult(finalDiceVal, finalCoinVal);
        }
      }

      requestAnimationFrame(animate);
    }

    function drawFinalResult(diceVal, coinVal) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;

      if (mode === 'dice') {
        ctx.fillStyle = '#7c3aed';
        ctx.strokeStyle = '#ffd166';
        ctx.lineWidth = 4;
        ctx.fillRect(cx - 45, cy - 45, 90, 90);
        ctx.strokeRect(cx - 45, cy - 45, 90, 90);

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 44px Outfit, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(diceVal, cx, cy + 15);

        resultOverlay.textContent = `🎲 주사위 결과: [ ${diceVal} ]`;
      } else {
        ctx.fillStyle = '#ffd166';
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.arc(cx, cy, 55, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#111122';
        ctx.font = 'bold 22px Outfit, Pretendard, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(coinVal.includes('앞면') ? '앞면' : '뒷면', cx, cy + 8);

        resultOverlay.textContent = `🪙 동전 결과: ${coinVal}`;
      }
    }

    setTimeout(resizeCanvas, 50);
  </script>
</body>
</html>
