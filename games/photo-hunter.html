<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>포토 헌터 - 미니게임 천국</title>
<link rel="stylesheet" href="../styles/game-common.css">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0f172a;font-family:'Outfit',sans-serif;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
.back{position:absolute;top:20px;left:20px;z-index:10}
h1{font-size:1.8rem;margin:40px 0 10px;background:linear-gradient(135deg,#10b981,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.setup{width:90%;max-width:500px;text-align:center;margin-top:30px}
.setup input{width:80%;padding:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.15);border-radius:12px;color:#fff;font-size:1rem;font-family:inherit;margin:5px 0}
.players{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:15px 0}
.player-tag{background:rgba(255,255,255,.1);padding:8px 16px;border-radius:20px;display:flex;align-items:center;gap:8px}
.player-tag button{background:none;border:none;color:#ff4757;cursor:pointer;font-size:1rem}
.btn{background:linear-gradient(135deg,#10b981,#3b82f6);border:none;color:#fff;padding:14px 50px;font-size:1.2rem;font-weight:700;border-radius:50px;cursor:pointer;margin:15px 0;transition:transform .3s}
.btn:hover{transform:scale(1.05)}
.mission-screen{display:none;text-align:center;width:90%;max-width:500px}
.mission-card{background:rgba(255,255,255,.05);padding:40px 30px;border-radius:30px;border:2px solid rgba(59,130,246,.3);margin:20px 0}
.mission-text{font-size:2rem;font-weight:800;margin-bottom:10px}
.mission-hint{color:#94a3b8;font-size:1.1rem}
.btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}
.claim-btn{padding:16px;border:none;border-radius:16px;font-size:1.1rem;font-weight:700;cursor:pointer;transition:all .3s;color:#fff}
.claim-btn:active{transform:scale(0.95)}
.scoreboard{width:90%;max-width:500px;text-align:center}
.scoreboard h2{font-size:2rem;margin:20px 0}
.score-row{display:flex;justify-content:space-between;padding:12px 20px;background:rgba(255,255,255,.05);border-radius:12px;margin:8px 0;font-size:1.1rem}
.score-row .pts{font-weight:800;color:#2ed573}
</style>
</head>
<body>
<a href="../index.html" class="back back-button">← 메인</a>
<h1>📸 포토 헌터</h1>
<div class="setup" id="setup">
<p style="color:#94a3b8;margin-bottom:15px">참가자 이름을 추가하세요</p>
<input id="name-input" placeholder="이름 입력 후 Enter" onkeydown="if(event.key==='Enter' && !event.isComposing)addPlayer()">
<div class="players" id="player-list"></div>
<button class="btn" onclick="startGame()">게임 시작!</button>
</div>
<div class="mission-screen" id="mission-screen">
<div class="mission-card">
<div style="font-size:3rem;margin-bottom:10px">🔍</div>
<div class="mission-text" id="mission-text"></div>
<div class="mission-hint" id="mission-hint"></div>
</div>
<p style="color:#94a3b8;margin-bottom:10px">가장 먼저 찾은 사람의 버튼을 누르세요!</p>
<div class="btn-grid" id="btn-grid"></div>
<button class="btn" onclick="nextMission()" style="background:linear-gradient(135deg,#f97316,#ec4899)">다음 미션 →</button>
<button class="btn" onclick="endGame()" style="background:rgba(255,255,255,.1);margin-left:10px">결과 보기</button>
</div>
<div class="scoreboard" id="scoreboard" style="display:none">
<h2>🏆 최종 결과</h2>
<div id="final-scores"></div>
<button class="btn" onclick="location.reload()">다시 하기</button>
</div>
<script>
let players=[],scores={},missionIdx=0;
const missions=[
{text:'빨간색 물건',hint:'주변에서 빨간색인 물건을 찾으세요!'},
{text:'둥근 물건',hint:'동그란 모양의 물건을 찾아보세요!'},
{text:'금속 재질',hint:'반짝이는 금속으로 된 물건!'},
{text:'글자가 적힌 것',hint:'텍스트가 보이는 물건을 찾으세요!'},
{text:'자연에서 온 것',hint:'나뭇잎, 꽃, 돌 등 자연물!'},
{text:'줄무늬 패턴',hint:'줄무늬가 있는 것을 찾아보세요!'},
{text:'네모난 물건',hint:'사각형 모양인 물건!'},
{text:'투명한 물건',hint:'투명하거나 반투명한 것!'},
{text:'부드러운 촉감',hint:'만지면 부드러운 것을 찾으세요!'},
{text:'주머니 속 물건',hint:'지금 주머니에 있는 것!'},
{text:'초록색 무언가',hint:'초록색인 것을 찾아보세요!'},
{text:'소리나는 물건',hint:'흔들거나 두드리면 소리나는 것!'},
{text:'2개 이상 쌍',hint:'같은 종류가 2개 이상인 것!'},
{text:'가장 작은 물건',hint:'주변에서 가장 작은 것을 찾으세요!'},
{text:'본인의 소지품',hint:'지금 갖고 있는 소지품 중 하나!'}
];
const colors=['#ff4757','#1e90ff','#2ed573','#ffa502','#8b5cf6','#ec4899','#00cec9','#fd79a8'];
function addPlayer(){const inp=document.getElementById('name-input'),n=inp.value.trim();if(!n)return;players.push(n);scores[n]=0;inp.value='';renderPlayers()}
function renderPlayers(){document.getElementById('player-list').innerHTML=players.map((p,i)=>`<div class="player-tag"><span>${p}</span><button onclick="players.splice(${i},1);delete scores['${p}'];renderPlayers()">✕</button></div>`).join('')}
function startGame(){if(players.length<2){alert('최소 2명 이상!');return}document.getElementById('setup').style.display='none';document.getElementById('mission-screen').style.display='block';renderBtns();nextMission()}
function renderBtns(){document.getElementById('btn-grid').innerHTML=players.map((p,i)=>`<button class="claim-btn" style="background:${colors[i%colors.length]}" onclick="claim('${p}')">${p}</button>`).join('')}
function nextMission(){if(missionIdx>=missions.length)missionIdx=0;const m=missions[missionIdx++];document.getElementById('mission-text').textContent=m.text;document.getElementById('mission-hint').textContent=m.hint}
function claim(name){scores[name]++;const btn=event.target;btn.style.transform='scale(1.2)';setTimeout(()=>btn.style.transform='',300);nextMission()}
function endGame(){document.getElementById('mission-screen').style.display='none';document.getElementById('scoreboard').style.display='block';const sorted=Object.entries(scores).sort((a,b)=>b[1]-a[1]);document.getElementById('final-scores').innerHTML=sorted.map(([n,s],i)=>`<div class="score-row"><span>${i===0?'👑 ':''}${n}</span><span class="pts">${s}점</span></div>`).join('')}
</script>
    <script src="../scripts/game-common.js"></script>
</body>
</html>
