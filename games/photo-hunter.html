<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>포토 헌터 - 미니게임 천국</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&family=Outfit:wght@800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: rgba(22, 28, 45, 0.6);
            --border-color: rgba(99, 102, 241, 0.2);
            --neon-green: #10b981;
            --neon-blue: #3b82f6;
            --neon-purple: #8b5cf6;
            --neon-pink: #ec4899;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(17, 24, 39, 0.8) 0, transparent 50%),
                radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.15) 0, transparent 50%);
            font-family: 'Pretendard', sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        header {
            width: 100%; max-width: 500px; padding: 15px 0;
            display: flex; justify-content: space-between; align-items: center;
            position: relative;
        }
        .back-btn {
            background: var(--panel-bg); border: 1px solid var(--border-color); color: white;
            width: 40px; height: 40px; border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center; font-size: 1.2rem;
            transition: all 0.2s; text-decoration: none;
        }
        .back-btn:hover { background: rgba(99, 102, 241, 0.15); transform: scale(1.05); border-color: var(--neon-blue); }

        h1 {
            font-family: 'Outfit', sans-serif; font-size: 1.8rem; font-weight: 800;
            background: linear-gradient(135deg, var(--neon-green), var(--neon-blue));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(59, 130, 246, 0.1);
        }

        .container {
            width: 100%; max-width: 500px;
            background: var(--panel-bg); backdrop-filter: blur(15px);
            border: 2px solid var(--border-color); border-radius: 30px;
            padding: 25px; display: flex; flex-direction: column; gap: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5), inset 0 0 30px rgba(99, 102, 241, 0.05);
            margin-top: 10px;
        }

        /* Setup view */
        .setup {
            text-align: center; display: flex; flex-direction: column; gap: 15px;
        }
        .input-group {
            display: flex; flex-direction: column; gap: 8px; text-align: left;
        }
        .input-group label {
            font-size: 0.85rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase;
        }
        .setup input {
            width: 100%; padding: 14px; background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color); border-radius: 16px;
            color: #fff; font-size: 1rem; transition: all 0.2s;
        }
        .setup input:focus {
            outline: none; border-color: var(--neon-blue); box-shadow: 0 0 10px rgba(59, 130, 246, 0.25);
        }

        .players {
            display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
            min-height: 50px; padding: 10px; background: rgba(0,0,0,0.15); border-radius: 16px;
        }
        .player-tag {
            background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.05);
            padding: 6px 14px; border-radius: 50px; display: flex; align-items: center; gap: 8px;
            animation: tagPop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-size: 0.95rem; font-weight: 600;
        }
        @keyframes tagPop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .player-tag button {
            background: none; border: none; color: var(--neon-pink); cursor: pointer;
            font-size: 1rem; display: flex; align-items: center;
        }

        .btn {
            background: linear-gradient(135deg, var(--neon-green), var(--neon-blue));
            border: none; color: #fff; padding: 14px 40px; font-size: 1.1rem;
            font-weight: 800; border-radius: 50px; cursor: pointer;
            transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.2);
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(59, 130, 246, 0.35); }
        .btn:active { transform: translateY(0); }

        /* Game Screen */
        .mission-screen {
            display: none; text-align: center; flex-direction: column; gap: 20px;
        }
        .mission-card {
            background: rgba(15, 23, 42, 0.6); padding: 35px 25px; border-radius: 24px;
            border: 2px solid rgba(59, 130, 246, 0.2);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            animation: cardSwitch 0.4s ease;
        }
        @keyframes cardSwitch {
            0% { transform: translateY(10px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        .mission-text {
            font-size: 1.8rem; font-weight: 800; margin: 15px 0 8px;
            background: linear-gradient(135deg, #fff, var(--neon-blue));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .mission-hint { color: var(--text-muted); font-size: 0.95rem; line-height: 1.5; }

        .btn-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 10px 0;
        }
        .claim-btn {
            padding: 16px; border: none; border-radius: 16px; font-size: 1rem;
            font-weight: 800; cursor: pointer; transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.3);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .claim-btn:hover { transform: translateY(-3px); box-shadow: 0 6px 15px rgba(255,255,255,0.1); }
        .claim-btn:active { transform: scale(0.95); }

        .action-row {
            display: flex; gap: 10px; width: 100%;
        }
        .btn-action {
            flex: 1; padding: 12px; font-size: 0.95rem;
        }

        /* Scoreboard */
        .scoreboard {
            display: none; text-align: center; flex-direction: column; gap: 20px;
        }
        .scoreboard h2 {
            font-size: 1.8rem; font-family: 'Outfit', sans-serif; font-weight: 800;
            color: var(--neon-yellow); text-shadow: 0 0 15px rgba(250,204,21,0.2);
        }
        .score-list {
            display: flex; flex-direction: column; gap: 8px;
        }
        .score-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 20px; background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color); border-radius: 16px;
            font-size: 1.05rem; font-weight: 600;
            animation: rowFade 0.3s ease forwards; opacity: 0;
        }
        @keyframes rowFade {
            to { opacity: 1; }
        }
        .score-row .pts { font-weight: 800; color: var(--neon-green); font-family: 'Outfit', sans-serif; }
        .score-row.winner {
            border-color: var(--neon-pink);
            background: linear-gradient(90deg, rgba(236,72,153,0.1), rgba(15,23,42,0.6));
            box-shadow: 0 0 15px rgba(236, 72, 153, 0.15);
        }

    </style>
    <script src="../scripts/game-common.js?v=6650036c"></script>

    <!-- Audio Synthesizer Class -->
    <script>
        class SoundSynth {
            constructor() {
                this.ctx = null;
            }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                // iOS는 컨텍스트가 suspended로 시작하므로 제스처마다 깨워 준다.
                if (this.ctx.state === 'suspended') this.ctx.resume();
            }
            playClick() {
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.frequency.setValueAtTime(440, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, this.ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.001, this.ctx.currentTime + 0.08);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.08);
            }
            playPoint() {
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(587.33, this.ctx.currentTime); // D5
                osc.frequency.setValueAtTime(880, this.ctx.currentTime + 0.08); // A5
                gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.001, this.ctx.currentTime + 0.2);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.2);
            }
            playWinner() {
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const notes = [523.25, 659.25, 783.99, 987.77, 1046.50]; // C5, E5, G5, B5, C6
                notes.forEach((f, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(f, now + idx * 0.1);
                    gain.gain.setValueAtTime(0, now + idx * 0.1);
                    gain.gain.linearRampToValueAtTime(0.1, now + idx * 0.1 + 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.6);
                    osc.start(now + idx * 0.1);
                    osc.stop(now + idx * 0.1 + 0.6);
                });
            }
        }
        const sfx = new SoundSynth();
    </script>

        // Unique HSL background color system for participant buttons
        const colorPalette = [
            'linear-gradient(135deg, #ef4444, #b91c1c)', // Red
            'linear-gradient(135deg, #3b82f6, #1d4ed8)', // Blue
            'linear-gradient(135deg, #10b981, #047857)', // Green
            'linear-gradient(135deg, #f59e0b, #b45309)', // Amber
            'linear-gradient(135deg, #8b5cf6, #6d28d9)', // Purple
            'linear-gradient(135deg, #ec4899, #be185d)', // Pink
            'linear-gradient(135deg, #06b6d4, #0891b2)', // Cyan
            'linear-gradient(135deg, #f97316, #c2410c)'  // Orange
        ];

        function handleInput(event) {
            if (event.key === 'Enter') {
                if (event.isComposing) return; // Prevent duplicates in macOS IME
                addPlayer();
            }
        }

        function addPlayer() {
            const input = document.getElementById('name-input');
            const val = input.value.trim();
            if (!val) return;

            sfx.playClick();
            // Allow multiple names split by comma or spaces
            const names = val.split(/[,，\s]+/).filter(x => x.trim().length > 0);
            names.forEach(n => {
                const uniqueName = n.trim();
                if (uniqueName && !players.includes(uniqueName)) {
                    players.push(uniqueName);
                    scores[uniqueName] = 0;
                }
            });

            input.value = '';
            renderPlayers();
        }

        function renderPlayers() {
            const list = document.getElementById('player-list');
            list.innerHTML = players.map((p, i) => `
                <div class="player-tag">
                    <span>${p}</span>
                    <button onclick="removePlayer(${i}, '${p}')"><i class="ri-close-line"></i></button>
                </div>
            `).join('');
        }

        function removePlayer(idx, name) {
            sfx.playClick();
            players.splice(idx, 1);
            delete scores[name];
            renderPlayers();
        }

        function startGame() {
            if (players.length < 2) {
                gameAlert('최소 2명 이상의 플레이어가 필요합니다!');
                return;
            }
            sfx.playClick();
            // Shuffle mission indices
            for (let i = missions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [missions[i], missions[j]] = [missions[j], missions[i]];
            }
            missionIdx = 0;

            document.getElementById('setup').style.display = 'none';
            document.getElementById('win-overlay'); // Warm up
            document.getElementById('mission-screen').style.display = 'flex';
            
            renderClaimButtons();
            nextMission();
        }

        function renderClaimButtons() {
            const grid = document.getElementById('btn-grid');
            grid.innerHTML = players.map((p, i) => `
                <button class="claim-btn" style="background: ${colorPalette[i % colorPalette.length]}" onclick="claim(event, '${p}')">
                    ${p}
                </button>
            `).join('');
        }

        function nextMission() {
            sfx.playClick();
            if (missionIdx >= missions.length) {
                // Wrap around and reshuffle
                missionIdx = 0;
                for (let i = missions.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [missions[i], missions[j]] = [missions[j], missions[i]];
                }
            }

            const m = missions[missionIdx++];
            
            // Animation trigger
            const card = document.getElementById('mission-card');
            card.style.animation = 'none';
            card.offsetHeight; /* trigger reflow */
            card.style.animation = null;

            document.getElementById('mission-text').textContent = m.text;
            document.getElementById('mission-hint').textContent = m.hint;
        }

        function claim(event, name) {
            sfx.playPoint();
            scores[name]++;
            
            const btn = event.currentTarget;
            btn.style.transform = 'scale(1.15)';
            setTimeout(() => {
                btn.style.transform = '';
            }, 250);

            nextMission();
        }

        function endGame() {
            sfx.playWinner();
            document.getElementById('mission-screen').style.display = 'none';
            document.getElementById('scoreboard').style.display = 'flex';

            const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
            const finalScores = document.getElementById('final-scores');
            
            finalScores.innerHTML = sorted.map(([n, s], i) => {
                const isWinner = i === 0 && s > 0;
                return `
                    <div class="score-row ${isWinner ? 'winner' : ''}" style="animation-delay: ${i * 0.1}s">
                        <span>${isWinner ? '👑 ' : ''}${n}</span>
                        <span class="pts">${s}점</span>
                    </div>
                `;
            }).join('');
        }
    </script>
