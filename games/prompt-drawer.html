<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>AI 프롬프트 서랍 - 미니게임 천국</title>
    <meta name="description" content="빈칸만 채워서 복사하면 되는 AI 이미지·연말 회고·새해 계획 프롬프트 모음">
    <link rel="stylesheet" href="../styles/pretendard.css?v=c17883c9">
    <link rel="stylesheet" href="../styles/design-system.css?v=d12c2b80">
    <link rel="stylesheet" href="../styles/game-common.css?v=2187f848">
    <script src="../scripts/game-common.js?v=efdc1560"></script>
    <style>
        :root {
            /* 이 페이지만의 연말 포인트 색 */
            --season: #c2410c;
            --season-soft: #fff1e6;
        }

        body {
            padding-top: max(2rem, env(safe-area-inset-top));
            padding-bottom: max(5rem, env(safe-area-inset-bottom));
        }

        @media (max-width: 768px) {
            body {
                padding-left: max(1rem, env(safe-area-inset-left));
                padding-right: max(1rem, env(safe-area-inset-right));
                padding-top: max(1rem, env(safe-area-inset-top));
            }
        }

        .drawer {
            max-width: 920px;
            margin: 0 auto;
        }

        .drawer .game-header {
            margin-bottom: 1.25rem;
        }

        /* ── 시즌 배너 ── */
        .season {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 14px 16px;
            margin-bottom: 1rem;
            border-radius: var(--r-lg);
            background: var(--season-soft);
            color: var(--text);
        }

        .season[hidden] {
            display: none;
        }

        .season-icon {
            font-size: 1.8rem;
            line-height: 1;
        }

        .season strong {
            display: block;
            color: var(--season);
            font-size: 1rem;
            margin-bottom: 2px;
        }

        .season p {
            margin: 0;
            font-size: .9rem;
            color: var(--text-2);
            line-height: 1.45;
        }

        /* ── 검색·분류 ── */
        .toolbar {
            position: sticky;
            top: 0;
            z-index: 5;
            padding: 8px 0 10px;
            margin-bottom: 6px;
            background: var(--bg);
        }

        .search {
            width: 100%;
            padding: 12px 14px;
            font-size: 1rem;
            border: 1px solid var(--line-strong);
            border-radius: var(--r-md);
            background: var(--surface);
            color: var(--text);
        }

        .chips {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            overflow-x: auto;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .chips::-webkit-scrollbar {
            display: none;
        }

        .chip {
            flex: none;
            padding: 8px 14px;
            border: 1px solid var(--line);
            border-radius: var(--r-pill);
            background: var(--surface);
            color: var(--text-2);
            font-size: .9rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }

        .chip[aria-pressed="true"] {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--on-accent);
        }

        .chip .count {
            margin-left: 4px;
            font-weight: 600;
            opacity: .7;
        }

        /* ── 카드 목록 ── */
        .list {
            display: grid;
            grid-template-columns: 1fr;
            gap: var(--gap-md);
        }

        @media (min-width: 680px) {
            .list {
                grid-template-columns: 1fr 1fr;
            }
        }

        .card {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 16px;
            border: 1px solid var(--line);
            border-radius: var(--r-lg);
            background: var(--surface);
            box-shadow: var(--shadow-sm);
            cursor: pointer;
            text-align: left;
            transition: transform .15s ease, box-shadow .15s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .card-top {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .card-emoji {
            font-size: 1.5rem;
            line-height: 1;
            margin-right: 4px;
        }

        .tag {
            padding: 3px 8px;
            border-radius: var(--r-sm);
            background: var(--surface-2);
            color: var(--text-2);
            font-size: .75rem;
            font-weight: 700;
        }

        .tag.new {
            background: var(--season);
            color: #fff;
        }

        .card h2 {
            margin: 0;
            font-size: 1.08rem;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -0.01em;
        }

        .card .desc {
            margin: 0;
            font-size: .9rem;
            color: var(--text-2);
            line-height: 1.45;
        }

        .card .peek {
            margin: 0;
            padding: 10px 12px;
            border-radius: var(--r-md);
            background: var(--surface-2);
            color: var(--muted);
            font-size: .85rem;
            line-height: 1.5;
        }

        /* 줄 자르기는 안쪽 글자에 건다. 패딩이 있는 상자에 걸면 4번째 줄이 패딩 안으로 비쳐 보인다 */
        .card .peek > span {
            white-space: pre-line;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-actions {
            display: flex;
            gap: 8px;
            margin-top: auto;
            padding-top: 4px;
        }

        .btn {
            flex: 1;
            padding: 11px 12px;
            border: none;
            border-radius: var(--r-md);
            font-size: .95rem;
            font-weight: 800;
            cursor: pointer;
        }

        .btn-primary {
            background: var(--accent);
            color: var(--on-accent);
        }

        .btn-ghost {
            background: var(--surface-2);
            color: var(--text);
        }

        .btn:active {
            transform: scale(.98);
        }

        .credit {
            font-size: .8rem;
            color: var(--muted);
        }

        mark.hole,
        mark.fill {
            padding: 0 3px;
            border-radius: 5px;
            font-weight: 700;
        }

        mark.hole {
            background: var(--accent-soft);
            color: var(--accent-ink);
        }

        mark.fill {
            background: var(--ok-soft);
            color: var(--ok);
        }

        .empty {
            padding: 40px 16px;
            text-align: center;
            color: var(--muted);
        }

        /* ── 제안하기 ── */
        .suggest {
            margin-top: 1.75rem;
            padding: 18px;
            border: 1px dashed var(--line-strong);
            border-radius: var(--r-lg);
            background: var(--surface);
            text-align: center;
        }

        .suggest[hidden] {
            display: none;
        }

        .suggest h3 {
            margin: 0 0 6px;
            font-size: 1.05rem;
        }

        .suggest p {
            margin: 0 0 14px;
            font-size: .9rem;
            color: var(--text-2);
            line-height: 1.5;
        }

        .suggest .btn {
            max-width: 280px;
            width: 100%;
        }

        .footnote {
            margin-top: 1.25rem;
            font-size: .8rem;
            color: var(--muted);
            text-align: center;
            line-height: 1.5;
        }

        /* ── 빈칸 채우기 시트 ── */
        .sheet-backdrop {
            position: fixed;
            inset: 0;
            z-index: 10000;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            background: var(--scrim);
        }

        .sheet-backdrop[hidden] {
            display: none;
        }

        .sheet {
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            max-height: 90dvh;
            display: flex;
            flex-direction: column;
            border-radius: var(--r-lg) var(--r-lg) 0 0;
            background: #ffffff;
            box-shadow: var(--shadow-lg);
            animation: sheet-up .22s ease-out;
        }

        @media (min-width: 680px) {
            .sheet-backdrop {
                align-items: center;
                padding: 24px;
            }

            .sheet {
                border-radius: var(--r-lg);
            }
        }

        @keyframes sheet-up {
            from {
                transform: translateY(24px);
                opacity: 0;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .sheet {
                animation: none;
            }

            .card {
                transition: none;
            }
        }

        .sheet-head {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 18px 18px 10px;
        }

        .sheet-head h2 {
            margin: 0;
            font-size: 1.2rem;
            font-weight: 800;
        }

        .sheet-head .desc {
            margin: 4px 0 0;
            font-size: .9rem;
            color: var(--text-2);
        }

        .sheet-close {
            margin-left: auto;
            flex: none;
            width: 36px;
            height: 36px;
            border: none;
            border-radius: var(--r-pill);
            background: var(--surface-2);
            color: var(--text);
            font-size: 1.1rem;
            cursor: pointer;
        }

        .sheet-body {
            padding: 0 18px 12px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .sheet-tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .tip {
            margin: 0 0 14px;
            padding: 10px 12px;
            border-radius: var(--r-md);
            background: var(--warn-soft);
            color: var(--text);
            font-size: .88rem;
            line-height: 1.5;
        }

        .fields {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
        }

        .field label {
            display: block;
            margin-bottom: 5px;
            font-size: .88rem;
            font-weight: 800;
            color: var(--text);
        }

        .field input,
        .field textarea {
            width: 100%;
            padding: 11px 12px;
            font-size: 1rem;
            border: 1px solid var(--line-strong);
            border-radius: var(--r-md);
            background: var(--surface-2);
            color: var(--text);
            resize: vertical;
        }

        .field textarea {
            min-height: 92px;
            line-height: 1.45;
        }

        .preview-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            font-size: .88rem;
            font-weight: 800;
        }

        .preview-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .preview-label button {
            border: none;
            background: none;
            color: var(--accent-ink);
            font-size: .82rem;
            font-weight: 700;
            cursor: pointer;
            padding: 3px 6px;
            border-radius: 6px;
            transition: background .15s;
        }

        .preview-label button:hover {
            background: var(--surface-3);
        }

        .preview {
            margin: 0;
            padding: 14px;
            border: 1px solid var(--line);
            border-radius: var(--r-md);
            background: var(--surface-2);
            font-size: .92rem;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: keep-all;
            overflow-wrap: anywhere;
            user-select: text;
            -webkit-user-select: text;
        }

        .sheet-foot {
            display: flex;
            gap: 8px;
            padding: 12px 18px max(16px, env(safe-area-inset-bottom));
            border-top: 1px solid var(--line);
        }

        .sheet-foot .btn-ghost {
            flex: 1;
            padding: 10px 6px;
            font-size: .88rem;
            white-space: nowrap;
        }

        .sheet-foot .btn-primary {
            flex: 1.6;
        }

        /* ── 알림 ── */
        .toast {
            position: fixed;
            left: 50%;
            bottom: max(24px, env(safe-area-inset-bottom));
            z-index: 10001;
            transform: translate(-50%, 20px);
            padding: 12px 18px;
            border-radius: var(--r-pill);
            background: var(--text);
            color: var(--bg);
            font-size: .92rem;
            font-weight: 700;
            opacity: 0;
            pointer-events: none;
            transition: opacity .2s ease, transform .2s ease;
            max-width: calc(100vw - 32px);
            text-align: center;
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }
    </style>
</head>

<body>
    <div class="drawer">
        <a href="../index.html" class="back-button">← 메인</a>

        <header class="game-header">
            <h1 class="game-title">🗂️ AI 프롬프트 서랍</h1>
            <p class="game-description">빈칸만 채워서 복사하고, AI에 붙여 넣으세요</p>
        </header>

        <section class="season" id="season" hidden>
            <div class="season-icon" aria-hidden="true">🎄</div>
            <div>
                <strong id="season-title"></strong>
                <p id="season-text"></p>
            </div>
        </section>

        <div class="toolbar">
            <input class="search" id="search" type="search" placeholder="찾기: 카드, 회고, 반려동물…" aria-label="프롬프트 찾기" autocomplete="off">
            <div class="chips" id="chips" role="group" aria-label="분류"></div>
        </div>

        <main class="list" id="list" aria-live="polite"></main>

        <section class="suggest" id="suggest" hidden>
            <h3>💡 나만 알기 아까운 프롬프트가 있나요?</h3>
            <p>메일로 보내 주시면 살펴보고 서랍에 넣어 둘게요.<br>닉네임을 적어 주시면 카드에 함께 표시해 드려요.</p>
            <button class="btn btn-primary" id="suggest-btn" type="button">✉️ 프롬프트 제안하기</button>
        </section>

        <p class="footnote">입력한 내용은 이 기기에만 저장되고 어디에도 보내지 않아요.<br>개인정보(주민번호·카드번호·주소 등)는 AI에 넣지 마세요.</p>
    </div>

    <div class="sheet-backdrop" id="sheet-backdrop" hidden>
        <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
            <div class="sheet-head">
                <div class="card-emoji" id="sheet-emoji" aria-hidden="true"></div>
                <div>
                    <h2 id="sheet-title"></h2>
                    <p class="desc" id="sheet-desc"></p>
                </div>
                <button class="sheet-close" id="sheet-close" type="button" aria-label="닫기">✕</button>
            </div>
            <div class="sheet-body">
                <div class="sheet-tags" id="sheet-tags"></div>
                <p class="tip" id="sheet-tip" hidden></p>
                <div class="fields" id="fields"></div>
                <div class="preview-label">
                    <span>완성된 프롬프트</span>
                    <div class="preview-actions">
                        <button type="button" id="fill-sample-btn" title="기본 예시값으로 빈칸을 채웁니다">🎲 예시 채우기</button>
                        <button type="button" id="reset-btn">비우기</button>
                    </div>
                </div>
                <pre class="preview" id="preview"></pre>
            </div>
            <div class="sheet-foot">
                <button class="btn btn-ghost" id="share-btn" type="button">🔗 링크</button>
                <button class="btn btn-ghost" id="chatgpt-btn" type="button" title="프롬프트 복사 후 ChatGPT 바로 열기">🤖 ChatGPT</button>
                <button class="btn btn-primary" id="copy-btn" type="button">📋 복사하기</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
        // ════════════════════════════════════════════════════════════
        //  ✏️ 여기만 고치면 돼요
        // ════════════════════════════════════════════════════════════

        // 제안 메일 주소. ['아이디', '도메인'] 으로 나눠 적어요 (예: ['prompt.box', 'gmail.com']).
        // 비워 두면 '프롬프트 제안하기' 칸이 숨겨져요.
        const SUGGEST_EMAIL = ['', ''];

        // 맨 위 시즌 배너. 시즌이 끝나면 title을 ''로 비우면 사라져요.
        const SEASON = {
            title: '✨ 실전 킬러 프롬프트 & 연말연시 컬렉션',
            text: '업무 치트키부터 모임·술자리, 이미지 생성, 연말연시 계획까지. 빈칸만 채우면 바로 쓸 수 있어요.'
        };

        // 분류. 프롬프트의 cat 값과 id가 맞아야 해요.
        const CATEGORIES = [
            { id: 'work', label: '💼 일잘러·업무' },
            { id: 'party', label: '🎉 모임·파티' },
            { id: 'image', label: '🎨 이미지 생성' },
            { id: 'life', label: '🌱 일상·라이프' },
            { id: 'retro', label: '📝 올해 회고' },
            { id: 'greeting', label: '💌 연말 인사' },
            { id: 'plan', label: '🗓️ 새해 계획' }
        ];

        // ── 프롬프트 목록 ─────────────────────────────────────────
        // 새 프롬프트는 아래 형식으로 PROMPTS 배열에 하나 더 넣으면 돼요. (순서 상관없음, 최신 date가 위로)
        //
        //   {
        //       id: 'my-prompt',        // 영문 소문자-하이픈. 공유 링크(#p=my-prompt)에 쓰이니 한번 정하면 바꾸지 마세요
        //       cat: 'image',           // CATEGORIES의 id
        //       kind: 'image',          // 'image' = 이미지 생성 AI / 'chat' = 대화형 AI
        //       attach: true,           // (선택) 사진을 같이 올려야 하면 true
        //       emoji: '🎄',
        //       title: '카드 제목',
        //       desc: '한 줄 설명',
        //       tip: '(선택) 쓰기 전에 알아 둘 점',
        //       by: '(선택) 제안해 준 사람 닉네임',
        //       date: '2026-11-12',     // 추가한 날. 7일 동안 NEW 표시
        //       prompt: `여러 줄 프롬프트.
        //   빈칸은 {{항목 이름}} 또는 {{항목 이름|예시}} 로 적어요.
        //   같은 항목 이름을 여러 번 쓰면 한 번만 입력해도 전부 채워져요.
        //   예시에 줄바꿈이 있으면 여러 줄 입력칸이 나와요.`
        //   },
        const PROMPTS = [
            // 💼 일잘러·업무
            {
                id: 'business-refusal-mail', cat: 'work', kind: 'chat', emoji: '✉️',
                title: '정중하지만 단호한 거절·연기 메일',
                desc: '부탁, 납기 연장, 일정 변경을 상대 기분 상하지 않게 완곡한 비즈니스 어투로',
                tip: '상대방과의 관계와 원하는 해결책(대안)을 구체적으로 적을수록 자연스러워요.',
                date: '2026-11-13',
                prompt: `직장에서 비즈니스 메일이나 메신저로 보낼 정중하지만 확실한 메시지를 작성해 줘.

- 수신자: {{받는 분(직급/관계)|김 부장님}}
- 내가 처한 상황: {{현재 상황 및 이유|연말 결산 프로젝트 마감이 겹쳐 이번 주 내로 추가 보고서를 작성하기 어렵습니다.}}
- 전하고 싶은 핵심 요점: {{전하고 싶은 결론|이번 요청은 기한 내 수용이 어려우며, 일정 조정이나 업무 분담이 필요합니다.}}

조건:

1. 사람마다 상 이름 하나씩 (웃기지만 상처받지 않게, 칭찬 한 스푼 넣어서)

            {
                id: 'secret-santa-gift', cat: 'party', kind: 'chat', emoji: '🎁',
                title: '마니또 선물 고르기',
                desc: '예산과 상대 정보로 부담 없는 선물 후보와 쪽지 문구',
                date: '2026-11-12',
                prompt: `마니또(시크릿 산타) 선물을 고르고 있어.
- 예산: {{예산|3만 원 이하}}
- 상대에 대해 아는 것: {{상대 특징|요즘 러닝 시작함, 커피 좋아함, 자취 2년 차}}
- 상대와 친한 정도: {{친한 정도|같은 팀이지만 아직 조금 어색함}}

1. 선물 후보 7개 (예상 가격, 어떤 곳에서 살 수 있는지, 왜 이 사람에게 맞는지)
2. 너무 사적이거나 받기 부담스러운 선물은 빼 줘
3. 선물에 붙일, 정체를 숨긴 쪽지 문구 3개`

        // ════════════════════════════════════════════════════════════
        //  아래부터는 화면 동작 코드예요
        // ════════════════════════════════════════════════════════════

        const KIND_LABEL = { chat: '💬 대화형 AI', image: '🎨 이미지 생성 AI' };
        const STORE_KEY = 'prompt-drawer:values';
        const HOLE_RE = /\{\{([^}|]+?)(?:\|([^}]*))?\}\}/g;

        const $ = (id) => document.getElementById(id);
        const esc = (v) => (typeof escapeHtml === 'function' ? escapeHtml(v) : String(v ?? '').replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`));

        const state = { cat: 'all', query: '', openId: null, lastFocus: null };
        let saved = loadSaved();

        function loadSaved() {
            try { return JSON.parse(localStorage.getItem(STORE_KEY) || '{}') || {}; } catch { return {}; }
        }

        function persist() {
            try { localStorage.setItem(STORE_KEY, JSON.stringify(saved)); } catch { /* 저장 못 해도 그냥 쓴다 */ }
        }

        // 프롬프트 안의 빈칸 목록 (같은 이름은 한 번만)
        function holesOf(prompt) {
            const map = new Map();
            for (const m of prompt.matchAll(HOLE_RE)) {
                const label = m[1].trim();
                const hint = (m[2] || '').trim();
                if (!map.has(label)) map.set(label, hint);
                else if (!map.get(label) && hint) map.set(label, hint);
            }
            return [...map].map(([label, hint]) => ({ label, hint }));
        }

        // 복사용 글자. 비어 있는 빈칸은 [항목 이름]으로 남겨 AI 창에서 채울 수 있게 한다
        function fillText(prompt, values = {}) {
            return prompt.replace(HOLE_RE, (_, label) => {
                const v = (values[label.trim()] || '').trim();
                return v || `[${label.trim()}]`;
            });
        }

        // 화면용 HTML. 채운 칸은 초록, 빈 칸은 보라로 표시한다
        function markedHtml(prompt, values = {}) {
            let out = '';
            let last = 0;
            for (const m of prompt.matchAll(HOLE_RE)) {
                out += esc(prompt.slice(last, m.index));
                const label = m[1].trim();
                const v = (values[label] || '').trim();
                out += v ? `<mark class="fill">${esc(v)}</mark>` : `<mark class="hole">[${esc(label)}]</mark>`;
                last = m.index + m[0].length;
            }
            return out + esc(prompt.slice(last));
        }

        function daysSince(dateStr) {
            const d = new Date(`${dateStr}T00:00:00`);
            if (Number.isNaN(d.getTime())) return Infinity;
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            return Math.round((today - d) / 86400000);
        }

        const isNew = (p) => { const n = daysSince(p.date); return n >= 0 && n <= 7; };

        // 최신 날짜가 위로, 같은 날이면 적은 순서대로
        const ordered = PROMPTS
            .map((p, i) => ({ p, i }))
            .sort((a, b) => (b.p.date || '').localeCompare(a.p.date || '') || a.i - b.i)
            .map(({ p }) => p);

        function matches(p) {
            if (state.cat !== 'all' && p.cat !== state.cat) return false;
            if (!state.query) return true;
            const hay = [p.title, p.desc, p.prompt, p.tip, KIND_LABEL[p.kind], CATEGORIES.find((c) => c.id === p.cat)?.label]
                .join(' ').toLowerCase();
            return state.query.toLowerCase().split(/\s+/).filter(Boolean).every((w) => hay.includes(w));
        }

        function tagsHtml(p) {
            const tags = [];
            if (isNew(p)) tags.push('<span class="tag new">NEW</span>');
            if (KIND_LABEL[p.kind]) tags.push(`<span class="tag">${KIND_LABEL[p.kind]}</span>`);
            if (p.attach) tags.push('<span class="tag">📎 사진 첨부</span>');
            return tags.join('');
        }

        function renderChips() {
            const all = [{ id: 'all', label: '전체' }, ...CATEGORIES];
            $('chips').innerHTML = all.map((c) => {
                const n = c.id === 'all' ? PROMPTS.length : PROMPTS.filter((p) => p.cat === c.id).length;
                if (!n) return '';
                return `<button type="button" class="chip" data-cat="${esc(c.id)}" aria-pressed="${state.cat === c.id}">${esc(c.label)}<span class="count">${n}</span></button>`;
            }).join('');
        }

        function renderList() {
            const items = ordered.filter(matches);
            if (!items.length) {
                $('list').innerHTML = '<p class="empty">찾는 프롬프트가 없어요 🥲<br>다른 말로 찾아보세요.</p>';
                return;
            }
            $('list').innerHTML = items.map((p) => {
                const hasHoles = holesOf(p.prompt).length > 0;
                return `
                <article class="card" data-id="${esc(p.id)}" tabindex="0" aria-label="${esc(p.title)} 열기">
                    <div class="card-top"><span class="card-emoji" aria-hidden="true">${esc(p.emoji || '✨')}</span>${tagsHtml(p)}</div>
                    <h2>${esc(p.title)}</h2>
                    <p class="desc">${esc(p.desc || '')}</p>
                    <p class="peek"><span>${markedHtml(p.prompt, saved[p.id])}</span></p>
                    ${p.by ? `<span class="credit">💡 제안: ${esc(p.by)}</span>` : ''}
                    <div class="card-actions">
                        <button type="button" class="btn btn-primary" data-act="open">${hasHoles ? '✏️ 빈칸 채우기' : '👀 자세히'}</button>
                        <button type="button" class="btn btn-ghost" data-act="copy">📋 바로 복사</button>
                    </div>
                </article>`;
            }).join('');
        }

        // ── 시트 ──
        function openSheet(id, { updateHash = true } = {}) {
            const p = PROMPTS.find((x) => x.id === id);
            if (!p) return;
            state.openId = id;
            state.lastFocus = document.activeElement;
            const values = saved[id] || {};

            $('sheet-emoji').textContent = p.emoji || '✨';
            $('sheet-title').textContent = p.title;
            $('sheet-desc').textContent = p.desc || '';
            $('sheet-tags').innerHTML = tagsHtml(p) + (p.by ? `<span class="tag">💡 ${esc(p.by)}</span>` : '');
            $('sheet-tip').hidden = !p.tip;
            $('sheet-tip').textContent = p.tip ? `💡 ${p.tip}` : '';

            const holes = holesOf(p.prompt);
            $('fields').innerHTML = holes.map((h, i) => {
                const fid = `f-${i}`;
                const multi = h.hint.includes('\n');
                const ph = h.hint ? `예) ${h.hint}` : '';
                const val = values[h.label] || '';
                const input = multi
                    ? `<textarea id="${fid}" data-label="${esc(h.label)}" placeholder="${esc(ph)}">${esc(val)}</textarea>`
                    : `<input id="${fid}" data-label="${esc(h.label)}" placeholder="${esc(ph)}" value="${esc(val)}" autocomplete="off">`;
                return `<div class="field"><label for="${fid}">${esc(h.label)}</label>${input}</div>`;
            }).join('');
            $('fields').hidden = holes.length === 0;
            $('reset-btn').hidden = holes.length === 0;
            $('fill-sample-btn').hidden = holes.length === 0;

            updatePreview();
            $('sheet-backdrop').hidden = false;
            document.body.style.overflow = 'hidden';
            if (updateHash) history.replaceState(null, '', `#p=${encodeURIComponent(id)}`);
            const first = $('fields').querySelector('input, textarea');
            // 모바일에서 열자마자 키보드가 시트를 가리지 않도록 데스크톱에서만 첫 칸에 초점
            (first && matchMedia('(pointer: fine)').matches ? first : $('sheet-close')).focus();
        }

        function closeSheet() {
            if (!state.openId) return;
            state.openId = null;
            $('sheet-backdrop').hidden = true;
            document.body.style.overflow = '';
            history.replaceState(null, '', location.pathname + location.search);
            renderList();
            const back = state.lastFocus && document.contains(state.lastFocus) ? state.lastFocus : null;
            back?.focus?.();
        }

        function currentValues() {
            const values = {};
            $('fields').querySelectorAll('[data-label]').forEach((el) => { values[el.dataset.label] = el.value; });
            return values;
        }

        function updatePreview() {
            const p = PROMPTS.find((x) => x.id === state.openId);
            if (!p) return;
            $('preview').innerHTML = markedHtml(p.prompt, currentValues());
        }

        // ── 복사·공유 ──
        async function copyText(text) {
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                    return true;
                }
            } catch { /* 아래 방식으로 다시 시도 */ }
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.setAttribute('readonly', '');
            ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
            document.body.appendChild(ta);
            ta.select();
            ta.setSelectionRange(0, text.length);
            let ok = false;
            try { ok = document.execCommand('copy'); } catch { ok = false; }
            ta.remove();
            return ok;
        }

        function buzz() {
            if ('vibrate' in navigator) { try { navigator.vibrate(15); } catch { /* 무시 */ } }
        }

        let toastTimer = null;
        function toast(msg) {
            const el = $('toast');
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
        }

        async function copyPrompt(id, values) {
            const p = PROMPTS.find((x) => x.id === id);
            if (!p) return;
            const text = fillText(p.prompt, values);
            const ok = await copyText(text);
            if (ok) {
                buzz();
                const left = holesOf(p.prompt).filter((h) => !(values?.[h.label] || '').trim()).length;
                toast(left ? `복사했어요! [ ] 칸 ${left}개는 AI 창에서 채워 주세요` : '복사했어요! AI 창에 붙여 넣으세요');
            } else if (state.openId === id) {
                // 인앱 브라우저 등에서 복사가 막히면 미리보기를 선택해 두고 길게 눌러 복사하게 한다
                const range = document.createRange();
                range.selectNodeContents($('preview'));
                const sel = getSelection();
                sel.removeAllRanges();
                sel.addRange(range);
                toast('자동 복사가 막혀 있어요. 선택된 글을 길게 눌러 복사해 주세요');
            } else {
                openSheet(id);
                toast('자동 복사가 막혀 있어요. 아래 글을 길게 눌러 복사해 주세요');
            }
        }

        async function sharePrompt(id) {
            const p = PROMPTS.find((x) => x.id === id);
            if (!p) return;
            const url = `${location.origin}${location.pathname}#p=${encodeURIComponent(id)}`;
            if (navigator.share) {
                try {
                    await navigator.share({ title: `${p.emoji || ''} ${p.title}`.trim(), text: p.desc || 'AI 프롬프트 서랍', url });
                    return;
                } catch (e) {
                    if (e && e.name === 'AbortError') return;
                }
            }
            if (await copyText(url)) { buzz(); toast('링크를 복사했어요'); } else { toast(url); }
        }

        // ── 제안 메일 ──
        function suggestAddress() {
            const [user, domain] = SUGGEST_EMAIL;
            return user && domain ? `${user}@${domain}` : '';
        }

        function openSuggestMail() {
            const to = suggestAddress();
            if (!to) return;
            const subject = '[프롬프트 서랍] 프롬프트 제안';
            const body = [
                '아래 칸을 채워서 보내 주세요. (비워 둬도 괜찮아요)',
                '',
                '■ 제목:',
                '■ 분류: 이미지 / 올해 회고 / 연말 인사 / 새해 계획 / 모임·파티 / 기타',
                '■ 어떤 AI에 썼나요: 대화형 / 이미지 생성',
                '■ 사진 첨부가 필요한가요: 예 / 아니오',
                '■ 프롬프트:',
                '',
                '',
                '■ 써 보니 어땠나요 (선택):',
                '■ 카드에 표시할 닉네임 (선택):',
                ''
            ].join('\n');
            location.href = `mailto:${to}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
        }

        // ── 연결 ──
        function openFromHash() {
            const m = location.hash.match(/^#p=([a-z0-9-]+)/i);
            if (m && PROMPTS.some((p) => p.id === m[1])) openSheet(m[1], { updateHash: false });
        }

        function init() {
            if (SEASON.title) {
                $('season-title').textContent = SEASON.title;
                $('season-text').textContent = SEASON.text || '';
                $('season').hidden = false;
            }
            $('suggest').hidden = !suggestAddress();

            renderChips();
            renderList();

            $('chips').addEventListener('click', (e) => {
                const btn = e.target.closest('.chip');
                if (!btn) return;
                state.cat = btn.dataset.cat;
                renderChips();
                renderList();
            });

            $('search').addEventListener('input', (e) => {
                state.query = e.target.value.trim();
                renderList();
            });

            $('list').addEventListener('click', (e) => {
                const card = e.target.closest('.card');
                if (!card) return;
                const act = e.target.closest('[data-act]')?.dataset.act;
                if (act === 'copy') copyPrompt(card.dataset.id, saved[card.dataset.id]);
                else openSheet(card.dataset.id);
            });

            $('list').addEventListener('keydown', (e) => {
                if (e.target.classList?.contains('card') && (e.key === 'Enter' || e.key === ' ')) {
                    e.preventDefault();
                    openSheet(e.target.dataset.id);
                }
            });

            $('fields').addEventListener('input', () => {
                if (!state.openId) return;
                saved[state.openId] = currentValues();
                persist();
                updatePreview();
            });

            $('fill-sample-btn').addEventListener('click', () => {
                if (!state.openId) return;
                const p = PROMPTS.find((x) => x.id === state.openId);
                if (!p) return;
                const holes = holesOf(p.prompt);
                const inputs = $('fields').querySelectorAll('[data-label]');
                holes.forEach((h) => {
                    for (const inp of inputs) {
                        if (inp.dataset.label === h.label && h.hint) {
                            inp.value = h.hint;
                            break;
                        }
                    }
                });
                saved[state.openId] = currentValues();
                persist();
                updatePreview();
                buzz();
                toast('🎲 예시값으로 모두 채웠어요!');
            });

            $('reset-btn').addEventListener('click', () => {
                if (!state.openId) return;
                $('fields').querySelectorAll('[data-label]').forEach((el) => { el.value = ''; });
                delete saved[state.openId];
                persist();
                updatePreview();
                buzz();
                toast('빈칸을 모두 비웠어요');
            });

            $('copy-btn').addEventListener('click', () => copyPrompt(state.openId, currentValues()));
            $('share-btn').addEventListener('click', () => sharePrompt(state.openId));

            $('chatgpt-btn').addEventListener('click', async () => {
                if (!state.openId) return;
                const p = PROMPTS.find((x) => x.id === state.openId);
                if (!p) return;
                const text = fillText(p.prompt, currentValues());
                await copyText(text);
                buzz();
                toast('복사 완료! ChatGPT로 이동합니다 🚀');
                const targetUrl = 'https://chatgpt.com/?q=' + encodeURIComponent(text);
                setTimeout(() => {
                    window.open(targetUrl, '_blank', 'noopener,noreferrer');
                }, 350);
            });
            $('sheet-close').addEventListener('click', closeSheet);
            $('sheet-backdrop').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeSheet(); });
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && state.openId) closeSheet(); });
            $('suggest-btn').addEventListener('click', openSuggestMail);
            window.addEventListener('hashchange', openFromHash);

            openFromHash();
        }

        init();
    </script>
