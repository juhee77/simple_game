<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>무작위 순서 정하기 - 미니게임 천국</title>
    <link rel="stylesheet" href="../styles/game-common.css?v=bed20c1e">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        .input-section {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .mode-toggle-container {
            display: flex;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 50px;
            padding: 0.25rem;
            margin-bottom: 1.5rem;
        }

        .mode-btn {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-secondary);
            padding: 0.8rem;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mode-btn.active {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
            box-shadow: 0 4px 10px rgba(168, 85, 247, 0.3);
        }

        .textarea-container, .number-input-container {
            position: relative;
            margin-bottom: 1.5rem;
            transition: all 0.3s;
        }

        .name-textarea {
            width: 100%;
            height: 150px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem;
            color: var(--text-primary);
            font-size: 1rem;
            line-height: 1.5;
            resize: none;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .name-textarea:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
        }

        .counter-badge {
            position: absolute;
            bottom: 10px;
            right: 15px;
            background: var(--accent-primary);
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .number-input-wrapper {
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem;
            justify-content: space-between;
        }

        .num-control-btn {
            background: var(--accent-primary);
            border: none;
            color: white;
            font-size: 1.5rem;
            width: 50px;
            height: 50px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s, opacity 0.2s;
        }

        .num-control-btn:active {
            transform: scale(0.95);
        }

        .num-control-btn:hover {
            opacity: 0.9;
        }

        .num-display {
            text-align: center;
            font-weight: 800;
            font-size: 2.5rem;
            color: var(--text-primary);
            width: 100px;
        }

        /* Shuffle Animation Overlay */
        .shuffle-overlay {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            padding: 4rem 2rem;
            background: var(--bg-secondary);
            border: 2px dashed var(--accent-primary);
            border-radius: 20px;
            text-align: center;
            animation: pulse-border 1.5s infinite;
        }

        @keyframes pulse-border {
            0% { border-color: rgba(168, 85, 247, 0.4); }
            50% { border-color: rgba(168, 85, 247, 1); }
            100% { border-color: rgba(168, 85, 247, 0.4); }
        }

        .shuffling-content {
            font-size: 3rem;
            font-weight: 800;
            color: var(--accent-primary);
            height: 80px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            text-shadow: 0 0 20px rgba(168, 85, 247, 0.5);
        }

        /* Results Section */
        .results-section {
            display: none;
            flex-direction: column;
            gap: 1.5rem;
            width: 100%;
        }

        .results-list {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            max-height: 60vh;
            overflow-y: auto;
            padding-right: 0.5rem;
        }

        /* Scrollbar Styling */
        .results-list::-webkit-scrollbar {
            width: 8px;
        }
        .results-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }
        .results-list::-webkit-scrollbar-thumb {
            background: var(--accent-primary);
            border-radius: 4px;
        }

        .result-item {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1rem 1.5rem;
            border-radius: 12px;
            font-weight: 700;
            color: var(--text-primary);
            font-size: 1.2rem;
            animation: slideIn 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
            opacity: 0;
            transform: translateY(20px);
            transition: background 0.2s;
        }

        .result-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* Podium Highlights */
        .result-item.rank-1 {
            background: linear-gradient(90deg, rgba(251, 191, 36, 0.2), rgba(251, 191, 36, 0.05));
            border-color: #fbbf24;
            color: #fbbf24;
            font-size: 1.4rem;
        }
        .result-item.rank-2 {
            background: linear-gradient(90deg, rgba(156, 163, 175, 0.2), rgba(156, 163, 175, 0.05));
            border-color: #9ca3af;
            color: #9ca3af;
        }
        .result-item.rank-3 {
            background: linear-gradient(90deg, rgba(180, 83, 9, 0.2), rgba(180, 83, 9, 0.05));
            border-color: #b45309;
            color: #b45309;
        }

        .rank-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 50%;
            margin-right: 1.5rem;
            font-size: 1.1rem;
            color: white;
            flex-shrink: 0;
        }

        .rank-1 .rank-badge { background: #fbbf24; color: black; box-shadow: 0 0 15px rgba(251, 191, 36, 0.5); }
        .rank-2 .rank-badge { background: #9ca3af; color: black; box-shadow: 0 0 15px rgba(156, 163, 175, 0.5); }
        .rank-3 .rank-badge { background: #b45309; color: white; box-shadow: 0 0 15px rgba(180, 83, 9, 0.5); }

        .item-content {
            flex: 1;
        }

        @keyframes slideIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .action-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }

        .action-buttons button {
            flex: 1;
        }
    </style>
    <script src="../scripts/game-common.js?v=b7c7301f"></script>
</head>

<body>
    <div class="game-container">
        <div class="game-header">
            <a href="../index.html" class="back-button">← 메인으로</a>
            <h1 class="game-title">🔢 무작위 순서 정하기</h1>
            <p class="game-description">이름 명단을 넣거나 참가자 숫자만 입력하면 완벽한 무작위 순위를 만들어 줍니다.</p>
        </div>

        <div class="game-board">
            <!-- INPUT CONFIG -->
            <div id="config-panel" class="input-section">
                
                <div class="mode-toggle-container">
                    <button id="btn-mode-names" class="mode-btn active" onclick="switchMode('names')">📝 이름 직접 입력</button>
                    <button id="btn-mode-numbers" class="mode-btn" onclick="switchMode('numbers')">🔢 숫자로 돌리기</button>
                </div>

                <!-- Name Input Mode -->
                <div id="container-names" class="textarea-container">
                    <div class="filter-title">참가자 이름 (엔터, 쉼표 구분)</div>
                    <textarea id="names-input" class="name-textarea" placeholder="김철수, 이영희, 박민수&#10;정지원&#10;최우진" oninput="updateNameCount()"></textarea>
                    <div id="counter" class="counter-badge">0명</div>
                </div>

                <!-- Number Input Mode -->
                <div id="container-numbers" class="number-input-container" style="display: none;">
                    <div class="filter-title">총 참가자 수 (1번 ~ N번)</div>
                    <div class="number-input-wrapper">
                        <button class="num-control-btn" onclick="adjustNumber(-1)">-</button>
                        <div id="number-display" class="num-display">10</div>
                        <button class="num-control-btn" onclick="adjustNumber(1)">+</button>
                    </div>
                </div>

                <button class="button w-100" style="background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary)); margin-top: 1rem;" onclick="startShuffle()">순서 뽑기 시작! 🚀</button>
            </div>

            <!-- SHUFFLE ANIMATION -->
            <div id="shuffle-panel" class="shuffle-overlay">
                <div class="filter-title" style="color: var(--accent-primary); margin-bottom: 0;">🎲 무작위 셔플 중...</div>
                <div id="shuffle-display" class="shuffling-content">?</div>
                <p class="game-description">순번이 이리저리 뒤섞이고 있습니다. 긴장되는 순간!</p>
            </div>

            <!-- RESULTS -->
            <div id="results-panel" class="results-section">
                <div class="filter-title" style="text-align: center; color: var(--accent-primary); font-size: 1.5rem;">🎉 결과 발표</div>
                <div id="results-list" class="results-list">
                    <!-- Results injected here -->
                </div>

                <div class="action-buttons">
                    <button class="button" style="background: rgba(255,255,255,0.1);" onclick="resetGame()">다시 하기 🔄</button>
                    <button class="button" style="background: linear-gradient(135deg, #10b981, #059669);" onclick="copyToClipboard()">결과 복사하기 📋</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let inputMode = 'names'; // 'names' or 'numbers'
        let participantCount = 10;
        let finalResults = [];

        function switchMode(mode) {
            inputMode = mode;
            document.getElementById('btn-mode-names').classList.toggle('active', mode === 'names');
            document.getElementById('btn-mode-numbers').classList.toggle('active', mode === 'numbers');
            
            document.getElementById('container-names').style.display = mode === 'names' ? 'block' : 'none';
            document.getElementById('container-numbers').style.display = mode === 'numbers' ? 'block' : 'none';
        }

        function adjustNumber(delta) {
            participantCount += delta;
            // Limit between 2 and 100
            if (participantCount < 2) participantCount = 2;
            if (participantCount > 100) participantCount = 100;
            document.getElementById('number-display').textContent = participantCount;
        }

        function parseNames() {
            const val = document.getElementById('names-input').value;
            // 이름 안의 공백이 사라지지 않도록 줄바꿈/쉼표만 구분자로 쓴다.
            return val.split(/[,\n\r]+/)
                .map(n => n.trim())
                .filter(n => n.length > 0);
        }

        function updateNameCount() {
            const names = parseNames();
            document.getElementById('counter').textContent = `${names.length}명`;
        }

        function startShuffle() {
            let pool = [];

            if (inputMode === 'names') {
                pool = parseNames();
                if (pool.length < 2) {
                    gameAlert("순서를 정하려면 최소 2명 이상의 이름을 입력해야 합니다!");
                    return;
                }
            } else {
                for (let i = 1; i <= participantCount; i++) {
                    pool.push(`${i}번`);
                }
            }

            // Hide Config, Show Shuffle
            document.getElementById('config-panel').style.display = 'none';
            const shufflePanel = document.getElementById('shuffle-panel');
            shufflePanel.style.display = 'flex';

            let ticks = 0;
            const maxTicks = 20;
            const shuffleDisplay = document.getElementById('shuffle-display');

            const interval = setInterval(() => {
                const r = Math.floor(Math.random() * pool.length);
                shuffleDisplay.textContent = pool[r];
                ticks++;

                if (ticks >= maxTicks) {
                    clearInterval(interval);
                    generateResults(pool);
                }
            }, 80);
        }

        function generateResults(originalPool) {
            // Fisher-Yates Shuffle
            let shuffled = [...originalPool];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }

            finalResults = shuffled;

            renderResults();

            // Transition
            document.getElementById('shuffle-panel').style.display = 'none';
            document.getElementById('results-panel').style.display = 'flex';
        }

        function renderResults() {
            const listContainer = document.getElementById('results-list');
            listContainer.innerHTML = '';

            finalResults.forEach((item, idx) => {
                const rank = idx + 1;
                const div = document.createElement('div');
                div.className = 'result-item';
                
                // Add podium classes
                if (rank === 1) div.classList.add('rank-1');
                else if (rank === 2) div.classList.add('rank-2');
                else if (rank === 3) div.classList.add('rank-3');

                let icon = `${rank}`;
                if (rank === 1) icon = '🏆';
                else if (rank === 2) icon = '🥈';
                else if (rank === 3) icon = '🥉';

                const badge = document.createElement('div');
                badge.className = 'rank-badge';
                badge.textContent = icon;
                const content = document.createElement('div');
                content.className = 'item-content';
                content.textContent = item;   // 참가자 이름은 HTML로 해석하지 않는다
                div.append(badge, content);
                
                // Staggered animation
                div.style.animationDelay = `${Math.min(idx * 0.05, 1.5)}s`;
                
                listContainer.appendChild(div);
            });
        }

        function resetGame() {
            document.getElementById('results-panel').style.display = 'none';
            document.getElementById('config-panel').style.display = 'block';
        }

        function copyToClipboard() {
            if (finalResults.length === 0) return;

            let text = "🔢 [무작위 순서 정하기 결과]\n\n";
            finalResults.forEach((item, idx) => {
                let prefix = `${idx + 1}위.`;
                if (idx === 0) prefix = "🏆 1위.";
                else if (idx === 1) prefix = "🥈 2위.";
                else if (idx === 2) prefix = "🥉 3위.";
                
                text += `${prefix} ${item}\n`;
            });
            text += "\nGenerated by 미니게임 천국 🎲";

            navigator.clipboard.writeText(text).then(() => {
                gameAlert("결과가 클립보드에 복사되었습니다! 단톡방에 붙여넣어 보세요! 📋");
            }).catch(err => {
                gameAlert("복사에 실패했습니다.");
            });
        }
    </script>
    <script type="application/json" id="game-rules">
{
 "title": "무작위 순서 정하기",
 "goal": "발표 순서나 벌칙 순번을 공정하게 정하세요.",
 "steps": [
  "이름 목록을 붙여넣거나, 참가자 수만 입력합니다(숫자 모드).",
  "이름은 줄바꿈이나 쉼표로 구분합니다. 이름 안의 공백은 그대로 유지됩니다.",
  "순서 뽑기를 누르면 무작위 순위가 정해집니다.",
  "복사 버튼으로 결과를 단톡방에 바로 붙여넣을 수 있습니다."
 ],
 "tips": [
  "1~3위에는 메달이 표시됩니다."
 ],
 "players": "2~100인",
 "time": "약 5분"
}
</script>
</body>

</html>
