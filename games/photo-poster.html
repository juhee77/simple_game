<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>대형 매거진 포스터 & 콜라주 | 미니게임 천국</title>

  <link rel="stylesheet" href="../styles/game-common.css?v=e8b4cc4d">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,800;0,900;1,600&family=Cinzel:wght@700;800;900&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <style>
    :root {
      --bg: #07090e;
      --card-bg: rgba(15, 23, 42, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --pink: #ec4899;
      --cyan: #06b6d4;
      --purple: #6366f1;
      --gold: #d4af37;
      --text-main: #f8fafc;
      --text-dim: #94a3b8;
      --radius-xl: 20px;
      --radius-lg: 14px;
      --radius-md: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: radial-gradient(circle at 50% 0%, #1a162b 0%, #07090e 100%);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', 'Pretendard', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 24px 20px;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      padding-bottom: 8px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .back-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--cyan);
      font-size: 20px;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border-radius: 12px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .back-btn:hover {
      background: rgba(6, 182, 212, 0.15);
      border-color: var(--cyan);
      transform: translateX(-2px);
    }

    .header-title-box h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #ec4899 0%, #ec4899 50%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-title-box p {
      font-size: 13px;
      color: var(--text-dim);
      margin-top: 2px;
    }

    .glass-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: var(--radius-xl);
      padding: 22px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* Drop Zone */
    .drop-zone {
      border: 2px dashed rgba(244, 63, 94, 0.3);
      border-radius: var(--radius-lg);
      padding: 34px 24px;
      text-align: center;
      background: linear-gradient(180deg, rgba(244, 63, 94, 0.03) 0%, rgba(139, 92, 246, 0.02) 100%);
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .drop-zone:hover, .drop-zone.drag-over {
      border-color: var(--pink);
      background: rgba(244, 63, 94, 0.08);
      transform: translateY(-2px);
    }

    .drop-icon-wrapper {
      width: 60px;
      height: 60px;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(244, 63, 94, 0.2), rgba(139, 92, 246, 0.2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      border: 1px solid rgba(244, 63, 94, 0.3);
    }

    .drop-title { font-size: 16px; font-weight: 700; color: #f1f5f9; }
    .drop-sub { font-size: 13px; color: var(--text-dim); }

    .demo-btn-pill {
      margin-top: 6px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      color: #f472b6;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .demo-btn-pill:hover {
      background: rgba(244, 63, 94, 0.2);
      border-color: #f472b6;
    }

    /* Thumbnails Tray */
    .tray-section {
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    .section-label {
      font-size: 14px;
      font-weight: 700;
      color: #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .photo-grid-tray {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
      gap: 10px;
      max-height: 180px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .tray-thumb {
      position: relative;
      aspect-ratio: 1;
      border-radius: 10px;
      overflow: hidden;
      border: 1.5px solid var(--card-border);
      background: #0f172a;
    }

    .tray-thumb img { width: 100%; height: 100%; object-fit: cover; }

    .tray-del-btn {
      position: absolute;
      top: 4px; right: 4px;
      background: rgba(0, 0, 0, 0.75);
      color: #ec4899;
      border: 1px solid rgba(244, 63, 94, 0.4);
      width: 20px; height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Options Form */
    .options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .text-input {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--card-border);
      color: white;
      padding: 11px 14px;
      border-radius: var(--radius-md);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .text-input:focus { border-color: var(--pink); }

    .ratio-btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .ratio-btn {
      padding: 8px 14px;
      border-radius: var(--radius-md);
      font-size: 12px;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-dim);
      cursor: pointer;
      transition: all 0.2s;
    }

    .ratio-btn.active {
      background: rgba(244, 63, 94, 0.2);
      border-color: var(--pink);
      color: #fecdd3;
    }

    .color-dots-group {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .color-dot {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s;
    }

    .color-dot:hover { transform: scale(1.15); }
    .color-dot.active {
      border-color: var(--cyan);
      transform: scale(1.15);
      box-shadow: 0 0 14px var(--cyan);
    }

    /* Action Buttons */
    .btn-gradient-poster {
      background: linear-gradient(135deg, #ec4899 0%, #ec4899 50%, #6366f1 100%);
      border: none;
      color: white;
      padding: 15px 24px;
      border-radius: var(--radius-md);
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 10px 25px -6px rgba(244, 63, 94, 0.5);
      transition: all 0.2s;
    }

    .btn-gradient-poster:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px -6px rgba(244, 63, 94, 0.7);
    }

    /* Preview Canvas Area */
    .preview-box {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      margin-top: 10px;
    }

    canvas {
      width: 100%;
      max-width: 580px;
      border-radius: 14px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.08);
      background: #0d1117;
    }
  </style>
</head>

  "'초고화질 포스터 다운로드'를 눌러 무손실 대형 PNG 파일로 저장합니다."
 ],
 "tips": [

  "아날로그 필름 입자 옵션을 켜면 인쇄물 특유의 고급스러운 사진 질감이 더해집니다."

  <script>
    let posterPhotos = [];
    let currentLayout = 'editorial';
    let currentBg = '#0b0c10';

    async function handlePosterUpload(event) {
      const files = Array.from(event.target.files || []);
      const images = files.filter(f => f.type.startsWith('image/'));
      event.target.value = '';
      if (!images.length) return;

      for (const file of images) {
        try {
          const { dataUrl } = await loadPhotoFile(file, 2400);
          posterPhotos.push(dataUrl);
          updatePreview();
        } catch (err) {
          alert(err.message);
        }
      }
    }

    function removePhoto(idx) {
      posterPhotos.splice(idx, 1);
      updatePreview();
    }

    function updatePreview() {
      const grid = document.getElementById('photoPreview');
      const countEl = document.getElementById('photoCount');
      const settings = document.getElementById('customizerGroup');

      grid.innerHTML = '';
      countEl.textContent = posterPhotos.length;

      posterPhotos.forEach((src, idx) => {
        const wrap = document.createElement('div');
        wrap.className = 'tray-thumb';
        wrap.innerHTML = `
          <img src="${src}" alt="thumb">
          <button class="tray-del-btn" onclick="removePhoto(${idx})">✕</button>
        `;
        grid.appendChild(wrap);
      });

      settings.style.display = posterPhotos.length > 0 ? 'flex' : 'none';
    }

    function setLayout(layout, el) {
      currentLayout = layout;
      document.querySelectorAll('#layoutOptions .ratio-btn').forEach(b => b.classList.remove('active'));
      if (el) el.classList.add('active');
    }

    function setBg(bg, el) {
      currentBg = bg;
      document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
      if (el) el.classList.add('active');
    }

    function drawCover(ctx, img, x, y, w, h) {
      const imgRatio = img.width / img.height;
      const targetRatio = w / h;
      let sx = 0, sy = 0, sW = img.width, sH = img.height;
      if (imgRatio > targetRatio) {
        sW = img.height * targetRatio;
        sx = (img.width - sW) / 2;
      } else {
        sH = img.width / targetRatio;
        sy = (img.height - sH) / 2;
      }
      ctx.drawImage(img, sx, sy, sW, sH, x, y, w, h);
    }

    // Barcode Drawer on Canvas
    function drawBarcode(ctx, x, y, w, h, color) {
      ctx.fillStyle = color;
      let curX = x;
      while (curX < x + w) {
        const barW = Math.random() > 0.5 ? 4 : 2;
        const gap = Math.random() * 4 + 2;
        ctx.fillRect(curX, y, barW, h);
        curX += barW + gap;
      }
      ctx.font = '10px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('9 780201 37962', x + w / 2, y + h + 14);
    }

    // Subtle Film Grain Generator
    function applyFilmGrain(ctx, width, height, opacity = 0.04) {
      const imgData = ctx.getImageData(0, 0, width, height);
      const data = imgData.data;
      for (let i = 0; i < data.length; i += 4) {
        const noise = (Math.random() - 0.5) * 50;
        data[i] += noise;
        data[i+1] += noise;
        data[i+2] += noise;
      }
      ctx.putImageData(imgData, 0, 0);
    }

    async function renderPoster() {
      if (posterPhotos.length === 0) return;

      const canvas = document.getElementById('posterCanvas');
      const ctx = canvas.getContext('2d');

      // Standard Large Canvas: 1800 x 2400 (3:4 Poster aspect ratio)
      canvas.width = 1800;
      canvas.height = 2400;
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';

      // Draw Background
      ctx.fillStyle = currentBg;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const isLightBg = (currentBg === '#fbfbfa' || currentBg === '#ece5d8');
      const textColor = isLightBg ? '#111827' : '#f8fafc';
      const subColor = isLightBg ? '#64748b' : '#94a3b8';
      const accentRuleColor = isLightBg ? 'rgba(0,0,0,0.15)' : 'rgba(255,255,255,0.15)';

      const pad = 80;
      const title = document.getElementById('posterTitle').value.trim() || 'COLLECTED MOMENTS';
      const subtitle = document.getElementById('posterSubtitle').value.trim() || 'VOL. 26 • SPECIAL ARCHIVE EDITION';

      // Load all images
      const loadedImgs = await Promise.all(posterPhotos.map(src => {
        return new Promise(resolve => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.src = src;
        });
      }));

      // Top Editorial Header
      ctx.fillStyle = textColor;
      ctx.font = 'bold 84px "Playfair Display", "Cinzel", serif';
      ctx.textAlign = 'center';
      ctx.letterSpacing = '6px';
      ctx.fillText(title, canvas.width / 2, 140);

      // Fine rule lines under title
      ctx.strokeStyle = accentRuleColor;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(pad, 175);
      ctx.lineTo(canvas.width - pad, 175);
      ctx.stroke();

      ctx.fillStyle = subColor;
      ctx.font = '600 24px "Plus Jakarta Sans", "Pretendard", sans-serif';
      ctx.letterSpacing = '3px';
      ctx.fillText(subtitle, canvas.width / 2, 220);

      const contentTop = 270;
      const contentH = canvas.height - contentTop - 180;
      const contentW = canvas.width - pad * 2;
      const gap = 24;

      if (currentLayout === 'editorial') {
        // Vogue style: 1 huge main photo (left/top) + 3 editorial side frames
        const heroW = Math.round(contentW * 0.62);
        const subW = contentW - heroW - gap;

        // Hero image
        if (loadedImgs[0]) {
          drawCover(ctx, loadedImgs[0], pad, contentTop, heroW, contentH);
        }

        const subCount = Math.min(3, Math.max(1, loadedImgs.length - 1));
        const subH = (contentH - gap * (subCount - 1)) / subCount;

        for (let i = 0; i < subCount; i++) {
          const img = loadedImgs[i + 1] || loadedImgs[0];
          const y = contentTop + i * (subH + gap);
          drawCover(ctx, img, pad + heroW + gap, y, subW, subH);

          // Number tag on sub photos
          ctx.fillStyle = 'rgba(0,0,0,0.6)';
          ctx.fillRect(pad + heroW + gap + 15, y + 15, 45, 26);
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 14px monospace';
          ctx.textAlign = 'center';
          ctx.fillText(`0${i + 2}`, pad + heroW + gap + 37, y + 33);
        }
      } else if (currentLayout === 'swiss') {
        // Swiss Bauhaus 2x3 Grid with crisp margins and architectural coordinates
        const cols = 2, rows = 3;
        const cellW = (contentW - gap * (cols - 1)) / cols;
        const cellH = (contentH - gap * (rows - 1)) / rows;

        for (let i = 0; i < 6; i++) {
          const img = loadedImgs[i % loadedImgs.length];
          const col = i % cols;
          const row = Math.floor(i / cols);
          const x = pad + col * (cellW + gap);
          const y = contentTop + row * (cellH + gap);
          drawCover(ctx, img, x, y, cellW, cellH);

          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 16px "Plus Jakarta Sans", monospace';
          ctx.textAlign = 'left';
          ctx.fillText(`FIG. 0${i + 1}`, x + 16, y + 30);
        }
      } else if (currentLayout === 'gallery') {
        // Contemporary Art Museum Exhibition (Wide mat border with single hero + 3 lower panels)
        const topH = contentH * 0.65;
        const bottomH = contentH - topH - gap;
        drawCover(ctx, loadedImgs[0], pad, contentTop, contentW, topH);

        const subCount = 3;
        const subW = (contentW - gap * (subCount - 1)) / subCount;
        for (let i = 0; i < subCount; i++) {
          const img = loadedImgs[(i + 1) % loadedImgs.length];
          const x = pad + i * (subW + gap);
          drawCover(ctx, img, x, contentTop + topH + gap, subW, bottomH);
        }
      } else if (currentLayout === 'polaroid') {
        // Polaroid scattered collage with drop shadows
        const count = Math.min(6, loadedImgs.length);
        const cardW = 500, cardH = 610;

        for (let i = 0; i < count; i++) {
          const img = loadedImgs[i];
          const col = i % 2;
          const row = Math.floor(i / 2);
          const centerX = pad + 180 + col * 740;
          const centerY = contentTop + 140 + row * 580;
          const angle = ((i % 3) - 1) * 0.06;

          ctx.save();
          ctx.translate(centerX + cardW / 2, centerY + cardH / 2);
          ctx.rotate(angle);

          // White polaroid frame
          ctx.fillStyle = '#ffffff';
          ctx.shadowColor = 'rgba(0,0,0,0.35)';
          ctx.shadowBlur = 25;
          ctx.shadowOffsetY = 15;
          ctx.fillRect(-cardW / 2, -cardH / 2, cardW, cardH);
          ctx.shadowColor = 'transparent';

          // Photo
          const pPad = 26;
          drawCover(ctx, img, -cardW / 2 + pPad, -cardH / 2 + pPad, cardW - pPad * 2, cardH - 120);

          // Washi tape on top
          ctx.fillStyle = 'rgba(255, 235, 170, 0.7)';
          ctx.fillRect(-60, -cardH / 2 - 12, 120, 24);

          ctx.restore();
        }
      } else if (currentLayout === 'grid3x3') {
        // 3x3 Minimal Moodboard
        const cols = 3, rows = 3;
        const cellW = (contentW - gap * (cols - 1)) / cols;
        const cellH = (contentH - gap * (rows - 1)) / rows;

        for (let i = 0; i < 9; i++) {
          const img = loadedImgs[i % loadedImgs.length];
          const col = i % cols;
          const row = Math.floor(i / cols);
          const x = pad + col * (cellW + gap);
          const y = contentTop + row * (cellH + gap);
          drawCover(ctx, img, x, y, cellW, cellH);
        }
      }

      // Bottom Signature & Barcode
      const footerY = canvas.height - 70;
      ctx.fillStyle = subColor;
      ctx.font = '600 20px "Plus Jakarta Sans", sans-serif';
      ctx.letterSpacing = '2px';
      ctx.textAlign = 'left';
      ctx.fillText(`DESIGNED & CURATED WITH STUDIO • ${posterPhotos.length} MOMENTS ARCHIVED`, pad, footerY);

      // Barcode at bottom right
      drawBarcode(ctx, canvas.width - pad - 180, footerY - 30, 180, 36, textColor);

      // Optional Film Grain
      const applyGrain = document.getElementById('filmGrainCheck')?.checked;
      if (applyGrain) {
        applyFilmGrain(ctx, canvas.width, canvas.height);
      }

      document.getElementById('previewBox').style.display = 'flex';
      document.getElementById('previewBox').scrollIntoView({ behavior: 'smooth' });
    }

    function downloadPoster() {
      const canvas = document.getElementById('posterCanvas');
      const a = document.createElement('a');
      a.href = canvas.toDataURL('image/png');
      a.download = `magazine_poster_${Date.now()}.png`;
      a.click();
    }

    // Demo Samples Generator
    function getSampleImages() {
      const samples = [
        { title: 'TOKYO STREETS', col1: '#ec4899', col2: '#7c3aed', emoji: '🗼' },
        { title: 'SHIBUYA NIGHT', col1: '#0284c7', col2: '#06b6d4', emoji: '🌃' },
        { title: 'CHERRY BLOSSOM', col1: '#f472b6', col2: '#ec4899', emoji: '🌸' },
        { title: 'SUNSET TOWER', col1: '#ea580c', col2: '#f59e0b', emoji: '🌆' }
      ];
      return samples.map(s => {
        const c = document.createElement('canvas');
        const S = 2;
        c.width = 800 * S; c.height = 600 * S;
        const ctx = c.getContext('2d');
        ctx.scale(S, S); ctx.imageSmoothingQuality = 'high';
        const grad = ctx.createLinearGradient(0, 0, 800, 600);
        grad.addColorStop(0, s.col1); grad.addColorStop(1, s.col2);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 800, 600);
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.beginPath(); ctx.arc(400, 240, 100, 0, Math.PI * 2); ctx.fill();
        ctx.font = '80px sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(s.emoji, 400, 240);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 36px "Outfit", sans-serif';
        ctx.fillText(s.title, 400, 420);
        return c.toDataURL('image/jpeg', 0.9);
      });
    }

    function loadDemoSamples() {
      posterPhotos = getSampleImages();
      updatePreview();
      renderPoster();
    }

    if (new URLSearchParams(window.location.search).get('demo') === '1') {
      window.addEventListener('DOMContentLoaded', () => setTimeout(loadDemoSamples, 100));
    }

    // Drag and Drop
    const cardEl = document.getElementById('mainCard');
    if (cardEl) {
      cardEl.addEventListener('dragover', (e) => { e.preventDefault(); cardEl.classList.add('drag-over'); });
      cardEl.addEventListener('dragleave', (e) => { e.preventDefault(); cardEl.classList.remove('drag-over'); });
      cardEl.addEventListener('drop', (e) => {
        e.preventDefault();
        cardEl.classList.remove('drag-over');
        if (e.dataTransfer && e.dataTransfer.files) {
          handlePosterUpload({ target: { files: e.dataTransfer.files } });
        }
      });
    }
  </script>
</body>
</html>
