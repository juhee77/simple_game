<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>기억의 블록 쌓기 - 미니게임 천국</title>
<link rel="stylesheet" href="../styles/game-common.css?v=308950af">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0f172a;font-family:'Outfit',sans-serif;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
.back{position:absolute;top:20px;left:20px;z-index:10}
h1{font-size:1.8rem;margin:40px 0 5px;background:linear-gradient(135deg,#8b5cf6,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.info{color:#94a3b8;margin:10px 0;font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:90%;max-width:400px;margin:20px 0}
.cell{aspect-ratio:1;border-radius:12px;background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.1);cursor:pointer;transition:all .3s;display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:800}
.cell.placed{border-color:transparent}
.cell.highlight{animation:glow 1s infinite alternate}
@keyframes glow{from{box-shadow:0 0 5px currentColor}to{box-shadow:0 0 20px currentColor}}
.btn{background:linear-gradient(135deg,#8b5cf6,#3b82f6);border:none;color:#fff;padding:14px 40px;font-size:1.2rem;font-weight:700;border-radius:50px;cursor:pointer;margin:10px}
.palette{display:flex;gap:10px;margin:15px 0;flex-wrap:wrap;justify-content:center}
.color-pick{width:40px;height:40px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:all .3s}
.color-pick.active{border-color:white;transform:scale(1.2)}
.phase-text{font-size:1.5rem;font-weight:800;margin:10px 0}
.player-label{color:#a78bfa;font-weight:700}
</style>
    <script src="../scripts/game-common.js?v=6650036c"></script>
</head>
<body>
<a href="../index.html" class="back back-button">← 메인</a>
<h1>🧱 기억의 블록 쌓기</h1>
<div id="setup" style="text-align:center">
    <div class="grid" style="margin:20px auto;max-width:200px">
        <div class="cell placed" style="background:#8b5cf6">■</div><div class="cell"></div>
        <div class="cell"></div><div class="cell placed" style="background:#3b82f6">■</div>
    </div>
    <p style="color:#94a3b8;margin:15px 0">참가자 수를 입력하세요 (2~30명)</p>
    <input id="player-count" type="number" value="4" min="2" max="30" style="padding:15px;border-radius:15px;border:2px solid #8b5cf6;background:rgba(255,255,255,0.05);color:white;width:200px;text-align:center;font-size:1.2rem;outline:none">
    <div class="info" style="font-size:0.8rem;margin-top:10px">이전 플레이어가 쌓은 블록을 모두 복원한 뒤<br>새 블록을 1개 추가하세요!</div>
    <br><button class="btn" onclick="startGame()">도전 시작!</button>
</div>

<div id="game" style="display:none">
<div class="phase-text" id="phase">기억 단계</div>
<div class="info" id="info">현재 배치된 블록들을 잘 기억하세요!</div>
<div class="player-label" id="player-label">플레이어 1</div>
<div class="grid" id="grid"></div>
<div class="palette" id="palette" style="display:none"></div>
<div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
<button class="btn" id="action-btn" onclick="handleAction()">기억했어요!</button>
</div>
</div>

<div id="game-over" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(15,23,42,0.95);flex-direction:column;align-items:center;justify-content:center;z-index:100;text-align:center">
    <div style="font-size:5rem;margin-bottom:20px">🧱💥</div>
    <h2 style="font-size:2.5rem;color:#ef4444;margin-bottom:10px">기억 오류!</h2>
    <p style="font-size:1.2rem;color:#94a3b8;margin-bottom:30px" id="loser-text"></p>
    <button class="btn" onclick="location.reload()" style="background:white;color:black">처음부터 다시</button>
</div>

<script>
const colors=['#ff4757','#1e90ff','#2ed573','#ffa502','#8b5cf6','#ec4899'];
let totalPlayers=4,player=1,correctPattern=[],tempRestore=[],phase='memorize',selectedColor=colors[0];

function startGame(){
    totalPlayers = Math.min(30, Math.max(2, +document.getElementById('player-count').value || 4));
    document.getElementById('setup').style.display = 'none';
    document.getElementById('game').style.display = 'block';
    
    // Initial block
    correctPattern.push({index: Math.floor(Math.random()*25), color: colors[Math.floor(Math.random()*colors.length)]});
    render();
}

function render(){
    const g=document.getElementById('grid');
    g.innerHTML=Array(25).fill(null).map((_,i)=>{
        const p = correctPattern.find(item => item.index === i);
        const r = tempRestore.find(item => item.index === i);
        
        if(phase === 'memorize') {
            if(p) return `<div class="cell placed" style="background:${p.color};color:${p.color}">■</div>`;
        } else if(phase === 'restore') {
            if(r) return `<div class="cell placed" style="background:${r.color};color:${r.color}">■</div>`;
        } else if(phase === 'add') {
            if(p) return `<div class="cell placed" style="background:${p.color};color:${p.color};opacity:0.6">■</div>`;
        }
        return `<div class="cell" onclick="cellClick(${i})"></div>`;
    }).join('');
    
    document.getElementById('player-label').textContent=`플레이어 ${player}`;
}

function renderPalette(){
    const p = document.getElementById('palette');
    p.innerHTML=colors.map(c=>`<div class="color-pick ${c===selectedColor?'active':''}" style="background:${c}" onclick="selectColor('${c}')"></div>`).join('');
    p.style.display = (phase === 'add' || phase === 'restore') ? 'flex' : 'none';
}

function selectColor(c) {
    selectedColor = c;
    renderPalette();
}

function cellClick(i){
    if(phase === 'restore') {
        const target = correctPattern.find(p => p.index === i);
        const alreadyRestored = tempRestore.some(r => r.index === i);

        if(target && !alreadyRestored) {
            // Check if selected color matches target color
            if(selectedColor === target.color) {
                tempRestore.push(target);
                render();
                if(tempRestore.length === correctPattern.length) {
                    phase = 'add';
                    document.getElementById('phase').textContent='추가 단계';
                    document.getElementById('info').textContent='모든 블록과 색상을 맞췄습니다! 새로운 블록 1개를 추가하세요.';
                    document.getElementById('action-btn').style.display = 'none';
                    renderPalette();
                    render();
                }
            } else {
                gameOver(`색상이 틀렸습니다! (클릭한 색: ${selectedColor}, 실제 색: ${target.color})`);
            }
        } else if(!target) {
            gameOver('해당 위치에는 블록이 없었습니다!');
        }
    } else if(phase === 'add') {
        if(correctPattern.some(p => p.index === i)) return;
        correctPattern.push({index: i, color: selectedColor});
        nextTurn();
    }
}

function handleAction(){
    if(phase === 'memorize') {
        phase = 'restore';
        tempRestore = [];
        document.getElementById('phase').textContent='복원 단계';
        document.getElementById('info').textContent='위치와 색상을 모두 맞춰보세요! (준비된 팔레트에서 색상을 먼저 선택하세요)';
        document.getElementById('action-btn').style.display = 'none';
        renderPalette();
        render();
    }
}

function nextTurn(){
    player = (player % totalPlayers) + 1;
    phase = 'memorize';
    tempRestore = [];
    document.getElementById('phase').textContent='기억 단계';
    document.getElementById('info').textContent='현재 배치된 블록들의 위치와 색상을 잘 기억하세요!';
    document.getElementById('action-btn').textContent='기억했어요!';
    document.getElementById('action-btn').style.display = 'block';
    document.getElementById('palette').style.display = 'none';
    render();
}

function gameOver(msg){
    document.getElementById('game-over').style.display = 'flex';
    document.getElementById('loser-text').textContent = `플레이어 ${player}님 실패: ${msg || '순서를 틀렸습니다!'}`;
}
</script>
    <script type="application/json" id="game-rules">
{
 "title": "기억의 블록 쌓기",
 "goal": "앞사람이 쌓은 블록을 모두 복원한 뒤 하나를 더 얹으세요.",
 "steps": [
  "참가자 수를 정합니다.",
  "첫 사람이 블록 하나를 놓습니다.",
  "다음 사람은 앞의 순서를 그대로 재현한 뒤 새 블록을 하나 추가합니다.",
  "순서를 틀리면 탈락하고, 마지막까지 남은 사람이 승리합니다."
 ],
 "tips": [
  "위치뿐 아니라 놓은 순서까지 기억해야 합니다."
 ],
 "players": "2~30인",
 "time": "약 5분"
}
</script>
</body>
</html>
