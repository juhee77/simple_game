<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>큐브 스택 3D - 미니게임 천국</title>
    <link rel="stylesheet" href="../styles/game-common.css?v=308950af">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        .stack-layout {
            display: grid;
            gap: 1.25rem;
            justify-items: center;
        }

        .canvas-shell {
            width: min(100%, 760px);
            padding: 1.5rem;
            border-radius: 30px;
            border: 1px solid rgba(139, 92, 246, 0.4);
            background: linear-gradient(135deg, rgba(30, 27, 75, 0.5), rgba(2, 6, 23, 0.8));
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 40px rgba(139, 92, 246, 0.2);
        }

        #stack-canvas {
            width: 100%;
            display: block;
            background: #020617;
            border-radius: 20px;
            touch-action: manipulation;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        .status-bar {
            background: rgba(30, 27, 75, 0.4) !important;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(139, 92, 246, 0.3) !important;
            border-radius: 20px !important;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5) !important;
        }

        .status-value {
            color: #c4b5fd !important;
            text-shadow: 0 0 10px rgba(196, 181, 253, 0.5);
            font-size: 1.4rem !important;
        }

        .help-text {
            color: var(--text-secondary);
            text-align: center;
            line-height: 1.6;
        }
    </style>
    <script src="../scripts/game-common.js?v=6650036c"></script>
</head>

<body>
    <div class="game-container">
        <div class="game-header">
            <a href="../index.html" class="back-button">← 메인으로</a>
            <h1 class="game-title">🧊 큐브 스택 3D</h1>
            <p class="game-description">움직이는 블록을 정확히 쌓아 가장 높은 탑을 만들어보세요.</p>
        </div>

        <div class="status-bar">
            <div class="status-item">
                <span class="status-label">높이</span>
                <div class="status-value" id="height">0층</div>
            </div>
            <div class="status-item">
                <span class="status-label">정밀 콤보</span>
                <div class="status-value" id="combo">0</div>
            </div>
            <div class="status-item">
                <span class="status-label">블록 크기</span>
                <div class="status-value" id="size">100%</div>
            </div>
            <div class="status-item">
                <span class="status-label">베스트</span>
                <div class="status-value" id="best-height">0층</div>
            </div>
        </div>

        <div class="game-board">
            <div class="stack-layout">
                <div class="canvas-shell">
                    <canvas id="stack-canvas" width="720" height="460"></canvas>
                </div>
                <div class="help-text" id="status-text">스페이스, 엔터, 클릭 또는 터치로 블록을 떨어뜨리세요.</div>
            </div>
        </div>

        <div class="controls">
            <button class="button" onclick="startGame()">시작 / 재시작</button>
            <button class="button button-secondary" onclick="placeBlock()">지금 놓기</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('stack-canvas');
        const ctx = canvas.getContext('2d');
        const heightElement = document.getElementById('height');
        const comboElement = document.getElementById('combo');
        const sizeElement = document.getElementById('size');
        const bestHeightElement = document.getElementById('best-height');
        const statusText = document.getElementById('status-text');

        const BLOCK_HEIGHT = 22;
        const MOVE_RANGE = 130;

        let tower = [];
        let activeBlock = null;
        let combo = 0;
        let bestHeight = Number(localStorage.getItem('stack-best-height') || 0);
        let running = false;
        let animationFrame = null;
        let lastFrame = 0;
        let time = 0;

        // Visual improvements additions
        let smoothCameraOffset = 0;
        let screenShake = 0;
        let stars = [];
        let floatingTexts = [];

        function initStars() {
            stars = [];
            for (let i = 0; i < 45; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2 + 0.5,
                    brightness: Math.random(),
                    speed: Math.random() * 8 + 3
                });
            }
        }

        function addFloatingText(text, color) {
            floatingTexts.push({
                text,
                color,
                x: canvas.width / 2,
                y: canvas.height / 2 - 40,
                alpha: 1.0,
                vy: -1.8
            });
        }

        function isoPoint(x, z, y, cameraOffset) {
            return {
                x: canvas.width / 2 + (x - z) * 1.1,
                y: canvas.height - 80 - ((x + z) * 0.45 + y - cameraOffset)
            };
        }

        function currentHeight() {
            return Math.max(0, tower.length - 1);
        }

        function updateStats() {
            const topBlock = tower[tower.length - 1];
            const sizeRatio = topBlock ? Math.round((Math.max(topBlock.w, topBlock.d) / 100) * 100) : 100;
            heightElement.textContent = `${currentHeight()}층`;
            comboElement.textContent = combo;
            sizeElement.textContent = `${sizeRatio}%`;
            bestHeightElement.textContent = `${bestHeight}층`;
        }

        function generateActiveBlock() {
            const base = tower[tower.length - 1];
            const axis = tower.length % 2 === 1 ? 'x' : 'z';
            activeBlock = {
                x: base.x,
                z: base.z,
                w: base.w,
                d: base.d,
                level: tower.length,
                axis,
                offset: -MOVE_RANGE,
                direction: 1,
                colorHue: (tower.length * 34) % 360
            };
        }

        function resetGame() {
            tower = [{
                x: 0,
                z: 0,
                w: 100,
                d: 100,
                level: 0,
                colorHue: 220
            }];
            combo = 0;
            time = 0;
            smoothCameraOffset = 0;
            screenShake = 0;
            floatingTexts = [];
            if (stars.length === 0) initStars();
            generateActiveBlock();
            updateStats();
            drawScene();
        }

        function startGame() {
            cancelAnimationFrame(animationFrame);
            resetGame();
            running = true;
            statusText.textContent = '진행 중. 중심에 최대한 정확히 맞추세요.';
            lastFrame = 0;
            animationFrame = requestAnimationFrame(loop);
        }

        function trimBlock(overlapStart, overlapEnd) {
            const base = tower[tower.length - 1];
            if (activeBlock.axis === 'x') {
                activeBlock.x = overlapStart;
                activeBlock.w = overlapEnd - overlapStart;
                activeBlock.z = base.z;
                activeBlock.d = base.d;
            } else {
                activeBlock.z = overlapStart;
                activeBlock.d = overlapEnd - overlapStart;
                activeBlock.x = base.x;
                activeBlock.w = base.w;
            }
        }

        function placeBlock() {
            if (!running || !activeBlock) {
                return;
            }

            const base = tower[tower.length - 1];
            const activeStart = activeBlock.axis === 'x' ? activeBlock.x : activeBlock.z;
            const activeEnd = activeStart + (activeBlock.axis === 'x' ? activeBlock.w : activeBlock.d);
            const baseStart = activeBlock.axis === 'x' ? base.x : base.z;
            const baseEnd = baseStart + (activeBlock.axis === 'x' ? base.w : base.d);

            const overlapStart = Math.max(activeStart, baseStart);
            const overlapEnd = Math.min(activeEnd, baseEnd);

            if (overlapEnd <= overlapStart) {
                endGame();
                return;
            }

            const movementError = Math.abs((activeStart + activeEnd) / 2 - (baseStart + baseEnd) / 2);
            combo = movementError < 4 ? combo + 1 : 0;

            if (movementError < 4) {
                screenShake = 12;
                addFloatingText(`PERFECT! 🔥 ${combo} COMBO`, '#38bdf8');
            } else {
                screenShake = 5;
                if (combo > 0) {
                    addFloatingText('GOOD! ✨', '#a7f3d0');
                }
            }

            trimBlock(overlapStart, overlapEnd);
            tower.push({
                x: activeBlock.x,
                z: activeBlock.z,
                w: activeBlock.w,
                d: activeBlock.d,
                level: activeBlock.level,
                colorHue: activeBlock.colorHue
            });

            if (currentHeight() > bestHeight) {
                bestHeight = currentHeight();
                localStorage.setItem('stack-best-height', String(bestHeight));
            }

            updateStats();
            statusText.textContent = movementError < 4 ? '완벽! 정밀 콤보 증가' : '좋아요. 계속 쌓아보세요.';
            generateActiveBlock();
        }

        function drawBlock(block, cameraOffset, highlight = false) {
            const y0 = block.level * BLOCK_HEIGHT;
            const y1 = y0 + BLOCK_HEIGHT;
            const topA = isoPoint(block.x, block.z, y1, cameraOffset);
            const topB = isoPoint(block.x + block.w, block.z, y1, cameraOffset);
            const topC = isoPoint(block.x + block.w, block.z + block.d, y1, cameraOffset);
            const topD = isoPoint(block.x, block.z + block.d, y1, cameraOffset);
            const bottomB = isoPoint(block.x + block.w, block.z, y0, cameraOffset);
            const bottomC = isoPoint(block.x + block.w, block.z + block.d, y0, cameraOffset);
            const bottomD = isoPoint(block.x, block.z + block.d, y0, cameraOffset);

            const pulse = highlight ? Math.sin(time * 12) * 5 : 0;
            const topColor = `hsl(${block.colorHue} 95% ${highlight ? 70 + pulse : 62}%)`;
            const leftColor = `hsl(${block.colorHue} 70% 42%)`;
            const rightColor = `hsl(${block.colorHue} 74% 32%)`;

            ctx.lineWidth = 1.5;
            ctx.lineJoin = 'round';

            // Left Face
            ctx.beginPath();
            ctx.moveTo(topD.x, topD.y);
            ctx.lineTo(topC.x, topC.y);
            ctx.lineTo(bottomC.x, bottomC.y);
            ctx.lineTo(bottomD.x, bottomD.y);
            ctx.closePath();
            ctx.fillStyle = leftColor;
            ctx.fill();
            ctx.strokeStyle = `hsl(${block.colorHue} 80% 55%)`;
            ctx.stroke();

            // Right Face
            ctx.beginPath();
            ctx.moveTo(topB.x, topB.y);
            ctx.lineTo(topC.x, topC.y);
            ctx.lineTo(bottomC.x, bottomC.y);
            ctx.lineTo(bottomB.x, bottomB.y);
            ctx.closePath();
            ctx.fillStyle = rightColor;
            ctx.fill();
            ctx.strokeStyle = `hsl(${block.colorHue} 80% 45%)`;
            ctx.stroke();

            // Top Face
            ctx.beginPath();
            ctx.moveTo(topA.x, topA.y);
            ctx.lineTo(topB.x, topB.y);
            ctx.lineTo(topC.x, topC.y);
            ctx.lineTo(topD.x, topD.y);
            ctx.closePath();
            ctx.fillStyle = topColor;
            ctx.fill();
            ctx.strokeStyle = `hsl(${block.colorHue} 100% 85%)`;
            ctx.stroke();
        }

        function update(delta) {
            if (!running || !activeBlock) {
                return;
            }

            time += delta;
            const speed = 90 + Math.min(180, currentHeight() * 7);
            activeBlock.offset += activeBlock.direction * speed * delta;

            if (Math.abs(activeBlock.offset) > MOVE_RANGE) {
                activeBlock.offset = Math.sign(activeBlock.offset) * MOVE_RANGE;
                activeBlock.direction *= -1;
            }

            const base = tower[tower.length - 1];
            if (activeBlock.axis === 'x') {
                activeBlock.x = base.x + activeBlock.offset;
                activeBlock.z = base.z;
            } else {
                activeBlock.z = base.z + activeBlock.offset;
                activeBlock.x = base.x;
            }

            // Smooth camera transition
            const targetCameraOffset = Math.max(0, (tower.length - 7) * BLOCK_HEIGHT);
            smoothCameraOffset += (targetCameraOffset - smoothCameraOffset) * 0.1;

            // Screen shake decay
            if (screenShake > 0) {
                screenShake -= delta * 15;
                if (screenShake < 0) screenShake = 0;
            }

            // Update drifting stars
            stars.forEach(star => {
                star.y += star.speed * delta;
                if (star.y > canvas.height) {
                    star.y = 0;
                    star.x = Math.random() * canvas.width;
                }
            });

            // Update floating texts
            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                const ft = floatingTexts[i];
                ft.y += ft.vy;
                ft.alpha -= delta * 1.5;
                if (ft.alpha <= 0) {
                    floatingTexts.splice(i, 1);
                }
            }
        }

        function drawScene() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw deep space background
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#0a0a23');
            gradient.addColorStop(1, '#020208');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw drifting stars
            stars.forEach(star => {
                ctx.fillStyle = `rgba(255, 255, 255, ${star.brightness * (0.3 + 0.7 * Math.sin(time * 3 + star.x))})`;
                ctx.fillRect(star.x, star.y, star.size, star.size);
            });

            // Apply screen shake
            ctx.save();
            if (screenShake > 0) {
                const dx = (Math.random() - 0.5) * screenShake;
                const dy = (Math.random() - 0.5) * screenShake;
                ctx.translate(dx, dy);
            }

            // Draw light horizontal grids
            ctx.fillStyle = 'rgba(99, 102, 241, 0.05)';
            for (let i = 0; i < 8; i++) {
                const point = isoPoint(-120, i * 30, 0, smoothCameraOffset);
                ctx.fillRect(0, point.y, canvas.width, 1);
            }

            // Draw blocks with smoothCameraOffset
            tower.forEach((block) => drawBlock(block, smoothCameraOffset));
            if (activeBlock) {
                drawBlock(activeBlock, smoothCameraOffset, true);
            }

            ctx.restore();

            // Draw floating perfect combo texts
            floatingTexts.forEach(ft => {
                ctx.save();
                ctx.globalAlpha = Math.max(0, ft.alpha);
                ctx.fillStyle = ft.color;
                ctx.font = '800 24px Outfit';
                ctx.textAlign = 'center';
                ctx.shadowBlur = 12;
                ctx.shadowColor = ft.color;
                ctx.fillText(ft.text, ft.x, ft.y);
                ctx.restore();
            });

            if (!running) {
                ctx.fillStyle = 'rgba(2, 6, 23, 0.6)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#f8fafc';
                ctx.font = '700 28px Outfit';
                ctx.textAlign = 'center';
                ctx.fillText('시작 버튼을 누르세요', canvas.width / 2, canvas.height / 2);
            }
        }

        function loop(timestamp) {
            if (!running) {
                return;
            }

            if (!lastFrame) {
                lastFrame = timestamp;
            }
            const delta = Math.min(0.032, (timestamp - lastFrame) / 1000);
            lastFrame = timestamp;

            update(delta);
            drawScene();
            animationFrame = requestAnimationFrame(loop);
        }

        function endGame() {
            running = false;
            cancelAnimationFrame(animationFrame);
            updateStats();
            drawScene();
            statusText.textContent = `게임 오버. 최종 높이 ${currentHeight()}층`;
        }

        document.addEventListener('keydown', (event) => {
            if (event.code === 'Space' || (event.code === 'Enter' && !event.isComposing)) {
                event.preventDefault();
                placeBlock();
            }
        });

        canvas.addEventListener('click', () => placeBlock());
        canvas.addEventListener('touchstart', (event) => {
            event.preventDefault();
            placeBlock();
        }, { passive: false });

        updateStats();
        drawScene();
    </script>
    <script type="application/json" id="game-rules">
{
 "title": "큐브 스택 3D",
 "goal": "움직이는 블록을 정확히 겹쳐 탑을 높이 쌓으세요.",
 "steps": [
  "블록이 좌우로 움직입니다.",
  "스페이스·엔터·클릭·터치로 블록을 떨어뜨립니다.",
  "아래 블록과 어긋난 부분은 잘려 나갑니다.",
  "블록이 완전히 빗나가면 게임이 끝납니다."
 ],
 "tips": [
  "딱 맞게 쌓으면 잘리지 않아 다음 블록이 넓게 유지됩니다.",
  "최고 높이는 자동 저장됩니다."
 ],
 "players": "1인",
 "time": "약 5분"
}
</script>
</body>

</html>
