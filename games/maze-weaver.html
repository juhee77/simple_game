<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>미스터리 미로 - 미니게임 천국</title>
<link rel="stylesheet" href="../styles/pretendard.css?v=c17883c9">
<link rel="stylesheet" href="../styles/design-system.css?v=d12c2b80">
<link rel="stylesheet" href="../styles/game-common.css?v=2187f848">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);font-family:'Pretendard',sans-serif;color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
.back{position:absolute;top:20px;left:20px;z-index:10}
h1{font-size:1.8rem;margin:35px 0 5px;background:linear-gradient(135deg,#b87c14,#609410);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center}
.info{color:var(--muted);margin:8px 0 12px;font-size:.95rem;text-align:center;min-height:1.4em;line-height:1.4}
.player-label{font-size:1.25rem;font-weight:700;color:#65a30d;margin:4px 0;text-align:center}
.canvas-wrap{position:relative;width:100%;max-width:400px;aspect-ratio:1/1;margin:0 auto}
canvas{width:100%;height:100%;aspect-ratio:1/1;border-radius:20px;border:2px solid var(--line);background:#1e293b;touch-action:none;display:block;box-shadow:0 8px 24px rgba(0,0,0,0.25)}
.tools{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap;justify-content:center}
.tool-btn{padding:8px 16px;border-radius:18px;cursor:pointer;font-weight:600;font-size:.9rem;border:2px solid var(--line);background:var(--surface);color:var(--muted);font-family:inherit;transition:all .2s}
.tool-btn.active{background:rgba(132,204,22,.2);border-color:#84cc16;color:#65a30d}
.btn{background:linear-gradient(135deg,#f59e0b,#84cc16);border:none;color:#fff;padding:12px 30px;font-size:1rem;font-weight:700;border-radius:50px;cursor:pointer;margin:6px;transition:transform .15s, opacity .15s}
.btn:active{transform:scale(0.97)}
.btn-secondary{background:var(--surface-2);color:var(--text);border:1px solid var(--line)}
.btn-accent{background:linear-gradient(135deg,#10b981,#059669);color:#fff}
.tip-badge{display:inline-block;padding:3px 10px;border-radius:12px;background:rgba(132,204,22,.15);color:#65a30d;font-size:.8rem;font-weight:600;margin-bottom:6px}
.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px;max-width:420px}
</style>
<script src="../scripts/game-common.js?v=efdc1560"></script>
</head>
<body>
<a href="../index.html" class="back back-button">← 메인</a>
<h1>🏰 미스터리 미로</h1>

<!-- 설정 화면 -->
<div id="setup" style="text-align:center;max-width:380px;width:100%;margin-top:20px">
    <div style="margin:15px auto;width:90px;height:90px;background:var(--surface-2);border:2px solid #84cc16;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:2.8rem">🏰</div>
    <p style="color:var(--muted);margin:12px 0 6px;font-size:.95rem">참가 인원을 선택하세요 (1~30명)</p>
    <div style="display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:15px">
        <button class="btn btn-secondary" style="padding:8px 16px;margin:0" onclick="changeCount(-1)">-</button>
        <input id="player-count" type="number" value="4" min="1" max="30" style="padding:10px;border-radius:12px;border:2px solid #84cc16;background:var(--tint-1);color:var(--text);width:80px;text-align:center;font-size:1.2rem;font-weight:700;outline:none">
        <button class="btn btn-secondary" style="padding:8px 16px;margin:0" onclick="changeCount(1)">+</button>
    </div>
    <button class="btn" style="width:100%" onclick="startGame('multi')">👥 함께 미로 만들기 시작</button>
    <div style="margin:10px 0;color:var(--muted);font-size:.85rem">또는</div>
    <button class="btn btn-accent" style="width:100%" onclick="startGame('auto')">🎲 랜덤 미로 탈출하기 (1인용)</button>
</div>

<!-- 게임 영역 -->
<div id="game" style="display:none;width:100%;max-width:420px;text-align:center">
    <div class="player-label" id="player-label">플레이어 1: 벽 그리기</div>
    <div class="info" id="info">미로의 벽을 그려주세요! 다음 사람이 이어서 완성합니다.</div>

    <div class="tools" id="tools-bar">
        <button class="tool-btn active" id="wall-tool" onclick="setTool('wall')">🧱 벽</button>
        <button class="tool-btn" id="eraser-tool" onclick="setTool('eraser')">🧹 지우개</button>
        <button class="tool-btn" id="solve-tool" onclick="setTool('solve')">🏃 탈출 모드</button>
    </div>

    <div class="canvas-wrap">
        <canvas id="canvas" width="400" height="400"></canvas>
    </div>

    <div class="controls" id="draw-controls">
        <button class="btn" id="next-btn" onclick="nextPlayer()">다음 사람에게 넘기기</button>
        <button class="btn btn-accent" onclick="startEscapeMode()">🏃 지금 바로 탈출하기</button>
        <button class="btn btn-secondary" onclick="resetCanvas()">다시 그리기</button>
    </div>

    <div class="controls" id="escape-controls" style="display:none">
        <button class="btn btn-secondary" onclick="clearPathOnly()">경로 지우기</button>
        <button class="btn btn-secondary" onclick="returnToDrawing()">🧱 미로 수정하기</button>
        <button class="btn" onclick="location.reload()">새 게임</button>
    </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// 별도 오프스크린 캔버스: 벽 레이어 & 탈출 경로 레이어
const wallCanvas = document.createElement('canvas');
wallCanvas.width = 400;
wallCanvas.height = 400;
const wallCtx = wallCanvas.getContext('2d');

const pathCanvas = document.createElement('canvas');
pathCanvas.width = 400;
pathCanvas.height = 400;
const pathCtx = pathCanvas.getContext('2d');

const cellSize = 20;
const startPos = { x: 30, y: 30 };
const endPos = { x: 370, y: 370 };

let totalPlayers = 4;
let currentPlayer = 1;
let currentTool = 'wall';
let isDrawing = false;
let lastX = 0, lastY = 0;
let escapeStarted = false;
let isGameOver = false;

function changeCount(delta) {
    const input = document.getElementById('player-count');
    let val = Math.min(30, Math.max(1, (+input.value || 4) + delta));
    input.value = val;
}

function startGame(mode) {
    totalPlayers = Math.min(30, Math.max(1, +document.getElementById('player-count').value || 4));
    currentPlayer = 1;
    isGameOver = false;
    document.getElementById('setup').style.display = 'none';
    document.getElementById('game').style.display = 'block';

    initCanvases();

    if (mode === 'auto') {
        generateRandomMaze();
        startEscapeMode();
    } else {
        updateTurnUI();
    }
}

function initCanvases() {
    wallCtx.clearRect(0, 0, 400, 400);
    pathCtx.clearRect(0, 0, 400, 400);

    // 외곽 테두리 벽 생성 (출구와 입구는 통로 개방)
    wallCtx.strokeStyle = '#94a3b8';
    wallCtx.lineWidth = 8;
    wallCtx.lineCap = 'round';
    wallCtx.lineJoin = 'round';

    wallCtx.beginPath();
    // 상단 (입구 x=15~45 비워둠)
    wallCtx.moveTo(55, 10);
    wallCtx.lineTo(390, 10);
    // 우측
    wallCtx.lineTo(390, 345);
    // 하단 (출구 x=355~385 비워둠)
    wallCtx.moveTo(390, 390);
    wallCtx.lineTo(10, 390);
    // 좌측
    wallCtx.lineTo(10, 10);
    wallCtx.lineTo(15, 10);
    wallCtx.stroke();

    render();
}

function render() {
    // 1. 배경
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(0, 0, 400, 400);

    // 2. 그리드 보조선
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= 400; i += cellSize) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 400); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(400, i); ctx.stroke();
    }

    // 3. 시작 및 도착 지점
    // 시작 (초록)
    ctx.fillStyle = '#22c55e';
    ctx.beginPath();
    ctx.arc(startPos.x, startPos.y, 14, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 11px Pretendard';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('시작', startPos.x, startPos.y);

    // 도착 (빨강)
    ctx.fillStyle = '#ef4444';
    ctx.beginPath();
    ctx.arc(endPos.x, endPos.y, 14, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.fillText('출구', endPos.x, endPos.y);

    // 4. 벽 레이어 합성
    ctx.drawImage(wallCanvas, 0, 0);

    // 5. 탈출 경로 레이어 합성
    ctx.drawImage(pathCanvas, 0, 0);
}

function updateTurnUI() {
    if (currentTool === 'solve') {
        document.getElementById('player-label').textContent = '🏃 탈출 모드!';
        document.getElementById('info').textContent = '🟢 초록 시작점에서 출발해 벽을 피해 🔴 출구까지 손을 떼지 말고 선을 이어주세요!';
        document.getElementById('draw-controls').style.display = 'none';
        document.getElementById('escape-controls').style.display = 'flex';
        setTool('solve');
    } else {
        document.getElementById('player-label').textContent = `플레이어 ${currentPlayer}/${totalPlayers}: 벽 그리기`;
        document.getElementById('info').textContent = '길을 남겨두면서 벽을 조금씩 그려주세요! 다음 사람이 이어서 완성합니다.';
        document.getElementById('draw-controls').style.display = 'flex';
        document.getElementById('escape-controls').style.display = 'none';
        setTool(currentTool === 'eraser' ? 'eraser' : 'wall');
    }
}

function setTool(t) {
    currentTool = t;
    document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
    const btn = document.getElementById(t + '-tool');
    if (btn) btn.classList.add('active');

    if (t === 'solve') {
        document.getElementById('draw-controls').style.display = 'none';
        document.getElementById('escape-controls').style.display = 'flex';
        document.getElementById('player-label').textContent = '🏃 탈출 모드!';
        document.getElementById('info').textContent = '🟢 초록 시작점에서 출발해 벽을 피해 🔴 출구까지 선을 이어주세요!';
    }
}

function nextPlayer() {
    currentPlayer++;
    if (currentPlayer > totalPlayers) {
        startEscapeMode();
    } else {
        updateTurnUI();
    }
}

function startEscapeMode() {
    setTool('solve');
    clearPathOnly();
}

function returnToDrawing() {
    setTool('wall');
    clearPathOnly();
    updateTurnUI();
}

function clearPathOnly() {
    pathCtx.clearRect(0, 0, 400, 400);
    escapeStarted = false;
    isGameOver = false;
    render();
}

function resetCanvas() {
    if (confirm('그린 벽을 모두 지우고 처음부터 다시 시작할까요?')) {
        currentPlayer = 1;
        initCanvases();
        updateTurnUI();
    }
}

// 캔버스 좌표 정밀 계산
function toCanvasPos(e) {
    const r = canvas.getBoundingClientRect();
    return {
        x: (e.clientX - r.left) * (400 / r.width),
        y: (e.clientY - r.top) * (400 / r.height)
    };
}

// 벽 충돌 검사 (오프스크린 벽 캔버스의 알파값 검사)
function isWallPixel(x, y) {
    if (x < 0 || x >= 400 || y < 0 || y >= 400) return true;
    const pixel = wallCtx.getImageData(Math.floor(x), Math.floor(y), 1, 1).data;
    // 벽 알파값이 40 이상이면 벽으로 판정
    return pixel[3] > 40;
}

// 두 점 사이의 선분을 보간하여 벽 충돌 검사
function checkLineCollision(x1, y1, x2, y2) {
    const dist = Math.hypot(x2 - x1, y2 - y1);
    const steps = Math.max(1, Math.ceil(dist / 2));
    for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const cx = x1 + (x2 - x1) * t;
        const cy = y1 + (y2 - y1) * t;
        if (isWallPixel(cx, cy)) {
            return { hit: true, x: cx, y: cy };
        }
    }
    return { hit: false };
}

// 포인터 이벤트 핸들링
canvas.addEventListener('pointerdown', e => {
    if (isGameOver) return;
    canvas.setPointerCapture(e.pointerId);
    isDrawing = true;
    const pos = toCanvasPos(e);
    lastX = pos.x;
    lastY = pos.y;

    if (currentTool === 'solve') {
        const distToStart = Math.hypot(pos.x - startPos.x, pos.y - startPos.y);
        if (distToStart <= 28) {
            escapeStarted = true;
            pathCtx.clearRect(0, 0, 400, 400);
            pathCtx.strokeStyle = '#22c55e';
            pathCtx.lineWidth = 4;
            pathCtx.lineCap = 'round';
            pathCtx.lineJoin = 'round';
            pathCtx.beginPath();
            pathCtx.moveTo(startPos.x, startPos.y);
            pathCtx.lineTo(pos.x, pos.y);
            pathCtx.stroke();
            render();
        } else {
            escapeStarted = false;
            document.getElementById('info').textContent = '⚠️ 초록색 [시작] 동그라미에서 출발해야 합니다!';
        }
    } else if (currentTool === 'wall') {
        // 시작점/출구 주변은 벽을 치지 못하도록 보호
        const dStart = Math.hypot(pos.x - startPos.x, pos.y - startPos.y);
        const dEnd = Math.hypot(pos.x - endPos.x, pos.y - endPos.y);
        if (dStart > 25 && dEnd > 25) {
            wallCtx.fillStyle = '#94a3b8';
            wallCtx.beginPath();
            wallCtx.arc(pos.x, pos.y, 4, 0, Math.PI * 2);
            wallCtx.fill();
            render();
        }
    } else if (currentTool === 'eraser') {
        wallCtx.save();
        wallCtx.globalCompositeOperation = 'destination-out';
        wallCtx.beginPath();
        wallCtx.arc(pos.x, pos.y, 14, 0, Math.PI * 2);
        wallCtx.fill();
        wallCtx.restore();
        render();
    }
});

canvas.addEventListener('pointermove', e => {
    if (!isDrawing || isGameOver) return;
    const pos = toCanvasPos(e);
    const x = pos.x;
    const y = pos.y;

    if (currentTool === 'wall') {
        // 시작점과 출구 근처에는 벽 그리기 방지
        const dStart = Math.hypot(x - startPos.x, y - startPos.y);
        const dEnd = Math.hypot(x - endPos.x, y - endPos.y);
        if (dStart > 25 && dEnd > 25) {
            wallCtx.strokeStyle = '#94a3b8';
            wallCtx.lineWidth = 8;
            wallCtx.lineCap = 'round';
            wallCtx.lineJoin = 'round';
            wallCtx.beginPath();
            wallCtx.moveTo(lastX, lastY);
            wallCtx.lineTo(x, y);
            wallCtx.stroke();
            render();
        }
    } else if (currentTool === 'eraser') {
        wallCtx.save();
        wallCtx.globalCompositeOperation = 'destination-out';
        wallCtx.lineWidth = 26;
        wallCtx.lineCap = 'round';
        wallCtx.beginPath();
        wallCtx.moveTo(lastX, lastY);
        wallCtx.lineTo(x, y);
        wallCtx.stroke();
        wallCtx.restore();
        render();
    } else if (currentTool === 'solve') {
        if (!escapeStarted) return;

        // 벽 충돌 감지 (선분 보간)
        const collision = checkLineCollision(lastX, lastY, x, y);
        if (collision.hit) {
            handleWallCollision(collision.x, collision.y);
            return;
        }

        // 경로 그리기
        pathCtx.strokeStyle = '#22c55e';
        pathCtx.lineWidth = 4;
        pathCtx.lineCap = 'round';
        pathCtx.lineJoin = 'round';
        pathCtx.beginPath();
        pathCtx.moveTo(lastX, lastY);
        pathCtx.lineTo(x, y);
        pathCtx.stroke();
        render();

        // 출구 도달 검사
        const distToEnd = Math.hypot(x - endPos.x, y - endPos.y);
        if (distToEnd <= 18) {
            handleEscapeSuccess();
            return;
        }
    }

    lastX = x;
    lastY = y;
});

function finishDrawing(e) {
    if (isDrawing && canvas.hasPointerCapture(e.pointerId)) {
        canvas.releasePointerCapture(e.pointerId);
    }
    isDrawing = false;

    if (currentTool === 'solve' && escapeStarted && !isGameOver) {
        document.getElementById('info').textContent = '💡 손을 뗐습니다. 시작점부터 다시 이어서 출구까지 탈출하세요!';
        escapeStarted = false;
    }
}

canvas.addEventListener('pointerup', finishDrawing);
canvas.addEventListener('pointercancel', finishDrawing);

// 벽 충돌 처리
function handleWallCollision(hitX, hitY) {
    isDrawing = false;
    escapeStarted = false;
    if (navigator.vibrate) navigator.vibrate([60, 40, 60]);

    // 충돌 이펙트 (빨간 폭발 마커)
    ctx.fillStyle = '#ef4444';
    ctx.beginPath();
    ctx.arc(hitX, hitY, 12, 0, Math.PI * 2);
    ctx.fill();

    document.getElementById('info').textContent = '💥 벽에 부딪혔습니다! 시작점에서 다시 도전하세요.';

    setTimeout(() => {
        pathCtx.clearRect(0, 0, 400, 400);
        render();
    }, 700);
}

// 탈출 성공 처리
function handleEscapeSuccess() {
    isDrawing = false;
    escapeStarted = false;
    isGameOver = true;
    if (navigator.vibrate) navigator.vibrate([100, 50, 100]);

    document.getElementById('info').textContent = '🎉 축하합니다! 미로 탈출에 성공했습니다!';
    gameAlert('🎉 축하합니다!\n미로를 무사히 탈출했습니다!').then(() => {
        isGameOver = false;
    });
}

// 🎲 랜덤 미로 생성기 (DFS 백트래킹 알고리즘)
function generateRandomMaze() {
    wallCtx.clearRect(0, 0, 400, 400);
    const cols = 10;
    const rows = 10;
    const cw = 400 / cols;
    const ch = 400 / rows;

    const grid = [];
    for (let r = 0; r < rows; r++) {
        grid[r] = [];
        for (let c = 0; c < cols; c++) {
            grid[r][c] = { visited: false, walls: [true, true, true, true] }; // top, right, bottom, left
        }
    }

    const stack = [];
    grid[0][0].visited = true;
    stack.push({ r: 0, c: 0 });

    while (stack.length > 0) {
        const curr = stack[stack.length - 1];
        const neighbors = [];
        const { r, c } = curr;

        // top
        if (r > 0 && !grid[r - 1][c].visited) neighbors.push({ r: r - 1, c, dir: 0, opp: 2 });
        // right
        if (c < cols - 1 && !grid[r][c + 1].visited) neighbors.push({ r, c: c + 1, dir: 1, opp: 3 });
        // bottom
        if (r < rows - 1 && !grid[r + 1][c].visited) neighbors.push({ r: r + 1, c, dir: 2, opp: 0 });
        // left
        if (c > 0 && !grid[r][c - 1].visited) neighbors.push({ r, c: c - 1, dir: 3, opp: 1 });

        if (neighbors.length > 0) {
            const next = neighbors[Math.floor(Math.random() * neighbors.length)];
            grid[r][c].walls[next.dir] = false;
            grid[next.r][next.c].walls[next.opp] = false;
            grid[next.r][next.c].visited = true;
            stack.push({ r: next.r, c: next.c });
        } else {
            stack.pop();
        }
    }

    // 외곽 입구/출구 벽 뚫기
    grid[0][0].walls[0] = false;
    grid[rows - 1][cols - 1].walls[2] = false;

    // wallCanvas에 선으로 그리기
    wallCtx.strokeStyle = '#94a3b8';
    wallCtx.lineWidth = 6;
    wallCtx.lineCap = 'round';
    wallCtx.beginPath();

    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            const x = c * cw;
            const y = r * ch;
            const walls = grid[r][c].walls;

            if (walls[0] && !(r === 0 && c === 0)) { // top
                wallCtx.moveTo(x, y); wallCtx.lineTo(x + cw, y);
            }
            if (walls[1]) { // right
                wallCtx.moveTo(x + cw, y); wallCtx.lineTo(x + cw, y + ch);
            }
            if (walls[2] && !(r === rows - 1 && c === cols - 1)) { // bottom
                wallCtx.moveTo(x, y + ch); wallCtx.lineTo(x + cw, y + ch);
            }
            if (walls[3]) { // left
                wallCtx.moveTo(x, y); wallCtx.lineTo(x, y + ch);
            }
        }
    }
    wallCtx.stroke();
    render();
}
</script>

<script type="application/json" id="game-rules">
{
 "title": "미스터리 미로",
 "goal": "다 함께 미로를 만들고, 그 미로를 탈출하세요.",
 "steps": [
