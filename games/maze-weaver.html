<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>미스터리 미로 - 미니게임 천국</title>
<link rel="stylesheet" href="../styles/game-common.css?v=308950af">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0f172a;font-family:'Outfit',sans-serif;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
.back{position:absolute;top:20px;left:20px;z-index:10}
h1{font-size:1.8rem;margin:40px 0 5px;background:linear-gradient(135deg,#f59e0b,#84cc16);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.info{color:#94a3b8;margin:10px 0;font-size:.9rem;text-align:center}
.player-label{font-size:1.3rem;font-weight:700;color:#84cc16;margin:5px 0}
canvas{border-radius:20px;border:2px solid rgba(255,255,255,.1);background:#1e293b;touch-action:none;max-width:100%}
.tools{display:flex;gap:10px;margin:15px 0;flex-wrap:wrap;justify-content:center}
.tool-btn{padding:10px 20px;border-radius:20px;cursor:pointer;font-weight:600;border:2px solid rgba(255,255,255,.1);background:none;color:#94a3b8;font-family:inherit;transition:all .3s}
.tool-btn.active{background:rgba(132,204,22,.2);border-color:#84cc16;color:#84cc16}
.btn{background:linear-gradient(135deg,#f59e0b,#84cc16);border:none;color:#fff;padding:14px 40px;font-size:1.1rem;font-weight:700;border-radius:50px;cursor:pointer;margin:10px}
</style>
    <script src="../scripts/game-common.js?v=b7c7301f"></script>
</head>
<body>
<a href="../index.html" class="back back-button">← 메인</a>
<h1>🏰 미스터리 미로</h1>
<div id="setup" style="text-align:center">
    <div style="margin:20px auto;width:100px;height:100px;background:#1e293b;border:2px solid #84cc16;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:3rem">🏰</div>
    <p style="color:#94a3b8;margin:15px 0">참가자 수를 입력하세요 (1~30명)</p>
    <input id="player-count" type="number" value="4" min="1" max="30" style="padding:15px;border-radius:15px;border:2px solid #84cc16;background:rgba(255,255,255,0.05);color:white;width:200px;text-align:center;font-size:1.2rem;outline:none">
    <br><button class="btn" onclick="startGame()">미로 만들기 시작!</button>
</div>
<div id="game" style="display:none">
<div class="player-label" id="player-label">플레이어 1: 벽 그리기</div>
<div class="info" id="info">미로의 벽을 그려주세요! 다음 사람이 이어서 완성합니다.</div>
<div class="tools">
<button class="tool-btn active" id="wall-tool" onclick="setTool('wall')">🧱 벽</button>
<button class="tool-btn" id="eraser-tool" onclick="setTool('eraser')">🧹 지우개</button>
<button class="tool-btn" id="solve-tool" onclick="setTool('solve')">🏃 탈출 모드</button>
</div>
<canvas id="canvas" width="400" height="400"></canvas>
<div style="display:flex;gap:10px;justify-content:center">
<button class="btn" onclick="nextPlayer()">다음 사람에게 넘기기</button>
<button class="btn" onclick="location.reload()" style="background:rgba(255,255,255,.1)">초기화</button>
</div>
</div>
<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
let totalPlayers=4,drawing=false,tool='wall',player=1,lastX=0,lastY=0;

function startGame(){
    totalPlayers = Math.min(30, Math.max(1, +document.getElementById('player-count').value || 4));
    document.getElementById('setup').style.display = 'none';
    document.getElementById('game').style.display = 'block';
}
const cellSize=20;
ctx.fillStyle='#1e293b';ctx.fillRect(0,0,400,400);
// Draw grid
ctx.strokeStyle='rgba(255,255,255,0.05)';ctx.lineWidth=1;
for(let i=0;i<=400;i+=cellSize){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,400);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(400,i);ctx.stroke()}
// Start & End markers
ctx.fillStyle='#2ed573';ctx.beginPath();ctx.arc(cellSize,cellSize,8,0,Math.PI*2);ctx.fill();
ctx.font='12px Outfit';ctx.fillText('시작',cellSize-12,cellSize+20);
ctx.fillStyle='#ff4757';ctx.beginPath();ctx.arc(400-cellSize,400-cellSize,8,0,Math.PI*2);ctx.fill();
ctx.fillText('끝',400-cellSize-8,400-cellSize+20);
function nextPlayer(){
    player++;
    if(player>totalPlayers){
        document.getElementById('player-label').textContent='탈출 모드!';
        document.getElementById('info').textContent='🏃 미로를 탈출해보세요! 벽(#94a3b8)에 닿으면 실패합니다.';
        setTool('solve');
    } else {
        document.getElementById('player-label').textContent=`플레이어 ${player}: 벽 그리기`;
        setTool('wall');
    }
}

// Win/Loss Detection
function checkCollision(x, y) {
    if (tool !== 'solve') return;
    const pixel = ctx.getImageData(x, y, 1, 1).data;
    // Wall color: #94a3b8 is approx [148, 163, 184]
    // We check if the pixel is gray-ish
    if (pixel[0] > 140 && pixel[1] > 150 && pixel[2] > 170) {
        gameAlert('💥 벽에 부딪혔습니다! 다시 시도하세요.').then(()=>location.reload());
    }
    // Goal check: Red dot at (400-cellSize, 400-cellSize)
    const dist = Math.hypot(x - (400-cellSize), y - (400-cellSize));
    if (dist < 15) {
        gameAlert('🎉 축하합니다! 미로를 탈출했습니다!').then(()=>location.reload());
    }
}

function setTool(t){
tool=t;
document.querySelectorAll('.tool-btn').forEach(b=>b.classList.remove('active'));
document.getElementById(t+'-tool').classList.add('active');
}
canvas.addEventListener('pointerdown',e=>{drawing=true;const r=canvas.getBoundingClientRect();const s=400/r.width;lastX=(e.clientX-r.left)*s;lastY=(e.clientY-r.top)*s});
canvas.addEventListener('pointermove',e=>{
    if(!drawing)return;const r=canvas.getBoundingClientRect();const s=400/r.width;
    const x=(e.clientX-r.left)*s,y=(e.clientY-r.top)*s;
    if(tool==='wall'){ctx.strokeStyle='#94a3b8';ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(lastX,lastY);ctx.lineTo(x,y);ctx.stroke()}
    else if(tool==='eraser'){ctx.fillStyle='#1e293b';ctx.fillRect(x-10,y-10,20,20)}
    else if(tool==='solve'){
        ctx.strokeStyle='#2ed573';ctx.lineWidth=3;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(lastX,lastY);ctx.lineTo(x,y);ctx.stroke();
        checkCollision(x, y);
    }
    lastX=x;lastY=y;
});
canvas.addEventListener('pointerup',()=>drawing=false);
canvas.addEventListener('pointerleave',()=>drawing=false);
</script>
    <script type="application/json" id="game-rules">
{
 "title": "미스터리 미로",
 "goal": "다 함께 미로를 만들고, 그 미로를 탈출하세요.",
 "steps": [
  "참가자 수를 정합니다.",
  "폰을 돌려가며 각자 미로의 벽을 조금씩 그립니다.",
  "모두의 차례가 끝나면 미로가 완성됩니다.",
  "완성된 미로를 따라 출구까지 이동합니다."
 ],
 "tips": [
  "너무 막아 두면 아무도 못 나갑니다. 길은 남겨 두세요."
 ],
 "players": "1~30인",
 "time": "약 10분"
}
</script>
</body>
</html>
