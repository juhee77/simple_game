<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>순서 기억 - 미니게임 천국</title>
    <link rel="stylesheet" href="../styles/game-common.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        .sequence-layout {
            display: grid;
            gap: 1.5rem;
        }

        .sequence-info {
            background: var(--bg-secondary);
            border-radius: 18px;
            border: 1px solid var(--border-color);
            padding: 1rem 1.25rem;
            color: var(--text-secondary);
            text-align: center;
            line-height: 1.7;
        }

        .sequence-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(90px, 1fr));
            gap: 1rem;
            max-width: 560px;
            margin: 0 auto;
        }

        .pad {
            aspect-ratio: 1;
            border: none;
            border-radius: 22px;
            cursor: pointer;
            color: #fff;
            font-size: clamp(2rem, 7vw, 3rem);
            font-weight: 700;
            transition: transform 0.16s ease, filter 0.16s ease, box-shadow 0.16s ease;
            box-shadow: inset 0 -10px 0 rgba(0, 0, 0, 0.15);
        }

        .pad.active {
            transform: scale(1.05);
            filter: brightness(1.24);
            box-shadow: 0 0 0 4px rgba(248, 250, 252, 0.14), 0 18px 30px rgba(0, 0, 0, 0.28);
        }

        .pad:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .message {
            min-height: 1.5rem;
            text-align: center;
            color: var(--accent-primary);
            font-weight: 700;
        }
    </style>
</head>

<body>
    <div class="game-container">
        <div class="game-header">
            <a href="../index.html" class="back-button">← 메인으로</a>
            <h1 class="game-title">🧠 순서 기억</h1>
            <p class="game-description">빛나는 순서를 보고 같은 순서로 눌러 레벨을 올리세요.</p>
        </div>

        <div class="status-bar">
            <div class="status-item">
                <span class="status-label">레벨</span>
                <div class="status-value" id="level">0</div>
            </div>
            <div class="status-item">
                <span class="status-label">입력 진행</span>
                <div class="status-value" id="progress">0 / 0</div>
            </div>
            <div class="status-item">
                <span class="status-label">남은 기회</span>
                <div class="status-value" id="lives">3</div>
            </div>
            <div class="status-item">
                <span class="status-label">베스트</span>
                <div class="status-value" id="best-level">0</div>
            </div>
        </div>

        <div class="game-board">
            <div class="sequence-layout">
                <div class="sequence-info">시작하면 패드가 순서대로 빛납니다. 기억한 순서를 그대로 누르세요. 틀리면 기회가 줄어듭니다.</div>
                <div class="message" id="message">시작 버튼을 누르면 첫 순서가 재생됩니다.</div>
                <div class="sequence-grid" id="sequence-grid"></div>
            </div>
        </div>

        <div class="controls">
            <button class="button" onclick="startGame()">게임 시작</button>
            <button class="button button-secondary" onclick="replaySequence()">순서 다시 보기</button>
        </div>
    </div>

    <script>
        const PADS = [
            { emoji: '🌙', color: '#6366f1' },
            { emoji: '🔥', color: '#ef4444' },
            { emoji: '🍀', color: '#10b981' },
            { emoji: '⭐', color: '#f59e0b' },
            { emoji: '🌊', color: '#0ea5e9' },
            { emoji: '🍇', color: '#8b5cf6' },
            { emoji: '🌸', color: '#ec4899' },
            { emoji: '☁️', color: '#94a3b8' },
            { emoji: '🌞', color: '#f97316' }
        ];

        const gridElement = document.getElementById('sequence-grid');
        const levelElement = document.getElementById('level');
        const progressElement = document.getElementById('progress');
        const livesElement = document.getElementById('lives');
        const bestLevelElement = document.getElementById('best-level');
        const messageElement = document.getElementById('message');

        let sequence = [];
        let playerIndex = 0;
        let level = 0;
        let lives = 3;
        let bestLevel = Number(localStorage.getItem('sequence-best-level') || 0);
        let acceptingInput = false;
        let isShowingSequence = false;

        function buildGrid() {
            gridElement.innerHTML = '';
            PADS.forEach((pad, index) => {
                const button = document.createElement('button');
                button.className = 'pad';
                button.type = 'button';
                button.textContent = pad.emoji;
                button.style.background = `linear-gradient(135deg, ${pad.color}, rgba(15, 23, 42, 0.9))`;
                button.addEventListener('click', () => handlePadClick(index));
                gridElement.appendChild(button);
            });
        }

        function updateStats() {
            levelElement.textContent = level;
            progressElement.textContent = `${playerIndex} / ${sequence.length}`;
            livesElement.textContent = lives;
            bestLevelElement.textContent = bestLevel;
        }

        function setPadsDisabled(disabled) {
            Array.from(gridElement.children).forEach((pad) => {
                pad.disabled = disabled;
            });
        }

        function wait(duration) {
            return new Promise(resolve => setTimeout(resolve, duration));
        }

        async function flashPad(index) {
            const pad = gridElement.children[index];
            pad.classList.add('active');
            await wait(420);
            pad.classList.remove('active');
            await wait(140);
        }

        async function replaySequence() {
            if (!sequence.length || isShowingSequence) {
                return;
            }

            acceptingInput = false;
            isShowingSequence = true;
            setPadsDisabled(true);
            messageElement.textContent = '순서를 보여주는 중입니다. 잘 보세요.';

            for (const index of sequence) {
                await flashPad(index);
            }

            isShowingSequence = false;
            acceptingInput = true;
            playerIndex = 0;
            setPadsDisabled(false);
            updateStats();
            messageElement.textContent = '이제 같은 순서로 눌러보세요.';
        }

        async function nextLevel() {
            level += 1;
            sequence.push(Math.floor(Math.random() * PADS.length));
            playerIndex = 0;
            updateStats();
            await replaySequence();
        }

        async function handlePadClick(index) {
            if (!acceptingInput || isShowingSequence) {
                return;
            }

            const pad = gridElement.children[index];
            pad.classList.add('active');
            setTimeout(() => pad.classList.remove('active'), 140);

            if (sequence[playerIndex] !== index) {
                lives -= 1;
                acceptingInput = false;
                updateStats();

                if (lives <= 0) {
                    gameOver();
                    return;
                }

                messageElement.textContent = `틀렸습니다. 남은 기회 ${lives}`;
                await wait(700);
                await replaySequence();
                return;
            }

            playerIndex += 1;
            updateStats();

            if (playerIndex === sequence.length) {
                messageElement.textContent = '정답! 다음 레벨로 갑니다.';
                acceptingInput = false;
                await wait(700);
                await nextLevel();
            }
        }

        function startGame() {
            sequence = [];
            playerIndex = 0;
            level = 0;
            lives = 3;
            acceptingInput = false;
            isShowingSequence = false;
            updateStats();
            messageElement.textContent = '시작! 첫 순서를 보여줍니다.';
            nextLevel();
        }

        function gameOver() {
            acceptingInput = false;
            setPadsDisabled(true);

            if (level > bestLevel) {
                bestLevel = level;
                localStorage.setItem('sequence-best-level', String(bestLevel));
            }

            updateStats();
            messageElement.textContent = `게임 오버. 최고 도달 레벨 ${level}`;
            setPadsDisabled(false);
        }

        buildGrid();
        updateStats();
        setPadsDisabled(false);
    </script>
</body>

</html>
