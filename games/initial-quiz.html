            padding: 2rem;
            margin-bottom: 2rem;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin: 1.5rem 0;
        }

        .category-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .category-card:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .category-card.selected {
            background: rgba(168, 85, 247, 0.2);
            border-color: var(--accent-primary);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
        }

        .category-icon {
            font-size: 2rem;
        }

        .category-name {
            font-weight: 700;
            color: var(--text-primary);
        }

        .quiz-arena {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
        }

        .quiz-card {
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            border-radius: 24px;
            padding: 3rem 2rem;
            width: 100%;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .quiz-category-tag {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            padding: 0.5rem 1.5rem;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 700;
            color: white;
            box-shadow: 0 4px 10px rgba(168, 85, 247, 0.4);
        }

        .initial-consonants {
            font-size: 4rem;
            font-weight: 800;
            letter-spacing: 0.5rem;
            margin: 2rem 0;
            color: transparent;
            background: linear-gradient(135deg, #fff, #a855f7);
            -webkit-background-clip: text;
            background-clip: text;
            text-shadow: 0 0 30px rgba(168, 85, 247, 0.3);
        }

        .answer-reveal {
            font-size: 2.5rem;
            font-weight: 800;
            color: #10b981;
            margin: 2rem 0;
            display: none;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .timer-container {
            width: 100%;
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            overflow: hidden;
            margin-top: 1rem;
        }

        .timer-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #10b981, #ef4444);
            transition: width 0.1s linear;
        }

        .score-board {
            width: 100%;
            max-width: 600px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            margin-top: 1rem;
        }

        .player-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);

        }

        .player-name {
            font-weight: 600;
        }

        .score-controls {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .score-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            color: white;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;

        .score-btn:hover {

            font-size: 1.2rem;
            color: var(--accent-primary);

            text-align: center;

        .player-setup {
            background: var(--bg-secondary);

            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 2rem;

        .player-input {
            flex: 1;
            padding: 0.75rem 1.25rem;
            border-radius: 50px;
            border: 1px solid var(--border-color);
            background: rgba(0, 0, 0, 0.3);

        .player-chips {

        .player-chip {

        .controls {

            <h1 class="game-title">🔠 초성 퀴즈</h1>

        </div>

        <div class="game-board">

                    <div class="filter-title">👥 참여 플레이어 등록</div>
                    <div class="player-input-group">
                        <input type="text" id="player-name-input" class="player-input" placeholder="플레이어 이름 입력" onkeypress="if(event.key === 'Enter') addPlayer()">
                        <button class="button" onclick="addPlayer()">등록</button>
                    </div>
                    <div class="player-chips" id="player-chips"></div>
                </div>

                <div class="category-select-container">
                    <div class="filter-title">🏷️ 카테고리 다중 선택</div>
                    <div class="category-grid">
                        <div class="category-card selected" data-category="movie" onclick="toggleCategory(this)">
                            <div class="category-icon">🎬</div>
                            <div class="category-name">영화/드라마</div>
                        </div>
                        <div class="category-card selected" data-category="kpop" onclick="toggleCategory(this)">
                            <div class="category-icon">🎵</div>
                            <div class="category-name">K-Pop/음악</div>
                        </div>
                        <div class="category-card selected" data-category="food" onclick="toggleCategory(this)">
                            <div class="category-icon">🍕</div>
                            <div class="category-name">음식/디저트</div>
                        </div>
                        <div class="category-card selected" data-category="proverb" onclick="toggleCategory(this)">

                        <div class="category-card selected" data-category="life" onclick="toggleCategory(this)">
                            <div class="category-icon">🐶</div>
                            <div class="category-name">동물/일상</div>
                        </div>
                    </div>
                </div>

                <button class="button w-100" onclick="startGame()">게임 시작! 🚀</button>
            </div>

            <!-- PLAY ARENA -->
            <div id="quiz-arena" class="quiz-arena">
                <div class="quiz-card">
                    <div class="quiz-category-tag" id="quiz-category">-</div>
                    <div class="initial-consonants" id="quiz-initial">ㄱㄴㄷ</div>
                    <div class="answer-reveal" id="quiz-answer">가나다</div>
                    <div class="timer-container">
                        <div class="timer-bar" id="timer-bar"></div>
                    </div>
                </div>

                <div class="controls">
                    <button class="button" id="reveal-btn" onclick="revealAnswer()">정답 공개 👀</button>
                    <button class="button" id="next-btn" onclick="nextQuestion()" style="display:none; background: linear-gradient(135deg, #10b981, #059669);">다음 문제 ➡️</button>
                </div>

                <!-- SCOREBOARD -->
                <div class="score-board">
                    <div class="filter-title" style="margin-bottom: 0.5rem;">🏆 실시간 점수</div>
                    <div id="score-rows"></div>
                </div>
            </div>
        </div>
    </div>

        // Player Registration
        function addPlayer() {
            const input = document.getElementById('player-name-input');
            const name = input.value.trim();
            if (!name) return;
            if (players.some(p => p.name === name)) {
                gameAlert('이미 등록된 이름입니다.');
                return;
            }
            players.push({ name, score: 0 });
            input.value = '';
            renderPlayerChips();
        }

        function removePlayer(name) {
            players = players.filter(p => p.name !== name);
            renderPlayerChips();
        }

        function renderPlayerChips() {
            const container = document.getElementById('player-chips');
            container.innerHTML = players.map(p => `
                <div class="player-chip">
                    <span>${p.name}</span>
                    <button onclick="removePlayer('${p.name}')">×</button>
                </div>
            `).join('');
        }

        // Category Selection
        function toggleCategory(card) {
            const category = card.dataset.category;
            card.classList.toggle('selected');
            
            activeCategories = Array.from(document.querySelectorAll('.category-card.selected'))
                .map(c => c.dataset.category);
        }

        // Game Controls
        function startGame() {
            if (activeCategories.length === 0) {
                gameAlert('최소 하나의 카테고리를 선택해야 합니다.');
                return;
            }
            
            // Generate pool
            questionPool = [];
            activeCategories.forEach(cat => {
                quizDatabase[cat].forEach(item => {
                    questionPool.push({ ...item, category: categoryNames[cat] });
                });
            });

            // Shuffle pool
            shuffle(questionPool);

            if (questionPool.length === 0) {
                gameAlert('질문 데이터베이스가 비어있습니다.');
                return;
            }

            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('quiz-arena').style.display = 'flex';

            currentQuestionIndex = 0;
            renderScoreboard();
            startQuestion();
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function startQuestion() {
            if (currentQuestionIndex >= questionPool.length) {
                gameAlert('모든 문제를 풀었습니다! 게임이 리셋됩니다.');
                resetGame();
                return;
            }

            const q = questionPool[currentQuestionIndex];
            document.getElementById('quiz-category').textContent = q.category;
            document.getElementById('quiz-initial').textContent = q.q;
            
            const ansEl = document.getElementById('quiz-answer');
            ansEl.style.display = 'none';
            ansEl.textContent = q.a;

            document.getElementById('reveal-btn').style.display = 'inline-block';
            document.getElementById('next-btn').style.display = 'none';

            // Start Timer
            startTimer();
        }

        function startTimer() {
            clearInterval(timer);
            timeLeft = totalTime;
            const bar = document.getElementById('timer-bar');
            bar.style.width = '100%';
            
            timer = setInterval(() => {
                timeLeft -= 0.1;
                const percent = (timeLeft / totalTime) * 100;
                bar.style.width = percent + '%';
                
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    revealAnswer();
                }
            }, 100);
        }

        function revealAnswer() {
            clearInterval(timer);
            document.getElementById('quiz-answer').style.display = 'block';
            document.getElementById('reveal-btn').style.display = 'none';
            document.getElementById('next-btn').style.display = 'inline-block';
        }

        function nextQuestion() {
            currentQuestionIndex++;
            startQuestion();
        }

        function resetGame() {
            document.getElementById('setup-screen').style.display = 'block';
            document.getElementById('quiz-arena').style.display = 'none';
            clearInterval(timer);
        }

        // Score Tracker
        function renderScoreboard() {
            const rows = document.getElementById('score-rows');
            if (players.length === 0) {
                rows.innerHTML = '<div style="text-align:center; color:var(--text-secondary);">등록된 플레이어가 없습니다.</div>';
                return;
            }

            rows.innerHTML = players.map((p, idx) => `
                <div class="player-row">
                    <span class="player-name">${p.name}</span>
                    <div class="score-controls">
                        <button class="score-btn" onclick="updateScore(${idx}, -1)">-</button>
                        <span class="player-score">${p.score}</span>
                        <button class="score-btn" onclick="updateScore(${idx}, 1)">+</button>
                    </div>
                </div>
            `).join('');
        }

        function updateScore(index, delta) {
            players[index].score = Math.max(0, players[index].score + delta);
            renderScoreboard();
        }
    </script>
