<!DOCTYPE html>
<html data-stage lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>멀티터치 손가락 룰렛 - 미니게임 천국</title>
    <link rel="stylesheet" href="../styles/pretendard.css?v=c17883c9">
    <link rel="stylesheet" href="../styles/design-system.css?v=d12c2b80">
    <link rel="stylesheet" href="../styles/game-common.css?v=2187f848">
    <style>
        :root {
            --bg-color: var(--bg);
            --accent-gold: #f59e0b;
            --accent-cyan: #06b6d4;
            --accent-pink: #ec4899;
            --accent-lime: #10b981;
            --accent-purple: #8b5cf6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text);
            font-family: 'Pretendard', sans-serif;
            touch-action: none;
            position: fixed;
        }

        /* Ambient Glow Background */
        .ambient-bg {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, var(--scrim) 0%, var(--veil) 100%);
            z-index: 1;
            pointer-events: none;
        }

        /* Game Canvas */
        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: block;
        }

        /* Top HUD Controls */
        .hud-container {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: calc(env(safe-area-inset-top, 12px) + 8px) 16px 12px;
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        .hud-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .hud-title-box {
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: auto;
        }

        .hud-back-btn {
            background: var(--tint-2);
            border: 1px solid var(--line);
            color: var(--text);
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            cursor: pointer;
            backdrop-filter: blur(8px);
            text-decoration: none;
            transition: all 0.2s;
        }

        .hud-back-btn:active {
            transform: scale(0.92);
            background: var(--tint-3);
            color: var(--text);
        }

        .hud-title {
            font-size: 1.15rem;
            font-weight: 900;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, var(--text) 40%, var(--text));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hud-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: auto;
        }

        .hud-btn {
            background: var(--surface);
            border: 1px solid var(--line);
            color: var(--text-2);
            padding: 7px 12px;
            border-radius: 10px;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s;
        }

        .hud-btn:active, .hud-btn.active {
            background: rgba(245, 158, 11, 0.2);
            border-color: #f59e0b;
            color: #fef3c7;
            transform: scale(0.95);
        }

        /* Mode Selector Pills */
        .mode-selector {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            scrollbar-width: none;
            padding-bottom: 4px;
            pointer-events: auto;
        }

        .mode-selector::-webkit-scrollbar {
            display: none;
        }

        .mode-pill {
            flex-shrink: 0;
            background: var(--surface-2);
            border: 1px solid var(--line);
            color: var(--muted);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: all 0.2s ease;
        }

        .mode-pill.active {
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.3), rgba(139, 92, 246, 0.3));
            border-color: #38bdf8;
            color: var(--text);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
        }

        /* Center Instruction Overlay */
        .instruction-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            text-align: center;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
            width: 85%;
            max-width: 360px;
        }

        .instruction-box.hidden {
            opacity: 0;
            transform: translate(-50%, -45%) scale(0.95);
        }

        .instruction-icon {
            font-size: 3rem;
            margin-bottom: 12px;
            filter: drop-shadow(0 0 20px rgba(56, 189, 248, 0.5));
            animation: pulseTouch 2s infinite ease-in-out;
        }

        @keyframes pulseTouch {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.1); opacity: 1; filter: drop-shadow(0 0 30px rgba(245, 158, 11, 0.8)); }
        }

        .instruction-title {
            font-size: 1.4rem;
            font-weight: 900;
            margin-bottom: 6px;
            color: var(--text);
            text-shadow: 0 2px 10px rgba(20, 26, 42, 0.16);
        }

        .instruction-desc {
            font-size: 0.9rem;
            color: var(--muted);
            line-height: 1.4;
        }

        .desktop-notice {
            display: inline-block;
            margin-top: 14px;
            background: var(--tint-2);
            border: 1px dashed var(--line);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            color: #38bdf8;
            pointer-events: auto;
            cursor: pointer;
        }

        /* Countdown Display */
        .countdown-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 15;
            font-size: 7rem;
            font-weight: 900;
            color: var(--text);
            text-shadow: 0 0 40px rgba(245, 158, 11, 0.8), 0 0 80px rgba(236, 72, 153, 0.5);
            pointer-events: none;
            display: none;
            font-variant-numeric: tabular-nums;
        }

        /* Floating Result Dock */
        .result-dock {
            position: absolute;
            bottom: calc(env(safe-area-inset-bottom, 16px) + 16px);
            left: 50%;
            transform: translateX(-50%) translateY(160%);
            width: calc(100% - 32px);
            max-width: 440px;
            background: var(--surface);
            border: 1px solid rgba(245, 158, 11, 0.4);
            box-shadow: 0 10px 40px rgba(20, 26, 42, 0.16), 0 0 25px rgba(245, 158, 11, 0.2);
            border-radius: 20px;
            padding: 16px;
            z-index: 35;
            backdrop-filter: blur(16px);
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            gap: 12px;
            pointer-events: auto;
        }

        .result-dock.active {
            transform: translateX(-50%) translateY(0);
        }

        .result-dock-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .result-dock-title {
            font-size: 1.05rem;
            font-weight: 900;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .result-dock-summary {
            font-size: 0.88rem;
            color: #fef08a;
            font-weight: 800;
            text-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
        }

        .result-btn-row {
            display: flex;
            gap: 8px;
        }

        .result-btn {
            flex: 1;
            padding: 11px 8px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            border: none;
            transition: all 0.2s;
            font-family: inherit;
        }

        .result-btn-share {
            background: rgba(6, 182, 212, 0.2);
            border: 1px solid #06b6d4;
            color: #67e8f9;
        }

        .result-btn-share:active {
            background: rgba(6, 182, 212, 0.4);
            transform: scale(0.96);
        }

        .result-btn-copy {
            background: rgba(245, 158, 11, 0.2);
            border: 1px solid #f59e0b;
            color: #fef08a;
        }

        .result-btn-copy:active {
            background: rgba(245, 158, 11, 0.4);
            transform: scale(0.96);
        }

        .result-btn-restart {
            background: var(--tint-2);
            border: 1px solid var(--line);
            color: var(--text);
        }

        .result-btn-restart:active {
            background: var(--tint-3);
            transform: scale(0.96);
            color: var(--text);
        }

        /* Penalty Roulette Modal (Bottom Sheet) */
        .penalty-modal {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--surface);
            border-top: 2px solid rgba(245, 158, 11, 0.5);
            border-radius: 24px 24px 0 0;
            padding: 22px 20px calc(env(safe-area-inset-bottom, 16px) + 16px);
            z-index: 50;
            backdrop-filter: blur(20px);
            transform: translateY(105%);
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 -10px 40px rgba(20, 26, 42, 0.16);
            pointer-events: auto;
        }

        .penalty-modal.active {
            transform: translateY(0);
        }

        .penalty-badge {
            display: inline-block;
            background: rgba(245, 158, 11, 0.2);
            border: 1px solid #f59e0b;
            color: #fbbf24;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .penalty-title {
            font-size: 1.25rem;
            font-weight: 900;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .penalty-roulette-box {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 18px;
            text-align: center;
            margin-bottom: 14px;
            position: relative;
            overflow: hidden;
        }

        .penalty-result-text {
            font-size: 1.45rem;
            font-weight: 900;
            color: #fef08a;
            min-height: 2.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 0 0 15px rgba(245, 158, 11, 0.5);
        }

        .penalty-actions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .penalty-footer-row {
            display: flex;
            gap: 8px;
        }

        .btn-spin-again {
            flex: 1.3;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-size: 0.92rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
            transition: all 0.2s;
        }

        .btn-spin-again:active {
            transform: scale(0.96);
        }

        .btn-close-modal {
            flex: 0.7;
            background: var(--tint-2);
            border: 1px solid var(--line);
            color: var(--text);
            padding: 12px;
            border-radius: 12px;
            font-size: 0.92rem;
            font-weight: 700;
            cursor: pointer;
        }

        /* Warning Toast */
        .toast-msg {
            position: absolute;
            bottom: calc(env(safe-area-inset-bottom, 20px) + 20px);
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--surface);
            border: 1px solid var(--line);
            color: var(--text);
            padding: 10px 22px;
            border-radius: 25px;
            font-size: 0.85rem;
            font-weight: 800;
            z-index: 60;
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s ease;
            box-shadow: 0 4px 20px rgba(20, 26, 42, 0.16);
            white-space: nowrap;
        }

        .toast-msg.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast-msg.warning {
            background: rgba(239, 68, 68, 0.95);
            border-color: #ef4444;
            box-shadow: 0 4px 20px rgba(239, 68, 68, 0.4);
        }
    </style>
</head>
<body>
    <div class="ambient-bg"></div>
    <canvas class="stage" id="gameCanvas"></canvas>

    <!-- Top HUD Navigation & Settings -->
    <div class="hud-container">
        <div class="hud-header">
            <div class="hud-title-box">
                <a href="../index.html" class="hud-back-btn" title="메인으로">‹</a>
                <span class="hud-title">손가락 룰렛</span>
            </div>
            <div class="hud-actions">
                <button id="btnPenaltyToggle" class="hud-btn active" title="벌칙 룰렛 켜기/끄기">
                    <span>🎰</span> 벌칙 ON
                </button>
                <button id="btnSimulateTouch" class="hud-btn" title="가상 손가락 추가 (PC/테스트용)">
                    <span>🤖</span> +봇
                </button>
            </div>
        </div>

        <!-- Selection Modes -->
        <div class="mode-selector">
            <button class="mode-pill active" data-mode="single" data-count="1">🎯 1명 지목</button>
            <button class="mode-pill" data-mode="multi" data-count="2">👥 2명 당첨</button>
            <button class="mode-pill" data-mode="multi" data-count="3">👥 3명 당첨</button>
            <button class="mode-pill" data-mode="teams" data-count="2">⚖️ 2팀 나누기</button>
            <button class="mode-pill" data-mode="teams" data-count="3">⚖️ 3팀 나누기</button>
            <button class="mode-pill" data-mode="order" data-count="0">🔢 순서 정하기</button>
        </div>
    </div>

    <!-- Center Idle Instruction -->
    <div id="instructionBox" class="instruction-box">
        <div class="instruction-icon">👆</div>
        <div class="instruction-title">화면에 손가락을 올리세요</div>
        <div class="instruction-desc">2명 이상 손가락을 대고 3초간 기다리면 당첨자를 골라냅니다!</div>
        <div id="desktopNoticeBtn" class="desktop-notice">PC 마우스는 화면을 클릭하거나 [+봇] 버튼을 누르세요</div>
    </div>

    <!-- Large Countdown Indicator -->
    <div id="countdownOverlay" class="countdown-overlay">3</div>

    <!-- Warning & Info Toast -->
    <div id="toastMsg" class="toast-msg">손가락을 떼지 마세요!</div>

    <!-- Floating Result Dock -->
    <div id="resultDock" class="result-dock">
        <div class="result-dock-header">
            <div class="result-dock-title">
                <span>👑</span> <span id="resultDockTitle">당첨 결과</span>
            </div>
            <div id="resultDockSummary" class="result-dock-summary"></div>
        </div>
        <div class="result-btn-row">
            <button id="btnSaveImageDock" class="result-btn result-btn-share" title="결과 화면 카드 이미지 저장">
                <span>📸</span> 결과 저장
            </button>
            <button id="btnCopyTextDock" class="result-btn result-btn-copy" title="카카오톡 단톡방용 텍스트 복사">
                <span>📋</span> 카톡 복사
            </button>
            <button id="btnRestartDock" class="result-btn result-btn-restart" title="다음 판 시작">
                <span>🔄</span> 다시 하기
            </button>
        </div>
    </div>

    <!-- Penalty Roulette Modal (Bottom Sheet) -->
    <div id="penaltyModal" class="penalty-modal">
        <div class="penalty-badge">지목된 사람 벌칙 확정!</div>
        <div class="penalty-title">
            <span>🎉 즉석 벌칙 룰렛</span>
            <span id="penaltyPickedSummary" style="font-size: 0.9rem; color: #f59e0b;"></span>
        </div>
        <div class="penalty-roulette-box">
            <div id="penaltyResultText" class="penalty-result-text">룰렛 회전 중...</div>
        </div>
        <div class="penalty-actions-grid">
            <button id="btnSaveImagePenalty" class="result-btn result-btn-share">
                <span>📸</span> 결과 저장
            </button>
            <button id="btnCopyResultPenalty" class="result-btn result-btn-copy">
                <span>📋</span> 카톡 복사
            </button>
        </div>
        <div class="penalty-footer-row">
            <button id="btnSpinAgain" class="btn-spin-again">🎲 벌칙 재추첨</button>
            <button id="btnClosePenalty" class="btn-close-modal">닫기</button>
        </div>
    </div>

    <!-- Common Game Scripts -->
    <script src="../scripts/game-common.js?v=efdc1560"></script>

    <script>
        (function() {
            // Palette of Neon High-Energy Colors for Finger Rings
            const COLOR_PALETTE = [
                { hex: '#06b6d4', glow: 'rgba(6, 182, 212, 0.7)', name: '시안 블루' },
                { hex: '#ec4899', glow: 'rgba(236, 72, 153, 0.7)', name: '네온 핑크' },
                { hex: '#10b981', glow: 'rgba(16, 185, 129, 0.7)', name: '에메랄드' },
                { hex: '#f59e0b', glow: 'rgba(245, 158, 11, 0.7)', name: '골드 앰버' },
                { hex: '#8b5cf6', glow: 'rgba(139, 92, 246, 0.7)', name: '울트라 바이올렛' },
                { hex: '#f43f5e', glow: 'rgba(244, 63, 94, 0.7)', name: '루비 레드' },
                { hex: '#3b82f6', glow: 'rgba(59, 130, 246, 0.7)', name: '코발트 블루' },
                { hex: '#14b8a6', glow: 'rgba(20, 184, 166, 0.7)', name: '터콰이즈' },
                { hex: '#eab308', glow: 'rgba(234, 179, 8, 0.7)', name: '일렉트릭 옐로' },
                { hex: '#a855f7', glow: 'rgba(168, 85, 247, 0.7)', name: '퍼플 헤이즈' }
            ];

            const PENALTIES = [
                "🍺 소주 1잔 원샷!",
                "☕ 다음 차수 커피 쏘기",
                "🍗 편의점 야식 간식 쏘기",
                "🎤 좋아하는 노래 1절 부르기",
                "🧹 오늘 모임 뒷정리 / 분리수거",
                "💌 단톡방에 흑역사 사진 1장 공개",
                "🕺 최신 유행 댄스 10초 보여주기",
                "🤐 다음 차수까지 3분간 침묵하기",
                "💖 오른쪽 사람에게 진심 어린 칭찬 1가지",
                "😇 흑기사 소환권 (원하는 사람 1명 지목)"
            ];

            // Web Audio Synthesizer
            class AudioEngine {
                constructor() {
                    this.ctx = null;
                }
                init() {
                    if (!this.ctx) {
                        const AudioCtx = window.AudioContext || window.webkitAudioContext;
                        if (AudioCtx) this.ctx = new AudioCtx();
                    }
                    if (this.ctx && this.ctx.state === 'suspended') {
                        this.ctx.resume();
                    }
                }
                playTouchDown() {
                    this.init();
                    if (!this.ctx) return;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(140, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(320, this.ctx.currentTime + 0.12);
                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.15);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.15);
                }
                playCountdownTick(pitchMultiplier = 1) {
                    this.init();
                    if (!this.ctx) return;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(350 * pitchMultiplier, this.ctx.currentTime);
                    gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.12);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.12);
                }
                playWinFanfare() {
                    this.init();
                    if (!this.ctx) return;
                    const notes = [440, 554.37, 659.25, 880];
                    notes.forEach((freq, idx) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.08);
                        gain.gain.setValueAtTime(0, this.ctx.currentTime + idx * 0.08);
                        gain.gain.linearRampToValueAtTime(0.25, this.ctx.currentTime + idx * 0.08 + 0.02);
                        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.08 + 0.5);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(this.ctx.currentTime + idx * 0.08);
                        osc.stop(this.ctx.currentTime + idx * 0.08 + 0.5);
                    });
                }
                playError() {
                    this.init();
                    if (!this.ctx) return;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(90, this.ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.2);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.2);
                }
            }

            const audio = new AudioEngine();

            // DOM Elements
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const instructionBox = document.getElementById('instructionBox');
            const countdownOverlay = document.getElementById('countdownOverlay');
            const toastMsg = document.getElementById('toastMsg');
            const penaltyModal = document.getElementById('penaltyModal');
            const penaltyResultText = document.getElementById('penaltyResultText');
            const penaltyPickedSummary = document.getElementById('penaltyPickedSummary');
            const btnPenaltyToggle = document.getElementById('btnPenaltyToggle');
            const btnSimulateTouch = document.getElementById('btnSimulateTouch');
            const btnSpinAgain = document.getElementById('btnSpinAgain');
            const btnClosePenalty = document.getElementById('btnClosePenalty');
            const desktopNoticeBtn = document.getElementById('desktopNoticeBtn');
            const modePills = document.querySelectorAll('.mode-pill');

            // Result Dock Elements
            const resultDock = document.getElementById('resultDock');
            const resultDockTitle = document.getElementById('resultDockTitle');
            const resultDockSummary = document.getElementById('resultDockSummary');
            const btnSaveImageDock = document.getElementById('btnSaveImageDock');
            const btnCopyTextDock = document.getElementById('btnCopyTextDock');
            const btnRestartDock = document.getElementById('btnRestartDock');

            const btnSaveImagePenalty = document.getElementById('btnSaveImagePenalty');
            const btnCopyResultPenalty = document.getElementById('btnCopyResultPenalty');

            // Game State
            let dpr = window.devicePixelRatio || 1;
            let width = 0;
            let height = 0;

            let touchesMap = new Map(); // identifier -> TouchObject
            let currentMode = 'single'; // 'single', 'multi', 'teams', 'order'
            let targetCount = 1; // 1, 2, 3
            let isPenaltyEnabled = true;

            let gameState = 'waiting'; // 'waiting', 'countdown', 'selected'
            let countdownStart = 0;
            const COUNTDOWN_DURATION = 2600; // ms
            let lastTickSecond = 0;

            let particles = [];
            let shockwaves = [];
            let winners = []; // Array of chosen identifiers
            let lastResultSnapshot = null; // Full record of the finished round for image/copy

            function resizeCanvas() {
                dpr = window.devicePixelRatio || 1;
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = Math.floor(width * dpr);
                canvas.height = Math.floor(height * dpr);
                ctx.scale(dpr, dpr);
            }

            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            // Vibration Helper
            function triggerVibration(pattern) {
                if ('vibrate' in navigator) {
                    try { navigator.vibrate(pattern); } catch (e) {}
                }
            }

            function getModeName(mode, count) {
                if (mode === 'single') return '🎯 1명 지목';
                if (mode === 'multi') return `👥 ${count}명 당첨`;
                if (mode === 'teams') return `⚖️ ${count}팀 나누기`;

            }

            // Mode Selector Event
            modePills.forEach(pill => {
                pill.addEventListener('click', (e) => {
                    e.stopPropagation();

            });

            // Simulated Touch for Desktop / PC
            let simCounter = 1000;
            function addSimulatedTouch(x = null, y = null) {
                if (gameState === 'selected') {
                    resetRound();
                }

                simCounter++;
                const simId = simCounter;
                const px = x !== null ? x : width * (0.2 + Math.random() * 0.6);
                const py = y !== null ? y : height * (0.3 + Math.random() * 0.4);
                const colorObj = COLOR_PALETTE[touchesMap.size % COLOR_PALETTE.length];

                touchesMap.set(simId, {
                    id: simId,
                    x: px,
                    y: py,
                    radius: 46,
                    color: colorObj.hex,
                    glow: colorObj.glow,
                    name: colorObj.name,
                    born: performance.now(),
                    pulse: Math.random() * Math.PI,
                    isSimulated: true
                });

                audio.playTouchDown();
                triggerVibration(25);
                checkTouchesState();
            }

            btnSimulateTouch.addEventListener('click', (e) => {
                e.stopPropagation();
                addSimulatedTouch();
            });

            desktopNoticeBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                addSimulatedTouch();
            });

            // Touch Handling
            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                audio.init();

                if (gameState === 'selected') {
                    // Start new round on new touch
                    resetRound();
                }

                Array.from(e.changedTouches).forEach(t => {
                    const colorObj = COLOR_PALETTE[touchesMap.size % COLOR_PALETTE.length];
                    touchesMap.set(t.identifier, {
                        id: t.identifier,
                        x: t.clientX,
                        y: t.clientY,
                        radius: 48,
                        color: colorObj.hex,
                        glow: colorObj.glow,
                        name: colorObj.name,
                        born: performance.now(),
                        pulse: Math.random() * Math.PI,
                        isSimulated: false
                    });
                    createSparkle(t.clientX, t.clientY, colorObj.hex, 8);
                });

                audio.playTouchDown();
                triggerVibration(30);
                checkTouchesState();
            }, { passive: false });

            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                Array.from(e.changedTouches).forEach(t => {
                    const item = touchesMap.get(t.identifier);
                    if (item) {
                        item.x = t.clientX;
                        item.y = t.clientY;
                    }
                });
            }, { passive: false });

            function handleTouchEnd(e) {
                e.preventDefault();
                let wasInCountdown = (gameState === 'countdown');

                Array.from(e.changedTouches).forEach(t => {
                    touchesMap.delete(t.identifier);
                });

                if (wasInCountdown && touchesMap.size < 2 && gameState !== 'selected') {
                    showToast("손가락을 떼지 마세요!", true);
                    audio.playError();
                    triggerVibration([50, 50, 50]);
                    resetRound();
                } else {
                    checkTouchesState();
                }
            }

            canvas.addEventListener('touchend', handleTouchEnd, { passive: false });
            canvas.addEventListener('touchcancel', handleTouchEnd, { passive: false });

            // Mouse Click for PC Testing
            canvas.addEventListener('mousedown', (e) => {
                if (e.target !== canvas) return;
                audio.init();
                addSimulatedTouch(e.clientX, e.clientY);
            });

            function showToast(text, isWarning = false) {
                toastMsg.textContent = text;
                toastMsg.classList.toggle('warning', isWarning);
                toastMsg.classList.add('show');
                clearTimeout(toastMsg._timer);
                toastMsg._timer = setTimeout(() => {
                    toastMsg.classList.remove('show');
                }, 2200);
            }

            function resetRound() {
                gameState = 'waiting';
                countdownOverlay.style.display = 'none';
                instructionBox.classList.remove('hidden');
                resultDock.classList.remove('active');
                penaltyModal.classList.remove('active');
                touchesMap.clear();
                winners = [];
            }

            function checkTouchesState() {
                if (gameState === 'selected') {
                    // Do not reset when fingers are lifted; let users view, copy, or export!
                    return;
                }

                if (touchesMap.size >= 2) {
                    if (gameState === 'waiting') {
                        startCountdown();
                    }
                } else {
                    if (gameState === 'countdown') {
                        resetRound();
                    }
                }

                if (touchesMap.size > 0) {
                    instructionBox.classList.add('hidden');
                } else {
                    instructionBox.classList.remove('hidden');
                }
            }

            function startCountdown() {
                gameState = 'countdown';
                countdownStart = performance.now();
                lastTickSecond = 3;
                countdownOverlay.textContent = '3';
                countdownOverlay.style.display = 'block';
                resultDock.classList.remove('active');
                penaltyModal.classList.remove('active');
                audio.playCountdownTick(1.0);
                triggerVibration(40);
            }

            function finalizeSelection() {
                gameState = 'selected';
                countdownOverlay.style.display = 'none';

                const candidates = Array.from(touchesMap.values());
                if (candidates.length === 0) {
                    resetRound();
                    return;
                }

                // Cryptographic Shuffle
                const shuffled = [...candidates].sort(() => {
                    const arr = new Uint32Array(1);
                    crypto.getRandomValues(arr);
                    return arr[0] - 2147483648;
                });

                if (currentMode === 'single') {
                    winners = [shuffled[0].id];
                } else if (currentMode === 'multi') {
                    const count = Math.min(targetCount, candidates.length);
                    winners = shuffled.slice(0, count).map(c => c.id);
                } else if (currentMode === 'teams') {
                    const teamColors = ['#06b6d4', '#ec4899', '#10b981'];
                    const numTeams = targetCount;
                    shuffled.forEach((c, idx) => {
                        const teamIdx = idx % numTeams;
                        c.team = `팀 ${teamIdx + 1}`;
                        c.teamColor = teamColors[teamIdx];
                    });
                    winners = candidates.map(c => c.id);
                } else if (currentMode === 'order') {
                    shuffled.forEach((c, idx) => {
                        c.order = idx + 1;
                    });
                    winners = candidates.map(c => c.id);
                }

                // Trigger Shockwave & Confetti on winners
                candidates.forEach(c => {
                    if (winners.includes(c.id)) {
                        shockwaves.push({
                            x: c.x,
                            y: c.y,
                            radius: 10,
                            maxRadius: 180,
                            color: c.teamColor || '#f59e0b',
                            alpha: 1
                        });
                        createSparkle(c.x, c.y, c.teamColor || '#f59e0b', 36);
                    }
                });

                audio.playWinFanfare();
                triggerVibration([80, 50, 120]);

                // Record Snapshot for image export and clipboard copy
                lastResultSnapshot = {
                    mode: currentMode,
                    targetCount: targetCount,
                    totalCount: candidates.length,
                    timestamp: new Date(),
                    participants: candidates.map(c => ({
                        id: c.id,
                        name: c.name,
                        color: c.color,
                        isWinner: winners.includes(c.id),
                        team: c.team,
                        teamColor: c.teamColor,
                        order: c.order,
                        x: c.x,
                        y: c.y
                    })),
                    winners: [...winners],
                    penalty: null
                };

                updateResultDockUI();

                if (isPenaltyEnabled && (currentMode === 'single' || currentMode === 'multi')) {
                    setTimeout(() => {
                        openPenaltyRoulette();
                    }, 500);
                } else {
                    // Show Floating Result Dock immediately
                    resultDock.classList.add('active');
                }
            }

            function updateResultDockUI() {
                if (!lastResultSnapshot) return;

                if (lastResultSnapshot.mode === 'single' || lastResultSnapshot.mode === 'multi') {
                    const winnerNames = lastResultSnapshot.participants
                        .filter(p => p.isWinner)
                        .map(p => p.name)
                        .join(', ');
                    resultDockTitle.textContent = `당첨: ${winnerNames}`;
                    resultDockSummary.textContent = lastResultSnapshot.penalty ? `벌칙: ${lastResultSnapshot.penalty}` : `${lastResultSnapshot.totalCount}명 참여`;
                } else if (lastResultSnapshot.mode === 'teams') {
                    resultDockTitle.textContent = `팀 나누기 완료 (${lastResultSnapshot.targetCount}팀)`;
                    resultDockSummary.textContent = `총 ${lastResultSnapshot.totalCount}명 배정`;
                } else if (lastResultSnapshot.mode === 'order') {
                    const first = lastResultSnapshot.participants.find(p => p.order === 1);
                    resultDockTitle.textContent = `1번 순서: ${first ? first.name : ''}`;
                    resultDockSummary.textContent = `총 ${lastResultSnapshot.totalCount}명 순서 결정`;
                }
            }

            // Penalty Roulette Logic
            function openPenaltyRoulette() {
                const pickedCount = winners.length;
                penaltyPickedSummary.textContent = `${pickedCount}명 당첨!`;
                penaltyModal.classList.add('active');
                spinPenaltyRoulette();
            }

            function spinPenaltyRoulette() {
                let count = 0;
                const totalSpins = 18;
                btnSpinAgain.disabled = true;

                const timer = setInterval(() => {
                    count++;
                    const randomPenalty = PENALTIES[Math.floor(Math.random() * PENALTIES.length)];
                    penaltyResultText.textContent = randomPenalty;
                    audio.playCountdownTick(1.2 + (count / totalSpins));

                    if (count >= totalSpins) {
                        clearInterval(timer);
                        btnSpinAgain.disabled = false;
                        triggerVibration(100);

                        if (lastResultSnapshot) {
                            lastResultSnapshot.penalty = randomPenalty;
                            updateResultDockUI();
                        }
                    }
                }, 60 + count * 6);
            }

            btnSpinAgain.addEventListener('click', () => {
                spinPenaltyRoulette();
            });

            btnClosePenalty.addEventListener('click', () => {
                penaltyModal.classList.remove('active');
                resultDock.classList.add('active');

            btnRestartDock.addEventListener('click', () => {

            // ── 카카오톡 결과 텍스트 복사 ───────────────────────────
            function generateShareText(snap) {
                const timeStr = snap.timestamp.toLocaleDateString('ko-KR', {
                    year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit'
                });
                let lines = [
                    `[👆 손가락 룰렛 결과]`,
                    `일시: ${timeStr}`,
                    `모드: ${getModeName(snap.mode, snap.targetCount)} (총 ${snap.totalCount}명 참여)`
                ];

                if (snap.mode === 'single' || snap.mode === 'multi') {
                    const winnerList = snap.participants.filter(p => p.isWinner);
                    lines.push(``);
                    lines.push(winnerList.length === 1 ? `👑 당첨자:` : `👑 당첨자 (${winnerList.length}명):`);
                    winnerList.forEach((w, idx) => {
                        lines.push(`• ${w.name}`);
                    });

                    if (snap.penalty) {
                        lines.push(``);
                        lines.push(`🎰 확정 벌칙:`);
                        lines.push(snap.penalty);
                    }
                } else if (snap.mode === 'teams') {
                    const teamsMap = {};
                    snap.participants.forEach(p => {
                        if (!teamsMap[p.team]) teamsMap[p.team] = [];
                        teamsMap[p.team].push(p);
                    });
                    lines.push(``);
                    Object.keys(teamsMap).forEach(tName => {
                        const mems = teamsMap[tName];
                        lines.push(`${tName} (${mems.length}명): ${mems.map(m => m.name).join(', ')}`);
                    });
                } else if (snap.mode === 'order') {
                    const sorted = [...snap.participants].sort((a, b) => a.order - b.order);
                    lines.push(``);
                    lines.push(`순서:`);
                    sorted.forEach(p => {
                        lines.push(`${p.order}번: ${p.name}`);
                    });
                }

                lines.push(``);
                lines.push(`#미니게임천국 #손가락룰렛`);
                return lines.join('\n');
            }

            function copyResultToClipboard() {
                if (!lastResultSnapshot) {
                    showToast("복사할 결과가 없습니다.", true);
                    return;
                }
                audio.playTouchDown();
                triggerVibration(30);

                const text = generateShareText(lastResultSnapshot);
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(() => {
                        showToast("📋 결과 텍스트가 복사되었습니다!");
                    }).catch(() => {
                        fallbackCopyText(text);
                    });
                } else {
                    fallbackCopyText(text);
                }
            }

            function fallbackCopyText(text) {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.focus();
                ta.select();
                try {
                    document.execCommand('copy');
                    showToast("📋 결과 텍스트가 복사되었습니다!");
                } catch (e) {
                    showToast("복사에 실패했습니다.", true);
                }
                document.body.removeChild(ta);
            }

            btnCopyTextDock.addEventListener('click', copyResultToClipboard);
            btnCopyResultPenalty.addEventListener('click', copyResultToClipboard);

            // ── 고화질 결과 카드 이미지 저장 (사진첩/다운로드) ─────────────
            function roundRect(c, x, y, width, height, radius) {
                c.beginPath();
                c.moveTo(x + radius, y);
                c.lineTo(x + width - radius, y);
                c.quadraticCurveTo(x + width, y, x + width, y + radius);
                c.lineTo(x + width, y + height - radius);
                c.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
                c.lineTo(x + radius, y + height);
                c.quadraticCurveTo(x, y + height, x, y + height - radius);
                c.lineTo(x, y + radius);
                c.quadraticCurveTo(x, y, x + radius, y);
                c.closePath();
            }

            async function exportResultImage() {
                if (!lastResultSnapshot) {
                    showToast("저장할 결과가 없습니다.", true);
                    return;
                }
                audio.init();
                triggerVibration(40);

                // Create High-DPI Canvas
                const cardCanvas = document.createElement('canvas');
                const cw = 720;
                const ch = (lastResultSnapshot.penalty || lastResultSnapshot.mode === 'teams' || lastResultSnapshot.mode === 'order') ? 960 : 800;
                cardCanvas.width = cw;
                cardCanvas.height = ch;
                const cctx = cardCanvas.getContext('2d');

                // 1. Background dark cyber gradient
                const bgGrad = cctx.createLinearGradient(0, 0, 0, ch);
                bgGrad.addColorStop(0, '#0a0f1d');
                bgGrad.addColorStop(0.5, '#060913');
                bgGrad.addColorStop(1, '#020408');
                cctx.fillStyle = bgGrad;
                cctx.fillRect(0, 0, cw, ch);

                // Decorative cyber grid lines
                cctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
                cctx.lineWidth = 1;
                for (let x = 40; x < cw; x += 40) {
                    cctx.beginPath();
                    cctx.moveTo(x, 0);
                    cctx.lineTo(x, ch);
                    cctx.stroke();
                }
                for (let y = 40; y < ch; y += 40) {
                    cctx.beginPath();
                    cctx.moveTo(0, y);
                    cctx.lineTo(cw, y);
                    cctx.stroke();
                }

                // Top Ambient Glow
                const glowRad = cctx.createRadialGradient(cw / 2, 80, 10, cw / 2, 80, 280);
                glowRad.addColorStop(0, 'rgba(245, 158, 11, 0.25)');
                glowRad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                cctx.fillStyle = glowRad;
                cctx.fillRect(0, 0, cw, 360);

                // 2. Card Header
                cctx.font = 'bold 15px "Pretendard", sans-serif';
                cctx.fillStyle = '#f59e0b';
                cctx.textAlign = 'center';
                cctx.fillText('⚡ MINI GAME HEAVEN • MULTI-TOUCH ⚡', cw / 2, 60);

                cctx.font = '900 36px "Pretendard", sans-serif';
                cctx.fillStyle = '#ffffff';
                cctx.shadowColor = 'rgba(255, 255, 255, 0.4)';
                cctx.shadowBlur = 15;
                cctx.fillText('👆 손가락 룰렛 결과', cw / 2, 105);
                cctx.shadowBlur = 0;

                // Subtitle / Date / Mode
                const dStr = lastResultSnapshot.timestamp.toLocaleDateString('ko-KR', {
                    year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit'
                });
                cctx.font = '600 15px "Pretendard", sans-serif';
                cctx.fillStyle = '#94a3b8';
                cctx.fillText(`${dStr} • ${getModeName(lastResultSnapshot.mode, lastResultSnapshot.targetCount)} (${lastResultSnapshot.totalCount}명 참여)`, cw / 2, 140);

                // Inner Card Container
                const cardY = 170;
                const cardH = ch - 260;
                cctx.fillStyle = 'rgba(15, 23, 42, 0.8)';
                cctx.strokeStyle = 'rgba(245, 158, 11, 0.35)';
                cctx.lineWidth = 2;
                roundRect(cctx, 40, cardY, cw - 80, cardH, 20);
                cctx.fill();
                cctx.stroke();

                // Content based on Mode
                let contentY = cardY + 50;

                if (lastResultSnapshot.mode === 'single' || lastResultSnapshot.mode === 'multi') {
                    const winnerList = lastResultSnapshot.participants.filter(p => p.isWinner);

                    cctx.font = '48px sans-serif';
                    cctx.fillText('👑', cw / 2, contentY);
                    contentY += 35;

                    cctx.font = '900 24px "Pretendard", sans-serif';
                    cctx.fillStyle = '#fef08a';
                    cctx.shadowColor = 'rgba(245, 158, 11, 0.6)';
                    cctx.shadowBlur = 10;
                    cctx.fillText(winnerList.length === 1 ? '최종 당첨자' : `최종 당첨자 (${winnerList.length}명)`, cw / 2, contentY);
                    cctx.shadowBlur = 0;
                    contentY += 50;

                    // Draw Winner Ring Badges
                    const itemSpacing = 160;
                    const startX = (cw - (winnerList.length - 1) * itemSpacing) / 2;

                    winnerList.forEach((w, idx) => {
                        const wx = startX + idx * itemSpacing;
                        const wy = contentY + 25;

                        // Outer Glow Ring
                        cctx.beginPath();
                        cctx.arc(wx, wy, 38, 0, Math.PI * 2);
                        cctx.fillStyle = 'rgba(245, 158, 11, 0.2)';
                        cctx.fill();
                        cctx.lineWidth = 4;
                        cctx.strokeStyle = w.color;
                        cctx.shadowColor = w.color;
                        cctx.shadowBlur = 18;
                        cctx.stroke();
                        cctx.shadowBlur = 0;

                        // Inner circle
                        cctx.beginPath();
                        cctx.arc(wx, wy, 10, 0, Math.PI * 2);
                        cctx.fillStyle = '#ffffff';
                        cctx.fill();

                        // Name
                        cctx.font = 'bold 18px "Pretendard", sans-serif';
                        cctx.fillStyle = '#f8fafc';
                        cctx.fillText(w.name, wx, wy + 62);
                    });

                    contentY += 130;

                    // Penalty Box if active
                    if (lastResultSnapshot.penalty) {
                        const penW = cw - 140;
                        const penH = 110;
                        const penX = (cw - penW) / 2;
                        const penY = cardY + cardH - 140;

                        cctx.fillStyle = 'rgba(245, 158, 11, 0.12)';
                        cctx.strokeStyle = '#f59e0b';
                        cctx.lineWidth = 1.5;
                        roundRect(cctx, penX, penY, penW, penH, 16);
                        cctx.fill();
                        cctx.stroke();

                        cctx.font = 'bold 14px "Pretendard", sans-serif';
                        cctx.fillStyle = '#fbbf24';
                        cctx.fillText('🎰 확정 벌칙 / 미션', cw / 2, penY + 32);

                        cctx.font = '900 24px "Pretendard", sans-serif';
                        cctx.fillStyle = '#fef08a';
                        cctx.shadowColor = 'rgba(245, 158, 11, 0.5)';
                        cctx.shadowBlur = 12;
                        cctx.fillText(lastResultSnapshot.penalty, cw / 2, penY + 75);
                        cctx.shadowBlur = 0;
                    }
                } else if (lastResultSnapshot.mode === 'teams') {
                    const teamsMap = {};
                    lastResultSnapshot.participants.forEach(p => {
                        if (!teamsMap[p.team]) teamsMap[p.team] = [];
                        teamsMap[p.team].push(p);
                    });

                    const teamKeys = Object.keys(teamsMap);
                    const colW = (cw - 120 - (teamKeys.length - 1) * 20) / teamKeys.length;

                    teamKeys.forEach((tName, tIdx) => {
                        const members = teamsMap[tName];
                        const tColor = members[0].teamColor || '#06b6d4';
                        const bx = 60 + tIdx * (colW + 20);
                        const by = cardY + 30;
                        const bh = cardH - 60;

                        cctx.fillStyle = 'rgba(30, 41, 59, 0.5)';
                        cctx.strokeStyle = tColor;
                        cctx.lineWidth = 2;
                        roundRect(cctx, bx, by, colW, bh, 14);
                        cctx.fill();
                        cctx.stroke();

                        // Team Header
                        cctx.font = '900 20px "Pretendard", sans-serif';
                        cctx.fillStyle = tColor;
                        cctx.shadowColor = tColor;
                        cctx.shadowBlur = 10;
                        cctx.fillText(tName, bx + colW / 2, by + 36);
                        cctx.shadowBlur = 0;

                        cctx.font = '600 13px sans-serif';
                        cctx.fillStyle = '#94a3b8';
                        cctx.fillText(`(${members.length}명)`, bx + colW / 2, by + 58);

                        // Members
                        let memY = by + 95;
                        members.forEach(m => {
                            cctx.beginPath();
                            cctx.arc(bx + 26, memY - 5, 6, 0, Math.PI * 2);
                            cctx.fillStyle = m.color;
                            cctx.fill();

                            cctx.font = 'bold 16px "Pretendard", sans-serif';
                            cctx.fillStyle = '#ffffff';
                            cctx.textAlign = 'left';
                            cctx.fillText(m.name, bx + 42, memY);
                            cctx.textAlign = 'center';
                            memY += 36;
                        });
                    });
                } else if (lastResultSnapshot.mode === 'order') {
                    const sorted = [...lastResultSnapshot.participants].sort((a, b) => a.order - b.order);
                    let listY = cardY + 45;

                    cctx.font = '900 22px "Pretendard", sans-serif';
                    cctx.fillStyle = '#ffffff';
                    cctx.fillText('🔢 결정된 순서', cw / 2, listY);
                    listY += 45;

                    sorted.forEach(p => {
                        const rowW = cw - 140;
                        const rowH = 44;
                        const rx = (cw - rowW) / 2;
                        cctx.fillStyle = 'rgba(30, 41, 59, 0.6)';
                        cctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
                        cctx.lineWidth = 1;
                        roundRect(cctx, rx, listY, rowW, rowH, 10);
                        cctx.fill();
                        cctx.stroke();

                        // Order Number Badge
                        cctx.font = '900 18px "Pretendard", sans-serif';
                        cctx.fillStyle = p.order === 1 ? '#f59e0b' : '#38bdf8';
                        cctx.textAlign = 'left';
                        cctx.fillText(`#${p.order}`, rx + 20, listY + 28);

                        // Color circle
                        cctx.beginPath();
                        cctx.arc(rx + 75, listY + 22, 7, 0, Math.PI * 2);
                        cctx.fillStyle = p.color;
                        cctx.fill();

                        // Name
                        cctx.font = 'bold 16px "Pretendard", sans-serif';
                        cctx.fillStyle = '#f8fafc';
                        cctx.fillText(p.name, rx + 95, listY + 28);

                        cctx.textAlign = 'center';
                        listY += 54;
                    });
                }

                // 4. Card Footer
                cctx.font = '600 14px "Pretendard", sans-serif';
                cctx.fillStyle = '#64748b';
                cctx.fillText('미니게임 천국 • 화면에 손가락만 대면 3초 만에 결정!', cw / 2, ch - 40);

                // Save to Gallery / Download via game-common.js saveToGallery
                cardCanvas.toBlob(async (blob) => {
                    if (!blob) return;
                    const res = await saveToGallery(blob, `finger-roulette-${Date.now()}.png`);
                    if (res === 'shared') {
                        showToast("📸 사진첩 저장 / 공유 완료!");
                    } else if (res === 'downloaded') {
                        showToast("📸 결과 이미지를 저장했습니다!");
                    }
                }, 'image/png');
            }

            btnSaveImageDock.addEventListener('click', exportResultImage);
            btnSaveImagePenalty.addEventListener('click', exportResultImage);

            // Particle and Sparkle Systems
            function createSparkle(x, y, color, count = 12) {
                for (let i = 0; i < count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 2 + Math.random() * 6;
                    particles.push({
                        x, y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        color,
                        alpha: 1,
                        decay: 0.015 + Math.random() * 0.02,
                        size: 3 + Math.random() * 4
                    });
                }
            }

            // 60fps Main Render Loop
            function render(now) {
                requestAnimationFrame(render);
                ctx.clearRect(0, 0, width, height);

                // Handle Countdown Progression
                if (gameState === 'countdown') {
                    const elapsed = now - countdownStart;
                    const remainingRatio = Math.max(0, 1 - (elapsed / COUNTDOWN_DURATION));
                    const secondsLeft = Math.ceil(remainingRatio * 3);

                    if (secondsLeft > 0 && secondsLeft !== lastTickSecond) {
                        lastTickSecond = secondsLeft;
                        countdownOverlay.textContent = secondsLeft;
                        audio.playCountdownTick(1.0 + (3 - secondsLeft) * 0.3);
                        triggerVibration(40);
                    }

                    if (elapsed >= COUNTDOWN_DURATION) {
                        finalizeSelection();
                    }
                }

                // Draw Shockwaves
                for (let i = shockwaves.length - 1; i >= 0; i--) {
                    const sw = shockwaves[i];
                    sw.radius += 5;
                    sw.alpha -= 0.025;

                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
                    ctx.strokeStyle = sw.color;
                    ctx.lineWidth = 4 * sw.alpha;
                    ctx.globalAlpha = Math.max(0, sw.alpha);
                    ctx.shadowColor = sw.color;
                    ctx.shadowBlur = 15;
                    ctx.stroke();
                    ctx.restore();

                    if (sw.alpha <= 0) {
                        shockwaves.splice(i, 1);
                    }
                }

                // Draw Active Touch Rings
                touchesMap.forEach(touch => {
                    touch.pulse += 0.06;
                    const isWinner = winners.includes(touch.id);
                    const isLoser = (gameState === 'selected' && !isWinner && (currentMode === 'single' || currentMode === 'multi'));

                    ctx.save();

                    if (isLoser) {
                        ctx.globalAlpha = 0.2;
                        ctx.beginPath();
                        ctx.arc(touch.x, touch.y, touch.radius * 0.7, 0, Math.PI * 2);
                        ctx.fillStyle = '#475569';
                        ctx.fill();
                        ctx.restore();
                        return;
                    }

                    const ringColor = touch.teamColor || (isWinner ? '#f59e0b' : touch.color);
                    const ringRadius = touch.radius + Math.sin(touch.pulse) * 4;

                    // Outer Energy Ripple
                    ctx.beginPath();
                    ctx.arc(touch.x, touch.y, ringRadius + 14, 0, Math.PI * 2);
                    ctx.strokeStyle = ringColor;
                    ctx.lineWidth = 1.5;
                    ctx.globalAlpha = 0.4 + Math.sin(touch.pulse) * 0.2;
                    ctx.stroke();

                    // Main Glow Ring
                    ctx.beginPath();
                    ctx.arc(touch.x, touch.y, ringRadius, 0, Math.PI * 2);
                    ctx.fillStyle = isWinner ? 'rgba(245, 158, 11, 0.3)' : 'rgba(15, 23, 42, 0.6)';
                    ctx.fill();
                    ctx.lineWidth = isWinner ? 6 : 4;
                    ctx.strokeStyle = ringColor;
                    ctx.shadowColor = ringColor;
                    ctx.shadowBlur = isWinner ? 30 : 18;
                    ctx.stroke();

                    // Inner Dot
                    ctx.beginPath();
                    ctx.arc(touch.x, touch.y, 8, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffffff';
                    ctx.shadowBlur = 10;
                    ctx.fill();

                    // Mode Specific Overlays (Crown, Team Name, Order)
                    if (gameState === 'selected') {
                        if (isWinner && (currentMode === 'single' || currentMode === 'multi')) {
                            ctx.font = '36px sans-serif';
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'bottom';
                            ctx.fillText('👑', touch.x, touch.y - ringRadius - 8);
                        } else if (currentMode === 'teams') {
                            ctx.font = 'bold 18px "Pretendard", sans-serif';
                            ctx.fillStyle = touch.teamColor;
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'middle';
                            ctx.shadowColor = touch.teamColor;
                            ctx.shadowBlur = 12;
                            ctx.fillText(touch.team, touch.x, touch.y - ringRadius - 16);
                        } else if (currentMode === 'order') {
                            ctx.font = '900 24px "Pretendard", sans-serif';
                            ctx.fillStyle = '#ffffff';
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'middle';
                            ctx.shadowColor = '#f59e0b';
                            ctx.shadowBlur = 15;
                            ctx.fillText(`#${touch.order}`, touch.x, touch.y - ringRadius - 16);
                        }
                    }

                    // Rotating Orbital Particle around Ring
                    const orbitAngle = touch.pulse * 1.5;
                    const orbitX = touch.x + Math.cos(orbitAngle) * (ringRadius + 7);
                    const orbitY = touch.y + Math.sin(orbitAngle) * (ringRadius + 7);
                    ctx.beginPath();
                    ctx.arc(orbitX, orbitY, 4, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffffff';
                    ctx.shadowBlur = 8;
                    ctx.fill();

                    ctx.restore();
                });

                // Draw Connecting Tension Arcs during Countdown
                if (gameState === 'countdown' && touchesMap.size >= 2) {
                    const arr = Array.from(touchesMap.values());
                    ctx.save();
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = 'rgba(245, 158, 11, 0.4)';
                    ctx.setLineDash([6, 6]);
                    ctx.lineDashOffset = -now * 0.05;

                    ctx.beginPath();
                    for (let i = 0; i < arr.length; i++) {
                        const curr = arr[i];
                        const next = arr[(i + 1) % arr.length];
                        ctx.moveTo(curr.x, curr.y);
                        ctx.lineTo(next.x, next.y);
                    }
                    ctx.stroke();
                    ctx.restore();
                }

                // Draw Confetti & Sparkle Particles
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.alpha -= p.decay;

                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = Math.max(0, p.alpha);
                    ctx.shadowColor = p.color;
                    ctx.shadowBlur = 8;
                    ctx.fill();
                    ctx.restore();

                    if (p.alpha <= 0) {
                        particles.splice(i, 1);
                    }
                }
            }

            requestAnimationFrame(render);
        })();
    </script>
