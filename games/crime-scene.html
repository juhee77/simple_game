<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>크라임씬 - 미니게임 천국</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700;900&family=Noto+Sans+KR:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Bebas+Neue&display=swap" rel="stylesheet">
<link rel="stylesheet" href="crime-scene-styles.css">
    <script src="../scripts/game-common.js?v=b7c7301f"></script>
</head>
<body>

<!-- ══ LOBBY ══ -->
<div id="lobby" class="view active">
  <div class="lobby-hero">
    <div class="hero-eyebrow">Interactive Mystery Game</div>
    <div class="hero-title">CRIME SCENE</div>
    <div class="hero-sub">누가, 어디서, 어떻게 — 당신이 밝혀라</div>
  </div>
  <div class="scenario-list" id="scenario-list"></div>
  <div style="text-align:center;padding:24px 0 40px;">
    <a href="../index.html" class="back-btn" style="text-decoration:none;">← 미니게임 천국으로</a>
  </div>
</div>

<!-- ══ SCENARIO VIEW ══ -->
<div id="scenario-view" class="view">
  <div class="top-bar">
    <button class="back-btn" onclick="goTo('lobby')">← 목록</button>
    <span class="top-bar-title" id="sv-title"></span>
  </div>
  <div class="s-hero">
    <div class="s-hero-tag" id="sv-tag"></div>
    <div class="s-hero-title" id="sv-htitle"></div>
    <div class="s-hero-overview" id="sv-overview"></div>
    <div class="s-hero-meta" id="sv-meta"></div>
  </div>
  <div class="game-start-wrap">
    <button class="game-start-btn" id="game-start-btn" onclick="handleGameStart()">
      <span id="start-btn-icon">▶</span>
      <span id="start-btn-text">게임 시작 (GM이 누르세요)</span>
    </button>
    <div class="game-timer-display" id="game-timer-display"></div>
  </div>
  <div class="role-select-section">
    <div class="section-eyebrow">역할을 선택하세요</div>
    <div class="role-grid" id="role-grid"></div>
  </div>
</div>

<!-- ══ ROLE VIEW ══ -->
<div id="role-view" class="view">
  <div class="top-bar">
    <button class="back-btn" onclick="goTo('scenario-view')">← 역할 선택</button>
    <span class="top-bar-title" id="rv-top-title"></span>
  </div>
  <div class="rv-timer-bar" id="rv-timer-bar">
    <div>
      <div class="timer-display" id="rv-timer-display">00:00</div>
      <div class="timer-label">게임 경과 시간</div>
    </div>
    <div class="timer-phase" id="rv-timer-phase">대기 중</div>
  </div>
  <div class="rv-wrap" id="rv-content"></div>
</div>

<!-- IMAGE MODAL -->
<div class="img-modal-backdrop" id="img-modal" onclick="closeModal(event)">
  <div class="img-modal-box">
    <button class="img-modal-close" onclick="closeImgModal()">✕</button>
    <div class="img-modal-svg" id="modal-svg"></div>
    <span class="img-modal-tag" id="modal-tag"></span>
    <div class="img-modal-title" id="modal-title"></div>
    <div class="img-modal-desc" id="modal-desc"></div>
  </div>
</div>

<script src="crime-scene-data.js"></script>
<script src="crime-scene-svgs.js"></script>
<script src="crime-scene-engine.js"></script>
<script type="application/json" id="game-rules">
{
 "title": "네온 크라임씬",
 "goal": "토론과 심문으로 우리 중 숨은 범인을 찾아내세요.",
 "steps": [
  "GM 1명과 용의자 5~6명이 필요합니다(총 6~7명).",
  "각자 자기 역할 카드만 확인합니다. GM 패키지는 진범이 적혀 있으니 절대 열지 마세요.",
  "GM이 사건 개요를 읽고 라운드를 진행합니다.",
  "알리바이와 단서를 공유하며 서로를 추궁합니다.",
  "마지막에 범인을 투표로 지목하고 GM이 진상을 공개합니다."
 ],
 "tips": [
  "범인도 자기 목표가 따로 있습니다. 무조건 숨기만 하면 안 됩니다.",
  "역할 카드의 비밀은 추궁받을 때 조금씩 흘리는 게 재미있습니다."
 ],
 "players": "6~7인",
 "time": "약 60분"
}
</script>
</body>
</html>
