<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>더치페이 정산기 - 미니게임 천국</title>
    <script src="../scripts/game-common.js?v=b7c7301f"></script>
    <link rel="stylesheet" href="../styles/game-common.css?v=bed20c1e">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #38bdf8;
            --plus: #4ade80;
            --minus: #f87171;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            font-family: 'Outfit', system-ui, sans-serif;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 16px 40px;
        }

        .back { position: absolute; top: 20px; left: 20px; z-index: 10; }

        h1 {
            font-size: 1.8rem;
            margin: 44px 0 4px;
            background: linear-gradient(135deg, #38bdf8, #4ade80);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sub { color: var(--muted); font-size: .88rem; margin-bottom: 18px; text-align: center; }

        .wrap { width: 100%; max-width: 480px; }

        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 14px;
        }

        .card h2 { font-size: 1.05rem; margin-bottom: 4px; }
        .card .hint { color: var(--muted); font-size: .8rem; line-height: 1.6; margin-bottom: 12px; }

        label { display: block; font-size: .78rem; color: var(--muted); margin-bottom: 6px; }

        input[type=text], input[type=number], textarea {
            width: 100%;
            padding: 13px 15px;
            border-radius: 13px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, .05);
            color: var(--text);
            font-family: inherit;
            font-size: 1rem;
            outline: none;
        }

        textarea { min-height: 96px; line-height: 1.8; resize: vertical; }
        input:focus, textarea:focus { border-color: var(--accent); }

        .btn {
            width: 100%;
            border: none;
            border-radius: 999px;
            padding: 14px;
            background: linear-gradient(135deg, #38bdf8, #4ade80);
            color: #05121e;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn.ghost { background: var(--panel); color: var(--text); border: 1px solid var(--border); }
        .btn.small { width: auto; padding: 10px 18px; font-size: .88rem; margin-top: 0; }

        .row { display: flex; gap: 8px; align-items: flex-end; }
        .row .grow { flex: 1; }

        .entry {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            margin-top: 8px;
            border-radius: 13px;
            background: rgba(255, 255, 255, .04);
            border: 1px solid var(--border);
        }

        .entry .info { flex: 1; min-width: 0; }
        .entry .title { font-weight: 700; font-size: .95rem; }
        .entry .meta { font-size: .76rem; color: var(--muted); margin-top: 2px; line-height: 1.5; }
        .entry .amount { font-weight: 800; font-size: .98rem; white-space: nowrap; }

        .entry .del {
            border: none;
            background: none;
            color: var(--muted);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 4px 6px;
        }

        .entry .del:hover { color: var(--minus); }

        .empty { color: var(--muted); font-size: .85rem; text-align: center; padding: 18px 0; }

        .who-picker { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

        .chip {
            padding: 8px 14px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, .04);
            color: var(--muted);
            font-family: inherit;
            font-size: .86rem;
            font-weight: 700;
            cursor: pointer;
        }

        .chip.on { background: rgba(56, 189, 248, .18); border-color: var(--accent); color: var(--text); }
        .chip.payer.on { background: rgba(74, 222, 128, .18); border-color: var(--plus); }

        .summary { display: flex; flex-direction: column; gap: 6px; }

        .bal {
            display: flex;
            justify-content: space-between;
            padding: 11px 14px;
            border-radius: 12px;
            background: rgba(255, 255, 255, .04);
            font-size: .95rem;
        }

        .bal .amt.plus { color: var(--plus); font-weight: 800; }
        .bal .amt.minus { color: var(--minus); font-weight: 800; }
        .bal .amt.zero { color: var(--muted); }

        .transfer {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 16px;
            margin-top: 8px;
            border-radius: 14px;
            background: rgba(56, 189, 248, .1);
            border: 1px solid rgba(56, 189, 248, .32);
            font-size: .98rem;
        }

        .transfer .arrow { color: var(--accent); font-weight: 800; }
        .transfer .money { margin-left: auto; font-weight: 800; white-space: nowrap; }

        .total-line {
            display: flex;
            justify-content: space-between;
            padding: 12px 0 4px;
            font-size: .92rem;
            color: var(--muted);
        }

        .total-line strong { color: var(--text); font-size: 1.05rem; }
    </style>
</head>

<body>
    <a href="../index.html" class="back back-button">← 메인</a>
    <h1>🧾 더치페이 정산기</h1>
    <p class="sub">누가 누구에게 얼마 보내면 끝나는지 계산해 드립니다</p>

    <div class="wrap">
        <!-- 1. 참가자 -->
        <div class="card">
            <h2>1. 참가자</h2>
            <p class="hint">한 줄에 한 명, 또는 쉼표로 구분해 넣으세요.</p>
            <textarea id="members" placeholder="김주희&#10;박지훈&#10;이서연" oninput="onMembersChange()"></textarea>
            <div class="total-line"><span id="member-count">0명</span></div>
        </div>

        <!-- 2. 지출 -->
        <div class="card">
            <h2>2. 쓴 돈 넣기</h2>
            <p class="hint">누가 냈는지 고르고, 그 돈을 나눠 낼 사람을 고릅니다. 기본은 전원입니다.</p>

            <label for="item-name">항목</label>
            <input type="text" id="item-name" placeholder="예: 고깃집, 2차, 택시" maxlength="20">

            <label for="item-amount" style="margin-top:12px">금액 (원)</label>
            <input type="number" id="item-amount" placeholder="0" min="0" step="100" inputmode="numeric">

            <label style="margin-top:12px">낸 사람</label>
            <div class="who-picker" id="payer-picker"></div>

            <label style="margin-top:12px">나눠 낼 사람</label>
            <div class="who-picker" id="sharer-picker"></div>

            <button class="btn" onclick="addExpense()">항목 추가</button>

            <div id="expense-list"></div>
            <div class="total-line" id="expense-total"></div>
        </div>

        <!-- 3. 결과 -->
        <div class="card">
            <h2>3. 정산 결과</h2>
            <p class="hint">금액은 10원 단위로 반올림해 표시합니다. 나누어떨어지지 않는 몇 원은 앞사람이 부담합니다.</p>
            <div class="summary" id="balances"></div>
            <div id="transfers"></div>
            <button class="btn ghost" onclick="copyResult()">📋 결과 복사</button>
        </div>
    </div>

    <script type="application/json" id="game-rules">
{
 "title": "더치페이 정산기",
 "players": "2~20인",
 "time": "약 3분",
 "goal": "여러 명이 섞어 낸 돈을 최소 송금 횟수로 정리합니다.",
 "steps": [
  "참가자 이름을 한 줄에 한 명씩 넣습니다.",
  "항목·금액을 적고, 낸 사람과 나눠 낼 사람을 고른 뒤 추가합니다.",
  "특정 항목을 일부만 나눠 낼 때는 '나눠 낼 사람'에서 해당 인원만 켜면 됩니다.",
  "결과에 누가 누구에게 얼마 보내면 되는지 나옵니다.",
  "복사 버튼으로 단톡방에 그대로 올릴 수 있습니다."
 ],
 "tips": [
  "N빵이 아니라 항목마다 나눌 사람을 따로 정할 수 있습니다. 술 안 마신 사람을 빼는 식입니다.",
  "송금 횟수를 최소로 묶어 주므로 5명이 얽혀도 보통 2~3번이면 끝납니다.",
  "입력한 내용은 이 기기에만 남고 새로고침하면 사라집니다."
 ]
}
</script>

    <script>
        let members = [];
        let expenses = [];        // { name, amount, payer, sharers[] }
        let selectedPayer = null;
        let selectedSharers = new Set();

        const won = (n) => `${Math.round(n).toLocaleString()}원`;
        // 실제 송금은 10원 단위로 하므로, 화면에 보이는 금액은 모두 10원으로 맞춘다.
        // 잔액만 1원 단위로 두면 '667원 낼 돈'인데 '670원 보내기'로 보여 어긋난다.
        const won10 = (n) => `${(Math.round(n / 10) * 10).toLocaleString()}원`;

        // 줄바꿈과 쉼표만 구분자로 쓴다. 공백까지 나누면 "김 주희"가 두 명이 된다.
        function parseMembers() {
            return document.getElementById('members').value
                .split(/[,\n\r]+/)
                .map(n => n.trim())
                .filter(Boolean);
        }

        function onMembersChange() {
            const next = parseMembers();
            const removed = members.filter(m => !next.includes(m));
            members = next;

            // 명단에서 빠진 사람이 낀 항목은 계산이 어긋나므로 함께 지운다.
            if (removed.length) {
                expenses = expenses.filter(e =>
                    !removed.includes(e.payer) && !e.sharers.some(s => removed.includes(s)));
            }
            if (selectedPayer && !members.includes(selectedPayer)) selectedPayer = null;
            selectedSharers = new Set([...selectedSharers].filter(s => members.includes(s)));

            document.getElementById('member-count').textContent = `${members.length}명`;
            renderPickers();
            renderExpenses();
            calculate();
        }

        function renderPickers() {
            const payerBox = document.getElementById('payer-picker');
            const sharerBox = document.getElementById('sharer-picker');
            payerBox.innerHTML = '';
            sharerBox.innerHTML = '';

            if (!members.length) {
                const msg = document.createElement('div');
                msg.className = 'empty';
                msg.textContent = '먼저 참가자를 넣어 주세요.';
                payerBox.appendChild(msg);
                return;
            }

            members.forEach(name => {
                const pay = document.createElement('button');
                pay.className = 'chip payer' + (selectedPayer === name ? ' on' : '');
                pay.textContent = name;
                pay.onclick = () => { selectedPayer = name; renderPickers(); };
                payerBox.appendChild(pay);

                const share = document.createElement('button');
                share.className = 'chip' + (selectedSharers.has(name) ? ' on' : '');
                share.textContent = name;
                share.onclick = () => {
                    selectedSharers.has(name) ? selectedSharers.delete(name) : selectedSharers.add(name);
                    renderPickers();
                };
                sharerBox.appendChild(share);
            });

            const all = document.createElement('button');
            all.className = 'chip';
            all.textContent = selectedSharers.size === members.length ? '전체 해제' : '전체 선택';
            all.onclick = () => {
                selectedSharers = selectedSharers.size === members.length ? new Set() : new Set(members);
                renderPickers();
            };
            sharerBox.appendChild(all);
        }

        function addExpense() {
            const name = document.getElementById('item-name').value.trim() || '항목';
            const amount = Number(document.getElementById('item-amount').value);

            if (members.length < 2) return gameAlert('참가자를 2명 이상 넣어 주세요.');
            if (!Number.isFinite(amount) || amount <= 0) return gameAlert('금액을 넣어 주세요.');
            if (!selectedPayer) return gameAlert('낸 사람을 골라 주세요.');
            if (!selectedSharers.size) return gameAlert('나눠 낼 사람을 한 명 이상 골라 주세요.');

            expenses.push({ name, amount, payer: selectedPayer, sharers: [...selectedSharers] });

            document.getElementById('item-name').value = '';
            document.getElementById('item-amount').value = '';
            renderExpenses();
            calculate();
        }

        function removeExpense(index) {
            expenses.splice(index, 1);
            renderExpenses();
            calculate();
        }

        function renderExpenses() {
            const box = document.getElementById('expense-list');
            box.innerHTML = '';

            if (!expenses.length) {
                const msg = document.createElement('div');
                msg.className = 'empty';
                msg.textContent = '아직 넣은 항목이 없습니다.';
                box.appendChild(msg);
                document.getElementById('expense-total').textContent = '';
                return;
            }

            expenses.forEach((e, i) => {
                const row = document.createElement('div');
                row.className = 'entry';

                const info = document.createElement('div');
                info.className = 'info';
                const title = document.createElement('div');
                title.className = 'title';
                title.textContent = e.name;
                const meta = document.createElement('div');
                meta.className = 'meta';
                const who = e.sharers.length === members.length ? '전원' : e.sharers.join(', ');
                meta.textContent = `${e.payer} 결제 · ${who} ${e.sharers.length}명이 나눔`;
                info.append(title, meta);

                const amount = document.createElement('div');
                amount.className = 'amount';
                amount.textContent = won(e.amount);

                const del = document.createElement('button');
                del.className = 'del';
                del.textContent = '✕';
                del.setAttribute('aria-label', `${e.name} 삭제`);
                del.onclick = () => removeExpense(i);

                row.append(info, amount, del);
                box.appendChild(row);
            });

            const total = expenses.reduce((s, e) => s + e.amount, 0);
            document.getElementById('expense-total').innerHTML = '';
            const left = document.createElement('span');
            left.textContent = `총 ${expenses.length}건`;
            const right = document.createElement('strong');
            right.textContent = won(total);
            document.getElementById('expense-total').append(left, right);
        }

        // ── 정산 ─────────────────────────────────────────
        // 각자의 잔액 = 낸 돈 − 내야 할 돈.
        // 양수면 받을 사람, 음수면 보낼 사람이다.
        function computeBalances() {
            const balance = Object.fromEntries(members.map(m => [m, 0]));

            for (const e of expenses) {
                balance[e.payer] += e.amount;
                // 나누어떨어지지 않는 금액은 앞사람부터 1원씩 더 부담시켜
                // 합계가 정확히 맞도록 한다.
                const base = Math.floor(e.amount / e.sharers.length);
                let remainder = e.amount - base * e.sharers.length;
                for (const s of e.sharers) {
                    balance[s] -= base + (remainder-- > 0 ? 1 : 0);
                }
            }
            return balance;
        }

        // 받을 사람과 보낼 사람을 큰 금액끼리 짝지어 송금 횟수를 줄인다.
        function computeTransfers(balance) {
            const creditors = members.filter(m => balance[m] > 0).map(m => ({ name: m, amt: balance[m] }));
            const debtors = members.filter(m => balance[m] < 0).map(m => ({ name: m, amt: -balance[m] }));
            creditors.sort((a, b) => b.amt - a.amt);
            debtors.sort((a, b) => b.amt - a.amt);

            const result = [];
            let i = 0, j = 0;
            while (i < debtors.length && j < creditors.length) {
                const pay = Math.min(debtors[i].amt, creditors[j].amt);
                if (pay > 0.5) result.push({ from: debtors[i].name, to: creditors[j].name, amount: pay });
                debtors[i].amt -= pay;
                creditors[j].amt -= pay;
                if (debtors[i].amt <= 0.5) i++;
                if (creditors[j].amt <= 0.5) j++;
            }
            return result;
        }

        let lastResult = null;

        function calculate() {
            const balBox = document.getElementById('balances');
            const trBox = document.getElementById('transfers');
            balBox.innerHTML = '';
            trBox.innerHTML = '';
            lastResult = null;

            if (members.length < 2 || !expenses.length) {
                const msg = document.createElement('div');
                msg.className = 'empty';
                msg.textContent = '참가자와 항목을 넣으면 여기에 결과가 나옵니다.';
                balBox.appendChild(msg);
                return;
            }

            const balance = computeBalances();
            members.forEach(name => {
                const row = document.createElement('div');
                row.className = 'bal';
                const who = document.createElement('span');
                who.textContent = name;
                const amt = document.createElement('span');
                const v = balance[name];
                amt.className = 'amt ' + (Math.abs(v) < 1 ? 'zero' : v > 0 ? 'plus' : 'minus');
                amt.textContent = Math.abs(v) < 1 ? '정산 완료' : v > 0 ? `+${won10(v)} 받을 돈` : `−${won10(-v)} 낼 돈`;
                row.append(who, amt);
                balBox.appendChild(row);
            });

            const transfers = computeTransfers(balance);
            if (!transfers.length) {
                const msg = document.createElement('div');
                msg.className = 'empty';
                msg.textContent = '주고받을 돈이 없습니다.';
                trBox.appendChild(msg);
            }
            transfers.forEach(t => {
                const row = document.createElement('div');
                row.className = 'transfer';
                const from = document.createElement('span');
                from.textContent = t.from;
                const arrow = document.createElement('span');
                arrow.className = 'arrow';
                arrow.textContent = '→';
                const to = document.createElement('span');
                to.textContent = t.to;
                const money = document.createElement('span');
                money.className = 'money';
                money.textContent = won10(t.amount);
                row.append(from, arrow, to, money);
                trBox.appendChild(row);
            });

            lastResult = { balance, transfers };
        }

        function copyResult() {
            if (!lastResult || !lastResult.transfers.length) {
                return gameAlert('먼저 참가자와 항목을 넣어 주세요.');
            }
            const total = expenses.reduce((s, e) => s + e.amount, 0);
            const lines = lastResult.transfers
                .map(t => `· ${t.from} → ${t.to}  ${won10(t.amount)}`);
            const text =
                `🧾 정산 결과 (총 ${won(total)}, ${members.length}명)\n\n` +
                lines.join('\n') +
                `\n\n위 대로 보내면 정산이 끝납니다.`;

            navigator.clipboard.writeText(text)
                .then(() => gameAlert('결과를 복사했습니다. 단톡방에 붙여넣어 보세요!'))
                .catch(() => gameAlert('복사에 실패했습니다. 화면을 직접 캡처해 주세요.'));
        }

        onMembersChange();
    </script>
</body>

</html>
