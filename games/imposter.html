<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>네온 고스트 - 미니게임 천국</title>
<link rel="stylesheet" href="../styles/game-common.css?v=2">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0f172a;font-family:'Outfit',sans-serif;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
.back{position:absolute;top:20px;left:20px;z-index:10}
h1{font-size:1.8rem;margin:40px 0 5px;background:linear-gradient(135deg,#6366f1,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.setup{text-align:center;width:90%;max-width:400px}
.setup input{width:80%;padding:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.15);border-radius:12px;color:#fff;font-size:1rem;font-family:inherit;margin:10px 0}
.btn{background:linear-gradient(135deg,#6366f1,#8b5cf6);border:none;color:#fff;padding:14px 50px;font-size:1.2rem;font-weight:700;border-radius:50px;cursor:pointer;margin:10px 0}
.word-screen{display:none;text-align:center;width:90%;max-width:400px;margin-top:30px}
.word-card{background:rgba(255,255,255,.05);padding:50px 30px;border-radius:30px;border:2px solid rgba(99,102,241,.3);margin:20px 0}
.word-text{font-size:3rem;font-weight:900}
.ghost-text{font-size:2rem;color:#ff4757}
.player-label{font-size:1.5rem;font-weight:700;color:#a78bfa;margin-bottom:10px}
.pass-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(15,23,42,.98);z-index:50;flex-direction:column;align-items:center;justify-content:center}
.vote-screen{display:none;text-align:center;width:90%;max-width:400px}
.vote-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}
.vote-btn{padding:16px;border-radius:16px;background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.1);color:#fff;font-size:1.1rem;font-weight:700;cursor:pointer;transition:all .3s}
.vote-btn:hover{border-color:#8b5cf6;background:rgba(139,92,246,.1)}
.result-screen{display:none;text-align:center}
.result-screen .big{font-size:2.5rem;font-weight:900;margin:20px 0}
</style>
</head>
<body>
<a href="../index.html" class="back back-button">← 메인</a>
<h1>👻 네온 고스트</h1>
<div class="setup" id="setup">
<p style="color:#94a3b8;margin:15px 0">참가자 수를 입력하세요 (3~30명)</p>
<input id="count" type="number" placeholder="참가자 수" min="3" max="30" value="4">
<br><button class="btn" onclick="startGame()">시작!</button>
</div>
<div class="pass-overlay" id="pass-overlay">
<p style="font-size:1.5rem;color:#94a3b8">📱 다음 사람에게 넘기세요</p>
<p id="pass-label" style="font-size:2rem;font-weight:800;margin:15px 0"></p>
<button class="btn" onclick="showWord()">확인하기 (혼자 보세요!)</button>
</div>
<div class="word-screen" id="word-screen">
<div class="player-label" id="player-label"></div>
<div class="word-card"><div class="word-text" id="word-text"></div></div>
<p style="color:#94a3b8">기억했으면 다음으로 넘기세요!</p>
<button class="btn" onclick="nextPlayer()">확인 완료</button>
</div>
<div class="vote-screen" id="vote-screen">
<h2 id="vote-title" style="font-size:2rem;margin:20px 0">🗳️ 고스트는 누구?</h2>
<p style="color:#94a3b8;margin-bottom:15px">토론이 끝나면 한 명씩 폰을 넘기며 투표하세요! (본인은 선택 불가)</p>
<div class="vote-grid" id="vote-grid"></div>
</div>
<div class="result-screen" id="result-screen">
<div class="big" id="result-text"></div>
<p id="answer-text" style="color:#94a3b8;font-size:1.2rem"></p>
<button class="btn" onclick="location.reload()">다시 하기</button>
</div>
<script>
// 고스트는 제시어 대신 카테고리만 본다. 아무 정보도 없으면 첫 발언에서 바로 걸려
// 블러핑 자체가 성립하지 않기 때문이다.
const wordSets=[
{cat:'음식',words:['피자','햄버거','초콜릿','케이크','라면','김밥','치킨','아이스크림','떡볶이','샌드위치']},
{cat:'과일',words:['사과','바나나','수박','딸기','포도','귤','복숭아','참외','망고','키위']},
{cat:'탈것',words:['자동차','비행기','지하철','자전거','버스','오토바이','기차','배','헬리콥터','택시']},
{cat:'동물',words:['고양이','강아지','코끼리','펭귄','기린','호랑이','토끼','돌고래','원숭이','다람쥐']},
{cat:'집안 물건',words:['선풍기','냉장고','시계','소파','칫솔','베개','거울','전자레인지','청소기','옷걸이']},
{cat:'몸에 걸치는 것',words:['운동화','장갑','선글라스','목도리','모자','우산','반지','넥타이','배낭','시계줄']},
{cat:'장소',words:['바다','도서관','놀이공원','편의점','영화관','공항','캠핑장','목욕탕','운동장','카페']},
{cat:'취미·도구',words:['기타','노트북','카메라','텐트','피아노','드론','붓','낚싯대','보드게임','헤드폰']}
];
let total=4,ghostIdx=-1,currentPlayer=0,theWord='',theCategory='',votes=[],voteCounts=[];
function startGame(){
total=Math.min(30,Math.max(3,+document.getElementById('count').value||4));
ghostIdx=Math.floor(Math.random()*total);
const set=wordSets[Math.floor(Math.random()*wordSets.length)];
theCategory=set.cat;
theWord=set.words[Math.floor(Math.random()*set.words.length)];
currentPlayer=0;votes=[];voteCounts=Array(total).fill(0);
document.getElementById('setup').style.display='none';
passToNext();
}
function passToNext(){
document.getElementById('word-screen').style.display='none';
document.getElementById('pass-overlay').style.display='flex';
document.getElementById('pass-label').textContent=`플레이어 ${currentPlayer+1}`;
}
function showWord(){
document.getElementById('pass-overlay').style.display='none';
document.getElementById('word-screen').style.display='block';
document.getElementById('player-label').textContent=`플레이어 ${currentPlayer+1}`;
if(currentPlayer===ghostIdx){
document.getElementById('word-text').innerHTML=`당신은 고스트!<br><span style="font-size:1.1rem;font-weight:600;opacity:.85">카테고리: ${theCategory}</span>`;
document.getElementById('word-text').className='word-text ghost-text';
}else{
document.getElementById('word-text').innerHTML=`${theWord}<br><span style="font-size:1.1rem;font-weight:600;opacity:.6">카테고리: ${theCategory}</span>`;
document.getElementById('word-text').className='word-text';
}
}
function nextPlayer(){
currentPlayer++;
if(currentPlayer>=total){startVoting();return}
passToNext();
}
function startVoting(){
document.getElementById('word-screen').style.display='none';
document.getElementById('pass-overlay').style.display='none';
document.getElementById('vote-screen').style.display='block';
currentPlayer=0;
renderVote();
}
function renderVote(){
document.getElementById('vote-title').textContent=`🗳️ 플레이어 ${currentPlayer+1}의 투표`;
const grid=document.getElementById('vote-grid');
grid.innerHTML='';
for(let i=0;i<total;i++){
const btn=document.createElement('button');btn.className='vote-btn';
btn.textContent=`플레이어 ${i+1}`;
if(i===currentPlayer){btn.disabled=true;btn.style.opacity='.35';btn.textContent+=' (본인)';}
else btn.onclick=()=>castVote(i);
grid.appendChild(btn);
}
}
function castVote(target){
votes.push(target);voteCounts[target]++;
currentPlayer++;
if(currentPlayer>=total){showResult();return}
renderVote();
}
function showResult(){
document.getElementById('vote-screen').style.display='none';
document.getElementById('result-screen').style.display='block';
const max=Math.max(...voteCounts);
const top=voteCounts.map((c,i)=>[c,i]).filter(([c])=>c===max).map(([,i])=>i);
const caught=top.length===1&&top[0]===ghostIdx;
if(caught){
document.getElementById('result-text').innerHTML='<span style="color:#2ed573">🎉 고스트를 찾았습니다!</span>';
}else if(top.length>1){
document.getElementById('result-text').innerHTML='<span style="color:#ffa502">🤝 동표! 고스트가 살아남았습니다</span>';
}else{
document.getElementById('result-text').innerHTML='<span style="color:#ff4757">😈 고스트가 생존했습니다!</span>';
}
const tally=voteCounts.map((c,i)=>`P${i+1}:${c}표`).join(' · ');
document.getElementById('answer-text').innerHTML=
`고스트: 플레이어 ${ghostIdx+1} · 제시어: ${theWord} (${theCategory})<br><span style="font-size:.95rem;opacity:.8">개표 — ${tally}</span>`;
}
</script>
    <script type="application/json" id="game-rules">
{
 "title": "네온 고스트",
 "goal": "제시어를 모르는 고스트 한 명을 찾아내세요.",
 "steps": [
  "참가자 수를 정하고 폰을 돌려가며 각자 혼자 화면을 봅니다.",
  "대부분은 제시어를, 고스트 한 명은 카테고리만 봅니다.",
  "돌아가며 제시어를 직접 말하지 않고 한 마디씩 설명합니다.",
  "토론 후 한 명씩 폰을 넘기며 고스트라고 생각하는 사람에게 투표합니다.",
  "최다 득표자가 고스트면 승리, 아니거나 동표면 고스트가 살아남습니다."
 ],
 "tips": [
  "고스트는 카테고리를 단서로 아는 척 섞여 들어가야 합니다.",
  "너무 정확히 설명하면 자기가 고스트가 아님을 증명하다 제시어를 흘립니다."
 ],
 "players": "3~30인",
 "time": "약 10분"
}
</script>
<script src="../scripts/game-common.js?v=2"></script>
</body>
</html>
