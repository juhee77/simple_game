<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wi-Fi & QR 생성기 | 미니게임 천국</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --bg: #0b0b1a;
      --card-bg: rgba(22, 22, 45, 0.7);
      --card-border: rgba(255, 255, 255, 0.1);
      --cyan: #00d4ff;
      --purple: #7c3aed;
      --pink: #ff006e;
      --yellow: #ffd166;
      --green: #06d6a0;
      --text-main: #ffffff;
      --text-dim: #94a3b8;
      --radius-card: 16px;
      --radius-btn: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Outfit', 'Pretendard', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 10px 0;
    }

    .back-btn {
      position: absolute;
      left: 0;
      background: none;
      border: none;
      color: var(--cyan);
      font-size: 24px;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      transition: background 0.2s;
    }

    .back-btn:hover { background: rgba(0, 212, 255, 0.1); }

    h1 {
      font-size: 24px;
      font-weight: 800;
      background: linear-gradient(90deg, var(--cyan), var(--purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(10px);
      border-radius: var(--radius-card);
      padding: 20px;
    }

    .tab-row {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .tab-btn {
      flex: 1;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--card-border);
      color: var(--text-dim);
      padding: 10px;
      border-radius: var(--radius-btn);
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }

    .tab-btn.active {
      background: rgba(0, 212, 255, 0.15);
      border-color: var(--cyan);
      color: var(--cyan);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    input, select {
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--card-border);
      color: white;
      padding: 12px 16px;
      border-radius: var(--radius-btn);
      font-family: inherit;
      font-size: 15px;
      outline: none;
    }

    input:focus, select:focus { border-color: var(--cyan); }

    .generate-btn {
      background: linear-gradient(135deg, var(--cyan), var(--purple));
      border: none;
      color: white;
      padding: 14px;
      border-radius: var(--radius-btn);
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    .qr-result {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-top: 20px;
      padding: 24px;
      background: rgba(0, 0, 0, 0.4);
      border-radius: var(--radius-card);
      border: 1px dashed var(--cyan);
    }

    #qrcode-container {
      background: white;
      padding: 16px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qr-info-text {
      text-align: center;
      font-size: 14px;
      color: var(--text-dim);
    }

    .qr-info-text strong { color: white; }

    .download-btn {
      background: #2a2a4a;
      border: 1px solid var(--card-border);
      color: white;
      padding: 12px 20px;
      border-radius: var(--radius-btn);
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }

    .help-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      cursor: pointer;
      border: 1px solid var(--card-border);
      z-index: 100;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-content {
      background: var(--bg);
      border: 1px solid var(--card-border);
      padding: 24px;
      border-radius: var(--radius-card);
      max-width: 400px;
      width: 100%;
    }

    .modal h2 { margin-bottom: 16px; color: var(--cyan); }
    .modal p { margin-bottom: 12px; line-height: 1.5; color: var(--text-dim); }
    .close-modal { margin-top: 16px; width: 100%; padding: 12px; background: var(--purple); border: none; border-radius: 8px; color: white; cursor: pointer; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <a href="../index.html" class="back-btn">←</a>
      <h1>Wi-Fi & QR 생성기</h1>
    </header>

    <div class="card">
      <div class="tab-row">
        <button class="tab-btn active" onclick="setMode('wifi')">📶 와이파이 QR</button>
        <button class="tab-btn" onclick="setMode('url')">🔗 주소/텍스트 QR</button>
      </div>

      <div class="form-group" id="wifi-form">
        <input type="text" id="wifiSsid" placeholder="Wi-Fi 이름 (SSID)" autocomplete="off">
        <input type="password" id="wifiPass" placeholder="Wi-Fi 비밀번호">
        <select id="wifiType">
          <option value="WPA">보안 타입: WPA/WPA2 (일반적)</option>
          <option value="WEP">보안 타입: WEP</option>
          <option value="nopass">보안 없음 (공용)</option>
        </select>
      </div>

      <div class="form-group" id="url-form" style="display: none;">
        <input type="text" id="urlInput" placeholder="URL 주소 또는 텍스트 입력 (예: https://...)">
      </div>

      <button class="generate-btn" onclick="generateQR()">QR 코드 즉시 생성</button>

      <div class="qr-result" id="qrResult">
        <div id="qrcode-container"></div>
        <div class="qr-info-text" id="qrInfoText">스마트폰 카메라로 스캔하세요</div>
        <button class="download-btn" onclick="downloadQR()">📥 QR 코드 이미지 저장</button>
      </div>
    </div>
  </div>

  <div class="help-btn" id="helpBtn">?</div>

  <div class="modal" id="helpModal">
    <div class="modal-content">
      <h2>이용 방법</h2>
      <p>1. <strong>Wi-Fi QR</strong>: Wi-Fi 이름과 암호를 입력하면 스마트폰 카메라 스캔 한 번으로 비밀번호 입력 없이 즉시 연결할 수 있는 QR이 생성됩니다.</p>
      <p>2. <strong>URL/텍스트 QR</strong>: 카카오톡 오픈채팅, 링크, 문구를 담은 QR코드를 바로 만듭니다.</p>
      <button class="close-modal" id="closeHelpBtn">닫기</button>
    </div>
  </div>

  <script>
    let mode = 'wifi';
    let qrcodeObj = null;

    function setMode(m) {
      mode = m;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (m === 'wifi') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('wifi-form').style.display = 'flex';
        document.getElementById('url-form').style.display = 'none';
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('wifi-form').style.display = 'none';
        document.getElementById('url-form').style.display = 'flex';
      }
      document.getElementById('qrResult').style.display = 'none';
    }

    function generateQR() {
      let qrText = '';
      let infoLabel = '';

      if (mode === 'wifi') {
        const ssid = document.getElementById('wifiSsid').value.trim();
        const pass = document.getElementById('wifiPass').value;
        const type = document.getElementById('wifiType').value;

        if (!ssid) {
          alert('Wi-Fi 이름을 입력해주세요.');
          return;
        }

        qrText = `WIFI:S:${ssid};T:${type};P:${pass};;`;
        infoLabel = `📶 <strong>${ssid}</strong> Wi-Fi 스캔 전용 QR`;
      } else {
        const url = document.getElementById('urlInput').value.trim();
        if (!url) {
          alert('URL 또는 텍스트를 입력해주세요.');
          return;
        }
        qrText = url;
        infoLabel = `🔗 <strong>${url.length > 25 ? url.substring(0, 25) + '...' : url}</strong>`;
      }

      const container = document.getElementById('qrcode-container');
      container.innerHTML = '';

      qrcodeObj = new QRCode(container, {
        text: qrText,
        width: 200,
        height: 200,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });

      document.getElementById('qrInfoText').innerHTML = infoLabel;
      document.getElementById('qrResult').style.display = 'flex';
    }

    function downloadQR() {
      const img = document.querySelector('#qrcode-container img');
      const canvas = document.querySelector('#qrcode-container canvas');

      let dataUrl = '';
      if (img && img.src) dataUrl = img.src;
      else if (canvas) dataUrl = canvas.toDataURL("image/png");

      if (!dataUrl) return;

      const a = document.createElement('a');
      a.href = dataUrl;
      a.download = `qrcode_${Date.now()}.png`;
      a.click();
    }

    const helpBtn = document.getElementById('helpBtn');
    const helpModal = document.getElementById('helpModal');
    const closeHelpBtn = document.getElementById('closeHelpBtn');
    helpBtn.addEventListener('click', () => helpModal.style.display = 'flex');
    closeHelpBtn.addEventListener('click', () => helpModal.style.display = 'none');
  </script>
</body>
</html>
