      if (!files.length) return;

      const parcels = [];
      const bad = [];
      for (const f of files) {
        try {
          const parsed = parseTripFile(await f.text());
          if (parsed && parsed.spots.length) parcels.push(parsed); else bad.push(f.name);
        } catch {
          bad.push(f.name);
        }
      }
      if (!parcels.length) {
        alert('여행 동선 지도에서 내보낸 파일이 아니에요.' + (bad.length ? `\n(${bad.join(', ')})` : ''));
        return;
      }

      // 중복(같은 사진) 빼기
      const have = new Set(allSpots().map(sp => sp.id).filter(Boolean));
      let dup = 0;
      parcels.forEach(p => {
        p.spots = p.spots.filter(sp => {
          if (have.has(sp.id)) { dup++; return false; }
          have.add(sp.id);
          return true;
        });
      });

      const lines = parcels.map(p => {
        const ts = p.spots.map(sp => sp.timeVal).sort((a, b) => a - b);
        const period = ts.length ? `${todayKey(new Date(ts[0])).slice(5)} ~ ${todayKey(new Date(ts[ts.length - 1])).slice(5)}` : '';
        return `👤 ${p.author} · ${p.spots.length}장 ${period}`;
      });
      const incoming = parcels.reduce((n, p) => n + p.spots.length, 0);
      if (!incoming) { alert(`새로 합칠 사진이 없어요. (이미 있는 사진 ${dup}장)`); return; }

      // 50장 제한: 넘으면 사람마다 비율대로, 각자 시간 순서에서 고르게 고른다
      const room = MAX_SPOTS - allSpots().length;
      if (room <= 0) { alert(`이미 ${MAX_SPOTS}장이 차 있어요. 목록에서 사진을 지운 뒤 다시 불러와 주세요. (👤 이름으로 끈 사진도 장수에 포함돼요)`); return; }
      let note = '';
      if (incoming > room) {
        let left = room;
        parcels.forEach((p, i) => {
          const share = i === parcels.length - 1 ? left : Math.min(left, Math.round(room * p.spots.length / incoming));
          const sorted = p.spots.sort((a, b) => a.timeVal - b.timeVal);
          p.spots = share >= sorted.length ? sorted
            : Array.from({ length: share }, (_, k) => sorted[Math.floor(k * sorted.length / share)]);
          left -= p.spots.length;
        });
        note = `\n\n최대 ${MAX_SPOTS}장이라 ${incoming}장 중 ${room}장만 사람별로 고르게 골라 넣어요.`;
      }
      if (!confirm(`이 조각을 합칠까요?\n\n${lines.join('\n')}` + (dup ? `\n\n같은 사진 ${dup}장은 빼요.` : '') + note + (bad.length ? `\n\n읽을 수 없는 파일: ${bad.join(', ')}` : ''))) return;

      let added = 0;
      parcels.forEach(p => p.spots.forEach(sp => {
        if (hiddenAuthors.has(sp.author)) hiddenSpots.push(sp);
        else (sp.loc === 'none' ? unplacedSpots : travelSpots).push(sp);
        added++;
      }));
      stopTourAnimation();
      applySortMode(currentSortMode === 'custom' ? 'time-asc' : currentSortMode);
      alert(`${added}장을 합쳤어요.` + (unplacedSpots.length ? ` 위치 없는 사진 ${unplacedSpots.length}장은 위치를 넣어 주세요.` : ''));
    }

    // 마지막 사진까지 지우면 예전 지도·목록이 그대로 남아 있지 않게 화면을 처음 상태로 돌린다
    function clearTripUI() {
      cancelMapPick();
      ['tripStatsBar', 'sortToolbar', 'mapSection', 'timelineCard', 'unplacedCard'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.style.display = 'none';
      });
      if (leafletMap) {
        mapMarkers.forEach(m => leafletMap.removeLayer(m));
        [routeGlow, routePolyline, tourProgressLine, tourVehicleMarker].forEach(l => { if (l) leafletMap.removeLayer(l); });
      }
      mapMarkers = [];
      document.getElementById('routeList').innerHTML = '';
      const gifBox = document.getElementById('gifResultBox');
      if (gifBox) gifBox.style.display = 'none';
    }

    // ==========================================
    // Real Map Smooth Journey Tracking Tour
    // ==========================================
    function setTransportMode(mode, el) {
      tourState.vehicleIcon = mode;
      document.querySelectorAll('.transport-pill-group .dock-pill-btn').forEach(b => b.classList.remove('active'));
      if (el) el.classList.add('active');

      if (tourVehicleMarker) {
        const sprite = tourVehicleMarker.getElement()?.querySelector('.vehicle-icon-sprite');
        if (sprite) sprite.textContent = mode;
      }
    }

    function setTourSpeed(speed, el) {
      tourState.speed = speed;
      document.querySelectorAll('.speed-pill-group .dock-pill-btn').forEach(b => b.classList.remove('active'));
      if (el) el.classList.add('active');
    }

    function createVehicleMarker(lat, lng) {
      if (tourVehicleMarker) {
        leafletMap.removeLayer(tourVehicleMarker);
      }
      const vehicleHtml = `
        <div class="vehicle-marker-wrapper">
          <div class="vehicle-pulse-ring"></div>
          <div class="vehicle-icon-sprite">${tourState.vehicleIcon}</div>
        </div>
      `;
      const icon = L.divIcon({
        className: 'vehicle-div-icon',
        html: vehicleHtml,
        iconSize: [44, 44],
        iconAnchor: [22, 22]
      });
      tourVehicleMarker = L.marker([lat, lng], { icon: icon, zIndexOffset: 2000 }).addTo(leafletMap);
    }

    function toggleMapTourAnimation() {
      if (travelSpots.length < 2) {
        alert('동선 투어를 시작하려면 최소 2개 이상의 여행 스팟이 필요합니다.');
        return;
      }

      if (!tourState.isRunning) {
        // Start fresh
        tourState.isRunning = true;
        tourState.isPaused = false;
        tourState.currentSegment = 0;
        tourState.segmentProgress = 0;
        document.getElementById('btnTourText').textContent = '⏸ 멈춤';

        createVehicleMarker(travelSpots[0].lat, travelSpots[0].lng);
        tourProgressLine.setLatLngs([[travelSpots[0].lat, travelSpots[0].lng]]);
        leafletMap.setView([travelSpots[0].lat, travelSpots[0].lng], 13);
        if (mapMarkers[0]) mapMarkers[0].openPopup();

        setTimeout(() => {
          if (tourState.isRunning && !tourState.isPaused) {
            tourState.lastTickTime = performance.now();
            tourState.animFrameId = requestAnimationFrame(tourAnimationLoop);
          }
        }, 1200 / tourState.speed);
      } else if (tourState.isPaused) {
        // Resume
        tourState.isPaused = false;
        document.getElementById('btnTourText').textContent = '⏸ 멈춤';
        tourState.lastTickTime = performance.now();
        tourState.animFrameId = requestAnimationFrame(tourAnimationLoop);
      } else {
        // Pause
        tourState.isPaused = true;
        document.getElementById('btnTourText').textContent = '▶ 계속';
        if (tourState.animFrameId) cancelAnimationFrame(tourState.animFrameId);
      }
    }

    function stopTourAnimation() {
      tourState.isRunning = false;
      tourState.isPaused = false;
      tourState.currentSegment = 0;
      tourState.segmentProgress = 0;
      if (tourState.animFrameId) cancelAnimationFrame(tourState.animFrameId);
      document.getElementById('btnTourText').textContent = '▶ 투어';

      if (tourVehicleMarker) {
        leafletMap.removeLayer(tourVehicleMarker);
        tourVehicleMarker = null;
      }
      if (tourProgressLine) {
        tourProgressLine.setLatLngs([]);
      }
      fitAllMarkers();
    }

    function tourAnimationLoop(now) {
      if (!tourState.isRunning || tourState.isPaused) return;

      const deltaMs = Math.min(now - (tourState.lastTickTime || now), 100);
      tourState.lastTickTime = now;

      const segIdx = tourState.currentSegment;
      if (segIdx >= travelSpots.length - 1) {
        // Completed
        tourState.isRunning = false;
        document.getElementById('btnTourText').textContent = '▶ 다시';
        if (mapMarkers[travelSpots.length - 1]) mapMarkers[travelSpots.length - 1].openPopup();
        setTimeout(fitAllMarkers, 2000);
        return;
      }

      const p1 = travelSpots[segIdx];
      const p2 = travelSpots[segIdx + 1];

      // Segment duration scaled by distance (approx 1.8s base, scaled by speed)
      const dist = calcDistanceKm(p1.lat, p1.lng, p2.lat, p2.lng);
      const segmentBaseDuration = Math.min(Math.max(dist * 60, 1800), 4000); // ms
      const effectiveDuration = segmentBaseDuration / tourState.speed;

      tourState.segmentProgress += deltaMs / effectiveDuration;

      if (tourState.segmentProgress >= 1.0) {
        // Reached waypoint p2!
        tourState.segmentProgress = 0;
        tourState.currentSegment++;

        // Snap vehicle to p2
        tourVehicleMarker.setLatLng([p2.lat, p2.lng]);
        updateProgressLine(tourState.currentSegment, p2.lat, p2.lng);

        if (mapMarkers[tourState.currentSegment]) {
          mapMarkers[tourState.currentSegment].openPopup();
        }

        // Waypoint scenic pause
        setTimeout(() => {
          if (tourState.isRunning && !tourState.isPaused) {
            tourState.lastTickTime = performance.now();
            tourState.animFrameId = requestAnimationFrame(tourAnimationLoop);
          }
        }, 1100 / tourState.speed);
        return;
      }

      // Smooth interpolation between p1 and p2
      const t = tourState.segmentProgress;
      // Gentle ease-in-out
      const easeT = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;

      const curLat = p1.lat + (p2.lat - p1.lat) * easeT;
      const curLng = p1.lng + (p2.lng - p1.lng) * easeT;

      // Calculate bearing angle for vehicle rotation
      const dLng = p2.lng - p1.lng;
      const dLat = p2.lat - p1.lat;
      const bearingDeg = (Math.atan2(dLng, dLat) * 180 / Math.PI);

      if (tourVehicleMarker) {
        tourVehicleMarker.setLatLng([curLat, curLng]);
        const sprite = tourVehicleMarker.getElement()?.querySelector('.vehicle-icon-sprite');
        if (sprite) {
          // Flight icon orientation offset
          const rotOffset = tourState.vehicleIcon === '✈️' ? -45 : 0;
          sprite.style.transform = `rotate(${bearingDeg + rotOffset}deg)`;
        }
      }

      // Update progressive track line
      updateProgressLine(tourState.currentSegment, curLat, curLng);

      // Smooth pan map along vehicle
      leafletMap.panTo([curLat, curLng], { animate: false });

      tourState.animFrameId = requestAnimationFrame(tourAnimationLoop);
    }

    function updateProgressLine(completedSegments, curLat, curLng) {
      if (!tourProgressLine) return;
      const pts = [];
      for (let i = 0; i <= completedSegments; i++) {
        pts.push([travelSpots[i].lat, travelSpots[i].lng]);
      }
      pts.push([curLat, curLng]);
      tourProgressLine.setLatLngs(pts);
    }

    // ==========================================
    // Real Satellite Map Tiles & Export Engine
    // ==========================================
    // Mercator tile math
    function lon2tile(lon, zoom) {
      return Math.floor((lon + 180) / 360 * Math.pow(2, zoom));
    }
    function lat2tile(lat, zoom) {
      const rad = lat * Math.PI / 180;
      return Math.floor((1 - Math.log(Math.tan(rad) + 1 / Math.cos(rad)) / Math.PI) / 2 * Math.pow(2, zoom));
    }
    function projectMercator(lat, lng, zoom) {
      const sin = Math.min(Math.max(Math.sin(lat * Math.PI / 180), -0.9999), 0.9999);
      const x = 256 * (0.5 + lng / 360) * Math.pow(2, zoom);
      const y = 256 * (0.5 - Math.log((1 + sin) / (1 - sin)) / (4 * Math.PI)) * Math.pow(2, zoom);
      return { x, y };
    }

    async function loadTileImage(url) {
      return new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => resolve(img);
        img.onerror = () => resolve(null);
        setTimeout(() => resolve(null), 8000);
        img.src = url;
      });
    }

    // High-fidelity Basemap Renderer (Captures real satellite tiles from DOM or network)
    async function renderBasemapToCanvas(bCtx, w, h) {
      const mapEl = document.getElementById('realMap');
      let domCapturedCount = 0;

      // Base background
      bCtx.fillStyle = currentMapStyleKey === 'osm' ? '#e2e8f0' : '#08111e';
      bCtx.fillRect(0, 0, w, h);

      // 1. Direct screen capture from Leaflet's rendered DOM tiles (Instant, zero-lag, 100% WYSIWYG)
      if (mapEl) {
        const mapRect = mapEl.getBoundingClientRect();
        const domTiles = Array.from(mapEl.querySelectorAll('img.leaflet-tile'));
        const scaleX = w / (mapRect.width || 1);
        const scaleY = h / (mapRect.height || 1);

        domTiles.forEach(img => {
          if (img.complete && img.naturalWidth > 0) {
            const r = img.getBoundingClientRect();
            const dx = Math.round((r.left - mapRect.left) * scaleX);
            const dy = Math.round((r.top - mapRect.top) * scaleY);
            const dw = Math.round(r.width * scaleX) + 1;
            const dh = Math.round(r.height * scaleY) + 1;
            try {
              bCtx.drawImage(img, dx, dy, dw, dh);
              domCapturedCount++;
            } catch (e) {
              // Ignore CORS taint if any
            }
          }
        });
      }

      if (domCapturedCount >= 4) {
        return { usedDom: true };
      }

      // 2. Network Fetch fallback using current map style
      let minLat = Infinity, maxLat = -Infinity, minLng = Infinity, maxLng = -Infinity;
      travelSpots.forEach(s => {
        if (s.lat < minLat) minLat = s.lat;
        if (s.lat > maxLat) maxLat = s.lat;
        if (s.lng < minLng) minLng = s.lng;
        if (s.lng > maxLng) maxLng = s.lng;
      });

      let bestZoom = 11;
      for (let z = 14; z >= 4; z--) {
        const pMin = projectMercator(maxLat, minLng, z);
        const pMax = projectMercator(minLat, maxLng, z);
        const spanX = Math.abs(pMax.x - pMin.x);
        const spanY = Math.abs(pMax.y - pMin.y);
        if (spanX <= w * 0.75 && spanY <= h * 0.75) {
          bestZoom = z;
          break;
        }
      }

      const pCenter = projectMercator((minLat + maxLat) / 2, (minLng + maxLng) / 2, bestZoom);
      const minTileX = lon2tile(minLng, bestZoom) - 1;
      const maxTileX = lon2tile(maxLng, bestZoom) + 1;
      const minTileY = Math.min(lat2tile(maxLat, bestZoom), lat2tile(minLat, bestZoom)) - 1;
      const maxTileY = Math.max(lat2tile(maxLat, bestZoom), lat2tile(minLat, bestZoom)) + 1;

      const tilePromises = [];
      for (let tx = minTileX; tx <= maxTileX; tx++) {
        for (let ty = minTileY; ty <= maxTileY; ty++) {
          let tileUrl = '';
          if (currentMapStyleKey === 'osm') {
            tileUrl = `https://tile.openstreetmap.org/${bestZoom}/${tx}/${ty}.png`;
          } else if (currentMapStyleKey === 'topo') {
            tileUrl = `https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/${bestZoom}/${ty}/${tx}`;
          } else {
            tileUrl = `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${bestZoom}/${ty}/${tx}`;
          }

          tilePromises.push((async () => {
            const img = await loadTileImage(tileUrl);
            return { img, tx, ty };
          })());
        }
      }

      const loadedTiles = await Promise.all(tilePromises);
      let successTileCount = 0;

      loadedTiles.forEach(({ img, tx, ty }) => {
        if (!img) return;
        successTileCount++;
        const tileWorldX = tx * 256;
        const tileWorldY = ty * 256;
        const dx = Math.round(w / 2 + (tileWorldX - pCenter.x));
        const dy = Math.round(h / 2 + (tileWorldY - pCenter.y));
        try {
          bCtx.drawImage(img, dx, dy, 257, 257);
        } catch (e) {}
      });

      if (successTileCount === 0 && domCapturedCount === 0) {
        // Fallback: stylish dark topo radar
        bCtx.fillStyle = '#0b1329';
        bCtx.fillRect(0, 0, w, h);
        bCtx.strokeStyle = 'rgba(6, 182, 212, 0.15)';
        bCtx.lineWidth = 1;
        for (let x = 0; x < w; x += 35) { bCtx.beginPath(); bCtx.moveTo(x, 0); bCtx.lineTo(x, h); bCtx.stroke(); }
        for (let y = 0; y < h; y += 35) { bCtx.beginPath(); bCtx.moveTo(0, y); bCtx.lineTo(w, y); bCtx.stroke(); }
      }

      return { usedDom: false, bestZoom, pCenter };
    }

    // 1. Export High-Res Map Image (PNG 저장)
    async function exportMapImage() {
      if (travelSpots.length === 0) return;

      const alertEl = document.getElementById('statusAlert');
      alertEl.style.display = 'block';
      alertEl.textContent = '⏳ 현재 화면의 고화질 위성 지도 사진(PNG)을 생성하는 중입니다...';

      const mapEl = document.getElementById('realMap');
      const w = 1200, h = 850;
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');

      // 1. Draw Real Map Basemap
      const basemapInfo = await renderBasemapToCanvas(ctx, w, h);

      // 2. Map coordinates of spots
      const mapRect = mapEl.getBoundingClientRect();
      const scaleX = w / (mapRect.width || 1);
      const scaleY = h / (mapRect.height || 1);

      const pts = travelSpots.map(s => {
        if (leafletMap && basemapInfo.usedDom) {
          const pt = leafletMap.latLngToContainerPoint([s.lat, s.lng]);
          return { x: pt.x * scaleX, y: pt.y * scaleY, spot: s };
        } else if (basemapInfo.bestZoom) {
          const p = projectMercator(s.lat, s.lng, basemapInfo.bestZoom);
          return {
            x: w / 2 + (p.x - basemapInfo.pCenter.x),
            y: h / 2 + (p.y - basemapInfo.pCenter.y),
            spot: s
          };
        }
        return { x: w / 2, y: h / 2, spot: s };
      });

      // 3. Draw Route Polyline
      if (pts.length >= 2) {
        ctx.strokeStyle = '#10b981';
        ctx.lineWidth = 6;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);
        for (let i = 1; i < pts.length; i++) {
          ctx.lineTo(pts[i].x, pts[i].y);
        }
        ctx.stroke();
      }

      // 4. Preload photos for pins (핀은 작으므로 썸네일로 충분하다)
      const loadedImgs = await Promise.all(travelSpots.map(s => {
        return new Promise(res => {
          const img = new Image();
          img.onload = () => res(img);
          img.onerror = () => res(null);
          img.src = s.thumbUrl || s.dataUrl;
        });
      }));

      // 5. Draw Pins with Thumbnails
      pts.forEach((p, idx) => {
        const radius = 26;
        const img = loadedImgs[idx];

        ctx.save();
        ctx.shadowColor = 'rgba(0,0,0,0.6)';
        ctx.shadowBlur = 14;
        ctx.shadowOffsetY = 6;

        ctx.beginPath();
        ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
        ctx.fillStyle = '#0f172a';
        ctx.fill();
        ctx.strokeStyle = frameColor(p.spot, idx);
        ctx.lineWidth = 4;
        ctx.stroke();

        if (img) {
          ctx.clip();
          ctx.drawImage(img, p.x - radius, p.y - radius, radius * 2, radius * 2);
        }
        ctx.restore();

        // Pin badge number
        ctx.beginPath();
        ctx.arc(p.x + radius - 4, p.y + radius - 4, 11, 0, Math.PI * 2);
        ctx.fillStyle = '#10b981';
        ctx.fill();
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = '#04121d';
        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(idx + 1, p.x + radius - 4, p.y + radius - 4);

        // Label bubble
        ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
        ctx.strokeStyle = 'rgba(6, 182, 212, 0.6)';
        ctx.lineWidth = 1.5;
        const txt = `${idx + 1}. ${p.spot.name}`;
        ctx.font = 'bold 14px "Pretendard", sans-serif';
        const txtW = ctx.measureText(txt).width;
        ctx.fillRect(p.x - txtW / 2 - 10, p.y + radius + 10, txtW + 20, 28);
        ctx.strokeRect(p.x - txtW / 2 - 10, p.y + radius + 10, txtW + 20, 28);
        ctx.fillStyle = '#f8fafc';
        ctx.fillText(txt, p.x, p.y + radius + 25);
      });

      // 6. Header Bar Overlay
      ctx.fillStyle = 'rgba(10, 16, 30, 0.9)';
      ctx.strokeStyle = 'rgba(6, 182, 212, 0.4)';
      ctx.lineWidth = 1.5;
      ctx.fillRect(30, 30, 440, 75);
      ctx.strokeRect(30, 30, 440, 75);

      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 20px "Pretendard", sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('🗺️ TRAVEL MAP JOURNEY', 50, 62);

      const dates = travelSpots.map(s => s.date).sort();
      const period = dates[0] === dates[dates.length - 1] ? dates[0] : `${dates[0]} ~ ${dates[dates.length - 1]}`;
      ctx.fillStyle = '#94a3b8';
      ctx.font = '13px "Pretendard", sans-serif';
      ctx.fillText(`총 ${travelSpots.length}개 스팟 • ${period} • ${currentMapStyleKey.toUpperCase()}`, 50, 88);

      drawMapCredit(ctx, w - 12, h - 12, 13);

      try {
        const link = document.createElement('a');
        link.download = `travel_map_${currentMapStyleKey}_${Date.now()}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      } catch (err) {
        alert('지도 이미지 저장 중 오류: ' + err.message);
      } finally {
        alertEl.style.display = 'none';
      }
    }

    // 2. Export Real Satellite Animated GIF
    // ------------------------------------------
    // 지도는 Leaflet 화면을 캡처하지 않고 타일을 직접 받아 그린다.
    // 그래야 프레임마다 카메라(중심·줌)를 바꿀 수 있어, 먼 거리를 이동할 때
    // 출발지에서 줌인 → 이동 중 줌아웃 → 도착지에서 다시 줌인하는 연출이 가능하다.
    let gifPhotoFit = 'cover';     // 'cover' 꽉 채우기(잘림) | 'contain' 전체 보이기(여백)
    let gifCamera = 'follow';      // 'follow' 줌인 따라가기 | 'overview' 전체 동선 고정

    function setGifOption(kind, value, el) {
      if (kind === 'fit') gifPhotoFit = value;
      else if (kind === 'quality') gifQuality = value;
      else if (kind === 'zoom') gifZoom = value;
      else if (kind === 'output') travelOutput = value;
      else gifCamera = value;
      updateGifEstimates();
      const group = el && el.parentElement;
      if (group) group.querySelectorAll('.dock-pill-btn').forEach(b => b.classList.toggle('active', b === el));
    }

    const GIF_TILE_URL = {
      satellite: (z, x, y) => `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${x}`,
      topo: (z, x, y) => `https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/${z}/${y}/${x}`,
      osm: (z, x, y) => `https://tile.openstreetmap.org/${z}/${x}/${y}.png`
    };
    const gifTileCache = new Map();   // url -> Promise<Image|null>

    // view = { lat, lng, zoom(소수 가능) } 를 w×h 영역에 그릴 때 필요한 타일 목록
    function tilesForView(view, w, h) {
      const z = Math.max(1, Math.min(18, Math.round(view.zoom)));
      const scale = Math.pow(2, view.zoom - z);
      const c = projectMercator(view.lat, view.lng, z);
      const halfW = w / 2 / scale, halfH = h / 2 / scale;
      const n = Math.pow(2, z);
      const tiles = [];
      for (let tx = Math.floor((c.x - halfW) / 256); tx <= Math.floor((c.x + halfW) / 256); tx++) {
        for (let ty = Math.max(0, Math.floor((c.y - halfH) / 256)); ty <= Math.min(n - 1, Math.floor((c.y + halfH) / 256)); ty++) {
          const wx = ((tx % n) + n) % n;
          tiles.push({ tx, ty, url: GIF_TILE_URL[currentMapStyleKey] ? GIF_TILE_URL[currentMapStyleKey](z, wx, ty) : GIF_TILE_URL.satellite(z, wx, ty) });
        }
      }
      return { z, scale, c, tiles };
    }

    // 타일 이미지를 무한정 들고 있으면 장면이 많은 GIF에서 메모리가 계속 늘어난다
    const GIF_TILE_CACHE_MAX = 300;
    function loadGifTile(url) {
      if (gifTileCache.has(url)) {
        const hit = gifTileCache.get(url);
        gifTileCache.delete(url);
        gifTileCache.set(url, hit);   // 최근 사용으로 갱신
        return hit;
      }
      gifTileCache.set(url, loadTileImage(url));
      while (gifTileCache.size > GIF_TILE_CACHE_MAX) gifTileCache.delete(gifTileCache.keys().next().value);
      return gifTileCache.get(url);
    }

    async function drawMapView(ctx, view, x0, y0, w, h) {
      const plan = tilesForView(view, w, h);
      const imgs = await Promise.all(plan.tiles.map(t => loadGifTile(t.url)));
      ctx.save();
      ctx.beginPath();
      ctx.rect(x0, y0, w, h);
      ctx.clip();
      ctx.fillStyle = currentMapStyleKey === 'osm' ? '#e2e8f0' : '#0b1329';
      ctx.fillRect(x0, y0, w, h);
      const size = 256 * plan.scale;
      plan.tiles.forEach((t, i) => {
        if (!imgs[i]) return;
        const dx = x0 + w / 2 + (t.tx * 256 - plan.c.x) * plan.scale;
        const dy = y0 + h / 2 + (t.ty * 256 - plan.c.y) * plan.scale;
        try { ctx.drawImage(imgs[i], dx, dy, size + 1, size + 1); } catch (e) { /* CORS로 막힌 타일은 건너뛴다 */ }
      });
      ctx.restore();
      return imgs.filter(Boolean).length;
    }

    // 위경도 → 지도 영역 안의 화면 좌표
    function viewToScreen(view, lat, lng, x0, y0, w, h) {
      const p = projectMercator(lat, lng, view.zoom);
      const c = projectMercator(view.lat, view.lng, view.zoom);
      return { x: x0 + w / 2 + (p.x - c.x), y: y0 + h / 2 + (p.y - c.y) };
    }

    // 점들이 w×h 안에 (여백 margin 비율로) 들어오는 view
    function fitView(points, w, h, margin = 0.72, maxZoom = 16) {
      const ps = points.map(p => projectMercator(p.lat, p.lng, 0));
      const xs = ps.map(p => p.x), ys = ps.map(p => p.y);
      const spanX = Math.max(...xs) - Math.min(...xs);
      const spanY = Math.max(...ys) - Math.min(...ys);
      let zoom = maxZoom;
      if (spanX > 0 || spanY > 0) {
        zoom = Math.log2(Math.min(
          spanX > 0 ? (w * margin) / spanX : Infinity,
          spanY > 0 ? (h * margin) / spanY : Infinity
        ));
      }
      zoom = Math.max(2, Math.min(maxZoom, zoom));
      // 중심은 메르카토르 평면의 가운데 (위도 평균이 아니라)
      const cx = (Math.max(...xs) + Math.min(...xs)) / 2;
      const cy = (Math.max(...ys) + Math.min(...ys)) / 2;
      return { ...unproject0(cx, cy), zoom };
    }

    function unproject0(x, y) {
      const lng = (x / 256 - 0.5) * 360;
      const n = Math.PI - 2 * Math.PI * (y / 256);
      const lat = 180 / Math.PI * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n)));
      return { lat, lng };
    }

    // 사진을 상자에 그린다. cover는 잘라서 꽉 채우고, contain은 흐린 배경 위에 전체를 보인다.
    function drawPhotoInBox(ctx, img, x, y, w, h, fit) {
      const ir = img.width / img.height, br = w / h;
      if (fit === 'contain') {
        ctx.fillStyle = '#0b1222';
        ctx.fillRect(x, y, w, h);
        // 같은 사진을 꽉 채워 어둡게 깔아 여백이 휑하지 않게 한다
        let sw = img.width, sh = img.height, sx = 0, sy = 0;
        if (ir > br) { sw = img.height * br; sx = (img.width - sw) / 2; }
        else { sh = img.width / br; sy = (img.height - sh) / 2; }
        ctx.globalAlpha = 0.28;
        ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
        ctx.globalAlpha = 1;
        let dw = w, dh = w / ir;
        if (dh > h) { dh = h; dw = h * ir; }
        ctx.drawImage(img, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh);
        return;
      }
      let sw = img.width, sh = img.height, sx = 0, sy = 0;
      if (ir > br) { sw = img.height * br; sx = (img.width - sw) / 2; }
      else { sh = img.width / br; sy = (img.height - sh) / 2; }
      ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
    }

    // square 720×720: 위 지도 + 아래 캡션 (사진은 지도 위 카드)
    // story  540×960: 위 지도 + 아래 큰 사진·캡션
    // wide   960×540: 왼쪽 지도 + 오른쪽 큰 사진·캡션
    const GIF_LAYOUTS = {
      square: { GW: 720, GH: 720, map: [0, 0, 720, 480], panel: 'bottom' },
      story: { GW: 540, GH: 960, map: [0, 0, 540, 420], panel: 'bottom-big' },
      wide: { GW: 960, GH: 540, map: [0, 0, 560, 540], panel: 'right' }
    };

    // 길이·용량 프리셋. 사진은 어느 프리셋이든 모두 등장하고, 이동 장면의 양과 출력 크기만 다르다.
    //  few: 사진 8장 이하일 때 구간마다 프레임 수 / far·pan: 사진이 많을 때 먼·중간 구간 프레임 수
    //  maxTravel: 이동 장면에 쓸 수 있는 프레임 총량 (먼 구간부터 배정)
    const GIF_QUALITY = {
      light: { scale: 0.75, few: 4, far: 4, pan: 0, maxTravel: 24 },
      normal: { scale: 1, few: 6, far: 5, pan: 0, maxTravel: 90 },
      smooth: { scale: 1, few: 8, far: 7, pan: 3, maxTravel: 220 }
    };
    // 실측: 위성 지도 + 사진 프레임은 GIF로 픽셀당 약 0.45바이트
    const GIF_BYTES_PER_PX = 0.45;
    const GIF_DELAY = { travel: 110, arrive: 1100, start: 1000, end: 2200 };   // ms
    let gifQuality = 'normal';
    // 저장 형식: 'gif' 움짤 / 'mp4' 영상. 영상은 이동 장면을 초당 30프레임으로 부드럽게 그리고,
    // 같은 장면이 이어지는 구간은 거의 용량을 먹지 않아 보통 GIF보다 작다.
    let travelOutput = 'gif';
    const VIDEO_FPS = 30;
    const videoBitrate = (w, h) => Math.round(Math.min(6e6, Math.max(1.5e6, w * h * VIDEO_FPS * 0.2)));
    // 도착 장면의 지도 줌. 14 ≈ 화면 폭 5km(동네), 15.5 ≈ 2km(거리), 17 ≈ 0.7km(골목), 18 ≈ 350m(건물)
    // Esri 위성 사진은 국내 어디서나 18까지 있고, 19는 도시만 있어 시골에서 빈 칸이 나오므로 18까지만 둔다.
    const GIF_ZOOM = { area: 14, street: 15.5, alley: 17, building: 18 };
    let gifZoom = 'street';

    function planTravelGif(format, quality = gifQuality, output = travelOutput) {
      const lay = GIF_LAYOUTS[format] || GIF_LAYOUTS.square;
      const q = GIF_QUALITY[quality] || GIF_QUALITY.normal;
      const MW = lay.map[2], MH = lay.map[3];
      const spots = travelSpots.map(s => ({ lat: s.lat, lng: s.lng }));
      const N = spots.length;

      const overview = fitView(spots, MW, MH, 0.74, 15);
      // 도착지 근처에서 쓸 줌 (GIF_ZOOM). 여행 전체가 이미 그보다 좁은 지역이면 전체 보기 줌을 그대로 쓴다.
      const localZoom = Math.min(18, Math.max(overview.zoom, GIF_ZOOM[gifZoom] || GIF_ZOOM.street));
      const follow = gifCamera === 'follow' && localZoom - overview.zoom > 0.6;

      // 구간별 이동 프레임 수. 먼 구간: 줌아웃 → 이동 → 줌인 / 중간 구간: 짧게 패닝 / 가까운 구간: 바로 다음 사진
      const travelZoom = follow ? localZoom : overview.zoom;
      const view = Math.min(MW, MH);
      const legs = spots.slice(1).map((b, i) => {
        const pa = projectMercator(spots[i].lat, spots[i].lng, travelZoom);
        const pb = projectMercator(b.lat, b.lng, travelZoom);
        const d = Math.hypot(pb.x - pa.x, pb.y - pa.y);
        const want = N <= 8 ? q.few : (d > view * 0.4 ? q.far : (q.pan && d > view * 0.12 ? q.pan : 0));
        return { i, d, want, steps: 0 };
      });
      if (N <= 8) {
        legs.forEach(l => { l.steps = l.want; });
      } else {
        let budget = q.maxTravel;
        [...legs].sort((a, b) => b.d - a.d).forEach(l => {
          if (l.want > 1 && l.want - 1 <= budget) { l.steps = l.want; budget -= l.want - 1; }
        });
      }

      // 사진이 많으면 한 장씩 머무는 시간을 줄여 GIF가 1분을 훌쩍 넘지 않게 한다
      const arriveDelay = N > 20 ? 700 : GIF_DELAY.arrive;
      const video = output === 'mp4';
      const frameMs = 1000 / VIDEO_FPS;
      const plan = [[0, 0, 0, GIF_DELAY.start]];
      legs.forEach(({ i, steps }) => {
        // 영상은 같은 이동을 조금 더 여유 있게(1.3배), 초당 30장으로 그린다
        const n = video && steps > 0 ? Math.max(steps, Math.round(steps * GIF_DELAY.travel * 1.3 / frameMs)) : steps;
        for (let st = 1; st < n; st++) {
          const t = st / n;
          plan.push([i, t, t < 0.5 ? i : i + 1, video ? frameMs : GIF_DELAY.travel]);
        }
        plan.push([i, 1, i + 1, arriveDelay]);
      });
      plan[plan.length - 1][3] = GIF_DELAY.end;

      const outW = Math.round(lay.GW * q.scale / 2) * 2;
      const outH = Math.round(lay.GH * q.scale / 2) * 2;
      const seconds = plan.reduce((sum, f) => sum + f[3], 0) / 1000;
      // 영상: 움직이는 구간은 비트레이트만큼, 멈춘 구간은 장면 전환 비용까지 쳐서 3/4 정도로 어림한다 (실측 기준)
      const moving = plan.filter(f => f[3] < 200).length * frameMs / 1000;
      const estBytes = video
        ? videoBitrate(outW, outH) / 8 * (moving + (seconds - moving) * 0.75)
        : plan.length * outW * outH * GIF_BYTES_PER_PX;
      return { lay, spots, N, overview, localZoom, follow, plan, outW, outH, estBytes, seconds, video };
    }

    // 포맷 버튼마다 예상 용량과 길이를 붙여 보여 준다
    function updateGifEstimates() {
      document.querySelectorAll('.gif-est').forEach(el => {
        if (travelSpots.length < 2) { el.textContent = ''; return; }
        const p = planTravelGif(el.dataset.fmt);
        const mb = p.estBytes / 1048576;
        el.textContent = `${p.video ? '영상' : 'GIF'} ~${Math.max(1, Math.round(mb))}MB · ${Math.round(p.seconds)}초`;
      });
      const sum = document.getElementById('exportSummary');
      if (sum) {
        const Q = { light: '가볍게', normal: '보통', smooth: '부드럽게' };
        const Z = { area: '동네', street: '거리', alley: '골목', building: '건물' };
        sum.textContent = `${travelOutput === 'mp4' ? '영상' : 'GIF'} · ${Q[gifQuality]} · ${gifCamera === 'follow' ? '🔍 ' + Z[gifZoom] : '🗺️ 전체'}`;
      }
    }

    async function generateTravelGIF(format = 'square') {
      if (travelSpots.length < 2) {
        alert('타임랩스를 만들려면 최소 2장 이상의 사진이 필요합니다.');
        return;
      }

      const alertEl = document.getElementById('statusAlert');
      alertEl.style.display = 'block';
      const setStatus = (msg) => { alertEl.textContent = msg; };
      setStatus('⏳ 지도 타일과 사진을 불러오는 중입니다...');

      const P = planTravelGif(format);
      const lay = P.lay;
      const { GW, GH } = lay;
      const [MX, MY, MW, MH] = lay.map;

      const tempC = document.createElement('canvas');
      tempC.width = GW; tempC.height = GH;
      const tCtx = tempC.getContext('2d');
      tCtx.imageSmoothingEnabled = true;
      tCtx.imageSmoothingQuality = 'high';

      const rrect = (c, x, y, w2, h2, r) => {
        r = Math.min(r, w2 / 2, h2 / 2);
        c.beginPath();
        c.moveTo(x + r, y);
        c.arcTo(x + w2, y, x + w2, y + h2, r);
        c.arcTo(x + w2, y + h2, x, y + h2, r);
        c.arcTo(x, y + h2, x, y, r);
        c.arcTo(x, y, x + w2, y, r);
        c.closePath();
      };

      // 50장을 한꺼번에 펼치면 1600px 비트맵만 수백 MB가 된다.
      // 프레임은 한 번에 한 사진만 쓰므로, 지금 쓰는 사진 두어 장만 들고 있는다.
      const gs = travelSpots;

      const photoCache = new Map();
      function getPhoto(i) {
        if (!photoCache.has(i)) {
          photoCache.set(i, new Promise(res => {
            const img = new Image();
            img.onload = () => res(img);
            img.onerror = () => res(null);
            img.src = gs[i].dataUrl;
          }));
          while (photoCache.size > 2) photoCache.delete(photoCache.keys().next().value);
        }
        return photoCache.get(i);
      }
      let currentPhoto = null;

      const { N, spots, overview, localZoom, follow } = P;
      const firstDate = gs[0].date;
      const lastDate = gs[N - 1].date;

      // ── 카메라 ──
      const ease = (t) => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

      function cameraAt(s, t) {
        if (!follow) return overview;
        const a = spots[s], b = spots[Math.min(s + 1, N - 1)];
        const pa = projectMercator(a.lat, a.lng, 0), pb = projectMercator(b.lat, b.lng, 0);
        const e = ease(t);
        const center = unproject0(pa.x + (pb.x - pa.x) * e, pa.y + (pb.y - pa.y) * e);
        // 이동 중간에는 두 지점이 함께 보이는 줌까지 빠졌다가 다시 들어간다
        const segZoom = Math.min(localZoom, fitView([a, b], MW, MH, 0.62, 18).zoom);
        const zoom = localZoom - (localZoom - segZoom) * Math.sin(Math.PI * t);
        return { ...center, zoom };
      }

      function vehicleAt(s, t) {
        const a = spots[s], b = spots[Math.min(s + 1, N - 1)];
        const pa = projectMercator(a.lat, a.lng, 0), pb = projectMercator(b.lat, b.lng, 0);
        const e = ease(t);
        return { ...unproject0(pa.x + (pb.x - pa.x) * e, pa.y + (pb.y - pa.y) * e), angle: Math.atan2(pb.x - pa.x, -(pb.y - pa.y)) };
      }

      // 줌인 모드에서는 전체 동선을 보여 주는 작은 지도를 구석에 둔다
      const inset = follow ? { w: Math.round(MW * (lay.panel === 'right' ? 0.34 : 0.3)) } : null;
      let insetBase = null, insetView = null;
      if (inset) {
        inset.h = Math.round(inset.w * 0.72);
        inset.x = MX + MW - inset.w - 14;
        inset.y = MY + 16;
        insetView = fitView(spots, inset.w, inset.h, 0.7, 15);
        insetBase = document.createElement('canvas');
        insetBase.width = inset.w; insetBase.height = inset.h;
        await drawMapView(insetBase.getContext('2d'), insetView, 0, 0, inset.w, inset.h);
      }

      // ── 한 프레임 ──
      async function drawFrame(s, t, focus) {
        currentPhoto = await getPhoto(focus);
        const view = cameraAt(s, t);
        const veh = vehicleAt(s, t);

        tCtx.fillStyle = '#0a0f1e';
        tCtx.fillRect(0, 0, GW, GH);
        await drawMapView(tCtx, view, MX, MY, MW, MH);

        const toS = (lat, lng) => viewToScreen(view, lat, lng, MX, MY, MW, MH);

        tCtx.save();
        tCtx.beginPath(); tCtx.rect(MX, MY, MW, MH); tCtx.clip();

        // 비네트
        const vg = tCtx.createRadialGradient(MX + MW / 2, MY + MH / 2, Math.min(MW, MH) * 0.3, MX + MW / 2, MY + MH / 2, Math.max(MW, MH) * 0.75);
        vg.addColorStop(0, 'rgba(0,0,0,0)');
        vg.addColorStop(1, 'rgba(0,0,0,0.42)');
        tCtx.fillStyle = vg;
        tCtx.fillRect(MX, MY, MW, MH);

        // 지나온 경로
        const pts = spots.map(p => toS(p.lat, p.lng));
        const cur = toS(veh.lat, veh.lng);
        const tracePath = () => {
          tCtx.beginPath();
          tCtx.moveTo(pts[0].x, pts[0].y);
          for (let k = 1; k <= s; k++) tCtx.lineTo(pts[k].x, pts[k].y);
          tCtx.lineTo(cur.x, cur.y);
        };
        tCtx.lineCap = 'round'; tCtx.lineJoin = 'round';
        tracePath(); tCtx.strokeStyle = 'rgba(255,255,255,0.3)'; tCtx.lineWidth = 10; tCtx.stroke();
        tracePath(); tCtx.strokeStyle = '#ffffff'; tCtx.lineWidth = 3.5; tCtx.stroke();

        // 핀
        const reached = t >= 1 ? s + 1 : s;
        for (let k = 0; k <= reached; k++) {
          tCtx.beginPath();
          tCtx.arc(pts[k].x, pts[k].y, 13, 0, Math.PI * 2);
          tCtx.fillStyle = spotColor(k); tCtx.fill();
          tCtx.lineWidth = 3; tCtx.strokeStyle = '#ffffff'; tCtx.stroke();
          tCtx.fillStyle = '#ffffff';
          tCtx.font = 'bold 13px sans-serif';
          tCtx.textAlign = 'center';
          tCtx.fillText(k + 1, pts[k].x, pts[k].y + 4.5);
        }

        // 이동 수단
        tCtx.save();
        tCtx.translate(cur.x, cur.y);
        tCtx.rotate(veh.angle);
        tCtx.font = '30px sans-serif';
        tCtx.textAlign = 'center'; tCtx.textBaseline = 'middle';
        tCtx.fillText(tourState.vehicleIcon, 0, 0);
        tCtx.restore();
        tCtx.textBaseline = 'alphabetic';

        // 정사각형은 사진을 지도 위 카드로 띄운다 (나머지는 패널에 큰 사진)
        const activeImg = currentPhoto;
        if (lay.panel === 'bottom' && activeImg) {
          const cardW = 170, cardH = 140;
          let px = cur.x - cardW / 2;
          let py = cur.y - cardH - 26;
          if (py < MY + 92) py = cur.y + 28;
          px = Math.max(MX + 14, Math.min(px, MX + MW - cardW - 14));
          py = Math.min(py, MY + MH - cardH - 26);
          tCtx.save();
          tCtx.shadowColor = 'rgba(0,0,0,0.5)'; tCtx.shadowBlur = 12; tCtx.shadowOffsetY = 4;
          rrect(tCtx, px, py, cardW, cardH, 12); tCtx.fillStyle = '#0f172a'; tCtx.fill();
          tCtx.restore();
          tCtx.save();
          rrect(tCtx, px + 6, py + 6, cardW - 12, cardH - 34, 8); tCtx.clip();
          drawPhotoInBox(tCtx, activeImg, px + 6, py + 6, cardW - 12, cardH - 34, gifPhotoFit);
          tCtx.restore();
          rrect(tCtx, px + 1, py + 1, cardW - 2, cardH - 2, 11);
          tCtx.lineWidth = 2.5; tCtx.strokeStyle = frameColor(gs[focus], focus); tCtx.stroke();
          tCtx.fillStyle = '#f8fafc';
          tCtx.font = 'bold 12px Pretendard, sans-serif';
          tCtx.textAlign = 'center';
          const nm = gs[focus].name;
          tCtx.fillText(nm.length > 15 ? nm.substring(0, 14) + '…' : nm, px + cardW / 2, py + cardH - 11);
        }

        // 타이틀
        const topG = tCtx.createLinearGradient(0, MY, 0, MY + 86);
        topG.addColorStop(0, 'rgba(5,10,20,0.82)');
        topG.addColorStop(1, 'rgba(5,10,20,0)');
        tCtx.fillStyle = topG;
        tCtx.fillRect(MX, MY, MW, 86);
        tCtx.textAlign = 'left';
        tCtx.fillStyle = '#ffffff';
        tCtx.font = '800 22px Pretendard, sans-serif';
        tCtx.fillText('✈  MY TRAVEL LOG', MX + 24, MY + 38);
        tCtx.fillStyle = 'rgba(255,255,255,0.72)';
        tCtx.font = '600 13px Pretendard, sans-serif';
        tCtx.fillText(firstDate === lastDate ? firstDate : firstDate + '  —  ' + lastDate, MX + 26, MY + 60);

        // 미니맵
        if (inset) {
          tCtx.save();
          tCtx.shadowColor = 'rgba(0,0,0,0.5)'; tCtx.shadowBlur = 10;
          rrect(tCtx, inset.x, inset.y, inset.w, inset.h, 10); tCtx.fillStyle = '#0b1329'; tCtx.fill();
          tCtx.restore();
          tCtx.save();
          rrect(tCtx, inset.x, inset.y, inset.w, inset.h, 10); tCtx.clip();
          tCtx.drawImage(insetBase, inset.x, inset.y);
          tCtx.fillStyle = 'rgba(5,10,20,0.25)';
          tCtx.fillRect(inset.x, inset.y, inset.w, inset.h);
          const ip = spots.map(p => viewToScreen(insetView, p.lat, p.lng, inset.x, inset.y, inset.w, inset.h));
          const ic = viewToScreen(insetView, veh.lat, veh.lng, inset.x, inset.y, inset.w, inset.h);
          tCtx.lineCap = 'round'; tCtx.lineJoin = 'round';
          tCtx.beginPath(); ip.forEach((p, i) => i ? tCtx.lineTo(p.x, p.y) : tCtx.moveTo(p.x, p.y));
          tCtx.strokeStyle = 'rgba(255,255,255,0.35)'; tCtx.lineWidth = 1.5; tCtx.stroke();
          tCtx.beginPath(); tCtx.moveTo(ip[0].x, ip[0].y);
          for (let k = 1; k <= s; k++) tCtx.lineTo(ip[k].x, ip[k].y);
          tCtx.lineTo(ic.x, ic.y);
          tCtx.strokeStyle = '#ffffff'; tCtx.lineWidth = 2.5; tCtx.stroke();
          ip.forEach((p, k) => {
            tCtx.beginPath(); tCtx.arc(p.x, p.y, 3, 0, Math.PI * 2);
            tCtx.fillStyle = k <= reached ? spotColor(k) : 'rgba(255,255,255,0.5)'; tCtx.fill();
          });
          tCtx.beginPath(); tCtx.arc(ic.x, ic.y, 5, 0, Math.PI * 2);
          tCtx.fillStyle = '#ffffff'; tCtx.fill();
          tCtx.lineWidth = 2; tCtx.strokeStyle = spotColor(focus); tCtx.stroke();
          tCtx.restore();
          rrect(tCtx, inset.x + 0.5, inset.y + 0.5, inset.w - 1, inset.h - 1, 10);
          tCtx.lineWidth = 1.5; tCtx.strokeStyle = 'rgba(255,255,255,0.75)'; tCtx.stroke();
        }
        tCtx.restore();

        drawPanel(focus);
      }

      // ── 캡션 패널 ──
      function drawDots(cx, y, focus) {
        // 스팟이 많으면 점 대신 진행 막대
        if (N > 14) {
          const bw = 240, bh = 6, bx = cx - bw / 2;
          rrect(tCtx, bx, y - bh / 2, bw, bh, 3);
          tCtx.fillStyle = 'rgba(255,255,255,0.18)'; tCtx.fill();
          rrect(tCtx, bx, y - bh / 2, Math.max(bh, bw * (focus + 1) / N), bh, 3);
          tCtx.fillStyle = spotColor(focus); tCtx.fill();
          return;
        }
        const gap = 20, r = 5;
        const x0 = cx - (N - 1) * gap / 2;
        for (let i = 0; i < N; i++) {
          tCtx.beginPath();
          tCtx.arc(x0 + i * gap, y, i === focus ? r + 1.5 : r, 0, Math.PI * 2);
          tCtx.fillStyle = i <= focus ? spotColor(i) : 'rgba(255,255,255,0.22)';
          tCtx.fill();
        }
      }

      function drawCaption(x, y, focus, maxChars) {
        const col = spotColor(focus);
        const sp = gs[focus];
        tCtx.fillStyle = col;
        rrect(tCtx, x, y - 8, 6, 52, 3); tCtx.fill();
        tCtx.textAlign = 'left';
        tCtx.font = '800 14px Pretendard, sans-serif';
        tCtx.fillText('SPOT ' + (focus + 1) + ' / ' + N, x + 20, y);
        tCtx.fillStyle = '#f8fafc';
        tCtx.font = '800 26px Pretendard, sans-serif';
        tCtx.fillText(sp.name.length > maxChars ? sp.name.substring(0, maxChars - 1) + '…' : sp.name, x + 20, y + 30);
        tCtx.fillStyle = 'rgba(255,255,255,0.62)';
        tCtx.font = '600 15px Pretendard, sans-serif';
        tCtx.fillText('📅  ' + spotWhen(sp), x + 20, y + 56);
      }

      function drawBigPhoto(x, y, w, h, focus) {
        const img = currentPhoto;
        if (!img) return;
        tCtx.save();
        tCtx.shadowColor = 'rgba(0,0,0,0.5)'; tCtx.shadowBlur = 16; tCtx.shadowOffsetY = 6;
        rrect(tCtx, x, y, w, h, 16); tCtx.fillStyle = '#0f172a'; tCtx.fill();
        tCtx.restore();
        tCtx.save();
        rrect(tCtx, x + 6, y + 6, w - 12, h - 12, 11); tCtx.clip();
        drawPhotoInBox(tCtx, img, x + 6, y + 6, w - 12, h - 12, gifPhotoFit);
        tCtx.restore();
        rrect(tCtx, x + 1, y + 1, w - 2, h - 2, 15);
        tCtx.lineWidth = 3; tCtx.strokeStyle = frameColor(gs[focus], focus); tCtx.stroke();
      }

      function drawPanel(focus) {
        if (lay.panel === 'right') {
          // 지도와 패널 경계를 부드럽게
          const g = tCtx.createLinearGradient(MX + MW - 50, 0, MX + MW, 0);
          g.addColorStop(0, 'rgba(10,15,30,0)');
          g.addColorStop(1, '#0a0f1e');
          tCtx.fillStyle = g;
          tCtx.fillRect(MX + MW - 50, 0, 50, GH);
          drawMapCredit(tCtx, MX + MW - 8, GH - 8, 10);
          const px = MX + MW + 8, pw = GW - px - 28;
          drawBigPhoto(px, 28, pw, 300, focus);
          drawCaption(px + 4, 376, focus, 14);
          drawDots(px + pw / 2, GH - 30, focus);
          return;
        }

        const top = MY + MH;
        const g = tCtx.createLinearGradient(0, top - 40, 0, GH);
        g.addColorStop(0, 'rgba(10,15,30,0)');
        g.addColorStop(0.2, '#0a0f1e');
        g.addColorStop(1, '#0a0f1e');
        tCtx.fillStyle = g;
        tCtx.fillRect(0, top - 40, GW, GH - (top - 40));
        drawMapCredit(tCtx, GW - 8, top - 4, 10);

        if (lay.panel === 'bottom-big') {
          const bw = GW - 64, bh = Math.min(GH - top - 170, Math.round(bw * 0.72));
          drawBigPhoto(32, top + 20, bw, bh, focus);
          drawCaption(32, top + 20 + bh + 40, focus, 15);
          drawDots(GW / 2, GH - 30, focus);
        } else {
          drawCaption(32, top + 56, focus, 18);
          drawDots(GW / 2, GH - 34, focus);
        }
      }

      // ── 프레임 순서 (planTravelGif) ──
      const plan = P.plan;
      // 가볍게 프리셋은 다 그린 뒤 작게 줄여서 인코딩한다
      const outC = document.createElement('canvas');
      outC.width = P.outW; outC.height = P.outH;
      const oCtx = outC.getContext('2d', { willReadFrequently: true });
      oCtx.imageSmoothingEnabled = true;
      oCtx.imageSmoothingQuality = 'high';

      const fail = (msg) => {
        alertEl.style.display = 'none';
        gifTileCache.clear();
        alert(msg);
      };
      const label = P.video ? '영상' : 'GIF';
      const tick = (i) => setStatus(`⏳ 타임랩스 ${label}을(를) 만드는 중입니다... (${i + 1}/${plan.length})`);

      let blob;
      if (P.video) {
        // ── MP4 (createMp4Writer, game-common.js) ──
        let writer;
        try {
          writer = await createMp4Writer(P.outW, P.outH, { fps: VIDEO_FPS, bitrate: videoBitrate(P.outW, P.outH) });
        } catch (err) {
          return fail(err.message);
        }
        try {
          for (let i = 0; i < plan.length; i++) {
            const [s, t, focus, delay] = plan[i];
            await drawFrame(s, t, focus);
            oCtx.drawImage(tempC, 0, 0, P.outW, P.outH);
            // 오래 머무는 장면은 같은 그림을 여러 프레임으로 넣는다
            await writer.addFrame(outC, Math.max(1, Math.round(delay / (1000 / VIDEO_FPS))));
            tick(i);
            await yieldToBrowser();
          }
          blob = await writer.finish();
        } catch (err) {
          writer.cancel();
          return fail('영상 생성 실패: ' + err.message);
        } finally {
          gifTileCache.clear();
        }
      } else {
        // ── GIF ──
        // gifshot은 모든 프레임을 메모리에 쌓았다가 한꺼번에 묶어 프레임이 많으면 브라우저가 버티지 못한다.
        // gifenc로 프레임을 그리는 즉시 인코딩하고 버려, 메모리는 프레임 한 장 + 완성 파일 크기만 쓴다.
        let gifenc;
        try {
          gifenc = await loadGifEncoder();
        } catch (err) {
          return fail('GIF 인코더를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.');
        }
        const { GIFEncoder, quantize, applyPalette } = gifenc;
        const encoder = GIFEncoder();
        try {
          for (let i = 0; i < plan.length; i++) {
            const [s, t, focus, delay] = plan[i];
            await drawFrame(s, t, focus);
            oCtx.drawImage(tempC, 0, 0, P.outW, P.outH);
            const { data } = oCtx.getImageData(0, 0, P.outW, P.outH);
            const palette = quantize(data, 256);
            encoder.writeFrame(applyPalette(data, palette), P.outW, P.outH, { palette, delay });
            tick(i);
            // 화면이 멈춰 보이지 않게 프레임마다 숨을 돌린다
            await yieldToBrowser();
          }
          encoder.finish();
        } catch (err) {
          return fail('GIF 생성 실패: ' + err.message);
        } finally {
          // 지도 타일 이미지는 다음에 다시 받아도 되므로 메모리에서 비운다
          gifTileCache.clear();
        }
        blob = new Blob([encoder.bytes()], { type: 'image/gif' });
      }

      const ext = P.video ? 'mp4' : 'gif';
      lastGifBlob = blob;
      lastGifName = `travel_${format}_${gifCamera}.${ext}`;
      if (lastGifUrl) URL.revokeObjectURL(lastGifUrl);
      lastGifUrl = URL.createObjectURL(blob);

      alertEl.style.display = 'none';
      const img = document.getElementById('gifPreview');
      const vid = document.getElementById('videoPreview');
      img.style.display = P.video ? 'none' : '';
      vid.style.display = P.video ? '' : 'none';
      if (P.video) { vid.src = lastGifUrl; vid.play().catch(() => {}); } else { vid.removeAttribute('src'); img.src = lastGifUrl; }
      const dlLink = document.getElementById('gifDownloadLink');
      dlLink.href = lastGifUrl;
      dlLink.download = lastGifName;
      const head = document.querySelector('#gifResultBox > div');
      if (head) head.textContent = `🎉 완성된 여행 타임랩스 ${label} · ${N}곳 · ${(blob.size / 1048576).toFixed(1)}MB` +
        (unplacedSpots.length ? ` (위치 미지정 ${unplacedSpots.length}장 제외)` : '');
      document.getElementById('gifResultBox').style.display = 'flex';
      document.getElementById('gifResultBox').scrollIntoView({ behavior: 'smooth' });
    }

    // 영상 인코더(WebCodecs)가 없는 브라우저에서는 영상 버튼을 끈다
    if (!canRecordMp4()) {
      const b = document.getElementById('btnOutputMp4');
      if (b) { b.disabled = true; b.style.opacity = 0.4; b.title = '이 브라우저는 영상 저장을 지원하지 않아요'; }
    }

    let lastGifUrl = null;
    let lastGifBlob = null;
    let lastGifName = 'travel.gif';

    function saveTravelGifToGallery() {
      if (lastGifBlob) saveToGallery(lastGifBlob, lastGifName);
    }
    let gifEncoderModule = null;
    function loadGifEncoder() {
      if (!gifEncoderModule) {
        gifEncoderModule = import('https://cdn.jsdelivr.net/npm/gifenc@1.0.3/dist/gifenc.esm.js')
          .catch(err => { gifEncoderModule = null; throw err; });
      }
      return gifEncoderModule;
    }

    // ==========================================
    // Demo Sample Generator
    // ==========================================
    function getSampleSpots() {
      const spotsData = [
        { name: '제주국제공항 ✈️', lat: 33.5065, lng: 126.4930, date: '2026-10-10', col1: '#0284c7', col2: '#06b6d4', emoji: '✈️' },
        { name: '함덕 에메랄드 해수욕장 🏖️', lat: 33.5434, lng: 126.6692, date: '2026-10-10', col1: '#059669', col2: '#10b981', emoji: '🏖️' },
        { name: '성산일출봉 일출 🌄', lat: 33.4580, lng: 126.9426, date: '2026-10-11', col1: '#e11d48', col2: '#f43f5e', emoji: '🌄' },
        { name: '서귀포 매일올레시장 🍊', lat: 33.2497, lng: 126.5630, date: '2026-10-11', col1: '#ea580c', col2: '#f59e0b', emoji: '🍊' },
        { name: '협재 노을 바다 🌅', lat: 33.3941, lng: 126.2397, date: '2026-10-11', col1: '#7c3aed', col2: '#a855f7', emoji: '🌅' }
      ];

      return spotsData.map((s, idx) => {
        const c = document.createElement('canvas');
        const S = 2;
        c.width = 400 * S; c.height = 300 * S;
        const ctx = c.getContext('2d');
        ctx.scale(S, S); ctx.imageSmoothingQuality = 'high';
        const grad = ctx.createLinearGradient(0, 0, 400, 300);
        grad.addColorStop(0, s.col1); grad.addColorStop(1, s.col2);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 400, 300);
        ctx.font = '60px sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(s.emoji, 200, 120);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 22px "Pretendard", sans-serif';
        ctx.fillText(s.name, 200, 220);

        return {
          dataUrl: c.toDataURL('image/jpeg', 0.85),
          thumbUrl: makeThumbnail(c, THUMB_EDGE),
          accent: dominantColor(c),
          name: s.name,
          date: s.date,
          lat: s.lat,
          lng: s.lng,
          uid: newSpotUid(),
          id: `demo-${idx}`,
          loc: 'gps',
          timeVal: 1791700000000 + idx * 7200000 // 2-hour intervals
        };
      });
    }

    function loadDemoSamples() {
      travelSpots = getSampleSpots();
      unplacedSpots = [];
      hiddenSpots = [];
      hiddenAuthors = new Set();
      currentSortMode = 'time-asc';
      updateSortBadges('⏱️ 과거순');
      document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
      const btn = document.getElementById('btnSortTimeAsc');
      if (btn) btn.classList.add('active');
      refreshTripUI();
    }

    if (new URLSearchParams(window.location.search).get('demo') === '1') {
      window.addEventListener('DOMContentLoaded', () => setTimeout(loadDemoSamples, 100));
    }

    // Drag and Drop
    const dropEl = document.getElementById('dropZone');
    if (dropEl) {
      dropEl.addEventListener('dragover', (e) => { e.preventDefault(); dropEl.classList.add('drag-over'); });
      dropEl.addEventListener('dragleave', (e) => { e.preventDefault(); dropEl.classList.remove('drag-over'); });
      dropEl.addEventListener('drop', (e) => {
        e.preventDefault();
        dropEl.classList.remove('drag-over');
        if (e.dataTransfer && e.dataTransfer.files) {
          handleTravelUpload({ target: { files: e.dataTransfer.files } });
        }
      });
    }
  </script>
