      background: rgba(6, 214, 160, 0.03);

    .drop-zone:hover {
      border-color: var(--green);

    .drop-icon { font-size: 40px; }

    .section-label {

    .route-list {

    }

    .route-item {
      display: flex;

    .route-info {

    .route-name { font-size: 14px; font-weight: 700; color: white; }
    .route-meta { font-size: 12px; color: var(--text-dim); display: flex; gap: 8px; }

    .badge-gps {
      background: rgba(6, 214, 160, 0.2);
      color: var(--green);

<body>
  <div class="container">

    <div class="card">

  <script type="application/json" id="game-rules">
{
 "title": "여행 동선 지도 & 순서형 GIF",

 "steps": [
  "스마트폰이나 카메라로 찍은 여행 사진들을 여러 장 업로드합니다.",

  "시간 순서대로 정렬된 여행 스팟들을 확인합니다.",
  "'여행 경로 애니메이션 재생'을 눌러 동선 맵 애니메이션을 감상합니다.",
  "'움직이는 여행 타임랩스 GIF 다운로드'를 눌러 SNS 공유용 GIF를 저장합니다."
 ],
 "tips": [
  "스마트폰 카메라 설정에서 '위치 태그'가 켜진 상태로 찍은 사진은 자동으로 위치가 감지됩니다.",
  "위치 태그가 없는 사진도 촬영 시간 순서에 따라 가상 좌표로 자연스럽게 동선이 생성됩니다."

  <script>
    let travelSpots = []; // { dataUrl, lat, lng, date, name, isGps }
    let animId = null;

    function handleTravelUpload(event) {
      const files = Array.from(event.target.files || []);
      const images = files.filter(f => f.type.startsWith('image/'));
      if (!images.length) return;

      images.forEach(file => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const dataUrl = e.target.result;
          parseExifAndAdd(file, dataUrl);
        };
        reader.readAsDataURL(file);
      });
      event.target.value = '';
    }

    function parseExifAndAdd(file, dataUrl) {
      const img = new Image();
      img.onload = () => {
        EXIF.getData(img, function() {
          const lat = EXIF.getTag(this, "GPSLatitude");
          const latRef = EXIF.getTag(this, "GPSLatitudeRef");
          const lng = EXIF.getTag(this, "GPSLongitude");
          const lngRef = EXIF.getTag(this, "GPSLongitudeRef");
          const dateTime = EXIF.getTag(this, "DateTimeOriginal") || EXIF.getTag(this, "DateTime");

          let decLat = null;
          let decLng = null;
          let hasGps = false;

          if (lat && lng) {
            decLat = (lat[0] + lat[1] / 60 + lat[2] / 3600) * (latRef === "S" ? -1 : 1);
            decLng = (lng[0] + lng[1] / 60 + lng[2] / 3600) * (lngRef === "W" ? -1 : 1);
            hasGps = true;
          } else {
            // Simulated offset based on current count
            const baseLat = 37.5665 + (travelSpots.length * 0.05);
            const baseLng = 126.9780 + (travelSpots.length * 0.08);
            decLat = baseLat;
            decLng = baseLng;
          }

          travelSpots.push({
            dataUrl: dataUrl,
            name: file.name.replace(/\.[^/.]+$/, "") || `스팟 #${travelSpots.length + 1}`,
            date: dateTime ? dateTime.substring(0, 10).replace(/:/g, '-') : '날짜 미상',
            lat: decLat,
            lng: decLng,
            isGps: hasGps,
            timeVal: dateTime ? new Date(dateTime.replace(/:/g, '/')).getTime() : Date.now() + travelSpots.length
          });

          // Sort chronologically
          travelSpots.sort((a, b) => a.timeVal - b.timeVal);
          updateSpotList();
        });
      };
      img.src = dataUrl;
    }

    function updateSpotList() {
      const list = document.getElementById('routeList');
      const count = document.getElementById('spotCount');
      const actions = document.getElementById('actionArea');

      list.innerHTML = '';
      count.textContent = `${travelSpots.length}개 스팟`;

      travelSpots.forEach((spot, idx) => {
        const item = document.createElement('div');
        item.className = 'route-item';
        item.innerHTML = `
          <img src="${spot.dataUrl}" class="route-thumb">
          <div class="route-info">
            <div class="route-name">${idx + 1}. ${spot.name}</div>
            <div class="route-meta">
              <span>📅 ${spot.date}</span>
              ${spot.isGps ? '<span class="badge-gps">📍 GPS 인식</span>' : '<span class="badge-manual">⏱️ 시간순 배치</span>'}
            </div>
          </div>
          <button class="item-del-btn" onclick="removeSpot(${idx})">✕</button>
        `;
        list.appendChild(item);
      });

      actions.style.display = travelSpots.length > 0 ? 'flex' : 'none';
      if (travelSpots.length > 0) {
        document.getElementById('canvasContainer').style.display = 'flex';
        drawStaticMap();
      }
    }

    function removeSpot(idx) {
      travelSpots.splice(idx, 1);
      updateSpotList();
    }

    // Convert GPS coords to Canvas Coordinates
    function getCanvasCoords(spots, width, height, pad = 80) {
      if (spots.length === 0) return [];
      let minLat = Infinity, maxLat = -Infinity;
      let minLng = Infinity, maxLng = -Infinity;

      spots.forEach(s => {
        if (s.lat < minLat) minLat = s.lat;
        if (s.lat > maxLat) maxLat = s.lat;
        if (s.lng < minLng) minLng = s.lng;
        if (s.lng > maxLng) maxLng = s.lng;
      });

      const dLat = (maxLat - minLat) || 0.01;
      const dLng = (maxLng - minLng) || 0.01;

      return spots.map(s => {
        const normX = (s.lng - minLng) / dLng;
        const normY = 1 - ((s.lat - minLat) / dLat);
        return {
          x: pad + normX * (width - pad * 2),
          y: pad + normY * (height - pad * 2),
          spot: s
        };
      });
    }

    function drawStaticMap() {
      const canvas = document.getElementById('routeCanvas');
      const ctx = canvas.getContext('2d');
      const w = canvas.width, h = canvas.height;

      // Dark Tech Map Background
      ctx.fillStyle = '#0d1322';
      ctx.fillRect(0, 0, w, h);

      // Grid lines
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
      ctx.lineWidth = 1;
      for (let x = 0; x < w; x += 50) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
      for (let y = 0; y < h; y += 50) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }

      const points = getCanvasCoords(travelSpots, w, h);
      if (points.length < 1) return;

      // Draw path line
      if (points.length > 1) {
        ctx.strokeStyle = '#06d6a0';
        ctx.lineWidth = 4;
        ctx.setLineDash([8, 6]);
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length; i++) {
          ctx.lineTo(points[i].x, points[i].y);
        }
        ctx.stroke();
        ctx.setLineDash([]);
      }

      // Draw pins
      points.forEach((p, idx) => {
        // Glow
        ctx.fillStyle = 'rgba(6, 214, 160, 0.3)';
        ctx.beginPath();
        ctx.arc(p.x, p.y, 16, 0, Math.PI * 2);
        ctx.fill();

        // Pin body
        ctx.fillStyle = '#06d6a0';
        ctx.beginPath();
        ctx.arc(p.x, p.y, 10, 0, Math.PI * 2);
        ctx.fill();

        // Number
        ctx.fillStyle = '#000000';
        ctx.font = 'bold 11px Outfit, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(idx + 1, p.x, p.y);

        // Name
        ctx.fillStyle = '#ffffff';
        ctx.font = '600 13px Pretendard, sans-serif';
        ctx.fillText(p.spot.name, p.x, p.y + 24);
      });
    }

    async function startRouteAnimation() {
      if (travelSpots.length < 2) {
        alert('동선을 연결하려면 최소 2장 이상의 사진이 필요합니다.');
        return;
      }
      if (animId) cancelAnimationFrame(animId);

      const canvas = document.getElementById('routeCanvas');
      const ctx = canvas.getContext('2d');
      const w = canvas.width, h = canvas.height;
      const points = getCanvasCoords(travelSpots, w, h);

      // Load all images for popups
      const loadedImgs = await Promise.all(travelSpots.map(s => {
        return new Promise(res => {
          const img = new Image();
          img.onload = () => res(img);
          img.src = s.dataUrl;
        });
      }));

      let currentStep = 0;
      let progress = 0;

      function renderFrame() {
        // Base Map
        ctx.fillStyle = '#0d1322';
        ctx.fillRect(0, 0, w, h);

        // Grid
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
        ctx.lineWidth = 1;
        for (let x = 0; x < w; x += 50) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
        for (let y = 0; y < h; y += 50) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }

        // Draw visited lines
        ctx.strokeStyle = '#06d6a0';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        for (let i = 1; i <= currentStep; i++) {
          ctx.lineTo(points[i].x, points[i].y);
        }

        // Interpolate moving point
        if (currentStep < points.length - 1) {
          const p1 = points[currentStep];
          const p2 = points[currentStep + 1];
          const curX = p1.x + (p2.x - p1.x) * progress;
          const curY = p1.y + (p2.y - p1.y) * progress;
          ctx.lineTo(curX, curY);
          ctx.stroke();

          // Traveling vehicle icon/dot
          ctx.fillStyle = '#ff006e';
          ctx.beginPath();
          ctx.arc(curX, curY, 8, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.stroke();
        }

        // Draw pins up to current step
        for (let i = 0; i <= currentStep; i++) {
          const p = points[i];
          ctx.fillStyle = '#06d6a0';
          ctx.beginPath();
          ctx.arc(p.x, p.y, 10, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#000000';
          ctx.font = 'bold 11px Outfit, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(i + 1, p.x, p.y);
        }

        // Popup active photo card
        const activeIdx = currentStep;
        const curPt = points[activeIdx];
        const activeImg = loadedImgs[activeIdx];

        if (activeImg) {
          const cardW = 140, cardH = 120;
          let popX = curPt.x - cardW / 2;
          let popY = curPt.y - cardH - 20;
          if (popY < 20) popY = curPt.y + 25;
          if (popX < 20) popX = 20;
          if (popX + cardW > w - 20) popX = w - cardW - 20;

          ctx.fillStyle = '#ffffff';
          ctx.shadowColor = 'rgba(0,0,0,0.5)';
          ctx.shadowBlur = 15;
          ctx.fillRect(popX, popY, cardW, cardH);
          ctx.shadowColor = 'transparent';

          ctx.drawImage(activeImg, popX + 6, popY + 6, cardW - 12, cardH - 32);

          ctx.fillStyle = '#111122';
          ctx.font = 'bold 11px Pretendard, sans-serif';
          ctx.fillText(travelSpots[activeIdx].name, popX + cardW / 2, popY + cardH - 10);
        }

        progress += 0.03;
        if (progress >= 1) {
          progress = 0;
          currentStep++;
        }

        if (currentStep < points.length - 1) {
          animId = requestAnimationFrame(renderFrame);
        }
      }

      renderFrame();
    }

    async function generateTravelGIF() {
      if (travelSpots.length < 2) {
        alert('GIF를 생성하려면 최소 2장 이상의 사진이 필요합니다.');
        return;
      }

      const alertEl = document.getElementById('statusAlert');
      alertEl.style.display = 'block';

      const canvas = document.getElementById('routeCanvas');
      const ctx = canvas.getContext('2d');
      const w = 480, h = 360; // compact size for efficient GIF generation
      const tempC = document.createElement('canvas');
      tempC.width = w; tempC.height = h;
      const tCtx = tempC.getContext('2d');

      const points = getCanvasCoords(travelSpots, w, h, 50);
      const loadedImgs = await Promise.all(travelSpots.map(s => {
        return new Promise(res => {
          const img = new Image();
          img.onload = () => res(img);
          img.src = s.dataUrl;
        });
      }));

      const frames = [];
      const totalSteps = points.length - 1;

      for (let s = 0; s < totalSteps; s++) {
        for (let prog = 0; prog <= 1; prog += 0.25) {
          tCtx.fillStyle = '#0d1322';
          tCtx.fillRect(0, 0, w, h);

          // Lines
          tCtx.strokeStyle = '#06d6a0';
          tCtx.lineWidth = 3;
          tCtx.beginPath();
          tCtx.moveTo(points[0].x, points[0].y);
          for (let i = 1; i <= s; i++) {
            tCtx.lineTo(points[i].x, points[i].y);
          }

          const p1 = points[s], p2 = points[s + 1];
          const curX = p1.x + (p2.x - p1.x) * prog;
          const curY = p1.y + (p2.y - p1.y) * prog;
          tCtx.lineTo(curX, curY);
          tCtx.stroke();

          // Vehicle dot
          tCtx.fillStyle = '#ff006e';
          tCtx.beginPath();
          tCtx.arc(curX, curY, 6, 0, Math.PI * 2);
          tCtx.fill();

          // Pins
          for (let i = 0; i <= s; i++) {
            tCtx.fillStyle = '#06d6a0';
            tCtx.beginPath();
            tCtx.arc(points[i].x, points[i].y, 8, 0, Math.PI * 2);
            tCtx.fill();
            tCtx.fillStyle = '#000000';
            tCtx.font = 'bold 9px sans-serif';
            tCtx.textAlign = 'center';
            tCtx.textBaseline = 'middle';
            tCtx.fillText(i + 1, points[i].x, points[i].y);
          }

          // Active popup
          const activeImg = loadedImgs[s];
          if (activeImg) {
            const cardW = 100, cardH = 80;
            let popX = curX - cardW / 2;
            let popY = curY - cardH - 15;
            if (popY < 10) popY = curY + 15;
            tCtx.fillStyle = '#ffffff';
            tCtx.fillRect(popX, popY, cardW, cardH);
            tCtx.drawImage(activeImg, popX + 4, popY + 4, cardW - 8, cardH - 24);
            tCtx.fillStyle = '#111';
            tCtx.font = 'bold 9px sans-serif';
            tCtx.fillText(travelSpots[s].name, popX + cardW / 2, popY + cardH - 8);
          }

          frames.push(tempC.toDataURL('image/jpeg', 0.8));
        }
      }

      gifshot.createGIF({
        images: frames,
        gifWidth: w,
        gifHeight: h,
        interval: 0.12,
        numWorkers: 2
      }, function(obj) {
        alertEl.style.display = 'none';
        if (!obj.error) {
          const gifImg = document.getElementById('gifPreview');
          gifImg.src = obj.image;
          const dlLink = document.getElementById('gifDownloadLink');
          dlLink.href = obj.image;
          document.getElementById('gifResultBox').style.display = 'flex';
          document.getElementById('gifResultBox').scrollIntoView({ behavior: 'smooth' });
        } else {
          alert('GIF 생성 실패: ' + obj.error);
        }
      });
    }
  </script>
</body>
</html>
