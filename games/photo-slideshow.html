  <style>
    :root {
      --bg: #07090e;
      --card-bg: rgba(15, 23, 42, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --yellow: #f59e0b;
      --pink: #ec4899;
      --cyan: #06b6d4;
      --purple: #6366f1;
      --text-main: #f8fafc;
      --text-dim: #94a3b8;
      --radius-xl: 20px;
      --radius-lg: 14px;
      --radius-md: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: radial-gradient(circle at 50% 0%, #201a14 0%, #07090e 100%);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', 'Pretendard', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 24px 20px;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      padding-bottom: 8px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .back-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--yellow);
      font-size: 20px;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border-radius: 12px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .back-btn:hover {
      background: rgba(245, 158, 11, 0.15);
      border-color: var(--yellow);
      transform: translateX(-2px);
    }

    .header-title-box h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #f59e0b 0%, #ec4899 50%, #ec4899 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-title-box p {
      font-size: 13px;
      color: var(--text-dim);
      margin-top: 2px;
    }

    .glass-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: var(--radius-xl);
      padding: 22px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* Drop Zone */
    .drop-zone {
      border: 2px dashed rgba(245, 158, 11, 0.3);
      border-radius: var(--radius-lg);
      padding: 34px 24px;
      text-align: center;
      background: linear-gradient(180deg, rgba(245, 158, 11, 0.03) 0%, rgba(244, 63, 94, 0.02) 100%);
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .drop-zone:hover, .drop-zone.drag-over {
      border-color: var(--yellow);
      background: rgba(245, 158, 11, 0.08);
      transform: translateY(-2px);
    }

    .drop-icon-wrapper {
      width: 60px;
      height: 60px;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.2), rgba(244, 63, 94, 0.2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .drop-title { font-size: 16px; font-weight: 700; color: #f1f5f9; }
    .drop-sub { font-size: 13px; color: var(--text-dim); }

    .demo-btn-pill {
      margin-top: 6px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      color: #fbbf24;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .demo-btn-pill:hover {

    /* Photo Grid Tray */

      gap: 12px;
    }

    .section-label {

      font-weight: 700;
      color: #e2e8f0;
      display: flex;

      align-items: center;

      grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));

      border: 1.5px solid var(--card-border);

    .tray-del-btn {

    /* Controls */
    .controls-grid {

    }

    .field-group {

      flex-direction: column;
      gap: 6px;
    }

    .field-label {

      color: var(--text-dim);

    .ratio-btn {

      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.7);

  </style>

  <script>
    let slideImages = [];
    let currentRatio = '1:1';
    let slideDuration = 3500;
    let overlayStyle = 'vhs';
    let isPlaying = false;
    let animationFrameId = null;

    let currentIndex = 0;
    let nextIndex = 1;
    let slideStartTime = 0;
    let loadedImgObjects = [];

    // Native Web Audio Synthesizer for Soothing Ambient Music Pad
    let audioCtx = null;
    let ambientGain = null;
    let isBgmPlaying = false;

    function toggleAmbientMusic() {
      const btn = document.getElementById('bgmToggleBtn');
      if (isBgmPlaying) {
        if (ambientGain) ambientGain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
        isBgmPlaying = false;
        btn.textContent = '🎵 앰비언트 BGM 꺼짐 (클릭하여 켜기)';
        btn.classList.remove('active');
      } else {
        startAmbientSynth();
        isBgmPlaying = true;
        btn.textContent = '🎶 앰비언트 BGM 연주 중 (클릭하여 끄기)';
        btn.classList.add('active');
      }
    }

    function startAmbientSynth() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        if (!audioCtx) audioCtx = new AudioContext();

        ambientGain = audioCtx.createGain();
        ambientGain.gain.setValueAtTime(0.001, audioCtx.currentTime);
        ambientGain.gain.linearRampToValueAtTime(0.08, audioCtx.currentTime + 1.5);

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 600;

        // Dreamy chord (F major 9: F3, A3, C4, E4)
        const freqs = [174.61, 220.00, 261.63, 329.63];
        freqs.forEach(f => {
          const osc = audioCtx.createOscillator();
          osc.type = 'sine';
          osc.frequency.value = f;
          osc.connect(filter);
          osc.start();
        });

        filter.connect(ambientGain);
        ambientGain.connect(audioCtx.destination);
      } catch (e) {}
    }

    function handleSlideUpload(event) {
      const files = Array.from(event.target.files || []);
      const images = files.filter(f => f.type.startsWith('image/'));
      if (!images.length) return;

      images.forEach(file => {
        const reader = new FileReader();
        reader.onload = (e) => {
          slideImages.push(e.target.result);
          updateSlideGallery();
        };
        reader.readAsDataURL(file);
      });
      event.target.value = '';
    }

    function removeSlide(idx) {
      slideImages.splice(idx, 1);
      updateSlideGallery();
    }

    function updateSlideGallery() {
      const grid = document.getElementById('photoGrid');
      const count = document.getElementById('slideCount');
      const controls = document.getElementById('controlsGroup');

      grid.innerHTML = '';
      count.textContent = slideImages.length;

      slideImages.forEach((src, idx) => {
        const box = document.createElement('div');
        box.className = 'tray-thumb';
        box.innerHTML = `
          <img src="${src}" alt="slide">
          <button class="tray-del-btn" onclick="removeSlide(${idx})">✕</button>
        `;
        grid.appendChild(box);
      });

      controls.style.display = slideImages.length > 0 ? 'flex' : 'none';
    }

    function setRatio(ratio, el) {
      currentRatio = ratio;
      document.querySelectorAll('#ratioOptions .ratio-btn').forEach(b => b.classList.remove('active'));
      if (el) el.classList.add('active');
    }

    function setSpeed(dur, el) {
      slideDuration = dur;
      document.querySelectorAll('#speedOptions .ratio-btn').forEach(b => b.classList.remove('active'));
      if (el) el.classList.add('active');
    }

    function setOverlayStyle(style, el) {
      overlayStyle = style;
      document.querySelectorAll('#stampOptions .ratio-btn').forEach(b => b.classList.remove('active'));
      if (el) el.classList.add('active');
    }

    async function startSlideshow() {
      if (slideImages.length < 2) {
        alert('슬라이드쇼를 위해 최소 2장 이상의 사진을 올려주세요.');
        return;
      }

      document.getElementById('viewerArea').style.display = 'flex';
      document.getElementById('viewerArea').scrollIntoView({ behavior: 'smooth' });

      const canvas = document.getElementById('motionCanvas');
      if (currentRatio === '1:1') {
        canvas.width = 900; canvas.height = 900;
      } else if (currentRatio === '9:16') {
        canvas.width = 675; canvas.height = 1200;
      } else {
        canvas.width = 1200; canvas.height = 675;
      }

      loadedImgObjects = await Promise.all(slideImages.map(src => {
        return new Promise(res => {
          const img = new Image();
          img.onload = () => res(img);
          img.src = src;
        });
      }));

      currentIndex = 0;
      nextIndex = 1;
      slideStartTime = performance.now();
      isPlaying = true;
      document.getElementById('playPauseBtn').textContent = '⏸️ 일시 정지';

      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      animateMotion(performance.now());
    }

    function togglePlayPause() {
      isPlaying = !isPlaying;
      document.getElementById('playPauseBtn').textContent = isPlaying ? '⏸️ 일시 정지' : '▶ 계속 재생';
      if (isPlaying) {
        slideStartTime = performance.now();
        animateMotion(performance.now());
      }
    }

    function animateMotion(time) {
      if (!isPlaying) return;

      const elapsed = time - slideStartTime;
      const progress = Math.min(1, elapsed / slideDuration);

      const canvas = document.getElementById('motionCanvas');
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
      const w = canvas.width, h = canvas.height;

      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, w, h);

      // Current Image with Ken Burns zoom (1.0 -> 1.15) and subtle horizontal pan
      const curImg = loadedImgObjects[currentIndex];
      const scale = 1.0 + 0.15 * progress;
      const panOffset = (progress - 0.5) * 24;

      ctx.save();
      drawKenBurns(ctx, curImg, w, h, scale, panOffset, 1.0);
      ctx.restore();

      // Crossfade to Next Image on last 35% of duration
      if (progress > 0.65) {
        const fadeProg = (progress - 0.65) / 0.35;
        const nextImg = loadedImgObjects[nextIndex];
        const nextScale = 1.15 - 0.15 * fadeProg;

        ctx.save();
        drawKenBurns(ctx, nextImg, w, h, nextScale, 0, fadeProg);
        ctx.restore();
      }

      // Draw Retro Overlays
      drawRetroOverlays(ctx, w, h);

      // Update HUD Index
      document.getElementById('currentSlideIdxText').textContent = `${currentIndex + 1} / ${loadedImgObjects.length}`;

      if (progress >= 1) {
        currentIndex = nextIndex;
        nextIndex = (currentIndex + 1) % loadedImgObjects.length;
        slideStartTime = performance.now();
      }

      animationFrameId = requestAnimationFrame(animateMotion);
    }

    function drawKenBurns(ctx, img, w, h, scale, panX, opacity) {
      if (!img) return;
      ctx.globalAlpha = opacity;
      const imgRatio = img.width / img.height;
      const targetRatio = w / h;

      let baseW, baseH;
      if (imgRatio > targetRatio) {
        baseH = h;
        baseW = h * imgRatio;
      } else {
        baseW = w;
        baseH = w / imgRatio;
      }

      const drawW = baseW * scale;
      const drawH = baseH * scale;
      const dx = (w - drawW) / 2 + panX;
      const dy = (h - drawH) / 2;

      ctx.drawImage(img, dx, dy, drawW, drawH);
    }

    function drawRetroOverlays(ctx, w, h) {
      if (overlayStyle === 'none') return;

      const dateStr = "'26 10 11";

      if (overlayStyle === 'vhs') {
        // Blinking Red REC
        const blink = Math.floor(Date.now() / 600) % 2 === 0;
        ctx.fillStyle = blink ? '#ef4444' : 'rgba(239, 68, 68, 0.3)';
        ctx.beginPath();
        ctx.arc(32, 32, 7, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 15px "Share Tech Mono", monospace';
        ctx.textAlign = 'left';
        ctx.fillText('REC', 46, 37);

        // Battery indicator
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(w - 60, 24, 28, 14);
        ctx.fillRect(w - 32, 28, 3, 6);
        ctx.fillStyle = '#10b981';
        ctx.fillRect(w - 58, 26, 20, 10);

        // Date & Time Stamp at bottom right
        ctx.fillStyle = '#f59e0b';
        ctx.font = 'bold 20px "Share Tech Mono", monospace';
        ctx.textAlign = 'right';
        ctx.shadowColor = 'rgba(0,0,0,0.8)';
        ctx.shadowBlur = 4;
        ctx.fillText(`${dateStr}  PM 08:30`, w - 24, h - 24);
        ctx.shadowColor = 'transparent';
      } else if (overlayStyle === 'stamp') {
        ctx.fillStyle = '#ea580c';
        ctx.font = 'bold 22px "Share Tech Mono", monospace';
        ctx.textAlign = 'right';
        ctx.shadowColor = 'rgba(0,0,0,0.8)';
        ctx.shadowBlur = 4;
        ctx.fillText(dateStr, w - 24, h - 24);
        ctx.shadowColor = 'transparent';
      }
    }

    // High quality looping GIF generation via gifshot
    async function generateSlideGIF() {
      if (loadedImgObjects.length < 2) return;

      const statusEl = document.getElementById('gifStatus');
      statusEl.style.display = 'block';

      const w = 400;
      const h = currentRatio === '1:1' ? 400 : (currentRatio === '9:16' ? 710 : 225);

      const tempC = document.createElement('canvas');
      tempC.width = w; tempC.height = h;
      const tCtx = tempC.getContext('2d');
      tCtx.imageSmoothingEnabled = true; tCtx.imageSmoothingQuality = 'high';

      const frames = [];
      const numPhotos = loadedImgObjects.length;
      const framesPerPhoto = 6;

      for (let i = 0; i < numPhotos; i++) {
        const curImg = loadedImgObjects[i];
        const nextImg = loadedImgObjects[(i + 1) % numPhotos];

        for (let f = 0; f < framesPerPhoto; f++) {
          const prog = f / framesPerPhoto;
          tCtx.fillStyle = '#000';
          tCtx.fillRect(0, 0, w, h);

          const scale = 1.0 + 0.12 * prog;
          drawKenBurns(tCtx, curImg, w, h, scale, 0, 1.0);

          if (prog > 0.6) {
            const fade = (prog - 0.6) / 0.4;
            drawKenBurns(tCtx, nextImg, w, h, 1.12, 0, fade);
          }

          if (overlayStyle !== 'none') {
            tCtx.fillStyle = '#ea580c';
            tCtx.font = 'bold 16px monospace';
            tCtx.fillText("'26 10 11", w - 80, h - 14);
          }

          frames.push(tempC.toDataURL('image/jpeg', 0.85));
        }
      }

      gifshot.createGIF({
        images: frames,
        gifWidth: w,
        gifHeight: h,
        interval: 0.15,
        numWorkers: 2
      }, function(obj) {
        statusEl.style.display = 'none';
        if (!obj.error) {
          document.getElementById('gifOutput').src = obj.image;
          document.getElementById('gifDownload').href = obj.image;
          document.getElementById('gifArea').style.display = 'flex';
          document.getElementById('gifArea').scrollIntoView({ behavior: 'smooth' });
        } else {
          alert('GIF 생성 실패: ' + obj.error);
        }
      });
    }

    // Demo Samples Generator
    function getSampleSlides() {
      const samples = [
        { title: 'SUNSET HORIZON', col1: '#ec4899', col2: '#ec4899', emoji: '🌅' },
        { title: 'EMERALD FOREST', col1: '#059669', col2: '#10b981', emoji: '🌲' },
        { title: 'NEON CYBER CITY', col1: '#7c3aed', col2: '#06b6d4', emoji: '🏙️' },
        { title: 'MIDNIGHT OCEAN', col1: '#0284c7', col2: '#38bdf8', emoji: '🌊' }
      ];

      return samples.map(s => {
        const c = document.createElement('canvas');
        const S = 2;
        c.width = 600 * S; c.height = 600 * S;
        const ctx = c.getContext('2d');
        ctx.scale(S, S); ctx.imageSmoothingQuality = 'high';
        const grad = ctx.createLinearGradient(0, 0, 600, 600);
        grad.addColorStop(0, s.col1); grad.addColorStop(1, s.col2);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 600, 600);
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.beginPath(); ctx.arc(300, 240, 90, 0, Math.PI * 2); ctx.fill();
        ctx.font = '70px sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(s.emoji, 300, 240);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 30px "Outfit", sans-serif';
        ctx.fillText(s.title, 300, 390);
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        ctx.font = '18px monospace';
        ctx.fillText('CINEMATIC KEN BURNS MOTION', 300, 435);
        return c.toDataURL('image/jpeg', 0.9);
      });
    }

    function loadDemoSamples() {
      slideImages = getSampleSlides();
      updateSlideGallery();
      startSlideshow();
    }

    if (new URLSearchParams(window.location.search).get('demo') === '1') {
      window.addEventListener('DOMContentLoaded', () => setTimeout(loadDemoSamples, 100));
    }

    // Drag and Drop
    const cardEl = document.getElementById('inputCard');
    if (cardEl) {
      cardEl.addEventListener('dragover', (e) => { e.preventDefault(); cardEl.classList.add('drag-over'); });
      cardEl.addEventListener('dragleave', (e) => { e.preventDefault(); cardEl.classList.remove('drag-over'); });
      cardEl.addEventListener('drop', (e) => {
        e.preventDefault();
        cardEl.classList.remove('drag-over');
        if (e.dataTransfer && e.dataTransfer.files) {
          handleSlideUpload({ target: { files: e.dataTransfer.files } });
        }
      });
    }
  </script>
