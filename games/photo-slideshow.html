<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>켄 번스 무빙 슬라이드쇼 & 루핑 GIF | 미니게임 천국</title>
  <link rel="stylesheet" href="../styles/pretendard.css?v=c17883c9">
  <link rel="stylesheet" href="../styles/design-system.css?v=d12c2b80">
  <script src="../scripts/game-common.js?v=efdc1560"></script>
  <link rel="stylesheet" href="../styles/game-common.css?v=2187f848">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  
  <!-- gifshot for Looping GIF generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gifshot/0.3.2/gifshot.min.js"></script>

  <style>
    :root {
      /* 밝은 바탕에서 읽히도록 어둡게 한 글자색 */
      --yellow-ink: #865a0f;
      --card-bg: var(--surface);
      --card-border: var(--tint-2);
      --yellow: #f59e0b;
      --pink: #be1569;
      --cyan: #06b6d4;
      --purple: #6366f1;
      --text-main: var(--text);
      --text-dim: var(--muted);
      --radius-xl: 20px;
      --radius-lg: 14px;
      --radius-md: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: radial-gradient(circle at 50% 0%, var(--bg) 0%, var(--bg) 100%);
      color: var(--text-main);
      font-family: 'Pretendard', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 24px 20px;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      padding-bottom: 8px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .back-btn {
      background: var(--tint-1);
      border: 1px solid var(--card-border);
      color: var(--yellow-ink);
      font-size: 20px;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border-radius: 12px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .back-btn:hover {
      background: rgba(245, 158, 11, 0.15);
      border-color: var(--yellow);
      transform: translateX(-2px);
    }

    .header-title-box h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #b87c14 0%, #ec4899 50%, #ec4899 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-title-box p {
      font-size: 13px;
      color: var(--text-dim);
      margin-top: 2px;
    }

    .glass-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: var(--radius-xl);
      padding: 22px;
      box-shadow: 0 20px 40px -15px rgba(20, 26, 42, 0.16);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* Drop Zone */
    .drop-zone {
      border: 2px dashed rgba(245, 158, 11, 0.3);
      border-radius: var(--radius-lg);
      padding: 34px 24px;
      text-align: center;
      background: linear-gradient(180deg, rgba(245, 158, 11, 0.03) 0%, rgba(244, 63, 94, 0.02) 100%);
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .drop-zone:hover, .drop-zone.drag-over {
      border-color: var(--yellow);
      background: rgba(245, 158, 11, 0.08);
      transform: translateY(-2px);
    }

    .drop-icon-wrapper {
      width: 60px;
      height: 60px;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.2), rgba(244, 63, 94, 0.2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .drop-title { font-size: 16px; font-weight: 700; color: var(--text); }
    .drop-sub { font-size: 13px; color: var(--text-dim); }

    .demo-btn-pill {
      margin-top: 6px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: var(--tint-1);
      border: 1px solid var(--line);
      border-radius: 20px;
      color: #7d5e0e;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .demo-btn-pill:hover {
      background: rgba(245, 158, 11, 0.2);
      border-color: #fbbf24;
    }

    /* Photo Grid Tray */
    .tray-section {
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    .section-label {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .photo-grid-tray {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
      gap: 10px;
      max-height: 180px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .tray-thumb {
      position: relative;
      aspect-ratio: 1;
      border-radius: 10px;
      overflow: hidden;
      border: 1.5px solid var(--card-border);
      background: var(--surface);
    }

    .tray-thumb img { width: 100%; height: 100%; object-fit: cover; }

    .tray-del-btn {
      position: absolute;
      top: 4px; right: 4px;
      background: var(--surface);
      color: #be1569;
      border: 1px solid rgba(244, 63, 94, 0.4);
      width: 20px; height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Controls */
    .controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .ratio-btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .ratio-btn {
      padding: 8px 14px;
      border-radius: var(--radius-md);
      font-size: 12px;
      font-weight: 600;
      background: var(--tint-1);
      border: 1px solid var(--card-border);
      color: var(--text-dim);
      cursor: pointer;
      transition: all 0.2s;
    }

    .ratio-btn.active {
      background: rgba(245, 158, 11, 0.2);
      border-color: var(--yellow);
      color: #76610d;
    }

    /* Action Buttons */
    .btn-gradient-cinema {
      background: linear-gradient(135deg, #f59e0b 0%, #ec4899 50%, #ec4899 100%);
      border: none;
      color: var(--text);
      padding: 15px 24px;
      border-radius: var(--radius-md);
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 10px 25px -6px rgba(245, 158, 11, 0.23);
      transition: all 0.2s;
    }

    .btn-gradient-cinema:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px -6px rgba(244, 63, 94, 0.27);
    }

    /* Motion Canvas Cinema Viewer */
    .viewer-box {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      margin-top: 10px;
    }

    .cinema-frame {
      position: relative;
      max-width: 100%;
      box-shadow: 0 30px 60px -12px rgba(20, 26, 42, 0.16), 0 0 0 1px rgba(20, 26, 42, 0.03);
      border-radius: 14px;
      overflow: hidden;
      background: var(--surface);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      display: block;
      background: #000;
    }

    /* 캔버스는 고해상도로 그리고 화면에는 비율을 지킨 채 맞춰 보여 준다 (9:16도 한 화면에 들어오게) */
    #motionCanvas {
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 72vh;
    }

    /* Player HUD Control Bar */
    .player-hud-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 600px;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      padding: 10px 16px;
    }

    .hud-btn {
      background: var(--tint-2);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .hud-gif-group { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; align-items: center; }

    /* 저장 형식 GIF / 영상 */
    .hud-seg { display: inline-flex; background: var(--surface); border: 1px solid var(--card-border); border-radius: 8px; padding: 2px; }
    .hud-seg-btn { background: transparent; border: none; color: var(--text-dim); font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 6px; cursor: pointer; }
    .hud-seg-btn.active { background: var(--yellow); color: #1a1205; }
    .hud-seg-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    @media (max-width: 520px) {
      .player-hud-bar { flex-wrap: wrap; justify-content: center; }
      .hud-gif-group { width: 100%; justify-content: center; }
    }

    .hud-btn:hover { background: rgba(245, 158, 11, 0.2); border-color: var(--yellow); }

    .gif-status {
      color: var(--yellow-ink);
      font-size: 13px;
      text-align: center;
      display: none;
    }

    .gif-download-area {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: 100%;
      max-width: 600px;
    }

    .gif-download-area img {
      width: auto;
      max-width: 100%;
      max-height: 78vh;
      border-radius: 12px;
      border: 1px solid var(--line);
      box-shadow: 0 12px 30px rgba(20, 26, 42, 0.16);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-left">
        <a href="../index.html" class="back-btn" title="목록으로">←</a>
        <div class="header-title-box">
          <h1>📹 켄 번스 무빙 슬라이드쇼</h1>
          <p>영화적 카메라 줌/팬 모션 연출 & 레트로 필름 OSD 루핑 GIF 스튜디오</p>
        </div>
      </div>
    </header>

    <!-- Upload Card -->
    <div class="glass-card" id="inputCard">
      <div class="drop-zone" id="dropZone" onclick="document.getElementById('slideFiles').click()">
        <input type="file" id="slideFiles" multiple accept="image/*" style="display: none;" onchange="handleSlideUpload(event)">
        <div class="drop-icon-wrapper">🎞️</div>
        <div class="drop-title">슬라이드쇼에 넣을 사진들을 여러 장 업로드하거나 끌어다 놓으세요</div>
        <div class="drop-sub">클릭 또는 드래그 앤 드롭 (3~15장 추천)</div>
        <button type="button" class="demo-btn-pill" onclick="event.stopPropagation(); loadDemoSamples();">
          ✨ 시네마틱 노을 & 자연 샘플 4장 즉시 로드
        </button>
      </div>

      <!-- Controls -->
      <div class="tray-section" id="controlsGroup">
        <div class="section-label">
          <span>📸 등록된 사진 목록 (<span id="slideCount">0</span>장)</span>
          <span style="font-size: 12px; color: var(--text-dim); font-weight: normal;">순서대로 영화처럼 부드럽게 전환됩니다</span>
        </div>
        <div class="photo-grid-tray" id="photoGrid"></div>

        <div class="controls-grid">
          <div class="field-group">
            <label class="field-label">1. 화면 비율</label>
            <div class="ratio-btn-group" id="ratioOptions">
              <button class="ratio-btn active" onclick="setRatio('1:1', this)">🔲 1:1 정방형 (피드)</button>
              <button class="ratio-btn" onclick="setRatio('9:16', this)">📱 9:16 세로 (릴스/스토리)</button>
              <button class="ratio-btn" onclick="setRatio('16:9', this)">🖥️ 16:9 와이드 (영화/유튜브)</button>
            </div>
          </div>

          <div class="field-group">
            <label class="field-label">2. 전환 속도</label>
            <div class="ratio-btn-group" id="speedOptions">
              <button class="ratio-btn" onclick="setSpeed(2000, this)">⚡ 빠름 (2초)</button>
              <button class="ratio-btn active" onclick="setSpeed(3500, this)">⏱️ 보통 (3.5초)</button>
              <button class="ratio-btn" onclick="setSpeed(5000, this)">☕ 여유롭게 (5초)</button>
            </div>
          </div>
        </div>

        <div class="controls-grid">
          <div class="field-group">
            <label class="field-label">3. 레트로 오버레이 스타일</label>
            <div class="ratio-btn-group" id="stampOptions">
              <button class="ratio-btn active" onclick="setOverlayStyle('vhs', this)">📹 90s 캠코더 REC & 날짜</button>
              <button class="ratio-btn" onclick="setOverlayStyle('stamp', this)">🟠 오렌지 필름 날짜만</button>
              <button class="ratio-btn" onclick="setOverlayStyle('none', this)">🚫 오버레이 없음 (클린)</button>
            </div>
          </div>

          <div class="field-group">
            <label class="field-label">4. 감성 앰비언트 BGM 사운드</label>
            <div class="ratio-btn-group">
              <button class="ratio-btn active" id="bgmToggleBtn" onclick="toggleAmbientMusic()">🎵 잔잔한 앰비언트 패드 켜기</button>
            </div>
          </div>
        </div>

        <button class="btn-gradient-cinema" onclick="startSlideshow()">
          <span>▶ 켄 번스 시네마틱 슬라이드쇼 시작</span>
        </button>
      </div>

      <!-- Viewer Box -->
      <div class="viewer-box" id="viewerArea">
        <div class="section-label" style="width: 100%; max-width: 600px;">
          <span style="font-size: 15px; font-weight: 800; color: var(--text);">🎬 실시간 켄 번스 모션 시네마</span>
          <span style="font-size: 12px; color: var(--yellow-ink); font-weight: 700;">KEN BURNS ENGINE</span>
        </div>

        <div class="cinema-frame" id="cinemaFrame">
          <canvas id="motionCanvas"></canvas>
        </div>

        <!-- HUD Controls -->
        <div class="player-hud-bar">
          <button class="hud-btn" id="playPauseBtn" onclick="togglePlayPause()">⏸️ 일시 정지</button>
          <span id="currentSlideIdxText" style="font-size: 12px; color: var(--text-dim); font-weight: 600;">1 / 4</span>
          <span class="hud-gif-group">
            <span class="hud-seg" role="group" aria-label="저장 형식">
              <button class="hud-seg-btn active" data-out="gif" onclick="setSlideOutput('gif', this)">GIF</button>
              <button class="hud-seg-btn" data-out="mp4" id="slideOutMp4" onclick="setSlideOutput('mp4', this)">영상</button>
            </span>
            <button class="hud-btn" onclick="exportSlides()">🎁 저장 (현재 비율)</button>
            <button class="hud-btn" onclick="exportSlides('9:16')">📱 스토리 9:16</button>
          </span>
        </div>

        <div class="gif-status" id="gifStatus">⏳ 고화질 루핑 GIF 생성 중입니다. 잠시만 기다려주세요...</div>

        <div class="gif-download-area" id="gifArea">
          <div class="section-label" style="width: 100%;"><span id="exportTitle">🎉 완성된 감성 루핑 GIF</span></div>
          <img id="gifOutput" src="" alt="GIF Output">

          <button class="btn-gradient-cinema" style="width: 100%;" onclick="saveSlideGifToGallery()">
            📲 사진첩에 저장 / 공유
          </button>
          <a id="gifDownload" class="hud-btn" style="text-decoration: none; justify-content: center; width: 100%;" download="slideshow_loop.gif">
            📥 파일로 다운로드
          </a>
        </div>
      </div>
    </div>
  </div>

  <script>
    let slideImages = [];
    let currentRatio = '1:1';
    let slideDuration = 3500;
    let overlayStyle = 'vhs';
    let isPlaying = false;
    let animationFrameId = null;

    let currentIndex = 0;
    let nextIndex = 1;
    let slideStartTime = 0;
    let loadedImgObjects = [];

    // Native Web Audio Synthesizer for Soothing Ambient Music Pad
    let audioCtx = null;
    let ambientGain = null;
    let isBgmPlaying = false;

    function toggleAmbientMusic() {
      const btn = document.getElementById('bgmToggleBtn');
      if (isBgmPlaying) {
        if (ambientGain) ambientGain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
        isBgmPlaying = false;
        btn.textContent = '🎵 앰비언트 BGM 꺼짐 (클릭하여 켜기)';
        btn.classList.remove('active');
      } else {
        startAmbientSynth();
        isBgmPlaying = true;
        btn.textContent = '🎶 앰비언트 BGM 연주 중 (클릭하여 끄기)';
        btn.classList.add('active');
      }
    }

    function startAmbientSynth() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        if (!audioCtx) audioCtx = new AudioContext();

        ambientGain = audioCtx.createGain();
        ambientGain.gain.setValueAtTime(0.001, audioCtx.currentTime);
        ambientGain.gain.linearRampToValueAtTime(0.08, audioCtx.currentTime + 1.5);

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 600;

        // Dreamy chord (F major 9: F3, A3, C4, E4)
        const freqs = [174.61, 220.00, 261.63, 329.63];
        freqs.forEach(f => {
          const osc = audioCtx.createOscillator();
          osc.type = 'sine';
          osc.frequency.value = f;
          osc.connect(filter);
          osc.start();
        });

        filter.connect(ambientGain);
        ambientGain.connect(audioCtx.destination);
      } catch (e) {}
    }

    async function handleSlideUpload(event) {
      const files = Array.from(event.target.files || []);
      const images = files.filter(f => f.type.startsWith('image/'));
      event.target.value = '';
      if (!images.length) return;

      for (const file of images) {
        try {
          const { dataUrl } = await loadPhotoFile(file, 2000);
          slideImages.push(dataUrl);
          updateSlideGallery();
        } catch (err) {
          alert(err.message);
        }
      }
    }

    function removeSlide(idx) {
      slideImages.splice(idx, 1);
      updateSlideGallery();
    }

    function updateSlideGallery() {
      const grid = document.getElementById('photoGrid');
      const count = document.getElementById('slideCount');
      const controls = document.getElementById('controlsGroup');

      grid.innerHTML = '';
      count.textContent = slideImages.length;

      slideImages.forEach((src, idx) => {
        const box = document.createElement('div');
        box.className = 'tray-thumb';
        box.innerHTML = `
          <img src="${src}" alt="slide">
          <button class="tray-del-btn" onclick="removeSlide(${idx})">✕</button>
        `;
        grid.appendChild(box);
      });

      controls.style.display = slideImages.length > 0 ? 'flex' : 'none';
    }

    function setRatio(ratio, el) {
      currentRatio = ratio;
      document.querySelectorAll('#ratioOptions .ratio-btn').forEach(b => b.classList.remove('active'));
      if (el) el.classList.add('active');
    }

    function setSpeed(dur, el) {
      slideDuration = dur;
      document.querySelectorAll('#speedOptions .ratio-btn').forEach(b => b.classList.remove('active'));
      if (el) el.classList.add('active');
    }

    function setOverlayStyle(style, el) {
      overlayStyle = style;
      document.querySelectorAll('#stampOptions .ratio-btn').forEach(b => b.classList.remove('active'));
      if (el) el.classList.add('active');
    }

    async function startSlideshow() {
      if (slideImages.length < 2) {
        alert('슬라이드쇼를 위해 최소 2장 이상의 사진을 올려주세요.');
        return;
      }

      document.getElementById('viewerArea').style.display = 'flex';
      document.getElementById('viewerArea').scrollIntoView({ behavior: 'smooth' });

      const canvas = document.getElementById('motionCanvas');
      if (currentRatio === '1:1') {
        canvas.width = 900; canvas.height = 900;
      } else if (currentRatio === '9:16') {
        canvas.width = 675; canvas.height = 1200;
      } else {
        canvas.width = 1200; canvas.height = 675;
      }

      loadedImgObjects = await Promise.all(slideImages.map(src => {
        return new Promise(res => {
          const img = new Image();
          img.onload = () => res(img);
          img.src = src;
        });
      }));

      currentIndex = 0;
      nextIndex = 1;
      slideStartTime = performance.now();
      isPlaying = true;
      document.getElementById('playPauseBtn').textContent = '⏸️ 일시 정지';

      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      animateMotion(performance.now());
    }

    function togglePlayPause() {
      isPlaying = !isPlaying;
      document.getElementById('playPauseBtn').textContent = isPlaying ? '⏸️ 일시 정지' : '▶ 계속 재생';
      if (isPlaying) {
        slideStartTime = performance.now();
        animateMotion(performance.now());
      }
    }

    function animateMotion(time) {
      if (!isPlaying) return;

      const elapsed = time - slideStartTime;
      const progress = Math.min(1, elapsed / slideDuration);

      const canvas = document.getElementById('motionCanvas');
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';

      renderSlideFrame(ctx, canvas.width, canvas.height, {
        story: currentRatio === '9:16',
        index: currentIndex,
        progress,
        fadeStart: 0.65,
        blink: Math.floor(Date.now() / 600) % 2 === 0
      });

      // Update HUD Index
      document.getElementById('currentSlideIdxText').textContent = `${currentIndex + 1} / ${loadedImgObjects.length}`;

      if (progress >= 1) {
        currentIndex = nextIndex;
        nextIndex = (currentIndex + 1) % loadedImgObjects.length;
        slideStartTime = performance.now();
      }

      animationFrameId = requestAnimationFrame(animateMotion);
    }

    // 실시간 재생과 GIF가 같은 장면을 그리도록 한 프레임을 통째로 여기서 만든다.
    // k는 실시간 캔버스(짧은 변 675~900px) 대비 글자·여백 배율이다.
    function renderSlideFrame(ctx, w, h, { story, index, progress, fadeStart, blink }) {
      const n = loadedImgObjects.length;
      const k = story ? w / 675 : Math.min(w, h) / (w === h ? 900 : 675);
      const curImg = loadedImgObjects[index];
      const nextImg = loadedImgObjects[(index + 1) % n];
      const startPan = -12 * k;

      ctx.globalAlpha = 1;
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, w, h);

      // 현재 사진: 1.0 → 1.15 줌인 + 살짝 좌우 이동
      const scale = 1.0 + 0.15 * progress;
      const pan = (progress - 0.5) * 24 * k;
      drawSlideLayer(ctx, curImg, w, h, story, scale, pan, 1.0, k);

      // 마지막 구간에서 다음 사진이 1.15 → 1.0으로 줌아웃하며 겹쳐 들어온다
      // (끝 상태가 다음 장의 시작 상태와 같아야 장이 넘어갈 때 튀지 않는다)
      if (progress > fadeStart) {
        const fade = (progress - fadeStart) / (1 - fadeStart);
        drawSlideLayer(ctx, nextImg, w, h, story, 1.15 - 0.15 * fade, startPan, fade, k);
      }
      ctx.globalAlpha = 1;

      if (story) drawStoryChrome(ctx, w, h, k, index, progress);
      drawRetroOverlays(ctx, w, h, { k, top: story ? 22 * k : 0, blink });
    }

    // 스토리(9:16)에서 가로 사진을 꽉 채우면 양옆이 절반 넘게 잘린다.
    // 세로에 가까운 사진은 꽉 채우고, 그 외에는 흐린 배경 위에 사진 카드를 띄운다.
    function drawSlideLayer(ctx, img, w, h, story, scale, panX, opacity, k) {
      if (!img) return;
      if (!story || img.width / img.height <= 0.8) {
        drawKenBurns(ctx, img, w, h, scale, panX, opacity);
        return;
      }

      ctx.save();
      ctx.globalAlpha = opacity;
      drawBlurredCover(ctx, img, w, h);
      ctx.fillStyle = 'rgba(7, 9, 14, 0.38)';
      ctx.fillRect(0, 0, w, h);

      const pad = 34 * k;
      const cardW = w - pad * 2;
      const cardH = Math.min(cardW / (img.width / img.height), h * 0.6);
      const cardX = pad;
      const cardY = (h - cardH) / 2 - 18 * k;
      const r = 18 * k;

      ctx.shadowColor = 'rgba(0, 0, 0, 0.55)';
      ctx.shadowBlur = 40 * k;
      ctx.shadowOffsetY = 16 * k;
      ctx.fillStyle = '#000';
      roundRectPath(ctx, cardX, cardY, cardW, cardH, r);
      ctx.fill();
      ctx.shadowColor = 'transparent';

      ctx.save();
      roundRectPath(ctx, cardX, cardY, cardW, cardH, r);
      ctx.clip();
      ctx.translate(cardX, cardY);
      drawKenBurns(ctx, img, cardW, cardH, scale, panX, opacity);
      ctx.restore();

      ctx.globalAlpha = opacity;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
      ctx.lineWidth = 3 * k;
      roundRectPath(ctx, cardX, cardY, cardW, cardH, r);
      ctx.stroke();
      ctx.restore();
    }

    // ctx.filter의 blur는 사파리에서 안 먹으므로, 아주 작게 줄였다 키우는 방식으로 흐림을 만든다
    const blurCache = new WeakMap();
    function drawBlurredCover(ctx, img, w, h) {
      let small = blurCache.get(img);
      if (!small) {
        small = document.createElement('canvas');
        const sw = 24;
        small.width = sw;
        small.height = Math.max(1, Math.round(sw * img.height / img.width));
        const sCtx = small.getContext('2d');
        sCtx.imageSmoothingEnabled = true; sCtx.imageSmoothingQuality = 'high';
        sCtx.drawImage(img, 0, 0, small.width, small.height);
        blurCache.set(img, small);
      }
      const ratio = small.width / small.height;
      let dw = w, dh = w / ratio;
      if (dh < h) { dh = h; dw = h * ratio; }
      // 가장자리가 비치지 않게 조금 더 크게 그린다
      dw *= 1.15; dh *= 1.15;
      ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(small, (w - dw) / 2, (h - dh) / 2, dw, dh);
    }

    function roundRectPath(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    // 인스타 스토리처럼 상단 진행 막대와 하단 장 번호
    function drawStoryChrome(ctx, w, h, k, index, progress) {
      const n = loadedImgObjects.length;
      const margin = 18 * k, gap = 6 * k, barH = 4 * k, y = 16 * k;
      const segW = (w - margin * 2 - gap * (n - 1)) / n;

      const topShade = ctx.createLinearGradient(0, 0, 0, 110 * k);
      topShade.addColorStop(0, 'rgba(0, 0, 0, 0.45)');
      topShade.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = topShade;
      ctx.fillRect(0, 0, w, 110 * k);

      const bottomShade = ctx.createLinearGradient(0, h - 200 * k, 0, h);
      bottomShade.addColorStop(0, 'rgba(0, 0, 0, 0)');
      bottomShade.addColorStop(1, 'rgba(0, 0, 0, 0.6)');
      ctx.fillStyle = bottomShade;
      ctx.fillRect(0, h - 200 * k, w, 200 * k);

      for (let i = 0; i < n; i++) {
        const x = margin + i * (segW + gap);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
        roundRectPath(ctx, x, y, segW, barH, barH / 2);
        ctx.fill();
        const fill = i < index ? 1 : (i === index ? progress : 0);
        if (fill > 0) {
          ctx.fillStyle = '#ffffff';
          roundRectPath(ctx, x, y, Math.max(barH, segW * fill), barH, barH / 2);
          ctx.fill();
        }
      }

      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
      ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
      ctx.shadowBlur = 8 * k;
      ctx.fillStyle = '#ffffff';
      ctx.font = `800 ${46 * k}px "Pretendard", sans-serif`;
      const num = String(index + 1).padStart(2, '0');
      ctx.fillText(num, 28 * k, h - 30 * k);
      const numW = ctx.measureText(num).width;
      ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
      ctx.font = `600 ${20 * k}px "Pretendard", sans-serif`;
      ctx.fillText(`/ ${String(n).padStart(2, '0')}`, 28 * k + numW + 8 * k, h - 32 * k);
      ctx.shadowColor = 'transparent';
    }

    function drawKenBurns(ctx, img, w, h, scale, panX, opacity) {
      if (!img) return;
      ctx.globalAlpha = opacity;
      const imgRatio = img.width / img.height;
      const targetRatio = w / h;

      let baseW, baseH;
      if (imgRatio > targetRatio) {
        baseH = h;
        baseW = h * imgRatio;
      } else {
        baseW = w;
        baseH = w / imgRatio;
      }

      const drawW = baseW * scale;
      const drawH = baseH * scale;
      const dx = (w - drawW) / 2 + panX;
      const dy = (h - drawH) / 2;

      ctx.drawImage(img, dx, dy, drawW, drawH);
    }

    // 날짜 스탬프는 실제 오늘 날짜로 찍는다 (캠코더처럼 'YY MM DD)
    function stampDate() {
      const d = new Date();
      const p2 = (v) => String(v).padStart(2, '0');
      const hh = d.getHours();
      return {
        date: `'${p2(d.getFullYear() % 100)} ${p2(d.getMonth() + 1)} ${p2(d.getDate())}`,
        time: `${hh < 12 ? 'AM' : 'PM'} ${p2(hh % 12 || 12)}:${p2(d.getMinutes())}`
      };
    }

    function drawRetroOverlays(ctx, w, h, { k = 1, top = 0, blink = true } = {}) {
      if (overlayStyle === 'none') return;

      const { date: dateStr, time: timeStr } = stampDate();
      ctx.textBaseline = 'alphabetic';

      if (overlayStyle === 'vhs') {
        // Blinking Red REC
        ctx.fillStyle = blink ? '#ef4444' : 'rgba(239, 68, 68, 0.3)';
        ctx.beginPath();
        ctx.arc(32 * k, top + 32 * k, 7 * k, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.font = `bold ${15 * k}px "Share Tech Mono", monospace`;
        ctx.textAlign = 'left';
        ctx.fillText('REC', 46 * k, top + 37 * k);

        // Battery indicator
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5 * k;
        ctx.strokeRect(w - 60 * k, top + 24 * k, 28 * k, 14 * k);
        ctx.fillRect(w - 32 * k, top + 28 * k, 3 * k, 6 * k);
        ctx.fillStyle = '#10b981';
        ctx.fillRect(w - 58 * k, top + 26 * k, 20 * k, 10 * k);

        // Date & Time Stamp at bottom right
        ctx.fillStyle = '#f59e0b';
        ctx.font = `bold ${20 * k}px "Share Tech Mono", monospace`;
        ctx.textAlign = 'right';
        ctx.shadowColor = 'rgba(0,0,0,0.8)';
        ctx.shadowBlur = 4 * k;
        ctx.fillText(`${dateStr}  ${timeStr}`, w - 24 * k, h - 30 * k);
        ctx.shadowColor = 'transparent';
      } else if (overlayStyle === 'stamp') {
        ctx.fillStyle = '#ea580c';
        ctx.font = `bold ${22 * k}px "Share Tech Mono", monospace`;
        ctx.textAlign = 'right';
        ctx.shadowColor = 'rgba(0,0,0,0.8)';
        ctx.shadowBlur = 4 * k;
        ctx.fillText(dateStr, w - 24 * k, h - 30 * k);
        ctx.shadowColor = 'transparent';
      }
    }

    // 루핑 GIF: 정사각/와이드는 현재 비율 그대로, 스토리는 540×960 세로로 만든다.
    // 크기를 키운 만큼 장당 프레임은 아껴서 용량을 공유 가능한 수준으로 묶는다.
    // 영상 인코더가 없는 브라우저에서는 영상 버튼을 끈다 (DOM이 이 스크립트보다 앞에 있다)
    if (!canRecordMp4()) {
      const b = document.getElementById('slideOutMp4');
      if (b) { b.disabled = true; b.title = '이 브라우저는 영상 저장을 지원하지 않아요'; }
    }

    let lastSlideGifBlob = null;
    let lastSlideGifName = 'slideshow_loop.gif';

    function saveSlideGifToGallery() {
      if (lastSlideGifBlob) saveToGallery(lastSlideGifBlob, lastSlideGifName);
    }

    let slideOutput = 'gif';

    function setSlideOutput(kind, el) {
      slideOutput = kind;
      document.querySelectorAll('.hud-seg-btn').forEach(b => b.classList.toggle('active', b === el));
    }

    function exportSlides(format) {
      return slideOutput === 'mp4' ? generateSlideVideo(format) : generateSlideGIF(format);
    }

    // 영상(MP4): 인스타그램 규격 1080p로, 고른 전환 속도 그대로 초당 30프레임으로 만든다.
    // GIF와 달리 화질을 줄일 필요가 없고, 용량도 보통 더 작다.
    async function generateSlideVideo(format) {
      if (loadedImgObjects.length < 2) return;
      const ratio = format || currentRatio;
      const story = ratio === '9:16';
      const [w, h] = story ? [1080, 1920] : (ratio === '1:1' ? [1080, 1080] : [1920, 1080]);
      const fps = 30;

      const statusEl = document.getElementById('gifStatus');
      statusEl.style.display = 'block';
      statusEl.textContent = '⏳ 영상(MP4)을 만드는 중입니다...';

      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';

      let writer;
      try {
        writer = await createMp4Writer(w, h, { fps });
      } catch (err) {
        statusEl.style.display = 'none';
        alert(err.message);
        return;
      }

      const perPhoto = Math.max(fps, Math.round(slideDuration / 1000 * fps));
      const total = perPhoto * loadedImgObjects.length;
      let blob;
      try {
        let n = 0;
        for (let i = 0; i < loadedImgObjects.length; i++) {
          for (let f = 0; f < perPhoto; f++, n++) {
            // 마지막 장은 첫 장으로 넘어가며 끝나서, 반복 재생해도 이어진다
            renderSlideFrame(ctx, w, h, {
              story,
              index: i,
              progress: f / perPhoto,
              fadeStart: 0.65,
              blink: Math.floor(n / (fps * 0.6)) % 2 === 0
            });
            await writer.addFrame(c);
            if (n % 15 === 0) {
              statusEl.textContent = `⏳ 영상(MP4)을 만드는 중입니다... ${Math.round(n / total * 100)}%`;
              await yieldToBrowser();
            }
          }
        }
        blob = await writer.finish();
      } catch (err) {
        writer.cancel();
        statusEl.style.display = 'none';
        alert('영상 생성 실패: ' + err.message);
        return;
      }

      statusEl.style.display = 'none';
      showSlideExport(blob, story ? 'slideshow_story_9x16.mp4' : `slideshow_${ratio.replace(':', 'x')}.mp4`, true);
    }

    // 완성된 GIF·영상을 결과 칸에 보여 주고 저장 버튼에 연결한다
    let lastSlideUrl = null;
    function showSlideExport(blob, name, isVideo) {
      lastSlideGifBlob = blob;
      lastSlideGifName = name;
      if (lastSlideUrl) URL.revokeObjectURL(lastSlideUrl);
      lastSlideUrl = URL.createObjectURL(blob);
      const img = document.getElementById('gifOutput');
      const vid = document.getElementById('videoOutput');
      img.style.display = isVideo ? 'none' : '';
      vid.style.display = isVideo ? '' : 'none';
      if (isVideo) { vid.src = lastSlideUrl; vid.play().catch(() => {}); } else { vid.removeAttribute('src'); img.src = lastSlideUrl; }
      const dl = document.getElementById('gifDownload');
      dl.href = lastSlideUrl;
      dl.download = name;
      document.getElementById('exportTitle').textContent =
        `🎉 완성된 ${isVideo ? '슬라이드쇼 영상' : '감성 루핑 GIF'} · ${(blob.size / 1048576).toFixed(1)}MB`;
      document.getElementById('gifArea').style.display = 'flex';
      document.getElementById('gifArea').scrollIntoView({ behavior: 'smooth' });
    }

    async function generateSlideGIF(format) {
      if (loadedImgObjects.length < 2) return;

      const ratio = format || currentRatio;
      const story = ratio === '9:16';
      const [w, h] = story ? [540, 960] : (ratio === '1:1' ? [600, 600] : [800, 450]);

      const statusEl = document.getElementById('gifStatus');
      statusEl.textContent = story
        ? '⏳ 세로 스토리 GIF(540×960)를 만드는 중입니다. 잠시만 기다려주세요...'
        : '⏳ 고화질 루핑 GIF 생성 중입니다. 잠시만 기다려주세요...';
      statusEl.style.display = 'block';

      const tempC = document.createElement('canvas');
      tempC.width = w; tempC.height = h;
      const tCtx = tempC.getContext('2d');
      tCtx.imageSmoothingEnabled = true; tCtx.imageSmoothingQuality = 'high';

      const frames = [];
      const numPhotos = loadedImgObjects.length;
      const framesPerPhoto = 8;

      for (let i = 0; i < numPhotos; i++) {
        for (let f = 0; f < framesPerPhoto; f++) {
          // 마지막 프레임에서 다음 장으로 완전히 넘어가 있어야 루프가 끊기지 않는다
          renderSlideFrame(tCtx, w, h, {
            story,
            index: i,
            progress: f / (framesPerPhoto - 1),
            fadeStart: 0.6,
            blink: Math.floor(frames.length / 3) % 2 === 0
          });
          frames.push(tempC.toDataURL('image/jpeg', 0.82));
        }
        // 프레임을 많이 쌓는 동안 화면이 멈춰 보이지 않게 숨을 돌린다
        await new Promise(r => setTimeout(r, 0));
      }

      gifshot.createGIF({
        images: frames,
        gifWidth: w,
        gifHeight: h,
        interval: 0.14,
        numWorkers: 2
      }, function(obj) {
        statusEl.style.display = 'none';
        if (!obj.error) {
          // 공유 시트는 클릭 직후에만 열 수 있어, 저장 버튼을 누르기 전에 파일을 미리 만들어 둔다
          fetch(obj.image).then(r => r.blob()).then(b => {
            showSlideExport(b, story ? 'slideshow_story_9x16.gif' : 'slideshow_loop.gif', false);
          });
        } else {
          alert('GIF 생성 실패: ' + obj.error);
        }
      });
    }

    // Demo Samples Generator
    function getSampleSlides() {
      const samples = [
        { title: 'SUNSET HORIZON', col1: '#ec4899', col2: '#ec4899', emoji: '🌅' },
        { title: 'EMERALD FOREST', col1: '#059669', col2: '#10b981', emoji: '🌲' },
        { title: 'NEON CYBER CITY', col1: '#7c3aed', col2: '#06b6d4', emoji: '🏙️' },
        { title: 'MIDNIGHT OCEAN', col1: '#0284c7', col2: '#38bdf8', emoji: '🌊' }
      ];

      return samples.map(s => {
        const c = document.createElement('canvas');
        const S = 2;
        c.width = 600 * S; c.height = 600 * S;
        const ctx = c.getContext('2d');
        ctx.scale(S, S); ctx.imageSmoothingQuality = 'high';
        const grad = ctx.createLinearGradient(0, 0, 600, 600);
        grad.addColorStop(0, s.col1); grad.addColorStop(1, s.col2);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 600, 600);
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.beginPath(); ctx.arc(300, 240, 90, 0, Math.PI * 2); ctx.fill();
        ctx.font = '70px sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(s.emoji, 300, 240);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 30px "Pretendard", sans-serif';
        ctx.fillText(s.title, 300, 390);
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        ctx.font = '18px monospace';
        ctx.fillText('CINEMATIC KEN BURNS MOTION', 300, 435);
        return c.toDataURL('image/jpeg', 0.9);
      });
    }

    function loadDemoSamples() {
      slideImages = getSampleSlides();
      updateSlideGallery();
      startSlideshow();
    }

    if (new URLSearchParams(window.location.search).get('demo') === '1') {
      window.addEventListener('DOMContentLoaded', () => setTimeout(loadDemoSamples, 100));
    }

    // Drag and Drop
    const cardEl = document.getElementById('inputCard');
    if (cardEl) {
      cardEl.addEventListener('dragover', (e) => { e.preventDefault(); cardEl.classList.add('drag-over'); });
      cardEl.addEventListener('dragleave', (e) => { e.preventDefault(); cardEl.classList.remove('drag-over'); });
      cardEl.addEventListener('drop', (e) => {
        e.preventDefault();
        cardEl.classList.remove('drag-over');
        if (e.dataTransfer && e.dataTransfer.files) {
          handleSlideUpload({ target: { files: e.dataTransfer.files } });
        }
      });
    }
  </script>
</body>
</html>
