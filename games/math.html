<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1분 산수 - 미니게임 천국</title>
    <link rel="stylesheet" href="../styles/game-common.css?v=2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        .math-layout {
            display: grid;
            gap: 1.5rem;
        }

        .math-card {
            border-radius: 24px;
            border: 1px solid var(--border-color);
            background: radial-gradient(circle at top, rgba(99, 102, 241, 0.16), rgba(15, 23, 42, 0.96));
            padding: 1.5rem;
            text-align: center;
            min-height: 240px;
            display: grid;
            place-items: center;
        }

        .question-label {
            color: var(--text-secondary);
            margin-bottom: 0.75rem;
        }

        .question-text {
            font-size: clamp(2.4rem, 8vw, 4.5rem);
            font-weight: 800;
            letter-spacing: 0.04em;
        }

        .answer-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(120px, 1fr));
            gap: 1rem;
        }

        .answer-button {
            padding: 1.25rem 1rem;
            border-radius: 18px;
            border: 1px solid var(--border-color);
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 1.15rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.16s ease, border-color 0.16s ease;
        }

        .answer-button:hover {
            transform: translateY(-2px);
            border-color: var(--accent-primary);
        }

        .feedback {
            min-height: 1.5rem;
            text-align: center;
            font-weight: 700;
            color: var(--accent-primary);
        }
    </style>
</head>

<body>
    <div class="game-container">
        <div class="game-header">
            <a href="../index.html" class="back-button">← 메인으로</a>
            <h1 class="game-title">➗ 1분 산수</h1>
            <p class="game-description">60초 안에 최대한 많은 문제를 풀어 콤보를 이어가세요.</p>
        </div>

        <div class="status-bar">
            <div class="status-item">
                <span class="status-label">점수</span>
                <div class="status-value" id="score">0</div>
            </div>
            <div class="status-item">
                <span class="status-label">콤보</span>
                <div class="status-value" id="combo">0</div>
            </div>
            <div class="status-item">
                <span class="status-label">남은 시간</span>
                <div class="status-value" id="time">60</div>
            </div>
            <div class="status-item">
                <span class="status-label">베스트</span>
                <div class="status-value" id="best-score">0</div>
            </div>
        </div>

        <div class="game-board">
            <div class="math-layout">
                <div class="math-card">
                    <div>
                        <div class="question-label">현재 문제</div>
                        <div class="question-text" id="question-text">준비</div>
                    </div>
                </div>
                <div class="feedback" id="feedback">시작 버튼을 누르면 60초 동안 진행됩니다.</div>
                <div class="answer-grid" id="answer-grid"></div>
            </div>
        </div>

        <div class="controls">
            <button class="button" onclick="startGame()">게임 시작</button>
            <button class="button button-secondary" onclick="resetGame()">리셋</button>
        </div>
    </div>

    <script>
        const questionText = document.getElementById('question-text');
        const feedbackElement = document.getElementById('feedback');
        const answerGrid = document.getElementById('answer-grid');
        const scoreElement = document.getElementById('score');
        const comboElement = document.getElementById('combo');
        const timeElement = document.getElementById('time');
        const bestScoreElement = document.getElementById('best-score');

        let score = 0;
        let combo = 0;
        let timeLeft = 60;
        let bestScore = Number(localStorage.getItem('math-best-score') || 0);
        let correctAnswer = 0;
        let isRunning = false;
        let timer = null;

        function updateStats() {
            scoreElement.textContent = score;
            comboElement.textContent = combo;
            timeElement.textContent = timeLeft;
            bestScoreElement.textContent = bestScore;
        }

        function randomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function shuffle(array) {
            const copy = [...array];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        function createProblem() {
            const difficulty = Math.min(5, 1 + Math.floor(score / 60));
            const operations = ['+', '-', '*'];
            if (difficulty >= 4) {
                operations.push('/');
            }

            const operator = operations[Math.floor(Math.random() * operations.length)];
            let a;
            let b;

            if (operator === '+') {
                a = randomInt(5, 25 + difficulty * 6);
                b = randomInt(5, 25 + difficulty * 6);
                correctAnswer = a + b;
            } else if (operator === '-') {
                a = randomInt(15, 35 + difficulty * 6);
                b = randomInt(3, a - 1);
                correctAnswer = a - b;
            } else if (operator === '*') {
                a = randomInt(2, 6 + difficulty);
                b = randomInt(2, 7 + difficulty);
                correctAnswer = a * b;
            } else {
                b = randomInt(2, 6 + difficulty);
                correctAnswer = randomInt(2, 8 + difficulty);
                a = b * correctAnswer;
            }

            questionText.textContent = `${a} ${operator} ${b}`;
            renderAnswers(correctAnswer);
        }

        function renderAnswers(answer) {
            const options = new Set([answer]);
            while (options.size < 4) {
                const spread = Math.max(3, Math.floor(Math.abs(answer) * 0.25));
                const candidate = answer + randomInt(-spread, spread);
                if (candidate !== answer) {
                    options.add(candidate);
                }
            }

            answerGrid.innerHTML = '';
            shuffle(Array.from(options)).forEach((option, index) => {
                const button = document.createElement('button');
                button.className = 'answer-button';
                button.type = 'button';
                button.textContent = `${index + 1}. ${option}`;
                button.addEventListener('click', () => submitAnswer(option));
                answerGrid.appendChild(button);
            });
        }

        function submitAnswer(answer) {
            if (!isRunning) {
                feedbackElement.textContent = '먼저 게임을 시작하세요.';
                return;
            }

            if (answer === correctAnswer) {
                combo += 1;
                score += 12 + Math.min(20, combo * 2);
                feedbackElement.textContent = '정답! 콤보가 이어집니다.';
            } else {
                combo = 0;
                score = Math.max(0, score - 6);
                feedbackElement.textContent = `오답! 정답은 ${correctAnswer}`;
            }

            updateStats();
            createProblem();
        }

        function startGame() {
            resetGame(false);
            isRunning = true;
            feedbackElement.textContent = '시작! 최대한 빠르게 계산하세요.';
            createProblem();

            timer = setInterval(() => {
                timeLeft -= 1;
                updateStats();
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        function endGame() {
            isRunning = false;
            clearInterval(timer);
            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem('math-best-score', String(bestScore));
                feedbackElement.textContent = `시간 종료! 새로운 최고 점수 ${bestScore}점`;
            } else {
                feedbackElement.textContent = `시간 종료! 이번 점수는 ${score}점`;
            }
            updateStats();
        }

        function resetGame(showMessage = true) {
            isRunning = false;
            clearInterval(timer);
            score = 0;
            combo = 0;
            timeLeft = 60;
            questionText.textContent = '준비';
            answerGrid.innerHTML = '';
            if (showMessage) {
                feedbackElement.textContent = '준비 완료. 시작 버튼을 누르세요.';
            }
            updateStats();
        }

        document.addEventListener('keydown', (event) => {
            const index = Number(event.key) - 1;
            if (index >= 0 && index < answerGrid.children.length) {
                answerGrid.children[index].click();
            }
        });

        updateStats();
    </script>
    <script type="application/json" id="game-rules">
{
 "title": "1분 산수",
 "goal": "60초 안에 최대한 많은 문제를 맞히세요.",
 "steps": [
  "시작을 누르면 60초 타이머가 돌아갑니다.",
  "화면의 계산 문제를 보고 답을 입력합니다.",
  "숫자 키패드나 키보드로 입력하고 엔터로 제출합니다.",
  "시간이 끝나면 맞힌 개수가 점수가 됩니다."
 ],
 "tips": [
  "틀려도 넘어가는 게 이득입니다. 막히면 다음 문제로 가세요.",
  "최고 점수는 자동 저장됩니다."
 ],
 "players": "1인",
 "time": "약 1분"
}
</script>
<script src="../scripts/game-common.js?v=2"></script>
</body>

</html>
