<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>불꽃놀이 메이커 - Fireworks Maker</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&family=Outfit:wght@800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #020208;
            --panel-bg: rgba(10, 10, 20, 0.6);
            --border-color: rgba(168, 85, 247, 0.2);
            --text-main: #f3e8ff;
            --text-muted: #a855f7;
            --neon-pink: #ec4899;
            --neon-cyan: #06b6d4;
            --neon-gold: #eab308;
            --glass-glow: 0 0 15px rgba(168, 85, 247, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        header {
            width: 100%; max-width: 600px; padding: 15px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 100;
            position: absolute; top: 0;
        }
        h1 { font-family: 'Outfit', sans-serif; font-size: 1.4rem; letter-spacing: 1px; color: #fff; text-shadow: var(--glass-glow); }

        .btn-icon {
            background: var(--panel-bg); border: 1px solid var(--border-color); color: white;
            width: 40px; height: 40px; border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center; font-size: 1.2rem;
            transition: all 0.2s;
        }
        .btn-icon:hover { background: rgba(168, 85, 247, 0.2); transform: scale(1.05); }

        /* Canvas covering screen */
        #canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
            cursor: crosshair;
        }

        /* Controls Panel (Collapsible floating glassmorphism) */
        .controls-panel {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 450px;
            background: rgba(10, 10, 20, 0.75); backdrop-filter: blur(20px);
            border: 1px solid var(--border-color); border-radius: 20px;
            padding: 15px; display: flex; flex-direction: column; gap: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            z-index: 100;
            transition: all 0.3s ease;
        }
        .controls-panel.collapsed {
            transform: translate(-50%, calc(100% - 45px));
        }

        .panel-header {
            display: flex; justify-content: space-between; align-items: center;
            cursor: pointer;
        }
        .panel-title { font-size: 0.95rem; font-weight: 800; color: var(--text-muted); display: flex; align-items: center; gap: 8px; }

        .settings-row {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 0.85rem; color: #fff;
        }
        .color-selector { display: flex; gap: 8px; }
        .color-btn {
            width: 25px; height: 25px; border-radius: 50%; border: 2px solid transparent;
            cursor: pointer; transition: all 0.15s;
        }
        .color-btn.active { border-color: white; transform: scale(1.1); }

        .btn-auto {
            background: linear-gradient(135deg, var(--neon-pink), #a855f7);
            color: white; border: none; padding: 10px; border-radius: 10px;
            font-size: 0.9rem; font-weight: 800; cursor: pointer; transition: all 0.2s;
        }
        .btn-auto.active {
            background: var(--neon-cyan); box-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
        }

        /* Overlay hint */
        .tutorial-hint {
            position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%);
            pointer-events: none; z-index: 5; text-align: center;
            animation: pulse 2s infinite;
        }
        .tutorial-hint p { font-size: 1.1rem; color: rgba(255,255,255,0.4); font-weight: 600; letter-spacing: 1px; }
        @keyframes pulse {
            0% { opacity: 0.3; }
            50% { opacity: 0.7; }
            100% { opacity: 0.3; }
        }

    canvas{touch-action:manipulation}
</style>
    <script src="../scripts/game-common.js?v=6650036c"></script>
</head>
<body>

    <header>
        <button class="btn-icon" onclick="location.href='../index.html'"><i class="ri-home-4-line"></i></button>
        <h1>FIREWORKS MAKER</h1>
        <button class="btn-icon" onclick="clearCanvas()"><i class="ri-delete-bin-line"></i></button>
    </header>

    <div class="tutorial-hint" id="tut-hint">
        <p><i class="ri-hand-tap-line" style="font-size: 2rem;"></i><br>화면을 탭하여 불꽃을 쏘아 올리세요</p>
    </div>

    <canvas id="canvas"></canvas>

    <div class="controls-panel" id="panel">
        <div class="panel-header" onclick="togglePanel()">
            <div class="panel-title"><i class="ri-equalizer-line"></i> 불꽃 조작 컨트롤러</div>
            <i class="ri-arrow-down-s-line" id="collapse-icon" style="font-size: 1.2rem; transition: transform 0.3s;"></i>
        </div>

        <div style="display:flex; flex-direction:column; gap:10px; margin-top: 5px;" id="panel-content">
            <!-- Colors selection -->
            <div class="settings-row">
                <span>불꽃 색상</span>
                <div class="color-selector">
                    <button class="color-btn active" style="background:var(--neon-pink);" onclick="setColor('#ec4899', this)"></button>
                    <button class="color-btn" style="background:var(--neon-cyan);" onclick="setColor('#06b6d4', this)"></button>
                    <button class="color-btn" style="background:var(--neon-gold);" onclick="setColor('#eab308', this)"></button>
                    <button class="color-btn" style="background:linear-gradient(to right, red, orange, yellow, green, blue, indigo, violet);" onclick="setColor('rainbow', this)"></button>
                </div>
            </div>

            <!-- Auto-Launch Mode -->
            <div class="settings-row">
                <span>자동 연출 모드</span>
                <button class="btn-auto" id="btn-auto-launch" onclick="toggleAutoLaunch()">자동 켜기</button>
            </div>

            <!-- Sound controls -->
            <div class="settings-row">
                <span>폭발음 크기</span>
                <input type="range" min="0" max="1" step="0.1" value="0.5" id="vol-slider" style="accent-color:var(--neon-pink); cursor:pointer;">
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let audioCtx = null;

        // Custom physics assets
        let fireworks = [];
        let particles = [];
        let selectedColor = '#ec4899';
        let autoLaunchInterval = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            // iOS는 컨텍스트가 suspended로 시작하므로 사용자 제스처마다 깨워 준다.
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playExplosionSound() {
            initAudio();
            const vol = parseFloat(document.getElementById('vol-slider').value);
            if (vol <= 0) return;

            // Synthesis with two oscillators for heavy blast
            const osc1 = audioCtx.createOscillator();
            const osc2 = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();

            osc1.type = 'sawtooth';
            osc1.frequency.setValueAtTime(100, audioCtx.currentTime);
            osc1.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.3);

            osc2.type = 'triangle';
            osc2.frequency.setValueAtTime(80, audioCtx.currentTime);
            osc2.frequency.exponentialRampToValueAtTime(5, audioCtx.currentTime + 0.4);

            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(300, audioCtx.currentTime);

            gain.gain.setValueAtTime(vol * 0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);

            osc1.connect(filter);
            osc2.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);

            osc1.start();
            osc1.stop(audioCtx.currentTime + 0.5);
            osc2.start();
            osc2.stop(audioCtx.currentTime + 0.5);
        }

        // Particle Class
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                
                // Random velocity
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6 + 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                
                this.alpha = 1;
                this.decay = Math.random() * 0.015 + 0.01;
                this.gravity = 0.08;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += this.gravity;
                this.alpha -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        // Firework Class (Tracer rocket)
        class Firework {
            constructor(tx, ty) {
                this.x = canvas.width / 2;
                this.y = canvas.height;
                this.tx = tx;
                this.ty = ty;

                const dx = tx - this.x;
                const dy = ty - this.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                const speed = 12;

                this.vx = (dx / dist) * speed;
                this.vy = (dy / dist) * speed;

                this.color = selectedColor === 'rainbow' ? getRandomRainbowColor() : selectedColor;
                this.alive = true;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                // Close to target point -> Explode
                if (this.vy < 0 && this.y <= this.ty) {
                    this.alive = false;
                    explode(this.x, this.y, this.color);
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
        }

        function getRandomRainbowColor() {
            const hues = [0, 60, 120, 180, 240, 300];
            const randomHue = hues[Math.floor(Math.random() * hues.length)];
            return `hsl(${randomHue}, 100%, 65%)`;
        }

        function explode(x, y, color) {
            playExplosionSound();
            const count = 80;
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function setColor(c, btn) {
            selectedColor = c;
            document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function toggleAutoLaunch() {
            const btn = document.getElementById('btn-auto-launch');
            if (autoLaunchInterval) {
                clearInterval(autoLaunchInterval);
                autoLaunchInterval = null;
                btn.innerText = "자동 켜기";
                btn.classList.remove('active');
            } else {
                document.getElementById('tut-hint').style.display = 'none';
                autoLaunchInterval = setInterval(() => {
                    const tx = Math.random() * canvas.width;
                    const ty = Math.random() * (canvas.height * 0.6) + 50;
                    fireworks.push(new Firework(tx, ty));
                }, 800);
                btn.innerText = "자동 끄기";
                btn.classList.add('active');
            }
        }

        function togglePanel() {
            const panel = document.getElementById('panel');
            const icon = document.getElementById('collapse-icon');
            panel.classList.toggle('collapsed');
            
            if (panel.classList.contains('collapsed')) {
                icon.style.transform = 'rotate(180deg)';
            } else {
                icon.style.transform = 'rotate(0deg)';
            }
        }

        function clearCanvas() {
            fireworks = [];
            particles = [];
        }

        // Loop animation
        function loop() {
            requestAnimationFrame(loop);

            // Dark transparent fade to create glowing tracer paths
            ctx.fillStyle = 'rgba(2, 2, 8, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Update & Draw tracers
            for (let i = fireworks.length - 1; i >= 0; i--) {
                fireworks[i].update();
                if (!fireworks[i].alive) {
                    fireworks.splice(i, 1);
                } else {
                    fireworks[i].draw();
                }
            }

            // Update & Draw particles
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                if (particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                } else {
                    particles[i].draw();
                }
            }
        }

        // Event Listeners
        canvas.addEventListener('click', (e) => {
            document.getElementById('tut-hint').style.display = 'none';
            fireworks.push(new Firework(e.clientX, e.clientY));
        });

        // Window resize
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Initialize Canvas sizes
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        loop();

    </script>
<script type="application/json" id="game-rules">
{
 "title": "불꽃놀이 메이커",
 "goal": "원하는 대로 밤하늘에 불꽃을 터뜨려 보세요.",
 "steps": [
  "화면을 탭하면 그 위치로 불꽃이 올라갑니다.",
  "색과 폭발 형태를 골라 바꿀 수 있습니다.",
  "자동 발사를 켜면 계속 터집니다.",
  "볼륨 슬라이더로 소리를 조절합니다."
 ],
 "tips": [
  "승패가 없는 감상용입니다. 소리를 켜면 훨씬 좋습니다."
 ],
 "players": "1인",
 "time": "약 5분"
}
</script>
</body>
</html>
