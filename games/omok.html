<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오목 - 미니게임 천국</title>
    <link rel="stylesheet" href="../styles/game-common.css?v=2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        #omok-board {
            display: grid;
            grid-template-columns: repeat(15, 1fr);
            gap: 2px;
            background: var(--bg-secondary);
            padding: 1rem;
            border-radius: 12px;
            max-width: 600px;
            margin: 0 auto;
            aspect-ratio: 1;
        }

        .cell {
            aspect-ratio: 1;
            background: linear-gradient(135deg, #2a3150, #1f2540);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(1rem, 3vw, 1.5rem);
            transition: all 0.2s ease;
            position: relative;
        }

        .cell:hover:not(.occupied) {
            background: linear-gradient(135deg, #3a4160, #2f3550);
            border-color: var(--accent-primary);
            transform: scale(1.05);
        }

        .cell.occupied {
            cursor: not-allowed;
        }

        .cell.black {
            background: radial-gradient(circle, #1a1a1a, #000);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        .cell.white {
            background: radial-gradient(circle, #ffffff, #e0e0e0);
            box-shadow: 0 2px 8px rgba(255, 255, 255, 0.3);
        }

        .cell.winning {
            animation: pulse 0.6s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }
        }

        .current-player {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: var(--bg-card);
            border-radius: 8px;
            font-weight: 600;
        }

        .player-indicator {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid var(--border-color);
        }

        .player-indicator.black {
            background: radial-gradient(circle, #1a1a1a, #000);
        }

        .player-indicator.white {
            background: radial-gradient(circle, #ffffff, #e0e0e0);
        }
    </style>
</head>

<body>
    <div class="game-container">
        <div class="game-header">
            <a href="../index.html" class="back-button">← 메인으로</a>
            <h1 class="game-title">⚫⚪ 오목</h1>
            <p class="game-description">5개를 먼저 연결하면 승리!</p>
        </div>

        <div class="status-bar">
            <div class="status-item">
                <span class="status-label">현재 차례</span>
                <div class="current-player">
                    <div class="player-indicator black" id="player-indicator"></div>
                    <span id="current-player-text">흑돌</span>
                </div>
            </div>
            <div class="status-item">
                <span class="status-label">수</span>
                <div class="status-value" id="move-count">0</div>
            </div>
        </div>

        <div class="game-board">
            <div id="omok-board"></div>
        </div>

        <div class="controls">
            <button class="button" onclick="resetGame()">새 게임</button>
            <button class="button button-secondary" onclick="undoMove()">무르기</button>
        </div>
    </div>

    <script>
        const BOARD_SIZE = 15;
        let board = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(0));
        let currentPlayer = 1; // 1: black, 2: white
        let moveHistory = [];
        let undoUsedThisTurn = false;
        let gameResult = '';
        let gameOver = false;

        function initBoard() {
            const boardElement = document.getElementById('omok-board');
            boardElement.innerHTML = '';

            for (let i = 0; i < BOARD_SIZE; i++) {
                for (let j = 0; j < BOARD_SIZE; j++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = i;
                    cell.dataset.col = j;
                    cell.onclick = () => makeMove(i, j);
                    boardElement.appendChild(cell);
                }
            }
        }

        function makeMove(row, col) {
            if (gameOver || board[row][col] !== 0) return;

            board[row][col] = currentPlayer;
            moveHistory.push({ row, col, player: currentPlayer });
            undoUsedThisTurn = false;

            const cell = document.querySelector(`[data-row="${row}"][data-col="${col}"]`);
            cell.classList.add('occupied', currentPlayer === 1 ? 'black' : 'white');

            if (checkWin(row, col)) {
                gameOver = true;
                const winner = currentPlayer === 1 ? '흑돌' : '백돌';
                gameResult = `${winner} 승리`;
                updateUI();
                setTimeout(() => alert(`🎉 ${winner} 승리!`), 100);
                return;
            }

            if (moveHistory.length === BOARD_SIZE * BOARD_SIZE) {
                gameOver = true;
                gameResult = '무승부';
                updateUI();
                setTimeout(() => alert('무승부입니다! 판이 모두 찼습니다.'), 100);
                return;
            }

            currentPlayer = currentPlayer === 1 ? 2 : 1;
            updateUI();
        }

        function checkWin(row, col) {
            const directions = [
                [[0, 1], [0, -1]],   // horizontal
                [[1, 0], [-1, 0]],   // vertical
                [[1, 1], [-1, -1]],  // diagonal \
                [[1, -1], [-1, 1]]   // diagonal /
            ];

            for (const [dir1, dir2] of directions) {
                let count = 1;
                const winningCells = [[row, col]];

                // Check in both directions
                for (const [dr, dc] of [dir1, dir2]) {
                    let r = row + dr;
                    let c = col + dc;

                    while (r >= 0 && r < BOARD_SIZE && c >= 0 && c < BOARD_SIZE &&
                        board[r][c] === currentPlayer) {
                        count++;
                        winningCells.push([r, c]);
                        r += dr;
                        c += dc;
                    }
                }

                if (count >= 5) {
                    // Highlight winning cells
                    winningCells.forEach(([r, c]) => {
                        const cell = document.querySelector(`[data-row="${r}"][data-col="${c}"]`);
                        cell.classList.add('winning');
                    });
                    return true;
                }
            }

            return false;
        }

        function undoMove() {
            if (moveHistory.length === 0 || gameOver) return;
            // 연속 무르기를 막는다. 핫시트라 제한이 없으면 한쪽이 상대 수까지
            // 계속 되돌릴 수 있어 대국이 성립하지 않는다.
            if (undoUsedThisTurn) {
                alert('한 차례에 한 번만 무를 수 있습니다.');
                return;
            }
            undoUsedThisTurn = true;

            const lastMove = moveHistory.pop();
            board[lastMove.row][lastMove.col] = 0;

            const cell = document.querySelector(`[data-row="${lastMove.row}"][data-col="${lastMove.col}"]`);
            cell.classList.remove('occupied', 'black', 'white');

            currentPlayer = lastMove.player;
            updateUI();
        }

        function resetGame() {
            board = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(0));
            currentPlayer = 1;
            moveHistory = [];
            undoUsedThisTurn = false;
            gameResult = '';
            gameOver = false;
            initBoard();
            updateUI();
        }

        function updateUI() {
            document.getElementById('move-count').textContent = moveHistory.length;
            document.getElementById('current-player-text').textContent =
                gameResult || (currentPlayer === 1 ? '흑돌' : '백돌');
            const indicator = document.getElementById('player-indicator');
            indicator.className = 'player-indicator ' + (currentPlayer === 1 ? 'black' : 'white');
        }

        // Initialize game
        initBoard();
        updateUI();
    </script>
    <script type="application/json" id="game-rules">
{
 "title": "오목",
 "goal": "가로·세로·대각선으로 돌 5개를 먼저 연결하세요.",
 "steps": [
  "흑돌이 먼저 두고, 번갈아 한 수씩 놓습니다.",
  "빈 교차점을 눌러 돌을 놓습니다.",
  "어느 방향이든 자기 돌 5개가 연속되면 승리합니다.",
  "무르기는 한 차례에 한 번만 쓸 수 있습니다.",
  "판이 모두 차면 무승부입니다."
 ],
 "tips": [
  "금수 규칙은 없습니다. 선공인 흑이 유리하니 번갈아 선공하면 공평합니다."
 ],
 "players": "2인",
 "time": "약 10분"
}
</script>
<script src="../scripts/game-common.js?v=2"></script>
</body>

</html>
