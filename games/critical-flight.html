<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>크리티컬 플라이트 - Critical Flight</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <!-- Marked.js -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        :root {
            --bg-color: #0f172a;
            --danger: #ef4444;
            --warning: #f59e0b;
            --success: #10b981;
            --panel-bg: #1e293b;
            --glass: rgba(255, 255, 255, 0.1);
            --neon-blue: #38bdf8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: var(--bg-color);
            color: #f8fafc;
            font-family: 'Pretendard', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            user-select: none;
        }

        /* Ambient Background (Sky) */
        .sky-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, #0c4a6e, #0f172a);
            z-index: -1;
            transition: background 2s ease;
        }
        .sky-bg.emergency { background: linear-gradient(to bottom, #450a0a, #0f172a); }

        /* Header */
        header {
            padding: 15px 20px;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(5px);
            z-index: 100;
        }
        .logo { font-family: 'JetBrains Mono', monospace; font-size: 1.1rem; color: var(--danger); animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        /* Main Game View */
        .game-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 15px;
            gap: 15px;
            position: relative;
        }

        /* Status Display */
        .status-display {
            background: #000;
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 15px;
            height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 20px rgba(239, 68, 68, 0.2);
        }
        .altimeter { font-family: 'JetBrains Mono', monospace; font-size: 2.5rem; color: var(--danger); }
        .error-code { font-family: 'JetBrains Mono', monospace; font-size: 1.2rem; color: var(--warning); margin-top: 5px; }

        /* Cockpit Controls */
        .cockpit {
            flex: 1;
            background: var(--panel-bg);
            border-radius: 24px;
            border: 4px solid #334155;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 10px 0 #0f172a;
        }

        .button-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .ctrl-btn {
            aspect-ratio: 1;
            background: #334155;
            border-radius: 15px;
            border: none;
            box-shadow: 0 6px 0 #0f172a, inset 0 2px 5px rgba(255,255,255,0.1);
            color: white;
            font-size: 2rem;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: all 0.1s;
        }
        .ctrl-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #0f172a; }
        .ctrl-btn.active { background: var(--success); box-shadow: 0 6px 0 #065f46, 0 0 20px var(--success); }

        /* Throttle Lever */
        .throttle-container {
            flex: 1;
            background: #000;
            border-radius: 100px;
            position: relative;
            margin: 0 20px;
            border: 2px solid #334155;
            overflow: hidden;
        }
        .throttle-track {
            position: absolute; top: 10%; bottom: 10%; left: 50%; width: 4px;
            background: #334155; transform: translateX(-50%);
        }
        .throttle-handle {
            position: absolute;
            left: 50%; bottom: 0;
            width: 70px; height: 70px;
            background: linear-gradient(145deg, #64748b, #334155);
            border-radius: 50%;
            transform: translateX(-50%);
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            border: 4px solid #1e293b;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            touch-action: none;
        }
        .throttle-handle::after { content: ''; width: 40%; height: 4px; background: rgba(255,255,255,0.3); border-radius: 2px; }
        .throttle-value { position: absolute; top: 10px; right: 10px; font-family: 'JetBrains Mono', monospace; color: var(--neon-blue); font-size: 0.8rem; }

        /* Bottom Actions */
        .actions {
            display: flex;
            gap: 10px;
            padding: 0 15px 15px;
        }
        .btn-action {
            flex: 1;
            padding: 15px;
            border-radius: 12px;
            border: none;
            font-weight: 800;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            cursor: pointer;
        }
        .btn-manual { background: var(--warning); color: #000; }
        .btn-reset { background: var(--glass); color: #fff; }

        /* Overlays */
        .overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(10px);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 1000; padding: 20px;
        }
        .overlay.active { display: flex; }
        .modal-content {
            background: #fff; color: #000; width: 100%; max-width: 500px;
            border-radius: 15px; padding: 25px; max-height: 80vh; overflow-y: auto;
        }
        .manual-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .manual-table th, .manual-table td { border: 1px solid #ddd; padding: 8px; text-align: left; font-size: 0.85rem; }
        .manual-table th { background: #f3f4f6; }

        /* Game States */
        .screen-msg { text-align: center; }
        .screen-msg h2 { font-size: 3rem; margin-bottom: 10px; }
        .btn-main { background: var(--neon-blue); color: #000; padding: 15px 40px; border-radius: 50px; font-weight: 800; border: none; font-size: 1.2rem; cursor: pointer; margin-top: 20px; }

        /* Turbulence Effect */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        .shaking { animation: shake 0.2s infinite; }

    </style>
</head>
<body>

    <div class="sky-bg" id="sky-bg"></div>

    <header>
        <div class="logo">CRITICAL_SYSTEM_FAILURE</div>
        <div class="header-actions">
            <button class="icon-btn" onclick="openGDD()" style="background:none; border:none; color:white; font-size:1.2rem;"><i class="ri-information-line"></i></button>
            <button class="icon-btn" onclick="location.href='../index.html'" style="background:none; border:none; color:white; font-size:1.2rem; margin-left:10px;"><i class="ri-home-4-line"></i></button>
        </div>
    </header>

    <div class="game-view" id="game-view">
        <div class="status-display">
            <div class="altimeter" id="altimeter">10,000 FT</div>
            <div class="error-code" id="error-display">SYSTEM_READY</div>
        </div>

        <div class="cockpit">
            <div class="button-grid">
                <button class="ctrl-btn" id="btn-1" onclick="toggleBtn(1)">A</button>
                <button class="ctrl-btn" id="btn-2" onclick="toggleBtn(2)">B</button>
                <button class="ctrl-btn" id="btn-3" onclick="toggleBtn(3)">C</button>
                <button class="ctrl-btn" id="btn-4" onclick="toggleBtn(4)">D</button>
            </div>

            <div class="throttle-container">
                <div class="throttle-value" id="throttle-text">PWR: 0%</div>
                <div class="throttle-track"></div>
                <div class="throttle-handle" id="throttle-handle"></div>
            </div>
        </div>
    </div>

    <div class="actions">
        <button class="btn-action btn-manual" onclick="toggleManual(true)"><i class="ri-book-read-line"></i> EMERGENCY MANUAL</button>
        <button class="btn-action btn-reset" onclick="initGame()"><i class="ri-refresh-line"></i></button>
    </div>

    <!-- Manual Overlay -->
    <div class="overlay" id="manual-overlay">
        <div class="modal-content">
            <h2 style="border-bottom: 2px solid #000; padding-bottom: 10px;">🚨 EMERGENCY PROTOCOL</h2>
            <p style="font-size: 0.8rem; margin: 10px 0;">조종사는 이 매뉴얼을 볼 수 없습니다. 관제사가 지시를 내리세요.</p>
            <table class="manual-table">
                <thead>
                    <tr><th>CODE</th><th>REQUIRED ACTION</th></tr>
                </thead>
                <tbody id="manual-body">
                    <!-- Procedurally generated -->
                </tbody>
            </table>
            <button class="btn-main" onclick="toggleManual(false)" style="width: 100%; font-size: 1rem; padding: 10px;">매뉴얼 닫기</button>
        </div>
    </div>

    <!-- Start/End Overlay -->
    <div class="overlay active" id="state-overlay">
        <div class="screen-msg">
            <h2 id="state-title">CRITICAL FLIGHT</h2>
            <p id="state-desc">비행기가 추락하고 있습니다. 관제사와 협력하여 생존하세요.</p>
            <button class="btn-main" id="start-btn" onclick="startGame()">미션 시작</button>
        </div>
    </div>

    <script>
        let altitude = 10000;
        let throttle = 0;
        let activeButtons = [false, false, false, false];
        let currentCrisis = null;
        let gameActive = false;
        let solvedCount = 0;
        let timer = null;

        const crisisDatabase = [
            { id: 'Σ-1', desc: '엔진 화재', action: (btns, thr) => btns[0] && btns[1] && thr < 10, hint: 'A, B 켜기 & 출력 10% 이하' },
            { id: 'Δ-9', desc: '산소 부족', action: (btns, thr) => btns[2] && btns[3] && thr > 80, hint: 'C, D 켜기 & 출력 80% 이상' },
            { id: 'Ω-4', desc: '기체 흔들림', action: (btns, thr) => !btns[0] && btns[1] && btns[2] && !btns[3] && thr > 40 && thr < 60, hint: 'B, C만 켜기 & 출력 40~60%' },
            { id: 'Θ-7', desc: '연료 누출', action: (btns, thr) => btns[0] && !btns[1] && !btns[2] && btns[3] && thr < 30, hint: 'A, D만 켜기 & 출력 30% 이하' },
            { id: 'Ψ-2', desc: '시스템 과부하', action: (btns, thr) => btns[0] && btns[2] && !btns[1] && !btns[3] && thr > 90, hint: 'A, C만 켜기 & 출력 90% 이상' }
        ];

        // --- Init ---
        function initGame() {
            altitude = 10000;
            throttle = 0;
            activeButtons = [false, false, false, false];
            solvedCount = 0;
            gameActive = false;
            updateUI();
            clearInterval(timer);
            document.getElementById('state-overlay').classList.add('active');
            document.getElementById('state-title').innerText = "CRITICAL FLIGHT";
            document.getElementById('state-desc').innerText = "조종실에 화재가 발생했습니다. 생존율 1%.";
            document.getElementById('start-btn').innerText = "다시 도전";
            
            // Build manual
            const tbody = document.getElementById('manual-body');
            tbody.innerHTML = crisisDatabase.map(c => `<tr><td>${c.id}</td><td>${c.hint}</td></tr>`).join('');
        }

        function startGame() {
            document.getElementById('state-overlay').classList.remove('active');
            gameActive = true;
            nextCrisis();
            timer = setInterval(gameLoop, 100);
        }

        function gameLoop() {
            if (!gameActive) return;

            // Altitude drop
            altitude -= 15 + (currentCrisis ? 20 : 0);
            updateUI();

            // Check solution
            if (currentCrisis && currentCrisis.action(activeButtons, throttle)) {
                solveCrisis();
            }

            // Lose condition
            if (altitude <= 0) {
                endGame(false);
            }
        }

        function nextCrisis() {
            currentCrisis = crisisDatabase[Math.floor(Math.random() * crisisDatabase.length)];
            document.getElementById('error-display').innerText = `ERROR_CODE: ${currentCrisis.id}`;
            document.getElementById('error-display').style.color = 'var(--danger)';
            document.getElementById('game-view').classList.add('shaking');
            document.getElementById('sky-bg').classList.add('emergency');
        }

        function solveCrisis() {
            solvedCount++;
            currentCrisis = null;
            document.getElementById('error-display').innerText = "SYSTEM_STABILIZED";
            document.getElementById('error-display').style.color = 'var(--success)';
            document.getElementById('game-view').classList.remove('shaking');
            document.getElementById('sky-bg').classList.remove('emergency');

            if (solvedCount >= 7) {
                endGame(true);
            } else {
                setTimeout(nextCrisis, 2000);
            }
        }

        function endGame(win) {
            gameActive = false;
            clearInterval(timer);
            document.getElementById('state-overlay').classList.add('active');
            document.getElementById('state-title').innerText = win ? "MISSION SUCCESS" : "MISSION FAILED";
            document.getElementById('state-desc').innerText = win ? "모든 위기를 극복하고 안전하게 착륙했습니다!" : "비행기가 추락했습니다. 전원 사망.";
            document.getElementById('start-btn').innerText = "다시 시작";
        }

        // --- Controls ---
        function toggleBtn(idx) {
            if (!gameActive) return;
            activeButtons[idx - 1] = !activeButtons[idx - 1];
            document.getElementById(`btn-${idx}`).classList.toggle('active');
        }

        const handle = document.getElementById('throttle-handle');
        const container = handle.parentElement;
        let isDragging = false;

        handle.addEventListener('touchstart', () => isDragging = true);
        window.addEventListener('touchend', () => isDragging = false);
        window.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const rect = container.getBoundingClientRect();
            let y = e.touches[0].clientY - rect.top;
            y = Math.max(35, Math.min(y, rect.height - 35));
            handle.style.top = (y - 35) + 'px';
            
            // Calculate 0-100% (Inverted: top is 100, bottom is 0)
            const percent = Math.round(100 - ((y - 35) / (rect.height - 70) * 100));
            throttle = percent;
            document.getElementById('throttle-text').innerText = `PWR: ${throttle}%`;
        });

        function updateUI() {
            document.getElementById('altimeter').innerText = altitude.toLocaleString() + " FT";
            if (altitude < 2000) document.getElementById('altimeter').style.color = '#ff0000';
            else document.getElementById('altimeter').style.color = 'var(--danger)';
        }

        function toggleManual(show) {
            document.getElementById('manual-overlay').classList.toggle('active', show);
        }

        async function openGDD() {
            // Re-use standard GDD viewer logic if needed, but manual is more important here
            const gddContent = await fetch('./docs/critical-flight-gdd.md').then(r => r.text());
            alert("기획서는 'EMERGENCY MANUAL' 버튼을 통해 인게임에서 확인 가능합니다.");
        }

        window.onload = initGame;
    </script>
</body>
</html>
