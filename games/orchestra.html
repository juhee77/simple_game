<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사운드 오케스트라 - 미니게임 천국</title>
<link rel="stylesheet" href="../styles/game-common.css?v=308950af">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0f172a;font-family:'Outfit',sans-serif;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
.back{position:absolute;top:20px;left:20px;z-index:10}
h1{font-size:1.8rem;margin:40px 0 5px;background:linear-gradient(135deg,#a78bfa,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
p.sub{color:#94a3b8;margin-bottom:20px}
.instruments{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;width:90%;max-width:500px}
.inst-btn{padding:30px 20px;border-radius:20px;border:2px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);cursor:pointer;text-align:center;transition:all .2s;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.inst-btn:active{transform:scale(0.95)}
.inst-btn .emoji{font-size:3rem;margin-bottom:8px;display:block}
.inst-btn .name{font-weight:700;font-size:1.1rem}
.inst-btn.playing{box-shadow:0 0 30px rgba(167,139,250,.5);border-color:#a78bfa;background:rgba(167,139,250,.1)}
.pad-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:90%;max-width:500px;margin-top:20px;display:none}
.pad{aspect-ratio:1;border-radius:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:800;transition:all .1s;border:2px solid rgba(255,255,255,.1)}
.pad:active{transform:scale(0.9)}
.back-inst{background:rgba(255,255,255,.1);border:none;color:#fff;padding:10px 24px;border-radius:20px;cursor:pointer;font-family:inherit;font-weight:600;margin:15px 0}
</style>
    <script src="../scripts/game-common.js?v=b7c7301f"></script>
</head>
<body>
<a href="../index.html" class="back back-button">← 메인</a>
<h1>🎵 사운드 오케스트라</h1>
<p class="sub">악기를 선택하고 함께 연주하세요!</p>
<div class="instruments" id="instruments">
<div class="inst-btn" onclick="selectInst('piano')"><span class="emoji">🎹</span><span class="name">피아노</span></div>
<div class="inst-btn" onclick="selectInst('drum')"><span class="emoji">🥁</span><span class="name">드럼</span></div>
<div class="inst-btn" onclick="selectInst('bass')"><span class="emoji">🎸</span><span class="name">베이스</span></div>
<div class="inst-btn" onclick="selectInst('synth')"><span class="emoji">🎛️</span><span class="name">신스</span></div>
<div class="inst-btn" onclick="selectInst('bell')"><span class="emoji">🔔</span><span class="name">벨</span></div>
<div class="inst-btn" onclick="selectInst('marimba')"><span class="emoji">🪘</span><span class="name">마림바</span></div>
</div>
<button class="back-inst" id="back-inst" style="display:none" onclick="backToSelect()">← 악기 선택</button>
<div class="pad-grid" id="pads"></div>
<script>
let audioCtx,currentInst='';
const instruments={
piano:{notes:[261.63,293.66,329.63,349.23,392,440,493.88,523.25],type:'sine',colors:['#818cf8','#6366f1','#4f46e5','#4338ca','#a78bfa','#8b5cf6','#7c3aed','#6d28d9']},
drum:{notes:[100,150,200,80,120,180,90,160],type:'triangle',colors:['#f87171','#ef4444','#dc2626','#b91c1c','#fb923c','#f97316','#ea580c','#c2410c']},
bass:{notes:[65.41,73.42,82.41,87.31,98,110,123.47,130.81],type:'sawtooth',colors:['#34d399','#10b981','#059669','#047857','#6ee7b7','#a7f3d0','#2dd4bf','#14b8a6']},
synth:{notes:[220,277.18,329.63,369.99,415.3,466.16,554.37,659.25],type:'square',colors:['#f472b6','#ec4899','#db2777','#be185d','#fb7185','#f43f5e','#e11d48','#be123c']},
bell:{notes:[523.25,587.33,659.25,698.46,783.99,880,987.77,1046.5],type:'sine',colors:['#fbbf24','#f59e0b','#d97706','#b45309','#fcd34d','#fde68a','#fef3c7','#fef9c3']},
marimba:{notes:[196,220,246.94,261.63,293.66,329.63,349.23,392],type:'triangle',colors:['#fb923c','#f97316','#ea580c','#c2410c','#fdba74','#fed7aa','#ffedd5','#fff7ed']}
};
function selectInst(name){
currentInst=name;
if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
if(audioCtx.state==='suspended')audioCtx.resume(); // iOS는 suspended로 시작한다
document.getElementById('instruments').style.display='none';
document.getElementById('back-inst').style.display='';
const pads=document.getElementById('pads');pads.style.display='grid';
const inst=instruments[name];
pads.innerHTML=inst.notes.map((n,i)=>`<div class="pad" style="background:${inst.colors[i]}40;border-color:${inst.colors[i]}" onpointerdown="playNote(${n},'${inst.type}',this,'${inst.colors[i]}')">${['도','레','미','파','솔','라','시','도'][i]||i+1}</div>`).join('');
}
function playNote(freq,type,el,color){
const o=audioCtx.createOscillator(),g=audioCtx.createGain();
o.type=type;o.frequency.value=freq;o.connect(g);g.connect(audioCtx.destination);
g.gain.setValueAtTime(0.3,audioCtx.currentTime);
g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.5);
o.start();o.stop(audioCtx.currentTime+0.5);
el.style.background=color+'80';el.style.transform='scale(0.9)';
setTimeout(()=>{el.style.background=color+'40';el.style.transform=''},150);
}
function backToSelect(){document.getElementById('instruments').style.display='grid';document.getElementById('pads').style.display='none';document.getElementById('back-inst').style.display='none'}
</script>
    <script type="application/json" id="game-rules">
{
 "title": "사운드 오케스트라",
 "goal": "각자 악기를 골라 함께 소리를 맞춰 보세요.",
 "steps": [
  "악기를 하나 고릅니다.",
  "화면의 패드를 눌러 음을 냅니다.",
  "여러 명이 각자 기기로 다른 악기를 골라 동시에 연주합니다.",
  "악기 선택으로 돌아가 다른 악기로 바꿀 수 있습니다."
 ],
 "tips": [
  "소리가 안 나면 화면을 한 번 터치해 주세요. 첫 터치에서 오디오가 켜집니다."
 ],
 "players": "1~6인",
 "time": "약 5분"
}
</script>
</body>
</html>
