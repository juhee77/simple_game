<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>네온 잰말놀이 - 미니게임 천국</title>
    <link rel="stylesheet" href="../styles/game-common.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=Noto+Sans+KR:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', 'Noto Sans KR', sans-serif;
            background: radial-gradient(circle at top left, rgba(99, 102, 241, 0.15), transparent 35%),
                        radial-gradient(circle at bottom right, rgba(236, 72, 153, 0.15), transparent 40%),
                        #0a0e27;
            min-height: 100vh;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        .setup-container {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-group label {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-secondary);
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: rgba(21, 25, 50, 0.8);
            color: var(--text-primary);
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.3);
        }

        .player-names-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 0.8rem;
            margin-top: 0.5rem;
            max-height: 200px;
            overflow-y: auto;
            padding-right: 0.5rem;
        }

        /* Scrollbar styling */
        .player-names-list::-webkit-scrollbar {
            width: 6px;
        }
        .player-names-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }
        .player-names-list::-webkit-scrollbar-thumb {
            background: var(--accent-primary);
            border-radius: 10px;
        }

        .player-input-item {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 0.4rem 0.8rem;
        }

        .player-input-item span {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-right: 0.5rem;
            white-space: nowrap;
        }

        .player-input-item input {
            border: none;
            background: transparent;
            color: var(--text-primary);
            font-size: 0.95rem;
            padding: 0.2rem 0;
            width: 100%;
        }

        .player-input-item input:focus {
            outline: none;
            border-bottom: 1px solid var(--accent-primary);
        }

        .pass-card {
            text-align: center;
            padding: 3rem 1.5rem;
        }

        .pass-icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .player-highlight {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--accent-secondary);
            text-shadow: 0 0 15px rgba(139, 92, 246, 0.5);
            margin: 1rem 0;
        }

        .game-tag {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.4rem 1.2rem;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--accent-primary);
            display: inline-block;
            margin-bottom: 1.5rem;
        }

        .twister-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.02));
            border: 2px solid var(--border-color);
            border-radius: 24px;
            padding: 3.5rem 2rem;
            margin: 1.5rem 0;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .twister-text {
            font-size: 2.2rem;
            font-weight: 900;
            line-height: 1.5;
            color: var(--text-primary);
            word-break: keep-all;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .difficulty-badge {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 0.8rem;
            font-weight: 800;
            padding: 0.3rem 0.8rem;
            border-radius: 30px;
            text-transform: uppercase;
        }

        .diff-easy { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
        .diff-medium { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
        .diff-hard { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }

        /* Timer UI */
        .timer-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 1.5rem;
        }

        .timer-bar-outer {
            width: 100%;
            height: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 5px;
            overflow: hidden;
            margin-top: 0.5rem;
        }

        .timer-bar-inner {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-tertiary));
            border-radius: 5px;
            transition: width 0.1s linear;
        }

        .timer-text {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-primary);
        }

        /* Judgment Buttons */
        .judgment-container {
            text-align: center;
        }

        .judge-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .judge-btn {
            padding: 2rem 1.5rem;
            border-radius: 20px;
            border: 2px solid transparent;
            font-size: 1.5rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            color: #fff;
        }

        .judge-success {
            background: rgba(16, 185, 129, 0.1);
            border-color: rgba(16, 185, 129, 0.25);
        }

        .judge-success:hover {
            background: rgba(16, 185, 129, 0.2);
            border-color: #10b981;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3);
            transform: translateY(-5px);
        }

        .judge-fail {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.25);
        }

        .judge-fail:hover {
            background: rgba(239, 68, 68, 0.2);
            border-color: #ef4444;
            box-shadow: 0 10px 25px rgba(239, 68, 68, 0.3);
            transform: translateY(-5px);
        }

        .judge-icon {
            font-size: 2.5rem;
        }

        /* Scoreboard Screen */
        .scoreboard-table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.5rem 0;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .scoreboard-table th, .scoreboard-table td {
            padding: 1.2rem;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .scoreboard-table th {
            background: rgba(255, 255, 255, 0.05);
            font-weight: 700;
            color: var(--text-secondary);
        }

        .scoreboard-table tr:last-child td {
            border-bottom: none;
        }

        .scoreboard-table tr.winner-row {
            background: rgba(139, 92, 246, 0.15);
        }

        .rank-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-weight: 800;
            font-size: 0.9rem;
            background: rgba(255, 255, 255, 0.1);
        }

        .rank-1 { background: #fbbf24; color: #000; }
        .rank-2 { background: #cbd5e1; color: #000; }
        .rank-3 { background: #b45309; color: #fff; }

        @media (max-width: 600px) {
            .twister-text {
                font-size: 1.6rem;
            }
            .judge-buttons {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            .judge-btn {
                padding: 1.2rem;
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <a href="../index.html" class="back-button">← 메인으로</a>
            <h1 class="game-title">👅 네온 잰말놀이</h1>
            <p class="game-description">빠르고 정확하게 발음해보세요! 다른 친구들이 성공 여부를 직접 판정합니다.</p>
        </div>

        <div class="game-board">
            <!-- STATUS BAR -->
            <div id="game-status-bar" class="status-bar" style="display: none;">
                <div class="status-item">
                    <span class="status-label">라운드</span>
                    <div class="status-value" id="status-round">1 / 3</div>
                </div>
                <div class="status-item">
                    <span class="status-label">차례</span>
                    <div class="status-value" id="status-player">플레이어 1</div>
                </div>
                <div class="status-item">
                    <span class="status-label">난이도</span>
                    <div class="status-value" id="status-difficulty">전체</div>
                </div>
            </div>

            <!-- 1. SETUP SCREEN -->
            <div id="screen-setup" class="screen active setup-container">
                <div class="form-group">
                    <label for="player-count">참가자 수 (2 ~ 10명)</label>
                    <input type="number" id="player-count" min="2" max="10" value="3" onchange="updatePlayerInputs()">
                </div>

                <div class="form-group">
                    <label>참가자 이름</label>
                    <div id="player-names-list" class="player-names-list">
                        <!-- Auto generated input fields -->
                    </div>
                </div>

                <div class="form-group">
                    <label for="round-count">라운드 수</label>
                    <select id="round-count">
                        <option value="1">1 라운드</option>
                        <option value="2">2 라운드</option>
                        <option value="3" selected>3 라운드</option>
                        <option value="4">4 라운드</option>
                        <option value="5">5 라운드</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="difficulty-select">잰말 난이도</label>
                    <select id="difficulty-select">
                        <option value="all">전체 난이도</option>
                        <option value="easy">쉬움</option>
                        <option value="medium">보통</option>
                        <option value="hard">어려움</option>
                    </select>
                </div>

                <button class="button" onclick="initGame()" style="margin-top: 1rem;">게임 시작! 🚀</button>
            </div>

            <!-- 2. PASS SCREEN -->
            <div id="screen-pass" class="screen pass-card">
                <div class="pass-icon">📱</div>
                <div class="game-tag">다음 차례</div>
                <div class="helper-copy">휴대폰을 다음 사람에게 넘겨주세요.</div>
                <div class="player-highlight" id="pass-player-name">플레이어 1</div>
                <button class="button" onclick="startTurn()" style="margin-top: 1.5rem;">준비 완료! 문장 보기</button>
            </div>

            <!-- 3. CHALLENGE SCREEN -->
            <div id="screen-challenge" class="screen">
                <div class="game-tag" id="challenge-player-tag">플레이어 1의 도전</div>
                <div class="twister-card">
                    <div id="challenge-difficulty" class="difficulty-badge">보통</div>
                    <div class="twister-text" id="challenge-text">간장공장 공장장은 강 공장장이고 된장공장 공장장은 장 공장장이다.</div>
                </div>

                <!-- Timer Section -->
                <div class="timer-container" id="timer-box">
                    <div class="timer-text" id="timer-text">10</div>
                    <div class="timer-bar-outer">
                        <div class="timer-bar-inner" id="timer-bar"></div>
                    </div>
                </div>

                <div class="controls">
                    <button class="button" onclick="stopTurn()">발음 완료! 🛑</button>
                </div>
            </div>

            <!-- 4. JUDGMENT SCREEN -->
            <div id="screen-judgment" class="screen judgment-container">
                <div class="game-tag" id="judgment-player-tag">플레이어 1 판정</div>
                <p class="helper-copy" style="margin-bottom: 1.5rem;">도전자가 버벅이지 않고 정확하게 말했나요? 다른 사람들이 평가해주세요!</p>

                <div class="twister-card" style="padding: 2rem; margin: 1rem 0;">
                    <div class="twister-text" id="judgment-text" style="font-size: 1.6rem; color: var(--text-secondary);"></div>
                </div>

                <div class="judge-buttons">
                    <button class="judge-btn judge-success" onclick="submitResult(true)">
                        <span class="judge-icon">🎉</span>
                        <span>성공!</span>
                        <span style="font-size: 0.8rem; opacity: 0.7;">(+1점)</span>
                    </button>
                    <button class="judge-btn judge-fail" onclick="submitResult(false)">
                        <span class="judge-icon">❌</span>
                        <span>실패...</span>
                        <span style="font-size: 0.8rem; opacity: 0.7;">(0점)</span>
                    </button>
                </div>
            </div>

            <!-- 5. SCOREBOARD SCREEN -->
            <div id="screen-scoreboard" class="screen">
                <h2 style="text-align: center; font-size: 2rem; margin-bottom: 1.5rem; background: linear-gradient(135deg, var(--accent-primary), var(--accent-tertiary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">🏆 최종 결과</h2>
                
                <table class="scoreboard-table">
                    <thead>
                        <tr>
                            <th>순위</th>
                            <th>이름</th>
                            <th>성공 횟수</th>
                            <th>성공률</th>
                        </tr>
                    </thead>
                    <tbody id="scoreboard-rows">
                        <!-- Scoreboard rows go here -->
                    </tbody>
                </table>

                <div class="controls">
                    <button class="button button-secondary" onclick="restartSetup()">설정 변경하기</button>
                    <button class="button" onclick="restartGameSamePlayers()">같은 인원으로 다시 하기</button>
                </div>
            </div>

        </div>
    </div>

    <script>

        // Web Audio API Synth for Premium Beeps
        let audioCtx = null;
        function playSound(type) {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'beep') {
                    osc.frequency.setValueAtTime(880, audioCtx.currentTime); // High pitch A5
                    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.1);
                } else if (type === 'success') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                    osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
                    osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2); // G5
                    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.45);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.45);
                } else if (type === 'fail') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, audioCtx.currentTime); // A3
                    osc.frequency.setValueAtTime(164.81, audioCtx.currentTime + 0.15); // E3
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.4);
                } else if (type === 'warning') {
                    osc.frequency.setValueAtTime(1100, audioCtx.currentTime); 
                    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.18);
                }
            } catch (e) {
                console.log("Audio play blocked or failed: ", e);
            }
        }

        // Game State Variables
        let players = [];
        let totalRounds = 3;
        let selectedDifficulty = 'all';
        
        let currentRound = 1;
        let currentPlayerIdx = 0;
        let activeTwisters = [];
        let currentTwister = null;

        let timerInterval = null;
        let timerSecondsRemaining = 10;
        const totalTimerDuration = 10; // 10 seconds for twisters

        // Initialize setup player list inputs
        function updatePlayerInputs() {
            const count = parseInt(document.getElementById('player-count').value) || 3;
            const container = document.getElementById('player-names-list');
            const currentInputs = container.querySelectorAll('input');
            const savedNames = Array.from(currentInputs).map(inp => inp.value);

            container.innerHTML = '';
            for (let i = 0; i < count; i++) {
                const nameVal = savedNames[i] || `플레이어 ${i + 1}`;
                
                const div = document.createElement('div');
                div.className = 'player-input-item';
                div.innerHTML = `
                    <span>P${i + 1}</span>
                    <input type="text" placeholder="이름 입력" value="${nameVal}">
                `;
                container.appendChild(div);
            }
        }

        // Initialize inputs on page load
        updatePlayerInputs();

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(scr => scr.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');

            if (screenId === 'screen-setup' || screenId === 'screen-scoreboard') {
                document.getElementById('game-status-bar').style.display = 'none';
            } else {
                document.getElementById('game-status-bar').style.display = 'flex';
            }
        }

        function initGame() {
            // Get players
            const inputs = document.getElementById('player-names-list').querySelectorAll('input');
            players = Array.from(inputs).map((inp, idx) => {
                return {
                    id: idx,
                    name: inp.value.trim() || `플레이어 ${idx + 1}`,
                    score: 0,
                    history: [] // successful rounds
                };
            });

            if (players.length < 2) {
                alert("참가자는 최소 2명이어야 합니다!");
                return;
            }

            totalRounds = parseInt(document.getElementById('round-count').value) || 3;
            selectedDifficulty = document.getElementById('difficulty-select').value;

            // Filter Twisters
            if (selectedDifficulty === 'all') {
                activeTwisters = [...TWISTER_DB];
            } else {
                const levelMap = { 'easy': '쉬움', 'medium': '보통', 'hard': '어려움' };
                const selectedKOR = levelMap[selectedDifficulty];
                activeTwisters = TWISTER_DB.filter(t => t.level === selectedKOR);
            }

            // Shuffle active list
            shuffleArray(activeTwisters);

            // Reset scores & progress
            currentRound = 1;
            currentPlayerIdx = 0;

            // Status labels
            const difficultyLabelMap = { 'all': '전체', 'easy': '쉬움', 'medium': '보통', 'hard': '어려움' };
            document.getElementById('status-difficulty').textContent = difficultyLabelMap[selectedDifficulty];

            updateStatusBar();
            showPassScreen();
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function updateStatusBar() {
            document.getElementById('status-round').textContent = `${currentRound} / ${totalRounds}`;
            document.getElementById('status-player').textContent = players[currentPlayerIdx].name;
        }

        function showPassScreen() {
            const player = players[currentPlayerIdx];
            document.getElementById('pass-player-name').textContent = player.name;
            showScreen('screen-pass');
        }

        function startTurn() {
            playSound('beep');
            updateStatusBar();

            // Select a twister (wrap around if activeTwisters runs out)
            const twisterIdx = ( (currentRound - 1) * players.length + currentPlayerIdx ) % activeTwisters.length;
            currentTwister = activeTwisters[twisterIdx];

            // Render twister
            const twisterEl = document.getElementById('challenge-text');
            const diffEl = document.getElementById('challenge-difficulty');
            const tagEl = document.getElementById('challenge-player-tag');

            twisterEl.textContent = currentTwister.text;
            diffEl.textContent = currentTwister.level;
            
            // Set difficulty class
            diffEl.className = 'difficulty-badge';
            if (currentTwister.level === '쉬움') diffEl.classList.add('diff-easy');
            else if (currentTwister.level === '보통') diffEl.classList.add('diff-medium');
            else diffEl.classList.add('diff-hard');

            tagEl.textContent = `${players[currentPlayerIdx].name} 님의 도전`;

            // Start Timer
            startTimer();

            showScreen('screen-challenge');
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerSecondsRemaining = totalTimerDuration;
            
            const textEl = document.getElementById('timer-text');
            const barInner = document.getElementById('timer-bar');

            textEl.textContent = timerSecondsRemaining;
            barInner.style.width = '100%';

            timerInterval = setInterval(() => {
                timerSecondsRemaining--;
                textEl.textContent = timerSecondsRemaining;
                
                const percentage = (timerSecondsRemaining / totalTimerDuration) * 100;
                barInner.style.width = `${percentage}%`;

                if (timerSecondsRemaining <= 3 && timerSecondsRemaining > 0) {
                    playSound('beep');
                    textEl.style.color = '#ef4444';
                } else if (timerSecondsRemaining <= 0) {
                    playSound('warning');
                    stopTurn();
                } else {
                    textEl.style.color = 'var(--text-primary)';
                }
            }, 1000);
        }

        function stopTurn() {
            clearInterval(timerInterval);
            
            // Go to Judgment Screen
            const jText = document.getElementById('judgment-text');
            const jTag = document.getElementById('judgment-player-tag');

            jText.textContent = currentTwister.text;
            jTag.textContent = `${players[currentPlayerIdx].name} 판정`;

            showScreen('screen-judgment');
        }

        function submitResult(isSuccess) {
            const player = players[currentPlayerIdx];
            if (isSuccess) {
                playSound('success');
                player.score++;
                player.history.push({ round: currentRound, text: currentTwister.text, success: true });
            } else {
                playSound('fail');
                player.history.push({ round: currentRound, text: currentTwister.text, success: false });
            }

            // Next Player or Next Round
            currentPlayerIdx++;
            if (currentPlayerIdx >= players.length) {
                currentPlayerIdx = 0;
                currentRound++;
            }

            if (currentRound > totalRounds) {
                showScoreboard();
            } else {
                updateStatusBar();
                showPassScreen();
            }
        }

        function showScoreboard() {
            const tbody = document.getElementById('scoreboard-rows');
            tbody.innerHTML = '';

            // Sort players by score desc
            const sortedPlayers = [...players].sort((a, b) => b.score - a.score);
            const maxScore = sortedPlayers[0].score;

            sortedPlayers.forEach((p, rankIdx) => {
                let rankDisplay = rankIdx + 1;
                let rankClass = '';
                if (rankDisplay === 1) rankClass = 'rank-1';
                else if (rankDisplay === 2) rankClass = 'rank-2';
                else if (rankDisplay === 3) rankClass = 'rank-3';

                const tr = document.createElement('tr');
                if (p.score === maxScore && maxScore > 0) {
                    tr.className = 'winner-row';
                }

                const successRate = Math.round((p.score / totalRounds) * 100) || 0;

                tr.innerHTML = `
                    <td>
                        <span class="rank-badge ${rankClass}">
                            ${p.score === maxScore && maxScore > 0 ? '👑' : rankDisplay}
                        </span>
                    </td>
                    <td style="font-weight: 700;">${p.name}</td>
                    <td>${p.score} / ${totalRounds}</td>
                    <td>${successRate}%</td>
                `;
                tbody.appendChild(tr);
            });

            showScreen('screen-scoreboard');
        }

        function restartSetup() {
            showScreen('screen-setup');
        }

        function restartGameSamePlayers() {
            // Reset player scores
            players.forEach(p => {
                p.score = 0;
                p.history = [];
            });

            // Reshuffle active twisters
            shuffleArray(activeTwisters);

            // Reset round progress
            currentRound = 1;
            currentPlayerIdx = 0;

            updateStatusBar();
            showPassScreen();
        }
    </script>
</body>
</html>
