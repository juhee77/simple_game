<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>네온 잰말놀이 - 미니게임 천국</title>
    <link rel="stylesheet" href="../styles/game-common.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=Noto+Sans+KR:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', 'Noto Sans KR', sans-serif;
            background: radial-gradient(circle at top left, rgba(99, 102, 241, 0.15), transparent 35%),
                        radial-gradient(circle at bottom right, rgba(236, 72, 153, 0.15), transparent 40%),
                        #0a0e27;
            min-height: 100vh;
            transition: background 0.3s;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        .screen.active.setup-container {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-group label {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-secondary);
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: rgba(21, 25, 50, 0.8);
            color: var(--text-primary);
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.3);
        }

        /* Mode Selection Cards */
        .mode-select-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.8rem;
        }

        .mode-card {
            background: rgba(21, 25, 50, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem 0.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .mode-card:hover {
            border-color: var(--accent-primary);
            background: rgba(99, 102, 241, 0.05);
        }

        .mode-card.active {
            border-color: var(--accent-primary);
            background: rgba(99, 102, 241, 0.2);
            box-shadow: 0 0 12px rgba(99, 102, 241, 0.3);
        }

        .mode-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.2rem;
        }

        .mode-desc {
            font-size: 0.7rem;
            color: var(--text-muted);
            line-height: 1.2;
        }

        .player-names-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 0.8rem;
            margin-top: 0.5rem;
            max-height: 200px;
            overflow-y: auto;
            padding-right: 0.5rem;
        }

        .player-names-list::-webkit-scrollbar {
            width: 6px;
        }
        .player-names-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }
        .player-names-list::-webkit-scrollbar-thumb {
            background: var(--accent-primary);
            border-radius: 10px;
        }

        .player-input-item {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 0.4rem 0.8rem;
        }

        .player-input-item span {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-right: 0.5rem;
            white-space: nowrap;
        }

        .player-input-item input {
            border: none;
            background: transparent;
            color: var(--text-primary);
            font-size: 0.95rem;
            padding: 0.2rem 0;
            width: 100%;
        }

        .player-input-item input:focus {
            outline: none;
            border-bottom: 1px solid var(--accent-primary);
        }

        .game-tag {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.4rem 1.2rem;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--accent-primary);
            display: inline-block;
            margin-bottom: 1.5rem;
        }

        .twister-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.02));
            border: 2px solid var(--border-color);
            border-radius: 24px;
            padding: 3rem 2rem;
            margin: 1rem 0;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
        }

        .twister-text {
            font-size: 2.2rem;
            font-weight: 900;
            line-height: 1.5;
            color: var(--text-primary);
            word-break: keep-all;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .difficulty-badge {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 0.8rem;
            font-weight: 800;
            padding: 0.3rem 0.8rem;
            border-radius: 30px;
            text-transform: uppercase;
        }

        .diff-easy { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
        .diff-medium { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
        .diff-hard { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }

        /* Timer UI */
        .timer-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 1.5rem;
            width: 100%;
        }

        .timer-bar-outer {
            width: 100%;
            height: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 5px;
            overflow: hidden;
            margin-top: 0.5rem;
        }

        .timer-bar-inner {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-tertiary));
            border-radius: 5px;
            transition: width 0.1s linear;
        }

        .timer-text {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--text-primary);
            transition: color 0.2s, transform 0.2s;
        }

        /* 3-second Warning Glow */
        @keyframes warning-pulse {
            0%, 100% { box-shadow: 0 0 20px rgba(239, 68, 68, 0.1); }
            50% { box-shadow: 0 0 45px rgba(239, 68, 68, 0.6); }
        }

        .warning-active .twister-card {
            animation: warning-pulse 1s infinite;
            border-color: #ef4444;
        }

        .warning-active .timer-bar-inner {
            background: linear-gradient(90deg, #ef4444, #f87171);
        }

        .warning-active .timer-text {
            color: #ef4444;
            transform: scale(1.15);
        }

        /* Judgment Buttons */
        .judge-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .judge-btn {
            padding: 1.5rem 1.2rem;
            border-radius: 20px;
            border: 2px solid transparent;
            font-size: 1.3rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.4rem;
            color: #fff;
        }

        .judge-success {
            background: rgba(16, 185, 129, 0.1);
            border-color: rgba(16, 185, 129, 0.25);
        }

        .judge-success:hover {
            background: rgba(16, 185, 129, 0.25);
            border-color: #10b981;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3);
            transform: translateY(-4px);
        }

        .judge-fail {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.25);
        }

        .judge-fail:hover {
            background: rgba(239, 68, 68, 0.25);
            border-color: #ef4444;
            box-shadow: 0 10px 25px rgba(239, 68, 68, 0.3);
            transform: translateY(-4px);
        }

        .judge-icon {
            font-size: 2.2rem;
        }

        /* Scoreboard Screen */
        .scoreboard-table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.5rem 0;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .scoreboard-table th, .scoreboard-table td {
            padding: 1.2rem;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .scoreboard-table th {
            background: rgba(255, 255, 255, 0.05);
            font-weight: 700;
            color: var(--text-secondary);
        }

        .scoreboard-table tr:last-child td {
            border-bottom: none;
        }

        .scoreboard-table tr.winner-row {
            background: rgba(139, 92, 246, 0.15);
        }

        .scoreboard-table tr.eliminated-row {
            opacity: 0.45;
            background: rgba(255, 0, 0, 0.03);
            text-decoration: line-through;
        }

        .rank-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-weight: 800;
            font-size: 0.9rem;
            background: rgba(255, 255, 255, 0.1);
        }

        .rank-1 { background: #fbbf24; color: #000; }
        .rank-2 { background: #cbd5e1; color: #000; }
        .rank-3 { background: #b45309; color: #fff; }

        /* Penalty Section */
        .penalty-card {
            background: rgba(239, 68, 68, 0.08);
            border: 2px dashed rgba(239, 68, 68, 0.3);
            border-radius: 20px;
            padding: 2rem;
            text-align: center;
            margin: 2rem 0;
        }

        .penalty-title {
            color: #f87171;
            font-size: 1.8rem;
            font-weight: 900;
            margin-bottom: 0.5rem;
        }

        .penalty-name {
            font-size: 2.2rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
            margin: 1rem 0;
        }

        .roulette-box {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1.2rem;
            font-size: 1.2rem;
            font-weight: 700;
            color: #fbbf24;
            margin-top: 1.5rem;
            min-height: 2.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @media (max-width: 600px) {
            .twister-text {
                font-size: 1.6rem;
            }
            .mode-select-container {
                grid-template-columns: 1fr;
                gap: 0.5rem;
            }
            .judge-buttons {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            .judge-btn {
                padding: 1.2rem;
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <a href="../index.html" class="back-button">← 메인으로</a>
            <h1 class="game-title">👅 네온 잰말놀이</h1>
            <p class="game-description">빠르고 정확하게 발음해보세요! 모든 사람이 지켜보며 성공 여부를 판정합니다.</p>
        </div>

        <div class="game-board" id="main-board">
            <!-- STATUS BAR -->
            <div id="game-status-bar" class="status-bar" style="display: none;">
                <div class="status-item">
                    <span class="status-label">모드/진행</span>
                    <div class="status-value" id="status-round">점수 대결</div>
                </div>
                <div class="status-item">
                    <span class="status-label">도전자</span>
                    <div class="status-value" id="status-player" style="color: var(--accent-secondary); font-weight: 900;">플레이어 1</div>
                </div>
                <div class="status-item">
                    <span class="status-label">난이도</span>
                    <div class="status-value" id="status-difficulty">전체</div>
                </div>
            </div>

            <!-- 1. SETUP SCREEN -->
            <div id="screen-setup" class="screen active setup-container">
                <!-- Game Mode Selection -->
                <div class="form-group">
                    <label>게임 모드</label>
                    <div class="mode-select-container">
                        <div class="mode-card active" onclick="selectGameMode('score')" id="mode-score">
                            <div class="mode-title">점수 대결</div>
                            <div class="mode-desc">N라운드 동안 가장 많은 성공 점수 획득</div>
                        </div>
                        <div class="mode-card" onclick="selectGameMode('survival')" id="mode-survival">
                            <div class="mode-title">서바이벌</div>
                            <div class="mode-desc">실패 시 즉시 탈락, 최후의 1인 생존전</div>
                        </div>
                        <div class="mode-card" onclick="selectGameMode('loser')" id="mode-loser">
                            <div class="mode-title">벌칙 낙점</div>
                            <div class="mode-desc">최초의 실패자가 즉시 패배 (벌칙 선정용)</div>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="player-count">참가자 수 (2 ~ 10명)</label>
                    <input type="number" id="player-count" min="2" max="10" value="3" onchange="updatePlayerInputs()">
                </div>

                <div class="form-group">
                    <label>참가자 이름</label>
                    <div id="player-names-list" class="player-names-list">
                        <!-- Auto generated input fields -->
                    </div>
                </div>

                <div class="form-group" id="round-select-group">
                    <label for="round-count">라운드 수</label>
                    <select id="round-count">
                        <option value="1">1 라운드</option>
                        <option value="2">2 라운드</option>
                        <option value="3" selected>3 라운드</option>
                        <option value="4">4 라운드</option>
                        <option value="5">5 라운드</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="difficulty-select">잰말 난이도</label>
                    <select id="difficulty-select">
                        <option value="all">전체 난이도</option>
                        <option value="easy">쉬움</option>
                        <option value="medium">보통</option>
                        <option value="hard">어려움</option>
                    </select>
                </div>

                <button class="button" onclick="initGame()" style="margin-top: 1rem;">게임 시작! 🚀</button>
            </div>

            <!-- 2. PLAY SCREEN (Hides Pass screen, merged Challenge & Judgment) -->
            <div id="screen-play" class="screen">
                <div class="game-tag" id="play-player-tag">플레이어 1 님의 차례!</div>
                
                <div class="twister-card">
                    <div id="play-difficulty" class="difficulty-badge">보통</div>
                    <div class="twister-text" id="play-text">간장공장 공장장은 강 공장장이고 된장공장 공장장은 장 공장장이다.</div>
                </div>

                <!-- Timer Section -->
                <div class="timer-container" id="timer-box">
                    <div class="timer-text" id="timer-text">10</div>
                    <div class="timer-bar-outer">
                        <div class="timer-bar-inner" id="timer-bar"></div>
                    </div>
                </div>

                <!-- Live Judgment Buttons -->
                <div class="judge-buttons">
                    <button class="judge-btn judge-success" onclick="submitTurn(true)">
                        <span class="judge-icon">🎉</span>
                        <span>성공!</span>
                    </button>
                    <button class="judge-btn judge-fail" onclick="submitTurn(false)">
                        <span class="judge-icon">❌</span>
                        <span>실패...</span>
                    </button>
                </div>
            </div>

            <!-- 3. SCOREBOARD SCREEN -->
            <div id="screen-scoreboard" class="screen">
                <h2 id="scoreboard-title" style="text-align: center; font-size: 2rem; margin-bottom: 1.5rem; background: linear-gradient(135deg, var(--accent-primary), var(--accent-tertiary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">🏆 최종 결과</h2>
                
                <!-- Penalty section for Loser Out Mode -->
                <div id="loser-penalty-box" class="penalty-card" style="display: none;">
                    <div class="penalty-title">💀 벌칙 당첨자 💀</div>
                    <div class="penalty-name" id="loser-name">플레이어 3</div>
                    <button class="button" onclick="spinPenaltyRoulette()" style="margin-top: 1rem;">🎰 벌칙 추첨하기</button>
                    <div id="penalty-roulette-display" class="roulette-box" style="display: none;"></div>
                </div>

                <div id="scoreboard-table-container">
                    <table class="scoreboard-table">
                        <thead>
                            <tr>
                                <th>순위</th>
                                <th>이름</th>
                                <th>성공 횟수</th>
                                <th>상태/성공률</th>
                            </tr>
                        </thead>
                        <tbody id="scoreboard-rows">
                            <!-- Scoreboard rows go here -->
                        </tbody>
                    </table>
                </div>

                <div class="controls">
                    <button class="button button-secondary" onclick="restartSetup()">설정 변경하기</button>
                    <button class="button" onclick="restartGameSamePlayers()">같은 인원으로 다시 하기</button>
                </div>
            </div>

        </div>
    </div>

        // Web Audio API Synth for Premium Beeps
        let audioCtx = null;
        function playSound(type) {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'beep') {
                    osc.frequency.setValueAtTime(880, audioCtx.currentTime); // High pitch A5
                    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.1);
                } else if (type === 'success') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                    osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
                    osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2); // G5
                    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.45);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.45);
                } else if (type === 'fail') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, audioCtx.currentTime); // A3
                    osc.frequency.setValueAtTime(164.81, audioCtx.currentTime + 0.15); // E3
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.4);
                } else if (type === 'warning') {
                    // Warning Beeps increase pitch to create urgency
                    osc.frequency.setValueAtTime(1100, audioCtx.currentTime); 
                    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.18);
                }
            } catch (e) {
                console.log("Audio play blocked or failed: ", e);
            }
        }

        // Initialize setup player list inputs
        function updatePlayerInputs() {
            const count = parseInt(document.getElementById('player-count').value) || 3;
            const container = document.getElementById('player-names-list');
            const currentInputs = container.querySelectorAll('input');
            const savedNames = Array.from(currentInputs).map(inp => inp.value);

            container.innerHTML = '';
            for (let i = 0; i < count; i++) {
                const nameVal = savedNames[i] || `플레이어 ${i + 1}`;
                
                const div = document.createElement('div');
                div.className = 'player-input-item';
                div.innerHTML = `
                    <span>P${i + 1}</span>
                    <input type="text" placeholder="이름 입력" value="${nameVal}">
                `;
                container.appendChild(div);
            }
        }

                activeTwisters = [...TWISTER_DB];
            } else {
                const levelMap = { 'easy': '쉬움', 'medium': '보통', 'hard': '어려움' };
                const selectedKOR = levelMap[selectedDifficulty];
                activeTwisters = TWISTER_DB.filter(t => t.level === selectedKOR);
            }

            // Shuffle active list
            shuffleArray(activeTwisters);

            // Reset scores & progress
            currentRound = 1;
            currentPlayerIdx = 0;

            // Setup Status Label
            const difficultyLabelMap = { 'all': '전체', 'easy': '쉬움', 'medium': '보통', 'hard': '어려움' };
            document.getElementById('status-difficulty').textContent = difficultyLabelMap[selectedDifficulty];

            startNextTurn();
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function updateStatusBar() {
            const statusRound = document.getElementById('status-round');
            if (gameMode === 'score') {
                statusRound.textContent = `라운드 ${currentRound} / ${totalRounds}`;
            } else if (gameMode === 'survival') {
                statusRound.textContent = `서바이벌 💀`;
            } else {
                statusRound.textContent = `벌칙 낙점 💣`;
            }
            document.getElementById('status-player').textContent = players[currentPlayerIdx].name;
        }

        function startNextTurn() {
            // Find next eligible player (specifically for Survival mode)
            if (gameMode === 'survival') {
                // If all but 1 are eliminated, end game
                const activePlayers = players.filter(p => !p.eliminated);
                if (activePlayers.length <= 1) {
                    showScoreboard();
                    return;
                }

                // Loop to find next active player
                let loops = 0;
                while (players[currentPlayerIdx].eliminated && loops < players.length) {
                    currentPlayerIdx = (currentPlayerIdx + 1) % players.length;
                    loops++;
                }
            }

            updateStatusBar();

            // Select a twister (wrap around if activeTwisters runs out)
            const twisterIdx = Math.floor(Math.random() * activeTwisters.length);
            currentTwister = activeTwisters[twisterIdx];

            // Render elements
            const textEl = document.getElementById('play-text');
            const diffEl = document.getElementById('play-difficulty');
            const tagEl = document.getElementById('play-player-tag');

            textEl.textContent = currentTwister.text;
            diffEl.textContent = currentTwister.level;
            
            diffEl.className = 'difficulty-badge';
            if (currentTwister.level === '쉬움') diffEl.classList.add('diff-easy');
            else if (currentTwister.level === '보통') diffEl.classList.add('diff-medium');
            else diffEl.classList.add('diff-hard');

            tagEl.textContent = `👉 ${players[currentPlayerIdx].name} 님의 차례!`;

            // Calculate Dynamic Timer: (length * 0.18) + 4 seconds
            const length = currentTwister.text.length;
            totalTimerDuration = Math.max(6, Math.min(15, Math.round(length * 0.18 + 4)));
            
            showScreen('screen-play');
            startTimer();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerSecondsRemaining = totalTimerDuration;

            const textEl = document.getElementById('timer-text');
            const barInner = document.getElementById('timer-bar');
            const mainBoard = document.getElementById('main-board');

            textEl.textContent = timerSecondsRemaining;
            barInner.style.width = '100%';
            mainBoard.classList.remove('warning-active');

            timerInterval = setInterval(() => {
                timerSecondsRemaining--;
                textEl.textContent = timerSecondsRemaining;
                
                const percentage = (timerSecondsRemaining / totalTimerDuration) * 100;
                barInner.style.width = `${percentage}%`;

                // 3-seconds or less warning
                if (timerSecondsRemaining <= 3 && timerSecondsRemaining > 0) {
                    playSound('warning');
                    mainBoard.classList.add('warning-active');
                } else if (timerSecondsRemaining <= 0) {
                    clearInterval(timerInterval);
                    playSound('fail');
                    submitTurn(false); // Auto failure on timeout
                }
            }, 1000);
        }

        function submitTurn(isSuccess) {
            clearInterval(timerInterval);
            const player = players[currentPlayerIdx];
            player.turnsPlayed++;

            if (isSuccess) {
                playSound('success');
                player.score++;
            } else {
                playSound('fail');
                if (gameMode === 'survival') {
                    player.eliminated = true;
                }
            }

            // Mode Logic Routing
            if (gameMode === 'loser') {
                if (!isSuccess) {
                    // First failure immediately ends the game in Loser Mode
                    showScoreboard(player); // pass the loser
                    return;
                }
                // If success, keep rotating
                currentPlayerIdx = (currentPlayerIdx + 1) % players.length;
                startNextTurn();
            } else if (gameMode === 'survival') {
                // Advance player index
                currentPlayerIdx = (currentPlayerIdx + 1) % players.length;
                
                // If it wrapped around, increment round counter just for stats
                if (currentPlayerIdx === 0) {
                    currentRound++;
                }

                // Check survival conditions
                const activePlayers = players.filter(p => !p.eliminated);
                if (activePlayers.length <= 1) {
                    showScoreboard();
                } else {
                    startNextTurn();
                }
            } else { // Score Match
                currentPlayerIdx++;
                if (currentPlayerIdx >= players.length) {
                    currentPlayerIdx = 0;
                    currentRound++;
                }

                if (currentRound > totalRounds) {
                    showScoreboard();
                } else {
                    startNextTurn();
                }
            }
        }

        function showScoreboard(loser = null) {
            const tbody = document.getElementById('scoreboard-rows');
            const penaltyBox = document.getElementById('loser-penalty-box');
            const tableContainer = document.getElementById('scoreboard-table-container');
            const titleEl = document.getElementById('scoreboard-title');

            tbody.innerHTML = '';
            document.getElementById('penalty-roulette-display').style.display = 'none';

            if (gameMode === 'loser' && loser) {
                // Show loser highlight box, hide scoreboard table
                titleEl.textContent = '💣 벌칙 확정!';
                penaltyBox.style.display = 'block';
                document.getElementById('loser-name').textContent = loser.name;
                tableContainer.style.display = 'none';
            } else {
                // Show standard scoreboard
                titleEl.textContent = '🏆 최종 결과';
                penaltyBox.style.display = 'none';
                tableContainer.style.display = 'block';

                let sortedPlayers = [];
                if (gameMode === 'survival') {
                    // Survivors are ranked first, then eliminated players based on rounds survived/score
                    sortedPlayers = [...players].sort((a, b) => {
                        if (a.eliminated !== b.eliminated) {
                            return a.eliminated ? 1 : -1; // alive players first
                        }
                        return b.score - a.score;
                    });
                } else { // Score Match
                    sortedPlayers = [...players].sort((a, b) => b.score - a.score);
                }

                const maxScore = sortedPlayers[0].score;
                const isTie = sortedPlayers.filter(p => p.score === maxScore).length > 1;

                sortedPlayers.forEach((p, rankIdx) => {
                    const tr = document.createElement('tr');
                    
                    let rankDisplay = rankIdx + 1;
                    let rankClass = '';
                    if (rankDisplay === 1) rankClass = 'rank-1';
                    else if (rankDisplay === 2) rankClass = 'rank-2';
                    else if (rankDisplay === 3) rankClass = 'rank-3';

                    if (gameMode === 'survival') {
                        if (p.eliminated) {
                            tr.className = 'eliminated-row';
                        } else {
                            tr.className = 'winner-row';
                        }

                        const statusText = p.eliminated ? '💀 탈락' : '👑 생존자';
                        tr.innerHTML = `
                            <td><span class="rank-badge ${p.eliminated ? '' : rankClass}">${p.eliminated ? '💀' : '👑'}</span></td>
                            <td style="font-weight: 700;">${p.name}</td>
                            <td>${p.score} 번 성공</td>
                            <td>${statusText}</td>
                        `;
                    } else {
                        // Score Match row rendering
                        if (p.score === maxScore && maxScore > 0) {
                            tr.className = 'winner-row';
                        }

                        const successRate = Math.round((p.score / p.turnsPlayed) * 100) || 0;
                        tr.innerHTML = `
                            <td>
                                <span class="rank-badge ${rankClass}">
                                    ${p.score === maxScore && maxScore > 0 ? '👑' : rankDisplay}
                                </span>
                            </td>
                            <td style="font-weight: 700;">${p.name}</td>
                            <td>${p.score} / ${p.turnsPlayed}</td>
                            <td>${successRate}%</td>
                        `;
                    }

                    tbody.appendChild(tr);
                });
            }

            showScreen('screen-scoreboard');
        }

        function spinPenaltyRoulette() {
            playSound('beep');
            const display = document.getElementById('penalty-roulette-display');
            display.style.display = 'flex';
            display.textContent = "추첨 중...";
            
            let count = 0;
            const interval = setInterval(() => {
                const tempIdx = Math.floor(Math.random() * penaltyItems.length);
                display.textContent = penaltyItems[tempIdx];
                playSound('beep');
                count++;
                if (count > 8) {
                    clearInterval(interval);
                    const finalIdx = Math.floor(Math.random() * penaltyItems.length);
                    display.textContent = "👉 " + penaltyItems[finalIdx] + " 👈";
                    playSound('success');
                }
            }, 150);
        }

        function restartSetup() {
            showScreen('screen-setup');
        }

        function restartGameSamePlayers() {
            // Reset player scores & flags
            players.forEach(p => {
                p.score = 0;
                p.eliminated = false;
                p.turnsPlayed = 0;
            });

            // Reshuffle active twisters
            shuffleArray(activeTwisters);

            // Reset round progress
            currentRound = 1;
            currentPlayerIdx = 0;

            startNextTurn();
        }
    </script>
</body>
</html>
