<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>네온 카드 배틀 - 미니게임 천국</title>
<link rel="stylesheet" href="../styles/game-common.css">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0f172a;font-family:'Outfit',sans-serif;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
.back{position:absolute;top:20px;left:20px;z-index:10}
h1{font-size:1.8rem;background:linear-gradient(135deg,#f59e0b,#ef4444);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:20px}
.card{width:220px;height:320px;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .6s cubic-bezier(.175,.885,.32,1.275);position:relative;transform-style:preserve-3d}
.card.face-down{background:linear-gradient(135deg,#1e293b,#334155);border:3px solid rgba(255,255,255,.1);box-shadow:0 10px 30px rgba(0,0,0,.5)}
.card.face-down::after{content:'?';font-size:5rem;color:rgba(255,255,255,.2)}
.card.face-up{border:3px solid;box-shadow:0 0 40px rgba(0,0,0,.5)}
.card .card-value{font-size:6rem;font-weight:900}
.card .card-label{font-size:1.2rem;font-weight:600;margin-top:5px}
.card-area{display:flex;gap:40px;align-items:center;margin:30px 0}
.vs{font-size:2rem;font-weight:900;color:#64748b}
.result-text{font-size:2rem;font-weight:800;min-height:50px;margin:20px 0}
.btn{background:linear-gradient(135deg,#f59e0b,#ef4444);border:none;color:#fff;padding:14px 50px;font-size:1.2rem;font-weight:700;border-radius:50px;cursor:pointer}
.score-area{display:flex;gap:40px;margin-bottom:20px;font-size:1.3rem;font-weight:700}
.score-area span{padding:8px 20px;border-radius:20px;background:rgba(255,255,255,.05)}
</style>
</head>
<body>
<a href="../index.html" class="back back-button">← 메인</a>
<h1>🃏 네온 카드 배틀</h1>
<div id="setup" style="text-align:center;width:90%;max-width:400px">
    <div style="font-size:4rem;margin-bottom:20px">🃏</div>
    <h2 style="font-size:1.5rem;margin-bottom:10px">게임 규칙</h2>
    <p style="color:#94a3b8;margin:15px 0;line-height:1.6">
        1. 각 플레이어가 카드 한 장을 선택합니다.<br>
        2. 카드 뒷면에 숨겨진 숫자가 더 높은 쪽이 승리!<br>
        3. 자신의 운을 믿고 카드를 뒤집어보세요.
    </p>
    <button class="btn" onclick="startGame()">전투 시작!</button>
</div>

<div id="game" style="display:none;text-align:center">
<div class="score-area"><span>P1: <span id="s1">0</span></span><span>P2: <span id="s2">0</span></span></div>
<div class="result-text" id="turn-label" style="color:#94a3b8;font-size:1.2rem">플레이어 1, 카드를 선택하세요!</div>
<div class="card-area">
<div class="card face-down" id="card1" onclick="flip(1)"></div>
<div class="vs">VS</div>
<div class="card face-down" id="card2" onclick="flip(2)"></div>
</div>
<div class="result-text" id="result"></div>
<button class="btn" id="next-btn" onclick="nextRound()" style="display:none">다음 라운드</button>
</div>

<script>
let v1=0,v2=0,s1=0,s2=0,flippedCards=[],round=0;
const colors=[['#ff4757','rgba(255,71,87,.2)'],['#1e90ff','rgba(30,144,255,.2)'],['#2ed573','rgba(46,213,115,.2)'],['#ffa502','rgba(255,165,2,.2)'],['#8b5cf6','rgba(139,92,246,.2)'],['#ec4899','rgba(236,72,153,.2)']];

function startGame(){
    document.getElementById('setup').style.display = 'none';
    document.getElementById('game').style.display = 'block';
    nextRound();
}

function nextRound(){
    round++;
    v1=Math.floor(Math.random()*99)+1;
    v2=Math.floor(Math.random()*99)+1;
    flippedCards=[];
    const c1=document.getElementById('card1'),c2=document.getElementById('card2');
    c1.className='card face-down';c1.innerHTML='';c1.style='';
    c2.className='card face-down';c2.innerHTML='';c2.style='';
    document.getElementById('result').textContent=``;
    document.getElementById('turn-label').textContent=`원하는 카드를 선택하세요!`;
    document.getElementById('next-btn').style.display='none';
}

function flip(p){
    if(flippedCards.includes(p)) return;
    
    const card=document.getElementById('card'+p),val=p===1?v1:v2;
    const col=colors[Math.floor(Math.random()*colors.length)];
    card.className='card face-up';
    card.style.borderColor=col[0];
    card.style.background=`linear-gradient(135deg,${col[1]},rgba(15,23,42,1))`;
    card.style.boxShadow=`0 0 40px ${col[1]}`;
    card.innerHTML=`<div class="card-value" style="color:${col[0]}">${val}</div><div class="card-label" style="color:${col[0]}">POWER</div>`;
    
    flippedCards.push(p);
    if(flippedCards.length === 1) {
        document.getElementById('turn-label').textContent=`나머지 카드도 뒤집으세요!`;
    } else if(flippedCards.length === 2) {
        document.getElementById('turn-label').textContent=`결과 발표!`;
        setTimeout(()=>{
            if(v1>v2){
                s1++;
                document.getElementById('result').innerHTML=`<span style="color:#ff4757">P1 승리! 🏆</span>`;
                document.getElementById('card1').style.transform='scale(1.1)';
            } else if(v2>v1){
                s2++;
                document.getElementById('result').innerHTML=`<span style="color:#1e90ff">P2 승리! 🏆</span>`;
                document.getElementById('card2').style.transform='scale(1.1)';
            } else {
                document.getElementById('result').innerHTML=`<span style="color:#ffa502">무승부! 🤝</span>`;
            }
            document.getElementById('s1').textContent=s1;
            document.getElementById('s2').textContent=s2;
            document.getElementById('next-btn').style.display='block';
        },600);
    }
}
</script>
    <script src="../scripts/game-common.js"></script>
</body>
</html>
