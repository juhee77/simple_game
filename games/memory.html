<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카드 뒤집기 - 미니게임 천국</title>
    <link rel="stylesheet" href="../styles/game-common.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        .game-stats {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 2rem;
            font-size: 1.2rem;
            color: var(--text-secondary);
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .memory-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            max-width: 600px;
            margin: 0 auto;
            perspective: 1000px;
        }

        .card {
            aspect-ratio: 3/4;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            cursor: pointer;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card.matched .card-front {
            background: linear-gradient(135deg, var(--accent-secondary), var(--accent-tertiary));
            border-color: var(--accent-primary);
            box-shadow: 0 0 15px var(--accent-primary);
        }

        .card.matched {
            animation: pulse 0.5s;
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            user-select: none;
        }

        .card-back {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .card-back::after {
            content: '?';
            font-size: 2rem;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 800;
        }

        .card-front {
            background: var(--bg-card);
            transform: rotateY(180deg);
            border: 2px solid var(--accent-secondary);
        }

        @keyframes pulse {
            0% {
                transform: rotateY(180deg) scale(1);
            }

            50% {
                transform: rotateY(180deg) scale(1.1);
            }

            100% {
                transform: rotateY(180deg) scale(1);
            }
        }

        .difficulty-selector {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .difficulty-btn {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .difficulty-btn.active {
            background: var(--accent-primary);
            color: white;
            border-color: var(--accent-primary);
        }

        @media (max-width: 500px) {
            .memory-grid {
                gap: 0.5rem;
            }

            .card-face {
                font-size: 2rem;
            }
        }

        .result-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .result-modal.show {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        .result-content {
            background: var(--bg-card);
            padding: 3rem;
            border-radius: 20px;
            text-align: center;
            border: 2px solid var(--accent-primary);
            animation: scaleIn 0.5s ease;
            max-width: 90%;
            width: 400px;
        }

        .result-title {
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        .result-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 2rem;
            text-align: left;
        }

        .result-stat-row {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem;
            background: var(--bg-secondary);
            border-radius: 8px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes scaleIn {
            from {
                transform: scale(0.8);
            }

            to {
                transform: scale(1);
            }
        }
    </style>
</head>

<body>
    <div class="game-container">
        <div class="game-header">
            <a href="../index.html" class="back-button">← 메인으로</a>
            <h1 class="game-title">🃏 카드 뒤집기</h1>
            <p class="game-description">숨겨진 카드의 짝을 찾아보세요!</p>
        </div>

        <div class="game-board">
            <div class="difficulty-selector">
                <button class="difficulty-btn active" onclick="setDifficulty(4)">4x4 (쉬움)</button>
                <button class="difficulty-btn" onclick="setDifficulty(6)">6x4 (어려움)</button>
            </div>

            <div class="game-stats">
                <div class="stat-item">
                    <span>이동 횟수</span>
                    <span class="stat-value" id="moves">0</span>
                </div>
                <div class="stat-item">
                    <span>시간</span>
                    <span class="stat-value" id="time">00:00</span>
                </div>
            </div>

            <div class="memory-grid" id="grid">
                <!-- Cards will be generated here -->
            </div>

            <div class="controls" style="margin-top: 2rem; text-align: center;">
                <button class="button" onclick="initGame()">게임 재시작 🔄</button>
            </div>
        </div>
    </div>

    <div class="result-modal" id="result-modal">
        <div class="result-content">
            <h2 class="result-title">🎉 클리어!</h2>
            <div class="result-stats">
                <div class="result-stat-row">
                    <span>이동 횟수</span>
                    <span id="final-moves">0</span>
                </div>
                <div class="result-stat-row">
                    <span>소요 시간</span>
                    <span id="final-time">00:00</span>
                </div>
            </div>
            <button class="button" onclick="closeModalAndRestart()">다시 도전</button>
        </div>
    </div>

    <script>
        const emojis = ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼', '🐨', '🐯', '🦁', '🐮', '🐷', '🐸', '🐵', '🦄', '🐙', '🦋'];
        let cards = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let timer = null;
        let seconds = 0;
        let isLocked = false;
        let currentSize = 16; // Default 4x4

        function setDifficulty(cols) {
            const btns = document.querySelectorAll('.difficulty-btn');
            btns.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            const grid = document.getElementById('grid');
            if (cols === 6) {
                grid.style.gridTemplateColumns = 'repeat(6, 1fr)';
                currentSize = 24;
            } else {
                grid.style.gridTemplateColumns = 'repeat(4, 1fr)';
                currentSize = 16;
            }
            initGame();
        }

        function initGame() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';

            moves = 0;
            matchedPairs = 0;
            seconds = 0;
            flippedCards = [];
            isLocked = false;

            document.getElementById('moves').textContent = '0';
            document.getElementById('time').textContent = '00:00';

            if (timer) clearInterval(timer);
            timer = setInterval(updateTimer, 1000);

            // Create pairs
            const pairCount = currentSize / 2;
            const gameEmojis = emojis.slice(0, pairCount);
            cards = [...gameEmojis, ...gameEmojis];

            // Shuffle
            shuffle(cards);

            // Create DOM elements
            cards.forEach((emoji, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.index = index;
                card.dataset.emoji = emoji;

                card.innerHTML = `
                    <div class="card-face card-back"></div>
                    <div class="card-face card-front">${emoji}</div>
                `;

                card.addEventListener('click', flipCard);
                grid.appendChild(card);
            });
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function flipCard() {
            if (isLocked) return;
            const card = this;

            if (card.classList.contains('flipped') || card.classList.contains('matched')) return;

            card.classList.add('flipped');
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                moves++;
                document.getElementById('moves').textContent = moves;
                checkForMatch();
            }
        }

        function checkForMatch() {
            const [card1, card2] = flippedCards;
            const match = card1.dataset.emoji === card2.dataset.emoji;

            isLocked = true;

            if (match) {
                disableCards();
            } else {
                unflipCards();
            }
        }

        function disableCards() {
            flippedCards.forEach(card => {
                card.classList.add('matched');
            });
            matchedPairs++;
            flippedCards = [];
            isLocked = false;

            if (matchedPairs === currentSize / 2) {
                endGame();
            }
        }

        function unflipCards() {
            setTimeout(() => {
                flippedCards.forEach(card => card.classList.remove('flipped'));
                flippedCards = [];
                isLocked = false;
            }, 1000);
        }

        function updateTimer() {
            seconds++;
            const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
            const secs = (seconds % 60).toString().padStart(2, '0');
            document.getElementById('time').textContent = `${mins}:${secs}`;
        }

        function endGame() {
            clearInterval(timer);
            const finalTime = document.getElementById('time').textContent;
            document.getElementById('final-moves').textContent = moves;
            document.getElementById('final-time').textContent = finalTime;

            setTimeout(() => {
                document.getElementById('result-modal').classList.add('show');
            }, 500);
        }

        function closeModalAndRestart() {
            document.getElementById('result-modal').classList.remove('show');
            initGame();
        }

        // Start game
        initGame();
    </script>
</body>

</html>
