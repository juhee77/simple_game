<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D-Day & 모임 카운트다운 | 미니게임 천국</title>
  <script src="../scripts/game-common.js?v=b7c7301f"></script>
  <link rel="stylesheet" href="../styles/game-common.css?v=bed20c1e">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root {
      --bg: #0b0b1a;
      --card-bg: rgba(22, 22, 45, 0.7);
      --card-border: rgba(255, 255, 255, 0.1);
      --cyan: #00d4ff;
      --purple: #7c3aed;
      --pink: #ff006e;
      --yellow: #ffd166;
      --green: #06d6a0;
      --text-main: #ffffff;
      --text-dim: #94a3b8;
      --radius-card: 16px;
      --radius-btn: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      padding: 0;   /* 공용 CSS의 body 패딩을 쓰지 않는다 */
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Outfit', 'Pretendard', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 10px 0;
    }

    .back-btn {
      position: absolute;
      left: 0;
      background: none;
      border: none;
      color: var(--cyan);
      font-size: 24px;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      transition: background 0.2s;
    }

    .back-btn:hover { background: rgba(0, 212, 255, 0.1); }

    h1 {
      font-size: 24px;
      font-weight: 800;
      background: linear-gradient(90deg, var(--cyan), var(--purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(10px);
      border-radius: var(--radius-card);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .sub-label {
      font-size: 13px;
      color: var(--text-dim);
      font-weight: 600;
      margin-top: 4px;
    }

    .preset-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .preset-btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--card-border);
      color: var(--text-dim);
      padding: 8px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .preset-btn.active {
      background: rgba(0, 212, 255, 0.15);
      border-color: var(--cyan);
      color: var(--cyan);
    }

    input, select {
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--card-border);
      color: white;
      padding: 12px 16px;
      border-radius: var(--radius-btn);
      font-family: inherit;
      font-size: 15px;
      outline: none;
    }

    input:focus, select:focus { border-color: var(--cyan); }

    .color-picker {
      display: flex;
      gap: 10px;
    }

    .color-dot {
      width: 32px; height: 32px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
    }

    .color-dot.active { border-color: white; transform: scale(1.1); }

    .bg-upload-btn {
      background: rgba(255,255,255,0.08);
      border: 1px dashed var(--card-border);
      color: var(--text-dim);
      padding: 10px;
      border-radius: var(--radius-btn);
      font-size: 13px;
      cursor: pointer;
      text-align: center;
    }

    .dday-banner {
      background: linear-gradient(135deg, rgba(124, 58, 237, 0.3), rgba(255, 0, 110, 0.3));
      border: 2px solid var(--pink);
      border-radius: var(--radius-card);
      padding: 28px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      text-align: center;
      box-shadow: 0 0 30px rgba(255, 0, 110, 0.3);
      position: relative;
      overflow: hidden;
    }

    .dday-tag {
      font-size: 13px;
      padding: 4px 14px;
      border-radius: 20px;
      background: rgba(0, 212, 255, 0.2);
      color: var(--cyan);
      font-weight: 700;
      border: 1px solid var(--cyan);
    }

    .dday-title {
      font-size: 24px;
      font-weight: 800;
      color: white;
    }

    .dday-count-display {
      font-size: 46px;
      font-weight: 800;
      color: var(--yellow);
      text-shadow: 0 0 20px rgba(255, 209, 102, 0.8);
      letter-spacing: 2px;
    }

    .dday-timer-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      width: 100%;
      margin-top: 6px;
    }

    .timer-box {
      background: rgba(0, 0, 0, 0.5);
      padding: 10px 4px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .timer-num {
      font-size: 22px;
      font-weight: 800;
      color: var(--cyan);
    }

    .timer-unit {
      font-size: 11px;
      color: var(--text-dim);
    }

    .action-btn {
      background: linear-gradient(135deg, var(--cyan), var(--purple));
      border: none;
      color: white;
      padding: 14px;
      border-radius: var(--radius-btn);
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
    }

    .preview-container {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      margin-top: 10px;
    }

    canvas {
      max-width: 320px;
      border-radius: 16px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
    }

    .help-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      cursor: pointer;
      border: 1px solid var(--card-border);
      z-index: 100;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-content {
      background: var(--bg);
      border: 1px solid var(--card-border);
      padding: 24px;
      border-radius: var(--radius-card);
      max-width: 400px;
      width: 100%;
    }

    .modal h2 { margin-bottom: 16px; color: var(--cyan); }
    .modal p { margin-bottom: 12px; line-height: 1.5; color: var(--text-dim); }
    .close-modal { margin-top: 16px; width: 100%; padding: 12px; background: var(--purple); border: none; border-radius: 8px; color: white; cursor: pointer; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <a href="../index.html" class="back-btn">←</a>
      <h1>D-Day & 모임 카운트다운</h1>
    </header>

    <div class="card">
      <div class="form-group">
        <div class="sub-label">1. 카테고리 프리셋 선택</div>
        <div class="preset-row">
          <button class="preset-btn active" onclick="setPreset('🥳 모임 / 파티', '우리들의 네온 파티', '설레는 모임까지 남은 시간', 7, this)">🥳 파티/모임</button>
          <button class="preset-btn" onclick="setPreset('✈️ 여행 / 휴가', '제주도 힐링 우정 여행', '떠나는 날까지 카운트다운', 14, this)">✈️ 여행/휴가</button>
          <button class="preset-btn" onclick="setPreset('🎂 생일 / 기념일', 'HAPPY BIRTHDAY PARTY', '특별한 날을 축하해!', 3, this)">🎂 생일/기념일</button>
          <button class="preset-btn" onclick="setPreset('🎓 종강 / 졸업', '자유를 향한 종강 카운트다운', '시험 끝나고 놀 준비 완료!', 10, this)">🎓 종강/졸업</button>
          <button class="preset-btn" onclick="setPreset('🎯 목표 D-Day', '목표 달성의 날', '끝까지 파이팅!', 30, this)">🎯 목표/시험</button>
        </div>

        <div class="sub-label">2. 이벤트 세부 설정</div>
        <input type="text" id="eventTitle" placeholder="이벤트 / 모임 이름" value="우리들의 네온 파티">
        <input type="datetime-local" id="eventDate">
        <input type="text" id="eventDesc" placeholder="부제목 / 한줄 문구" value="설레는 모임까지 남은 시간">
        
        <div class="sub-label">3. 테마 컬러 및 배경</div>
        <div class="color-picker">
          <div class="color-dot active" style="background:#ff006e" onclick="setTheme('#ff006e', this)"></div>
          <div class="color-dot" style="background:#00d4ff" onclick="setTheme('#00d4ff', this)"></div>
          <div class="color-dot" style="background:#ffd166" onclick="setTheme('#ffd166', this)"></div>
          <div class="color-dot" style="background:#7c3aed" onclick="setTheme('#7c3aed', this)"></div>
          <div class="color-dot" style="background:#06d6a0" onclick="setTheme('#06d6a0', this)"></div>
        </div>

        <label class="bg-upload-btn">
          📷 커스텀 배경 사진 첨부 (선택)
          <input type="file" id="bgImgInput" accept="image/*" style="display:none;" onchange="handleBgUpload(event)">
        </label>
      </div>

      <div class="dday-banner" id="ddayBanner">
        <div class="dday-tag" id="bannerTag">🥳 모임 / 파티</div>
        <div class="dday-title" id="bannerTitle">우리들의 네온 파티</div>
        <div class="dday-count-display" id="bannerCount">D-DAY</div>

        <div class="dday-timer-grid">
          <div class="timer-box"><span class="timer-num" id="tDays">0</span><span class="timer-unit">일</span></div>
          <div class="timer-box"><span class="timer-num" id="tHours">0</span><span class="timer-unit">시간</span></div>
          <div class="timer-box"><span class="timer-num" id="tMins">0</span><span class="timer-unit">분</span></div>
          <div class="timer-box"><span class="timer-num" id="tSecs">0</span><span class="timer-unit">초</span></div>
        </div>
      </div>

      <button class="action-btn" onclick="generateDDayCard()">✨ 네온 D-Day 포스터 카드 생성</button>

      <div class="preview-container" id="previewContainer">
        <canvas id="ddayCanvas"></canvas>
        <button class="action-btn" onclick="downloadDDayCard()" style="width:100%;">📥 D-Day 포스터 카드 다운로드 (PNG)</button>
      </div>
    </div>
  </div>



  <script type="application/json" id="game-rules">
{
 "title": "D-Day & 모임 카운트다운",
 "players": "1인",
 "time": "1분",
 "goal": "모임이나 기념일까지 남은 날을 세고, 공유할 포스터 카드를 만듭니다.",
 "steps": [
  "카테고리 프리셋을 고르면 이름과 날짜가 대략 채워집니다.",
  "이벤트 이름, 목표 날짜와 시각, 한 줄 문구를 입력합니다.",
  "테마 색을 고르고, 원하면 배경 사진을 첨부합니다.",
  "「네온 D-Day 포스터 카드 생성」을 누르면 미리보기가 만들어집니다.",
  "다운로드해서 단톡방이나 SNS에 공유하세요."
 ],
 "tips": [
  "D-Day는 날짜 차이로 셉니다. 모임이 오전이든 밤이든 같은 날이면 같은 숫자가 나옵니다.",
  "이미 지난 날짜를 넣으면 며칠 지났는지 D+숫자로 보여줍니다.",
  "아래 시·분·초는 실제로 남은 시간이라 1초마다 줄어듭니다."
 ]
}
  </script>

  <script>
    let activeTheme = '#ff006e';
    let targetTime = null;
    let customBgImg = null;

    // Set initial target date
    setPreset('🥳 모임 / 파티', '우리들의 네온 파티', '설레는 모임까지 남은 시간', 7, document.querySelector('.preset-btn'));

    function setPreset(tag, title, desc, addDays, el) {
      document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
      if (el) el.classList.add('active');

      document.getElementById('bannerTag').textContent = tag;
      document.getElementById('eventTitle').value = title;
      document.getElementById('eventDesc').value = desc;

      const d = new Date();
      d.setDate(d.getDate() + addDays);
      d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
      document.getElementById('eventDate').value = d.toISOString().slice(0, 16);

      updateTimer();
    }

    function setTheme(color, el) {
      activeTheme = color;
      document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
      el.classList.add('active');

      const banner = document.getElementById('ddayBanner');
      banner.style.borderColor = color;
      banner.style.boxShadow = `0 0 30px ${color}55`;
    }

    function handleBgUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (evt) => {
        const img = new Image();
        img.onload = () => { customBgImg = img; alert('커스텀 배경 사진이 등록되었습니다!'); };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    }

    // D-Day는 '며칠 남았나'가 아니라 '날짜가 며칠 차이나나'로 센다.
    // 밀리초 차이를 내림하면 같은 날짜인데도 모임이 오전이면 D-6, 밤이면 D-7로 갈린다.
    // 우리는 "9월 20일 모임은 D-7"이라고 말하지, 몇 시인지로 바꿔 부르지 않는다.
    function dayDiff(target, now) {
      const a = new Date(target.getFullYear(), target.getMonth(), target.getDate());
      const b = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      // 자정 기준끼리 빼고 반올림한다. 서머타임 등으로 24시간이 아닌 날이 있어도 안전하다.
      return Math.round((a - b) / 86400000);
    }

    // 남은 날짜 문구. 지난 날은 D+n으로 적는다.
    // 예전에는 작년 생일을 넣어도 "D - DAY!"라고 표시했다.
    function ddayLabel(days) {
      if (days === 0) return 'D - DAY!';
      return days > 0 ? `D - ${days}` : `D + ${-days}`;
    }

    function updateTimer() {
      const dateVal = document.getElementById('eventDate').value;
      if (!dateVal) return;

      const target = new Date(dateVal);
      if (isNaN(target)) return;

      const now = new Date();
      targetTime = target.getTime();
      const diff = targetTime - now.getTime();
      const days = dayDiff(target, now);

      const title = document.getElementById('eventTitle').value.trim() || 'D-Day 이벤트';
      document.getElementById('bannerTitle').textContent = title;
      document.getElementById('bannerCount').textContent = ddayLabel(days);

      if (diff <= 0) {
        // 이미 지난 시각이면 카운트다운은 멈추되, 며칠 지났는지는 위에 남긴다.
        document.getElementById('tDays').textContent = days < 0 ? -days : '0';
        document.getElementById('tHours').textContent = '0';
        document.getElementById('tMins').textContent = '0';
        document.getElementById('tSecs').textContent = '0';
        return;
      }

      // 시·분·초는 실제 남은 시간 그대로 보여준다(날짜 칸만 달력 기준).
      document.getElementById('tDays').textContent = days;
      document.getElementById('tHours').textContent = Math.floor((diff % 86400000) / 3600000);
      document.getElementById('tMins').textContent = Math.floor((diff % 3600000) / 60000);
      document.getElementById('tSecs').textContent = Math.floor((diff % 60000) / 1000);
    }

    setInterval(updateTimer, 1000);
    updateTimer();

    document.getElementById('eventTitle').addEventListener('input', updateTimer);
    document.getElementById('eventDate').addEventListener('change', updateTimer);

    function generateDDayCard() {
      const canvas = document.getElementById('ddayCanvas');
      canvas.width = 600;
      canvas.height = 850;
      const ctx = canvas.getContext('2d');

      // 1. Draw Background
      if (customBgImg) {
        ctx.drawImage(customBgImg, 0, 0, 600, 850);
        ctx.fillStyle = 'rgba(11, 11, 26, 0.75)';
        ctx.fillRect(0, 0, 600, 850);
      } else {
        const grad = ctx.createLinearGradient(0, 0, 600, 850);
        grad.addColorStop(0, '#0b0b1a');
        grad.addColorStop(0.5, '#181230');
        grad.addColorStop(1, '#2c1445');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 600, 850);

        // Draw Stars/Particles
        ctx.fillStyle = '#ffffff';
        for (let i = 0; i < 40; i++) {
          const sx = (Math.sin(i * 99) * 0.5 + 0.5) * 600;
          const sy = (Math.cos(i * 33) * 0.5 + 0.5) * 850;
          const sr = (i % 3) + 1;
          ctx.globalAlpha = (i % 5 + 3) / 10;
          ctx.beginPath();
          ctx.arc(sx, sy, sr, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1.0;
      }

      // 2. Neon Frame Border & Glow
      ctx.strokeStyle = activeTheme;
      ctx.lineWidth = 6;
      ctx.shadowColor = activeTheme;
      ctx.shadowBlur = 20;
      ctx.strokeRect(20, 20, 560, 810);
      ctx.shadowBlur = 0;

      // 3. Category Tag
      const tagText = document.getElementById('bannerTag').textContent;
      ctx.fillStyle = activeTheme;
      ctx.fillRect(200, 75, 200, 36);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 15px Outfit, Pretendard, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(tagText, 300, 98);

      // 4. Title & Subtitle
      const title = document.getElementById('eventTitle').value.trim() || 'D-Day 이벤트';
      const desc = document.getElementById('eventDesc').value.trim() || '설레는 모임까지 남은 시간';

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 36px Outfit, Pretendard, sans-serif';
      ctx.fillText(title, 300, 185);

      ctx.fillStyle = '#94a3b8';
      ctx.font = '18px Outfit, Pretendard, sans-serif';
      ctx.fillText(desc, 300, 235);

      // 5. Main D-Day Big Number Display
      const dateVal = document.getElementById('eventDate').value;
      const daysText = dateVal ? ddayLabel(dayDiff(new Date(dateVal), new Date())) : 'D - DAY!';

      ctx.fillStyle = '#ffd166';
      ctx.font = 'bold 96px Outfit, sans-serif';
      ctx.shadowColor = 'rgba(255, 209, 102, 0.9)';
      ctx.shadowBlur = 35;
      ctx.fillText(daysText, 300, 410);
      ctx.shadowBlur = 0;

      // 6. Realtime Detailed Timer Sub-box
      const hours = document.getElementById('tHours').textContent;
      const mins = document.getElementById('tMins').textContent;
      const secs = document.getElementById('tSecs').textContent;

      ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
      ctx.fillRect(70, 510, 460, 130);
      ctx.strokeStyle = activeTheme;
      ctx.lineWidth = 2;
      ctx.strokeRect(70, 510, 460, 130);

      ctx.fillStyle = '#00d4ff';
      ctx.font = 'bold 30px Outfit, sans-serif';
      ctx.fillText(`${days}일  ${hours}시간  ${mins}분  ${secs}초`, 300, 585);

      // 7. Footer
      ctx.fillStyle = '#64748b';
      ctx.font = 'bold 15px Outfit, sans-serif';
      ctx.fillText('MINI GAME PARADISE | NEON D-DAY POSTER', 300, 770);

      document.getElementById('previewContainer').style.display = 'flex';
      document.getElementById('previewContainer').scrollIntoView({ behavior: 'smooth' });
    }

    function downloadDDayCard() {
      const canvas = document.getElementById('ddayCanvas');
      const a = document.createElement('a');
      a.href = canvas.toDataURL('image/png');
      a.download = `dday_poster_${Date.now()}.png`;
      a.click();
    }
  </script>
</body>
</html>
