<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>네온 샴페인 - 미니게임 천국</title>
<link rel="stylesheet" href="../styles/game-common.css?v=308950af">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0f172a;font-family:'Outfit',sans-serif;color:#fff;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;touch-action:none}
.back{position:absolute;top:20px;left:20px;z-index:10}
.bottle{font-size:10rem;transition:transform .1s;cursor:pointer}
.bottle.shake{animation:bottleShake .1s}
@keyframes bottleShake{0%,100%{transform:rotate(0)}33%{transform:rotate(-8deg)}66%{transform:rotate(8deg)}}
.meter{width:80%;max-width:300px;height:30px;background:rgba(255,255,255,.1);border-radius:15px;margin:20px 0;overflow:hidden;border:2px solid rgba(255,255,255,.1)}
.meter-fill{height:100%;background:linear-gradient(90deg,#fbbf24,#f97316,#ef4444);border-radius:13px;transition:width .2s;position:relative}
.meter-fill::after{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(255,255,255,.3),transparent);border-radius:13px}
.info{color:#94a3b8;font-size:1.1rem;margin:10px 0;text-align:center}
.player-text{font-size:1.8rem;font-weight:800;color:#fbbf24}
.btn{background:linear-gradient(135deg,#fbbf24,#f97316);border:none;color:#fff;padding:14px 50px;font-size:1.2rem;font-weight:700;border-radius:50px;cursor:pointer;margin:20px}
.exploded-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,rgba(251,191,36,.95),rgba(249,115,22,.95));flex-direction:column;align-items:center;justify-content:center;z-index:50}
.exploded-overlay h2{font-size:3rem;font-weight:900}
.bubbles{position:fixed;bottom:0;width:100%;height:100%;pointer-events:none;z-index:1}
.bubble{position:absolute;bottom:-20px;width:15px;height:15px;border-radius:50%;background:rgba(251,191,36,.3);animation:rise 3s infinite}
@keyframes rise{to{transform:translateY(-100vh);opacity:0}}
</style>
    <script src="../scripts/game-common.js?v=6650036c"></script>
</head>
<body>
<a href="../index.html" class="back back-button" style="z-index:10">← 메인</a>
<div class="bubbles" id="bubbles"></div>
<div id="setup" style="text-align:center;z-index:10">
    <div class="bottle" style="font-size:8rem;margin-bottom:20px">🍾</div>
    <p style="color:#94a3b8;margin:15px 0">참가자 수를 입력하세요 (1~30명)</p>
    <input id="player-count" type="number" value="4" min="1" max="30" style="padding:15px;border-radius:15px;border:2px solid #fbbf24;background:rgba(255,255,255,0.05);color:white;width:200px;text-align:center;font-size:1.2rem;outline:none">
    <br><button class="btn" onclick="startGame()">샴페인 돌리기 시작!</button>
</div>
<div id="game" style="text-align:center;z-index:5;display:none">
<div class="player-text" id="player-text">플레이어 1</div>
<div class="bottle" id="bottle">🍾</div>
<div class="meter"><div class="meter-fill" id="meter" style="width:0%"></div></div>
<div class="info">폰을 흔들거나 병을 탭해서 탄산을 채우세요!</div>
<button class="btn" onclick="passTurn()">다음 사람에게 넘기기!</button>
</div>
<div class="exploded-overlay" id="exploded">
<div style="font-size:8rem">🥂💥</div>
<h2>펑! 터졌어요!</h2>
<p style="font-size:1.5rem;margin:15px 0" id="loser-text"></p>
<button class="btn" onclick="resetGame()" style="background:white;color:black">다시 하기</button>
</div>
<script>
let totalPlayers=4,pressure=0,maxPressure=100,player=1,popThreshold=101,shaking=false;

function startGame(){
    totalPlayers = Math.min(30, Math.max(1, +document.getElementById('player-count').value || 4));
    popThreshold = 50 + Math.random() * 50;
    document.getElementById('setup').style.display = 'none';
    document.getElementById('game').style.display = 'block';
}
const bottle=document.getElementById('bottle'),meter=document.getElementById('meter');
function addPressure(amount){
pressure=Math.min(maxPressure,pressure+amount);
meter.style.width=(pressure/maxPressure*100)+'%';
bottle.classList.add('shake');setTimeout(()=>bottle.classList.remove('shake'),100);
addBubble();
if(pressure>=popThreshold)pop();
}
bottle.addEventListener('pointerdown',()=>addPressure(3+Math.random()*5));
if(window.DeviceMotionEvent){
window.addEventListener('devicemotion',e=>{
const a=e.accelerationIncludingGravity;if(!a)return;
const mag=Math.abs(a.x)+Math.abs(a.y)+Math.abs(a.z);
if(mag>20)addPressure(2+Math.random()*3);
});
if(typeof DeviceMotionEvent.requestPermission==='function')DeviceMotionEvent.requestPermission();
}
function passTurn(){
    player = (player % totalPlayers) + 1;
    document.getElementById('player-text').textContent=`플레이어 ${player}`;
}
function pop(){
document.getElementById('exploded').style.display='flex';
document.getElementById('loser-text').textContent=`플레이어 ${player}이(가) 벌칙!`;
}
function resetGame(){
    location.reload();
}
function addBubble(){
const b=document.createElement('div');b.className='bubble';
b.style.left=Math.random()*100+'%';b.style.animationDuration=(2+Math.random()*3)+'s';
b.style.width=b.style.height=(8+Math.random()*15)+'px';
document.getElementById('bubbles').appendChild(b);
setTimeout(()=>b.remove(),4000);
}
</script>
    <script type="application/json" id="game-rules">
{
 "title": "네온 샴페인",
 "goal": "샴페인이 터지기 전에 다음 사람에게 넘기세요.",
 "steps": [
  "참가자 수를 정하고 시작합니다.",
  "자기 차례에 폰을 흔들거나 병을 탭해 탄산을 채웁니다.",
  "정해진 양을 채웠으면 다음 사람에게 넘깁니다.",
  "터지는 순간 들고 있던 사람이 벌칙입니다."
 ],
 "tips": [
  "언제 터질지는 아무도 모릅니다. 욕심내면 손해입니다."
 ],
 "players": "1~30인",
 "time": "약 5분"
}
</script>
</body>
</html>
