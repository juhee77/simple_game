<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사다리 타기 - 미니게임 천국</title>
    <link rel="stylesheet" href="../styles/game-common.css?v=bed20c1e">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        .input-section {
            margin-bottom: 2rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            padding: 0.875rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1rem;
            font-family: inherit;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--accent-primary);
        }

        .input-wrapper {
            display: flex;
            gap: 0.5rem;
        }

        .add-btn {
            padding: 0.875rem 1.5rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            cursor: pointer;
            font-weight: 600;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .add-btn:hover {
            border-color: var(--accent-primary);
            background: var(--bg-secondary);
        }

        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .ladder-container {
            display: none;
            flex-direction: column;
            gap: 1rem;
            width: 100%;
            height: 600px;
        }

        .ladder-container.active {
            display: flex;
        }

        #ladder-canvas {
            width: 100%;
            flex: 1;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
        }

        .start-positions,
        .end-positions {
            display: flex;
            justify-content: space-around;
            padding: 0 1rem;
        }

        .position-btn {
            padding: 0.5rem 1rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.2s;
            min-width: 60px;
            text-align: center;
        }

        .position-btn:hover {
            background: var(--bg-card);
            border-color: var(--accent-primary);
        }

        .position-btn.selected {
            background: var(--accent-primary);
            border-color: var(--accent-primary);
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.5);
        }

        .result-display {
            display: none;
            text-align: center;
            margin-top: 1rem;
            padding: 1rem;
            background: var(--bg-secondary);
            border-radius: 12px;
            border: 1px solid var(--accent-tertiary);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .result-display.show {
            display: block;
        }

        .result-text {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        .result-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-tertiary);
        }

        @keyframes popIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            .ladder-container {
                height: 500px;
            }

            .position-btn {
                padding: 0.25rem 0.5rem;
                font-size: 0.8rem;
                min-width: 40px;
            }
        }
    canvas{touch-action:manipulation}
</style>
    <script src="../scripts/game-common.js?v=b7c7301f"></script>
</head>

<body>
    <div class="game-container">
        <div class="game-header">
            <a href="../index.html" class="back-button">← 메인으로</a>
            <h1 class="game-title">🪜 사다리 타기</h1>
            <p class="game-description">공정한 랜덤 선택!</p>
        </div>

        <div class="game-board">
            <div class="input-section" id="input-section">
                <div class="input-group">
                    <label>참가자 (쉼표로 구분)</label>
                    <div class="input-wrapper">
                        <input type="text" id="participants-input" placeholder="예: 철수, 영희, 민수, 지영">
                        <button class="add-btn" onclick="processInput('participants')">추가</button>
                    </div>
                    <div class="tags-container" id="participants-tags"></div>
                </div>

                <div class="input-group">
                    <label>결과 (쉼표로 구분)</label>
                    <div class="input-wrapper">
                        <input type="text" id="results-input" placeholder="예: 당첨,꽝, 꽝, 당첨">
                        <button class="add-btn" onclick="processInput('results')">추가</button>
                    </div>
                    <div class="tags-container" id="results-tags"></div>
                </div>

                <div class="controls">
                    <button class="button" onclick="generateLadder()">사다리 생성</button>
                </div>
            </div>

            <div class="ladder-container" id="ladder-container">
                <div class="start-positions" id="start-positions"></div>
                <canvas id="ladder-canvas"></canvas>
                <div class="end-positions" id="end-positions"></div>

                <div class="result-display" id="result-display">
                    <div class="result-text">결과:</div>
                    <div class="result-value" id="result-value"></div>
                </div>

                <div class="controls">
                    <button class="button" onclick="showAllResults()">전체 결과 보기</button>
                    <button class="button button-secondary" onclick="resetLadder()">다시 설정</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let participants = [];
        let results = [];
        let ladderData = [];
        let animating = false;
        let completedPaths = []; // Store paths: { path: [], color: string }
        const colors = [
            '#ef4444', '#f97316', '#f59e0b', '#84cc16', '#10b981',
            '#06b6d4', '#3b82f6', '#6366f1', '#8b5cf6', '#d946ef',
            '#f43f5e', '#e11d48', '#f87171', '#fb923c', '#fbbf24',
            '#a3e635', '#34d399', '#22d3ee', '#60a5fa', '#818cf8',
            '#a78bfa', '#e879f9', '#fb7185', '#ef4444', '#f59e0b',
            '#10b981', '#3b82f6', '#8b5cf6', '#d946ef', '#f43f5e'
        ];

        // Input handling
        function processInput(type) {
            const inputId = type === 'participants' ? 'participants-input' : 'results-input';
            const input = document.getElementById(inputId);
            const value = input.value.trim();

            if (value) {
                const newItems = value.split(',').map(s => s.trim()).filter(s => s);
                if (type === 'participants') {
                    participants = [...participants, ...newItems];
                } else {
                    results = [...results, ...newItems];
                }
                updateTags(type);
                input.value = '';
            }
        }

        document.getElementById('participants-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.isComposing) {
                processInput('participants');
            }
        });

        document.getElementById('results-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.isComposing) {
                processInput('results');
            }
        });

        function updateTags(type) {
            const container = document.getElementById(`${type}-tags`);
            const items = type === 'participants' ? participants : results;

            container.innerHTML = items.map((item, i) => `
                <div class="tag">
                    ${item}
                    <button onclick="removeTag('${type}', ${i})">×</button>
                </div>
            `).join('');
        }

        function removeTag(type, index) {
            if (type === 'participants') {
                participants.splice(index, 1);
                updateTags('participants');
            } else {
                results.splice(index, 1);
                updateTags('results');
            }
        }

        function generateLadder() {
            // Handle pending inputs
            const pInput = document.getElementById('participants-input');
            const rInput = document.getElementById('results-input');

            if (pInput.value.trim()) {
                const newItems = pInput.value.trim().split(',').map(s => s.trim()).filter(s => s);
                participants = [...participants, ...newItems];
                updateTags('participants');
                pInput.value = '';
            }

            if (rInput.value.trim()) {
                const newItems = rInput.value.trim().split(',').map(s => s.trim()).filter(s => s);
                results = [...results, ...newItems];
                updateTags('results');
                rInput.value = '';
            }

            if (participants.length < 2 || results.length < 2) {
                gameAlert('참가자와 결과를 각각 2개 이상 입력해주세요!');
                return;
            }

            if (participants.length !== results.length) {
                gameAlert('참가자와 결과의 개수가 같아야 합니다!');
                return;
            }

            document.getElementById('input-section').style.display = 'none';
            document.getElementById('ladder-container').classList.add('active');

            createLadder();
            drawLadder();
        }

        function createLadder() {
            const numLines = participants.length;
            const numLevels = Math.floor(Math.random() * 5) + 8; // 8-12 levels

            ladderData = Array(numLevels).fill(null).map(() => Array(numLines - 1).fill(false));
            completedPaths = []; // Reset paths

            // Randomly add horizontal bars
            for (let level = 0; level < numLevels; level++) {
                let lastBar = -2;
                for (let line = 0; line < numLines - 1; line++) {
                    if (line > lastBar + 1 && Math.random() < 0.4) {
                        ladderData[level][line] = true;
                        lastBar = line;
                    }
                }
            }

            // Create start positions
            const startContainer = document.getElementById('start-positions');
            startContainer.innerHTML = participants.map((p, i) => `
                <button class="position-btn" onclick="startAnimation(${i})">${p}</button>
            `).join('');

            // Create end positions
            const endContainer = document.getElementById('end-positions');
            endContainer.innerHTML = results.map(r => `
                <div class="position-btn">${r}</div>
            `).join('');
        }

        function drawLadder() {
            const canvas = document.getElementById('ladder-canvas');
            const ctx = canvas.getContext('2d');
            const dpr = window.devicePixelRatio || 1;

            canvas.width = canvas.offsetWidth * dpr;
            canvas.height = canvas.offsetHeight * dpr;
            ctx.scale(dpr, dpr);

            const width = canvas.offsetWidth;
            const height = canvas.offsetHeight;
            const numLines = participants.length;
            const numLevels = ladderData.length;

            const spacing = width / (numLines + 1);
            const levelHeight = height / (numLevels + 1);

            ctx.clearRect(0, 0, width, height);

            // Draw completed paths first (so they are behind the main lines if we want, or on top. Let's draw on top of grid but below active)
            // Actually, let's draw grid first.
            ctx.strokeStyle = '#6366f1';
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            // Draw vertical lines
            ctx.beginPath();
            for (let i = 0; i < numLines; i++) {
                ctx.moveTo(spacing * (i + 1), 20);
                ctx.lineTo(spacing * (i + 1), height - 20);
            }
            ctx.stroke();

            // Draw horizontal bars
            ctx.strokeStyle = '#8b5cf6';
            ctx.beginPath();
            for (let level = 0; level < numLevels; level++) {
                for (let line = 0; line < numLines - 1; line++) {
                    if (ladderData[level][line]) {
                        const y = levelHeight * (level + 1);
                        ctx.moveTo(spacing * (line + 1), y);
                        ctx.lineTo(spacing * (line + 2), y);
                    }
                }
            }
            ctx.stroke();

            // Draw completed paths
            completedPaths.forEach(item => {
                ctx.strokeStyle = item.color;
                ctx.lineWidth = 4;
                ctx.beginPath();
                if (item.path.length > 0) {
                    ctx.moveTo(item.path[0].x, item.path[0].y);
                    for (let i = 1; i < item.path.length; i++) {
                        ctx.lineTo(item.path[i].x, item.path[i].y);
                    }
                }
                ctx.stroke();
            });
        }

        function calculatePath(startIndex) {
            const canvas = document.getElementById('ladder-canvas');
            const width = canvas.offsetWidth;
            const height = canvas.offsetHeight;
            const numLines = participants.length;
            const numLevels = ladderData.length;

            const spacing = width / (numLines + 1);
            const levelHeight = height / (numLevels + 1);

            let currentLine = startIndex;
            let path = [];

            // Start point
            path.push({
                x: spacing * (currentLine + 1),
                y: 20
            });

            for (let level = 0; level < numLevels; level++) {
                const y = levelHeight * (level + 1);

                // Move down to this level
                path.push({
                    x: spacing * (currentLine + 1),
                    y: y
                });

                // Check for horizontal bar
                if (currentLine > 0 && ladderData[level][currentLine - 1]) {
                    // Move left
                    currentLine--;
                    path.push({
                        x: spacing * (currentLine + 1),
                        y: y
                    });
                } else if (currentLine < numLines - 1 && ladderData[level][currentLine]) {
                    // Move right
                    currentLine++;
                    path.push({
                        x: spacing * (currentLine + 1),
                        y: y
                    });
                }
            }

            // Move to bottom
            path.push({
                x: spacing * (currentLine + 1),
                y: height - 20
            });

            return {
                path,
                finalIndex: currentLine
            };
        }

        function startAnimation(startIndex) {
            if (animating) return;

            // Check if already completed
            if (completedPaths.some(p => p.startIndex === startIndex)) {
                // Just show result if already done
                const existing = completedPaths.find(p => p.startIndex === startIndex);
                showResult(existing.finalIndex);
                return;
            }

            animating = true;

            // Highlight selected start
            document.querySelectorAll('#start-positions .position-btn').forEach((btn, i) => {
                btn.classList.toggle('selected', i === startIndex);
            });

            // Clear previous results display (but keep paths)
            document.querySelectorAll('#end-positions .position-btn').forEach(btn => {
                btn.classList.remove('selected');
            });
            document.getElementById('result-display').classList.remove('show');

            const {
                path,
                finalIndex
            } = calculatePath(startIndex);

            const color = colors[startIndex % colors.length];
            const canvas = document.getElementById('ladder-canvas');
            const ctx = canvas.getContext('2d');

            let currentPointIndex = 0;
            let progress = 0;
            const speed = 8; // Faster speed

            const animate = () => {
                drawLadder(); // Redraws grid + completed paths

                // Draw current animating path
                ctx.strokeStyle = color;
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(path[0].x, path[0].y);

                // Draw full segments
                for (let i = 0; i < currentPointIndex; i++) {
                    ctx.lineTo(path[i + 1].x, path[i + 1].y);
                }

                const p1 = path[currentPointIndex];
                const p2 = path[currentPointIndex + 1];

                const dx = p2.x - p1.x;
                const dy = p2.y - p1.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                progress += speed;

                let currentX, currentY;

                if (progress >= distance) {
                    currentPointIndex++;
                    progress = 0; // Reset progress for next segment

                    if (currentPointIndex >= path.length - 1) {
                        // Finished
                        currentX = path[path.length - 1].x;
                        currentY = path[path.length - 1].y;

                        // Add to completed paths
                        completedPaths.push({ path, color, startIndex, finalIndex });
                        drawLadder(); // Final redraw

                        // Draw final dot
                        ctx.fillStyle = color;
                        ctx.beginPath();
                        ctx.arc(currentX, currentY, 8, 0, Math.PI * 2);
                        ctx.fill();

                        showResult(finalIndex);
                        animating = false;
                        return;
                    }
                    currentX = p2.x;
                    currentY = p2.y;
                } else {
                    const ratio = progress / distance;
                    currentX = p1.x + dx * ratio;
                    currentY = p1.y + dy * ratio;
                }

                // Draw current partial segment
                ctx.lineTo(currentX, currentY);
                ctx.stroke();

                // Draw head dot
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(currentX, currentY, 8, 0, Math.PI * 2);
                ctx.fill();

                requestAnimationFrame(animate);
            };

            animate();
        }

        function showResult(finalIndex) {
            document.querySelectorAll('#end-positions .position-btn').forEach((btn, i) => {
                btn.classList.toggle('selected', i === finalIndex);
            });

            const resultDisplay = document.getElementById('result-display');
            const resultValue = document.getElementById('result-value');
            resultValue.textContent = results[finalIndex];
            resultDisplay.classList.add('show');
        }

        function showAllResults() {
            if (animating) return;

            // Clear existing completed paths to avoid duplicates if re-running (though logic below handles it)
            // actually, let's just complete any that aren't done.

            participants.forEach((_, i) => {
                if (!completedPaths.some(p => p.startIndex === i)) {
                    const { path, finalIndex } = calculatePath(i);
                    const color = colors[i % colors.length];
                    completedPaths.push({ path, color, startIndex: i, finalIndex });
                }
            });

            drawLadder();

            // Show all results in a list or just highlight everything?
            // Let's show a summary alert or modal, or just let the user see the visual paths.
            // The user asked to "see all results". Visual paths might be messy if too many.
            // Let's append a result list to the result display.

            const resultDisplay = document.getElementById('result-display');
            const resultValue = document.getElementById('result-value');

            let summaryHtml = '<div style="display: flex; flex-direction: column; gap: 0.5rem; margin-top: 1rem; text-align: left;">';
            completedPaths.sort((a, b) => a.startIndex - b.startIndex).forEach(p => {
                summaryHtml += `
                    <div style="display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 0.25rem;">
                        <span style="color: ${p.color}">${participants[p.startIndex]}</span>
                        <span>→</span>
                        <span style="font-weight: bold;">${results[p.finalIndex]}</span>
                    </div>
                `;
            });
            summaryHtml += '</div>';

            resultValue.innerHTML = "전체 결과 확인" + summaryHtml;
            resultDisplay.classList.add('show');
        }

        function resetLadder() {
            document.getElementById('input-section').style.display = 'block';
            document.getElementById('ladder-container').classList.remove('active');
            document.getElementById('result-display').classList.remove('show');
            animating = false;
        }
    </script>
    <script type="application/json" id="game-rules">
{
 "title": "사다리 타기",
 "goal": "사다리를 타고 무작위로 결과를 배정하세요.",
 "steps": [
  "참가자 이름을 줄바꿈이나 쉼표로 구분해 입력합니다.",
  "각 줄에 해당하는 결과(당첨, 벌칙 등)를 적습니다.",
  "사다리 만들기를 누르면 무작위 가로줄이 생깁니다.",
  "이름을 누르면 경로를 따라가며 결과가 공개됩니다."
 ],
 "tips": [
  "결과를 먼저 가려 두면 긴장감이 살아납니다."
 ],
 "players": "2~30인",
 "time": "약 1분"
}
</script>
</body>
