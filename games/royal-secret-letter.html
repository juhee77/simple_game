<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>왕궁의 밀서 - Royal Secret Letter</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>

    <style>
        :root {
            --bg-color: #1a120b;
            --panel-bg: #3c2a21;
            --text-main: #e5e5cb;
            --text-muted: #d5cea3;
            --accent: #d4af37; /* Gold */
            --danger: #9a0000;
            --border-radius: 8px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; overflow-y: auto; }

        /* Header */
        header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.3); border-bottom: 1px solid var(--panel-bg); }
        h1 { font-family: 'Playfair Display', serif; font-size: 1.5rem; color: var(--accent); }
        .header-actions { display: flex; gap: 10px; }
        .icon-btn { background: var(--panel-bg); border: none; color: var(--text-main); width: 36px; height: 36px; border-radius: 50%; cursor: pointer; transition: 0.2s; }
        .icon-btn:hover { background: var(--accent); color: var(--bg-color); }

        /* Game Layout */
        .game-container { flex: 1; display: flex; flex-direction: column; padding: 20px; position: relative; }
        
        /* Board */
        .board { flex: 1; display: flex; flex-direction: column; gap: 20px; align-items: center; justify-content: center; }
        
        /* Opponent Discards */
        .discard-row { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; min-height: 80px; width: 100%; max-width: 600px; padding: 10px; background: rgba(255,255,255,0.05); border-radius: 8px; }
        .mini-card { width: 40px; height: 60px; background: #fff; color: #000; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.8rem; box-shadow: 2px 2px 5px rgba(0,0,0,0.5); }

        /* Deck & Center */
        .deck-area { display: flex; gap: 40px; align-items: center; }
        .deck-card { width: 100px; height: 140px; background: repeating-linear-gradient(45deg, #3c2a21, #3c2a21 10px, #1a120b 10px, #1a120b 20px); border: 4px solid var(--accent); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: var(--accent); box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .deck-count { font-size: 1.2rem; font-weight: 800; margin-top: 10px; text-align: center; }

        /* Hand Area */
        .hand-area { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 20px; padding-top: 20px; }
        .hand-cards { display: flex; gap: 15px; }
        .card { width: 120px; height: 180px; background: #fff; color: #000; border-radius: 10px; padding: 10px; display: flex; flex-direction: column; cursor: pointer; transition: 0.3s; box-shadow: 0 10px 20px rgba(0,0,0,0.3); position: relative; }
        .card:hover { transform: translateY(-20px); }
        .card.active { border: 4px solid var(--accent); box-shadow: 0 0 20px var(--accent); }
        .card-val { font-size: 1.5rem; font-weight: 800; }
        .card-name { font-weight: 800; font-size: 0.9rem; text-align: center; margin-top: 5px; border-bottom: 1px solid #ddd; padding-bottom: 5px; }
        .card-effect { font-size: 0.7rem; margin-top: 10px; line-height: 1.3; }
        .card-icon { font-size: 2rem; text-align: center; margin-top: auto; }

        /* Log */
        .game-log { position: absolute; top: 20px; right: 20px; width: 250px; height: 150px; background: rgba(0,0,0,0.5); border-radius: 8px; padding: 10px; overflow-y: auto; font-size: 0.8rem; border: 1px solid var(--panel-bg); }
        .log-entry { margin-bottom: 5px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 2px; }

        /* Overlays */
        .overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.9); z-index: 1000; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .overlay.active { display: flex; }
        .pass-device h2 { font-size: 2.5rem; color: var(--accent); margin-bottom: 20px; }
        .btn-main { background: var(--accent); color: var(--bg-color); border: none; padding: 15px 40px; font-weight: 800; font-size: 1.2rem; cursor: pointer; border-radius: 4px; }

        /* Selection UI */
        .selection-panel { position: fixed; bottom: 200px; left: 50%; transform: translateX(-50%); background: var(--panel-bg); padding: 20px; border-radius: 8px; border: 2px solid var(--accent); display: none; flex-direction: column; gap: 10px; z-index: 500; }
        .selection-panel.active { display: flex; }
        .guess-btn { background: #fff; border: none; padding: 5px 10px; cursor: pointer; border-radius: 4px; font-weight: 800; }
        .guess-btn:hover { background: var(--accent); }

        .hidden-hand { filter: blur(20px); pointer-events: none; }
        .player-label { font-size: 1.2rem; font-weight: 800; color: var(--accent); margin-bottom: 10px; }

        /* Card Variations */
        .card[data-val="1"] { border-left: 8px solid #666; }
        .card[data-val="2"] { border-left: 8px solid #3498db; }
        .card[data-val="3"] { border-left: 8px solid #e67e22; }
        .card[data-val="4"] { border-left: 8px solid #1abc9c; }
        .card[data-val="5"] { border-left: 8px solid #9b59b6; }
        .card[data-val="6"] { border-left: 8px solid #e74c3c; }
        .card[data-val="7"] { border-left: 8px solid #f1c40f; }
        .card[data-val="8"] { border-left: 8px solid #e91e63; }

        @media (max-width: 600px) {
            header h1 { font-size: 1.2rem; }
            .game-log { width: 150px; height: 100px; font-size: 0.7rem; top: 10px; right: 10px; }
            .deck-card { width: 70px; height: 100px; font-size: 1.5rem; }
            .hand-cards { gap: 8px; }
            .card { width: 90px; height: 135px; padding: 8px; }
            .card-val { font-size: 1.2rem; }
            .card-name { font-size: 0.75rem; }
            .card-effect { font-size: 0.6rem; }
            .card-icon { font-size: 1.5rem; }
            .btn-main { padding: 10px 25px; font-size: 1rem; }
            .pass-device h2 { font-size: 1.8rem; }
            .selection-panel { bottom: 160px; padding: 15px; }
            .mini-card { width: 30px; height: 45px; font-size: 0.7rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Royal Secret Letter</h1>
        <div class="header-actions">
            <button class="icon-btn" onclick="openGDD()" title="기획서 보기"><i class="ri-book-read-line"></i></button>
            <button class="icon-btn" onclick="resetGame()" title="게임 재시작"><i class="ri-refresh-line"></i></button>
            <button class="icon-btn" onclick="location.href='../index.html'" title="로비로 돌아가기"><i class="ri-home-4-line"></i></button>
        </div>
    </header>

    <div class="game-container">
        <div class="game-log" id="game-log"></div>

        <div class="board">
            <div style="width: 100%; text-align: center; color: var(--text-muted); font-size: 0.8rem;" id="top-discard-label">상대방 버린 패</div>
            <div class="discard-row" id="top-discards"></div>
            
            <div class="deck-area">
                <div class="deck-box">
                    <div class="deck-card">✉️</div>
                    <div class="deck-count" id="deck-count">16</div>
                </div>
            </div>

            <div style="width: 100%; text-align: center; color: var(--text-muted); font-size: 0.8rem;" id="bottom-discard-label">내 버린 패</div>
            <div class="discard-row" id="bottom-discards"></div>
        </div>

        <div class="hand-area">
            <div class="player-label" id="player-turn-label">P1's Turn</div>
            <div class="hand-cards" id="hand-container"></div>
            <button class="btn-main" id="btn-play-action" style="display:none;">카드 사용</button>
            <button class="btn-main" id="btn-show-hand" onclick="revealHand()">카드 보기</button>
        </div>
    </div>

    <!-- Selection Panel for Guard -->
    <div class="selection-panel" id="guard-panel">
        <p>상대방의 카드를 맞춰보세요 (경비병 제외)</p>
        <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap: 5px;">
            <button class="guess-btn" onclick="handleGuardGuess(2)">2</button>
            <button class="guess-btn" onclick="handleGuardGuess(3)">3</button>
            <button class="guess-btn" onclick="handleGuardGuess(4)">4</button>
            <button class="guess-btn" onclick="handleGuess(5)">5</button>
            <button class="guess-btn" onclick="handleGuess(6)">6</button>
            <button class="guess-btn" onclick="handleGuess(7)">7</button>
            <button class="guess-btn" onclick="handleGuess(8)">8</button>
        </div>
    </div>

    <!-- Overlay -->
    <div class="overlay" id="overlay">
        <div class="pass-device" id="pass-content">
            <h2 id="overlay-msg">기기를 넘겨주세요</h2>
            <button class="btn-main" onclick="nextTurnStart()">시작</button>
        </div>
    </div>

    <div class="overlay" id="gdd-modal" style="background: rgba(0,0,0,0.8);">
        <div class="modal-content" style="background: var(--panel-bg); color: var(--text-main);">
            <button class="close-modal" onclick="closeGDD()"><i class="ri-close-line"></i></button>
            <div class="markdown-body" id="gdd-content">불러오는 중...</div>
        </div>
    </div>

    <script>
        const CARDS_DB = [
            { val: 1, name: "경비병", count: 5, icon: "🛡️", effect: "상대의 카드를 추측. 맞으면 상대 탈락." },
            { val: 2, name: "신부", count: 2, icon: "⛪", effect: "상대의 손패를 확인." },
            { val: 3, name: "남작", count: 2, icon: "⚖️", effect: "상대와 카드 비교. 낮은 쪽 탈락." },
            { val: 4, name: "시녀", count: 2, icon: "👗", effect: "다음 턴까지 공격 무효." },
            { val: 5, name: "왕자", count: 2, icon: "👑", effect: "상대가 카드를 버리고 새로 뽑게 함." },
            { val: 6, name: "왕", count: 1, icon: "🏰", effect: "상대와 손패 교환." },
            { val: 7, name: "백작부인", count: 1, icon: "💎", effect: "왕/왕자와 함께 있으면 버려야 함." },
            { val: 8, name: "공주", count: 1, icon: "👰", effect: "버려지면 즉시 패배." }
        ];

        let deck = [];
        let players = [
            { id: 0, hand: [], discards: [], protected: false },
            { id: 1, hand: [], discards: [], protected: false }
        ];
        let turn = 0; // 0 or 1
        let gameOver = false;

        function resetGame() {
            deck = [];
            CARDS_DB.forEach(c => {
                for(let i=0; i<c.count; i++) deck.push({...c});
            });
            shuffle(deck);
            deck.pop(); // Remove one card for secrecy

            players = [
                { id: 0, hand: [deck.pop()], discards: [], protected: false },
                { id: 1, hand: [deck.pop()], discards: [], protected: false }
            ];

            turn = 0;
            gameOver = false;
            document.getElementById('game-log').innerHTML = '';
            addLog("게임 시작! P1 턴입니다.");
            document.getElementById('overlay').classList.remove('active');
            updateUI();
            drawPhase();
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function drawPhase() {
            if (deck.length === 0) {
                compareFinalHands();
                return;
            }
            players[turn].hand.push(deck.pop());
            players[turn].protected = false; // Reset protection
            updateUI();
            hideHand();
        }

        function revealHand() {
            document.getElementById('hand-container').classList.remove('hidden-hand');
            document.getElementById('btn-show-hand').style.display = 'none';
        }

        function hideHand() {
            document.getElementById('hand-container').classList.add('hidden-hand');
            document.getElementById('btn-show-hand').style.display = 'block';
        }

        function updateUI() {
            document.getElementById('deck-count').innerText = deck.length;
            document.getElementById('player-turn-label').innerText = `P${turn + 1}'s Turn`;
            
            const handCont = document.getElementById('hand-container');
            handCont.innerHTML = '';
            players[turn].hand.forEach((card, idx) => {
                const el = document.createElement('div');
                el.className = 'card';
                el.dataset.val = card.val;
                el.innerHTML = `
                    <div class="card-val">${card.val}</div>
                    <div class="card-name">${card.name}</div>
                    <div class="card-effect">${card.effect}</div>
                    <div class="card-icon">${card.icon}</div>
                `;
                el.onclick = () => playCard(idx);
                handCont.appendChild(el);
            });
            const opp = turn === 0 ? 1 : 0;

            document.getElementById('top-discard-label').innerText = `P${opp + 1} (상대) 버린 패`;
            const topDiscCont = document.getElementById('top-discards');
            topDiscCont.innerHTML = '';
            players[opp].discards.forEach(card => {
                const el = document.createElement('div');
                el.className = 'mini-card';
                el.innerText = card.val;
                el.title = card.name;
                topDiscCont.appendChild(el);
            });

            document.getElementById('bottom-discard-label').innerText = `P${turn + 1} (나) 버린 패`;
            const bottomDiscCont = document.getElementById('bottom-discards');
            bottomDiscCont.innerHTML = '';
            players[turn].discards.forEach(card => {
                const el = document.createElement('div');
                el.className = 'mini-card';
                el.innerText = card.val;
                el.title = card.name;
                bottomDiscCont.appendChild(el);
            });
        }

        function playCard(idx) {
            if (gameOver) return;
            const p = players[turn];
            const opp = players[turn === 0 ? 1 : 0];
            const card = p.hand.splice(idx, 1)[0];
            p.discards.push(card);
            
            addLog(`P${turn + 1}이(가) ${card.name}(${card.val})을 사용했습니다.`);

            // Countess rule
            if (card.val === 7) { /* No action */ }
            
            // Check if countess must be played
            const other = p.hand[0];
            if ((other.val === 5 || other.val === 6) && card.val !== 7 && p.hand.find(c => c.val === 7)) {
                alert("백작부인 카드는 왕이나 왕자가 손에 있으면 반드시 먼저 내야 합니다!");
                p.hand.push(card);
                p.discards.pop();
                return;
            }

            executeEffect(card);
        }

        function executeEffect(card) {
            const p = players[turn];
            const opp = players[turn === 0 ? 1 : 0];

            switch(card.val) {
                case 1: // Guard
                    if (opp.protected) { addLog("상대가 시녀의 보호를 받고 있습니다."); endTurn(); }
                    else showGuardPanel();
                    break;
                case 2: // Priest
                    if (opp.protected) addLog("상대가 보호받고 있어 패를 볼 수 없습니다.");
                    else alert(`상대의 손패는 [${opp.hand[0].name}(${opp.hand[0].val})] 입니다.`);
                    endTurn();
                    break;
                case 3: // Baron
                    if (opp.protected) { addLog("상대가 보호받고 있습니다."); endTurn(); }
                    else {
                        alert(`비교! 내 패: ${p.hand[0].val} vs 상대 패: ${opp.hand[0].val}`);
                        if (p.hand[0].val > opp.hand[0].val) win(turn);
                        else if (p.hand[0].val < opp.hand[0].val) win(turn === 0 ? 1 : 0);
                        else { addLog("무승부입니다."); endTurn(); }
                    }
                    break;
                case 4: // Maid
                    p.protected = true;
                    addLog("P" + (turn+1) + "이(가) 다음 턴까지 보호받습니다.");
                    endTurn();
                    break;
                case 5: // Prince
                    if (opp.protected) {
                        addLog("상대가 보호받고 있어 자신에게 효과를 적용합니다.");
                        princeEffect(p);
                    } else {
                        princeEffect(opp);
                    }
                    endTurn();
                    break;
                case 6: // King
                    if (opp.protected) { addLog("보호 중이라 교환 실패."); }
                    else {
                        const temp = p.hand[0];
                        p.hand[0] = opp.hand[0];
                        opp.hand[0] = temp;
                        addLog("서로의 손패를 교환했습니다.");
                    }
                    endTurn();
                    break;
                case 8: // Princess
                    addLog("공주가 버려졌습니다!");
                    win(turn === 0 ? 1 : 0);
                    break;
                default:
                    endTurn();
            }
        }

        function princeEffect(target) {
            const discarded = target.hand.pop();
            target.discards.push(discarded);
            addLog(`P${target.id+1}이(가) ${discarded.name}을(를) 버렸습니다.`);
            if (discarded.val === 8) { win(target.id === 0 ? 1 : 0); return; }
            if (deck.length > 0) target.hand.push(deck.pop());
            else { /* No cards to draw */ }
        }

        function showGuardPanel() {
            document.getElementById('guard-panel').classList.add('active');
        }

        function handleGuardGuess(val) {
            document.getElementById('guard-panel').classList.remove('active');
            const opp = players[turn === 0 ? 1 : 0];
            if (opp.hand[0].val === val) {
                addLog(`정답! 상대의 패는 ${val}이었습니다.`);
                win(turn);
            } else {
                addLog(`땡! 상대의 패는 ${val}이 아니었습니다.`);
                endTurn();
            }
        }

        function endTurn() {
            if (gameOver) return;
            turn = turn === 0 ? 1 : 0;
            showPassOverlay();
        }

        function showPassOverlay() {
            document.getElementById('overlay-msg').innerText = `기기를 P${turn + 1} 에게 넘겨주세요`;
            document.getElementById('overlay').classList.add('active');
        }

        function nextTurnStart() {
            document.getElementById('overlay').classList.remove('active');
            drawPhase();
        }

        function win(id) {
            gameOver = true;
            document.getElementById('overlay-msg').innerText = `P${id + 1} 승리!`;
            document.getElementById('overlay').classList.add('active');
            document.getElementById('pass-content').innerHTML = `
                <h2 style="color:var(--accent)">P${id+1} 최종 승리!</h2>
                <p style="margin-bottom:20px;">왕궁에 밀서를 전달하는 데 성공했습니다.</p>
                <button class="btn-main" onclick="resetGame()">다시 플레이</button>
            `;
        }

        function compareFinalHands() {
            const v0 = players[0].hand[0].val;
            const v1 = players[1].hand[0].val;
            addLog(`덱 소진! 점수 비교: P1(${v0}) vs P2(${v1})`);
            if (v0 > v1) win(0);
            else if (v1 > v0) win(1);
            else {
                // Sum of discards
                const s0 = players[0].discards.reduce((a, b) => a + b.val, 0);
                const s1 = players[1].discards.reduce((a, b) => a + b.val, 0);
                if (s0 >= s1) win(0); else win(1);
            }
        }

        function addLog(msg) {
            const log = document.getElementById('game-log');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerText = msg;
            log.prepend(entry);
        }

        async function openGDD() {
            const modal = document.getElementById('gdd-modal');
            const content = document.getElementById('gdd-content');
            modal.classList.add('active');
            try {
                const response = await fetch('./docs/royal-secret-letter-gdd.md');
                if (response.ok) content.innerHTML = marked.parse(await response.text());
                else content.innerHTML = '<p>실패</p>';
            } catch (e) { content.innerHTML = '<p>오류</p>'; }
        }
        function closeGDD() { document.getElementById('gdd-modal').classList.remove('active'); }

        window.onload = resetGame;
    </script>
<script src="../scripts/game-common.js?v=2"></script>
</body>
</html>
