<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>네온 타워 디펜스 - 미니게임 천국</title>
    <script src="../scripts/game-common.js?v=b7c7301f"></script>
    <link rel="stylesheet" href="../styles/game-common.css?v=bed20c1e">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b1120;
            --panel: rgba(255, 255, 255, .05);
            --border: rgba(255, 255, 255, .14);
            --text: #f8fafc;
            --muted: #94a3b8;
            --path: #1e293b;
            --grass: #0f1a2e;
            --gold: #fbbf24;
            --hp: #f87171;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            font-family: 'Outfit', system-ui, sans-serif;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 16px 40px;
            touch-action: manipulation;
        }

        .back { position: absolute; top: 20px; left: 20px; z-index: 10; }

        h1 {
            font-size: 1.7rem;
            margin: 44px 0 4px;
            background: linear-gradient(135deg, #38bdf8, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sub { color: var(--muted); font-size: .88rem; margin-bottom: 14px; text-align: center; }

        .hud {
            display: flex;
            gap: 16px;
            padding: 10px 18px;
            margin-bottom: 12px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
        }

        .hud div { text-align: center; min-width: 52px; }
        .hud .label { display: block; font-size: .66rem; color: var(--muted); }
        .hud .value { font-size: 1.1rem; font-weight: 800; }
        #hud-gold { color: var(--gold); }
        #hud-life { color: var(--hp); }

        canvas {
            border: 1px solid var(--border);
            border-radius: 16px;
            background: var(--grass);
            touch-action: none;
            max-width: 100%;
            height: auto;
            cursor: pointer;
        }

        .shop { display: flex; gap: 8px; margin: 14px 0 10px; flex-wrap: wrap; justify-content: center; }

        .tower-btn {
            padding: 10px 14px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: var(--panel);
            color: var(--text);
            font-family: inherit;
            font-size: .82rem;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            line-height: 1.4;
        }

        .tower-btn.active { border-color: #38bdf8; background: rgba(56, 189, 248, .16); }
        .tower-btn:disabled { opacity: .38; cursor: default; }
        .tower-btn .cost { display: block; font-size: .72rem; color: var(--gold); }

        .actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 8px; }

        .btn {
            border: none;
            border-radius: 999px;
            padding: 12px 24px;
            background: linear-gradient(135deg, #38bdf8, #a78bfa);
            color: #06121f;
            font-family: inherit;
            font-size: .95rem;
            font-weight: 800;
            cursor: pointer;
        }

        .btn.ghost { background: var(--panel); color: var(--text); border: 1px solid var(--border); }
        .btn:disabled { opacity: .4; cursor: default; }

        .msg { margin-top: 12px; min-height: 24px; font-weight: 700; text-align: center; }
        .msg.good { color: #4ade80; }
        .msg.warn { color: var(--gold); }
        .msg.bad { color: var(--hp); }

        .hint { color: var(--muted); font-size: .78rem; margin-top: 8px; text-align: center; max-width: 420px; }
    </style>
</head>

<body>
    <a href="../index.html" class="back back-button">← 메인</a>
    <h1>🗼 네온 타워 디펜스</h1>
    <p class="sub">길목에 포탑을 세워 침입자를 막아내세요</p>

    <div class="hud">
        <div><span class="label">웨이브</span><span class="value" id="hud-wave">0</span></div>
        <div><span class="label">골드</span><span class="value" id="hud-gold">0</span></div>
        <div><span class="label">생명</span><span class="value" id="hud-life">0</span></div>
        <div><span class="label">최고 웨이브</span><span class="value" id="hud-best">-</span></div>
    </div>

    <canvas id="board" width="480" height="400"></canvas>

    <div class="shop" id="shop"></div>

    <div class="actions">
        <button class="btn" id="wave-btn" onclick="startWave()">웨이브 시작</button>
        <button class="btn ghost" onclick="resetGame()">새 게임</button>
    </div>

    <p class="msg" id="msg"></p>
    <p class="hint">포탑을 고른 뒤 길이 아닌 빈 땅을 누르면 설치됩니다. 설치된 포탑을 다시 누르면 강화할 수 있습니다.</p>

    <script type="application/json" id="game-rules">
{
 "title": "네온 타워 디펜스",
 "players": "1인",
 "time": "약 20분",
 "goal": "포탑을 세워 침입자가 길 끝에 닿지 못하게 막으세요.",
 "steps": [
  "아래에서 포탑을 고르고, 길이 아닌 빈 땅을 눌러 설치합니다. 설치에는 골드가 듭니다.",
  "웨이브 시작을 누르면 침입자가 길을 따라 들어옵니다.",
  "포탑은 사거리 안에 들어온 적을 자동으로 공격합니다.",
  "적을 처치하면 골드를 얻고, 웨이브를 넘기면 보너스 골드가 들어옵니다.",
  "적이 끝에 닿을 때마다 생명이 줄고, 0이 되면 게임이 끝납니다."
 ],
 "tips": [
  "곡선 구간 안쪽에 세우면 사거리 안에 길이 여러 번 걸쳐 훨씬 효율적입니다.",
  "설치된 포탑을 다시 누르면 강화됩니다. 새 포탑을 늘리는 것보다 나을 때가 많습니다.",
  "감속 포탑은 피해는 낮지만 다른 포탑의 공격 시간을 벌어 줍니다.",
  "도달한 최고 웨이브가 저장됩니다."
 ]
}
</script>

    <script>
        const canvas = document.getElementById('board');
        const ctx = canvas.getContext('2d');
        const CELL = 40;
        const COLS = 12, ROWS = 10;
        const BEST_KEY = 'tower-defense-best-wave';

        // 길은 격자 좌표의 꺾은선. 적은 이 점들을 차례로 지나간다.
        const WAYPOINTS = [
            [-1, 1], [3, 1], [3, 4], [7, 4], [7, 2], [10, 2],
            [10, 7], [5, 7], [5, 5], [1, 5], [1, 8], [12, 8]
        ];

        const TOWER_TYPES = {
            arrow: { name: '화살탑', cost: 50, range: 2.4, damage: 9, cooldown: 0.55, color: '#38bdf8', slow: 0 },
            cannon: { name: '포탄탑', cost: 90, range: 1.9, damage: 26, cooldown: 1.5, color: '#fb923c', slow: 0, splash: 0.9 },
            frost: { name: '감속탑', cost: 70, range: 2.1, damage: 4, cooldown: 0.8, color: '#a5b4fc', slow: 0.45 }
        };

        let pathCells = new Set();
        let towers = [];
        let enemies = [];
        let shots = [];
        let gold = 0, life = 0, wave = 0;
        let selected = 'arrow';
        let running = false;
        let spawnQueue = [];
        let spawnTimer = 0;
        let lastFrame = 0;
        let animId = null;
        let gameOver = false;

        const cellKey = (x, y) => `${x},${y}`;

        // 꺾은선이 지나는 칸을 모두 모아 둔다. 여기에는 포탑을 세울 수 없다.
        function buildPathCells() {
            pathCells = new Set();
            for (let i = 0; i < WAYPOINTS.length - 1; i++) {
                const [x1, y1] = WAYPOINTS[i];
                const [x2, y2] = WAYPOINTS[i + 1];
                const dx = Math.sign(x2 - x1), dy = Math.sign(y2 - y1);
                let x = x1, y = y1;
                pathCells.add(cellKey(x, y));
                while (x !== x2 || y !== y2) {
                    x += dx; y += dy;
                    pathCells.add(cellKey(x, y));
                }
            }
        }

        // ── 적 ────────────────────────────────────────────
        function makeEnemy(kind, waveNo) {
            const scale = 1 + (waveNo - 1) * 0.22;
            const base = {
                grunt: { hp: 32, speed: 1.5, gold: 8, color: '#f87171', radius: 9 },
                runner: { hp: 20, speed: 2.9, gold: 10, color: '#facc15', radius: 7 },
                tank: { hp: 110, speed: 0.85, gold: 22, color: '#c084fc', radius: 12 }
            }[kind];
            return {
                kind,
                x: WAYPOINTS[0][0], y: WAYPOINTS[0][1],
                leg: 0,
                hp: Math.round(base.hp * scale),
                maxHp: Math.round(base.hp * scale),
                speed: base.speed,
                slowUntil: 0,
                slowFactor: 1,
                gold: base.gold,
                color: base.color,
                radius: base.radius
            };
        }

        function buildWave(n) {
            const q = [];
            const grunts = 4 + n * 2;
            for (let i = 0; i < grunts; i++) q.push('grunt');
            if (n >= 2) for (let i = 0; i < Math.floor(n * 1.2); i++) q.push('runner');
            if (n >= 4) for (let i = 0; i < Math.floor((n - 2) / 2); i++) q.push('tank');
            // 등장 순서를 섞어 매 웨이브 패턴이 달라지게 한다.
            for (let i = q.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [q[i], q[j]] = [q[j], q[i]];
            }
            return q;
        }

        // ── 진행 ──────────────────────────────────────────
        function resetGame() {
            cancelAnimationFrame(animId);
            buildPathCells();
            towers = []; enemies = []; shots = [];
            gold = 150; life = 20; wave = 0;
            running = false; gameOver = false;
            spawnQueue = []; spawnTimer = 0; lastFrame = 0;
            document.getElementById('wave-btn').disabled = false;
            document.getElementById('wave-btn').textContent = '웨이브 시작';
            setMessage('포탑을 설치하고 웨이브를 시작하세요.');
            renderShop();
            updateHud();
            draw();
        }

        function startWave() {
            if (running || gameOver) return;
            wave++;
            spawnQueue = buildWave(wave);
            spawnTimer = 0;
            running = true;
            lastFrame = performance.now();
            document.getElementById('wave-btn').disabled = true;
            setMessage(`웨이브 ${wave} 진행 중 — 적 ${spawnQueue.length}마리`);
            updateHud();
            animId = requestAnimationFrame(loop);
        }

        function endWave() {
            running = false;
            const bonus = 40 + wave * 12;
            gold += bonus;
            saveBestRecord(BEST_KEY, wave, false);
            document.getElementById('wave-btn').disabled = false;
            setMessage(`웨이브 ${wave} 방어 성공! 보너스 ${bonus} 골드`, 'good');
            renderShop();
            updateHud();
            draw();
        }

        function endGame() {
            running = false;
            gameOver = true;
            cancelAnimationFrame(animId);
            saveBestRecord(BEST_KEY, wave, false);
            document.getElementById('wave-btn').disabled = true;
            setMessage(`방어 실패! 웨이브 ${wave}까지 버텼습니다.`, 'bad');
            updateHud();
            draw();
        }

        function loop(now) {
            const dt = Math.min(0.05, (now - lastFrame) / 1000);
            lastFrame = now;
            update(dt, now / 1000);
            draw();
            if (running) animId = requestAnimationFrame(loop);
        }

        function update(dt, timeSec) {
            // 적 등장
            if (spawnQueue.length) {
                spawnTimer -= dt;
                if (spawnTimer <= 0) {
                    enemies.push(makeEnemy(spawnQueue.shift(), wave));
                    spawnTimer = Math.max(0.28, 0.9 - wave * 0.04);
                }
            }

            // 적 이동
            for (const e of enemies) {
                const factor = timeSec < e.slowUntil ? e.slowFactor : 1;
                let remain = e.speed * factor * dt;
                while (remain > 0 && e.leg < WAYPOINTS.length - 1) {
                    const [tx, ty] = WAYPOINTS[e.leg + 1];
                    const dx = tx - e.x, dy = ty - e.y;
                    const dist = Math.hypot(dx, dy);
                    if (dist <= remain) {
                        e.x = tx; e.y = ty; e.leg++; remain -= dist;
                    } else {
                        e.x += (dx / dist) * remain; e.y += (dy / dist) * remain; remain = 0;
                    }
                }
                if (e.leg >= WAYPOINTS.length - 1) e.reached = true;
            }

            // 끝에 닿은 적은 생명을 깎는다
            const leaked = enemies.filter(e => e.reached).length;
            if (leaked) {
                life -= leaked;
                enemies = enemies.filter(e => !e.reached);
                updateHud();
                if (life <= 0) { life = 0; return endGame(); }
            }

            // 포탑 사격
            for (const t of towers) {
                t.cool -= dt;
                if (t.cool > 0) continue;
                const spec = TOWER_TYPES[t.type];
                const range = spec.range + (t.level - 1) * 0.35;
                // 가장 앞선(진행이 많이 된) 적을 우선 노린다.
                let target = null;
                for (const e of enemies) {
                    if (Math.hypot(e.x - t.x, e.y - t.y) > range) continue;
                    if (!target || e.leg > target.leg) target = e;
                }
                if (!target) continue;
                t.cool = spec.cooldown;
                const dmg = spec.damage * (1 + (t.level - 1) * 0.6);
                hit(target, dmg, spec, timeSec);
                shots.push({ x1: t.x, y1: t.y, x2: target.x, y2: target.y, life: 0.09, color: spec.color });
            }

            // 격추 처리
            const dead = enemies.filter(e => e.hp <= 0);
            if (dead.length) {
                gold += dead.reduce((s, e) => s + e.gold, 0);
                enemies = enemies.filter(e => e.hp > 0);
                renderShop();
                updateHud();
            }

            for (const s of shots) s.life -= dt;
            shots = shots.filter(s => s.life > 0);

            if (running && !spawnQueue.length && !enemies.length) endWave();
        }

        function hit(target, dmg, spec, timeSec) {
            target.hp -= dmg;
            if (spec.slow) {
                target.slowUntil = timeSec + 1.2;
                target.slowFactor = 1 - spec.slow;
            }
            if (spec.splash) {
                for (const e of enemies) {
                    if (e === target) continue;
                    if (Math.hypot(e.x - target.x, e.y - target.y) <= spec.splash) e.hp -= dmg * 0.5;
                }
            }
        }

        // ── 설치 ──────────────────────────────────────────
        function towerAt(cx, cy) {
            return towers.find(t => t.cx === cx && t.cy === cy);
        }

        function upgradeCost(t) {
            return Math.round(TOWER_TYPES[t.type].cost * 0.8 * t.level);
        }

        function handleClick(evt) {
            if (gameOver) return;
            const rect = canvas.getBoundingClientRect();
            const px = (evt.clientX - rect.left) * (canvas.width / rect.width);
            const py = (evt.clientY - rect.top) * (canvas.height / rect.height);
            const cx = Math.floor(px / CELL), cy = Math.floor(py / CELL);
            if (cx < 0 || cx >= COLS || cy < 0 || cy >= ROWS) return;

            const existing = towerAt(cx, cy);
            if (existing) {
                const cost = upgradeCost(existing);
                if (existing.level >= 3) return setMessage('이미 최대 레벨입니다.', 'warn');
                if (gold < cost) return setMessage(`강화에 ${cost} 골드가 필요합니다.`, 'warn');
                gold -= cost;
                existing.level++;
                setMessage(`${TOWER_TYPES[existing.type].name} 레벨 ${existing.level}로 강화!`, 'good');
                renderShop(); updateHud(); draw();
                return;
            }

            if (pathCells.has(cellKey(cx, cy))) return setMessage('길 위에는 세울 수 없습니다.', 'warn');

            const spec = TOWER_TYPES[selected];
            if (gold < spec.cost) return setMessage(`${spec.name} 설치에 ${spec.cost} 골드가 필요합니다.`, 'warn');
            gold -= spec.cost;
            towers.push({ type: selected, cx, cy, x: cx + 0.5, y: cy + 0.5, level: 1, cool: 0 });
            setMessage(`${spec.name} 설치 완료`);
            renderShop(); updateHud(); draw();
        }

        canvas.addEventListener('click', handleClick);

        function selectTower(type) {
            selected = type;
            renderShop();
        }

        function renderShop() {
            const shop = document.getElementById('shop');
            shop.innerHTML = '';
            for (const [type, spec] of Object.entries(TOWER_TYPES)) {
                const btn = document.createElement('button');
                btn.className = 'tower-btn' + (selected === type ? ' active' : '');
                btn.disabled = gold < spec.cost;
                btn.innerHTML = '';
                btn.append(spec.name);
                const cost = document.createElement('span');
                cost.className = 'cost';
                cost.textContent = `${spec.cost} 골드`;
                btn.appendChild(cost);
                btn.onclick = () => selectTower(type);
                shop.appendChild(btn);
            }
        }

        function updateHud() {
            document.getElementById('hud-wave').textContent = wave;
            document.getElementById('hud-gold').textContent = gold;
            document.getElementById('hud-life').textContent = life;
            const best = loadBestRecord(BEST_KEY);
            document.getElementById('hud-best').textContent = best === null ? '-' : best;
        }

        function setMessage(text, kind) {
            const el = document.getElementById('msg');
            el.textContent = text;
            el.className = 'msg' + (kind ? ' ' + kind : '');
        }

        // ── 그리기 ────────────────────────────────────────
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 바닥 격자
            ctx.fillStyle = '#0f1a2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = 'rgba(255,255,255,.04)';
            ctx.lineWidth = 1;
            for (let x = 0; x <= COLS; x++) {
                ctx.beginPath(); ctx.moveTo(x * CELL, 0); ctx.lineTo(x * CELL, ROWS * CELL); ctx.stroke();
            }
            for (let y = 0; y <= ROWS; y++) {
                ctx.beginPath(); ctx.moveTo(0, y * CELL); ctx.lineTo(COLS * CELL, y * CELL); ctx.stroke();
            }

            // 길
            ctx.fillStyle = '#1e293b';
            for (const k of pathCells) {
                const [x, y] = k.split(',').map(Number);
                ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
            }
            ctx.strokeStyle = 'rgba(56,189,248,.28)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            WAYPOINTS.forEach(([x, y], i) => {
                const px = (x + 0.5) * CELL, py = (y + 0.5) * CELL;
                i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
            });
            ctx.stroke();

            // 포탑
            for (const t of towers) {
                const spec = TOWER_TYPES[t.type];
                const px = t.x * CELL, py = t.y * CELL;
                ctx.fillStyle = spec.color;
                ctx.beginPath();
                ctx.arc(px, py, 12 + t.level * 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'rgba(0,0,0,.55)';
                ctx.font = 'bold 11px Outfit, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(String(t.level), px, py);
            }

            // 사격선
            for (const s of shots) {
                ctx.strokeStyle = s.color;
                ctx.lineWidth = 2;
                ctx.globalAlpha = Math.max(0, s.life / 0.09);
                ctx.beginPath();
                ctx.moveTo(s.x1 * CELL, s.y1 * CELL);
                ctx.lineTo(s.x2 * CELL, s.y2 * CELL);
                ctx.stroke();
                ctx.globalAlpha = 1;
            }

            // 적
            for (const e of enemies) {
                const px = (e.x + 0.5) * CELL, py = (e.y + 0.5) * CELL;
                ctx.fillStyle = e.color;
                ctx.beginPath();
                ctx.arc(px, py, e.radius, 0, Math.PI * 2);
                ctx.fill();
                // 체력 막대
                const w = e.radius * 2.2;
                ctx.fillStyle = 'rgba(0,0,0,.55)';
                ctx.fillRect(px - w / 2, py - e.radius - 8, w, 4);
                ctx.fillStyle = '#4ade80';
                ctx.fillRect(px - w / 2, py - e.radius - 8, w * Math.max(0, e.hp / e.maxHp), 4);
            }
        }

        resetGame();
    </script>
</body>

</html>
