<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>네온 4컷 사진관 | 미니게임 천국</title>
  <script src="../scripts/game-common.js?v=841f759d"></script>
  <link rel="stylesheet" href="../styles/game-common.css?v=e8b4cc4d">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root {
      --bg: #0b0b1a;
      --card-bg: rgba(22, 22, 45, 0.7);
      --card-border: rgba(255, 255, 255, 0.1);
      --cyan: #00d4ff;
      --purple: #7c3aed;
      --pink: #ff006e;
      --yellow: #ffd166;
      --green: #06d6a0;
      --text-main: #ffffff;
      --text-dim: #94a3b8;
      --radius-card: 16px;
      --radius-btn: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      padding: 0;   /* 공용 CSS의 body 패딩을 쓰지 않는다 */
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Outfit', 'Pretendard', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 10px 0;
    }

    .back-btn {
      position: absolute;
      left: 0;
      background: none;
      border: none;
      color: var(--cyan);
      font-size: 24px;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      transition: background 0.2s;
    }

    .back-btn:hover { background: rgba(0, 212, 255, 0.1); }

    h1 {
      font-size: 24px;
      font-weight: 800;
      background: linear-gradient(90deg, var(--cyan), var(--purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(10px);
      border-radius: var(--radius-card);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .video-container {
      width: 100%;
      height: 280px;
      background: #000;
      border-radius: var(--radius-card);
      overflow: hidden;
      position: relative;
      border: 2px solid var(--cyan);
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .countdown-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4);
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 80px;
      font-weight: 800;
      color: var(--yellow);
      text-shadow: 0 0 20px rgba(255, 209, 102, 0.8);
    }

    .cam-controls {
      display: flex;
      gap: 10px;
    }

    button {
      flex: 1;
      background: linear-gradient(135deg, var(--purple), var(--pink));
      border: none;
      color: white;
      padding: 14px;
      border-radius: var(--radius-btn);
      font-family: inherit;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-secondary {
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--card-border);
      color: white;
    }

    .section-label {
      font-size: 15px;
      font-weight: 700;
      color: var(--cyan);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .photo-thumb-wrap {
      position: relative;
    }

    .photo-thumb {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 8px;
      object-fit: cover;
      border: 2px solid transparent;
      cursor: pointer;
      background: #111;
    }

    .photo-thumb.selected {
      border-color: var(--cyan);
      box-shadow: 0 0 10px rgba(0, 212, 255, 0.6);
    }

    .badge-num {
      position: absolute;
      top: 4px; right: 4px;
      background: var(--cyan);
      color: black;
      width: 18px; height: 18px;
      border-radius: 50%;
      font-size: 11px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .frame-customizer {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 10px;
    }

    .option-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .option-sub-title {
      font-size: 13px;
      color: var(--text-dim);
      font-weight: 600;
    }

    .layout-options {
      display: flex;
      gap: 8px;
      overflow-x: auto;
    }

    .layout-btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--card-border);
      color: var(--text-dim);
      padding: 10px 14px;
      border-radius: var(--radius-btn);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .layout-btn.active {
      background: rgba(0, 212, 255, 0.15);
      border-color: var(--cyan);
      color: var(--cyan);
    }

    .color-options {
      display: flex;
      gap: 10px;
    }

    .color-dot {
      width: 32px; height: 32px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
    }

    .color-dot.active { border-color: white; transform: scale(1.1); }

    .filter-options {
      display: flex;
      gap: 8px;
    }

    .filter-btn {
      flex: 1;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--card-border);
      color: var(--text-dim);
      padding: 8px;
      border-radius: var(--radius-btn);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .filter-btn.active {
      background: rgba(255, 209, 102, 0.15);
      border-color: var(--yellow);
      color: var(--yellow);
    }

    input[type="text"] {
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--card-border);
      color: white;
      padding: 12px 16px;
      border-radius: var(--radius-btn);
      font-family: inherit;
      font-size: 14px;
      outline: none;
    }

    .preview-container {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      margin-top: 10px;
    }

    canvas {
      max-width: 100%;
      height: auto;
      max-height: 520px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .card.drag-over {
      border-color: var(--cyan);
      box-shadow: 0 0 25px rgba(0, 212, 255, 0.4);
    }

    .ratio-options {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .ratio-btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--card-border);
      color: var(--text-dim);
      padding: 8px 12px;
      border-radius: var(--radius-btn);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .ratio-btn.active {
      background: rgba(0, 212, 255, 0.15);
      border-color: var(--cyan);
      color: var(--cyan);
    }

    .btn-delete-photo {
      position: absolute;
      top: 4px;
      left: 4px;
      background: rgba(0, 0, 0, 0.75);
      color: #ff006e;
      border: 1px solid rgba(255, 0, 110, 0.4);
      width: 22px;
      height: 22px;
      border-radius: 50%;
      font-size: 12px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      line-height: 1;
      z-index: 2;
      transition: transform 0.15s, background 0.15s;
    }

    .btn-delete-photo:hover {
      background: #ff006e;
      color: white;
      transform: scale(1.15);
    }

    .viewfinder-guide {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border: 2px dashed rgba(0, 212, 255, 0.7);
      border-radius: 8px;
      pointer-events: none;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.25);
      transition: width 0.25s ease, height 0.25s ease;
    }

    .help-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      cursor: pointer;
      border: 1px solid var(--card-border);
      z-index: 100;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-content {
      background: var(--bg);
      border: 1px solid var(--card-border);
      padding: 24px;
      border-radius: var(--radius-card);
      max-width: 400px;
      width: 100%;
    }

    .modal h2 { margin-bottom: 16px; color: var(--cyan); }
    .modal p { margin-bottom: 12px; line-height: 1.5; color: var(--text-dim); }
    .close-modal { margin-top: 16px; width: 100%; padding: 12px; background: var(--purple); border: none; border-radius: 8px; color: white; cursor: pointer; }
  </style>
</head>

          <button class="ratio-btn" data-ratio="1:1" onclick="setPhotoRatio('1:1', this)">⏹️ 정방형 (1:1)</button>

        </div>

        <div class="option-group">
          <div class="option-sub-title">2. 프레임 사진 비율 (가로 / 세로)</div>

            <button class="ratio-btn active" data-ratio="4:3" onclick="setPhotoRatio('4:3', this)">↔️ 가로 (4:3)</button>
            <button class="ratio-btn" data-ratio="3:4" onclick="setPhotoRatio('3:4', this)">↕️ 세로 (3:4)</button>
            <button class="ratio-btn" data-ratio="16:9" onclick="setPhotoRatio('16:9', this)">🖥️ 와이드 (16:9)</button>
            <button class="ratio-btn" data-ratio="9:16" onclick="setPhotoRatio('9:16', this)">📱 숏폼 (9:16)</button>

            <div class="color-dot" style="background:#00d4ff" onclick="setFrameColor('#00d4ff', this)"></div>
            <div class="color-dot" style="background:#ffd166" onclick="setFrameColor('#ffd166', this)"></div>
            <div class="color-dot" style="background:#7c3aed" onclick="setFrameColor('#7c3aed', this)"></div>

  "가로(4:3, 16:9), 세로(3:4, 9:16), 정방형 등 원하는 사진 비율을 고릅니다.",
  "갤러리에서 마음에 드는 네 장의 사진을 선택합니다.",
  "16:9 / 9:16 2x2 그리드, 세로 4컷 등 프레임 레이아웃과 필터를 고릅니다.",

 ],
 "tips": [

  "카메라 없이도 PC나 스마트폰에 저장된 사진을 불러와 프레임을 제작할 수 있습니다.",
  "사진 썸네일 좌측 상단의 ✕ 버튼으로 필요 없는 사진을 삭제할 수 있습니다."
 ]
}

  <script>
    const RATIO_MAP = {
      '4:3': { label: '가로 (4:3)', num: 4 / 3 },
      '3:4': { label: '세로 (3:4)', num: 3 / 4 },
      '16:9': { label: '가로 와이드 (16:9)', num: 16 / 9 },
      '9:16': { label: '세로 숏폼 (9:16)', num: 9 / 16 },
      '1:1': { label: '정방형 (1:1)', num: 1 }
    };

    let currentStream = null;
    let facingMode = 'user';
    const capturedPhotos = [];
    const selectedIndices = [];
    let activeFrameColor = '#ff006e';
    let activeLayout = 'v4';
    let activeFilter = 'none';
    let activePhotoRatio = '4:3';

    const video = document.getElementById('webcam');
    const countdownOverlay = document.getElementById('countdownOverlay');
    const photoGrid = document.getElementById('photoGrid');
    const photoCount = document.getElementById('photoCount');

    async function initCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }
      try {
        currentStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: facingMode, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        video.srcObject = currentStream;
        updateViewfinderGuide();
      } catch (e) {
        console.error("Camera access error:", e);
      }
    }
    initCamera();

    function toggleCamera() {
      facingMode = (facingMode === 'user') ? 'environment' : 'user';
      initCamera();
    }

    function setPhotoRatio(ratio, el) {
      if (!RATIO_MAP[ratio]) return;
      activePhotoRatio = ratio;
      document.querySelectorAll('#shootRatioOptions .ratio-btn, #frameRatioOptions .ratio-btn').forEach(btn => {
        if (btn.dataset.ratio === ratio) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
      updateViewfinderGuide();
    }

    function updateViewfinderGuide() {
      const guide = document.getElementById('viewfinderGuide');
      if (!guide) return;
      const targetRatio = RATIO_MAP[activePhotoRatio].num;
      const maxH = 250;
      let w, h;
      if (targetRatio >= 1) {
        h = Math.min(maxH, Math.round(520 / targetRatio));
        w = Math.round(h * targetRatio);
        if (w > 540) {
          w = 540;
          h = Math.round(w / targetRatio);
        }
      } else {
        h = maxH;
        w = Math.round(h * targetRatio);
      }
      guide.style.width = w + 'px';
      guide.style.height = h + 'px';
    }

    function startPhotoShoot() {
      if (capturedPhotos.length >= 20) {
        alert('최대 20장까지 보관할 수 있습니다.');
        return;
      }

      let count = 3;
      countdownOverlay.textContent = count;
      countdownOverlay.style.display = 'flex';

      const timer = setInterval(() => {
        count--;
        if (count > 0) {
          countdownOverlay.textContent = count;
        } else {
          clearInterval(timer);
          countdownOverlay.style.display = 'none';
          snapPhoto();
        }
      }, 1000);
    }

    function snapPhoto() {
      const vW = video.videoWidth || 640;
      const vH = video.videoHeight || 480;
      const targetRatio = RATIO_MAP[activePhotoRatio] ? RATIO_MAP[activePhotoRatio].num : (4 / 3);
      const vRatio = vW / vH;

      let sW = vW, sH = vH, sx = 0, sy = 0;
      if (vRatio > targetRatio) {
        sW = vH * targetRatio;
        sx = (vW - sW) / 2;
      } else {
        sH = vW / targetRatio;
        sy = (vH - sH) / 2;
      }

      const tempCanvas = document.createElement('canvas');
      if (targetRatio >= 1) {
        tempCanvas.width = 1200;
        tempCanvas.height = Math.round(1200 / targetRatio);
      } else {
        tempCanvas.height = 1200;
        tempCanvas.width = Math.round(1200 * targetRatio);
      }
      const ctx = tempCanvas.getContext('2d');

      if (facingMode === 'user') {
        ctx.translate(tempCanvas.width, 0);
        ctx.scale(-1, 1);
      }

      ctx.drawImage(video, sx, sy, sW, sH, 0, 0, tempCanvas.width, tempCanvas.height);
      const dataUrl = tempCanvas.toDataURL('image/jpeg', 0.92);

      capturedPhotos.push(dataUrl);
      updateGallery();
    }

    function handleFileUpload(event) {
      const files = Array.from(event.target.files || []);
      addFilesToGallery(files);
      event.target.value = '';
    }

    function addFilesToGallery(files) {
      const imageFiles = files.filter(f => f.type.startsWith('image/'));
      if (imageFiles.length === 0) {
        if (files.length > 0) alert('이미지 파일(JPG, PNG 등)만 등록할 수 있습니다.');
        return;
      }

      imageFiles.forEach(file => {
        if (capturedPhotos.length >= 20) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          if (capturedPhotos.length < 20) {
            capturedPhotos.push(e.target.result);
            updateGallery();
          }
        };
        reader.readAsDataURL(file);
      });
    }

    function deletePhoto(idx, event) {
      if (event) event.stopPropagation();
      capturedPhotos.splice(idx, 1);

      const selPos = selectedIndices.indexOf(idx);
      if (selPos !== -1) {
        selectedIndices.splice(selPos, 1);
      }
      for (let i = 0; i < selectedIndices.length; i++) {
        if (selectedIndices[i] > idx) {
          selectedIndices[i]--;
        }
      }
      updateGallery();
    }

    function updateGallery() {
      photoGrid.innerHTML = '';
      photoCount.textContent = `${capturedPhotos.length} / 20장`;

      capturedPhotos.forEach((dataUrl, idx) => {
        const wrap = document.createElement('div');
        wrap.className = 'photo-thumb-wrap';

        const delBtn = document.createElement('button');
        delBtn.className = 'btn-delete-photo';
        delBtn.type = 'button';
        delBtn.title = '사진 삭제';
        delBtn.textContent = '✕';
        delBtn.onclick = (e) => deletePhoto(idx, e);
        wrap.appendChild(delBtn);

        const img = document.createElement('img');
        img.className = 'photo-thumb';
        img.src = dataUrl;

        const selPos = selectedIndices.indexOf(idx);
        if (selPos !== -1) {
          img.classList.add('selected');
          const badge = document.createElement('div');
          badge.className = 'badge-num';
          badge.textContent = selPos + 1;
          wrap.appendChild(badge);
        }

        img.onclick = () => toggleSelectPhoto(idx);
        wrap.appendChild(img);
        photoGrid.appendChild(wrap);
      });

      if (selectedIndices.length === 4) {
        document.getElementById('customizerSection').style.display = 'flex';
      } else {
        document.getElementById('customizerSection').style.display = 'none';
      }
    }

    function toggleSelectPhoto(idx) {
      const pos = selectedIndices.indexOf(idx);
      if (pos !== -1) {
        selectedIndices.splice(pos, 1);
      } else {
        if (selectedIndices.length >= 4) {
          alert('4컷 프레임용 사진은 4장만 선택 가능합니다.');
          return;
        }
        selectedIndices.push(idx);
      }
      updateGallery();
    }

    function setLayout(layout, el) {
      activeLayout = layout;
      document.querySelectorAll('.layout-btn').forEach(b => b.classList.remove('active'));
      if (el) el.classList.add('active');

      if (layout === 'grid2x2_16_9') {
        setPhotoRatio('16:9');
      } else if (layout === 'grid2x2_9_16') {
        setPhotoRatio('9:16');
      }
    }

    function setFrameColor(color, el) {
      activeFrameColor = color;
      document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
      el.classList.add('active');
    }

    function setFilter(filter, el) {
      activeFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
    }

    function applyFilterToContext(ctx) {
      if (activeFilter === 'bw') {
        ctx.filter = 'grayscale(100%) contrast(110%)';
      } else if (activeFilter === 'sepia') {
        ctx.filter = 'sepia(80%) contrast(105%)';
      } else if (activeFilter === 'glow') {
        ctx.filter = 'saturate(150%) brightness(110%) contrast(105%)';
      } else {
        ctx.filter = 'none';
      }
    }

    function drawImageCover(ctx, img, x, y, targetW, targetH) {
      const imgRatio = img.width / img.height;
      const targetRatio = targetW / targetH;
      let sx = 0, sy = 0, sWidth = img.width, sHeight = img.height;

      if (imgRatio > targetRatio) {
        sWidth = img.height * targetRatio;
        sx = (img.width - sWidth) / 2;
      } else {
        sHeight = img.width / targetRatio;
        sy = (img.height - sHeight) / 2;
      }

      ctx.drawImage(img, sx, sy, sWidth, sHeight, x, y, targetW, targetH);
    }

    function render4CutFrame() {
      if (selectedIndices.length !== 4) return;

      const canvas = document.getElementById('fourCutCanvas');
      const ctx = canvas.getContext('2d');
      const ratioNum = RATIO_MAP[activePhotoRatio] ? RATIO_MAP[activePhotoRatio].num : (4 / 3);

      let itemW = 400;
      let itemH = Math.round(400 / ratioNum);
      const padding = 24;
      const gap = 16;
      const footerH = 70;

      const slots = [];

      if (activeLayout === 'v4') {
        // Vertical 1x4
        if (ratioNum < 1) {
          itemW = 340;
          itemH = Math.round(340 / ratioNum);
        } else {
          itemW = 400;
          itemH = Math.round(400 / ratioNum);
        }
        canvas.width = itemW + padding * 2;
        canvas.height = padding + (itemH * 4) + (gap * 3) + footerH;
        for (let i = 0; i < 4; i++) {
          slots.push({ x: padding, y: padding + i * (itemH + gap), w: itemW, h: itemH });
        }
      } else if (activeLayout === 'grid2x2') {
        // 2x2 Grid (Ratio-adaptive)
        if (activePhotoRatio === '4:3') {
          itemW = 400; itemH = 300;
        } else if (activePhotoRatio === '3:4') {
          itemW = 320; itemH = 427;
        } else if (activePhotoRatio === '16:9') {
          itemW = 440; itemH = 248;
        } else if (activePhotoRatio === '9:16') {
          itemW = 280; itemH = 498;
        } else {
          itemW = 360; itemH = 360;
        }
        canvas.width = padding * 2 + itemW * 2 + gap;
        canvas.height = padding + itemH * 2 + gap + footerH;
        for (let i = 0; i < 4; i++) {
          const col = i % 2;
          const row = Math.floor(i / 2);
          slots.push({
            x: padding + col * (itemW + gap),
            y: padding + row * (itemH + gap),
            w: itemW,
            h: itemH
          });
        }
      } else if (activeLayout === 'grid2x2_16_9') {
        // 16:9 Aspect Ratio Frame (1280x720)
        canvas.width = 1280;
        canvas.height = 720;
        const g2Gap = 20;
        const g2TopPad = 35;
        const g2ItemH = 290;
        const g2ItemW = Math.round(g2ItemH * (16 / 9)); // 516
        const g2PadX = Math.round((1280 - (g2ItemW * 2 + g2Gap)) / 2);
        for (let i = 0; i < 4; i++) {
          const col = i % 2;
          const row = Math.floor(i / 2);
          slots.push({
            x: g2PadX + col * (g2ItemW + g2Gap),
            y: g2TopPad + row * (g2ItemH + g2Gap),
            w: g2ItemW,
            h: g2ItemH
          });
        }
      } else if (activeLayout === 'grid2x2_9_16') {
        // 9:16 Aspect Ratio Frame (720x1280)
        canvas.width = 720;
        canvas.height = 1280;
        const g2Gap = 20;
        const g2FooterH = 80;
        const g2ItemW = 310;
        const g2ItemH = Math.round(g2ItemW * (16 / 9)); // 551
        const g2PadX = Math.round((720 - (g2ItemW * 2 + g2Gap)) / 2);
        const g2PadY = Math.round((1280 - g2FooterH - (g2ItemH * 2 + g2Gap)) / 2);
        for (let i = 0; i < 4; i++) {
          const col = i % 2;
          const row = Math.floor(i / 2);
          slots.push({
            x: g2PadX + col * (g2ItemW + g2Gap),
            y: g2PadY + row * (g2ItemH + g2Gap),
            w: g2ItemW,
            h: g2ItemH
          });
        }
      } else if (activeLayout === 'film') {
        // Retro Film Strip
        itemW = 400;
        itemH = Math.round(400 / ratioNum);
        canvas.width = itemW + padding * 3;
        canvas.height = padding + (itemH * 4) + (gap * 3) + footerH;
        for (let i = 0; i < 4; i++) {
          slots.push({ x: padding + 12, y: padding + i * (itemH + gap), w: itemW, h: itemH });
        }
      } else if (activeLayout === 'wide') {
        // Wide 4x1
        itemW = 300;
        itemH = Math.round(300 / ratioNum);
        canvas.width = padding * 2 + itemW * 4 + gap * 3;
        canvas.height = padding + itemH + footerH;
        for (let i = 0; i < 4; i++) {
          slots.push({ x: padding + i * (itemW + gap), y: padding, w: itemW, h: itemH });
        }
      }

      // Draw Frame BG
      ctx.fillStyle = activeLayout === 'film' ? '#0a0a0a' : activeFrameColor;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Film Holes if film mode
      if (activeLayout === 'film') {
        ctx.fillStyle = '#ffffff';
        for (let y = 15; y < canvas.height - 30; y += 25) {
          ctx.fillRect(8, y, 10, 14);
          ctx.fillRect(canvas.width - 18, y, 10, 14);
        }
      }

      let loadedCount = 0;
      selectedIndices.forEach((photoIdx, slot) => {
        const img = new Image();
        img.onload = () => {
          const s = slots[slot];
          ctx.save();
          applyFilterToContext(ctx);
          drawImageCover(ctx, img, s.x, s.y, s.w, s.h);
          ctx.restore();

          loadedCount++;
          if (loadedCount === 4) {
            // Draw Footer Text
            const title = document.getElementById('frameTitle').value.trim() || 'NEON PHOTO 4-CUT';
            ctx.fillStyle = (activeFrameColor === '#ffffff' && activeLayout !== 'film') ? '#111122' : '#ffffff';
            const fSize = (activeLayout === 'grid2x2_16_9' || activeLayout === 'grid2x2_9_16') ? 26 : 22;
            ctx.font = `bold ${fSize}px Outfit, Pretendard, sans-serif`;
            ctx.textAlign = 'center';
            const textY = activeLayout === 'grid2x2_9_16' ? canvas.height - 32 : canvas.height - 24;
            ctx.fillText(title, canvas.width / 2, textY);

            document.getElementById('previewContainer').style.display = 'flex';
            document.getElementById('previewContainer').scrollIntoView({ behavior: 'smooth' });
          }
        };
        img.src = capturedPhotos[photoIdx];
      });
    }

    function download4Cut() {
      const canvas = document.getElementById('fourCutCanvas');
      const a = document.createElement('a');
      a.href = canvas.toDataURL('image/png');
      a.download = `neon_4cut_${Date.now()}.png`;
      a.click();
    }

    // Drag and Drop support on the card
    const cardEl = document.querySelector('.card');
    if (cardEl) {
      cardEl.addEventListener('dragover', (e) => {
        e.preventDefault();
        cardEl.classList.add('drag-over');
      });
      cardEl.addEventListener('dragleave', (e) => {
        e.preventDefault();
        cardEl.classList.remove('drag-over');
      });
      cardEl.addEventListener('drop', (e) => {
        e.preventDefault();
        cardEl.classList.remove('drag-over');
        if (e.dataTransfer && e.dataTransfer.files) {
          addFilesToGallery(Array.from(e.dataTransfer.files));
        }
      });
    }
  </script>
</body>
</html>
