<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>QR 가든 - 미니게임 천국</title>
<link rel="stylesheet" href="../styles/game-common.css">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0f172a;font-family:'Outfit',sans-serif;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
.back{position:absolute;top:20px;left:20px;z-index:10}
h1{font-size:1.8rem;margin:40px 0 5px;background:linear-gradient(135deg,#10b981,#84cc16);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
p.sub{color:#94a3b8;margin-bottom:20px;text-align:center}
.garden{width:90%;max-width:600px;aspect-ratio:1;background:rgba(255,255,255,.03);border-radius:30px;border:2px solid rgba(255,255,255,.1);position:relative;overflow:hidden;margin:20px 0}
.flower{position:absolute;font-size:2rem;animation:bloom .8s cubic-bezier(.175,.885,.32,1.275);cursor:pointer;transition:transform .3s}
.flower:hover{transform:scale(1.3)}
@keyframes bloom{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}
.controls{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:15px 0}
.btn{padding:12px 28px;border-radius:50px;border:none;color:#fff;font-weight:700;cursor:pointer;font-family:inherit;font-size:1rem;transition:transform .3s}
.btn:hover{transform:scale(1.05)}
.btn-plant{background:linear-gradient(135deg,#10b981,#84cc16)}
.btn-clear{background:rgba(255,255,255,.1)}
.stats{color:#94a3b8;margin:10px 0;font-size:.9rem}
.seed-input{display:flex;gap:10px;align-items:center;margin:15px 0}
.seed-input input{padding:10px 16px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.15);color:#fff;font-family:inherit;font-size:1rem;width:200px}
</style>
</head>
<body>
<a href="../index.html" class="back back-button">← 메인</a>
<h1>🌸 QR 가든</h1>
<p class="sub">씨앗 코드를 공유해 함께 정원을 가꾸세요!</p>
<div class="seed-input">
<input id="seed" placeholder="씨앗 코드 (예: 1234)">
<button class="btn btn-plant" onclick="plantFromSeed()">심기 🌱</button>
</div>
<div class="garden" id="garden" onclick="plantRandom(event)"></div>
<div class="stats">🌸 꽃: <span id="flower-count">0</span>개</div>
<div class="controls">
<button class="btn btn-plant" onclick="autoPlant()">랜덤 심기 ×10</button>
<button class="btn btn-clear" onclick="clearGarden()">정원 초기화</button>
</div>
<script>
const flowers=['🌸','🌺','🌻','🌷','🌹','🌼','💐','🌿','🍀','🌵','🌴','🎋','🌾','🌱','🍁','🍂','🌳','🪻','🪷','💮'];
const garden=document.getElementById('garden');let count=0;
function seededRandom(seed){let s=seed;return function(){s=(s*16807)%2147483647;return(s-1)/2147483646}}
function addFlower(x,y,emoji,size){
const el=document.createElement('div');el.className='flower';el.textContent=emoji;
el.style.left=x+'%';el.style.top=y+'%';el.style.fontSize=size+'rem';
garden.appendChild(el);count++;document.getElementById('flower-count').textContent=count;
}
function plantRandom(e){
const rect=garden.getBoundingClientRect();
const x=((e.clientX-rect.left)/rect.width*100);
const y=((e.clientY-rect.top)/rect.height*100);
addFlower(x,y,flowers[Math.floor(Math.random()*flowers.length)],1.5+Math.random()*2);
}
function plantFromSeed(){
const seedVal=document.getElementById('seed').value.trim();if(!seedVal)return;
let numSeed=0;for(let i=0;i<seedVal.length;i++)numSeed+=seedVal.charCodeAt(i)*((i+1)*7);
const rng=seededRandom(numSeed);
for(let i=0;i<5;i++){addFlower(10+rng()*80,10+rng()*80,flowers[Math.floor(rng()*flowers.length)],1.5+rng()*2)}
}
function autoPlant(){for(let i=0;i<10;i++)addFlower(5+Math.random()*90,5+Math.random()*90,flowers[Math.floor(Math.random()*flowers.length)],1.5+Math.random()*2)}
function clearGarden(){garden.innerHTML='';count=0;document.getElementById('flower-count').textContent=0}
</script>
    <script src="../scripts/game-common.js"></script>
</body>
</html>
