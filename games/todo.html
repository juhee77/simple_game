<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>할일 추천 - 미니게임 천국</title>
    <link rel="stylesheet" href="../styles/game-common.css?v=2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        .mood-section {
            margin-bottom: 2rem;
        }

        .mood-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            text-align: center;
            color: var(--text-primary);
        }

        .mood-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
        }

        .mood-card {
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .mood-card:hover {
            border-color: var(--accent-primary);
            transform: translateY(-5px);
        }

        .mood-card.selected {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border-color: var(--accent-primary);
        }

        .mood-icon {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }

        .mood-label {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .time-section {
            margin-bottom: 2rem;
        }

        .time-options {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .time-btn {
            padding: 0.875rem 1.5rem;
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .time-btn:hover {
            border-color: var(--accent-primary);
        }

        .time-btn.selected {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border-color: var(--accent-primary);
        }

        .recommendation-card {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            padding: 3rem;
            border-radius: 20px;
            text-align: center;
            margin: 2rem 0;
            display: none;
        }

        .recommendation-card.show {
            display: block;
            animation: scaleIn 0.5s ease;
        }

        @keyframes scaleIn {
            from {
                transform: scale(0.9);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .rec-icon {
            font-size: 5rem;
            margin-bottom: 1rem;
        }

        .rec-title {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 1rem;
        }

        .rec-description {
            font-size: 1.2rem;
            opacity: 0.9;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }

        .rec-tips {
            background: rgba(255, 255, 255, 0.1);
            padding: 1.5rem;
            border-radius: 12px;
            margin-top: 1.5rem;
        }

        .rec-tips-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
        }

        .rec-tips-list {
            text-align: left;
            list-style: none;
            padding: 0;
        }

        .rec-tips-list li {
            padding: 0.5rem 0;
            padding-left: 1.5rem;
            position: relative;
        }

        .rec-tips-list li::before {
            content: '✓';
            position: absolute;
            left: 0;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="game-container">

            <div class="mood-section">
                <div class="mood-title">지금 기분이 어떠세요?</div>
                <div class="mood-options">
                    <div class="mood-card" data-mood="energetic" onclick="selectMood('energetic')">
                        <div class="mood-icon">⚡</div>
                        <div class="mood-label">활기찬</div>
                    </div>
                    <div class="mood-card" data-mood="tired" onclick="selectMood('tired')">

                        <div class="mood-label">피곤한</div>
                    </div>
                    <div class="mood-card" data-mood="creative" onclick="selectMood('creative')">

                        <div class="mood-label">여유로운</div>
                    </div>
                </div>
            </div>

            <div class="time-section">
                <div class="mood-title">얼마나 시간이 있나요?</div>
                <div class="time-options">
                    <button class="time-btn" data-time="short" onclick="selectTime('short')">30분 이하</button>
                    <button class="time-btn" data-time="medium" onclick="selectTime('medium')">1-2시간</button>
                    <button class="time-btn" data-time="long" onclick="selectTime('long')">2시간 이상</button>
                </div>
            </div>

            <div class="recommendation-card" id="recommendation">
                <div class="rec-icon" id="rec-icon">✨</div>
                <div class="rec-title" id="rec-title">추천 활동</div>
                <div class="rec-description" id="rec-description">설명</div>
                <div class="rec-tips">
                    <div class="rec-tips-title">💡 팁</div>
                    <ul class="rec-tips-list" id="rec-tips"></ul>
                </div>
            </div>

            <div class="controls">
                <button class="button" onclick="getRecommendation()">추천받기! 🎲</button>
            </div>
        </div>
    </div>

                    { icon: '🎨', title: '미술관/박물관', desc: '문화생활을 즐겨보세요!', tips: ['사전 조사', '오디오 가이드', '천천히 감상'] },
                    { icon: '🧘', title: '요가/명상 클래스', desc: '전문 클래스에서 힐링하세요!', tips: ['예약하기', '매트 준비', '편한 옷', '마음 열기'] },
                ]
            }
        };

        function selectMood(mood) {
            selectedMood = mood;
            document.querySelectorAll('.mood-card').forEach(card => {
                card.classList.toggle('selected', card.dataset.mood === mood);
            });
        }

        function selectTime(time) {
            selectedTime = time;
            document.querySelectorAll('.time-btn').forEach(btn => {
                btn.classList.toggle('selected', btn.dataset.time === time);
            });
        }

        function getRecommendation() {
            if (!selectedMood || !selectedTime) {
                alert('기분과 시간을 모두 선택해주세요!');
                return;
            }

            const options = activities[selectedMood][selectedTime];
            const selected = options[Math.floor(Math.random() * options.length)];

            document.getElementById('rec-icon').textContent = selected.icon;
            document.getElementById('rec-title').textContent = selected.title;
            document.getElementById('rec-description').textContent = selected.desc;

            const tipsList = document.getElementById('rec-tips');
            tipsList.innerHTML = selected.tips.map(tip => `<li>${tip}</li>`).join('');

            const card = document.getElementById('recommendation');
            card.classList.remove('show');
            setTimeout(() => card.classList.add('show'), 10);
        }
    </script>
