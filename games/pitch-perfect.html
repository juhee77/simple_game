<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>음정 맞히기 - Pitch Perfect</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&family=Outfit:wght@800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050b14;
            --panel-bg: rgba(15, 23, 42, 0.6);
            --border-color: rgba(56, 189, 248, 0.2);
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --neon-pitch: #38bdf8;
            --neon-match: #10b981;
            --glass-glow: 0 0 15px rgba(56, 189, 248, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; user-select: none; }
        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(13, 148, 136, 0.3) 0, transparent 50%),
                radial-gradient(at 100% 100%, rgba(30, 27, 75, 0.4) 0, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            padding: 10px;
        }

        header {
            width: 100%; max-width: 500px; padding: 15px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 100;
        }
        h1 { font-family: 'Outfit', sans-serif; font-size: 1.5rem; letter-spacing: 1px; color: var(--neon-pitch); text-shadow: var(--glass-glow); }

        .btn-icon {
            background: var(--panel-bg); border: 1px solid var(--border-color); color: white;
            width: 40px; height: 40px; border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center; font-size: 1.2rem;
            transition: all 0.2s;
        }
        .btn-icon:hover { background: rgba(56, 189, 248, 0.1); transform: scale(1.05); }

        .card {
            width: 100%; max-width: 500px;
            background: var(--panel-bg); backdrop-filter: blur(15px);
            border: 1px solid var(--border-color); border-radius: 20px;
            padding: 25px; margin: 15px 0;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            display: flex; flex-direction: column; gap: 20px;
            text-align: center;
        }

        .stage-title { font-size: 1.2rem; font-weight: 800; color: var(--neon-pitch); text-shadow: var(--glass-glow); }
        .score-display { font-size: 1.1rem; color: var(--text-muted); }

        /* Soundwave animation screen */
        .wave-container {
            height: 120px; width: 100%;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            display: flex; align-items: center; justify-content: center;
        }
        .wave-canvas { width: 100%; height: 100%; }

        /* Control Panel Buttons */
        .btn-play {
            background: linear-gradient(135deg, #0ea5e9, #0284c7);
            color: white; border: none; padding: 16px 20px; border-radius: 14px;
            font-size: 1.1rem; font-weight: 800; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            transition: all 0.2s; box-shadow: 0 4px 15px rgba(14, 165, 233, 0.3);
        }
        .btn-play:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(14, 165, 233, 0.4); }

        .action-row { display: flex; gap: 10px; }
        .btn-secondary {
            flex: 1; padding: 12px;
            background: rgba(255,255,255,0.05); border: 1px solid var(--border-color);
            color: white; border-radius: 10px; font-weight: 600; cursor: pointer;
            transition: all 0.2s;
        }
        .btn-secondary:hover { background: rgba(56, 189, 248, 0.1); }
        .btn-secondary.active { background: var(--neon-pitch); color: #000; font-weight: 800; }

        /* Tuning Slider styling */
        .slider-container {
            display: flex; flex-direction: column; gap: 10px; margin: 10px 0;
        }
        .slider-label { display: flex; justify-content: space-between; font-size: 0.9rem; color: var(--text-muted); }
        .pitch-slider {
            -webkit-appearance: none; width: 100%; height: 8px; border-radius: 4px;
            background: rgba(255,255,255,0.1); outline: none; transition: all 0.2s;
        }
        .pitch-slider::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 24px; height: 24px; border-radius: 50%;
            background: var(--neon-pitch); cursor: pointer;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.8);
            transition: transform 0.1s;
        }
        .pitch-slider::-webkit-slider-thumb:active { transform: scale(1.2); }

        /* Modal Overlay */
        .overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(5, 8, 16, 0.85); backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: none; align-items: center; justify-content: center; z-index: 1000;
        }
        .overlay.active { display: flex; }
        .modal {
            background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 40px 30px; border-radius: 28px; width: 85%; max-width: 420px;
            text-align: center; box-shadow: 0 30px 70px rgba(0,0,0,0.8), 0 0 40px rgba(56, 189, 248, 0.15);
            animation: modal-zoom 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex; flex-direction: column; gap: 15px;
        }
        @keyframes modal-zoom {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .modal h2 { font-size: 2.2rem; color: var(--neon-match); text-shadow: 0 0 10px rgba(16, 185, 129, 0.4); }
        .modal p.accuracy { font-size: 2.8rem; font-weight: 800; margin: 10px 0; color: #fff; }
        .modal .info-text { font-size: 0.95rem; color: var(--text-muted); line-height: 1.5; }
        .btn-main {
            background: linear-gradient(135deg, #38bdf8, #0ea5e9); color: #040815; border: none;
            padding: 14px 45px; border-radius: 50px; font-weight: 800;
            font-size: 1.1rem; cursor: pointer; transition: all 0.25s ease;
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.3);
            margin-top: 10px;
        }
        .btn-main:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(14, 165, 233, 0.5);
        }

    canvas{touch-action:manipulation}
</style>
    <script src="../scripts/game-common.js?v=b7c7301f"></script>
</head>
<body>

    <header>
        <button class="btn-icon" onclick="location.href='../index.html'"><i class="ri-home-4-line"></i></button>
        <h1>PITCH PERFECT</h1>
        <button class="btn-icon" onclick="resetGame()"><i class="ri-refresh-line"></i></button>
    </header>

    <div class="card">
        <div class="stage-title" id="round-lbl">ROUND 1 / 5</div>
        <div class="score-display" id="score-lbl">총점: 0점</div>

        <button class="btn-play" onclick="playReference()">
            <i class="ri-volume-up-fill"></i> 기준음 듣기 (2초)
        </button>

        <div class="wave-container">
            <canvas class="wave-canvas" id="canvas"></canvas>
            <div id="no-audio-hint" style="position: absolute; font-size: 0.9rem; color: var(--text-muted);">
                기준음을 듣고 슬라이더를 맞추세요
            </div>
        </div>

        <div class="slider-container">
            <div class="slider-label">
                <span>낮은 음 (C4: 261.63Hz)</span>
                <span id="hz-indicator" style="color: var(--neon-pitch); font-weight: bold;">튜닝 중...</span>
                <span>높은 음 (C5: 523.25Hz)</span>
            </div>
            <input type="range" class="pitch-slider" id="pitch-control" min="261.63" max="523.25" step="0.1" value="392.00" oninput="onSliderMove()">
        </div>

        <div class="action-row">
            <button class="btn-secondary" id="btn-test-pitch" onpointerdown="startTestPitch()" onpointerup="stopTestPitch()" onpointerleave="stopTestPitch()">
                내 음 실시간 확인 🔊
            </button>
        </div>

        <div class="action-row">
            <button class="btn-secondary" onclick="playBothTogether()">
                동시 듣기 (비트 감각 테스트) 🌀
            </button>
        </div>

        <button class="btn-play" style="background: linear-gradient(135deg, var(--neon-match), #059669); box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);" onclick="submitPitch()">
            정답 제출하기 🎯
        </button>
    </div>

    <!-- Clear Modal -->
    <div class="overlay" id="result-overlay">
        <div class="modal">
            <h2 id="result-title">정확도 평가</h2>
            <p class="accuracy" id="accuracy-lbl">98.5%</p>
            <p class="info-text" id="result-desc">
                실제 주파수: 440.0Hz<br>
                당신의 주파수: 445.2Hz (오차 5.2Hz)
            </p>
            <button class="btn-main" onclick="nextRound()">다음 라운드</button>
        </div>
    </div>

    <script>
        const C4 = 261.63;
        const C5 = 523.25;

        let audioCtx = null;
        let referenceFreq = 440;
        let userFreq = 392.00;
        let currentRound = 1;
        let totalScore = 0;

        let activeOsc = null;
        let activeGain = null;

        // Visualizer config
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let animId = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            // iOS는 컨텍스트가 suspended로 시작한다. 깨우지 않으면 소리가 나지 않아
            // 청음 게임 자체가 성립하지 않는다.
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function generateRandomFreq() {
            // Generate standard musical frequencies between C4 and C5
            const min = C4 + 30;
            const max = C5 - 30;
            referenceFreq = Math.round((Math.random() * (max - min) + min) * 10) / 10;
        }

        function playReference() {
            initAudio();
            document.getElementById('no-audio-hint').style.display = 'none';

            // Create reference oscillator
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.setValueAtTime(referenceFreq, audioCtx.currentTime);
            osc.type = 'sine';

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            // Play for 2.0s
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.15, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime + 1.8);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2.0);

            osc.start();
            osc.stop(audioCtx.currentTime + 2.0);

            startVisualizer(referenceFreq, 2000);
        }

        function onSliderMove() {
            userFreq = parseFloat(document.getElementById('pitch-control').value);
            document.getElementById('hz-indicator').innerText = userFreq.toFixed(1) + " Hz";

            // If active test pitch is playing, update its frequency in real time
            if (activeOsc) {
                activeOsc.frequency.setValueAtTime(userFreq, audioCtx.currentTime);
            }
        }

        function startTestPitch() {
            initAudio();
            document.getElementById('no-audio-hint').style.display = 'none';
            if (activeOsc) stopTestPitch();

            activeOsc = audioCtx.createOscillator();
            activeGain = audioCtx.createGain();
            activeOsc.type = 'sine';
            activeOsc.frequency.setValueAtTime(userFreq, audioCtx.currentTime);

            activeOsc.connect(activeGain);
            activeGain.connect(audioCtx.destination);

            activeGain.gain.setValueAtTime(0, audioCtx.currentTime);
            activeGain.gain.linearRampToValueAtTime(0.15, audioCtx.currentTime + 0.05);

            activeOsc.start();
            startVisualizer(userFreq);
        }

        function stopTestPitch() {
            if (activeOsc) {
                try {
                    activeGain.gain.setValueAtTime(activeGain.gain.value, audioCtx.currentTime);
                    activeGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                    activeOsc.stop(audioCtx.currentTime + 0.1);
                } catch(e){}
                activeOsc = null;
                activeGain = null;
            }
            stopVisualizer();
        }

        function playBothTogether() {
            initAudio();
            document.getElementById('no-audio-hint').style.display = 'none';

            // Create reference tone
            const osc1 = audioCtx.createOscillator();
            const gain1 = audioCtx.createGain();
            osc1.frequency.setValueAtTime(referenceFreq, audioCtx.currentTime);
            osc1.connect(gain1);
            gain1.connect(audioCtx.destination);

            // Create user tone
            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.frequency.setValueAtTime(userFreq, audioCtx.currentTime);
            osc2.connect(gain2);
            gain2.connect(audioCtx.destination);

            // Volumes
            gain1.gain.setValueAtTime(0, audioCtx.currentTime);
            gain1.gain.linearRampToValueAtTime(0.1, audioCtx.currentTime + 0.1);
            gain1.gain.setValueAtTime(0.1, audioCtx.currentTime + 2.3);
            gain1.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2.5);

            gain2.gain.setValueAtTime(0, audioCtx.currentTime);
            gain2.gain.linearRampToValueAtTime(0.1, audioCtx.currentTime + 0.1);
            gain2.gain.setValueAtTime(0.1, audioCtx.currentTime + 2.3);
            gain2.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2.5);

            osc1.start();
            osc1.stop(audioCtx.currentTime + 2.5);
            osc2.start();
            osc2.stop(audioCtx.currentTime + 2.5);

            startVisualizer((referenceFreq + userFreq) / 2, 2500);
        }

        function submitPitch() {
            stopTestPitch();
            initAudio();

            // Calculate score
            const diff = Math.abs(referenceFreq - userFreq);
            // Accuracy percentage: 100% matches exact. C4 to C5 range is ~261Hz. 
            // Let's scale accuracy linearly where 10Hz offset is ~90% accuracy.
            let accuracy = 100 - (diff / 1.5);
            if (accuracy < 0) accuracy = 0;

            const roundScore = Math.round(accuracy * 10);
            totalScore += roundScore;

            document.getElementById('accuracy-lbl').innerText = accuracy.toFixed(1) + "%";
            document.getElementById('result-desc').innerHTML = `
                기준 음: <strong>${referenceFreq.toFixed(1)}Hz</strong><br>
                나의 튜닝 음: <strong>${userFreq.toFixed(1)}Hz</strong><br>
                오차: <strong>${diff.toFixed(1)}Hz</strong> (+${roundScore}점)
            `;

            // Style overlay
            if (accuracy >= 97) {
                document.getElementById('result-title').innerText = "🎵 환상적인 음감!";
                document.getElementById('result-title').style.color = "var(--neon-match)";
            } else if (accuracy >= 90) {
                document.getElementById('result-title').innerText = "👍 훌륭합니다!";
                document.getElementById('result-title').style.color = "var(--neon-pitch)";
            } else {
                document.getElementById('result-title').innerText = "😅 조금 아쉽네요";
                document.getElementById('result-title').style.color = "var(--text-muted)";
            }

            document.getElementById('result-overlay').classList.add('active');
            document.getElementById('score-lbl').innerText = `총점: ${totalScore}점`;
        }

        function nextRound() {
            document.getElementById('result-overlay').classList.remove('active');
            if (currentRound >= 5) {
                // Game Finished
                gameAlert(`게임 완료! 최종 음감 점수: ${totalScore} / 5000점`);
                resetGame();
            } else {
                currentRound++;
                document.getElementById('round-lbl').innerText = `ROUND ${currentRound} / 5`;
                generateRandomFreq();
                document.getElementById('no-audio-hint').style.display = 'block';
            }
        }

        function resetGame() {
            currentRound = 1;
            totalScore = 0;
            document.getElementById('round-lbl').innerText = `ROUND 1 / 5`;
            document.getElementById('score-lbl').innerText = `총점: 0점`;
            generateRandomFreq();
            document.getElementById('no-audio-hint').style.display = 'block';
        }

        // Draw basic sinewave simulation
        function startVisualizer(freq, duration = 0) {
            if (animId) cancelAnimationFrame(animId);
            let start = Date.now();

            function draw() {
                animId = requestAnimationFrame(draw);
                
                // Duration limit
                if (duration > 0 && Date.now() - start > duration) {
                    stopVisualizer();
                    return;
                }

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.beginPath();
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#38bdf8';

                const time = Date.now() * 0.005;
                // Scale wave density proportional to frequency
                const frequencyFactor = freq * 0.0003; 

                for (let x = 0; x < canvas.width; x++) {
                    const y = canvas.height / 2 + Math.sin(x * frequencyFactor + time) * 30;
                    if (x === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }
                }
                ctx.stroke();
            }

            // Correct canvas sizes
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
            draw();
        }

        function stopVisualizer() {
            if (animId) {
                cancelAnimationFrame(animId);
                animId = null;
            }
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        // Init first freq
        generateRandomFreq();

    </script>
<script type="application/json" id="game-rules">
{
 "title": "음정 맞히기",
 "goal": "들려준 기준 음과 같은 높이를 슬라이더로 맞추세요.",
 "steps": [
  "재생 버튼으로 기준 음을 듣습니다.",
  "슬라이더를 움직여 같은 높이라고 생각하는 음을 맞춥니다.",
  "비교 재생으로 두 소리를 번갈아 들어 봅니다.",
  "제출하면 실제 주파수와의 오차가 점수로 나옵니다."
 ],
 "tips": [
  "소리가 안 나면 화면을 한 번 터치하세요. 첫 터치에서 오디오가 켜집니다.",
  "이어폰을 쓰면 훨씬 정확합니다."
 ],
 "players": "1인",
 "time": "약 5분"
}
</script>
</body>
</html>
