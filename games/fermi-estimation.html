<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>페르미 추정 - Fermi Estimation</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&family=Outfit:wght@800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: rgba(22, 28, 45, 0.6);
            --border-color: rgba(56, 189, 248, 0.2);
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --neon-accent: #38bdf8;
            --neon-pink: #f43f5e;
            --glass-glow: 0 0 15px rgba(56, 189, 248, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(30, 41, 59, 0.5) 0, transparent 50%),
                radial-gradient(at 100% 100%, rgba(13, 148, 136, 0.2) 0, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            padding: 10px;
        }

        header {
            width: 100%; max-width: 550px; padding: 15px;
            display: flex; justify-content: space-between; align-items: center;
        }
        h1 { font-family: 'Outfit', sans-serif; font-size: 1.5rem; letter-spacing: 1px; color: var(--neon-accent); text-shadow: var(--glass-glow); }

        .btn-icon {
            background: var(--panel-bg); border: 1px solid var(--border-color); color: white;
            width: 40px; height: 40px; border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center; font-size: 1.2rem;
            transition: all 0.2s;
        }
        .btn-icon:hover { background: rgba(56, 189, 248, 0.1); transform: scale(1.05); }

        .card {
            width: 100%; max-width: 550px;
            background: var(--panel-bg); backdrop-filter: blur(15px);
            border: 1px solid var(--border-color); border-radius: 20px;
            padding: 25px; margin: 15px 0;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            display: none; flex-direction: column; gap: 20px;
        }
        .card.active { display: flex; }

        .card h2 { font-size: 1.4rem; text-align: center; color: var(--neon-accent); margin-bottom: 5px; }
        .card p.desc { font-size: 0.9rem; color: var(--text-muted); text-align: center; line-height: 1.4; }

        .player-input-row { display: flex; gap: 10px; }
        .input-text {
            flex: 1; padding: 12px 15px; background: rgba(0,0,0,0.3);
            border: 1px solid var(--border-color); border-radius: 10px;
            color: white; font-size: 1rem; outline: none; transition: all 0.2s;
        }
        .input-text:focus { border-color: var(--neon-accent); box-shadow: 0 0 10px rgba(56, 189, 248, 0.2); }

        .btn-primary {
            background: linear-gradient(135deg, var(--neon-accent), #0284c7);
            color: white; border: none; padding: 14px; border-radius: 12px;
            font-size: 1.05rem; font-weight: 800; cursor: pointer;
            transition: all 0.2s; text-align: center;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: var(--glass-glow); }

        /* Fermi estimation custom slider */
        .fermi-slider-container {
            display: flex; flex-direction: column; gap: 15px; margin: 15px 0;
            background: rgba(0,0,0,0.2); padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05);
        }
        .exponent-indicator {
            font-family: 'Share Tech Mono', monospace; font-size: 2.5rem; text-align: center;
            color: var(--neon-accent); text-shadow: var(--glass-glow); margin: 10px 0;
        }
        .fermi-slider {
            -webkit-appearance: none; width: 100%; height: 8px; border-radius: 4px;
            background: rgba(255,255,255,0.1); outline: none;
        }
        .fermi-slider::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 24px; height: 24px; border-radius: 50%;
            background: var(--neon-accent); cursor: pointer;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.8);
        }

        /* Leaderboard and Result items */
        .list-container {
            display: flex; flex-direction: column; gap: 10px; margin: 10px 0;
        }
        .list-item {
            display: flex; justify-content: space-between; padding: 12px 20px;
            background: rgba(255,255,255,0.03); border-radius: 10px; border: 1px solid rgba(255,255,255,0.05);
            align-items: center;
        }
        .value-display { font-family: 'Share Tech Mono', monospace; font-weight: bold; color: var(--neon-accent); }

        /* Pass Screen */
        .pass-container {
            text-align: center; display: flex; flex-direction: column; align-items: center; gap: 20px;
            padding: 30px 10px;
        }
        .phone-avatar {
            font-size: 4rem; color: var(--neon-accent); animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(5deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

    </style>
</head>
<body>

    <header>
        <button class="btn-icon" onclick="location.href='../index.html'"><i class="ri-home-4-line"></i></button>
        <h1>FERMI ESTIMATION</h1>
        <button class="btn-icon" onclick="location.reload()"><i class="ri-refresh-line"></i></button>
    </header>

    <!-- STEP 1: Add Players -->
    <div class="card active" id="screen-players">
        <h2>참가자 등록</h2>
        <p class="desc">페르미 추정은 핫시트(폰 넘기기) 게임입니다. 최소 2명 이상 등록해 주세요.</p>
        
        <div class="player-input-row">
            <input type="text" class="input-text" id="player-name-input" placeholder="이름을 입력하세요..." onkeydown="if(event.key==='Enter') addPlayer()">
            <button class="btn-icon" onclick="addPlayer()"><i class="ri-user-add-line"></i></button>
        </div>

        <div id="player-list-chips" style="display:flex; flex-wrap:wrap; gap:8px; min-height:40px; align-items:center;">
            <!-- Player chips will be shown here -->
        </div>

        <button class="btn-primary" onclick="startGame()">게임 시작하기</button>
    </div>

    <!-- STEP 2: Player Turn Estimating -->
    <div class="card" id="screen-estimate">
        <h2 id="turn-lbl">플레이어의 차례</h2>
        <p class="desc" style="color:var(--text-main); font-size:1.1rem; font-weight:800; margin: 10px 0;" id="question-text">
            질문이 표시됩니다.
        </p>

        <div class="fermi-slider-container">
            <div style="font-size:0.85rem; color:var(--text-muted); text-align:center;">당신의 추정치 (10의 거듭제곱으로 추정)</div>
            <div class="exponent-indicator" id="exponent-display">10⁴ (10,000)</div>
            <input type="range" class="fermi-slider" id="estimate-slider" min="0" max="15" step="1" value="4" oninput="onSliderMove()">
        </div>

        <button class="btn-primary" onclick="submitEstimate()">추정값 제출</button>
    </div>

    <!-- STEP 3: Pass Phone -->
    <div class="card" id="screen-pass">
        <div class="pass-container">
            <div class="phone-avatar"><i class="ri-smartphone-line"></i></div>
            <h2 id="pass-message">휴대폰 전달하기</h2>
            <p class="desc" id="pass-desc">다음 플레이어에게 휴대폰을 넘겨주세요.</p>
            <button class="btn-primary" style="width:100%;" onclick="proceedAfterPass()">추정 시작</button>
        </div>
    </div>

    <!-- STEP 4: Reveal Results -->
    <div class="card" id="screen-reveal">
        <h2>추정 결과 공개</h2>
        <p class="desc" style="color:var(--text-main); font-size:1.1rem; font-weight:800; margin:10px 0;" id="reveal-question"></p>
        
        <div style="background:rgba(255,255,255,0.03); padding:20px; border-radius:12px; text-align:center; border: 1px solid var(--border-color); margin:15px 0;">
            <div style="font-size:0.9rem; color:var(--text-muted);">실제 과학적 추정값 (참값)</div>
            <div class="exponent-indicator" id="actual-value-display" style="color:var(--neon-pink); text-shadow:0 0 10px rgba(244, 63, 94, 0.4);">10⁶ (1,000,000)</div>
            <div style="font-size:0.85rem; color:var(--text-muted);" id="actual-explanation">상세 설명이 나옵니다.</div>
        </div>

        <div class="list-container" id="reveal-list">
            <!-- Players estimates with point differences -->
        </div>

        <button class="btn-primary" onclick="nextRound()">다음 라운드</button>
    </div>

    <!-- STEP 5: Final Scoreboard -->
    <div class="card" id="screen-scoreboard">
        <h2>최종 스코어보드</h2>
        <p class="desc">정답에 가장 오차가 적었던 최고의 이공계 브레인은 누구일까요?</p>
        
        <div class="list-container" id="scoreboard-list">
            <!-- Rankings -->
        </div>

        <button class="btn-primary" onclick="location.reload()">새 게임 시작</button>
    </div>

    <script>
        let QUESTIONS = [
            {
                q: "대한민국 서울에 설치되어 있는 맨홀 뚜껑의 총 개수는 약 몇 개일까요?",
                ans: 5,
                desc: "서울시 통계에 따르면 서울 시내 맨홀 뚜껑은 2023년 기준 약 62만 4,318개(10^5.7)가 설치되어 있습니다."
            },
            {
                q: "하루 동안 전 세계에서 소비되는 커피의 총 잔 수는 약 몇 잔일까요?",
                ans: 9,
                desc: "국제커피협회(ICO)에 따르면 전 세계적으로 매일 약 22억 5천만 잔(2.25 * 10^9)의 커피가 소비됩니다."
            },
            {
                q: "지구 전체에 살고 있는 모든 개미의 개체 수는 총 약 몇 마리일까요?",
                ans: 16,
                desc: "홍콩대 연구팀의 2022년 연구에 따르면 지구상 개미의 총 개체 수는 약 2경 마리(2 * 10^16)로 추정됩니다."
            },
            {
                q: "지구의 적도를 따라 지구 한 바퀴를 돌 때의 총 길이는 약 몇 미터(m)일까요?",
                ans: 7,
                desc: "지구 적도 둘레의 실제 거리는 40,075.017km로, 미터로 환산하면 약 4천만 미터(4.007 * 10^7)입니다."
            },
            {
                q: "하루 동안 지구 전역에 치는 번개의 총 횟수는 약 몇 번일까요?",
                ans: 6,
                desc: "매초 지구에서는 약 100회의 번개가 치며, 하루 24시간 동안 합산하면 약 864만 번(8.64 * 10^6) 발생합니다."
            },
            {
                q: "일반적인 성인 남성의 몸을 구성하는 전체 세포의 수는 약 몇 개일까요?",
                ans: 13,
                desc: "생물학적 추정에 따르면 체중 70kg의 성인 남성은 약 30조 개(3 * 10^13)의 세포로 이루어져 있습니다."
            },
            {
                q: "지구에서 태양까지의 평균 거리는 약 몇 킬로미터(km)일까요?",
                ans: 8,
                desc: "지구에서 태양까지의 평균 거리는 1AU로, 약 1억 4,960만 킬로미터(1.496 * 10^8)입니다."
            },
            {
                q: "현재 전 세계에 존재하는 모든 자동차의 총 대수는 약 몇 대일까요?",
                ans: 9,
                desc: "워즈오토(WardsAuto) 등에 따르면 전 세계 운행 중인 자동차는 약 14억 4천만 대(1.44 * 10^9) 이상입니다."
            },
            {
                q: "일반적인 책 한 권(약 300페이지)에 들어있는 글자(문자) 수는 약 몇 개일까요?",
                ans: 5,
                desc: "한 페이지에 약 1,000~1,500자가 들어간다고 가정하면, 300페이지 책은 약 30만~45만 자(3~4 * 10^5)를 포함합니다."
            },
            {
                q: "인류 역사상 지금까지 태어난 모든 사람의 총 수는 약 몇 명일까요?",
                ans: 10,
                desc: "미국 인구조사국(PRB)의 추산에 따르면 기원전 5만 년부터 지금까지 태어난 인간은 약 1,170억 명(1.17 * 10^10)입니다."
            },
            {
                q: "현재 유튜브(YouTube)에 1분마다 업로드되는 동영상의 총 길이는 약 몇 시간일까요?",
                ans: 2,
                desc: "유튜브 공식 통계 등에 따르면 1분마다 전 세계에서 약 500시간(5 * 10^2) 분량의 동영상이 업로드됩니다."
            },
            {
                q: "인간의 뇌에 있는 신경 세포(뉴런)의 총 개수는 약 몇 개일까요?",
                ans: 10,
                desc: "뇌과학자들의 연구에 따르면 성인의 뇌에는 약 860억 개(8.6 * 10^10)의 뉴런이 존재합니다."
            },
            {
                q: "1년(365일)을 초(second) 단위로 환산하면 약 몇 초일까요?",
                ans: 7,
                desc: "1년은 365일 * 24시간 * 60분 * 60초 = 31,536,000초(3.15 * 10^7)입니다."
            },
            {
                q: "아마존 열대우림에 서식하는 나무의 총 그루 수는 약 몇 그루일까요?",
                ans: 11,
                desc: "생태학자들의 실측 및 위성 자료 분석에 따르면 아마존에는 약 3,900억 그루(3.9 * 10^11)의 나무가 있습니다."
            },
            {
                q: "올림픽 규격 수영장(50m x 25m x 2m)을 가득 채우는 물의 양은 약 몇 리터(L)일까요?",
                ans: 6,
                desc: "부피는 2,500 입방미터(m³)이며, 1m³는 1,000L이므로 총 2,500,000 리터(2.5 * 10^6)의 물이 들어갑니다."
            },
            {
                q: "대한민국의 주민등록 기준 총 인구 수는 약 몇 명일까요?",
                ans: 7,
                desc: "행정안전부 주민등록 인구 통계 기준, 대한민국의 인구 수는 약 5,130만 명(5.13 * 10^7) 수준입니다."
            },
            {
                q: "현재 전 세계에 분포하고 있는 프랜차이즈 '맥도날드'의 총 매장 수는 약 몇 개일까요?",
                ans: 4,
                desc: "맥도날드 공식 보고서 기준, 전 세계 100여 개국에 걸쳐 있는 총 매장 수는 약 4만 개(4 * 10^4) 수준입니다."
            },
            {
                q: "일반적인 A4 용지 1만 장을 차곡차곡 쌓았을 때의 총 두께는 약 몇 밀리미터(mm)일까요?",
                ans: 3,
                desc: "보통 A4 용지 1장의 두께는 약 0.1mm입니다. 따라서 10,000장을 쌓으면 약 1,000mm(1.0 * 10^3)의 두께가 됩니다."
            },
            {
                q: "프랑스 파리에 있는 에펠탑의 총 무게는 약 몇 그램(g)일까요?",
                ans: 10,
                desc: "에펠탑의 총 중량은 약 10,100톤으로, kg으로 환산하면 10,100,000kg이며, g으로 환산하면 약 101억 그램(1.01 * 10^10)입니다."
            },
            {
                q: "대한민국에 등록된 이동전화(스마트폰 포함)의 총 회선 수는 약 몇 개일까요?",
                ans: 7,
                desc: "과학기술정보통신부 무선통신서비스 가입 현황에 따르면 가입 회선 수는 약 5,600만 개(5.6 * 10^7) 수준입니다."
            },
            {
                q: "컴퓨터 데이터 용량 단위인 1기가바이트(1GB)는 약 몇 바이트(Byte)일까요?",
                ans: 9,
                desc: "1GB는 정확히 1,073,741,824 바이트(약 1.07 * 10^9) 수준입니다."
            },
            {
                q: "지구상에 살고 있는 약 80억 명의 인간의 몸무게를 전부 합치면 약 몇 킬로그램(kg)일까요?",
                ans: 11,
                desc: "성인과 아이를 포함한 인류 전체의 평균 몸무게를 약 60kg으로 잡고 80억 명을 곱하면 약 4,800억 킬로그램(4.8 * 10^11)이 됩니다."
            },
            {
                q: "로또 6/45 1등에 당첨될 이론적 확률은 1분의 몇 일까요?",
                ans: 6,
                desc: "로또 1등에 당첨될 수학적 확률은 1/8,145,060로, 분모를 지수 표기법으로 나타내면 약 814만(8.14 * 10^6)입니다."
            },
            {
                q: "매년 전 세계에서 새로 태어나는 아기(신생아)의 수는 약 몇 명일까요?",
                ans: 8,
                desc: "유엔(UN) 세계인구추계 통계에 따르면 매년 약 1억 3,400만 명(1.34 * 10^8)의 아기가 태어납니다."
            },
            {
                q: "대한민국 국민들이 1년 동안 소비하는 인스턴트 라면의 총 개수는 약 몇 개일까요?",
                ans: 9,
                desc: "세계라면협회(WINA) 통계에 따르면 한국의 연간 라면 소비량은 약 39억 개(3.9 * 10^9)로, 1인당 연간 약 70~80개를 소비합니다."
            },
            {
                q: "전 세계에 등록된 활성화된 인터넷 도메인(인터넷 주소)의 총 개수는 약 몇 개일까요?",
                ans: 8,
                desc: "베리사인(Verisign) 시장 통계 보고서 기준 등록된 전체 도메인 수는 약 3억 5,000만 개(3.5 * 10^8)에 달합니다."
            },
            {
                q: "남극 대륙을 뒤덮고 있는 거대한 빙하의 평균 두께는 약 몇 센티미터(cm)일까요?",
                ans: 5,
                desc: "남극 빙하의 평균 두께는 약 2,160m(2.16km)로, 센티미터로 변환 시 약 216,000cm(2.16 * 10^5)입니다."
            },
            {
                q: "세계 최고봉인 에베레스트 산의 해발 고도는 약 몇 밀리미터(mm)일까요?",
                ans: 6,
                desc: "공식 고도 8,848.86m를 밀리미터로 환산하면 약 884만 8,860mm(8.84 * 10^6)입니다."
            },
            {
                q: "전 세계 바닷물 전체에 녹아 있는 소금(염화나트륨)의 총 무게는 약 몇 톤(ton)일까요?",
                ans: 16,
                desc: "지구상의 바닷물에 포함된 총 소금의 무게는 약 5경 톤(5 * 10^16)에 달해, 육지를 150m 두께로 덮을 수 있는 막대한 양입니다."
            },
            {
                q: "오대양 육대주를 모두 합한 지구 표면의 총 면적은 약 몇 제곱킬로미터(km²)일까요?",
                ans: 8,
                desc: "지구 전체 표면적은 약 5억 1,006만 5,600 제곱킬로미터(5.1 * 10^8) 수준입니다."
            }
        ];

        let players = [];
        let currentRound = 0;
        let estimateTurnIndex = 0; // Current player estimating
        const MAX_ROUNDS = 5; // 게임당 최대 질문 수

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function addPlayer() {
            const input = document.getElementById('player-name-input');
            const name = input.value.trim();
            if (!name) return;
            if (players.some(p => p.name === name)) {
                alert('이미 등록된 이름입니다.');
                return;
            }
            players.push({ name: name, score: 0, currentEstimate: 4 });
            input.value = '';
            renderPlayerChips();
        }

        function renderPlayerChips() {
            const chips = document.getElementById('player-list-chips');
            chips.innerHTML = '';
            players.forEach((p, idx) => {
                const chip = document.createElement('div');
                chip.style.cssText = 'background:rgba(56, 189, 248, 0.15); border:1px solid var(--border-color); padding:6px 12px; border-radius:30px; font-size:0.9rem; display:flex; align-items:center; gap:8px;';
                chip.innerHTML = `<span>${p.name}</span><i class="ri-close-line" style="cursor:pointer;" onclick="removePlayer(${idx})"></i>`;
                chips.appendChild(chip);
            });
        }

        function removePlayer(idx) {
            players.splice(idx, 1);
            renderPlayerChips();
        }

        function startGame() {
            if (players.length < 2) {
                alert('최소 2명 이상 등록해 주세요!');
                return;
            }
            // 문제 순서 랜덤 섞기
            shuffle(QUESTIONS);
            // 점수 초기화
            players.forEach(p => p.score = 0);
            
            currentRound = 0;
            startRound();
        }

        function startRound() {
            estimateTurnIndex = 0;
            showEstimateScreen();
        }

        function formatExponent(val) {
            let num = Math.pow(10, val);
            return `10${getSuperscript(val)} (${num.toLocaleString()})`;
        }

        function getSuperscript(val) {
            const sups = {
                0: '⁰', 1: '¹', 2: '²', 3: '³', 4: '⁴', 5: '⁵', 
                6: '⁶', 7: '⁷', 8: '⁸', 9: '⁹', 10: '¹⁰', 
                11: '¹¹', 12: '¹²', 13: '¹³', 14: '¹⁴', 15: '¹⁵'
            };
            return sups[val] || '';
        }

        function showEstimateScreen() {
            document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
            document.getElementById('screen-estimate').classList.add('active');

            const current = players[estimateTurnIndex];
            const q = QUESTIONS[currentRound];

            document.getElementById('turn-lbl').innerText = `${current.name}님의 추정 차례`;
            document.getElementById('question-text').innerText = q.q;

            // Reset slider to default
            document.getElementById('estimate-slider').value = 4;
            onSliderMove();
        }

        function onSliderMove() {
            const val = parseInt(document.getElementById('estimate-slider').value);
            document.getElementById('exponent-display').innerText = formatExponent(val);
        }

        function submitEstimate() {
            const val = parseInt(document.getElementById('estimate-slider').value);
            players[estimateTurnIndex].currentEstimate = val;

            estimateTurnIndex++;
            if (estimateTurnIndex < players.length) {
                showPassScreen();
            } else {
                showRevealScreen();
            }
        }

        function showPassScreen() {
            document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
            document.getElementById('screen-pass').classList.add('active');

            document.getElementById('pass-message').innerText = `명탐정 ${players[estimateTurnIndex].name}님에게 패스`;
            document.getElementById('pass-desc').innerText = `이어서 페르미 추정에 참가해 주세요!`;
        }

        function proceedAfterPass() {
            showEstimateScreen();
        }

        function showRevealScreen() {
            document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
            document.getElementById('screen-reveal').classList.add('active');

            const q = QUESTIONS[currentRound];
            document.getElementById('reveal-question').innerText = q.q;
            document.getElementById('actual-value-display').innerText = formatExponent(q.ans);
            document.getElementById('actual-explanation').innerText = q.desc;

            // Compute scores
            const list = document.getElementById('reveal-list');
            list.innerHTML = '';

            players.forEach(p => {
                const diff = Math.abs(p.currentEstimate - q.ans);
                // Points calculation: 100 - (diff * 15)
                let pts = 100 - (diff * 20);
                if (pts < 0) pts = 0;
                p.score += pts;

                const item = document.createElement('div');
                item.className = 'list-item';
                item.innerHTML = `
                    <div>
                        <strong style="color:#fff;">${p.name}</strong><br>
                        <span style="font-size:0.8rem; color:var(--text-muted);">오차: 10의 ${diff}제곱배</span>
                    </div>
                    <div style="text-align:right;">
                        <span class="value-display">${formatExponent(p.currentEstimate)}</span><br>
                        <span style="font-size:0.9rem; color:var(--neon-accent); font-weight:bold;">+${pts}점</span>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        function nextRound() {
            currentRound++;
            if (currentRound >= MAX_ROUNDS || currentRound >= QUESTIONS.length) {
                showFinalScoreboard();
            } else {
                startRound();
            }
        }

        function showFinalScoreboard() {
            document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
            document.getElementById('screen-scoreboard').classList.add('active');

            const sorted = [...players].sort((a, b) => b.score - a.score);
            const list = document.getElementById('scoreboard-list');
            list.innerHTML = '';

            sorted.forEach((p, idx) => {
                const item = document.createElement('div');
                item.className = 'list-item';
                item.innerHTML = `
                    <span style="font-weight:bold; font-size:1.1rem; color:#fff;">${idx + 1}등. ${p.name}</span>
                    <span style="font-size:1.2rem; font-weight:800; color:var(--neon-accent);">${p.score} 점</span>
                `;
                list.appendChild(item);
            });
        }

    </script>
</body>
</html>
