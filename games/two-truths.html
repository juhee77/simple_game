<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>두 개의 진실, 하나의 거짓</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&family=Outfit:wght@800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0915;
            --panel-bg: rgba(30, 20, 50, 0.4);
            --border-color: rgba(168, 85, 247, 0.3);
            --text-main: #f3e8ff;
            --text-muted: #c084fc;
            --neon-accent: #d946ef;
            --neon-green: #10b981;
            --neon-red: #ef4444;
            --glass-glow: 0 0 15px rgba(217, 70, 239, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(88, 28, 135, 0.4) 0, transparent 50%),
                radial-gradient(at 100% 100%, rgba(217, 70, 239, 0.15) 0, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            padding: 10px;
        }

        header {
            width: 100%; max-width: 500px; padding: 15px;
            display: flex; justify-content: space-between; align-items: center;
        }
        h1 { font-family: 'Outfit', sans-serif; font-size: 1.6rem; letter-spacing: 1px; color: var(--neon-accent); text-shadow: var(--glass-glow); }

        .btn-icon {
            background: var(--panel-bg); border: 1px solid var(--border-color); color: white;
            width: 40px; height: 40px; border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center; font-size: 1.2rem;
            transition: all 0.2s;
        }
        .btn-icon:hover { background: rgba(168, 85, 247, 0.2); transform: scale(1.05); }

        .card {
            width: 100%; max-width: 500px;
            background: var(--panel-bg); backdrop-filter: blur(15px);
            border: 1px solid var(--border-color); border-radius: 20px;
            padding: 25px; margin: 15px 0;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            display: none; flex-direction: column; gap: 20px;
        }
        .card.active { display: flex; }

        .card h2 { font-size: 1.4rem; text-align: center; color: var(--neon-accent); margin-bottom: 5px; }
        .card p.desc { font-size: 0.9rem; color: var(--text-muted); text-align: center; line-height: 1.4; }

        /* Setup Screen list */
        .player-input-row { display: flex; gap: 10px; }
        .input-text {
            flex: 1; padding: 12px 15px; background: rgba(0,0,0,0.3);
            border: 1px solid var(--border-color); border-radius: 10px;
            color: white; font-size: 1rem; outline: none; transition: all 0.2s;
        }
        .input-text:focus { border-color: var(--neon-accent); box-shadow: 0 0 10px rgba(217, 70, 239, 0.2); }

        .btn-primary {
            background: linear-gradient(135deg, var(--neon-accent), #a855f7);
            color: white; border: none; padding: 14px; border-radius: 12px;
            font-size: 1.05rem; font-weight: 800; cursor: pointer;
            transition: all 0.2s; text-align: center;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: var(--glass-glow); }

        /* Writing Screen */
        .statement-field {
            display: flex; flex-direction: column; gap: 8px;
        }
        .statement-label { font-size: 0.95rem; font-weight: 600; display: flex; justify-content: space-between; }
        .radio-lie { display: none; }
        .radio-label {
            padding: 5px 12px; font-size: 0.8rem; border-radius: 20px;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            cursor: pointer; transition: all 0.2s;
        }
        .radio-lie:checked + .radio-label {
            background: rgba(239, 68, 68, 0.2); border-color: var(--neon-red); color: var(--neon-red);
            font-weight: bold;
        }

        /* Pass Screen */
        .pass-container {
            text-align: center; display: flex; flex-direction: column; align-items: center; gap: 20px;
            padding: 30px 10px;
        }
        .phone-avatar {
            font-size: 4rem; color: var(--neon-accent); animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(5deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        /* Guess Screen Card Choices */
        .choice-btn {
            background: rgba(255,255,255,0.03); border: 1px solid var(--border-color);
            padding: 16px; border-radius: 12px; color: var(--text-main);
            text-align: left; font-size: 1rem; cursor: pointer; transition: all 0.2s;
            position: relative; overflow: hidden;
        }
        .choice-btn:hover { background: rgba(168, 85, 247, 0.1); transform: scale(1.01); }
        .choice-btn.selected { border-color: var(--neon-accent); background: rgba(217, 70, 239, 0.1); }

        /* Scoreboard & Leaderboard styling */
        .leaderboard-list {
            display: flex; flex-direction: column; gap: 10px; margin: 15px 0;
        }
        .leaderboard-item {
            display: flex; justify-content: space-between; padding: 12px 20px;
            background: rgba(255,255,255,0.03); border-radius: 10px; border: 1px solid rgba(255,255,255,0.05);
        }
        .player-tag { font-weight: 600; }
        .score-tag { font-weight: 800; color: var(--neon-accent); }

        .badge {
            display: inline-block; padding: 4px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: bold;
        }
        .badge.true { background: rgba(16, 185, 129, 0.15); color: var(--neon-green); border: 1px solid var(--neon-green); }
        .badge.lie { background: rgba(239, 68, 68, 0.15); color: var(--neon-red); border: 1px solid var(--neon-red); }

    </style>
</head>
<body>

    <header>
        <button class="btn-icon" onclick="location.href='../index.html'"><i class="ri-home-4-line"></i></button>
        <h1>TRUTH & LIE</h1>
        <button class="btn-icon" onclick="location.reload()"><i class="ri-refresh-line"></i></button>
    </header>

    <!-- STEP 1: Add Players -->
    <div class="card active" id="screen-players">
        <h2>플레이어 등록</h2>
        <p class="desc">폰을 돌아가며 사용할 사람들을 등록하세요. 최소 2명 이상 필요합니다.</p>
        
        <div class="player-input-row">
            <input type="text" class="input-text" id="player-name-input" placeholder="이름을 입력하세요..." onkeydown="if(event.key==='Enter') addPlayer()">
            <button class="btn-icon" onclick="addPlayer()"><i class="ri-user-add-line"></i></button>
        </div>

        <div id="player-list-chips" style="display:flex; flex-wrap:wrap; gap:8px; min-height:40px; align-items:center;">
            <!-- Player chips will be shown here -->
        </div>

        <button class="btn-primary" onclick="startSetupPhase()">게임 시작하기</button>
    </div>

    <!-- STEP 2: Write Statements (Writer's Turn) -->
    <div class="card" id="screen-write">
        <h2 id="writer-title">진실과 거짓 쓰기</h2>
        <p class="desc">자신에 대한 진실 2개와 거짓 1개를 작성하세요. 거짓 항목을 반드시 표시해야 합니다.</p>

        <div class="statement-field">
            <div class="statement-label">
                <span>첫 번째 이야기</span>
                <label>
                    <input type="radio" name="lie-index" value="0" class="radio-lie" checked>
                    <span class="radio-label">거짓 표시 🚨</span>
                </label>
            </div>
            <input type="text" class="input-text statement-input" placeholder="첫 번째 이야기를 작성하세요...">
        </div>

        <div class="statement-field">
            <div class="statement-label">
                <span>두 번째 이야기</span>
                <label>
                    <input type="radio" name="lie-index" value="1" class="radio-lie">
                    <span class="radio-label">거짓 표시 🚨</span>
                </label>
            </div>
            <input type="text" class="input-text statement-input" placeholder="두 번째 이야기를 작성하세요...">
        </div>

        <div class="statement-field">
            <div class="statement-label">
                <span>세 번째 이야기</span>
                <label>
                    <input type="radio" name="lie-index" value="2" class="radio-lie">
                    <span class="radio-label">거짓 표시 🚨</span>
                </label>
            </div>
            <input type="text" class="input-text statement-input" placeholder="세 번째 이야기를 작성하세요...">
        </div>

        <button class="btn-primary" onclick="submitStatements()">작성 완료</button>
    </div>

    <!-- STEP 3: Pass Phone -->
    <div class="card" id="screen-pass">
        <div class="pass-container">
            <div class="phone-avatar"><i class="ri-smartphone-line"></i></div>
            <h2 id="pass-message">휴대폰 전달하기</h2>
            <p class="desc" id="pass-desc">이야기가 숨겨졌습니다. 이제 휴대폰을 다음 플레이어에게 넘겨주세요.</p>
            <button class="btn-primary" style="width:100%;" id="btn-next-action" onclick="proceedAfterPass()">준비 완료</button>
        </div>
    </div>

    <!-- STEP 4: Guess Lie (Guesser's Turn) -->
    <div class="card" id="screen-guess">
        <h2 id="guesser-title">거짓 찾기</h2>
        <p class="desc"><strong id="writer-name-label">누구</strong>의 이야기 중 **거짓**을 찾아 터치하세요.</p>

        <div id="choices-list" style="display:flex; flex-direction:column; gap:12px; margin: 10px 0;">
            <!-- 3 statement choices will be here -->
        </div>

        <button class="btn-primary" id="btn-submit-guess" onclick="submitGuess()">정답 확인</button>
    </div>

    <!-- STEP 5: Guess Result -->
    <div class="card" id="screen-result">
        <h2>투표 결과</h2>
        <div id="result-statements-summary" style="display:flex; flex-direction:column; gap:12px; margin: 15px 0;">
            <!-- Statements revealed as True/Lie -->
        </div>
        <p class="desc" id="result-feedback" style="font-size:1.1rem; font-weight:bold; margin-bottom:15px;"></p>
        <button class="btn-primary" onclick="nextRound()">다음 차례로</button>
    </div>

    <!-- STEP 6: Final Leaderboard -->
    <div class="card" id="screen-leaderboard">
        <h2>최종 스코어보드</h2>
        <p class="desc">정답을 가장 많이 맞춘 최고의 명탐정은 누구일까요?</p>
        
        <div class="leaderboard-list" id="final-leaderboard-items">
            <!-- Rank items -->
        </div>

        <button class="btn-primary" onclick="location.reload()">새 게임 시작</button>
    </div>

    <script>
        let players = [];
        let currentPlayerIndex = 0; // The player currently writing
        let guesserPlayerIndex = 0; // The player currently guessing
        let roundData = {
            writer: '',
            statements: [],
            lieIndex: -1,
            selectedGuess: -1
        };

        const synth = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            // iOS는 컨텍스트가 suspended로 시작하므로 재생 직전에 깨운다.
            if (synth.state === 'suspended') synth.resume();
            const osc = synth.createOscillator();
            const gain = synth.createGain();
            osc.connect(gain);
            gain.connect(synth.destination);

            if (type === 'success') {
                osc.frequency.setValueAtTime(523.25, synth.currentTime); // C5
                osc.frequency.setValueAtTime(659.25, synth.currentTime + 0.15); // E5
                osc.frequency.setValueAtTime(783.99, synth.currentTime + 0.3); // G5
                gain.gain.setValueAtTime(0.1, synth.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, synth.currentTime + 0.5);
                osc.start();
                osc.stop(synth.currentTime + 0.5);
            } else if (type === 'fail') {
                osc.frequency.setValueAtTime(220, synth.currentTime); // A3
                osc.frequency.setValueAtTime(147, synth.currentTime + 0.2); // D3
                gain.gain.setValueAtTime(0.15, synth.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, synth.currentTime + 0.6);
                osc.start();
                osc.stop(synth.currentTime + 0.6);
            } else {
                osc.frequency.setValueAtTime(440, synth.currentTime); // A4
                gain.gain.setValueAtTime(0.05, synth.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, synth.currentTime + 0.2);
                osc.start();
                osc.stop(synth.currentTime + 0.2);
            }
        }

        function addPlayer() {
            const input = document.getElementById('player-name-input');
            const name = input.value.trim();
            if (!name) return;
            if (players.some(p => p.name === name)) {
                alert('이미 등록된 이름입니다.');
                return;
            }
            players.push({ name: name, score: 0 });
            input.value = '';
            renderPlayerChips();
            playSound('neutral');
        }

        function renderPlayerChips() {
            const chips = document.getElementById('player-list-chips');
            chips.innerHTML = '';
            players.forEach((p, idx) => {
                const chip = document.createElement('div');
                chip.style.cssText = 'background:rgba(217, 70, 239, 0.15); border:1px solid var(--border-color); padding:6px 12px; border-radius:30px; font-size:0.9rem; display:flex; align-items:center; gap:8px;';
                chip.innerHTML = `<span>${escapeHtml(p.name)}</span><i class="ri-close-line" style="cursor:pointer;" onclick="removePlayer(${idx})"></i>`;
                chips.appendChild(chip);
            });
        }

        function removePlayer(idx) {
            players.splice(idx, 1);
            renderPlayerChips();
            playSound('neutral');
        }

        function startSetupPhase() {
            if (players.length < 2) {
                alert('최소 2명 이상의 플레이어가 참여해야 합니다!');
                return;
            }
            currentPlayerIndex = 0;
            showWriterScreen();
        }

        function showWriterScreen() {
            document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
            document.getElementById('screen-write').classList.add('active');
            
            const currentWriter = players[currentPlayerIndex].name;
            document.getElementById('writer-title').innerText = `${currentWriter}님의 차례`;
            
            // Reset inputs
            const inputs = document.querySelectorAll('.statement-input');
            inputs.forEach(i => i.value = '');
            document.querySelectorAll('.radio-lie')[0].checked = true;
            playSound('neutral');
        }

        function submitStatements() {
            const inputs = document.querySelectorAll('.statement-input');
            const statements = Array.from(inputs).map(i => i.value.trim());
            
            if (statements.some(s => s === '')) {
                alert('모든 문장을 입력해 주세요!');
                return;
            }

            const lieRadio = document.querySelector('input[name="lie-index"]:checked');
            const lieIdx = parseInt(lieRadio.value);

            roundData.writer = players[currentPlayerIndex].name;
            roundData.statements = statements;
            roundData.lieIndex = lieIdx;
            roundData.selectedGuess = -1;

            // Figure out who the guesser will be (next player in the array)
            guesserPlayerIndex = (currentPlayerIndex + 1) % players.length;

            showPassScreen(`guesser`);
        }

        function showPassScreen(target) {
            document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
            document.getElementById('screen-pass').classList.add('active');

            if (target === 'guesser') {
                document.getElementById('pass-message').innerText = `명탐정 ${players[guesserPlayerIndex].name}님에게 패스`;
                document.getElementById('pass-desc').innerText = `${roundData.writer}님이 작성한 문장 중 진짜 '거짓'을 맞혀보세요.`;
            } else if (target === 'writer') {
                document.getElementById('pass-message').innerText = `출제자 ${players[currentPlayerIndex].name}님에게 패스`;
                document.getElementById('pass-desc').innerText = `이야기 출제와 진실/거짓 지정을 위해 폰을 전해주십시오.`;
            }
            playSound('neutral');
        }

        function proceedAfterPass() {
            showGuessScreen();
        }

        function showGuessScreen() {
            document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
            document.getElementById('screen-guess').classList.add('active');

            document.getElementById('guesser-title').innerText = `${players[guesserPlayerIndex].name}님의 추리`;
            document.getElementById('writer-name-label').innerText = roundData.writer;

            const choices = document.getElementById('choices-list');
            choices.innerHTML = '';
            roundData.statements.forEach((s, idx) => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.innerText = s;
                btn.onclick = () => {
                    document.querySelectorAll('.choice-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    roundData.selectedGuess = idx;
                    playSound('neutral');
                };
                choices.appendChild(btn);
            });
        }

        function submitGuess() {
            if (roundData.selectedGuess === -1) {
                alert('거짓이라고 생각되는 문장을 골라주세요!');
                return;
            }

            showResultScreen();
        }

        function showResultScreen() {
            document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
            document.getElementById('screen-result').classList.add('active');

            const isCorrect = (roundData.selectedGuess === roundData.lieIndex);
            const guesser = players[guesserPlayerIndex];

            if (isCorrect) {
                guesser.score += 10; // 10 pts for correct guess
                document.getElementById('result-feedback').innerText = `🎉 정답입니다! ${guesser.name}님 +10점 획득!`;
                playSound('success');
            } else {
                document.getElementById('result-feedback').innerText = `😢 오답입니다! 거짓은 다른 문장이었습니다.`;
                playSound('fail');
            }

            const summary = document.getElementById('result-statements-summary');
            summary.innerHTML = '';
            roundData.statements.forEach((s, idx) => {
                const item = document.createElement('div');
                item.style.cssText = 'padding: 12px 20px; border-radius:10px; display:flex; justify-content:space-between; align-items:center; background:rgba(255,255,255,0.03);';
                
                const isLie = (idx === roundData.lieIndex);
                const badge = document.createElement('span');
                badge.className = isLie ? 'badge lie' : 'badge true';
                badge.innerText = isLie ? '거짓 (Lie)' : '진실 (True)';

                const span = document.createElement('span');
                span.innerText = s;
                span.style.flex = '1';
                span.style.marginRight = '10px';

                item.appendChild(span);
                item.appendChild(badge);

                // Highlight guess
                if (idx === roundData.selectedGuess) {
                    item.style.border = '2px solid ' + (isCorrect ? 'var(--neon-green)' : 'var(--neon-red)');
                }
                summary.appendChild(item);
            });
        }

        function nextRound() {
            currentPlayerIndex++;
            if (currentPlayerIndex >= players.length) {
                // Game Finished!
                showLeaderboard();
            } else {
                // Next player writes their statements
                showPassScreen('writer');
                // Replace Proceed function since the target is a writer now
                document.getElementById('btn-next-action').onclick = () => {
                    showWriterScreen();
                    // Restore original
                    document.getElementById('btn-next-action').onclick = proceedAfterPass;
                };
            }
        }

        function showLeaderboard() {
            document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
            document.getElementById('screen-leaderboard').classList.add('active');

            // Sort by score
            const sorted = [...players].sort((a,b) => b.score - a.score);
            const list = document.getElementById('final-leaderboard-items');
            list.innerHTML = '';
            sorted.forEach((p, idx) => {
                const item = document.createElement('div');
                item.className = 'leaderboard-item';
                item.innerHTML = `<span class="player-tag">${idx + 1}등. ${escapeHtml(p.name)}</span><span class="score-tag">${p.score} 점</span>`;
                list.appendChild(item);
            });
            playSound('success');
        }

    </script>
<script type="application/json" id="game-rules">
{
 "title": "두 개의 진실, 하나의 거짓",
 "goal": "세 이야기 중 하나뿐인 거짓말을 골라내세요.",
 "steps": [
  "참가자를 등록합니다.",
  "자기 차례에 자신에 대한 이야기 세 가지를 씁니다. 그중 둘은 진실, 하나는 거짓입니다.",
  "폰을 넘겨 나머지가 어느 것이 거짓인지 고릅니다.",
  "정답을 공개하고 맞힌 사람이 점수를 얻습니다.",
  "모두 한 번씩 출제하고 최고 점수를 낸 사람이 승리합니다."
 ],
 "tips": [
  "거짓말은 너무 황당하지 않게, 진실은 조금 의외인 것으로 고르면 어렵습니다."
 ],
 "players": "2~12인",
 "time": "약 15분"
}
</script>
<script src="../scripts/game-common.js?v=2"></script>
</body>
</html>
