<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>한 줄 눈사람 - 미니게임 천국</title>
    <meta name="description" content="12월 한 달, 하루 한 줄씩 쓰면 눈덩이가 굴러 커지고 31일에 나의 12월 눈사람이 완성돼요.">
    <link rel="stylesheet" href="../styles/pretendard.css?v=c17883c9">
    <link rel="stylesheet" href="../styles/design-system.css?v=d12c2b80">
    <link rel="stylesheet" href="../styles/game-common.css?v=2187f848">
    <script src="../scripts/game-common.js?v=efdc1560"></script>
    <style>
        :root {
            /* 이 페이지만의 겨울 낮 색 */
            --winter-1: #dbeafe;
            --winter-2: #eef4ff;
            --ice: #1d4ed8;
            --carrot: #f97316;
            --scarf: #dc2626;
            --cream: #fffaf0;
        }

        body {
            padding-top: max(1.25rem, env(safe-area-inset-top));
            padding-bottom: max(5rem, env(safe-area-inset-bottom));
        }

        @media (max-width: 768px) {
            body {
                padding-left: max(1rem, env(safe-area-inset-left));
                padding-right: max(1rem, env(safe-area-inset-right));
                padding-top: max(1rem, env(safe-area-inset-top));
            }
        }

        [hidden] {
            display: none !important;
        }

        .wrap {
            max-width: 680px;
            margin: 0 auto;
        }

        .wrap .game-header {
            margin-bottom: 1rem;
        }

        .panel {
            padding: 18px;
            margin-bottom: 12px;
            border: 1px solid var(--line);
            border-radius: var(--r-lg);
            background: var(--surface);
            box-shadow: var(--shadow-sm);
        }

        .panel h2,
        .panel h3 {
            margin: 0 0 6px;
            font-size: 1.08rem;
            font-weight: 800;
        }

        .hint {
            margin: 0 0 12px;
            font-size: .88rem;
            color: var(--text-2);
            line-height: 1.55;
        }

        .error {
            min-height: 1.2em;
            margin: 6px 0 0;
            font-size: .9rem;
            font-weight: 700;
            color: var(--bad);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 13px 16px;
            border: none;
            border-radius: var(--r-md);
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            line-height: 1.2;
        }

        .btn:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .btn:not(:disabled):active {
            transform: scale(.98);
        }

        .btn-primary {
            background: var(--ice);
            color: #fff;
        }

        .btn-ghost {
            background: var(--surface-2);
            color: var(--text);
        }

        .btn-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-row .btn {
            flex: 1 1 130px;
        }

        .btn-block {
            width: 100%;
        }

        .text-btn {
            border: none;
            background: none;
            padding: 6px;
            color: var(--accent-ink);
            font-size: .9rem;
            font-weight: 700;
            cursor: pointer;
        }

        .text-btn:disabled {
            color: var(--muted);
            cursor: not-allowed;
        }

        input.txt,
        textarea.txt {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            border: 1px solid var(--line-strong);
            border-radius: var(--r-md);
            background: var(--surface-2);
            color: var(--text);
        }

        label.field {
            display: block;
            margin: 12px 0 6px;
            font-size: .9rem;
            font-weight: 800;
        }

        .count {
            float: right;
            font-weight: 600;
            color: var(--muted);
        }

        .banner {
            padding: 12px 14px;
            margin-bottom: 12px;
            border-radius: var(--r-md);
            background: var(--warn-soft);
            font-size: .9rem;
            line-height: 1.5;
        }

        .banner b {
            display: block;
            margin-bottom: 2px;
        }

        .banner .btn {
            margin-top: 8px;
            padding: 9px 12px;
            font-size: .9rem;
        }

        /* ── 눈 내린 마당 ── */
        .yard {
            position: relative;
            overflow: hidden;
            padding: 14px 12px 8px;
            border-radius: var(--r-lg);
            background: linear-gradient(180deg, var(--winter-1), var(--winter-2));
            color: var(--text);
        }

        .yard.night {
            background: linear-gradient(180deg, #0f1b3d, #2a3b6b);
            color: #eef2ff;
        }

        .yard.night .meta {
            color: #c7d2fe;
        }

        .yard.snow::after,
        .yard.sleet::after {
            content: "";
            position: absolute;
            inset: -60px 0 0;
            pointer-events: none;
            background-image:
                radial-gradient(3px 3px at 10% 10%, #fff, transparent),
                radial-gradient(3.5px 3.5px at 40% 30%, #fff, transparent),
                radial-gradient(3px 3px at 70% 20%, #fff, transparent),
                radial-gradient(4px 4px at 85% 50%, #fff, transparent),
                radial-gradient(3px 3px at 25% 60%, #fff, transparent),
                radial-gradient(3.5px 3.5px at 55% 75%, #fff, transparent);
            background-size: 200px 200px;
            animation: fall 5s linear infinite;
        }

        .yard.sleet::after {
            background-image:
                linear-gradient(170deg, transparent 46%, rgba(255, 255, 255, .8) 50%, transparent 54%),
                radial-gradient(2.5px 2.5px at 60% 40%, #fff, transparent);
            background-size: 60px 90px;
            animation-duration: 1.4s;
            opacity: .6;
        }

        .yard.sun::before {
            content: "";
            position: absolute;
            top: -40px;
            right: -40px;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(253, 224, 71, .85), rgba(253, 224, 71, 0) 70%);
            pointer-events: none;
        }

        .yard.night::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background-image:
                radial-gradient(1.5px 1.5px at 12% 18%, #fff, transparent),
                radial-gradient(1px 1px at 30% 8%, #fff, transparent),
                radial-gradient(1.5px 1.5px at 72% 12%, #fff, transparent),
                radial-gradient(1px 1px at 88% 30%, #fff, transparent),
                radial-gradient(1.5px 1.5px at 50% 22%, #fff, transparent);
        }

        @keyframes fall {
            to {
                background-position: 24px 200px;
            }
        }

        .yard-head {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: space-between;
            gap: 10px;
            align-items: flex-start;
        }

        .yard-head b {
            font-size: 1.05rem;
        }

        .yard-head .meta {
            margin-top: 3px;
            font-size: .85rem;
            color: var(--text-2);
        }

        .weather-tag {
            flex: none;
            padding: 4px 10px;
            border-radius: var(--r-pill);
            background: rgba(255, 255, 255, .6);
            font-size: .8rem;
            font-weight: 800;
            color: #1e293b;
        }

        .man-box {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: center;
        }

        .man-box svg {
            display: block;
            width: 100%;
            max-width: 320px;
            height: auto;
        }

        .demo {
            opacity: .55;
        }

        /* ── 오늘의 질문 ── */
        .q-card {
            border-color: #bfdbfe;
        }

        .q-date {
            font-size: .82rem;
            font-weight: 800;
            color: var(--ice);
        }

        .q-text {
            margin: 6px 0 10px;
            font-size: 1.15rem;
            font-weight: 800;
            line-height: 1.4;
            word-break: keep-all;
        }

        .q-tools {
            display: flex;
            justify-content: space-between;
            margin: -6px 0 6px;
        }

        .moods {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin: 10px 0 12px;
        }

        .mood {
            width: 42px;
            height: 42px;
            border: 2px solid var(--line);
            border-radius: 50%;
            background: var(--surface);
            font-size: 1.3rem;
            cursor: pointer;
        }

        .mood[aria-pressed="true"] {
            border-color: var(--ice);
            background: #e0ecff;
        }

        .saved-line {
            margin: 8px 0;
            padding: 12px 14px;
            border-radius: var(--r-md);
            background: var(--cream);
            border: 1px solid #fde7b0;
            font-size: 1.02rem;
            line-height: 1.5;
            word-break: keep-all;
            overflow-wrap: anywhere;
        }

        .late {
            border-style: dashed;
        }

        /* ── 달력 ── */
        .cal {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .cal .wd {
            font-size: .7rem;
            font-weight: 800;
            text-align: center;
            color: var(--muted);
        }

        .cell {
            position: relative;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background: var(--surface-2);
            font-size: 1.15rem;
            border: none;
            padding: 0;
            color: var(--text);
        }

        .cell small {
            position: absolute;
            top: 2px;
            left: 4px;
            font-size: .6rem;
            font-weight: 700;
            color: var(--muted);
        }

        .cell.done {
            background: #e0ecff;
            cursor: pointer;
        }

        .cell.today {
            outline: 2px solid var(--ice);
        }

        .cell.miss {
            opacity: .45;
        }

        /* ── 소품 ── */
        .items {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
        }

        .item {
            padding: 8px 2px;
            border: 2px solid var(--line);
            border-radius: var(--r-md);
            background: var(--surface-2);
            text-align: center;
            cursor: pointer;
            font-size: 1.4rem;
        }

        .item span {
            display: block;
            font-size: .66rem;
            font-weight: 700;
            color: var(--text-2);
        }

        .item[aria-pressed="true"] {
            border-color: var(--ice);
            background: #e0ecff;
        }

        .item:disabled {
            opacity: .4;
            cursor: not-allowed;
        }

        /* ── 리포트 ── */
        .words {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .word {
            padding: 8px 14px;
            border-radius: var(--r-pill);
            background: #e0ecff;
            font-weight: 800;
        }

        .pick-list {
            display: grid;
            gap: 6px;
            max-height: 50vh;
            overflow-y: auto;
        }

        .pick-row {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            padding: 10px;
            border-radius: var(--r-md);
            background: var(--surface-2);
            cursor: pointer;
            line-height: 1.45;
        }

        .pick-row input {
            margin-top: 3px;
            width: 18px;
            height: 18px;
            accent-color: var(--ice);
        }

        .pick-row small {
            display: block;
            color: var(--muted);
            font-size: .75rem;
        }

        .best {
            padding: 14px 16px;
            border-radius: var(--r-md);
            background: var(--cream);
            border: 1px solid #fde7b0;
            font-size: 1.05rem;
            font-weight: 700;
            line-height: 1.55;
        }

        .tools {
            display: flex;
            justify-content: center;
            gap: 4px;
            flex-wrap: wrap;
        }

        /* ── 시트·굴리기 ── */
        .backdrop {
            position: fixed;
            inset: 0;
            z-index: 10000;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            background: var(--scrim);
        }

        .sheet {
            width: 100%;
            max-width: 560px;
            max-height: 88vh;
            max-height: 88dvh;
            overflow-y: auto;
            padding: 20px 18px max(18px, env(safe-area-inset-bottom));
            border-radius: var(--r-lg) var(--r-lg) 0 0;
            background: var(--surface);
            box-shadow: var(--shadow-lg);
        }

        @media (min-width: 640px) {
            .backdrop {
                align-items: center;
                padding: 24px;
            }

            .sheet {
                border-radius: var(--r-lg);
            }
        }

        .sheet h2 {
            margin: 0 0 6px;
            font-size: 1.2rem;
        }

        .code-box {
            width: 100%;
            min-height: 110px;
            font-family: ui-monospace, Menlo, monospace;
            font-size: .78rem;
            word-break: break-all;
        }

        .roll {
            position: fixed;
            inset: 0;
            z-index: 10001;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 24px;
            background: rgba(219, 234, 254, .97);
            text-align: center;
        }

        .roll h2 {
            margin: 0;
            font-size: 1.35rem;
        }

        .roll p {
            margin: 0;
            color: var(--text-2);
        }

        .lane {
            position: relative;
            width: min(92vw, 420px);
            height: 150px;
            border-radius: var(--r-lg);
            background: linear-gradient(180deg, #eff6ff 0 62%, #fff 62%);
            touch-action: none;
            cursor: grab;
            overflow: hidden;
        }

        .lane .ball {
            position: absolute;
            bottom: 26px;
            left: 10px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #fff, #e2e8f0 70%, #cbd5e1);
            box-shadow: inset -6px -6px 0 rgba(148, 163, 184, .25), 0 6px 10px rgba(15, 23, 42, .12);
        }

        .lane .ball::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 18%;
            width: 18%;
            height: 18%;
            border-radius: 50%;
            background: #cbd5e1;
        }

        .lane .trail {
            position: absolute;
            left: 0;
            bottom: 22px;
            height: 10px;
            border-radius: 6px;
            background: #e2e8f0;
        }

        .roll-bar {
            width: min(92vw, 420px);
            height: 10px;
            border-radius: var(--r-pill);
            background: #bfdbfe;
            overflow: hidden;
        }

        .roll-bar i {
            display: block;
            height: 100%;
            width: 0;
            background: var(--ice);
        }

        @media (prefers-reduced-motion: reduce) {

            .yard.snow::after,
            .yard.sleet::after {
                animation: none !important;
            }
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: max(24px, env(safe-area-inset-bottom));
            z-index: 10003;
            max-width: calc(100vw - 32px);
            padding: 12px 18px;
            border-radius: var(--r-pill);
            background: var(--text);
            color: var(--bg);
            font-size: .92rem;
            font-weight: 700;
            text-align: center;
            opacity: 0;
            transform: translate(-50%, 20px);
            pointer-events: none;
            transition: opacity .2s ease, transform .2s ease;
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }
    </style>

<body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false" id="defs-host"></svg>

    <div class="wrap">
        <a href="../index.html" class="back-button">← 메인</a>

        <header class="game-header">
            <h1 class="game-title">⛄ 한 줄 눈사람</h1>
            <p class="game-description">12월에 하루 한 줄, 굴려서 만드는 나의 12월</p>
        </header>

        <div id="banners"></div>

        <section id="v-start" hidden></section>
        <section id="v-main" hidden></section>
        <section id="v-report" hidden></section>
    </div>

    <div class="backdrop" id="sheet-bg" hidden>
        <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
    </div>
    <div class="roll" id="roll" hidden></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
        // ════════════════════════════════════════════════════════════
        //  한 줄 눈사람 (#73)
        //  - 12월 한 달 하루 한 줄 기록 → 눈덩이가 굴러 커지고 31일에 눈사람 완성.
        //  - 기록은 이 기기(localStorage)에만 둔다. 밖으로 나가는 건 사용자가 고른 줄이 들어간 카드 이미지뿐.
        //  - 날짜·저장·백업·배너·카드 기반은 어드벤트 트리(advent-tree.html)에서 가져와 줄였다.
        //  - 질문 은행(QUESTIONS) 순서는 날짜별 질문 배정에 쓰이므로 바꾸지 말고 뒤에만 추가한다.
        // ════════════════════════════════════════════════════════════

        const $ = (id) => document.getElementById(id);
        const esc = (v) => escapeHtml(v);
        const IS_LOCAL = ['localhost', '127.0.0.1'].includes(location.hostname);
        const MAX_LINE = 40;
        const MAX_NAME = 10;
        const MAX_SWAPS = 2;
        const MAX_PICK = 3;

        function hash32(str) {
            let h = 2166136261 >>> 0;
            for (let i = 0; i < str.length; i++) {
                h ^= str.charCodeAt(i);
                h = Math.imul(h, 16777619);
            }
            return h >>> 0;
        }

        function mulberry32(a) {
            return () => {
                a |= 0;
                a = (a + 0x6D2B79F5) | 0;
                let t = Math.imul(a ^ (a >>> 15), 1 | a);
                t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
        }

        // ── 날짜 ── 기기 시계 기준, 개발할 때만 ?today=YYYY-MM-DD (localhost에서만)
        const Clock = (() => {
            function now() {
                if (IS_LOCAL) {
                    const q = new URLSearchParams(location.search).get('today');
                    if (q && /^\d{4}-\d{2}-\d{2}$/.test(q)) {
                        const [y, m, d] = q.split('-').map(Number);
                        const t = new Date();
                        return new Date(y, m - 1, d, t.getHours(), t.getMinutes(), t.getSeconds());
                    }
                }
                return new Date();
            }
            const key = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            const parse = (k) => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d, 12); };
            const shift = (k, n) => { const d = parse(k); d.setDate(d.getDate() + n); return key(d); };
            // 12월 = 기록, 1/1 = 새해 소원, 1/2~1/31 = 보기, 2~11월 = 다음 12월을 기다림
            function season(d = now()) {
                const y = d.getFullYear();
                const m = d.getMonth() + 1;
                const day = d.getDate();
                if (m === 12) return { year: y, phase: 'diary', day };
                if (m === 1) return { year: y - 1, phase: day === 1 ? 'wish' : 'after', day: 0 };
                return { year: y, phase: 'pre', day: 0 };
            }
            function daysUntil(y, m, d) {
                const a = parse(key(now()));
                return Math.round((new Date(y, m - 1, d, 12) - a) / 86400000);
            }
            return { now, key, today: () => key(now()), shift, season, daysUntil, stamp: () => now().getTime() };
        })();

        const Store = (() => {
            const KEY = 'snowman-diary:v1';
            let ok = true;
            try {
                localStorage.setItem('snowman-diary:probe', '1');
                localStorage.removeItem('snowman-diary:probe');
            } catch {
                ok = false;
            }
            return {
                ok: () => ok,
                load() { try { return JSON.parse(localStorage.getItem(KEY) || 'null'); } catch { return null; } },
                save(s) { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch { /* 메모리로만 진행 */ } },
                clear() { try { localStorage.removeItem(KEY); } catch { /* 무시 */ } }
            };
        })();

        // 백업 코드: 버전(1자) + 검사값(2자) + base64url(JSON)
        const Codec = (() => {
            const toB64u = (bytes) => {
                let bin = '';
                bytes.forEach((b) => { bin += String.fromCharCode(b); });
                return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
            };
            const fromB64u = (s) => {
                let t = s.replace(/-/g, '+').replace(/_/g, '/');
                while (t.length % 4) t += '=';
                return Uint8Array.from(atob(t), (c) => c.charCodeAt(0));
            };
            const sum = (body) => (hash32(body) % 1296).toString(36).padStart(2, '0');
            return {
                pack(obj) {
                    const body = toB64u(new TextEncoder().encode(JSON.stringify(obj)));
                    return `1${sum(body)}${body}`;
                },
                unpack(s) {
                    if (typeof s !== 'string' || s.length < 5 || s[0] !== '1') throw new Error('bad');
                    const body = s.slice(3);
                    if (sum(body) !== s.slice(1, 3)) throw new Error('bad');
                    const obj = JSON.parse(new TextDecoder().decode(fromB64u(body)));
                    if (!obj || typeof obj !== 'object') throw new Error('bad');
                    return obj;
                }
            };
        })();

        // ════════════════════════════════════════════════════════════
        //  질문·날씨
        // ════════════════════════════════════════════════════════════

            ['지금 내 책상(또는 가방) 위에 있는 것', '예) 핸드크림'],

            ['요즘 제일 아끼는 물건', '예) 수면양말'],
            ['오늘 점심 메뉴', '예) 김치찌개'],
            ['올해 가장 많이 들은 노래 가수', '예) 매일 듣는 그 가수'],
            ['오늘 받은 메시지 중 반가웠던 것', '예) 오랜만에 온 친구 연락'],
            ['요즘 갖고 싶은 것', '예) 새 운동화'],

            ['요즘 빠진 단어나 유행어', '예) 럭키비키'],

        ];
        const MOODS = ['😊', '😆', '🥰', '😌', '😴', '🥶', '😮‍💨', '🤯'];

        // 날마다 다른 질문: 해마다 섞은 순서의 앞 31개를 날짜에, 나머지를 '바꾸기'에 쓴다
        function questionOrder(year) {
            const r = mulberry32(hash32(`q|${year}`));
            const a = QUESTIONS.map((_, i) => i);
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(r() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function questionFor(st, date) {
            const order = questionOrder(st.year);
            const day = Number(date.slice(8));
            const s = st.swaps[date] || 0;
            if (!s) return order[(day - 1) % order.length];
            const spare = order.slice(31);
            return spare[((day - 1) * MAX_SWAPS + s - 1) % spare.length];
        }

        const WEATHER = {
            snow: { e: '❄️', name: '함박눈', note: '함박눈 보너스! 눈덩이가 더 커져요' },
            sleet: { e: '🌨️', name: '진눈깨비', note: '진눈깨비가 날려요' },
            sun: { e: '☀️', name: '맑음', note: '햇살에 눈이 반짝여요' },
            night: { e: '🌙', name: '맑은 밤', note: '별이 반짝이는 밤이에요' }
        };

        function weatherOf(date) {
            const x = mulberry32(hash32(`w|${date}`))();
            return x < 0.2 ? 'snow' : x < 0.4 ? 'sleet' : x < 0.8 ? 'sun' : 'night';
        }

        // ════════════════════════════════════════════════════════════
        //  눈사람 계산·그리기
        // ════════════════════════════════════════════════════════════
        const ITEMS = [
            { id: 'earmuff', e: '🎧', name: '귀마개', at: 5, needs: 'head' },
            { id: 'shades', e: '🕶️', name: '선글라스', at: 10, needs: 'head' },
            { id: 'broom', e: '🧹', name: '빗자루', at: 15, needs: 'arms' },
            { id: 'mitten', e: '🧤', name: '장갑', at: 20, needs: 'arms' },
            { id: 'santa', e: '🎅', name: '산타 모자', at: 28, needs: 'head' }
        ];
        const STAGES = [[0, '첫 눈덩이를 기다리는 중'], [1, '눈덩이 굴리는 중'], [7, '아래 몸통 완성'], [14, '위 몸통 + 팔'], [21, '머리 완성'], [25, '얼굴 완성'], [31, '모자·목도리까지 완성!']];

        const recordedOf = (st) => Object.keys(st.days).length;
        const writtenOf = (st) => Object.values(st.days).filter((d) => !d.pass).length;
        function sizeOf(st) {
            return Object.entries(st.days).reduce((a, [k, d]) => a + (d.pass ? 0.4 : 1 + (weatherOf(k) === 'snow' ? 0.5 : 0)), 0);
        }
        const stageName = (n) => STAGES.reduce((s, [at, name]) => (n >= at ? name : s), STAGES[0][1]);

        function snowBall(cx, cy, r) {
            return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#gSnow)" stroke="#cfd9e8" stroke-width="1.5"/><ellipse cx="${cx - r * 0.3}" cy="${cy - r * 0.35}" rx="${r * 0.28}" ry="${r * 0.16}" fill="#fff" opacity=".8"/>`;
        }

        // m = { rec, size, wear:[], wish:'' } → { svg 안쪽, 팻말 자리 }
        function manInner(m, withSignText = true) {
            const rec = m.rec;
            // 1.22를 넘으면 모자가 그림 위로 잘린다 (꼭대기 = 372 - 295k)
            const k = Math.min(1.22, 0.72 + m.size * 0.016);
            const ground = 334;
            let g = `<ellipse cx="150" cy="${ground + 4}" rx="146" ry="20" fill="#f8fbff"/><path d="M8 ${ground + 4}q40-16 82-6t90-2 112 8" fill="#fff" opacity=".9"/>`;
            if (!rec) {
                g += `${snowBall(150, ground - 9, 11)}`;
                return { g, sign: null };
            }
            const R1 = 58 * k;
            const R2 = 43 * k;
            const R3 = 32 * k;
            const c1 = ground - R1 + 6;
            const c2 = c1 - R1 - R2 + 18;
            const c3 = c2 - R2 - R3 + 14;
            const has = { body: rec >= 7, top: rec >= 14, head: rec >= 21, face: rec >= 25, hat: rec >= 31 };
            const wear = new Set(m.wear || []);
            const ok = (id) => {
                const it = ITEMS.find((x) => x.id === id);
                return wear.has(id) && rec >= it.at && (it.needs === 'head' ? has.head : has.top);
            };

            // 굴리는 중인 눈덩이
            if (!has.body) {
                const r = 12 + rec * 5;
                g += `<path d="M20 ${ground}h${150 - r - 20}" stroke="#e2e8f0" stroke-width="8" stroke-linecap="round"/>${snowBall(150, ground - r + 4, r)}`;
            } else if (!has.top || !has.head) {
                const r = has.top ? 8 + (rec - 14) * 3.6 : 10 + (rec - 7) * 4.5;
                g += snowBall(262, ground - r + 4, r);
            }
            if (ok('broom')) {
                g += `<path d="M${150 + R2 + 26} ${c2 - 10}L${150 + R2 + 40} ${ground - 4}" stroke="#92400e" stroke-width="5" stroke-linecap="round"/><path d="M${150 + R2 + 28} ${ground - 30}l-10 30h40l-6-32z" fill="#eab308"/>`;
            }
            if (has.body) g += snowBall(150, c1, R1);
            if (has.top) {
                g += `<path d="M${150 - R2 + 4} ${c2}l-40-20m14 7l-6-16M${150 + R2 - 4} ${c2}l40-22m-14 8l8-15" stroke="#7c4a24" stroke-width="4" stroke-linecap="round" fill="none"/>`;
                g += snowBall(150, c2, R2);
                g += [-0.35, 0, 0.35].map((t) => `<circle cx="150" cy="${c2 + t * R2 * 1.6}" r="${3.6 * k}" fill="#1f2937"/>`).join('');
                if (ok('mitten')) g += `<circle cx="${150 - R2 - 36}" cy="${c2 - 18}" r="8" fill="#dc2626"/><circle cx="${150 + R2 + 36}" cy="${c2 - 20}" r="8" fill="#dc2626"/>`;
            }
            if (has.head) {
                if (has.hat) g += `<path d="M${150 - R3 * 0.9} ${c3 + R3 * 0.72}q${R3 * 0.9} ${R3 * 0.5} ${R3 * 1.8} 0v10q-${R3 * 0.9} ${R3 * 0.5}-${R3 * 1.8} 0z" fill="#dc2626"/><path d="M${150 + R3 * 0.4} ${c3 + R3 * 0.9}l10 34h-14l-6-30z" fill="#b91c1c"/>`;
                g += snowBall(150, c3, R3);
                if (has.face) {
                    g += `<circle cx="${150 - R3 * 0.34}" cy="${c3 - R3 * 0.18}" r="${3.8 * k}" fill="#111827"/><circle cx="${150 + R3 * 0.34}" cy="${c3 - R3 * 0.18}" r="${3.8 * k}" fill="#111827"/>`;
                    g += `<path d="M150 ${c3 + R3 * 0.02}l${R3 * 0.75} ${R3 * 0.12}-${R3 * 0.75} ${R3 * 0.14}z" fill="#f97316"/>`;
                    g += [-0.4, -0.2, 0, 0.2, 0.4].map((t) => `<circle cx="${150 + t * R3}" cy="${c3 + R3 * 0.42 - Math.abs(t) * R3 * 0.22}" r="${2.2 * k}" fill="#1f2937"/>`).join('');
                }
                if (ok('shades')) g += `<rect x="${150 - R3 * 0.62}" y="${c3 - R3 * 0.34}" width="${R3 * 0.52}" height="${R3 * 0.32}" rx="5" fill="#111827"/><rect x="${150 + R3 * 0.1}" y="${c3 - R3 * 0.34}" width="${R3 * 0.52}" height="${R3 * 0.32}" rx="5" fill="#111827"/><path d="M${150 - R3 * 0.1} ${c3 - R3 * 0.2}h${R3 * 0.2}" stroke="#111827" stroke-width="3"/>`;
                if (ok('earmuff')) g += `<path d="M${150 - R3 * 0.95} ${c3}a${R3 * 0.95} ${R3 * 0.95} 0 0 1 ${R3 * 1.9} 0" stroke="#7c3aed" stroke-width="5" fill="none"/><circle cx="${150 - R3 * 0.98}" cy="${c3 + 2}" r="${10 * k}" fill="#f472b6"/><circle cx="${150 + R3 * 0.98}" cy="${c3 + 2}" r="${10 * k}" fill="#f472b6"/>`;
                if (ok('santa')) g += `<path d="M${150 - R3 * 0.95} ${c3 - R3 * 0.55}q${R3 * 0.4}-${R3 * 1.7} ${R3 * 1.5}-${R3 * 1.2} ${R3 * 0.55} ${R3 * 0.3} ${R3 * 0.42} ${R3 * 1.2}z" fill="#dc2626"/><rect x="${150 - R3 * 1.02}" y="${c3 - R3 * 0.72}" width="${R3 * 2.04}" height="${R3 * 0.32}" rx="${R3 * 0.16}" fill="#fff"/><circle cx="${150 + R3 * 0.98}" cy="${c3 - R3 * 1.7}" r="${R3 * 0.2}" fill="#fff"/>`;
                else if (has.hat) g += `<rect x="${150 - R3 * 0.95}" y="${c3 - R3 * 0.98}" width="${R3 * 1.9}" height="${R3 * 0.2}" rx="3" fill="#111827"/><rect x="${150 - R3 * 0.6}" y="${c3 - R3 * 1.78}" width="${R3 * 1.2}" height="${R3 * 0.84}" rx="4" fill="#111827"/><rect x="${150 - R3 * 0.6}" y="${c3 - R3 * 1.16}" width="${R3 * 1.2}" height="${R3 * 0.16}" fill="#dc2626"/>`;
            }
            let sign = null;
            if (m.wish) {
                // 귀마개·팔과 겹치지 않게 오른쪽 위에 세운다
                sign = { x: 204, y: 34, w: 92, h: 60 };
                const mid = sign.x + sign.w / 2;
                g += `<path d="M${mid} ${sign.y + sign.h}V${ground}" stroke="#92400e" stroke-width="5" stroke-linecap="round"/><rect x="${sign.x}" y="${sign.y}" width="${sign.w}" height="${sign.h}" rx="8" fill="#fffaf0" stroke="#d97706" stroke-width="2.5"/>`;
                if (withSignText) {
                    const lines = wrapText(m.wish, 7, 3);
                    g += `<text x="${mid}" y="${sign.y + sign.h / 2 + 5 - (lines.length - 1) * 8}" text-anchor="middle" font-size="12.5" font-weight="800" fill="#7c2d12" font-family="Pretendard, sans-serif">${lines.map((l, i) => `<tspan x="${mid}" dy="${i ? 16 : 0}">${esc(l)}</tspan>`).join('')}</text>`;
                }
            }
            return { g, sign };
        }

        function wrapText(text, per, max) {
            const out = [];
            let rest = text;
            while (rest && out.length < max) { out.push(rest.slice(0, per)); rest = rest.slice(per); }
            if (rest && out.length) out[out.length - 1] = `${out[out.length - 1].slice(0, per - 1)}…`;
            return out;
        }

        const DEFS = '<defs><radialGradient id="gSnow" cx=".38" cy=".32" r=".75"><stop offset="0" stop-color="#ffffff"/><stop offset=".7" stop-color="#eef2f7"/><stop offset="1" stop-color="#d5deea"/></radialGradient></defs>';
        const manModel = (st) => ({ rec: recordedOf(st), size: sizeOf(st), wear: st.wear, wish: st.wish });
        const manSvg = (m, label = '눈사람') => `<svg viewBox="0 0 300 360" role="img" aria-label="${esc(label)}">${manInner(m).g}</svg>`;

        // ════════════════════════════════════════════════════════════
        //  상태
        // ════════════════════════════════════════════════════════════
        let S = Store.load();
        if (S && (S.v !== 1 || typeof S.days !== 'object' || !Array.isArray(S.wear))) S = null;
        const UI = { free: {}, mood: {}, editing: '', target: '' };
        const save = () => Store.save(S);

        function newState(name) {
            return { v: 1, year: Clock.season().year, name, days: {}, swaps: {}, wear: [], best: '', wish: '', picked: [] };
        }

        // 쓸 수 있는 날: 오늘 + 비어 있는 어제·그제 (12월 안에서만)
        function writableDays(st) {
            const se = Clock.season();
            if (se.phase !== 'diary' || st.year !== se.year) return [];
            const today = Clock.today();
            const list = [today];
            [-1, -2].forEach((n) => {
                const k = Clock.shift(today, n);
                if (k.slice(5, 7) === '12' && k.startsWith(String(st.year)) && !st.days[k]) list.push(k);
            });
            return list;
        }

        // ── 소리 ──
        const Sound = (() => {
            let c = null;
            function ac() {
                if (!c) {
                    const C = window.AudioContext || window.webkitAudioContext;
                    if (!C) return null;
                    try { c = new C(); } catch { return null; }
                }
                if (c.state === 'suspended') c.resume().catch(() => {});
                return c;
            }
            function tone(a, f, t, len, vol = 0.12, type = 'sine') {
                const o = a.createOscillator();
                const gn = a.createGain();
                o.type = type;
                o.frequency.value = f;
                gn.gain.setValueAtTime(0.0001, t);
                gn.gain.exponentialRampToValueAtTime(vol, t + 0.02);
                gn.gain.exponentialRampToValueAtTime(0.001, t + len);
                o.connect(gn).connect(a.destination);
                o.start(t);
                o.stop(t + len + 0.05);
            }
            function crunch(a, t) {
                const buf = a.createBuffer(1, Math.floor(a.sampleRate * 0.12), a.sampleRate);
                const d = buf.getChannelData(0);
                for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
                const s = a.createBufferSource();
                s.buffer = buf;
                const f = a.createBiquadFilter();
                f.type = 'lowpass';
                f.frequency.value = 1400;
                const gn = a.createGain();
                gn.gain.value = 0.25;
                s.connect(f).connect(gn).connect(a.destination);
                s.start(t);
            }
            const play = (fn) => { const a = ac(); if (a) fn(a, a.currentTime + 0.01); };
            return {
                wake: () => ac(),
                step: () => play((a, t) => crunch(a, t)),
                sparkle: () => play((a, t) => [784, 988, 1175, 1568].forEach((f, i) => tone(a, f, t + i * 0.08, 0.3, 0.09, 'triangle')))
            };
        })();
        document.addEventListener('pointerdown', () => Sound.wake(), { once: true });

        const buzz = (p = 20) => {
            if (!('vibrate' in navigator) || navigator.userActivation?.hasBeenActive === false) return;
            try { navigator.vibrate(p); } catch { /* 무시 */ }
        };

        let toastTimer = null;
        function toast(msg) {
            const el = $('toast');
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
        }

        async function copyText(text) {
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                    return true;
                }
            } catch { /* 아래 방식으로 */ }
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.setAttribute('readonly', '');
            ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
            document.body.appendChild(ta);
            ta.select();
            let ok = false;
            try { ok = document.execCommand('copy'); } catch { ok = false; }
            ta.remove();
            return ok;
        }

        function openSheet(html) { $('sheet').innerHTML = html; $('sheet-bg').hidden = false; }
        function closeSheet() { $('sheet-bg').hidden = true; $('sheet').innerHTML = ''; }

        const VIEWS = ['v-start', 'v-main', 'v-report'];
        function show(id) {
            VIEWS.forEach((v) => { $(v).hidden = v !== id; });
            window.scrollTo({ top: 0 });
        }

        const INAPP = /KAKAOTALK|NAVER\(inapp|Instagram|FBAN|FBAV|Line\//i.test(navigator.userAgent);
        const KAKAO = /KAKAOTALK/i.test(navigator.userAgent);
        function renderBanners() {
            let h = '';
            if (!Store.ok()) h = '<div class="banner"><b>⚠️ 이 브라우저에서는 기록이 저장되지 않아요</b>개인 정보 보호 모드이거나 저장이 막혀 있어요. 사파리나 크롬 일반 창에서 열어 주세요.</div>';
            else if (INAPP) {
                h = `<div class="banner"><b>📱 사파리·크롬에서 쓰는 걸 추천해요</b>메신저 안 브라우저는 기록이 지워질 수 있어요. 기록은 열었던 브라우저에만 저장돼요.
                    ${KAKAO ? '<br><button class="btn btn-ghost" data-act="external" type="button">🌐 다른 브라우저로 열기</button>' : ''}</div>`;
            }
            $('banners').innerHTML = h;
        }

        // ════════════════════════════════════════════════════════════
        //  화면
        // ════════════════════════════════════════════════════════════
        const dayLabel = (k) => `12월 ${Number(k.slice(8))}일`;
        const relLabel = (k) => (k === Clock.today() ? '오늘' : k === Clock.shift(Clock.today(), -1) ? '어제' : '그제');

        function renderStart() {
            const se = Clock.season();
            const demo = { rec: 31, size: 30, wear: ['earmuff'], wish: '' };
            const when = se.phase === 'pre'
                ? `12월 1일에 첫 줄을 쓸 수 있어요. <b>D-${Clock.daysUntil(se.year, 12, 1)}</b>`
                : se.phase === 'diary' ? '지금부터 하루 한 줄씩 써 보세요. 어제·그제 것도 늦게 쓸 수 있어요.'
                    : '이번 12월은 끝났어요. 이름을 정해 두면 다음 12월에 바로 시작할 수 있어요.';
            $('v-start').innerHTML = `<div class="yard sun"><div class="man-box demo">${manSvg(demo, '완성된 눈사람 예시')}</div></div>
                <div class="panel" style="margin-top:12px">
                    <h2>⛄ 12월, 하루 한 줄</h2>
                    <p class="hint">오늘 먹은 것, 들은 노래, 창밖 풍경처럼 가볍게 한 줄만 쓰면 눈덩이가 굴러 커져요. 31일에는 내가 쓴 날만큼 자란 "나의 12월" 눈사람과 리포트가 완성돼요.<br>${when}</p>
                    <label class="field" for="name">내 이름</label>
                    <input class="txt" id="name" maxlength="${MAX_NAME}" placeholder="예) 민수" autocomplete="off">
                    <p class="error" id="start-error"></p>
                    <button class="btn btn-primary btn-block" data-act="start" type="button">⛄ 시작하기</button>
                    <p class="hint" style="margin:10px 0 0">기록은 이 브라우저에만 저장되고 어디에도 보내지 않아요.</p>
                </div>`;
            show('v-start');
        }

        function renderMain() {
            if (!S) { renderStart(); return; }
            const se = Clock.season();
            const today = Clock.today();
            const old = S.year !== se.year;
            const rec = recordedOf(S);
            const w = se.phase === 'diary' && !old ? weatherOf(today) : 'sun';
            const yardClass = { snow: 'snow', sleet: 'sleet', sun: 'sun', night: 'night' }[w];
            let meta;
            if (old) meta = `🗂️ ${S.year}년 12월의 눈사람`;
            else if (se.phase === 'pre') meta = `12월 1일까지 D-${Clock.daysUntil(se.year, 12, 1)}`;
            else if (se.phase === 'diary') meta = `12월 ${se.day}일 · 기록 ${rec}일 · ${stageName(rec)}`;
            else if (se.phase === 'wish') meta = '🎍 새해 첫날! 소원을 들려 주세요';
            else meta = `기록 ${rec}일 · ${stageName(rec)}`;

            const yard = `<div class="yard ${yardClass}">
                <div class="yard-head"><div><b>${esc(S.name)}의 눈사람</b><div class="meta">${meta}</div></div>
                ${se.phase === 'diary' && !old ? `<span class="weather-tag">${WEATHER[w].e} ${WEATHER[w].name}</span>` : ''}</div>
                <div class="man-box">${manSvg(manModel(S), `${S.name}의 눈사람`)}</div></div>`;

            let body = '';
            if (old) {
                body = `<div class="panel"><h3>🗂️ 지난 12월이에요</h3><p class="hint">${S.year}년 12월 기록은 리포트에서 다시 볼 수 있어요. 올해 12월에는 새 눈사람을 만들어요.</p>
                    <div class="btn-row"><button class="btn btn-ghost" data-act="report" type="button">📅 지난 리포트</button><button class="btn btn-primary" data-act="restart" type="button">⛄ 새로 시작</button></div></div>`;
            } else if (se.phase === 'pre') {
                body = `<div class="panel"><h3>⏳ 12월 1일에 첫 줄을 써요</h3><p class="hint">매일 가벼운 질문이 하나씩 나와요. 쓰기 싫은 날은 패스해도 괜찮아요. D-${Clock.daysUntil(se.year, 12, 1)}</p></div>`;
            } else if (se.phase === 'diary') {
                body = writableDays(S).map((k) => entryCard(k)).join('');
                if (se.day === 31) body += '<div class="panel"><h3>🎉 12월 마지막 날이에요</h3><p class="hint">오늘 한 줄을 쓰고 "나의 12월" 리포트를 열어 보세요.</p><button class="btn btn-primary btn-block" data-act="report" type="button">📅 나의 12월 리포트</button></div>';
            } else if (se.phase === 'wish') {
                body = S.wish
                    ? `<div class="panel"><h3>🎍 새해 소원</h3><div class="saved-line">${esc(S.wish)}</div><div class="btn-row"><button class="btn btn-ghost" data-act="wish-edit" type="button">✏️ 고치기</button><button class="btn btn-primary" data-act="report" type="button">📅 나의 12월 리포트</button></div></div>`
                    : wishForm();
            } else {
                body = `<div class="panel"><h3>📅 나의 12월</h3><p class="hint">12월 기록이 끝났어요. 리포트에서 카드를 만들어 보세요. (1월 말까지 볼 수 있어요)</p><button class="btn btn-primary btn-block" data-act="report" type="button">📅 나의 12월 리포트</button></div>`;
            }

            const cal = old || se.phase === 'pre' ? '' : `<div class="panel"><h3>🗓️ 12월 달력 <span class="count">${rec}/31</span></h3>${calendarHtml(S, true)}</div>`;
            $('v-main').innerHTML = `${yard}<div style="height:12px"></div>${body}${cal}${old ? '' : itemsPanel()}
                <div class="tools">${!old && se.phase === 'diary' && se.day < 31 && rec ? '<button class="text-btn" data-act="report" type="button">📅 리포트 미리 보기</button>' : ''}<button class="text-btn" data-act="backup" type="button">💾 백업 코드</button><button class="text-btn" data-act="restart" type="button">🔄 처음부터</button></div>`;
            $('v-main').querySelectorAll('input[data-line]').forEach((el) => el.addEventListener('input', () => {
                const c = el.closest('.panel').querySelector('[data-counter]');
                if (c) c.textContent = `${el.value.length}/${MAX_LINE}`;
            }));
            show('v-main');
        }

        function entryCard(k) {
            const d = S.days[k];
            const today = k === Clock.today();
            const late = !today;
            if (d && UI.editing !== k) {
                return `<div class="panel q-card"><div class="q-date">${dayLabel(k)} · ${relLabel(k)} ${WEATHER[weatherOf(k)].e}</div>
                    <p class="q-text">${d.q == null ? '✏️ 자유 기록' : esc(QUESTIONS[d.q][0])}</p>
                    <div class="saved-line">${d.pass ? '💤 오늘은 패스' : `${d.mood ? `${d.mood} ` : ''}${esc(d.text)}`}</div>
                    ${today ? '<button class="text-btn" data-act="edit" data-day="' + k + '" type="button">✏️ 고치기 (오늘 안에만)</button>' : ''}</div>`;
            }
            const free = UI.free[k] ?? (d ? d.q == null : false);
            const qi = d && d.q != null && UI.editing === k ? d.q : questionFor(S, k);
            const swaps = S.swaps[k] || 0;
            const mood = UI.mood[k] ?? d?.mood ?? '';
            const text = d && !d.pass ? d.text : '';
            return `<div class="panel q-card ${late ? 'late' : ''}">
                <div class="q-date">${dayLabel(k)} · ${relLabel(k)} ${WEATHER[weatherOf(k)].e}${late ? ' · 늦게 쓰기' : ''}</div>
                <p class="q-text">${free ? '✏️ 오늘은 자유롭게 한 줄' : esc(QUESTIONS[qi][0])}</p>
                <div class="q-tools">
                    <button class="text-btn" data-act="swap" data-day="${k}" type="button" ${free || swaps >= MAX_SWAPS || (d && UI.editing === k) ? 'disabled' : ''}>🔄 다른 질문 (${MAX_SWAPS - swaps})</button>
                    <button class="text-btn" data-act="free" data-day="${k}" type="button">${free ? '❓ 질문 받기' : '✏️ 자유롭게 쓰기'}</button>
                </div>
                <input class="txt" data-line="${k}" maxlength="${MAX_LINE}" value="${esc(text)}" placeholder="${esc(free ? '예) 오늘은 그냥 좋은 날' : QUESTIONS[qi][1])}" autocomplete="off" aria-label="한 줄 기록">
                <div style="text-align:right;font-size:.78rem;color:var(--muted);margin-top:4px" data-counter>${text.length}/${MAX_LINE}</div>
                <div class="moods" role="group" aria-label="오늘의 기분">${MOODS.map((e) => `<button class="mood" data-act="mood" data-day="${k}" data-mood="${e}" aria-pressed="${mood === e}" type="button">${e}</button>`).join('')}</div>
                <p class="error" data-err="${k}"></p>
                <div class="btn-row"><button class="btn btn-ghost" data-act="pass" data-day="${k}" type="button">💤 패스</button><button class="btn btn-primary" data-act="write" data-day="${k}" type="button">${d ? '✏️ 고쳐서 저장' : '⛄ 굴리기'}</button></div>
            </div>`;
        }

        function wishForm() {
            return `<div class="panel q-card"><div class="q-date">1월 1일 · 새해 첫날</div><p class="q-text">🎍 ${S.year + 1}년 소원 한 줄</p>
                <input class="txt" id="wish" maxlength="24" value="${esc(S.wish)}" placeholder="예) 건강하게, 여행 두 번" autocomplete="off">
                <p class="hint" style="margin:6px 0 10px">눈사람이 팻말로 들고 있어요. (24자)</p>
                <p class="error" id="wish-error"></p><button class="btn btn-primary btn-block" data-act="wish" type="button">🪧 팻말 세우기</button></div>`;
        }

        function calendarHtml(st, interactive) {
            const first = new Date(st.year, 11, 1).getDay();
            const today = Clock.today();
            let h = '<div class="cal">' + ['일', '월', '화', '수', '목', '금', '토'].map((d) => `<div class="wd">${d}</div>`).join('');
            for (let i = 0; i < first; i++) h += '<div></div>';
            for (let d = 1; d <= 31; d++) {
                const k = `${st.year}-12-${String(d).padStart(2, '0')}`;
                const e = st.days[k];
                const past = k < today;
                const icon = e ? (e.pass ? '💤' : e.mood || '✏️') : '';
                const cls = `cell ${e ? 'done' : past ? 'miss' : ''} ${k === today ? 'today' : ''}`;
                h += e && interactive && !e.pass
                    ? `<button class="${cls}" data-act="peek" data-day="${k}" type="button" aria-label="12월 ${d}일 기록 보기"><small>${d}</small>${icon}</button>`
                    : `<div class="${cls}"><small>${d}</small>${icon}</div>`;
            }
            return `${h}</div>`;
        }

        function itemsPanel() {
            const rec = recordedOf(S);
            return `<div class="panel"><h3>🧣 소품함</h3><p class="hint" style="margin-bottom:8px">기록한 날이 쌓이면 소품이 열려요. 눌러서 입히고 벗겨요.</p><div class="items">${ITEMS.map((it) => {
                const open = rec >= it.at;
                return `<button class="item" data-act="wear" data-item="${it.id}" aria-pressed="${S.wear.includes(it.id)}" type="button" ${open ? '' : 'disabled'}>${open ? it.e : '🔒'}<span>${open ? it.name : `${it.at}일`}</span></button>`;
            }).join('')}</div></div>`;
        }

        // ── 리포트 ──
        // '이'·'가'는 떼지 않는다. 고양이·휴가처럼 이·가로 끝나는 낱말이 많아 '고양'처럼 잘린다. ('고양이랑'은 '랑'만 뗀다)
        const JOSA = ['에서', '으로', '하고', '까지', '부터', '처럼', '보다', '한테', '은', '는', '을', '를', '에', '의', '도', '와', '과', '랑', '로', '만'];
        const STOP = new Set(['오늘', '그냥', '진짜', '너무', '정말', '그리고', '근데', '요즘', '지금', '제일', '우리', '나의', '내가', '나는', '하나', '있는', '없는', '하는', '했다', '했음', '같은', '그거', '이거']);
        function topWords(st, n = 3) {
            const count = new Map();
            Object.values(st.days).forEach((d) => {
                if (d.pass || !d.text) return;
                const seen = new Set();
                d.text.replace(/[^\p{L}\p{N}\s]/gu, ' ').split(/\s+/).forEach((raw) => {
                    let w = raw.trim();
                    const j = JOSA.find((x) => w.length > x.length + 1 && w.endsWith(x));
                    if (j) w = w.slice(0, -j.length);
                    if (w.length < 2 || STOP.has(w) || /^\d+$/.test(w) || seen.has(w)) return;
                    seen.add(w);
                    count.set(w, (count.get(w) || 0) + 1);
                });
            });
            return [...count].filter(([, c]) => c >= 1).sort((a, b) => b[1] - a[1]).slice(0, n);
        }

        const lineOf = (k) => { const d = S.days[k]; return d && !d.pass ? `${d.mood ? `${d.mood} ` : ''}${d.text}` : ''; };

        function renderReport() {
            const se = Clock.season();
            const ready = S.year !== se.year || se.phase !== 'diary' || se.day === 31;
            const rec = recordedOf(S);
            const words = topWords(S);
            const lines = Object.keys(S.days).filter((k) => !S.days[k].pass).sort();
            $('v-report').innerHTML = `<div class="yard sun"><div class="yard-head"><div><b>📅 ${esc(S.name)}의 ${S.year}년 12월</b><div class="meta">기록 ${rec}일 · 쓴 줄 ${writtenOf(S)}개 · ${stageName(rec)}</div></div></div>
                <div class="man-box">${manSvg(manModel(S))}</div></div>
                <div style="height:12px"></div>
                ${ready ? '' : '<div class="banner"><b>아직 12월이 남았어요</b>지금까지의 기록으로 미리 보는 리포트예요. 31일에 완성돼요.</div>'}
                <div class="panel"><h3>🗓️ 31칸 달력</h3>${calendarHtml(S, true)}</div>
                <div class="panel"><h3>🔤 자주 쓴 단어 TOP 3</h3>${words.length ? `<div class="words">${words.map(([w, c]) => `<span class="word">${esc(w)} · ${c}번</span>`).join('')}</div>` : '<p class="hint">아직 단어가 모이지 않았어요.</p>'}</div>
                <div class="panel"><h3>⭐ 올해의 한 줄</h3>${S.best && lineOf(S.best) ? `<div class="best">“${esc(lineOf(S.best))}”<br><small style="color:var(--muted)">${dayLabel(S.best)}</small></div>` : '<p class="hint">내가 쓴 줄 중에서 하나를 골라 주세요.</p>'}
                    <button class="btn btn-ghost btn-block" data-act="pick-best" type="button" style="margin-top:10px" ${lines.length ? '' : 'disabled'}>⭐ 올해의 한 줄 고르기</button></div>
                <div class="panel"><h3>🖼️ 카드 만들기</h3><p class="hint">카드에 넣을 줄을 ${MAX_PICK}개까지 골라요. 고르지 않은 기록은 카드에 들어가지 않아요. (${S.picked.filter((k) => lineOf(k)).length}/${MAX_PICK} 선택)</p>
                    <div class="btn-row"><button class="btn btn-ghost" data-act="pick-lines" type="button" ${lines.length ? '' : 'disabled'}>✅ 넣을 줄 고르기</button><button class="btn btn-primary" data-act="card" type="button">🖼️ 카드 저장</button></div></div>
                <div class="tools"><button class="text-btn" data-act="home" type="button">← 눈사람으로</button></div>`;
            show('v-report');
        }

        function openPick(kind) {
            const lines = Object.keys(S.days).filter((k) => !S.days[k].pass).sort();
            const best = kind === 'best';
            openSheet(`<h2>${best ? '⭐ 올해의 한 줄' : `✅ 카드에 넣을 줄 (최대 ${MAX_PICK}개)`}</h2>
                <div class="pick-list">${lines.map((k) => `<label class="pick-row"><input type="${best ? 'radio' : 'checkbox'}" name="pick" value="${k}" ${best ? (S.best === k ? 'checked' : '') : (S.picked.includes(k) ? 'checked' : '')}><span>${esc(lineOf(k))}<small>${dayLabel(k)}${S.days[k].q != null ? ` · ${esc(QUESTIONS[S.days[k].q][0])}` : ''}</small></span></label>`).join('')}</div>
                <p class="error" id="pick-error"></p>
                <div class="btn-row" style="margin-top:10px"><button class="btn btn-ghost" data-act="sheet-close" type="button">취소</button><button class="btn btn-primary" data-act="${best ? 'save-best' : 'save-lines'}" type="button">확인</button></div>`);
            if (!best) {
                $('sheet').querySelectorAll('input[type=checkbox]').forEach((c) => c.addEventListener('change', () => {
                    const on = $('sheet').querySelectorAll('input:checked');
                    if (on.length > MAX_PICK) { c.checked = false; $('pick-error').textContent = `${MAX_PICK}개까지 고를 수 있어요.`; } else $('pick-error').textContent = '';
                }));
            }
        }

        // ════════════════════════════════════════════════════════════
        //  굴리기 (밀어서 굴리기 + 버튼)
        // ════════════════════════════════════════════════════════════
        function startRoll(k) {
            const el = $('roll');
            const w = weatherOf(k);
            el.innerHTML = `<h2>⛄ 눈덩이를 굴려 주세요</h2><p>눈 위를 옆으로 쭉 밀어 보세요</p>
                <div class="lane" id="lane"><div class="trail" id="trail"></div><div class="ball" id="ball"></div></div>
                <div class="roll-bar"><i id="roll-fill"></i></div>
                <button class="btn btn-ghost" data-act="roll-tap" type="button">👆 눌러서 굴리기</button>
                <p style="font-size:.85rem">${WEATHER[w].e} ${WEATHER[w].note}</p>`;
            el.hidden = false;
            const lane = $('lane');
            const ball = $('ball');
            const maxX = lane.clientWidth - 80;
            let progress = 0;
            let lastX = null;
            let finished = false;
            const draw = () => {
                const size = 34 + progress * 34;
                ball.style.width = `${size}px`;
                ball.style.height = `${size}px`;
                ball.style.left = `${10 + progress * maxX}px`;
                ball.style.transform = `rotate(${progress * 720}deg)`;
                $('trail').style.width = `${10 + progress * maxX}px`;
                $('roll-fill').style.width = `${progress * 100}%`;
            };
            const add = (v) => {
                if (finished) return;
                const before = Math.floor(progress * 6);
                progress = Math.min(1, progress + v);
                if (Math.floor(progress * 6) > before) Sound.step();
                draw();
                if (progress >= 1) finish();
            };
            function finish() {
                finished = true;
                Sound.sparkle();
                buzz([30, 40, 30]);
                const rec = recordedOf(S);
                const unlocked = ITEMS.find((it) => it.at === rec);
                setTimeout(() => {
                    el.hidden = true;
                    renderMain();
                    toast(unlocked ? `🎁 새 소품이 열렸어요: ${unlocked.e} ${unlocked.name}` : STAGES.some(([at]) => at === rec && at > 1) ? `⛄ ${stageName(rec)}!` : '⛄ 눈덩이가 커졌어요');
                }, 650);
            }
            lane.onpointerdown = (e) => { lastX = e.clientX; lane.setPointerCapture?.(e.pointerId); };
            lane.onpointermove = (e) => {
                if (lastX == null) return;
                const dx = e.clientX - lastX;
                lastX = e.clientX;
                if (dx > 0) add(dx / (maxX * 1.1));
            };
            lane.onpointerup = () => { lastX = null; };
            lane.onpointercancel = () => { lastX = null; };
            UI.rollAdd = add;
            draw();
            if (matchMedia('(prefers-reduced-motion: reduce)').matches) add(1);
        }

        // ════════════════════════════════════════════════════════════
        //  카드 이미지
        // ════════════════════════════════════════════════════════════
        function loadSvgImage(svg) {
            return new Promise((res, rej) => {
                const img = new Image();
                img.onload = () => res(img);
                img.onerror = rej;
                img.src = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
            });
        }

        async function makeCard() {
            const W = 1080;
            const H = 1350;
            const m = manModel(S);
            const { g: inner, sign } = manInner(m, false);
            const mx = 30;
            const my = 250;
            const mw = 560;
            const scale = mw / 300;
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${DEFS}
                <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe0fb"/><stop offset="1" stop-color="#f4f8ff"/></linearGradient>
                <rect width="${W}" height="${H}" fill="url(#bg)"/>
                <svg x="${mx}" y="${my}" width="${mw}" height="${mw * 1.2}" viewBox="0 0 300 360">${inner}</svg></svg>`;
            const img = await loadSvgImage(svg);
            const cv = document.createElement('canvas');
            cv.width = W;
            cv.height = H;
            const g = cv.getContext('2d');
            g.drawImage(img, 0, 0);
            const font = (w, s) => `${w} ${s}px Pretendard, -apple-system, sans-serif`;
            const fit = (t, max) => { let s = t; while (g.measureText(s).width > max && s.length > 1) s = s.slice(0, -1); return s === t ? s : `${s}…`; };

            g.textAlign = 'center';
            g.fillStyle = '#1d4ed8';
            g.font = font(800, 32);
            g.fillText(`⛄ 한 줄 눈사람 · ${S.year}`, W / 2, 96);
            g.fillStyle = '#0f172a';
            g.font = font(900, 66);
            g.fillText(fit(`${S.name}의 12월`, 980), W / 2, 176);
            g.fillStyle = '#475569';
            g.font = font(700, 32);
            g.fillText(`기록 ${recordedOf(S)}일 · 쓴 줄 ${writtenOf(S)}개 · ${stageName(recordedOf(S))}`, W / 2, 224);

            if (sign && S.wish) {
                const sx = mx + sign.x * scale;
                const sy = my + sign.y * scale;
                g.fillStyle = '#7c2d12';
                g.font = font(800, 22);
                wrapText(S.wish, 7, 3).forEach((l, i, arr) => g.fillText(l, sx + (sign.w * scale) / 2, sy + (sign.h * scale) / 2 + 8 + (i - (arr.length - 1) / 2) * 28));
            }

            // 달력 (오른쪽)
            const cx0 = 620;
            const cy0 = 312;   // 위의 부제목과 겹치지 않게
            const cell = 58;
            const first = new Date(S.year, 11, 1).getDay();
            g.textAlign = 'left';
            g.fillStyle = '#1e293b';
            g.font = font(800, 30);
            g.fillText('🗓️ 나의 12월', cx0, cy0 - 18);
            for (let d = 1; d <= 31; d++) {
                const i = first + d - 1;
                const x = cx0 + (i % 7) * cell;
                const y = cy0 + Math.floor(i / 7) * cell;
                const k = `${S.year}-12-${String(d).padStart(2, '0')}`;
                const e = S.days[k];
                g.fillStyle = e ? '#dbeafe' : 'rgba(255,255,255,.7)';
                g.beginPath();
                g.roundRect ? g.roundRect(x, y, cell - 6, cell - 6, 10) : g.rect(x, y, cell - 6, cell - 6);
                g.fill();
                g.fillStyle = '#94a3b8';
                g.font = font(700, 13);
                g.textAlign = 'left';
                g.fillText(String(d), x + 5, y + 15);
                if (e) {
                    g.textAlign = 'center';
                    g.font = font(400, 24);
                    g.fillText(e.pass ? '💤' : e.mood || '✏️', x + (cell - 6) / 2, y + 40);
                }
            }

            // 단어 TOP 3
            const words = topWords(S);
            let y = cy0 + 6 * cell + 40;
            g.textAlign = 'left';
            if (words.length) {
                g.fillStyle = '#1e293b';
                g.font = font(800, 28);
                g.fillText('🔤 자주 쓴 단어', cx0, y);
                y += 44;
                g.font = font(800, 28);
                g.fillStyle = '#1d4ed8';
                g.fillText(fit(words.map(([w]) => `#${w}`).join('  '), 420), cx0, y);
                y += 30;
            }

            // 올해의 한 줄 + 고른 줄 (아래 전체 너비)
            let ly = 1010;
            g.textAlign = 'left';
            if (S.best && lineOf(S.best)) {
                g.fillStyle = '#92400e';
                g.font = font(800, 28);
                g.fillText('⭐ 올해의 한 줄', 80, ly);
                g.fillStyle = '#0f172a';
                g.font = font(800, 34);
                g.fillText(fit(`“${lineOf(S.best)}”`, 920), 80, ly + 48);
                ly += 100;
            }
            const picked = S.picked.filter((k) => k !== S.best && lineOf(k)).slice(0, MAX_PICK);
            picked.forEach((k) => {
                if (ly > H - 110) return;
                g.fillStyle = '#64748b';
                g.font = font(700, 22);
                g.fillText(dayLabel(k), 80, ly);
                g.fillStyle = '#1e293b';
                g.font = font(700, 28);
                g.fillText(fit(lineOf(k), 820), 220, ly);
                ly += 46;
            });
            g.textAlign = 'center';
            g.fillStyle = '#94a3b8';
            g.font = font(600, 24);
            g.fillText('미니게임 천국 · 한 줄 눈사람', W / 2, H - 44);
            return new Promise((res) => cv.toBlob(res, 'image/png'));
        }

        // ════════════════════════════════════════════════════════════
        //  백업
        // ════════════════════════════════════════════════════════════
        function openBackup() {
            openSheet(`<h2>💾 백업 코드</h2>
                <p class="hint">폰을 바꾸거나 다른 브라우저에서 이어 쓸 때 쓰세요. 이 코드에는 내 기록이 모두 들어 있으니 남에게 보내지 마세요.</p>
                <textarea class="txt code-box" id="backup-out" readonly>${esc(`SD${Codec.pack(S)}`)}</textarea>
                <button class="btn btn-primary btn-block" data-act="backup-copy" type="button" style="margin-top:8px">📋 코드 복사</button>
                <label class="field" for="backup-in">다른 곳의 코드 불러오기</label>
                <textarea class="txt code-box" id="backup-in" placeholder="SD로 시작하는 코드를 붙여 넣으세요"></textarea>
                <p class="error" id="backup-error"></p>
                <div class="btn-row"><button class="btn btn-ghost" data-act="sheet-close" type="button">닫기</button><button class="btn btn-primary" data-act="backup-import" type="button">불러오기</button></div>`);
        }

        function importBackup(raw) {
            const code = raw.replace(/\s+/g, '');
            if (!code.startsWith('SD')) throw new Error('SD로 시작하는 백업 코드가 아니에요.');
            let st;
            try { st = Codec.unpack(code.slice(2)); } catch { throw new Error('코드가 잘렸거나 깨졌어요.'); }
            if (st.v !== 1 || typeof st.days !== 'object' || !Array.isArray(st.wear) || typeof st.name !== 'string') throw new Error('눈사람 기록이 맞지 않아요.');
            return st;
        }

        // ════════════════════════════════════════════════════════════
        //  버튼 동작
        // ════════════════════════════════════════════════════════════
        const readLine = (k) => document.querySelector(`input[data-line="${k}"]`)?.value.replace(/\s+/g, ' ').trim().slice(0, MAX_LINE) || '';
        const setErr = (k, m) => { const el = document.querySelector(`[data-err="${k}"]`); if (el) el.textContent = m; };
        const canWrite = (k) => writableDays(S).includes(k) && (!S.days[k] || k === Clock.today());

        const ACT = {
            home() { closeSheet(); renderMain(); },
            'sheet-close': closeSheet,
            external() { location.href = `kakaotalk://web/openExternal?url=${encodeURIComponent(location.href)}`; },
            start() {
                const name = $('name').value.trim();
                if (!name) { $('start-error').textContent = '이름을 적어 주세요.'; return; }
                S = newState(name);
                save();
                renderMain();
            },
            swap(el) {
                const k = el.dataset.day;
                if (!canWrite(k) || (S.swaps[k] || 0) >= MAX_SWAPS) return;
                const keep = readLine(k);
                S.swaps[k] = (S.swaps[k] || 0) + 1;
                save();
                renderMain();
                const inp = document.querySelector(`input[data-line="${k}"]`);
                if (inp) inp.value = keep;
            },
            free(el) {
                const k = el.dataset.day;
                const keep = readLine(k);
                UI.free[k] = !(UI.free[k] ?? (S.days[k] ? S.days[k].q == null : false));
                renderMain();
                const inp = document.querySelector(`input[data-line="${k}"]`);
                if (inp) inp.value = keep;
            },
            mood(el) {
                const k = el.dataset.day;
                UI.mood[k] = UI.mood[k] === el.dataset.mood ? '' : el.dataset.mood;
                el.closest('.moods').querySelectorAll('.mood').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mood === UI.mood[k])));
            },
            write(el) {
                const k = el.dataset.day;
                if (!canWrite(k)) return;
                const text = readLine(k);
                if (!text) { setErr(k, '한 줄을 적어 주세요. 쓰기 싫은 날은 패스해도 돼요.'); return; }
                const free = UI.free[k] ?? (S.days[k] ? S.days[k].q == null : false);
                const editing = Boolean(S.days[k]);
                const q = free ? null : (editing && S.days[k].q != null && UI.editing === k ? S.days[k].q : questionFor(S, k));
                S.days[k] = { q, text, pass: false, mood: UI.mood[k] ?? S.days[k]?.mood ?? '', at: Clock.stamp() };
                UI.editing = '';
                delete UI.free[k];
                delete UI.mood[k];
                save();
                if (editing) { renderMain(); toast('✏️ 고쳤어요'); } else startRoll(k);
            },
            pass(el) {
                const k = el.dataset.day;
                if (!canWrite(k)) return;
                const editing = Boolean(S.days[k]);
                S.days[k] = { q: null, text: '', pass: true, mood: '', at: Clock.stamp() };
                UI.editing = '';
                if (S.best === k) S.best = '';
                S.picked = S.picked.filter((x) => x !== k);
                save();
                if (editing) renderMain(); else startRoll(k);
            },
            edit(el) { UI.editing = el.dataset.day; renderMain(); },
            'roll-tap'() { UI.rollAdd?.(0.34); },
            peek(el) {
                const k = el.dataset.day;
                const d = S.days[k];
                if (!d) return;
                openSheet(`<h2>${dayLabel(k)} ${WEATHER[weatherOf(k)].e}</h2><p class="hint">${d.q == null ? '✏️ 자유 기록' : esc(QUESTIONS[d.q][0])}</p><div class="saved-line">${esc(lineOf(k))}</div><button class="btn btn-ghost btn-block" data-act="sheet-close" type="button">닫기</button>`);
            },
            wear(el) {
                const id = el.dataset.item;
                const it = ITEMS.find((x) => x.id === id);
                if (!it || recordedOf(S) < it.at) return;
                const on = S.wear.includes(id);
                S.wear = on ? S.wear.filter((x) => x !== id) : [...S.wear, id];
                save();
                renderMain();
                const need = it.needs === 'head' ? recordedOf(S) >= 21 : recordedOf(S) >= 14;
                if (!on && !need) toast(`${it.e} ${it.needs === 'head' ? '머리가 생기면(21일)' : '팔이 생기면(14일)'} 보여요`);
            },
            wish() {
                const t = $('wish').value.replace(/\s+/g, ' ').trim().slice(0, 24);
                if (!t) { $('wish-error').textContent = '소원을 적어 주세요.'; return; }
                S.wish = t;
                save();
                Sound.sparkle();
                renderMain();
                toast('🪧 눈사람이 소원 팻말을 들었어요');
            },
            'wish-edit'() { const w = S.wish; S.wish = ''; renderMain(); $('wish').value = w; },
            report() { renderReport(); },
            'pick-best'() { openPick('best'); },
            'pick-lines'() { openPick('lines'); },
            'save-best'() {
                const v = $('sheet').querySelector('input:checked')?.value || '';
                S.best = v;
                save();
                closeSheet();
                renderReport();
            },
            'save-lines'() {
                S.picked = [...$('sheet').querySelectorAll('input:checked')].map((c) => c.value).slice(0, MAX_PICK);
                save();
                closeSheet();
                renderReport();
            },
            async card() {
                try {
                    const blob = await makeCard();
                    if (!blob) throw new Error('blob');
                    await saveToGallery(blob, `snowman-${S.year}.png`);
                } catch {
                    toast('카드를 만들지 못했어요. 다시 시도해 주세요');
                }
            },
            backup() { openBackup(); },
            async 'backup-copy'() { if (await copyText($('backup-out').value)) toast('백업 코드를 복사했어요'); },
            'backup-import'() {
                try {
                    const st = importBackup($('backup-in').value);
                    if (!confirm('지금 기록을 이 백업으로 바꿀까요? 지금 기록은 사라져요.')) return;
                    S = st;
                    save();
                    closeSheet();
                    renderMain();
                    toast('⛄ 기록을 불러왔어요');
                } catch (e) {
                    $('backup-error').textContent = e.message;
                }
            },
            restart() {
                if (S && !confirm('지금 기록을 지우고 처음부터 시작할까요? (먼저 카드나 백업 코드를 저장해 두세요)')) return;
                S = null;
                Store.clear();
                renderStart();
            }
        };

        document.addEventListener('click', (e) => {
            const el = e.target.closest('[data-act]');
            if (!el) {
                if (e.target === $('sheet-bg')) closeSheet();
                return;
            }
            const fn = ACT[el.dataset.act];
            if (fn && !el.disabled) { e.preventDefault(); fn(el, e); }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !$('sheet-bg').hidden) closeSheet();
            if (e.key === 'Enter' && e.target.matches?.('input[data-line]')) {
                e.preventDefault();
                ACT.write({ dataset: { day: e.target.dataset.line } });
            }
        });

        // ── 시작 ──
        $('defs-host').innerHTML = DEFS;
        renderBanners();
        if (S) renderMain(); else renderStart();
    </script>
