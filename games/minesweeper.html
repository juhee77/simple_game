<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지뢰찾기 - 미니게임 천국</title>
    <link rel="stylesheet" href="../styles/game-common.css?v=308950af">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        #minesweeper-board {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 2px;
            background: var(--bg-secondary);
            padding: 1rem;
            border-radius: 12px;
            max-width: 500px;
            margin: 0 auto;
        }

        .mine-cell {
            aspect-ratio: 1;
            background: linear-gradient(135deg, #2a3150, #1f2540);
            border: 2px solid rgba(99, 102, 241, 0.3);
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(0.875rem, 2.5vw, 1.25rem);
            font-weight: 700;
            transition: all 0.15s ease;
            user-select: none;
            touch-action: manipulation;
        }

        .mine-cell:hover:not(.revealed):not(.flagged) {
            background: linear-gradient(135deg, #3a4160, #2f3550);
            border-color: var(--accent-primary);
            transform: scale(1.05);
        }

        .mine-cell.revealed {
            background: rgba(99, 102, 241, 0.05);
            border-color: rgba(99, 102, 241, 0.1);
            cursor: default;
        }

        .mine-cell.flagged {
            background: linear-gradient(135deg, #ec4899, #f43f5e);
        }

        .mine-cell.mine {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }

        .mine-cell[data-count="1"] {
            color: #3b82f6;
        }

        .mine-cell[data-count="2"] {
            color: #10b981;
        }

        .mine-cell[data-count="3"] {
            color: #f59e0b;
        }

        .mine-cell[data-count="4"] {
            color: #8b5cf6;
        }

        .mine-cell[data-count="5"] {
            color: #ec4899;
        }

        .mine-cell[data-count="6"] {
            color: #06b6d4;
        }

        .mine-cell[data-count="7"] {
            color: #f97316;
        }

        .mine-cell[data-count="8"] {
            color: #ef4444;
        }

        .difficulty-selector {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .difficulty-btn {
            padding: 0.5rem 1rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .difficulty-btn.active {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border-color: var(--accent-primary);
        }

        .difficulty-btn:hover {
            border-color: var(--accent-primary);
        }

        .mine-cell.long-pressing {
            transform: scale(0.92);
            border-color: #f43f5e;
            box-shadow: 0 0 0 3px rgba(244, 63, 94, 0.2);
        }
    </style>
    <script src="../scripts/game-common.js?v=b7c7301f"></script>
</head>

<body>
    <div class="game-container">
        <div class="game-header">
            <a href="../index.html" class="back-button">← 메인으로</a>
            <h1 class="game-title">💣 지뢰찾기</h1>
            <p class="game-description">지뢰를 피해 모든 칸을 열어보세요!</p>
        </div>

        <div class="difficulty-selector">
            <button class="difficulty-btn active" onclick="setDifficulty('easy', this)">쉬움 (10x10, 10개)</button>
            <button class="difficulty-btn" onclick="setDifficulty('medium', this)">보통 (12x12, 20개)</button>
            <button class="difficulty-btn" onclick="setDifficulty('hard', this)">어려움 (15x15, 35개)</button>
        </div>

        <div class="status-bar">
            <div class="status-item">
                <span class="status-label">남은 지뢰</span>
                <div class="status-value" id="mines-left">10</div>
            </div>
            <div class="status-item">
                <span class="status-label">시간</span>
                <div class="status-value" id="timer">0</div>
            </div>
            <div class="status-item">
                <span class="status-label">최고 기록</span>
                <div class="status-value" id="best-time">-</div>
            </div>
        </div>

        <div class="game-board">
            <div id="minesweeper-board"></div>
        </div>

        <div class="controls">
            <button class="button" onclick="resetGame()">새 게임</button>
        </div>

        <div style="text-align: center; margin-top: 1rem; color: var(--text-secondary); font-size: 0.9rem;">
            탭/좌클릭: 열기 | 우클릭/모바일 꾹 누르기: 깃발
        </div>
    </div>

    <script>
        const LONG_PRESS_DURATION = 380;

        let ROWS = 10;
        let COLS = 10;
        let MINES = 10;
        let board = [];
        let revealed = [];
        let flagged = [];
        let gameOver = false;
        let gameStarted = false;
        let timer = 0;
        let timerInterval;
        let longPressTimer = null;
        let longPressKey = null;
        let suppressClickKey = null;

        let currentLevel = 'easy';
        const bestKey = () => `minesweeper-best-${currentLevel}`;

        const difficulties = {
            easy: { rows: 10, cols: 10, mines: 10 },
            medium: { rows: 12, cols: 12, mines: 20 },
            hard: { rows: 15, cols: 15, mines: 35 }
        };

        function cellKey(row, col) {
            return `${row}-${col}`;
        }

        function clearLongPressState(cell = null) {
            if (longPressTimer) {
                clearTimeout(longPressTimer);
                longPressTimer = null;
            }

            if (cell) {
                cell.classList.remove('long-pressing');
            } else {
                document.querySelectorAll('.mine-cell.long-pressing').forEach((pressedCell) => {
                    pressedCell.classList.remove('long-pressing');
                });
            }

            longPressKey = null;
        }

        function setDifficulty(level, button) {
            currentLevel = level;
            const config = difficulties[level];
            ROWS = config.rows;
            COLS = config.cols;
            MINES = config.mines;

            document.querySelectorAll('.difficulty-btn').forEach(btn => btn.classList.remove('active'));
            button.classList.add('active');

            resetGame();
        }

        function initGame() {
            board = Array(ROWS).fill(null).map(() => Array(COLS).fill(0));
            revealed = Array(ROWS).fill(null).map(() => Array(COLS).fill(false));
            flagged = Array(ROWS).fill(null).map(() => Array(COLS).fill(false));
            gameOver = false;
            gameStarted = false;
            timer = 0;
            clearInterval(timerInterval);
            clearLongPressState();
            suppressClickKey = null;

            // 지뢰는 첫 클릭 시점에 배치한다 (placeMines 참고).
            renderBoard();
            updateUI();
            renderBestTime();
        }

        function renderBestTime() {
            const best = loadBestRecord(bestKey());
            document.getElementById('best-time').textContent = best === null ? '-' : `${best}초`;
        }

        // 첫 클릭 칸과 그 주변 8칸을 비워 두고 지뢰를 배치한다.
        // 첫 수에 즉사하지 않게 하고, 곧바로 빈 영역이 열리도록 하기 위함이다.
        function placeMines(safeRow, safeCol) {
            const totalCells = ROWS * COLS;
            // 안전지대를 다 빼면 지뢰를 못 놓는 좁은 판에서는 클릭한 칸만 보호한다.
            const wideSafe = totalCells - 9 >= MINES;

            const isSafe = (row, col) => {
                if (row === safeRow && col === safeCol) return true;
                return wideSafe && Math.abs(row - safeRow) <= 1 && Math.abs(col - safeCol) <= 1;
            };

            let minesPlaced = 0;
            while (minesPlaced < MINES) {
                const row = Math.floor(Math.random() * ROWS);
                const col = Math.floor(Math.random() * COLS);
                if (board[row][col] === -1 || isSafe(row, col)) continue;
                board[row][col] = -1;
                minesPlaced++;
            }

            // Calculate numbers
            for (let i = 0; i < ROWS; i++) {
                for (let j = 0; j < COLS; j++) {
                    if (board[i][j] !== -1) {
                        board[i][j] = countAdjacentMines(i, j);
                    }
                }
            }
        }

        function countAdjacentMines(row, col) {
            let count = 0;
            for (let i = -1; i <= 1; i++) {
                for (let j = -1; j <= 1; j++) {
                    const newRow = row + i;
                    const newCol = col + j;
                    if (newRow >= 0 && newRow < ROWS && newCol >= 0 && newCol < COLS) {
                        if (board[newRow][newCol] === -1) count++;
                    }
                }
            }
            return count;
        }

        function renderBoard() {
            const boardElement = document.getElementById('minesweeper-board');
            boardElement.style.gridTemplateColumns = `repeat(${COLS}, 1fr)`;
            boardElement.innerHTML = '';

            for (let i = 0; i < ROWS; i++) {
                for (let j = 0; j < COLS; j++) {
                    const cell = document.createElement('div');
                    cell.className = 'mine-cell';
                    cell.dataset.row = i;
                    cell.dataset.col = j;

                    cell.addEventListener('click', () => {
                        const key = cellKey(i, j);
                        if (suppressClickKey === key) {
                            suppressClickKey = null;
                            return;
                        }
                        revealCell(i, j);
                    });
                    cell.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                        toggleFlag(i, j);
                    });
                    cell.addEventListener('pointerdown', (e) => handlePointerDown(e, i, j));
                    cell.addEventListener('pointerup', (e) => clearLongPressState(e.currentTarget));
                    cell.addEventListener('pointerleave', (e) => clearLongPressState(e.currentTarget));
                    cell.addEventListener('pointercancel', (e) => clearLongPressState(e.currentTarget));

                    boardElement.appendChild(cell);
                }
            }
        }

        function handlePointerDown(event, row, col) {
            if (event.pointerType !== 'touch' || gameOver || revealed[row][col]) {
                return;
            }

            const key = cellKey(row, col);
            const cell = event.currentTarget;
            longPressKey = key;
            cell.classList.add('long-pressing');

            longPressTimer = setTimeout(() => {
                if (longPressKey !== key) {
                    return;
                }

                toggleFlag(row, col);
                suppressClickKey = key;
                cell.classList.remove('long-pressing');
                if (navigator.vibrate) {
                    navigator.vibrate(24);
                }
                clearLongPressState();
            }, LONG_PRESS_DURATION);
        }

        function revealCell(row, col) {
            if (gameOver || revealed[row][col] || flagged[row][col]) return;

            if (!gameStarted) {
                gameStarted = true;
                placeMines(row, col);
                timerInterval = setInterval(() => {
                    timer++;
                    document.getElementById('timer').textContent = timer;
                }, 1000);
            }

            revealed[row][col] = true;
            const cell = document.querySelector(`[data-row="${row}"][data-col="${col}"]`);
            cell.classList.add('revealed');

            if (board[row][col] === -1) {
                // Hit a mine
                cell.classList.add('mine');
                cell.textContent = '💣';
                endGame(false);
                return;
            }

            if (board[row][col] > 0) {
                cell.textContent = board[row][col];
                cell.dataset.count = board[row][col];
            } else {
                // Reveal adjacent cells
                for (let i = -1; i <= 1; i++) {
                    for (let j = -1; j <= 1; j++) {
                        const newRow = row + i;
                        const newCol = col + j;
                        if (newRow >= 0 && newRow < ROWS && newCol >= 0 && newCol < COLS) {
                            revealCell(newRow, newCol);
                        }
                    }
                }
            }

            checkWin();
        }

        function toggleFlag(row, col) {
            if (gameOver || revealed[row][col]) return;

            flagged[row][col] = !flagged[row][col];
            const cell = document.querySelector(`[data-row="${row}"][data-col="${col}"]`);

            if (flagged[row][col]) {
                cell.classList.add('flagged');
                cell.textContent = '🚩';
            } else {
                cell.classList.remove('flagged');
                cell.textContent = '';
            }

            updateUI();
        }

        function checkWin() {
            let revealedCount = 0;
            for (let i = 0; i < ROWS; i++) {
                for (let j = 0; j < COLS; j++) {
                    if (revealed[i][j]) revealedCount++;
                }
            }

            if (revealedCount === ROWS * COLS - MINES) {
                endGame(true);
            }
        }

        function endGame(won) {
            gameOver = true;
            clearInterval(timerInterval);
            if (won) markGameCompleted('minesweeper');   // 오늘의 도전 (승리만 인정)

            // Reveal all mines
            for (let i = 0; i < ROWS; i++) {
                for (let j = 0; j < COLS; j++) {
                    if (board[i][j] === -1) {
                        const cell = document.querySelector(`[data-row="${i}"][data-col="${j}"]`);
                        cell.classList.add('revealed', 'mine');
                        cell.textContent = '💣';
                    }
                }
            }

            let isNewRecord = false;
            if (won) {
                isNewRecord = saveBestRecord(bestKey(), timer);
                renderBestTime();
            }

            setTimeout(() => {
                if (won) {
                    gameAlert(`🎉 승리! 시간: ${timer}초${isNewRecord ? '\n🏆 최고 기록 경신!' : ''}`);
                } else {
                    gameAlert('💥 게임 오버!');
                }
            }, 200);
        }

        function updateUI() {
            let flagCount = 0;
            for (let i = 0; i < ROWS; i++) {
                for (let j = 0; j < COLS; j++) {
                    if (flagged[i][j]) flagCount++;
                }
            }
            document.getElementById('mines-left').textContent = MINES - flagCount;
        }

        function resetGame() {
            initGame();
        }

        // Initialize
        initGame();
    </script>
    <script type="application/json" id="game-rules">
{
 "title": "지뢰찾기",
 "goal": "지뢰를 피해 지뢰가 아닌 칸을 모두 여세요.",
 "steps": [
  "난이도를 고르고 아무 칸이나 클릭합니다. 첫 클릭은 절대 지뢰가 아닙니다.",
  "숫자는 그 칸에 맞닿은 8칸 안의 지뢰 개수입니다.",
  "지뢰라고 확신하는 칸은 우클릭(모바일은 길게 누르기)으로 깃발을 꽂습니다.",
  "지뢰가 아닌 칸을 전부 열면 승리합니다."
 ],
 "tips": [
  "숫자 1 옆에 닫힌 칸이 하나뿐이면 그 칸이 지뢰입니다.",
  "난이도별 최고 기록이 저장됩니다."
 ],
 "players": "1인",
 "time": "약 10분"
}
</script>
</body>

</html>
