<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>중간 지점 찾기 | 미니게임 천국</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root {
      --bg: #0b0b1a;
      --card-bg: rgba(22, 22, 45, 0.7);
      --card-border: rgba(255, 255, 255, 0.1);
      --cyan: #00d4ff;
      --purple: #7c3aed;
      --pink: #ff006e;
      --yellow: #ffd166;
      --green: #06d6a0;
      --text-main: #ffffff;
      --text-dim: #94a3b8;
      --radius-card: 16px;
      --radius-btn: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Outfit', 'Pretendard', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    .container {
      max-width: 650px;
      margin: 0 auto;
      padding: 20px;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 10px 0;
    }

    .back-btn {
      position: absolute;
      left: 0;
      background: none;
      border: none;
      color: var(--cyan);
      font-size: 24px;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      transition: background 0.2s;
    }

    .back-btn:hover { background: rgba(0, 212, 255, 0.1); }

    h1 {
      font-size: 24px;
      font-weight: 800;
      background: linear-gradient(90deg, var(--cyan), var(--purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(10px);
      border-radius: var(--radius-card);
      padding: 20px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--card-border);
      color: white;
      padding: 12px 16px;
      border-radius: var(--radius-btn);
      font-family: inherit;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus { border-color: var(--cyan); }

    button {
      background: linear-gradient(135deg, var(--purple), var(--pink));
      border: none;
      color: white;
      padding: 12px 20px;
      border-radius: var(--radius-btn);
      font-family: inherit;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }

    button:hover { opacity: 0.9; }
    button:active { transform: scale(0.98); }

    .autocomplete-list {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #15152a;
      border: 1px solid var(--card-border);
      border-radius: var(--radius-btn);
      max-height: 200px;
      overflow-y: auto;
      z-index: 10;
      display: none;
      margin-top: 4px;
    }

    .autocomplete-item {
      padding: 12px 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--card-border);
    }

    .autocomplete-item:hover { background: rgba(255,255,255,0.05); }

    .line-badge {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
      color: white;
      white-space: nowrap;
    }
    
    /* Line Colors */
    .line-1호선 { background: #0052A4; }
    .line-2호선 { background: #009D3E; }
    .line-3호선 { background: #EF7C1C; }
    .line-4호선 { background: #00A5DE; }
    .line-5호선 { background: #996CAC; }
    .line-6호선 { background: #CD7C2F; }
    .line-7호선 { background: #747F00; }
    .line-8호선 { background: #EA545D; }
    .line-9호선 { background: #BDB092; }
    .line-신분당선 { background: #D4003B; }
    .line-경의중앙선 { background: #77C4A3; }
    .line-수인분당선 { background: #F5A200; }
    .line-공항철도 { background: #0090D2; }
    
    .participants {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 20px;
    }

    .participant-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,255,255,0.05);
      padding: 12px 16px;
      border-radius: var(--radius-btn);
      border: 1px solid rgba(255,255,255,0.05);
    }

    .participant-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .participant-name { font-weight: 600; }

    .remove-btn {
      background: transparent;
      color: var(--pink);
      padding: 4px 8px;
      font-size: 20px;
    }

    .calc-btn {
      width: 100%;
      padding: 16px;
      font-size: 18px;
      background: linear-gradient(135deg, var(--cyan), var(--purple));
      margin-top: 10px;
    }

    .calc-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .results {
      display: none;
      flex-direction: column;
      gap: 20px;
    }

    .map-container {
      width: 100%;
      height: 320px;
      background: rgba(0,0,0,0.5);
      border-radius: var(--radius-card);
      border: 1px solid var(--card-border);
      position: relative;
      overflow: hidden;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .sort-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .sort-tab {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--card-border);
      color: var(--text-dim);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .sort-tab.active {
      background: rgba(0, 212, 255, 0.15);
      border-color: var(--cyan);
      color: var(--cyan);
      font-weight: 600;
    }

    .station-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .result-item {
      display: flex;
      flex-direction: column;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-card);
      overflow: hidden;
      transition: border-color 0.2s, background 0.2s;
    }

    .result-item.selected, .result-item:first-child {
      border-color: var(--cyan);
      background: rgba(0, 212, 255, 0.04);
    }

    .result-header {
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      cursor: pointer;
    }

    .result-main-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .rank-title {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .rank-badge {
      font-weight: 800;
      font-size: 16px;
    }

    .rank-badge.top1 { color: var(--yellow); }
    .rank-badge.top2 { color: #e2e8f0; }
    .rank-badge.top3 { color: #cd7f32; }

    .station-name {
      font-weight: 700;
      font-size: 17px;
    }

    .avg-info {
      text-align: right;
    }

    .avg-dist {
      font-weight: 700;
      font-size: 15px;
      color: var(--cyan);
    }

    .avg-time {
      font-size: 12px;
      color: var(--text-dim);
    }

    .result-sub-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 6px;
      border-top: 1px solid rgba(255,255,255,0.05);
      font-size: 13px;
    }

    .fairness-tag {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--green);
      font-weight: 600;
    }

    .toggle-details-btn {
      color: var(--text-dim);
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .participant-breakdown {
      display: none;
      flex-direction: column;
      gap: 10px;
      padding: 14px 16px;
      background: rgba(0, 0, 0, 0.3);
      border-top: 1px solid rgba(255,255,255,0.05);
    }

    .breakdown-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .breakdown-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }

    .p-name-dept {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tag-max {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 10px;
      background: rgba(255, 0, 110, 0.2);
      color: var(--pink);
      border: 1px solid var(--pink);
    }

    .tag-min {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 10px;
      background: rgba(6, 214, 160, 0.2);
      color: var(--green);
      border: 1px solid var(--green);
    }

    .p-travel-val {
      font-weight: 600;
      color: white;
    }

    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background: rgba(255,255,255,0.1);
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--cyan), var(--purple));
      border-radius: 3px;
      transition: width 0.3s ease;
    }

    .share-btn {
      width: 100%;
      background: #2a2a4a;
    }

    .help-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      cursor: pointer;
      border: 1px solid var(--card-border);
      z-index: 100;
    }
    
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .modal-content {
      background: var(--bg);
      border: 1px solid var(--card-border);
      padding: 24px;
      border-radius: var(--radius-card);
      max-width: 420px;
      width: 100%;
    }
    
    .modal h2 { margin-bottom: 16px; color: var(--cyan); }
    .modal p { margin-bottom: 12px; line-height: 1.5; color: var(--text-dim); }
    .close-modal { margin-top: 16px; width: 100%; }

    .toast {
      position: fixed;
      bottom: -50px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--cyan);
      color: #000;
      padding: 10px 20px;
      border-radius: 20px;
      font-weight: 600;
      transition: bottom 0.3s;
      z-index: 1000;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <a href="../index.html" class="back-btn">←</a>
      <h1>중간 지점 찾기</h1>
    </header>

    <div class="card">
      <div class="input-group">
        <input type="text" id="nameInput" placeholder="이름 (예: 철수)" maxlength="10">
        <div class="input-row">
          <input type="text" id="stationInput" placeholder="출발역 검색 (예: 강남)" autocomplete="off">
          <button id="addBtn">추가</button>
        </div>
        <div class="autocomplete-list" id="autocompleteList"></div>
      </div>
      
      <div class="participants" id="participantList">
        <!-- Participants will be added here -->
      </div>
      
      <button class="calc-btn" id="calcBtn" disabled>중간 지점 계산하기</button>
    </div>

    <div class="card results" id="resultsSection">
      <h2>추천 모임 장소</h2>
      
      <div class="map-container">
        <canvas id="mapCanvas"></canvas>
      </div>

      <div class="sort-tabs">
        <button class="sort-tab active" data-sort="centroid">📍 지리적 중심 기준</button>
        <button class="sort-tab" data-sort="fairness">⚖️ 이동격차 최소 (공평함)</button>
        <button class="sort-tab" data-sort="time">⚡ 평균 이동시간 최소</button>
      </div>

      <div class="station-list" id="recommendedStations">
        <!-- Results here -->
      </div>
      <button class="share-btn" id="shareBtn">결과 공유 (클립보드 복사)</button>
    </div>
  </div>

  <div class="help-btn" id="helpBtn">?</div>

  <div class="modal" id="helpModal">
    <div class="modal-content">
      <h2>이용 방법 및 계산 방식</h2>
      <p>1. 모임 참가자의 이름과 출발 지하철역을 입력하세요 (2명~10명).</p>
      <p>2. <strong>지리적 중심점</strong>을 기반으로 수도권 250개 이상의 주요 지하철역과의 거리를 측정합니다.</p>
      <p>3. 각 참가자별 <strong>직선 및 이동 거리, 예상 시간, 이동 격차(공평도)</strong>를 종합 계산하여 최적의 추천 장소를 선정합니다.</p>
      <p>4. 카드를 클릭하면 <strong>참가자 개인별 세부 이동 정보</strong>를 바로 확인할 수 있습니다.</p>
      <button class="close-modal" id="closeHelpBtn">닫기</button>
    </div>
  </div>

  <div class="toast" id="toast">결과가 복사되었습니다!</div>

  <script>
    // --- Station Data Generator ---
    const STATIONS = [];
    
    function generateLine(namesStr, lineName, startLat, startLng, endLat, endLng) {
      const names = namesStr.split(", ");
      const n = names.length;
      for (let i = 0; i < n; i++) {
        let lat = startLat, lng = startLng;
        if (n > 1) {
          lat = startLat + (endLat - startLat) * (i / (n - 1));
          lng = startLng + (endLng - startLng) * (i / (n - 1));
        }
        lat += (Math.random() - 0.5) * 0.003;
        lng += (Math.random() - 0.5) * 0.003;
        STATIONS.push({ name: names[i], line: lineName, lat, lng });
      }
    }

    function generateCircle(namesStr, lineName, centerLat, centerLng, radiusLat, radiusLng) {
      const names = namesStr.split(", ");
      const n = names.length;
      for (let i = 0; i < n; i++) {
        const angle = (2 * Math.PI * i) / n;
        let lat = centerLat + radiusLat * Math.sin(angle);
        let lng = centerLng + radiusLng * Math.cos(angle);
        lat += (Math.random() - 0.5) * 0.003;
        lng += (Math.random() - 0.5) * 0.003;
        STATIONS.push({ name: names[i], line: lineName, lat, lng });
      }
    }

    // Populate data with approximate real coordinates
    generateLine("소요산, 동두천, 보산, 동두천중앙, 지행, 덕정, 덕계, 양주, 녹양, 가능, 의정부, 회룡, 망월사, 도봉산, 도봉, 방학, 창동, 녹천, 월계, 광운대, 석계, 신이문, 외대앞, 회기, 청량리, 제기동, 신설동, 동묘앞, 동대문, 종로5가, 종로3가, 종각, 시청, 서울역, 남영, 용산, 노량진, 대방, 신길, 영등포, 신도림, 구로, 구일, 개봉, 오류동, 온수, 역곡, 소사, 부천, 중동, 송내, 부개, 부평, 백운, 동암, 간석, 주안, 도화, 제물포, 도원, 동인천, 인천, 금천구청, 독산, 가산디지털단지, 관악, 안양, 명학, 금정, 군포, 당정, 의왕, 성균관대, 화서, 수원, 세류, 병점, 세마, 오산대, 오산, 진위, 송탄, 서정리, 지제, 평택, 성환, 직산, 두정, 천안, 봉명, 쌍용, 아산, 배방, 온양온천, 신창", "1호선", 37.948, 127.061, 36.769, 126.932);
    generateCircle("시청, 을지로입구, 을지로3가, 을지로4가, 동대문역사문화공원, 신당, 상왕십리, 왕십리, 한양대, 뚝섬, 성수, 건대입구, 구의, 강변, 잠실나루, 잠실, 잠실새내, 종합운동장, 삼성, 선릉, 역삼, 강남, 교대, 서초, 방배, 사당, 낙성대, 서울대입구, 봉천, 신림, 신대방, 구로디지털단지, 대림, 신도림, 문래, 영등포구청, 당산, 합정, 홍대입구, 신촌, 이대, 아현, 충정로", "2호선", 37.52, 126.98, 0.05, 0.08);
    generateLine("대화, 주엽, 정발산, 마두, 백석, 대곡, 화정, 원당, 원흥, 삼송, 지축, 구파발, 연신내, 불광, 녹번, 홍제, 무악재, 독립문, 경복궁, 안국, 종로3가, 을지로3가, 충무로, 동대입구, 약수, 금호, 옥수, 압구정, 신사, 잠원, 고속터미널, 교대, 남부터미널, 양재, 매봉, 도곡, 대치, 학여울, 대청, 일원, 수서, 가락시장, 경찰병원, 오금", "3호선", 37.676, 126.747, 37.502, 127.127);
    generateLine("진접, 오남, 별내별가람, 당고개, 상계, 노원, 창동, 쌍문, 수유, 미아, 미아사거리, 성신여대입구, 한성대입구, 혜화, 동대문, 동대문역사문화공원, 충무로, 명동, 회현, 서울역, 숙대입구, 삼각지, 신용산, 이촌, 동작, 총신대입구, 사당, 남태령, 선바위, 경마공원, 대공원, 과천, 정부과천청사, 인덕원, 평촌, 범계, 금정, 산본, 수리산, 대야미, 반월, 상록수, 한대앞, 중앙, 고잔, 초지, 안산, 신길온천, 정왕, 오이도", "4호선", 37.718, 127.190, 37.345, 126.736);

    // Audio Context Setup

    function playSound(type) {

      }
      if(audioCtx.state === 'suspended') audioCtx.resume();
      
      const osc = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      
      osc.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      
      const now = audioCtx.currentTime;
      
      if (type === 'add') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
        gainNode.gain.setValueAtTime(0, now);
        gainNode.gain.linearRampToValueAtTime(0.3, now + 0.05);
        gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
      } else if (type === 'remove') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(150, now + 0.15);
        gainNode.gain.setValueAtTime(0, now);
        gainNode.gain.linearRampToValueAtTime(0.3, now + 0.05);

    // Haversine distance formula (in km)
    function getDistance(lat1, lon1, lat2, lon2) {
      const R = 6371; 
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }

    // Estimate transit travel time in minutes from distance
    function estTravelTime(distKm) {
      return Math.round(distKm * 2.2 + 3);
    }

          div.className = 'autocomplete-item';

      const stName = stationInput.value.trim();
      
      let st = selectedStation;
      if (!st || st.name !== stName) {
        st = STATIONS.find(s => s.name === stName);

        participantList.appendChild(div);

      calcBtn.disabled = participants.length < 2;

    // Calculate Midpoint and all per-participant details
    calcBtn.addEventListener('click', () => {
      if (participants.length < 2) return;
      playSound('calc');
      
      let sumLat = 0, sumLng = 0;
      participants.forEach(p => {
        sumLat += p.station.lat;
        sumLng += p.station.lng;
      });
      
      computedMidpoint = {
        lat: sumLat / participants.length,
        lng: sumLng / participants.length
      };
      
      // Calculate travel details for every station
      const computed = STATIONS.map(st => {
        const distFromMid = getDistance(computedMidpoint.lat, computedMidpoint.lng, st.lat, st.lng);
        
        let sumDist = 0;
        let sumTime = 0;
        let maxDist = 0;
        let minDist = Infinity;
        
        const details = participants.map(p => {
          const d = getDistance(p.station.lat, p.station.lng, st.lat, st.lng);
          const t = estTravelTime(d);
          sumDist += d;
          sumTime += t;
          if (d > maxDist) maxDist = d;
          if (d < minDist) minDist = d;
          return {
            name: p.name,
            fromStation: p.station.name,
            fromLine: p.station.line,
            dist: d,
            time: t
          };
        });
        
        const avgDist = sumDist / participants.length;
        const avgTime = Math.round(sumTime / participants.length);
        const distGap = maxDist - minDist;
        const fairnessScore = Math.max(0, Math.round(100 - distGap * 7.5));
        
        return {
          ...st,
          distFromMid,
          avgDist,
          avgTime,
          maxDist,
          minDist,
          distGap,
          fairnessScore,
          details
        };
      });
      
      // Remove duplicate station names across different line entries (take best representative)
      const uniqueMap = new Map();
      computed.forEach(st => {
        if (!uniqueMap.has(st.name) || uniqueMap.get(st.name).distFromMid > st.distFromMid) {
          uniqueMap.set(st.name, st);
        }
      });
      
      recommendedList = Array.from(uniqueMap.values());
      sortResults();
      selectedStationIndex = 0;
      renderResults();
    });

    function sortResults() {
      if (currentSort === 'centroid') {
        recommendedList.sort((a, b) => a.distFromMid - b.distFromMid);
      } else if (currentSort === 'fairness') {
        recommendedList.sort((a, b) => a.distGap - b.distGap || a.avgDist - b.avgDist);
      } else if (currentSort === 'time') {
        recommendedList.sort((a, b) => a.avgTime - b.avgTime || a.avgDist - b.avgDist);
      }
    }

        const rankClass = i === 0 ? 'top1' : i === 1 ? 'top2' : i === 2 ? 'top3' : '';
        
        // Find max travel dist for scaling progress bars
        const maxPdist = Math.max(...st.details.map(d => d.dist), 0.1);

        let detailsHtml = '';
        st.details.forEach(d => {
          const isMax = d.dist === st.maxDist && st.details.length > 1;
          const isMin = d.dist === st.minDist && st.details.length > 1;
          const pct = Math.round((d.dist / maxPdist) * 100);
          
          let tagHtml = '';
          if (isMax) tagHtml = `<span class="tag-max">🚶‍♂️ 최장</span>`;

          detailsHtml += `

              </div>
              <div class="toggle-details-btn" id="toggleBtn-${i}">
                👤 참가자별 상세 <span>▼</span>
              </div>
            </div>
          </div>
          <div class="participant-breakdown" id="breakdown-${i}">
            ${detailsHtml}
          </div>
        `;
        
        recommendedStations.appendChild(item);
      });
      
      // Auto open selected breakdown
      const breakdownEl = document.getElementById(`breakdown-${selectedStationIndex}`);

        const itemEl = recommendedStations.children[i];
        
        if (i === index) {
          const isOpened = breakdownEl.style.display === 'flex';
          breakdownEl.style.display = isOpened ? 'none' : 'flex';
          if (toggleEl) toggleEl.querySelector('span').textContent = isOpened ? '▼' : '▲';
          if (itemEl) itemEl.classList.add('selected');
        } else {
          if (breakdownEl) breakdownEl.style.display = 'none';
          if (toggleEl) toggleEl.querySelector('span').textContent = '▼';
          if (itemEl) itemEl.classList.remove('selected');
        }
      });
      
      drawMap();
    }
    
    function drawMap() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      const topSpots = recommendedList.slice(0, 5);
      const activeSpot = topSpots[selectedStationIndex] || topSpots[0];
      
      let minLat = computedMidpoint.lat, maxLat = computedMidpoint.lat;
      let minLng = computedMidpoint.lng, maxLng = computedMidpoint.lng;
      
      participants.forEach(p => {
        minLat = Math.min(minLat, p.station.lat);
        maxLat = Math.max(maxLat, p.station.lat);
        minLng = Math.min(minLng, p.station.lng);
        maxLng = Math.max(maxLng, p.station.lng);
      });
      
      topSpots.forEach(st => {
        minLat = Math.min(minLat, st.lat);
        maxLat = Math.max(maxLat, st.lat);
        minLng = Math.min(minLng, st.lng);
        maxLng = Math.max(maxLng, st.lng);
      });
      
      const padLat = Math.max((maxLat - minLat) * 0.25, 0.05);
      const padLng = Math.max((maxLng - minLng) * 0.25, 0.05);
      minLat -= padLat; maxLat += padLat;
      minLng -= padLng; maxLng += padLng;
      
      function getXY(lat, lng) {
        const x = (lng - minLng) / (maxLng - minLng) * canvas.width;
        const y = canvas.height - ((lat - minLat) / (maxLat - minLat) * canvas.height);
        return {x, y};
      }
      
      const midPos = getXY(computedMidpoint.lat, computedMidpoint.lng);
      const activeSpotPos = activeSpot ? getXY(activeSpot.lat, activeSpot.lng) : midPos;
      
      // 1. Draw dashed lines from participants to active selected station spot
      participants.forEach((p, idx) => {
        const pos = getXY(p.station.lat, p.station.lng);
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
        ctx.lineTo(activeSpotPos.x, activeSpotPos.y);
        ctx.lineWidth = 2;
        ctx.strokeStyle = 'rgba(0, 212, 255, 0.4)';
        ctx.setLineDash([4, 4]);
        ctx.stroke();
        ctx.setLineDash([]);
        
        // Label distance along the line
        if (activeSpot) {
          const midX = (pos.x + activeSpotPos.x) / 2;
          const midY = (pos.y + activeSpotPos.y) / 2;
          const distVal = activeSpot.details[idx] ? activeSpot.details[idx].dist.toFixed(1) : '';
          
          ctx.fillStyle = 'rgba(11, 11, 26, 0.8)';
          ctx.fillRect(midX - 18, midY - 9, 36, 16);
          ctx.fillStyle = '#00d4ff';
          ctx.font = 'bold 10px Outfit, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(`${distVal}km`, midX, midY + 3);
        }
      });
      
      // 2. Draw participant points
      participants.forEach(p => {
        const pos = getXY(p.station.lat, p.station.lng);
        ctx.beginPath();
        ctx.arc(pos.x, pos.y, 7, 0, Math.PI * 2);
        ctx.fillStyle = '#ff006e';
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();
        
        ctx.fillStyle = 'rgba(255,255,255,0.95)';
        ctx.font = 'bold 12px Outfit, Pretendard, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(p.name, pos.x, pos.y - 12);
      });
      
      // 3. Draw recommended spots
      topSpots.forEach((st, i) => {
        const pos = getXY(st.lat, st.lng);
        const isSelected = i === selectedStationIndex;
        
        ctx.beginPath();
        ctx.arc(pos.x, pos.y, isSelected ? 10 : 6, 0, Math.PI * 2);
        ctx.fillStyle = isSelected ? '#ffd166' : i === 0 ? '#00d4ff' : '#7c3aed';
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = isSelected ? 3 : 1.5;
        ctx.stroke();
        
        ctx.fillStyle = isSelected ? '#ffd166' : i === 0 ? '#00d4ff' : 'rgba(255,255,255,0.8)';
        ctx.font = isSelected ? 'bold 14px Outfit, sans-serif' : '11px Outfit, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(`${i+1}위 ${st.name}`, pos.x, pos.y + (isSelected ? 22 : 18));
      });
    }

    // Share result to clipboard
    document.getElementById('shareBtn').addEventListener('click', () => {
      const topSpots = recommendedList.slice(0, 5);
      if (!topSpots.length) return;
      
      let text = `📍 중간 지점 모임 장소 추천 결과\n\n`;
      text += `[👥 참가자 출발지]\n`;
      participants.forEach(p => {
        text += `- ${p.name}: ${p.station.name}역 (${p.station.line})\n`;
      });
      
      text += `\n[🏆 추천 모임 장소 Top 5]\n`;
      topSpots.forEach((st, i) => {
        text += `\n${i+1}위: ${st.name}역 (${st.line})\n`;
        text += `• 평균 이동: ${st.avgDist.toFixed(1)}km (약 ${st.avgTime}분)\n`;
        text += `• 공평도: ${st.fairnessScore}점 (격차 ${st.distGap.toFixed(1)}km)\n`;
        text += `* 참가자별 이동:\n`;
        st.details.forEach(d => {
          text += `  - ${d.name} (${d.fromStation}역): ${d.dist.toFixed(1)}km (약 ${d.time}분)\n`;
        });
      });
      
      navigator.clipboard.writeText(text).then(() => {
        const toast = document.getElementById('toast');
        toast.style.bottom = '20px';
        setTimeout(() => { toast.style.bottom = '-50px'; }, 2000);
      });
    });
    
    // Help Modal
    const helpBtn = document.getElementById('helpBtn');
    const helpModal = document.getElementById('helpModal');
    const closeHelpBtn = document.getElementById('closeHelpBtn');
    
    helpBtn.addEventListener('click', () => helpModal.style.display = 'flex');
    closeHelpBtn.addEventListener('click', () => helpModal.style.display = 'none');
    helpModal.addEventListener('click', (e) => {
      if(e.target === helpModal) helpModal.style.display = 'none';
    });
  </script>
</body>
</html>
