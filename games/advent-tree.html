<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>어드벤트 트리 - 미니게임 천국</title>
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="미니게임 천국">
    <meta property="og:title" content="어드벤트 트리 - 미니게임 천국">
    <meta property="og:description" content="친구들이 달아 준 장식과 편지가 12월 25일에 한꺼번에 열려요. 12월 1일부터 매일 키우는 트리">
    <meta property="og:url" content="https://juhee77.github.io/simple_game/games/advent-tree.html">
    <meta property="og:image" content="https://juhee77.github.io/simple_game/assets/og/advent-tree.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="description" content="12월 1일부터 25일까지 매일 물을 주고 장식을 뽑아 키우는 크리스마스 트리. 친구가 보낸 장식은 크리스마스에 열려요.">
    <link rel="stylesheet" href="../styles/pretendard.css?v=c17883c9">
    <link rel="stylesheet" href="../styles/design-system.css?v=d12c2b80">
    <link rel="stylesheet" href="../styles/game-common.css?v=2187f848">
    <script src="../scripts/game-common.js?v=efdc1560"></script>
    <!-- 어드벤트 트리 서버(Cloudflare Worker, workers/tree-api) 주소. 비워 두면 서버 없이 링크로만 주고받는다. -->
    <meta name="tree-api" content="https://advent-tree-api.lahezy.workers.dev">
    <style>
        :root {
            /* 이 페이지만의 겨울 밤 색 */
            --night-1: #0b1530;
            --night-2: #1b2a4a;
            --pine: #1e7d4f;
            --gold: #f5b83d;
            --berry: #c2263b;
            --berry-soft: #fdecee;
            --sky-text: #eef2ff;
            --sky-muted: #b8c2dc;
        }

        body {
            padding-top: max(1.25rem, env(safe-area-inset-top));
            padding-bottom: max(5rem, env(safe-area-inset-bottom));
        }

        @media (max-width: 768px) {
            body {
                padding-left: max(1rem, env(safe-area-inset-left));
                padding-right: max(1rem, env(safe-area-inset-right));
                padding-top: max(1rem, env(safe-area-inset-top));
            }
        }

        [hidden] {
            display: none !important;
        }

        .wrap {
            max-width: 720px;
            margin: 0 auto;
        }

        .wrap .game-header {
            margin-bottom: 1rem;
        }

        .panel {
            padding: 18px;
            margin-bottom: 12px;
            border: 1px solid var(--line);
            border-radius: var(--r-lg);
            background: var(--surface);
            box-shadow: var(--shadow-sm);
        }

        .panel h2,
        .panel h3 {
            margin: 0 0 6px;
            font-size: 1.08rem;
            font-weight: 800;
        }

        .hint {
            margin: 0 0 12px;
            font-size: .88rem;
            color: var(--text-2);
            line-height: 1.55;
        }

        .error {
            min-height: 1.2em;
            margin: 6px 0 0;
            font-size: .9rem;
            font-weight: 700;
            color: var(--bad);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 13px 16px;
            border: none;
            border-radius: var(--r-md);
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            text-decoration: none;
            line-height: 1.2;
        }

        .btn:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .btn:not(:disabled):active {
            transform: scale(.98);
        }

        .btn-primary {
            background: var(--accent);
            color: var(--on-accent);
        }

        .btn-festive {
            background: var(--berry);
            color: #fff;
        }

        .btn-water {
            background: #2563eb;
            color: #fff;
        }

        .btn-ghost {
            background: var(--surface-2);
            color: var(--text);
        }

        .btn-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-row .btn {
            flex: 1 1 140px;
        }

        .btn-block {
            width: 100%;
        }

        .text-btn {
            border: none;
            background: none;
            padding: 6px;
            color: var(--accent-ink);
            font-size: .9rem;
            font-weight: 700;
            cursor: pointer;
        }

        .badge-dot {
            display: inline-block;
            min-width: 8px;
            height: 8px;
            margin-left: 4px;
            border-radius: 50%;
            background: #f43f5e;
            vertical-align: top;
        }

        input.txt,
        textarea.txt {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            border: 1px solid var(--line-strong);
            border-radius: var(--r-md);
            background: var(--surface-2);
            color: var(--text);
        }

        textarea.txt {
            min-height: 90px;
            resize: vertical;
            line-height: 1.5;
        }

        label.field {
            display: block;
            margin: 12px 0 6px;
            font-size: .9rem;
            font-weight: 800;
        }

        .count {
            float: right;
            font-weight: 600;
            color: var(--muted);
        }

        /* ── 안내 배너 ── */
        .banner {
            padding: 12px 14px;
            margin-bottom: 12px;
            border-radius: var(--r-md);
            background: var(--warn-soft);
            color: var(--text);
            font-size: .9rem;
            line-height: 1.5;
        }

        .banner b {
            display: block;
            margin-bottom: 2px;
        }

        .banner .btn {
            margin-top: 8px;
            padding: 9px 12px;
            font-size: .9rem;
        }

        /* ── 심기 ── */
        .mode-grid {
            display: grid;
            gap: 10px;
        }

        .mode-card {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 14px;
            border: 2px solid var(--line);
            border-radius: var(--r-lg);
            background: var(--surface);
            cursor: pointer;
        }

        .mode-card:has(input:checked) {
            border-color: var(--accent);
            background: var(--accent-soft);
        }

        .mode-card input {
            margin-top: 4px;
            width: 18px;
            height: 18px;
            accent-color: var(--accent);
        }

        .mode-card b {
            display: block;
            font-size: 1.02rem;
        }

        .mode-card span {
            font-size: .88rem;
            color: var(--text-2);
            line-height: 1.45;
        }

        .invite-box {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 14px;
            margin-bottom: 12px;
            border-radius: var(--r-lg);
            background: var(--berry-soft);
        }

        .invite-box .e {
            font-size: 2rem;
        }

        .invite-box p {
            margin: 0;
            line-height: 1.5;
        }

        /* ── 밤하늘 무대 ── */
        .sky {
            position: relative;
            overflow: hidden;
            padding: 14px 12px 10px;
            border-radius: var(--r-lg);
            background:
                radial-gradient(circle at 20% 15%, rgba(255, 255, 255, .08), transparent 35%),
                linear-gradient(180deg, var(--night-1), var(--night-2));
            color: var(--sky-text);
        }

        .sky::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background-image:
                radial-gradient(1.5px 1.5px at 12% 18%, #fff, transparent),
                radial-gradient(1px 1px at 30% 8%, #fff, transparent),
                radial-gradient(1.5px 1.5px at 72% 12%, #fff, transparent),
                radial-gradient(1px 1px at 88% 30%, #fff, transparent),
                radial-gradient(1px 1px at 55% 22%, #fff, transparent),
                radial-gradient(1.5px 1.5px at 8% 42%, #fff, transparent),
                radial-gradient(1px 1px at 93% 55%, #fff, transparent);
            opacity: .7;
        }

        .sky.snowing::after {
            content: "";
            position: absolute;
            inset: -40px 0 0;
            pointer-events: none;
            background-image:
                radial-gradient(2px 2px at 10% 10%, #fff, transparent),
                radial-gradient(2.5px 2.5px at 40% 30%, #fff, transparent),
                radial-gradient(2px 2px at 70% 20%, #fff, transparent),
                radial-gradient(3px 3px at 85% 50%, #fff, transparent),
                radial-gradient(2px 2px at 25% 60%, #fff, transparent),
                radial-gradient(2.5px 2.5px at 55% 75%, #fff, transparent);
            background-size: 220px 220px;
            animation: snow 6s linear infinite;
            opacity: .85;
        }

        @keyframes snow {
            to {
                background-position: 30px 220px;
            }
        }

        .sky-head {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 4px;
        }

        .sky-head b {
            font-size: 1.05rem;
        }

        .sky-head .meta {
            margin-top: 3px;
            font-size: .85rem;
            color: var(--sky-muted);
        }

        .mode-tag {
            flex: none;
            white-space: nowrap;
            padding: 4px 9px;
            border-radius: var(--r-pill);
            background: rgba(255, 255, 255, .12);
            font-size: .78rem;
            font-weight: 800;
        }

        .tree-box {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: center;
            gap: 6px;
        }

        .tree-box svg {
            display: block;
            width: 100%;
            max-width: 340px;
            height: auto;
            touch-action: manipulation;
        }

        .tree-box.duo>div {
            flex: 1;
            min-width: 0;
            text-align: center;
        }

        .tree-box.duo svg {
            max-width: 260px;
            margin: 0 auto;
        }

        .tree-name {
            margin-top: -4px;
            font-size: .85rem;
            font-weight: 800;
            color: var(--sky-text);
        }

        .tree-name small {
            display: block;
            font-weight: 600;
            color: var(--sky-muted);
        }

        .partner-wait {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 100%;
            min-height: 220px;
            padding: 10px;
            border: 2px dashed rgba(255, 255, 255, .22);
            border-radius: var(--r-md);
            color: var(--sky-muted);
            font-size: .88rem;
        }

        .heart-line {
            position: relative;
            z-index: 1;
            margin-top: 4px;
            text-align: center;
            font-size: .9rem;
            font-weight: 800;
        }

        .tree-cv {
            display: block;
            width: 100%;
            max-width: 340px;
            aspect-ratio: 3 / 4;
            margin: 0 auto;
            touch-action: pan-y;
            cursor: grab;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }

        .tree-cv.grabbing {
            cursor: grabbing;
        }

        .tree-cv:focus-visible {
            outline: 2px solid #fde68a;
            outline-offset: 2px;
            border-radius: var(--r-md);
        }

        .tree-box.duo .tree-cv {
            max-width: 260px;
        }

        .theme-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 12px;
        }

        .theme-opt {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 4px;
            border: 2px solid transparent;
            border-radius: var(--r-md);
            background: #0f1b33;
            color: #fff;
            font: inherit;
            font-size: .8rem;
            font-weight: 800;
            cursor: pointer;
        }

        .theme-opt svg {
            width: 100%;
            height: auto;
        }

        .theme-opt[aria-pressed="true"] {
            border-color: #fde68a;
        }

        .orn-tune {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 10px;
            font-size: .9rem;
            font-weight: 800;
        }

        .seg {
            display: inline-flex;
            gap: 4px;
            padding: 3px;
            border-radius: var(--r-pill);
            background: var(--surface-2, rgba(0, 0, 0, .06));
        }

        .seg-btn {
            min-width: 52px;
            padding: 7px 10px;
            border: 0;
            border-radius: var(--r-pill);
            background: transparent;
            color: inherit;
            font: inherit;
            font-size: .85rem;
            cursor: pointer;
        }

        .seg-btn[aria-pressed="true"] {
            background: var(--surface, #fff);
            box-shadow: 0 1px 3px rgba(0, 0, 0, .15);
        }

        @keyframes pulse {
            to {
                fill: rgba(253, 230, 138, .35);
            }
        }

        .orn.moving {
            opacity: .35;
        }

        .pick-bar {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-top: 6px;
            padding: 8px 12px;
            border-radius: var(--r-md);
            background: rgba(253, 230, 138, .16);
            font-size: .9rem;
            font-weight: 700;
        }

        .pick-bar .text-btn {
            color: #fde68a;
        }

        .xmas-call {
            position: relative;
            z-index: 1;
            margin-top: 8px;
        }

        /* ── 매일 할 일 ── */
        .daily {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 12px 0;
        }

        .daily .btn {
            min-height: 58px;
        }

        .btn.glow {
            animation: glow 1.2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            to {
                box-shadow: 0 0 0 4px rgba(194, 38, 59, .25);
            }
        }

        .tray {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 2px 6px;
            scrollbar-width: thin;
        }

        .tray-item {
            flex: none;
            width: 60px;
            padding: 6px 4px;
            border: 2px solid var(--line);
            border-radius: var(--r-md);
            background: var(--surface-2);
            cursor: pointer;
            text-align: center;
        }

        .tray-item[aria-pressed="true"] {
            border-color: var(--gold);
            background: #fff7e6;
        }

        .tray-item svg {
            width: 40px;
            height: 40px;
        }

        .tray-item span {
            display: block;
            font-size: .68rem;
            font-weight: 700;
            color: var(--text-2);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tray-empty {
            margin: 0;
            font-size: .88rem;
            color: var(--muted);
        }

        .share-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .share-grid .btn {
            padding: 12px 8px;
            font-size: .92rem;
        }

        .share-grid .wide {
            grid-column: 1 / -1;
        }

        .tools {
            display: flex;
            justify-content: center;
            gap: 4px;
            flex-wrap: wrap;
        }

        /* ── 숲 ── */
        .goal {
            margin: 6px 0 12px;
        }

        .goal-bar {
            height: 12px;
            border-radius: var(--r-pill);
            background: var(--surface-3);
            overflow: hidden;
        }

        .goal-bar i {
            display: block;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, #60a5fa, #a78bfa);
            transition: width .4s ease;
        }

        .goal-text {
            display: flex;
            justify-content: space-between;
            margin-top: 6px;
            font-size: .85rem;
            color: var(--text-2);
        }

        .forest-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
            gap: 8px;
        }

        .forest-tile {
            padding: 6px 4px 8px;
            border: none;
            border-radius: var(--r-md);
            background: linear-gradient(180deg, var(--night-1), var(--night-2));
            color: var(--sky-text);
            cursor: pointer;
            text-align: center;
        }

        .forest-tile svg {
            display: block;
            width: 100%;
            height: auto;
        }

        .forest-tile b {
            display: block;
            font-size: .82rem;
        }

        .forest-tile small {
            display: block;
            font-size: .7rem;
            color: var(--sky-muted);
        }

        .forest-tile.me {
            outline: 2px solid var(--gold);
        }

        /* ── 장식 보내기 ── */
        .gift-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .gift-opt {
            padding: 8px 4px;
            border: 2px solid var(--line);
            border-radius: var(--r-md);
            background: var(--surface-2);
            cursor: pointer;
            text-align: center;
        }

        .gift-opt[aria-pressed="true"] {
            border-color: var(--berry);
            background: var(--berry-soft);
        }

        .gift-opt svg {
            width: 44px;
            height: 44px;
        }

        .gift-opt span {
            display: block;
            font-size: .72rem;
            font-weight: 700;
            color: var(--text-2);
        }

        .view-box {
            max-width: 360px;
            margin: 0 auto;
        }

        /* ── 시트·덮개 ── */
        .backdrop {
            position: fixed;
            inset: 0;
            z-index: 10000;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            background: var(--scrim);
        }

        .sheet {
            width: 100%;
            max-width: 560px;
            max-height: 88vh;
            max-height: 88dvh;
            overflow-y: auto;
            padding: 20px 18px max(18px, env(safe-area-inset-bottom));
            border-radius: var(--r-lg) var(--r-lg) 0 0;
            background: var(--surface);
            box-shadow: var(--shadow-lg);
            animation: up .2s ease-out;
        }

        @media (min-width: 640px) {
            .backdrop {
                align-items: center;
                padding: 24px;
            }

            .sheet {
                border-radius: var(--r-lg);
            }
        }

        @keyframes up {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
        }

        .sheet h2 {
            margin: 0 0 6px;
            font-size: 1.2rem;
        }

        .sheet .big-orn {
            display: block;
            width: 96px;
            height: 96px;
            margin: 4px auto 8px;
        }

        .sheet .center {
            text-align: center;
        }

        .tier {
            display: inline-block;
            padding: 3px 9px;
            border-radius: var(--r-pill);
            background: var(--surface-2);
            font-size: .78rem;
            font-weight: 800;
            color: var(--text-2);
        }

        .tier.rare {
            background: #ede9fe;
            color: #6d28d9;
        }

        .tier.legend {
            background: #fef3c7;
            color: #92400e;
        }

        .tier.gift {
            background: var(--berry-soft);
            color: var(--berry);
        }

        .letter {
            margin: 10px 0;
            padding: 14px;
            border-radius: var(--r-md);
            background: #fffaf0;
            border: 1px solid #fde7b0;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: keep-all;
            overflow-wrap: anywhere;
        }

        .lock {
            margin: 10px 0;
            padding: 12px;
            border-radius: var(--r-md);
            background: var(--surface-2);
            text-align: center;
            font-weight: 700;
            color: var(--text-2);
        }

        .code-box {
            width: 100%;
            min-height: 110px;
            font-family: ui-monospace, Menlo, monospace;
            font-size: .78rem;
            word-break: break-all;
        }

        .overlay {
            position: fixed;
            inset: 0;
            z-index: 10001;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 24px;
            background: rgba(8, 14, 32, .94);
            color: #fff;
            text-align: center;
        }

        .overlay h2 {
            margin: 0;
            font-size: 1.5rem;
            word-break: keep-all;
        }

        .overlay p {
            margin: 0;
            color: var(--sky-muted);
            line-height: 1.55;
        }

        .overlay .btn {
            min-width: 220px;
        }

        .overlay .stage-svg {
            width: min(70vw, 300px);
            height: auto;
        }

        .capsule {
            position: relative;
            width: 120px;
            height: 120px;
        }

        .capsule i {
            position: absolute;
            left: 10px;
            right: 10px;
            height: 50px;
            border-radius: 50px 50px 0 0;
            background: linear-gradient(180deg, #f43f5e, #be123c);
        }

        .capsule i.top {
            top: 10px;
            animation: shake .5s ease-in-out 2, opentop .5s 1s ease-in forwards;
        }

        .capsule i.bottom {
            bottom: 10px;
            border-radius: 0 0 50px 50px;
            background: linear-gradient(180deg, #f8fafc, #cbd5e1);
            animation: shake .5s ease-in-out 2;
        }

        @keyframes shake {

            25% {
                transform: rotate(-8deg);
            }

            75% {
                transform: rotate(8deg);
            }
        }

        @keyframes opentop {
            to {
                transform: translateY(-60px) rotate(-25deg);
                opacity: 0;
            }
        }

        .reveal {
            animation: popin .5s cubic-bezier(.2, 1.6, .4, 1) both;
        }

        @keyframes popin {
            from {
                transform: scale(.3);
                opacity: 0;
            }
        }

        .sleigh {
            width: 180px;

    <script>
        // ════════════════════════════════════════════════════════════
        //  어드벤트 트리 (#72)
        //  - 서버 없이 이 기기(localStorage)에 트리를 저장하고, 친구·짝꿍·숲 멤버와는 URL 해시 링크로만 주고받는다.
        //  - 링크는 해시(#)라서 서버로 전송되지 않는다. 받은 뒤에는 주소창에서 지운다.
        //  - 장식 순서(CAT)는 링크·백업 코드에 번호로 들어가므로 절대 바꾸지 말고 뒤에만 추가한다.
        // ════════════════════════════════════════════════════════════

        const $ = (id) => document.getElementById(id);
        const esc = (v) => escapeHtml(v);
        const IS_LOCAL = ['localhost', '127.0.0.1'].includes(location.hostname);
        const MAX_NAME = 10;
        const MAX_MSG = 80;
        const MAX_FOREST = 12;

        function rid(n = 8) {
            const chars = '0123456789abcdefghijklmnopqrstuvwxyz';
            const buf = new Uint8Array(n);
            (window.crypto || window.msCrypto).getRandomValues(buf);
            return [...buf].map((b) => chars[b % 36]).join('');
        }

        function hash32(str) {
            let h = 2166136261 >>> 0;
            for (let i = 0; i < str.length; i++) {
                h ^= str.charCodeAt(i);
                h = Math.imul(h, 16777619);
            }
            return h >>> 0;
        }

        function mulberry32(a) {
            return () => {
                a |= 0;
                a = (a + 0x6D2B79F5) | 0;
                let t = Math.imul(a ^ (a >>> 15), 1 | a);
                t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
        }

        // ── 날짜 ─────────────────────────────────────────────────
        // 기기 시계 기준. 개발할 때만 ?today=YYYY-MM-DD로 날짜를 바꿔 볼 수 있다 (localhost에서만).
        const Clock = (() => {
            function now() {
                if (IS_LOCAL) {
                    const q = new URLSearchParams(location.search).get('today');
                    if (q && /^\d{4}-\d{2}-\d{2}$/.test(q)) {
                        const [y, m, d] = q.split('-').map(Number);
                        const t = new Date();
                        return new Date(y, m - 1, d, t.getHours(), t.getMinutes(), t.getSeconds());
                    }
                }
                return new Date();
            }
            const key = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            const parse = (k) => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d, 12); };
            const shift = (k, n) => { const d = parse(k); d.setDate(d.getDate() + n); return key(d); };
            // 시즌: 그해 12월 기준. 1/1~1/7은 지난해 시즌의 '보기 기간', 그 뒤로는 다음 12월을 기다리는 'pre'.
            function season(d = now()) {
                const y = d.getFullYear();
                const m = d.getMonth() + 1;
                const day = d.getDate();
                if (m === 12) return { year: y, phase: day <= 24 ? 'advent' : day === 25 ? 'xmas' : 'after', day };
                if (m === 1 && day <= 7) return { year: y - 1, phase: 'after', day: 0 };
                return { year: y, phase: 'pre', day: 0 };
            }
            function daysUntil(y, m, d) {
                const a = parse(key(now()));
                const b = new Date(y, m - 1, d, 12);
                return Math.round((b - a) / 86400000);
            }
            return { now, key, today: () => key(now()), shift, season, daysUntil, stamp: () => now().getTime() };
        })();

        // ── 저장 ─────────────────────────────────────────────────
        const Store = (() => {
            const KEY = 'advent-tree:v1';
            let ok = true;
            try {
                localStorage.setItem('advent-tree:probe', '1');
                localStorage.removeItem('advent-tree:probe');
            } catch {
                ok = false;
            }
            return {
                ok: () => ok,
                load() { try { return JSON.parse(localStorage.getItem(KEY) || 'null'); } catch { return null; } },
                save(s) { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch { /* 메모리로만 진행 */ } },
                clear() { try { localStorage.removeItem(KEY); } catch { /* 무시 */ } },
                get(k) { try { return localStorage.getItem(`advent-tree:${k}`); } catch { return null; } },
                set(k, v) { try { localStorage.setItem(`advent-tree:${k}`, v); } catch { /* 무시 */ } }
            };
        })();

        // ── 링크·백업 코드 ────────────────────────────────────────
        // 형식: 버전(1자) + 검사값(2자) + base64url(JSON). 메신저가 링크를 자르면 검사값이 맞지 않아 걸러진다.
        const Codec = (() => {
            const toB64u = (bytes) => {
                let bin = '';
                bytes.forEach((b) => { bin += String.fromCharCode(b); });
                return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
            };
            const fromB64u = (s) => {
                let t = s.replace(/-/g, '+').replace(/_/g, '/');
                while (t.length % 4) t += '=';
                return Uint8Array.from(atob(t), (c) => c.charCodeAt(0));
            };
            const sum = (body) => (hash32(body) % 1296).toString(36).padStart(2, '0');
            function pack(obj) {
                const body = toB64u(new TextEncoder().encode(JSON.stringify(obj)));
                return `1${sum(body)}${body}`;
            }
            function unpack(s) {
                if (typeof s !== 'string' || s.length < 5 || s.length > 6000 || s[0] !== '1') throw new Error('bad');
                const body = s.slice(3);
                if (sum(body) !== s.slice(1, 3)) throw new Error('broken');
                const obj = JSON.parse(new TextDecoder().decode(fromB64u(body)));
                if (!obj || typeof obj !== 'object') throw new Error('bad');
                return obj;
            }
            // 메시지는 받는 트리 ID로 가볍게 뒤섞는다. 링크를 base64로 풀어도 바로 읽히지 않게 하는 정도다.
            function stream(key, n) {
                const r = mulberry32(hash32(`msg|${key}`));
                return Uint8Array.from({ length: n }, () => Math.floor(r() * 256));
            }
            function hide(text, key) {
                if (!text) return '';
                const bytes = new TextEncoder().encode(text);
                const ks = stream(key, bytes.length);
                return toB64u(bytes.map((b, i) => b ^ ks[i]));
            }
            function reveal(code, key) {
                if (!code) return '';
                try {
                    const bytes = fromB64u(code);
                    const ks = stream(key, bytes.length);
                    return new TextDecoder().decode(bytes.map((b, i) => b ^ ks[i]));
                } catch {
                    return '';
                }
            }
            return { pack, unpack, hide, reveal };
        })();

        // ════════════════════════════════════════════════════════════
        //  장식 (순서 고정! 번호가 링크에 들어간다)

            [124, 150], [176, 150],                                 // 4-5
            [96, 184], [134, 184], [172, 184], [208, 184],          // 6-9
            [96, 214], [134, 214], [172, 214], [208, 214],          // 10-13
            [70, 248], [112, 248], [154, 248], [196, 248], [232, 248], // 14-18
            [72, 282], [112, 282], [152, 282], [192, 282], [232, 282], // 19-23
            [52, 316], [94, 316], [136, 316], [178, 316], [220, 316], [254, 316] // 24-29
        ];
        const TIERS = [[190, 330, 130], [140, 265, 110], [90, 200, 85], [40, 140, 60]];   // [꼭대기 y, 밑동 y, 반폭] 아래층부터
        const BASE = [150, 370];
        const scaled = (x, y, f) => [BASE[0] + (x - BASE[0]) * f, BASE[1] - (BASE[1] - y) * f];
        const TRUNK = '<rect x="135" y="318" width="30" height="52" rx="5" fill="url(#gTrunk)"/>';

        function faceSvg(mood) {
            if (mood === 'happy') {
                return '<path d="M140 345q3-3.4 6 0M154 345q3-3.4 6 0" stroke="#2b1708" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M143 351q7 6 14 0" stroke="#2b1708" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="139" cy="351" r="2.6" fill="#f9a8d4" opacity=".7"/><circle cx="161" cy="351" r="2.6" fill="#f9a8d4" opacity=".7"/>';
            }
            if (mood === 'sad') {
                return '<circle cx="143" cy="345" r="1.8" fill="#2b1708"/><circle cx="157" cy="345" r="1.8" fill="#2b1708"/><path d="M144 355q6-4.4 12 0" stroke="#2b1708" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M160 348q2 3 0 5-2-2 0-5z" fill="#93c5fd"/>';
            }
            return '<circle cx="143" cy="345" r="1.8" fill="#2b1708"/><circle cx="157" cy="345" r="1.8" fill="#2b1708"/><path d="M145 351q5 3.6 10 0" stroke="#2b1708" stroke-width="2" fill="none" stroke-linecap="round"/>';
        }

        function starSvg(star, [sx, sy]) {
            if (star === 2) return `<circle cx="${sx}" cy="${sy}" r="40" fill="url(#gStarGlow)"/><path d="${starPath(17, 7.4)}" transform="translate(${sx} ${sy})" fill="url(#gGold)" stroke="#b45309" stroke-width="1"/>`;
            if (star === 1) return `<path d="${starPath(15, 6.5)}" transform="translate(${sx} ${sy})" fill="none" stroke="#fde68a" stroke-width="1.6" stroke-dasharray="3 3" opacity=".8"/>`;
            return '';
        }

        const GIFT_TAG = '<path d="M6 6l5 1.4-1.6 4.4z" fill="#fbbf24" stroke="#b45309" stroke-width=".5"/>';

        // ── 3D 트리 ──
        // 트리 = 원뿔 4층. 장식 위치는 표면 좌표 {a: 둘레 각도 0~359, h: 높이 0(꼭대기)~1000(밑동)}, 크기 z(0~2), 기울기 r(도).
        // 화면은 살짝 위에서 내려다본 직교 투영: 앞으로 나온 만큼(d) 아래로 내려 보인다(K).
        // 같은 장면을 SVG 문자열(카드·숲 타일 등 멈춘 그림)과 캔버스(돌려 보는 화면) 두 가지로 그린다.
        // 캔버스는 전구가 깜빡이고 눈이 내린다(움직임 줄이기 설정이면 멈춘 채로).
        const Tree3D = (() => {
            const K = 0.2;
            const TOP = 40;
            const BOTTOM = 330;
            const RAD = Math.PI / 180;
            const H_MIN = 70;                     // 꼭대기 별 자리는 비워 둔다
            const ZOOM = [0.78, 1, 1.32];
            const yOfH = (h) => TOP + (h / 1000) * (BOTTOM - TOP);
            const hOfY = (y) => Math.round(((y - TOP) / (BOTTOM - TOP)) * 1000);
            const tierR = ([ap, b, hw], y) => (y >= ap && y <= b ? (hw * (y - ap)) / (b - ap) : 0);
            const radiusAt = (y) => TIERS.reduce((m, t) => Math.max(m, tierR(t, y)), 0);
            const surf = (y) => radiusAt(y) * 0.96;
            const norm = (a) => ((Math.round(a) % 360) + 360) % 360;
            const clamp = (x, lo, hi) => Math.max(lo, Math.min(hi, x));
            const themeOf = (v) => THEMES[v.theme] || THEMES.green;

            // (가로 x, 앞쪽 d, 높이 y) 점을 가리는 위층(치마)이 있으면 그 층 번호
            function cover(x, d, y) {
                for (let i = TIERS.length - 1; i >= 0; i--) {
                    const [, b, hw] = TIERS[i];
                    if (b >= y - 0.5) continue;
                    const d2 = d + (y - b) / K;
                    if (x * x + d2 * d2 < hw * hw * 0.97) return i;
                }
                return -1;
            }

            function project(a, y, rot, r = surf(y)) {
                const t = (a - rot) * RAD;
                const lx = Math.sin(t) * r;
                const d = Math.cos(t) * r;
                return { x: 150 + lx, y: y + d * K, d, lx, r };
            }

            // 잎 뭉치: 층마다 고리 모양으로 고정 배치 (돌리면 같이 돌아서 입체감이 난다)
            const TUFTS = (() => {
                const out = [];
                const rnd = mulberry32(20261201);
                TIERS.forEach((t) => {
                    const [ap, b] = t;
                    const rows = Math.round((b - ap) / 22);
                    for (let i = 1; i <= rows; i++) {
                        const y0 = ap + ((b - ap) * i) / rows - 1;
                        const n = Math.max(3, Math.round((2 * Math.PI * tierR(t, y0)) / 17));
                        for (let j = 0; j < n; j++) {
                            const y = Math.min(b - 1, y0 - rnd() * 8);
                            const r = tierR(t, y);
                            if (r < radiusAt(y) - 3) continue;   // 위층 안쪽이라 안 보인다
                            // 위층 치마 바로 밑은 그늘, 층 끝자락은 조금 밝고 크게
                            const shade = TIERS.some(([, b2, hw2]) => y > b2 && y - b2 < 24 && hw2 > r * 0.8) ? -2 : i === rows ? 1 : 0;
                            out.push({ a: ((j + (i % 2) * 0.5) / n) * 360 + rnd() * 8, y, r, s: (0.85 + rnd() * 0.35) * (i === rows ? 1.18 : 1), w: rnd() * 30 - 15, shade, lite: (i + j) % 3 === 0 || i === rows, snow: rnd() < (i === rows ? 0.7 : 0.38) });
                        }
                    }
                });
                return out;
            })();
            const TUFT = 'M0-8C2.6-4 5.6-.4 8 4.6 4.6 3 2.4 3.8 0 7.6-2.4 3.8-4.6 3-8 4.6-5.6-.4-2.6-4 0-8Z';
            const CAP = 'M-5.6-1.2C-4-4-2-6.2 0-8 2-6.2 4-4 5.6-1.2 3.4-2.4 1.6-1.4 0-.2-1.6-1.4-3.4-2.4-5.6-1.2Z';
            // 왼쪽 앞에서 빛이 온다
            const lightOf = (phi) => 0.5 + 0.5 * Math.cos((phi + 40) * RAD);
            const leafColor = (th, phi, shade = 0) => th.leaf[clamp(Math.floor(lightOf(phi) * 6.99) + shade, 0, 6)];
            const SMALL = ['#fde047', '#fb7185', '#60a5fa', '#4ade80'];
            const BIG = ['#f43f5e', '#facc15', '#22d3ee', '#a3e635', '#c084fc'];

            // 트리 밑 선물 상자 자리 (받은 선물 수만큼 앞에서부터 채운다)
            const BOXES = [
                { a: -18, r: 74, s: 1.15, c: 0 }, { a: 26, r: 82, s: 0.95, c: 1 }, { a: -52, r: 96, s: 0.9, c: 2 },
                { a: 58, r: 100, s: 1.05, c: 3 }, { a: 4, r: 104, s: 0.8, c: 4 }, { a: -88, r: 88, s: 1, c: 5 },
                { a: 92, r: 80, s: 0.9, c: 6 }, { a: 140, r: 90, s: 1.1, c: 1 }, { a: -140, r: 92, s: 1, c: 3 }
            ];
            const BOX_COLORS = [
                ['#dc2626', '#991b1b', '#f87171', '#fde68a'], ['#2563eb', '#1e3a8a', '#60a5fa', '#fbbf24'], ['#16a34a', '#14532d', '#4ade80', '#fde047'],
                ['#db2777', '#831843', '#f472b6', '#ffffff'], ['#7c3aed', '#4c1d95', '#a78bfa', '#fde68a'], ['#f59e0b', '#92400e', '#fcd34d', '#dc2626'], ['#0891b2', '#164e63', '#67e8f9', '#ffffff']
            ];
            const boxSvg = (ci) => {
                const [c, dk, lt, rb] = BOX_COLORS[ci];
                return `<ellipse cx="1" cy="7.5" rx="15" ry="3" fill="#0b1530" opacity=".22"/><path d="M-12-6h17v13h-17z" fill="${c}"/><path d="M5-6l6-4v13l-6 4z" fill="${dk}"/><path d="M-12-6l6-4h17l-6 4z" fill="${lt}"/>`
                    + `<path d="M-5-6h3v13h-3z" fill="${rb}"/><path d="M8.5-8v13l-1.6 1V-7z" fill="${rb}" opacity=".85"/><path d="M-5-6l6-4h3l-6 4z" fill="${rb}"/><path d="M-11-8.3h17l-1.4 1h-17z" fill="${rb}" opacity=".8"/>`
                    + `<path d="M-1.5-8c-5-4.6-8.6-1.4-4.4.6M-1.5-8c4-5.2 8.4-2.6 4.6.4" stroke="${rb}" stroke-width="1.8" fill="none" stroke-linecap="round"/>`;
            };

            // 장면: 원뿔 앞에 오는 것들(잎·눈·구슬 줄·전구·장식)을 깊이 순서로, 선물 상자는 앞뒤로 나눠서
            function build(v, rot, o = {}) {
                const th = themeOf(v);
                const f = STAGE_SCALE[v.stage] ?? 0.5;
                const s = 0.62 + 0.38 * f;
                const P = (x, y) => scaled(x, y, f);
                const items = [];
                TUFTS.forEach((t) => {
                    if (o.lite && !t.lite) return;
                    const p = project(t.a, t.y, rot, t.r);
                    if (p.d < -0.3 * t.r || cover(p.lx, p.d, t.y) >= 0) return;
                    const [x, y] = P(p.x, p.y);
                    items.push({ k: 't', x, y, d: p.d, sc: f * t.s * (o.lite ? 1.35 : 1) * (1 + p.d / 700), rot: (p.lx / Math.max(t.r, 1)) * 38 + t.w, c: leafColor(th, t.a - rot, t.shade), cap: t.snow });
                });
                // 금빛 구슬 줄: 나선으로 감되 고정점 사이가 살짝 처진다
                if (v.stage >= 2) {
                    const turns = 1.8;
                    const N = o.lite ? 70 : 170;
                    for (let i = 0; i <= N; i++) {
                        const tt = i / N;
                        const u = tt * 7 * turns;
                        const yy = 78 + 234 * tt + 7 * Math.sin(Math.PI * (u % 1));
                        const p = project(120 + tt * turns * 360, yy, rot, radiusAt(yy));
                        if (p.d < -0.1 * p.r || cover(p.lx, p.d, yy) >= 0) continue;
                        const [x, y] = P(p.x, p.y);
                        items.push({ k: 'g', x, y, d: p.d + 0.3, r: 1.55 * f * (1 + p.d / 700) * (o.lite ? 1.4 : 1) });
                    }
                }
                const helix = (turns, phase, n, size, colors, y0, y1) => {
                    const steps = n * 4;
                    let prev = null;
                    for (let i = 0; i <= steps; i++) {
                        const tt = i / steps;
                        const yy = y0 + (y1 - y0) * tt;
                        const p = project(phase + tt * turns * 360, yy, rot, radiusAt(yy) * 0.99);
                        const vis = p.d > -0.12 * p.r && cover(p.lx, p.d, yy) < 0;
                        const [x, y] = P(p.x, p.y);
                        if (vis && prev && !o.lite) items.push({ k: 'w', x1: prev[0], y1: prev[1], x2: x, y2: y, d: p.d - 1, sc: f });
                        prev = vis ? [x, y] : null;
                        if (vis && i % 4 === 2) items.push({ k: 'b', x, y, d: p.d + 0.5, r: size * f, c: colors[Math.floor(i / 4) % colors.length], ph: i / 4 + phase });
                    }
                };
                if (v.stage >= 3) helix(2.4, 20, 30, 2.4, SMALL, 70, 318);
                if (v.lights) helix(1.7, 200, 22, 4.2, BIG, 60, 322);
                (v.orns || []).forEach((orn) => {
                    if (orn.h == null || !BY_ID[orn.type]) return;
                    const yy = yOfH(orn.h);
                    const p = project(orn.a, yy, rot);
                    if (p.d < -0.35 * p.r || cover(p.lx, p.d, yy) >= 0) return;
                    const [x, y] = P(p.x, p.y);
                    items.push({ k: 'o', x, y, d: p.d + 22, sc: s * ZOOM[orn.z ?? 1] * (1 + p.d / 600), r: orn.r || 0, o: orn, bri: 0.66 + 0.34 * lightOf(orn.a - rot) });
                });
                items.sort((a, b) => a.d - b.d);
                const boxes = BOXES.slice(0, clamp(v.boxes || 0, 0, BOXES.length)).map((b) => {
                    const t = (b.a - rot) * RAD;
                    const R = b.r * Math.max(f, 0.72);
                    const d = Math.cos(t) * R;
                    return { x: 150 + Math.sin(t) * R, y: 369 + d * 0.12, d, sc: b.s * (0.78 + 0.22 * f) * (1 + d / 800), c: b.c };
                }).sort((a, b) => a.d - b.d);
                return { f, s, th, items, back: boxes.filter((b) => b.d <= 0), front: boxes.filter((b) => b.d > 0), star: P(150, 36), glow: v.stage >= 3 || v.lights };
            }

            const n1 = (x) => Math.round(x * 10) / 10;
            const conePath = ([ap, b, hw]) => `M150 ${ap}L${150 + hw} ${b}A${hw} ${n1(hw * K)} 0 0 1 ${150 - hw} ${b}Z`;
            const RAYS = (() => {
                let d = '';
                for (let i = 0; i < 12; i++) {
                    const a = (i * 30) * RAD;
                    const L = i % 2 ? 30 : 46;
                    d += `M${n1(Math.cos(a - 0.07) * 6)} ${n1(Math.sin(a - 0.07) * 6)}L${n1(Math.cos(a) * L)} ${n1(Math.sin(a) * L)}L${n1(Math.cos(a + 0.07) * 6)} ${n1(Math.sin(a + 0.07) * 6)}Z`;
                }
                return d;
            })();
            const boxTag = (b) => `<g transform="translate(${n1(b.x)} ${n1(b.y)}) scale(${n1(b.sc * 100) / 100})">${boxSvg(b.c)}</g>`;

            // 멈춘 그림 (300×400 좌표의 SVG 조각)
            function svg(v, o = {}) {
                const sc = build(v, o.rot ?? v.face ?? 0, o);
                const theme = THEMES[v.theme] ? v.theme : 'green';
                let g = '';
                if (sc.glow) g += `<ellipse cx="150" cy="${n1(scaled(150, 220, sc.f)[1])}" rx="${n1(165 * sc.f)}" ry="${n1(190 * sc.f)}" fill="url(#gWarm)"/>`;
                g += '<ellipse cx="150" cy="372" rx="132" ry="16" fill="#e8eef7"/><ellipse cx="150" cy="369" rx="92" ry="8" fill="#fff" opacity=".7"/>';
                g += sc.back.map(boxTag).join('');
                g += `<g transform="translate(150 370) scale(${sc.f}) translate(-150 -370)">${TRUNK}${faceSvg(v.mood)}${TIERS.map((t) => `<path d="${conePath(t)}" fill="url(#gCone-${theme})"/>`).join('')}</g>`;
                sc.items.forEach((it) => {
                    if (it.k === 't') {
                        g += `<g transform="translate(${n1(it.x)} ${n1(it.y)}) rotate(${Math.round(it.rot)}) scale(${n1(it.sc * 10) / 10})"><path d="${TUFT}" fill="${it.c}"/>${it.cap ? `<path d="${CAP}" fill="#f8fafc" opacity=".92"/>` : ''}</g>`;
                    } else if (it.k === 'g') {
                        g += `<circle cx="${n1(it.x)}" cy="${n1(it.y)}" r="${n1(it.r)}" fill="#f2c14e"/>`;
                    } else if (it.k === 'w') {
                        g += `<path d="M${n1(it.x1)} ${n1(it.y1)}L${n1(it.x2)} ${n1(it.y2)}" stroke="#334155" stroke-width="${n1(1.3 * it.sc)}"/>`;
                    } else if (it.k === 'b') {
                        g += `<circle cx="${n1(it.x)}" cy="${n1(it.y)}" r="${n1(it.r * 2.6)}" fill="${it.c}" opacity=".22"/><circle cx="${n1(it.x)}" cy="${n1(it.y)}" r="${n1(it.r)}" fill="${it.c}"/>`;
                    } else {
                        g += `<g transform="translate(${n1(it.x)} ${n1(it.y)}) rotate(${it.r}) scale(${(Math.round(it.sc * 1000) / 1000)})"><ellipse cx="2.4" cy="3.4" rx="9.5" ry="9" fill="#04140b" opacity=".2"/>${BY_ID[it.o.type].svg}${it.o.src === 'gift' ? GIFT_TAG : ''}</g>`;
                    }
                });
                g += sc.front.map(boxTag).join('');
                if (v.star === 2) g += `<path d="${RAYS}" transform="translate(${n1(sc.star[0])} ${n1(sc.star[1])})" fill="#fde68a" opacity=".35"/>`;
                return g + starSvg(v.star, sc.star);
            }

            // 캔버스용 그림 조각(장식·줄기·별·상자)은 SVG를 이미지로 한 번만 만들어 둔다
            const cache = new Map();
            let onLoad = () => {};
            function pic(key, inner, vb, w, h) {
                let im = cache.get(key);
                if (!im) {
                    im = new Image();
                    im.onload = () => onLoad();
                    im.src = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb}" width="${w}" height="${h}">${DEFS}${inner}</svg>`)}`;
                    cache.set(key, im);
                }
                return im.complete && im.naturalWidth ? im : null;
            }
            let path2d = null;

            // 내리는 눈: 트리 둘레 원통 안의 눈송이. 돌리면 앞뒤 눈송이가 다르게 움직여 깊이감이 난다.
            const FLAKES = (() => {
                const rnd = mulberry32(1225);
                return Array.from({ length: 64 }, () => ({ a: rnd() * 360, R: 30 + rnd() * 150, y: rnd() * 420, s: 0.8 + rnd() * 1.6, v: 0.012 + rnd() * 0.02, ph: rnd() * 6.28 }));
            })();
            function drawFlakes(ctx, rot, t, front) {
                ctx.fillStyle = '#fff';
                FLAKES.forEach((fl) => {
                    const th = (fl.a - rot) * RAD;
                    const d = Math.cos(th) * fl.R;
                    if ((d > 0) !== front) return;
                    const y = ((fl.y + t * fl.v) % 430) - 20 + d * K;
                    const x = 150 + Math.sin(th) * fl.R + Math.sin(t * 0.0011 + fl.ph) * 5;
                    const k = 1 + d / 260;
                    ctx.globalAlpha = front ? 0.9 : 0.4;
                    ctx.beginPath(); ctx.arc(x, y, fl.s * k, 0, Math.PI * 2); ctx.fill();
                });
                ctx.globalAlpha = 1;
            }

            const withScale = (ctx, f, fn) => { ctx.save(); ctx.translate(150, 370); ctx.scale(f, f); ctx.translate(-150, -370); fn(); ctx.restore(); };
            const drawBox = (ctx, b) => {
                const im = pic(`box|${b.c}`, boxSvg(b.c), '-16 -14 32 24', 128, 96);
                if (im) ctx.drawImage(im, b.x - 16 * b.sc, b.y - 14 * b.sc, 32 * b.sc, 24 * b.sc);
            };

            // 돌려 보는 화면 (ctx는 300×400 좌표로 맞춰 둔 상태). o.t가 있으면 깜빡임·눈 내림.
            function paint(ctx, v, rot, o = {}) {
                const sc = build(v, rot);
                const t = o.t ?? 0;
                path2d = path2d || { tuft: new Path2D(TUFT), cap: new Path2D(CAP), rays: new Path2D(RAYS) };
                if (sc.glow) {
                    const [gx, gy] = scaled(150, 220, sc.f);
                    const gr = ctx.createRadialGradient(gx, gy, 0, gx, gy, 190 * sc.f);
                    gr.addColorStop(0, 'rgba(255, 214, 140, .22)'); gr.addColorStop(1, 'rgba(255, 214, 140, 0)');
                    ctx.fillStyle = gr;
                    ctx.fillRect(0, 0, 300, 400);
                }
                if (o.snow) drawFlakes(ctx, rot, t, false);
                ctx.fillStyle = '#e8eef7';
                ctx.beginPath(); ctx.ellipse(150, 372, 132, 16, 0, 0, Math.PI * 2); ctx.fill();
                ctx.globalAlpha = 0.7; ctx.fillStyle = '#fff';
                ctx.beginPath(); ctx.ellipse(150, 369, 92, 8, 0, 0, Math.PI * 2); ctx.fill();
                ctx.globalAlpha = 1;
                sc.back.forEach((b) => drawBox(ctx, b));
                withScale(ctx, sc.f, () => {
                    const trunk = pic(`trunk|${v.mood}`, TRUNK + faceSvg(v.mood), '120 310 60 64', 180, 192);
                    if (trunk) ctx.drawImage(trunk, 120, 310, 60, 64);
                    TIERS.forEach((tier) => {
                        const hw = tier[2];
                        const gr = ctx.createLinearGradient(150 - hw, 0, 150 + hw, 0);
                        gr.addColorStop(0, sc.th.cone[0]); gr.addColorStop(0.35, sc.th.cone[1]); gr.addColorStop(1, sc.th.cone[2]);
                        ctx.fillStyle = gr;
                        ctx.fill(new Path2D(conePath(tier)));
                    });
                });
                const canFilter = 'filter' in ctx;
                sc.items.forEach((it) => {
                    if (it.k === 't') {
                        ctx.save(); ctx.translate(it.x, it.y); ctx.rotate(it.rot * RAD); ctx.scale(it.sc, it.sc);
                        ctx.fillStyle = it.c; ctx.fill(path2d.tuft);
                        if (it.cap) { ctx.globalAlpha = 0.92; ctx.fillStyle = '#f8fafc'; ctx.fill(path2d.cap); }
                        ctx.restore();
                    } else if (it.k === 'g') {
                        ctx.fillStyle = '#f2c14e';
                        ctx.beginPath(); ctx.arc(it.x, it.y, it.r, 0, Math.PI * 2); ctx.fill();
                        ctx.fillStyle = 'rgba(255, 250, 220, .9)';
                        ctx.beginPath(); ctx.arc(it.x - it.r * 0.35, it.y - it.r * 0.35, it.r * 0.4, 0, Math.PI * 2); ctx.fill();
                    } else if (it.k === 'w') {
                        ctx.strokeStyle = '#334155'; ctx.lineWidth = 1.3 * it.sc;
                        ctx.beginPath(); ctx.moveTo(it.x1, it.y1); ctx.lineTo(it.x2, it.y2); ctx.stroke();
                    } else if (it.k === 'b') {
                        const tw = o.t == null ? 1 : 0.5 + 0.5 * Math.sin(t * 0.0032 + it.ph * 2.3);
                        const hr = it.r * (2.2 + 1.4 * tw);
                        const gr = ctx.createRadialGradient(it.x, it.y, 0, it.x, it.y, hr);
                        gr.addColorStop(0, it.c); gr.addColorStop(1, 'rgba(0, 0, 0, 0)');
                        ctx.globalCompositeOperation = 'lighter';
                        ctx.globalAlpha = 0.25 + 0.35 * tw;
                        ctx.fillStyle = gr;
                        ctx.beginPath(); ctx.arc(it.x, it.y, hr, 0, Math.PI * 2); ctx.fill();
                        ctx.globalCompositeOperation = 'source-over';
                        ctx.globalAlpha = 0.65 + 0.35 * tw;
                        ctx.fillStyle = it.c;
                        ctx.beginPath(); ctx.arc(it.x, it.y, it.r, 0, Math.PI * 2); ctx.fill();
                        ctx.globalAlpha = 0.8 * tw;
                        ctx.fillStyle = '#fff';
                        ctx.beginPath(); ctx.arc(it.x, it.y, it.r * 0.45, 0, Math.PI * 2); ctx.fill();
                        ctx.globalAlpha = 1;
                    } else {
                        const gift = it.o.src === 'gift';
                        const im = pic(`o|${it.o.type}|${gift ? 1 : 0}`, BY_ID[it.o.type].svg + (gift ? GIFT_TAG : ''), '-16 -17 32 32', 128, 128);
                        ctx.save(); ctx.translate(it.x, it.y); ctx.rotate(it.r * RAD); ctx.scale(it.sc, it.sc);
                        ctx.globalAlpha = 0.2; ctx.fillStyle = '#04140b';
                        ctx.beginPath(); ctx.ellipse(2.4, 3.4, 9.5, 9, 0, 0, Math.PI * 2); ctx.fill();
                        ctx.globalAlpha = 1;
                        if (o.moving && o.moving === it.o.uid) {
                            ctx.setLineDash([3, 3]); ctx.strokeStyle = '#fde68a'; ctx.lineWidth = 1.6;
                            ctx.beginPath(); ctx.arc(0, -2, 15, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
                        }
                        if (im) {
                            if (canFilter && it.bri < 0.97) ctx.filter = `brightness(${it.bri.toFixed(2)})`;
                            ctx.drawImage(im, -16, -17, 32, 32);
                            if (canFilter) ctx.filter = 'none';
                        }
                        ctx.restore();
                    }
                });
                sc.front.forEach((b) => drawBox(ctx, b));
                if (v.star === 2) {
                    ctx.save();
                    ctx.translate(sc.star[0], sc.star[1]);
                    ctx.rotate(t * 0.00025);
                    ctx.globalCompositeOperation = 'lighter';
                    ctx.globalAlpha = o.t == null ? 0.35 : 0.28 + 0.12 * Math.sin(t * 0.002);
                    ctx.fillStyle = '#fde68a';
                    ctx.fill(path2d.rays);
                    ctx.restore();
                }
                if (v.star) {
                    const im = pic(`star|${v.star}`, starSvg(v.star, [0, 0]), '-42 -42 84 84', 252, 252);
                    if (im) ctx.drawImage(im, sc.star[0] - 42, sc.star[1] - 42, 84, 84);
                }
                if (o.hint) {
                    // 달 곳 고르는 중: 트리 둘레를 점선으로
                    withScale(ctx, sc.f, () => {
                        ctx.setLineDash([5, 5]); ctx.strokeStyle = 'rgba(253, 230, 138, .85)'; ctx.lineWidth = 1.6 / sc.f;
                        TIERS.forEach((tier) => ctx.stroke(new Path2D(conePath(tier))));
                    });
                }
                if (o.snow) drawFlakes(ctx, rot, t, true);
                return sc;
            }

            // 화면 점(300×400 좌표) → 표면 좌표. 트리 밖이면 null
            function pickAt(v, rot, tx, ty) {
                const f = STAGE_SCALE[v.stage] ?? 0.5;
                const X = 150 + (tx - 150) / f;
                const Y = 370 - (370 - ty) / f;
                const lx = X - 150;
                let y = Y;
                for (let i = 0; i < 8; i++) {
                    const r = surf(y);
                    const sn = r > 1 ? clamp(lx / r, -1, 1) : 0;
                    y = clamp(Y - r * Math.sqrt(1 - sn * sn) * K, TOP, BOTTOM);
                }
                y = clamp(y, yOfH(H_MIN), BOTTOM - 2);
                let r = surf(y);
                if (r < 1 || Math.abs(lx) > r * 1.08) return null;
                let sn = clamp(lx / r, -1, 1);
                const ti = cover(lx, Math.sqrt(1 - sn * sn) * r, y);
                if (ti >= 0) {   // 위층 치마 끝을 누른 것
                    y = TIERS[ti][1] - 2;
                    r = surf(y);
                    sn = clamp(lx / r, -1, 1);
                }
                if (Math.abs(y + Math.sqrt(1 - sn * sn) * r * K - Y) > 14) return null;
                return { a: norm(Math.asin(sn) / RAD + rot), h: hOfY(y) };
            }

            // 예전 칸 번호 → 표면 좌표 (정면에서 본 평면 위치를 그대로 옮긴다)
            function fromSlot(slot) {
                const [x, y] = SLOTS[slot];
                const r = surf(y);
                return { a: norm(Math.asin(clamp((x - 150) / Math.max(r, 1), -1, 1)) / RAD), h: hOfY(y) };
            }

            // 저절로 다는 장식: 앞쪽에서 다른 장식과 가장 먼 자리
            function freeSpot(orns, face = 0) {
                const pt = (a, h) => { const y = yOfH(h); const r = surf(y); return [Math.sin(a * RAD) * r, y, Math.cos(a * RAD) * r]; };
                const others = orns.filter((x) => x.h != null).map((x) => pt(x.a, x.h));
                let best = null;
                for (let h = 160; h <= 900; h += 55) {
                    for (let da = -60; da <= 60; da += 15) {
                        const a = norm(face + da);
                        const p = project(a, yOfH(h), face);
                        if (cover(p.lx, p.d, yOfH(h)) >= 0) continue;
                        const q = pt(a, h);
                        const m = others.reduce((acc, o2) => Math.min(acc, Math.hypot(q[0] - o2[0], q[1] - o2[1], q[2] - o2[2])), 999);
                        const score = m - Math.abs(da) * 0.08;
                        if (!best || score > best.score) best = { a, h, score };
                    }
                }
                return { a: best.a, h: best.h };
            }

            return { svg, paint, pickAt, fromSlot, freeSpot, norm, set onLoad(fn) { onLoad = fn; } };
        })();

        // v = { stage, orns:[{a,h,z?,r?,type,src,uid?}], star:0|1|2, lights:bool, mood, face }
        // o = { rot?, lite? }
        const treeInner = (v, o = {}) => Tree3D.svg(v, o);
        const treeSvg = (v, o = {}, label = '트리') => `<svg viewBox="0 0 300 400" role="img" aria-label="${esc(label)}">${treeInner(v, o)}</svg>`;

        // 돌려 보는 트리 화면: 빈 곳을 좌우로 밀면 회전, 장식을 누르면 onTap, 장식을 끌면 표면을 따라 옮긴다
        const Views = (() => {
            const live = new Set();
            const reduce = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
            function redrawAll() {
                live.forEach((V) => { if (V.cv.isConnected) V.draw(); else { V.stop(); live.delete(V); } });
            }
            Tree3D.onLoad = () => requestAnimationFrame(redrawAll);
            document.addEventListener('visibilitychange', () => { if (!document.hidden) live.forEach((V) => V.kick?.()); });

            // o = { view(), rot, interactive, onTap(orn|null, pos|null), onRot(rot), onDrop(orn, ok, orig), moving(), hint(), intro }
            function mount(cv, o) {
                if (!cv) return null;
                const ctx = cv.getContext('2d');
                const V = { cv, rot: o.rot || 0, scene: null, raf: 0, vel: 0 };
                let W = 0;
                let G = null;
                V.draw = () => {
                    if (!W) return;
                    const k = cv.width / 300;
                    ctx.setTransform(1, 0, 0, 1, 0, 0);
                    ctx.clearRect(0, 0, cv.width, cv.height);
                    ctx.setTransform(k, 0, 0, k, 0, 0);
                    V.scene = Tree3D.paint(ctx, o.view(), V.rot, { moving: o.moving?.(), hint: o.hint?.(), snow: true, t: reduce() ? null : performance.now() });
                };
                // 전구 깜빡임·눈 내림: 화면에 보이고 탭이 앞에 있을 때만 초당 30번 정도 다시 그린다
                let visible = true;
                let last = 0;
                const tick = (now) => {
                    V.anim = 0;
                    if (!cv.isConnected || !visible || document.hidden || reduce()) return;
                    if (now - last >= 33) { last = now; V.draw(); }
                    V.anim = requestAnimationFrame(tick);
                };
                V.kick = () => { if (!V.anim) V.anim = requestAnimationFrame(tick); };
                const io = 'IntersectionObserver' in window ? new IntersectionObserver((es) => { visible = es[es.length - 1].isIntersecting; if (visible) V.kick(); }) : null;
                io?.observe(cv);
                const size = () => {
                    const r = cv.getBoundingClientRect();
                    if (!r.width) return;
                    const dpr = Math.min(3, window.devicePixelRatio || 1);
                    W = r.width;
                    cv.width = Math.round(r.width * dpr);
                    cv.height = Math.round(r.width * (4 / 3) * dpr);
                    V.draw();
                };
                const ro = new ResizeObserver(size);
                ro.observe(cv);
                V.stop = () => { ro.disconnect(); io?.disconnect(); cancelAnimationFrame(V.raf); cancelAnimationFrame(V.anim); };
                live.add(V);
                V.kick();

                const commit = () => o.onRot?.(Tree3D.norm(V.rot));
                const toTree = (e) => { const r = cv.getBoundingClientRect(); return [((e.clientX - r.left) / r.width) * 300, ((e.clientY - r.top) / r.height) * 400]; };
                const hit = ([x, y]) => {
                    const list = V.scene?.items || [];
                    for (let i = list.length - 1; i >= 0; i--) {
                        const it = list[i];
                        if (it.k === 'o' && Math.hypot(it.x - x, it.y - 2 * it.sc - y) < 13 * it.sc + 3) return it.o;
                    }
                    return null;
                };
                const stopSpin = () => { cancelAnimationFrame(V.raf); V.raf = 0; };
                const spin = () => {
                    if (Math.abs(V.vel) < 0.004) { V.raf = 0; commit(); return; }
                    V.rot += V.vel * 16;
                    V.vel *= 0.93;
                    V.draw();
                    V.raf = requestAnimationFrame(spin);
                };

                // 장식 위·고르는 중에는 화면이 스크롤되지 않게 (그 밖에는 세로 스크롤을 살린다)
                cv.addEventListener('touchstart', (e) => {
                    const t = e.touches[0];
                    if (o.interactive && t && (o.hint?.() || hit(toTree(t)))) e.preventDefault();
                }, { passive: false });
                cv.addEventListener('pointerdown', (e) => {
                    if (!e.isPrimary || (e.pointerType === 'mouse' && e.button !== 0)) return;
                    stopSpin();
                    const p = toTree(e);
                    const orn = o.interactive ? hit(p) : null;
                    G = { id: e.pointerId, x0: e.clientX, y0: e.clientY, lx: e.clientX, lt: e.timeStamp, p, orn, mode: '', ok: false, orig: orn ? { a: orn.a, h: orn.h } : null };
                    V.vel = 0;
                    try { cv.setPointerCapture(e.pointerId); } catch { /* 무시 */ }
                });
                cv.addEventListener('pointermove', (e) => {
                    if (!G || e.pointerId !== G.id) return;
                    if (!G.mode) {
                        if (Math.hypot(e.clientX - G.x0, e.clientY - G.y0) < 7) return;
                        G.mode = G.orn && !o.hint?.() ? 'orn' : 'spin';
                        cv.classList.add('grabbing');
                    }
                    if (G.mode === 'spin') {
                        const dt = Math.max(1, e.timeStamp - G.lt);
                        const dr = -(e.clientX - G.lx) * (300 / Math.max(W, 1)) * 0.55;
                        V.rot += dr;
                        V.vel = V.vel * 0.5 + (dr / dt) * 0.5;
                        G.lx = e.clientX;
                        G.lt = e.timeStamp;
                    } else {
                        const pos = Tree3D.pickAt(o.view(), V.rot, ...toTree(e));
                        G.ok = Boolean(pos);
                        if (pos) Object.assign(G.orn, pos);
                    }
                    V.draw();
                });
                const end = (e, cancel) => {
                    if (!G || e.pointerId !== G.id) return;
                    const g = G;
                    G = null;
                    cv.classList.remove('grabbing');
                    if (g.mode === 'spin') {
                        if (!cancel && !reduce() && Math.abs(V.vel) > 0.02 && e.timeStamp - g.lt < 80) V.raf = requestAnimationFrame(spin);
                        else commit();
                    } else if (g.mode === 'orn') {
                        const ok = g.ok && !cancel;
                        if (!ok) Object.assign(g.orn, g.orig);
                        o.onDrop?.(g.orn, ok);
                        V.draw();
                    } else if (!cancel) {
                        o.onTap?.(g.orn || hit(g.p), Tree3D.pickAt(o.view(), V.rot, ...g.p));
                    }
                };
                cv.addEventListener('pointerup', (e) => end(e, false));
                cv.addEventListener('pointercancel', (e) => end(e, true));
                cv.addEventListener('keydown', (e) => {
                    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
                    e.preventDefault();
                    V.rot += e.key === 'ArrowLeft' ? 20 : -20;
                    V.draw();
                    commit();
                });

                // 처음 한 번은 살짝 돌며 나타나서 돌릴 수 있다는 걸 보여 준다
                if (o.intro && !reduce()) {
                    const target = V.rot;
                    const t0 = performance.now();
                    V.rot = target - 50;
                    const step = (now) => {
                        const t = Math.min(1, (now - t0) / 1100);
                        V.rot = target - 50 * (1 - t) ** 3;
                        V.draw();
                        if (t < 1 && !G) V.raf = requestAnimationFrame(step);
                        else if (t >= 1) V.raf = 0;
                    };
                    V.raf = requestAnimationFrame(step);
                }
                return V;
            }
            return { mount, redrawAll };
        })();

        // ── 트리 상태 계산 ──
        function streakOf(waters, today) {
            const set = new Set(waters);
            let k = set.has(today) ? today : Clock.shift(today, -1);
            let n = 0;
            while (set.has(k)) { n++; k = Clock.shift(k, -1); }
            return n;
        }

        function moodOf(st) {
            const se = Clock.season();
            const today = Clock.today();
            if (st.waters.includes(today)) return 'happy';
            if (se.phase !== 'advent' || se.day <= 1 || st.year !== se.year) return 'normal';
            return st.waters.includes(Clock.shift(today, -1)) ? 'normal' : 'sad';
        }

        const starOf = (st) => (st.opened ? 2 : stageOf(st.waters.length) >= 5 ? 1 : 0);

        function viewOf(st) {
            return { stage: stageOf(st.waters.length), orns: st.hung, star: starOf(st), lights: Boolean(st.forest?.goalDone), mood: moodOf(st), face: st.face || 0, theme: st.theme || 'green', boxes: [...st.hung, ...(st.tray || [])].filter((o) => o.src === 'gift').length };
        }

        // 예전 칸 번호(slot)로 저장된 장식을 표면 좌표로 바꾼다. 위치가 없는 장식은 null
        function fixOrn(o) {
            if (!o || typeof o !== 'object') return null;
            if (!(Number.isInteger(o.a) && Number.isInteger(o.h)) && Number.isInteger(o.slot) && SLOTS[o.slot]) Object.assign(o, Tree3D.fromSlot(o.slot));
            delete o.slot;
            return Number.isInteger(o.a) && Number.isInteger(o.h) ? o : null;
        }

        // 불러온 트리를 지금 형식으로: 달린 장식은 위치를 맞추고, 위치를 모르는 장식은 바구니로
        function fixTree(st) {
            const hung = [];
            st.hung.forEach((o) => { if (fixOrn(o)) hung.push(o); else if (o && typeof o === 'object') { delete o.a; delete o.h; st.tray.push(o); } });
            st.hung = hung;
            st.tray.forEach((o) => { if (o) delete o.slot; });
            return st;
        }

        // 스냅샷 v2: b + 단계(1) 전구(1) 별(1) 정면 각도(2) 테마(1) + [각도(2) 높이(2) 장식번호(2) 크기·기울기(1)]…
        // 예전 형식(숫자로 시작, 칸 번호)도 읽는다.
        const b36 = (n, w) => Math.max(0, Math.round(n)).toString(36).padStart(w, '0').slice(-w);
        function snapOf(st) {
            let s = `b${stageOf(st.waters.length)}${st.forest?.goalDone ? 1 : 0}${starOf(st)}${b36(Tree3D.norm(st.face || 0), 2)}${Math.max(0, THEME_KEYS.indexOf(st.theme || 'green'))}`;
            st.hung.slice(0, 40).forEach((o) => {
                const ix = BY_ID[o.type]?.ix;
                if (ix == null || !Number.isInteger(o.h)) return;
                const zr = (o.z ?? 1) * 11 + Math.max(-5, Math.min(5, Math.round((o.r || 0) / 6))) + 5;
                s += b36(Tree3D.norm(o.a), 2) + b36(Math.min(1000, o.h), 2) + b36(ix, 2) + zr.toString(36);
            });
            return s;
        }

        function unsnap(s) {
            if (typeof s !== 'string') return null;
            const orns = [];
            const src = (c) => (c.tier === 'gift' ? 'gift' : 'self');
            if (s[0] === 'b') {
                if (!/^b[0-5][01][0-2][0-9a-z]{2}[0-3](?:[0-9a-z]{7}){0,40}$/.test(s)) return null;
                for (let i = 7; i < s.length; i += 7) {
                    const a = parseInt(s.slice(i, i + 2), 36);
                    const h = parseInt(s.slice(i + 2, i + 4), 36);
                    const c = CAT[parseInt(s.slice(i + 4, i + 6), 36)];
                    const zr = parseInt(s[i + 6], 36);
                    const z = Math.floor(zr / 11);
                    if (c && a < 360 && h <= 1000 && z <= 2) orns.push({ a, h, z, r: ((zr % 11) - 5) * 6, type: c.id, src: src(c) });
                }
                return { stage: Number(s[1]), lights: s[2] === '1', star: Number(s[3]), face: Math.min(359, parseInt(s.slice(4, 6), 36)), theme: THEME_KEYS[Number(s[6])], orns, boxes: orns.filter((o) => o.src === 'gift').length, mood: 'normal' };
            }
            if (!/^[0-5][01][0-2](?:[0-9a-t][0-9a-z]{2}){0,30}$/.test(s)) return null;
            for (let i = 3; i < s.length; i += 3) {
                const slot = parseInt(s[i], 36);
                const c = CAT[parseInt(s.slice(i + 1, i + 3), 36)];
                if (c && slot < 30) orns.push({ ...Tree3D.fromSlot(slot), type: c.id, src: src(c) });
            }
            return { stage: Number(s[0]), lights: s[1] === '1', star: Number(s[2]), face: 0, theme: 'green', orns, boxes: orns.filter((o) => o.src === 'gift').length, mood: 'normal' };
        }

        // 12월 1~25일 물 준 날 → 25비트
        function maskOf(waters, year) {
            let m = 0;
            waters.forEach((k) => {
                const [y, mo, d] = k.split('-').map(Number);
                if (y === year && mo === 12 && d >= 1 && d <= 25) m |= 1 << (d - 1);
            });
            return m.toString(36);
        }

        function unmask(code, year) {
            const m = parseInt(code, 36);
            if (!Number.isFinite(m)) return [];
            const out = [];
            for (let d = 1; d <= 25; d++) if (m & (1 << (d - 1))) out.push(`${year}-12-${String(d).padStart(2, '0')}`);
            return out;
        }

        // ── 뽑기: 하루 결과는 트리ID+날짜로 고정 ──
        function drawFor(st, date) {
            const streak = streakOf(st.waters, date);
            const r = mulberry32(hash32(`${st.id}|${date}`));
            const w = streak >= 14 ? [40, 32, 20, 8] : streak >= 7 ? [48, 34, 16, 2] : streak >= 3 ? [62, 30, 8, 0] : [80, 18, 2, 0];
            const tiers = ['basic', 'special', 'rare', 'legend'];
            let x = r() * 100;
            let t = 0;
            while (t < 3 && x >= w[t]) { x -= w[t]; t++; }
            const owned = new Set([...st.hung, ...st.tray].map((o) => o.type));
            if (t === 3 && CAT.some((c) => c.tier === 'legend' && owned.has(c.id))) t = 2;   // 전설은 한 판에 하나
            const pool = CAT.filter((c) => c.tier === tiers[t]);
            return pool[Math.floor(r() * pool.length)].id;
        }

        // ════════════════════════════════════════════════════════════
        //  상태 변경
        // ════════════════════════════════════════════════════════════
        let S = Store.load();
        if (S && (S.v !== 1 || !Array.isArray(S.waters) || !Array.isArray(S.hung) || !Array.isArray(S.tray))) S = null;
        if (S) fixTree(S);
        const UI = { pick: null, lastLink: '', rot: null, intro: false };

        // 기기에 먼저 저장하고, 서버에 연결된 트리면 잠시 뒤 묶어서 서버에도 올린다
        const save = () => { Store.save(S); Sync.later(); };

        // 단계마다 달 수 있는 장식 수가 늘어난다
        const roomLeft = (st) => STAGE_CAP[stageOf(st.waters.length)] - st.hung.length;

        // 선물·하트는 자리가 남았으면 앞쪽 빈 곳에 바로 달고, 없으면 바구니로
        function addOrn(st, type, src, extra = {}, autoHang = false) {
            const o = { uid: rid(6), type, src, ...extra };
            if (autoHang && roomLeft(st) > 0) { Object.assign(o, Tree3D.freeSpot(st.hung, st.face || 0)); st.hung.push(o); } else st.tray.push(o);
            return o;
        }

        function newTree(owner, mode) {
            const se = Clock.season();
            const st = {
                v: 1, id: rid(10), owner, mode, year: se.year, planted: Clock.today(),
                waters: [], draws: {}, tray: [], hung: [], gifts: [], opened: false,
                couple: mode === 'couple' ? { id: '', name: '', snap: '', waters: [], at: 0, heartDays: [], sentDrop: '', b3: false, b7: false } : null,
                forest: null
            };
            addOrn(st, 'ball-red', 'self');   // 심은 기념 장식: 바로 달아 볼 수 있게
            return st;
        }

        function longestRun(days) {
            let best = 0;
            let run = 0;
            let prev = '';
            [...days].sort().forEach((d) => {
                run = prev && Clock.shift(prev, 1) === d ? run + 1 : 1;
                best = Math.max(best, run);
                prev = d;
            });
            return best;
        }

        // 커플: 둘 다 물 준 날마다 하트. 양쪽 기기가 같은 규칙으로 각자 계산한다.
        function syncHearts(st) {
            if (st.mode !== 'couple' || !st.couple?.id) return 0;
            const mine = new Set(st.waters);
            const have = new Set(st.couple.heartDays);
            let added = 0;
            st.couple.waters.filter((d) => mine.has(d)).sort().forEach((d) => {
                if (have.has(d)) return;
                have.add(d);
                addOrn(st, 'c-heart', 'heart', {}, true);
                added++;
            });
            st.couple.heartDays = [...have].sort();
            const run = longestRun(st.couple.heartDays);
            if (run >= 3 && !st.couple.b3) { st.couple.b3 = true; addOrn(st, 'c-ring', 'heart', {}, true); added++; }
            if (run >= 7 && !st.couple.b7) { st.couple.b7 = true; addOrn(st, 'c-mug', 'heart', {}, true); added++; }
            return added;
        }

        // 숲: 열어 본 소식 + 내 물 횟수로 공동 목표
        function forestTotals(st) {
            const members = Object.values(st.forest?.members || {});
            const total = st.waters.length + members.reduce((a, m) => a + (Number(m.w) || 0), 0);
            return { total, target: (members.length + 1) * 10, count: members.length + 1 };
        }

        function checkForestGoal(st) {
            if (st.mode !== 'forest' || !st.forest || st.forest.goalDone) return false;
            const { total, target } = forestTotals(st);
            if (total >= target && Object.keys(st.forest.members).length >= 1) {
                st.forest.goalDone = true;
                return true;
            }
            return false;
        }

        // ════════════════════════════════════════════════════════════
        //  서버 연동 (Cloudflare Worker: workers/tree-api)
        //  - 서버 주소가 없으면 지금까지처럼 링크로만 주고받는다.
        //  - 트리는 기기에 먼저 저장하고(S), 토큰(S.token)이 있으면 서버에도 올린다.
        //  - 서버에 없던 기기 트리는 같은 아이디로 옮긴다 (숲·커플 연결도 같이).
        // ════════════════════════════════════════════════════════════
        const Api = (() => {
            const meta = document.querySelector('meta[name="tree-api"]')?.content?.trim() || '';
            // localhost에서는 실제 서버 대신 로컬 Worker(npm run dev)에 붙는다. ?api=off는 서버 없이, ?api=prod는 실제 서버로.
            const q = IS_LOCAL ? new URLSearchParams(location.search).get('api') : null;
            const base = q === 'off' ? '' : (IS_LOCAL && q !== 'prod' ? 'http://localhost:8787' : meta).replace(/\/$/, '');
            async function call(method, path, body, token) {
                const fail = (msg, status, data) => Object.assign(new Error(msg), { status, data });
                if (!base) throw fail('서버가 연결되어 있지 않아요.', 0);
                const headers = {};
                if (body) headers['Content-Type'] = 'application/json';
                if (token) headers.Authorization = `Bearer ${token}`;
                // 로컬 개발: ?today로 바꾼 날짜를 서버에도 알려 메시지 잠금을 같이 시험한다 (배포 서버는 이 머리글을 무시)
                if (IS_LOCAL && new URLSearchParams(location.search).get('today')) headers['X-Dev-Now'] = Clock.now().toISOString();
                let res;
                try {
                    res = await fetch(base + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
                } catch {
                    throw fail('서버에 연결할 수 없어요. 잠시 뒤 다시 시도해 주세요.', 0);
                }
                const data = res.status === 204 ? null : await res.json().catch(() => null);
                if (!res.ok) throw fail(data?.detail || `요청이 실패했어요. (${res.status})`, res.status, data);
                return data;
            }
            return { on: () => Boolean(base), call };
        })();

        const linked = () => Boolean(Api.on() && S?.token);

        // 서버에 올릴 상태: 토큰·기기 전용 값과, 예전 링크 선물의 뒤섞인 메시지는 빼고 올린다
        function serverState(st) {
            const { token, rev, dirty, msgs, ...rest } = st;
            const strip = (list) => list.map(({ msg, ...o }) => o);
            const out = { ...rest, hung: strip(st.hung), tray: strip(st.tray) };
            if (st.couple) out.couple = { id: st.couple.id, name: st.couple.name, heartDays: st.couple.heartDays, b3: st.couple.b3, b7: st.couple.b7 };
            if (st.forest) out.forest = { id: st.forest.id, name: st.forest.name, goalDone: Boolean(st.forest.goalDone) };
            return out;
        }

        // 다른 기기에서 먼저 바뀐 서버 상태와 합친다: 물 준 날·뽑기·받은 선물은 합집합, 장식은 서버 쪽에 내 기기에만 있는 것을 더한다
        function mergeServer(t) {
            const sv = t.state || {};
            const keepMsg = new Map([...S.hung, ...S.tray].filter((o) => o.msg).map((o) => [o.uid, o.msg]));
            const withMsg = (o) => (keepMsg.has(o.uid) ? { ...o, msg: keepMsg.get(o.uid) } : o);
            const svHung = Array.isArray(sv.hung) ? sv.hung : [];
            const svTray = Array.isArray(sv.tray) ? sv.tray : [];
            const known = new Set([...svHung, ...svTray].map((o) => o.uid));
            const hung = [];
            const tray = [...svTray];
            [...svHung, ...S.hung.filter((o) => !known.has(o.uid))].forEach((o) => {
                if (fixOrn(o)) hung.push(o); else if (o && typeof o === 'object') tray.push(o);
            });
            tray.forEach((o) => { if (o) delete o.slot; });
            if (S.face == null && Number.isInteger(sv.face)) S.face = sv.face;
            if (!S.theme && THEMES[sv.theme]) S.theme = sv.theme;
            S.tray.forEach((o) => { if (!known.has(o.uid)) tray.push(o); });
            S.waters = [...new Set([...(sv.waters || []), ...S.waters])].sort();
            S.draws = { ...(sv.draws || {}), ...S.draws };
            S.gifts = [...new Set([...(sv.gifts || []), ...S.gifts])];
            S.hung = hung.map(withMsg);
            S.tray = tray.map(withMsg);
            S.opened = S.opened || Boolean(sv.opened);
            if (sv.couple && S.couple) {
                S.couple.heartDays = [...new Set([...(sv.couple.heartDays || []), ...S.couple.heartDays])].sort();
                S.couple.b3 = S.couple.b3 || Boolean(sv.couple.b3);
                S.couple.b7 = S.couple.b7 || Boolean(sv.couple.b7);
            }
            if (sv.forest?.goalDone && S.forest) S.forest.goalDone = true;
            if (t.owner) S.owner = t.owner;
            S.rev = t.rev;
        }

        const Sync = (() => {
            let timer = null;
            let busy = false;
            let status = '';
            const LABEL = { saving: '☁️ 저장 중…', saved: '☁️ 저장됨', wait: '⏳ 동기화 대기', off: '📴 오프라인' };
            const label = () => (linked() ? LABEL[status] || '☁️' : '');
