            // ── 커플 (52~54) ──
            { id: 'c-heart', name: '하트', tier: 'couple', svg: '<path d="M0 9.4C-7 4.6-10.4 0-10.4-3.8a5.2 5.2 0 0 1 10.4-1.4 5.2 5.2 0 0 1 10.4 1.4C10.4 0 7 4.6 0 9.4z" fill="#ef4444"/><ellipse cx="-5" cy="-4" rx="2" ry="1.2" fill="#fff" opacity=".5" transform="rotate(-30 -5 -4)"/>' },
            { id: 'c-ring', name: '반지 전구', tier: 'couple', svg: `<circle r="12.5" fill="url(#gGlow)"/><rect x="-3.6" y="-13" width="7.2" height="4.4" rx="1.2" fill="#94a3b8"/><path d="${BULB}" fill="#fda4af"/><circle r="3.4" fill="none" stroke="#eab308" stroke-width="1.6"/><path d="M-1.4-3.6l1.4-2 1.4 2z" fill="#a5f3fc"/>` },
            { id: 'c-mug', name: '커플 머그', tier: 'couple', svg: '<path d="M-9-4h8v7a3.4 3.4 0 0 1-3.4 3.4h-1.2A3.4 3.4 0 0 1-9 3z" fill="#fca5a5"/><path d="M1-4h8v7a3.4 3.4 0 0 1-3.4 3.4H4.4A3.4 3.4 0 0 1 1 3z" fill="#93c5fd"/><path d="M0-6c-1.6-1.4-3.4.4-1.6 2L0-2.4 1.6-4c1.8-1.6 0-3.4-1.6-2z" fill="#ef4444"/>' }
        ];
        const BY_ID = Object.fromEntries(CAT.map((c, i) => [c.id, { ...c, ix: i }]));
        const TIER_LABEL = { basic: '기본', special: '특별', rare: '희귀 ✨', legend: '전설 🌟', gift: '선물 🎁', couple: '커플 💗' };
        const GIFT_TYPES = CAT.filter((c) => c.tier === 'gift').map((c) => c.id);

        const ornSvg = (type, size = 40) => `<svg viewBox="-16 -17 32 32" width="${size}" height="${size}" aria-hidden="true">${BY_ID[type]?.svg || ''}</svg>`;

        // ════════════════════════════════════════════════════════════
        //  트리 성장·그리기
        // ════════════════════════════════════════════════════════════
        const STAGE_AT = [0, 3, 7, 12, 17, 21];          // 물 준 횟수 → 단계
        const STAGE_SLOTS = [6, 10, 15, 20, 26, 30];
        const STAGE_SCALE = [0.5, 0.62, 0.74, 0.85, 0.93, 1];
        const STAGE_NAME = ['묘목', '작은 트리', '두 층 트리', '세 층 트리', '큰 트리', '꼭대기까지 자란 트리'];
        const stageOf = (w) => STAGE_AT.reduce((s, t, i) => (w >= t ? i : s), 0);

        // 장식 칸 30개 (다 자란 트리 기준 좌표). 번호는 링크에 들어가므로 고정.
        const SLOTS = [
            [138, 82], [162, 82],                                   // 0-1
            [126, 118], [174, 118],                                 // 2-3
            [124, 150], [176, 150],                                 // 4-5
            [96, 184], [134, 184], [172, 184], [208, 184],          // 6-9
            [96, 214], [134, 214], [172, 214], [208, 214],          // 10-13
            [70, 248], [112, 248], [154, 248], [196, 248], [232, 248], // 14-18
            [72, 282], [112, 282], [152, 282], [192, 282], [232, 282], // 19-23
            [52, 316], [94, 316], [136, 316], [178, 316], [220, 316], [254, 316] // 24-29
        ];
        // 작은 트리부터 고르게 채워지도록 열리는 순서
        const SLOT_ORDER = [2, 3, 7, 8, 15, 17, 25, 28, 4, 5, 10, 13, 21, 0, 1, 14, 18, 24, 29, 16, 6, 9, 19, 23, 26, 27, 11, 12, 20, 22];
        const slotsForStage = (stage) => SLOT_ORDER.slice(0, STAGE_SLOTS[stage]);

        const TIERS = [[190, 330, 130], [140, 265, 110], [90, 200, 85], [40, 140, 60]];   // [꼭대기 y, 밑동 y, 반폭] 아래층부터
        const BASE = [150, 370];
        const scaled = (x, y, f) => [BASE[0] + (x - BASE[0]) * f, BASE[1] - (BASE[1] - y) * f];

        function tierPath(apex, base, hw) {
            const c = 150;
            return `M${c} ${apex}L${c + hw} ${base}Q${c + hw * 0.5} ${base + 12} ${c} ${base}Q${c - hw * 0.5} ${base + 12} ${c - hw} ${base}Z`;
        }

        function faceSvg(mood) {
            if (mood === 'happy') {
                return '<path d="M140 345q3-3.4 6 0M154 345q3-3.4 6 0" stroke="#2b1708" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M143 351q7 6 14 0" stroke="#2b1708" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="139" cy="351" r="2.6" fill="#f9a8d4" opacity=".7"/><circle cx="161" cy="351" r="2.6" fill="#f9a8d4" opacity=".7"/>';
            }
            if (mood === 'sad') {
                return '<circle cx="143" cy="345" r="1.8" fill="#2b1708"/><circle cx="157" cy="345" r="1.8" fill="#2b1708"/><path d="M144 355q6-4.4 12 0" stroke="#2b1708" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M160 348q2 3 0 5-2-2 0-5z" fill="#93c5fd"/>';
            }
            return '<circle cx="143" cy="345" r="1.8" fill="#2b1708"/><circle cx="157" cy="345" r="1.8" fill="#2b1708"/><path d="M145 351q5 3.6 10 0" stroke="#2b1708" stroke-width="2" fill="none" stroke-linecap="round"/>';
        }

        function lightsAlong(x1, y1, cx, cy, x2, y2, n, r, colors) {
            let dots = `<path d="M${x1} ${y1}Q${cx} ${cy} ${x2} ${y2}" stroke="#334155" stroke-width="1.4" fill="none"/>`;
            for (let i = 1; i < n; i++) {
                const t = i / n;
                const x = (1 - t) ** 2 * x1 + 2 * (1 - t) * t * cx + t ** 2 * x2;
                const y = (1 - t) ** 2 * y1 + 2 * (1 - t) * t * cy + t ** 2 * y2;
                const c = colors[i % colors.length];
                dots += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r * 2}" fill="${c}" opacity=".25"/><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="${c}"/>`;
            }
            return dots;
        }

        // v = { stage, orns:[{slot,type,src,uid?}], star:0|1|2, lights:bool, mood }
        // o = { interactive, pick:{uid?}|null }
        function treeInner(v, o = {}) {
            const f = STAGE_SCALE[v.stage] ?? 0.5;
            let g = '<ellipse cx="150" cy="372" rx="132" ry="16" fill="#e8eef7"/><ellipse cx="150" cy="369" rx="92" ry="8" fill="#fff" opacity=".7"/>';
            g += `<g transform="translate(150 370) scale(${f}) translate(-150 -370)">`;
            g += '<rect x="135" y="318" width="30" height="52" rx="5" fill="#7c4a24"/><rect x="135" y="318" width="10" height="52" fill="#000" opacity=".08"/>';
            g += faceSvg(v.mood);
            TIERS.forEach(([apex, base, hw], i) => {
                g += `<path d="${tierPath(apex, base, hw)}" fill="${i % 2 ? '#22905c' : '#1e7d4f'}"/>`;
                g += `<path d="M150 ${apex}L${150 + hw} ${base}Q${150 + hw * 0.5} ${base + 12} 150 ${base}Z" fill="#000" opacity=".12"/>`;
                g += `<path d="M150 ${apex + 4}L${150 - hw * 0.72} ${base - 6}" stroke="#fff" stroke-width="2" opacity=".08"/>`;
            });
            if (v.stage >= 3) {
                g += lightsAlong(92, 196, 150, 226, 210, 190, 7, 2.4, ['#fde047', '#fb7185', '#60a5fa', '#4ade80']);
                g += lightsAlong(64, 262, 150, 300, 238, 254, 9, 2.4, ['#fb7185', '#fde047', '#4ade80', '#60a5fa']);
            }
            if (v.lights) g += lightsAlong(36, 322, 150, 368, 266, 316, 11, 4.4, ['#f43f5e', '#facc15', '#22d3ee', '#a3e635', '#c084fc']);
            g += '</g>';

            const [sx, sy] = scaled(150, 36, f);
            if (v.star === 2) {
                g += `<circle cx="${sx}" cy="${sy}" r="40" fill="url(#gStarGlow)"/><path d="${starPath(17, 7.4)}" transform="translate(${sx} ${sy})" fill="url(#gGold)" stroke="#b45309" stroke-width="1"/>`;
            } else if (v.star === 1) {
                g += `<path d="${starPath(15, 6.5)}" transform="translate(${sx} ${sy})" fill="none" stroke="#fde68a" stroke-width="1.6" stroke-dasharray="3 3" opacity=".8"/>`;
            }

            const s = 0.62 + 0.38 * f;
            const bySlot = new Map(v.orns.filter((x) => x.slot != null).map((x) => [x.slot, x]));
            slotsForStage(v.stage).forEach((slot) => {
                const [x, y] = scaled(...SLOTS[slot], f);
                const orn = bySlot.get(slot);
                const pos = `translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${s.toFixed(3)})`;
                if (orn && BY_ID[orn.type]) {
                    const moving = o.pick && o.pick.uid === orn.uid;
                    const attrs = o.interactive && !o.pick ? ` class="orn" data-act="orn" data-uid="${esc(orn.uid)}"` : (moving ? ' class="orn moving"' : '');
                    const tag = orn.src === 'gift' ? '<path d="M6 6l5 1.4-1.6 4.4z" fill="#fbbf24" stroke="#b45309" stroke-width=".5"/>' : '';
                    g += `<g transform="${pos}"${attrs}>${BY_ID[orn.type].svg}${tag}</g>`;
                } else if (o.pick) {
                    g += `<circle class="slot-hint" data-act="slot" data-slot="${slot}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(10.5 * s).toFixed(1)}"/>`;
                }
            });
            return g;
        }

        const treeSvg = (v, o = {}, label = '트리') => `<svg viewBox="0 0 300 400" role="img" aria-label="${esc(label)}">${treeInner(v, o)}</svg>`;

        // ── 트리 상태 계산 ──
        function streakOf(waters, today) {
            const set = new Set(waters);
            let k = set.has(today) ? today : Clock.shift(today, -1);
            let n = 0;
            while (set.has(k)) { n++; k = Clock.shift(k, -1); }
            return n;
        }

        function moodOf(st) {
            const se = Clock.season();
            const today = Clock.today();
            if (st.waters.includes(today)) return 'happy';
            if (se.phase !== 'advent' || se.day <= 1 || st.year !== se.year) return 'normal';
            return st.waters.includes(Clock.shift(today, -1)) ? 'normal' : 'sad';
        }

        const starOf = (st) => (st.opened ? 2 : stageOf(st.waters.length) >= 5 ? 1 : 0);

        function viewOf(st) {
            return { stage: stageOf(st.waters.length), orns: st.hung, star: starOf(st), lights: Boolean(st.forest?.goalDone), mood: moodOf(st) };
        }

        // 스냅샷: 단계(1) 전구(1) 별(1) + [칸(1) 장식번호(2)]… → 장식 30개여도 100자 안쪽
        function snapOf(st) {
            let s = `${stageOf(st.waters.length)}${st.forest?.goalDone ? 1 : 0}${starOf(st)}`;
            st.hung.forEach((o) => {
                const ix = BY_ID[o.type]?.ix;
                if (ix == null || o.slot == null) return;
                s += o.slot.toString(36) + ix.toString(36).padStart(2, '0');
            });
            return s;
        }

        function unsnap(s) {
            if (typeof s !== 'string' || !/^[0-5][01][0-2](?:[0-9a-t][0-9a-z]{2}){0,30}$/.test(s)) return null;
            const orns = [];
            for (let i = 3; i < s.length; i += 3) {
                const slot = parseInt(s[i], 36);
                const c = CAT[parseInt(s.slice(i + 1, i + 3), 36)];
                if (c && slot < 30) orns.push({ slot, type: c.id, src: c.tier === 'gift' ? 'gift' : 'self' });
            }
            return { stage: Number(s[0]), lights: s[1] === '1', star: Number(s[2]), orns, mood: 'normal' };
        }

        // 12월 1~25일 물 준 날 → 25비트
        function maskOf(waters, year) {
            let m = 0;
            waters.forEach((k) => {
                const [y, mo, d] = k.split('-').map(Number);
                if (y === year && mo === 12 && d >= 1 && d <= 25) m |= 1 << (d - 1);
            });
            return m.toString(36);
        }

        function unmask(code, year) {
            const m = parseInt(code, 36);
            if (!Number.isFinite(m)) return [];
            const out = [];
            for (let d = 1; d <= 25; d++) if (m & (1 << (d - 1))) out.push(`${year}-12-${String(d).padStart(2, '0')}`);
            return out;
        }

        // ── 뽑기: 하루 결과는 트리ID+날짜로 고정 ──
        function drawFor(st, date) {
            const streak = streakOf(st.waters, date);
            const r = mulberry32(hash32(`${st.id}|${date}`));
            const w = streak >= 14 ? [40, 32, 20, 8] : streak >= 7 ? [48, 34, 16, 2] : streak >= 3 ? [62, 30, 8, 0] : [80, 18, 2, 0];
            const tiers = ['basic', 'special', 'rare', 'legend'];
            let x = r() * 100;
            let t = 0;
            while (t < 3 && x >= w[t]) { x -= w[t]; t++; }
            const owned = new Set([...st.hung, ...st.tray].map((o) => o.type));
            if (t === 3 && CAT.some((c) => c.tier === 'legend' && owned.has(c.id))) t = 2;   // 전설은 한 판에 하나
            const pool = CAT.filter((c) => c.tier === tiers[t]);
            return pool[Math.floor(r() * pool.length)].id;
        }

        // ════════════════════════════════════════════════════════════
        //  상태 변경
        // ════════════════════════════════════════════════════════════
        let S = Store.load();
        if (S && (S.v !== 1 || !Array.isArray(S.waters) || !Array.isArray(S.hung))) S = null;
        const UI = { pick: null, lastLink: '' };

        const save = () => Store.save(S);

        function firstEmpty(st) {
            const used = new Set(st.hung.map((h) => h.slot));
            return slotsForStage(stageOf(st.waters.length)).find((s) => !used.has(s));
        }

        // 선물·하트는 빈 칸이 있으면 바로 달고, 없으면 바구니로
        function addOrn(st, type, src, extra = {}, autoHang = false) {
            const o = { uid: rid(6), type, src, ...extra };
            const slot = autoHang ? firstEmpty(st) : undefined;
            if (slot != null) { o.slot = slot; st.hung.push(o); } else st.tray.push(o);
            return o;
        }

        function newTree(owner, mode) {
            const se = Clock.season();
            const st = {
                v: 1, id: rid(10), owner, mode, year: se.year, planted: Clock.today(),
                waters: [], draws: {}, tray: [], hung: [], gifts: [], opened: false,
                couple: mode === 'couple' ? { id: '', name: '', snap: '', waters: [], at: 0, heartDays: [], sentDrop: '', b3: false, b7: false } : null,
                forest: null
            };
            addOrn(st, 'ball-red', 'self');   // 심은 기념 장식: 바로 달아 볼 수 있게
            return st;
        }

        function longestRun(days) {
            let best = 0;
            let run = 0;
            let prev = '';
            [...days].sort().forEach((d) => {
                run = prev && Clock.shift(prev, 1) === d ? run + 1 : 1;
                best = Math.max(best, run);
                prev = d;
            });
            return best;
        }

        // 커플: 둘 다 물 준 날마다 하트. 양쪽 기기가 같은 규칙으로 각자 계산한다.
        function syncHearts(st) {
            if (st.mode !== 'couple' || !st.couple?.id) return 0;
            const mine = new Set(st.waters);
            const have = new Set(st.couple.heartDays);
            let added = 0;
            st.couple.waters.filter((d) => mine.has(d)).sort().forEach((d) => {
                if (have.has(d)) return;
                have.add(d);
                addOrn(st, 'c-heart', 'heart', {}, true);
                added++;
            });
            st.couple.heartDays = [...have].sort();
            const run = longestRun(st.couple.heartDays);
            if (run >= 3 && !st.couple.b3) { st.couple.b3 = true; addOrn(st, 'c-ring', 'heart', {}, true); added++; }
            if (run >= 7 && !st.couple.b7) { st.couple.b7 = true; addOrn(st, 'c-mug', 'heart', {}, true); added++; }
            return added;
        }

        // 숲: 열어 본 소식 + 내 물 횟수로 공동 목표
        function forestTotals(st) {
            const members = Object.values(st.forest?.members || {});
            const total = st.waters.length + members.reduce((a, m) => a + (Number(m.w) || 0), 0);
            return { total, target: (members.length + 1) * 10, count: members.length + 1 };
        }

        function checkForestGoal(st) {
            if (st.mode !== 'forest' || !st.forest || st.forest.goalDone) return false;
            const { total, target } = forestTotals(st);
            if (total >= target && Object.keys(st.forest.members).length >= 1) {
                st.forest.goalDone = true;
                return true;
            }
            return false;
        }

        // ── 소리 (첫 터치에 깨운다) ──
        const Sound = (() => {
            let c = null;
            function ac() {
                if (!c) {
                    const C = window.AudioContext || window.webkitAudioContext;
                    if (!C) return null;
                    try { c = new C(); } catch { return null; }
                }
                if (c.state === 'suspended') c.resume().catch(() => {});
                return c;
            }
            function tone(a, f, t, len, vol = 0.14, type = 'sine') {
                const o = a.createOscillator();
                const g = a.createGain();
                o.type = type;
                o.frequency.value = f;
                g.gain.setValueAtTime(0.0001, t);
                g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
                g.gain.exponentialRampToValueAtTime(0.001, t + len);
                o.connect(g).connect(a.destination);
                o.start(t);
                o.stop(t + len + 0.05);
            }
            const play = (fn) => { const a = ac(); if (a) fn(a, a.currentTime + 0.01); };
            return {
                wake: () => ac(),
                water: () => play((a, t) => { tone(a, 880, t, 0.12); tone(a, 587, t + 0.09, 0.22); }),
                pop: () => play((a, t) => tone(a, 520, t, 0.1, 0.12, 'triangle')),
                sparkle: () => play((a, t) => [784, 988, 1175, 1568].forEach((f, i) => tone(a, f, t + i * 0.08, 0.3, 0.1, 'triangle'))),
                bells: () => play((a, t) => [1046, 1318, 1568, 1318, 1046, 1568].forEach((f, i) => tone(a, f, t + i * 0.16, 0.6, 0.09)))
            };
        })();
        document.addEventListener('pointerdown', () => Sound.wake(), { once: true });

        const buzz = (p = 20) => {
            if (!('vibrate' in navigator) || navigator.userActivation?.hasBeenActive === false) return;
            try { navigator.vibrate(p); } catch { /* 무시 */ }
        };

        let toastTimer = null;
        function toast(msg) {
            const el = $('toast');
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
        }

        // ════════════════════════════════════════════════════════════
        //  공유·복사
        // ════════════════════════════════════════════════════════════
        const linkFor = (kind, obj) => `${location.origin}${location.pathname}#${kind}=${Codec.pack(obj)}`;

        async function copyText(text) {
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                    return true;
                }
            } catch { /* 아래 방식으로 */ }
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.setAttribute('readonly', '');
            ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
            document.body.appendChild(ta);
            ta.select();
            let ok = false;
            try { ok = document.execCommand('copy'); } catch { ok = false; }
            ta.remove();
            return ok;
        }

        async function share(url, text) {
            if (navigator.share) {
                try {
                    await navigator.share({ title: '어드벤트 트리', text, url });
                    return 'shared';
                } catch (e) {
                    if (e?.name === 'AbortError') return 'cancel';
                }
            }
            if (await copyText(`${text}\n${url}`)) {
                toast('링크를 복사했어요. 카톡에 붙여 넣어 주세요');
                return 'copied';
            }
            openSheet(`<h2>링크를 복사해 주세요</h2><p class="hint">길게 눌러 전체 선택 후 복사해서 보내 주세요.</p><textarea class="txt code-box" readonly>${esc(url)}</textarea><button class="btn btn-ghost btn-block" data-act="sheet-close" type="button" style="margin-top:10px">닫기</button>`);
            return 'manual';
        }

        // ════════════════════════════════════════════════════════════
        //  화면
        // ════════════════════════════════════════════════════════════
        const VIEWS = ['v-plant', 'v-tree', 'v-gift', 'v-view', 'v-info'];
        function show(id) {
            VIEWS.forEach((v) => { $(v).hidden = v !== id; });
            window.scrollTo({ top: 0 });
        }

        function openSheet(html) {
            $('sheet').innerHTML = html;
            $('sheet-bg').hidden = false;
        }

        function closeSheet() {
            $('sheet-bg').hidden = true;
            $('sheet').innerHTML = '';
        }

        function info(title, body, buttons = [{ label: '처음으로', act: 'home', primary: true }]) {
            $('v-info').innerHTML = `<div class="panel"><h2>${title}</h2><div class="hint">${body}</div>
                <div class="btn-row">${buttons.map((b) => `<button class="btn ${b.primary ? 'btn-festive' : 'btn-ghost'}" data-act="${b.act}" ${b.data || ''} type="button">${b.label}</button>`).join('')}</div></div>`;
            show('v-info');
        }

        const INAPP = /KAKAOTALK|NAVER\(inapp|Instagram|FBAN|FBAV|Line\//i.test(navigator.userAgent);
        const KAKAO = /KAKAOTALK/i.test(navigator.userAgent);

        function renderBanners() {
            let h = '';
            if (!Store.ok()) {
                h += '<div class="banner"><b>⚠️ 이 브라우저에서는 트리가 저장되지 않아요</b>개인 정보 보호 모드이거나 저장이 막혀 있어요. 사파리나 크롬 일반 창에서 열어 주세요.</div>';
            } else if (INAPP) {
                h += `<div class="banner"><b>📱 사파리·크롬에서 키우는 걸 추천해요</b>메신저 안 브라우저는 저장이 지워질 수 있어요. 트리는 열었던 브라우저에만 저장돼요.
                    ${KAKAO ? '<br><button class="btn btn-ghost" data-act="external" type="button">🌐 다른 브라우저로 열기</button>' : ''}</div>`;
            }
            $('banners').innerHTML = h;
        }

        // ── 심기 ──
        function renderPlant(invite = null) {
            const nick = Store.get('nick') || '';
            const fixed = invite?.kind;   // 'p'(짝꿍 초대) | 'f'(숲 초대)
            const se = Clock.season();
            const intro = fixed === 'p'
                ? `<div class="invite-box"><span class="e">💑</span><p><b>${esc(invite.p.n)}</b>님이 커플 트리를 같이 키우자고 해요!<br>내 트리를 심으면 둘이 짝이 돼요.</p></div>`
                : fixed === 'f'
                    ? `<div class="invite-box"><span class="e">🌲</span><p><b>${esc(invite.p.fn)}</b> 숲에 초대받았어요!<br>내 트리를 심으면 숲에 합류해요.</p></div>`
                    : '';
            const modes = fixed ? '' : `
                <label class="field">어떻게 키울까요?</label>
                <div class="mode-grid">
                    <label class="mode-card"><input type="radio" name="mode" value="solo" checked><div><b>🎄 나만의 트리</b><span>혼자 키우고, 친구들이 장식을 보내 줘요.</span></div></label>
                    <label class="mode-card"><input type="radio" name="mode" value="couple"><div><b>💑 커플 트리</b><span>두 그루가 나란히. 같은 날 둘 다 물을 주면 하트가 생겨요.</span></div></label>
                    <label class="mode-card"><input type="radio" name="mode" value="forest"><div><b>👨‍👩‍👧‍👦 그룹 트리 (우리 숲)</b><span>각자 트리가 모여 숲이 돼요. 단톡방에 소식을 올려 같이 키워요. (최대 ${MAX_FOREST}명)</span></div></label>
                </div>
                <div id="forest-name-box" hidden><label class="field" for="forest-name">숲 이름</label><input class="txt" id="forest-name" maxlength="16" placeholder="예) 우리 동네 숲" autocomplete="off"></div>`;
            $('v-plant').innerHTML = `
                <div class="panel">
                    ${intro}
                    <h2>🌱 트리 심기</h2>
                    <p class="hint">${se.phase === 'pre' ? `12월 1일부터 매일 물을 줄 수 있어요. 지금 심어 두면 D-${Clock.daysUntil(se.year, 12, 1)}부터 기다려요.` : '오늘부터 매일 한 번 물을 주고 장식을 뽑아 키워요.'}</p>
                    <label class="field" for="owner">내 이름 (친구들에게 보여요)</label>
                    <input class="txt" id="owner" maxlength="${MAX_NAME}" value="${esc(nick)}" placeholder="예) 민수" autocomplete="off">
                    ${modes}
                    <p class="error" id="plant-error"></p>
                    <button class="btn btn-festive btn-block" data-act="plant" type="button">🌱 심기</button>
                </div>`;
            $('v-plant').dataset.invite = invite ? JSON.stringify(invite) : '';
            $('v-plant').querySelectorAll('input[name="mode"]').forEach((r) => r.addEventListener('change', () => {
                $('forest-name-box').hidden = r.value !== 'forest' || !r.checked;
            }));
            show('v-plant');
        }

        // ── 내 트리 ──
        function renderTree() {
            if (!S) { renderPlant(); return; }
            const se = Clock.season();
            const today = Clock.today();
            const old = S.year !== se.year;
            const canWater = !old && (se.phase === 'advent' || se.phase === 'xmas');
            const watered = S.waters.includes(today);
            const drawn = Boolean(S.draws[today]);
            const stage = stageOf(S.waters.length);
            const streak = streakOf(S.waters, today);
            const giftCount = [...S.hung, ...S.tray].filter((o) => o.src === 'gift').length;
            const modeTag = { solo: '🎄 나만의', couple: '💑 커플', forest: '🌲 우리 숲' }[S.mode];

            let meta;
            if (old) meta = `🗂️ ${S.year}년 트리 · 지난 시즌`;
            else if (se.phase === 'pre') meta = `🌱 12월 1일까지 D-${Clock.daysUntil(se.year, 12, 1)} · 미리 장식을 달아 보세요`;
            else if (se.phase === 'advent') meta = `12월 ${se.day}일 · 💧 ${S.waters.length}번 · 🔥 ${streak}일 연속`;
            else if (se.phase === 'xmas') meta = '🎄 메리 크리스마스!';
            else meta = '🎄 올해 트리 완성 · 1월 7일까지 볼 수 있어요';
            meta += ` · ${STAGE_NAME[stage]}${giftCount ? ` · 🎁 ${giftCount}` : ''}`;

            const pick = UI.pick;
            const mine = treeSvg(viewOf(S), { interactive: !old, pick }, `${S.owner}의 트리`);
            let stageHtml;
            if (S.mode === 'couple') {
                const p = S.couple?.id ? unsnap(S.couple.snap) : null;
                stageHtml = `<div class="tree-box duo">
                    <div>${mine}<div class="tree-name">${esc(S.owner)}<small>나</small></div></div>
                    <div>${p ? `${treeSvg(p, {}, `${S.couple.name}의 트리`)}<div class="tree-name">${esc(S.couple.name)}<small>${agoText(S.couple.at)}</small></div>`
                        : '<div class="partner-wait"><span style="font-size:2rem">💌</span>짝꿍을 기다리는 중<br>아래에서 초대 링크를 보내 주세요</div>'}</div>
                </div>${S.couple?.id ? `<div class="heart-line">💗 둘 다 물 준 날 ${S.couple.heartDays.length}일</div>` : ''}`;
            } else {
                stageHtml = `<div class="tree-box">${mine}</div>`;
            }

            const xmasReady = !old && (se.phase === 'xmas' || se.phase === 'after') && !S.opened;
            const sky = `<div class="sky ${S.forest?.goalDone || se.phase === 'xmas' || S.opened ? 'snowing' : ''}">
                <div class="sky-head"><div><b>${esc(S.owner)}의 트리</b><div class="meta">${meta}</div></div><span class="mode-tag">${modeTag}</span></div>
                ${stageHtml}
                ${pick ? `<div class="pick-bar"><span>✨ 반짝이는 자리를 눌러 달아 주세요</span><button class="text-btn" data-act="cancel-pick" type="button">취소</button></div>` : ''}
                ${xmasReady ? '<div class="xmas-call"><button class="btn btn-festive btn-block glow" data-act="xmas" type="button">🎅 산타가 다녀갔어요! 선물 열어 보기</button></div>' : ''}
            </div>`;

            let daily = '';
            if (old) {
                daily = `<div class="panel"><h3>🗂️ 지난 시즌 트리예요</h3><p class="hint">${S.year}년 트리는 여기까지예요. 카드를 저장해 두고 올해 새로 심어 보세요.</p>
                    <div class="btn-row"><button class="btn btn-ghost" data-act="card" type="button">🖼️ 카드 저장</button><button class="btn btn-festive" data-act="replant" type="button">🌱 새로 심기</button></div></div>`;
            } else if (se.phase !== 'after') {
                const waterBtn = !canWater
                    ? '<button class="btn btn-water" disabled type="button">💧 12/1부터 물 주기</button>'
                    : watered ? '<button class="btn btn-water" disabled type="button">💧 오늘 물 줬어요</button>'
                        : '<button class="btn btn-water glow" data-act="water" type="button">💧 물 주기</button>';
                const drawBtn = !canWater
                    ? '<button class="btn btn-festive" disabled type="button">🎁 12/1부터 캡슐</button>'
                    : !watered ? '<button class="btn btn-festive" disabled type="button">🎁 물을 주면 열려요</button>'
                        : drawn ? '<button class="btn btn-festive" disabled type="button">🎁 내일 또 만나요</button>'
                            : '<button class="btn btn-festive glow" data-act="draw" type="button">🎁 오늘의 캡슐</button>';
                daily = `<div class="daily">${waterBtn}${drawBtn}</div>`;
            } else {
                daily = '<div class="daily"><button class="btn btn-ghost" data-act="card" type="button" style="grid-column:1/-1">🖼️ 트리 카드 저장</button></div>';
            }

            const tray = S.tray.length
                ? `<div class="tray">${S.tray.map((o) => `<button class="tray-item" data-act="pick" data-uid="${esc(o.uid)}" aria-pressed="${pick?.uid === o.uid}" type="button">${ornSvg(o.type)}<span>${esc(BY_ID[o.type]?.name || '')}</span></button>`).join('')}</div>`
                : '<p class="tray-empty">바구니가 비었어요. 캡슐을 열거나 친구에게 장식을 받아 보세요.</p>';

            $('v-tree').innerHTML = `${sky}${daily}
                ${old ? '' : `<div class="panel"><h3>🧺 장식 바구니 <span class="count">${S.tray.length}개</span></h3><p class="hint" style="margin-bottom:8px">장식을 누르고 트리의 빈 자리를 누르면 달려요. 달린 장식을 누르면 옮길 수 있어요.</p>${tray}</div>`}
                ${old ? '' : sharePanel()}
                ${S.mode === 'forest' ? forestPanel() : ''}
                <div class="tools">
                    <button class="text-btn" data-act="backup" type="button">💾 백업 코드</button>
                    ${!old && (S.opened || se.phase === 'after') ? '<button class="text-btn" data-act="card" type="button">🖼️ 카드 저장</button>' : ''}
                    <button class="text-btn" data-act="replant" type="button">🔄 처음부터</button>
                </div>`;
            show('v-tree');
        }

        function agoText(at) {
            if (!at) return '';
            const d = Math.floor((Clock.stamp() - at) / 86400000);
            return d <= 0 ? '오늘 소식' : `${d}일 전 소식`;
        }

        function sharePanel() {
            const today = Clock.today();
            const watered = S.waters.includes(today);
            let h = '<div class="panel"><h3>💌 같이 키우기</h3><div class="share-grid">';
            if (S.mode === 'couple') {
                if (!S.couple.id) h += '<button class="btn btn-festive wide" data-act="share-pair" type="button">💌 짝꿍 초대 링크 보내기</button>';
                else {
                    const need = watered && S.couple.sentDrop !== today;
                    h += `<button class="btn btn-water wide" data-act="share-drop" type="button">💧 오늘 물방울 보내기${need ? '<span class="badge-dot"></span>' : ''}</button>`;
                    h += `<button class="btn btn-ghost wide" data-act="gift-to" data-id="${esc(S.couple.id)}" data-name="${esc(S.couple.name)}" type="button">🎁 ${esc(S.couple.name)}에게 장식 보내기</button>`;
                }
            }
            if (S.mode === 'forest' && S.forest) {
                const need = S.forest.sentNews !== today;
                h += `<button class="btn btn-water wide" data-act="share-news" type="button">🌲 단톡방에 트리 소식 올리기${need ? '<span class="badge-dot"></span>' : ''}</button>`;
                h += '<button class="btn btn-ghost" data-act="share-forest" type="button">🔗 숲 초대 링크</button>';
            }
            h += '<button class="btn btn-ghost" data-act="share-invite" type="button">🎁 장식 받기 링크</button>';
            h += '<button class="btn btn-ghost" data-act="share-view" type="button">👀 구경시키기</button>';
            h += '</div><p class="hint" style="margin:10px 0 0">친구가 보낸 장식의 메시지는 12월 25일에 열려요.</p></div>';
            return h;
        }

        function forestPanel() {
            if (!S.forest) return '';
            const { total, target, count } = forestTotals(S);
            const pct = Math.min(100, Math.round((total / target) * 100));
            const members = Object.entries(S.forest.members).sort((a, b) => a[1].name.localeCompare(b[1].name, 'ko'));
            const tiles = [
                `<button class="forest-tile me" type="button">${treeSvg(viewOf(S), {}, S.owner)}<b>${esc(S.owner)}</b><small>나 · 💧${S.waters.length}</small></button>`,
                ...members.map(([id, m]) => {
                    const v = unsnap(m.snap) || { stage: 0, orns: [], star: 0, lights: false, mood: 'normal' };
                    return `<button class="forest-tile" data-act="member" data-id="${esc(id)}" type="button">${treeSvg(v, {}, m.name)}<b>${esc(m.name)}</b><small>💧${Number(m.w) || 0} · ${agoText(m.at)}</small></button>`;
                })
            ].join('');
            return `<div class="panel"><h3>🌲 ${esc(S.forest.name)} <span class="count">${count}명</span></h3>
                <div class="goal"><div class="goal-bar"><i style="width:${pct}%"></i></div>
                <div class="goal-text"><span>${S.forest.goalDone ? '🌨️ 목표 달성! 숲에 눈이 내려요' : '숲 공동 목표: 모두 합쳐 물 주기'}</span><b>${Math.min(total, target)}/${target}</b></div></div>
                <div class="forest-grid">${tiles}</div>
                <p class="hint" style="margin:10px 0 0">멤버가 단톡방에 올린 소식 링크를 열면 여기 트리가 새로 바뀌어요.</p></div>`;
        }

        // ── 장식 보내기 (방문자) ──
        let giftTarget = null;
        function renderGift(target) {
            giftTarget = { ...target, type: '' };
            const nick = Store.get('nick') || (S?.owner ?? '');
            $('v-gift').innerHTML = `<div class="panel">
                <h2>🎁 ${esc(target.name)}님 트리에 장식 보내기</h2>
                <p class="hint">장식을 고르고 한마디를 남기면 링크가 만들어져요. ${esc(target.name)}님에게 보내면 트리에 달리고, 메시지는 <b>12월 25일</b>에 열려요.</p>
                <div class="gift-grid">${GIFT_TYPES.map((t) => `<button class="gift-opt" data-act="gift-pick" data-type="${t}" aria-pressed="false" type="button">${ornSvg(t, 44)}<span>${esc(BY_ID[t].name)}</span></button>`).join('')}</div>
                <label class="field" for="gift-from">보내는 사람</label>
                <input class="txt" id="gift-from" maxlength="${MAX_NAME}" value="${esc(nick)}" placeholder="내 이름" autocomplete="off">
                <label class="field" for="gift-msg">메시지 <span class="count" id="gift-count">0/${MAX_MSG}</span></label>
                <textarea class="txt" id="gift-msg" maxlength="${MAX_MSG}" placeholder="크리스마스에 열어 볼 한마디 (비워도 돼요)"></textarea>
                <p class="error" id="gift-error"></p>
                <button class="btn btn-festive btn-block" data-act="gift-make" type="button">🎁 장식 링크 만들어 보내기</button>
                <div class="btn-row" style="margin-top:10px"><button class="btn btn-ghost" data-act="home" type="button">${S ? '내 트리로' : '🌱 나도 트리 심기'}</button></div>
            </div>`;
            $('gift-msg').addEventListener('input', (e) => { $('gift-count').textContent = `${e.target.value.length}/${MAX_MSG}`; });
            show('v-gift');
        }

        // ── 구경 ──
        function renderViewSnap(p) {
            const v = unsnap(p.s);
            if (!v) { info('트리를 불러오지 못했어요', '링크가 잘렸거나 깨진 것 같아요. 다시 받아 주세요.'); return; }
            const isMe = S && S.id === p.i;
            $('v-view').innerHTML = `<div class="sky"><div class="sky-head"><div><b>${esc(p.n)}의 트리</b><div class="meta">${Number(p.y) || ''}년 · 💧 ${Number(p.w) || 0}번 · ${STAGE_NAME[v.stage]}</div></div><span class="mode-tag">👀 구경 중</span></div>
                <div class="tree-box view-box">${treeSvg(v, {}, `${p.n}의 트리`)}</div></div>
                <div class="panel" style="margin-top:12px"><p class="hint">구경 링크를 만든 순간의 모습이에요.</p><div class="btn-row">
                ${isMe ? '' : `<button class="btn btn-festive" data-act="gift-to" data-id="${esc(p.i)}" data-name="${esc(p.n)}" type="button">🎁 장식 보내기</button>`}
                <button class="btn btn-ghost" data-act="home" type="button">${S ? '내 트리로' : '🌱 나도 트리 심기'}</button></div></div>`;
            show('v-view');
        }

        // ════════════════════════════════════════════════════════════
        //  링크 받기
        // ════════════════════════════════════════════════════════════
        const str = (v, max = 40) => (typeof v === 'string' ? v.slice(0, max) : '');
        const isId = (v) => typeof v === 'string' && /^[0-9a-z]{6,12}$/.test(v);

        // 트리가 없는 브라우저(예: 카톡 안)에서 내 트리용 링크를 열었을 때
        function needTree(what) {
            info('🌲 이 브라우저에는 트리가 없어요',
                `${what}<br>트리를 키우는 브라우저(사파리·크롬 등)에서 이 링크를 다시 열어 주세요.`,
                [
                    ...(KAKAO ? [{ label: '🌐 다른 브라우저로 열기', act: 'external', primary: true }] : []),
                    { label: '🔗 링크 복사', act: 'copy-last', primary: !KAKAO },
                    { label: '🌱 여기서 새로 심기', act: 'go-plant' }
                ]);
        }

        const ROUTES = {
            // 트리 초대: 친구가 장식을 보내러 옴
            t(p) {
                if (!isId(p.i)) throw new Error('bad');
                if (S && S.id === p.i) { renderTree(); toast('내 트리 초대 링크예요. 친구에게 보내 주세요!'); return; }
                renderGift({ id: p.i, name: str(p.n, MAX_NAME) || '친구' });
            },
            // 장식 도착
            g(p) {
                if (!isId(p.i) || !GIFT_TYPES.includes(p.o) || typeof p.g !== 'string') throw new Error('bad');
                const from = str(p.f, MAX_NAME) || '익명의 산타';
                if (!S) { needTree(`<b>${esc(from)}</b>님이 <b>${esc(str(p.n, MAX_NAME))}</b>님에게 보낸 장식이에요.`); return; }
                if (S.id !== p.i) {
                    info('🎁 다른 사람 트리의 장식이에요', `이 장식은 <b>${esc(str(p.n, MAX_NAME))}</b>님 트리에 달 수 있어요. ${esc(str(p.n, MAX_NAME))}님에게 보내 주세요.`,
                        [{ label: '내 트리로', act: 'home', primary: true }]);
                    return;
                }
                if (S.gifts.includes(p.g)) { renderTree(); toast('이미 달린 장식이에요'); return; }
                S.gifts.push(p.g);
                const o = addOrn(S, p.o, 'gift', { from, gid: p.g, msg: str(p.x, 400) }, true);
                save();
                renderTree();
                Sound.sparkle();
                openOrnSheet(o.uid, `🎁 ${from}님이 장식을 보냈어요!`);
            },
            // 구경
            v(p) {
                if (!isId(p.i)) throw new Error('bad');
                renderViewSnap({ ...p, n: str(p.n, MAX_NAME) });
            },
            // 짝꿍 초대·답장
            p(p) {
                if (!isId(p.i)) throw new Error('bad');
                const partner = { id: p.i, name: str(p.n, MAX_NAME) || '짝꿍', snap: unsnap(p.s) ? p.s : '', waters: unmask(p.w, Number(p.y) || Clock.season().year), at: Number(p.at) || 0 };
                if (!S) { renderPlant({ kind: 'p', p }); return; }
                if (S.id === p.i) { renderTree(); toast('내 짝꿍 초대 링크예요. 짝꿍에게 보내 주세요!'); return; }
                if (S.mode === 'forest') { info('숲 트리는 짝을 맺을 수 없어요', '커플 트리는 나만의 트리나 커플 트리에서만 맺을 수 있어요.', [{ label: '내 트리로', act: 'home', primary: true }]); return; }
                if (S.mode === 'couple' && S.couple.id && S.couple.id !== p.i) {
                    info('이미 짝꿍이 있어요', `내 트리는 <b>${esc(S.couple.name)}</b>님과 짝이에요.`, [{ label: '내 트리로', act: 'home', primary: true }]);
                    return;
                }
                if (S.mode === 'solo') {
                    if (!confirm(`내 트리를 커플 트리로 바꾸고 ${partner.name}님과 짝을 맺을까요?`)) { renderTree(); return; }
                    S.mode = 'couple';
                    S.couple = { id: '', name: '', snap: '', waters: [], at: 0, heartDays: [], sentDrop: '', b3: false, b7: false };
                }
                const first = !S.couple.id;
                applyPartner(partner);
                save();
                renderTree();
                if (first && !p.r) askReply();
                else toast(`💗 ${partner.name}님과 짝꿍이 됐어요!`);
            },
            // 커플 물방울
            d(p) {
                if (!isId(p.i)) throw new Error('bad');
                if (!S) { needTree(`<b>${esc(str(p.n, MAX_NAME))}</b>님이 보낸 물방울이에요.`); return; }
                if (S.mode !== 'couple' || S.couple.id !== p.i) {
                    info('짝꿍의 물방울이 아니에요', '이 물방울은 다른 커플 트리용이에요.', [{ label: '내 트리로', act: 'home', primary: true }]);
                    return;
                }
                const before = S.couple.heartDays.length;
                applyPartner({ id: p.i, name: str(p.n, MAX_NAME) || S.couple.name, snap: unsnap(p.s) ? p.s : S.couple.snap, waters: unmask(p.w, S.year), at: Number(p.at) || 0 });
                save();
                renderTree();
                const gained = S.couple.heartDays.length - before;
                if (gained > 0) { Sound.sparkle(); toast(`💗 같이 물 준 날 하트 ${gained}개가 생겼어요!`); } else toast(`💧 ${S.couple.name}님 트리 소식을 받았어요`);
            },
            // 숲 초대
            f(p) {
                if (!isId(p.f)) throw new Error('bad');
                const fn = str(p.fn, 16) || '우리 숲';
                if (!S) { renderPlant({ kind: 'f', p: { ...p, fn } }); return; }
                if (S.forest?.id === p.f) { renderTree(); toast('이미 이 숲에 있어요'); return; }
                if (S.mode === 'couple') { info('커플 트리는 숲에 들어갈 수 없어요', '숲에는 나만의 트리로 합류할 수 있어요.', [{ label: '내 트리로', act: 'home', primary: true }]); return; }
                if (S.forest && !confirm(`지금 있는 '${S.forest.name}' 숲을 나와서 '${fn}' 숲으로 옮길까요?`)) { renderTree(); return; }
                if (!S.forest && !confirm(`내 트리를 '${fn}' 숲에 심을까요?`)) { renderTree(); return; }
                S.mode = 'forest';
                S.forest = { id: p.f, name: fn, members: {}, goalDone: false, sentNews: '' };
                save();
                renderTree();
                askNews();
            },
            // 숲 멤버 소식
            n(p) {
                if (!isId(p.f) || !isId(p.i)) throw new Error('bad');
                if (!S) { needTree(`<b>${esc(str(p.n, MAX_NAME))}</b>님의 숲 소식이에요.`); return; }
                if (S.id === p.i) { renderTree(); toast('내가 올린 소식이에요'); return; }
                if (S.mode !== 'forest' || S.forest?.id !== p.f) {
                    info('🌲 다른 숲의 소식이에요', `<b>${esc(str(p.fn, 16) || '이 숲')}</b>에 들어가야 볼 수 있어요. 숲 초대 링크를 받아 주세요.`, [{ label: '내 트리로', act: 'home', primary: true }]);
                    return;
                }
                const prev = S.forest.members[p.i];
                const at = Number(p.at) || 0;
                if (prev && prev.at >= at) { renderTree(); toast('이미 본 소식이에요'); return; }
                if (!prev && Object.keys(S.forest.members).length >= MAX_FOREST - 1) { renderTree(); toast(`숲은 ${MAX_FOREST}명까지예요`); return; }
                S.forest.members[p.i] = { name: str(p.n, MAX_NAME) || '멤버', snap: unsnap(p.s) ? p.s : '', w: Math.min(25, Number(p.w) || 0), at };
                const reached = checkForestGoal(S);
                save();
                renderTree();
                if (reached) { Sound.bells(); toast('🌨️ 숲 공동 목표 달성! 숲에 눈이 내려요'); } else toast(`🌲 ${S.forest.members[p.i].name}님 트리가 숲에 ${prev ? '새로 바뀌었어요' : '들어왔어요'}`);
            }
        };

        function applyPartner(partner) {
            S.couple.id = partner.id;
            S.couple.name = partner.name;
            if (partner.snap) S.couple.snap = partner.snap;
            if (!partner.at || partner.at >= S.couple.at) {
                S.couple.waters = partner.waters;
                S.couple.at = partner.at || Clock.stamp();
            }
            syncHearts(S);
        }

        function route() {
            const m = location.hash.match(/^#([tgvpdfn])=([0-9A-Za-z_-]{5,6000})$/);
            if (!m) return false;
            UI.lastLink = location.href;
            history.replaceState(null, '', location.pathname + location.search);
            try {
                ROUTES[m[1]](Codec.unpack(m[2]));
            } catch {
                info('🔗 링크가 깨졌어요', '메신저에서 링크가 잘렸을 수 있어요. 보낸 사람에게 다시 받아 주세요.');
            }
            return true;
        }

        // ════════════════════════════════════════════════════════════
        //  링크 보내기
        // ════════════════════════════════════════════════════════════
        const myView = () => ({ i: S.id, n: S.owner, s: snapOf(S), y: S.year });

        function askReply() {
            openSheet(`<div class="center"><div style="font-size:2.4rem">💑</div><h2>${esc(S.couple.name)}님과 짝꿍이 됐어요!</h2>
                <p class="hint">${esc(S.couple.name)}님 화면에도 내 트리가 보이도록 답장 링크를 보내 주세요.</p></div>
                <button class="btn btn-festive btn-block" data-act="share-pair-reply" type="button">💌 답장 링크 보내기</button>
                <button class="btn btn-ghost btn-block" data-act="sheet-close" type="button" style="margin-top:8px">나중에</button>`);
        }

        function askNews() {
            openSheet(`<div class="center"><div style="font-size:2.4rem">🌲</div><h2>'${esc(S.forest.name)}' 숲에 심었어요!</h2>
                <p class="hint">단톡방에 내 트리 소식을 올리면 다른 멤버 숲에도 내 트리가 생겨요. 멤버들이 올린 소식 링크도 열어 주세요.</p></div>
                <button class="btn btn-festive btn-block" data-act="share-news" type="button">🌲 트리 소식 올리기</button>
                <button class="btn btn-ghost btn-block" data-act="sheet-close" type="button" style="margin-top:8px">나중에</button>`);
        }

        const SHARES = {
            'share-invite': () => share(linkFor('t', { i: S.id, n: S.owner, m: S.mode }), `🎄 ${S.owner}의 어드벤트 트리에 장식을 달아 주세요! 크리스마스에 메시지가 열려요.`),
            'share-view': () => share(linkFor('v', { ...myView(), m: S.mode, w: S.waters.length }), `👀 ${S.owner}의 트리 구경하러 오세요!`),
            'share-pair': () => share(linkFor('p', { ...myView(), w: maskOf(S.waters, S.year), at: Clock.stamp(), r: 0 }), `💑 우리 커플 트리 같이 키우자! 링크를 열고 내 트리를 심어 줘`),
            'share-pair-reply': async () => {
                closeSheet();
                await share(linkFor('p', { ...myView(), w: maskOf(S.waters, S.year), at: Clock.stamp(), r: 1 }), `💗 짝꿍 트리 연결 완료! 이 링크를 열면 내 트리가 보여요`);
            },
            'share-drop': async () => {
                const r = await share(linkFor('d', { ...myView(), w: maskOf(S.waters, S.year), at: Clock.stamp() }), `💧 ${S.owner}가 오늘 트리에 물을 줬어요! 열어서 우리 트리를 확인해 줘`);
                if (r !== 'cancel') { S.couple.sentDrop = Clock.today(); save(); renderTree(); }
            },
            'share-forest': () => share(linkFor('f', { f: S.forest.id, fn: S.forest.name, h: S.owner }), `🌲 '${S.forest.name}' 숲에서 같이 트리 키워요! 링크를 열고 내 트리를 심어 주세요`),
            'share-news': async () => {
                closeSheet();
                const r = await share(linkFor('n', { f: S.forest.id, fn: S.forest.name, i: S.id, n: S.owner, s: snapOf(S), w: S.waters.length, at: Clock.stamp() }), `🌲 ${S.owner}의 트리 소식 (💧${S.waters.length}) — 열면 숲에 반영돼요`);
                if (r !== 'cancel') { S.forest.sentNews = Clock.today(); save(); renderTree(); }
            }
        };

        // ════════════════════════════════════════════════════════════
        //  장식 자세히·캡슐·크리스마스
        // ════════════════════════════════════════════════════════════
        const unlocked = () => S && (S.opened || Clock.daysUntil(S.year, 12, 25) <= 0);

        function openOrnSheet(uid, title = '') {
            const o = [...S.hung, ...S.tray].find((x) => x.uid === uid);
            if (!o) return;
            const c = BY_ID[o.type];
            let body = '';
            if (o.src === 'gift') {
                const left = Clock.daysUntil(S.year, 12, 25);
                body += `<p class="center hint">보낸 사람: <b>${esc(o.from || '익명의 산타')}</b></p>`;
                if (!o.msg) body += '<div class="lock">메시지 없이 장식만 보냈어요</div>';
                else if (unlocked()) body += `<div class="letter">${esc(Codec.reveal(o.msg, S.id))}</div>`;
                else body += `<div class="lock">🔒 메시지는 12월 25일에 열려요 (D-${left})</div>`;
            } else if (o.src === 'heart') {
                body += `<p class="center hint">${esc(S.couple?.name || '짝꿍')}님과 같이 물 준 날 생긴 장식이에요 💗</p>`;
            }
            const inTray = S.tray.some((x) => x.uid === uid);
            openSheet(`${title ? `<h2 class="center">${esc(title)}</h2>` : ''}
                <div class="center"><svg class="big-orn" viewBox="-16 -17 32 32">${c.svg}</svg><b>${esc(c.name)}</b> <span class="tier ${c.tier}">${TIER_LABEL[c.tier]}</span></div>
                ${body}
                <div class="btn-row" style="margin-top:12px">
                    ${inTray ? `<button class="btn btn-festive" data-act="pick" data-uid="${esc(uid)}" type="button">✨ 트리에 달기</button>`
                        : `<button class="btn btn-ghost" data-act="move" data-uid="${esc(uid)}" type="button">↔️ 옮기기</button><button class="btn btn-ghost" data-act="to-tray" data-uid="${esc(uid)}" type="button">🧺 바구니로</button>`}
                    <button class="btn btn-ghost" data-act="sheet-close" type="button">닫기</button>
                </div>`);
        }

        function showCapsule(type, uid) {
            const c = BY_ID[type];
            const el = $('overlay');
            el.innerHTML = '<div class="capsule"><i class="top"></i><i class="bottom"></i></div><p>오늘의 캡슐을 여는 중…</p>';
            el.hidden = false;
            const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
            setTimeout(() => {
                Sound.sparkle();
                buzz([30, 40, 30]);
                el.innerHTML = `<svg class="reveal" viewBox="-16 -17 32 32" width="140" height="140">${c.svg}</svg>
                    <h2>${esc(c.name)}</h2><span class="tier ${c.tier}">${TIER_LABEL[c.tier]}</span>
                    <p>${c.tier === 'legend' ? '전설 장식이에요! 한 판에 하나뿐이에요 🌟' : c.tier === 'rare' ? '희귀 장식이 나왔어요! ✨' : '바구니에 담겼어요.'}</p>
                    <button class="btn btn-festive" data-act="pick" data-uid="${esc(uid)}" type="button">✨ 트리에 달기</button>
                    <button class="btn btn-ghost" data-act="overlay-close" type="button">바구니에 두기</button>`;
            }, reduce ? 50 : 1500);
        }

        // 크리스마스: 썰매 → 별 점등 → 편지 넘기기 → 카드
        let letters = [];
        let letterAt = 0;
        function startXmas() {
            letters = [...S.hung, ...S.tray].filter((o) => o.src === 'gift');
            letterAt = -1;
            const el = $('overlay');
            el.innerHTML = `<svg class="sleigh" viewBox="-20 -16 40 30">${BY_ID.sleigh.svg}<path d="M-12 2c-4 0-6-3-6-3" stroke="#a0612f" stroke-width="1.6" fill="none"/></svg><h2>🎅 산타가 다녀갔어요!</h2>`;
            el.hidden = false;
            Sound.bells();
            setTimeout(() => {
                S.opened = true;
                save();
                renderTree();
                el.innerHTML = `<svg class="stage-svg" viewBox="0 0 300 400">${treeInner(viewOf(S))}</svg><h2>⭐ 꼭대기 별에 불이 켜졌어요</h2>
                    <p>${letters.length ? `받은 선물 ${letters.length}개를 열어 볼까요?` : '올해 트리가 이렇게 자랐어요!'}</p>
                    <button class="btn btn-festive" data-act="letter-next" type="button">${letters.length ? '💌 선물 열기' : '🖼️ 카드 만들기'}</button>`;
            }, matchMedia('(prefers-reduced-motion: reduce)').matches ? 300 : 2700);
        }

        function nextLetter() {
            letterAt += 1;
            const el = $('overlay');
            if (letterAt >= letters.length) {
                el.innerHTML = `<div style="font-size:3rem">🎄</div><h2>메리 크리스마스, ${esc(S.owner)}!</h2><p>올해 함께해 준 사람들과의 트리를 카드로 남겨 보세요.</p>
                    <button class="btn btn-festive" data-act="card" type="button">🖼️ 트리 카드 저장</button><button class="btn btn-ghost" data-act="overlay-close" type="button">트리 보기</button>`;
                return;
            }
            const o = letters[letterAt];
            const c = BY_ID[o.type];
            const msg = o.msg ? Codec.reveal(o.msg, S.id) : '';
            el.innerHTML = `<p>${letterAt + 1} / ${letters.length}</p>
                <svg class="reveal" viewBox="-16 -17 32 32" width="110" height="110">${c.svg}</svg>
                <h2>${esc(o.from || '익명의 산타')}님의 선물</h2>
                <div class="letter" style="max-width:420px;width:100%;color:var(--text);text-align:left">${msg ? esc(msg) : '메시지 없이 장식만 보냈어요 🎁'}</div>
                <button class="btn btn-festive" data-act="letter-next" type="button">${letterAt + 1 < letters.length ? '다음 선물 ▶' : '다 열었어요 🎄'}</button>`;
            Sound.pop();
        }

        // ════════════════════════════════════════════════════════════
        //  카드 이미지 (트리는 SVG로 그리고 글씨는 캔버스로)
        // ════════════════════════════════════════════════════════════
        function loadSvgImage(svg) {
            return new Promise((res, rej) => {
                const img = new Image();
                img.onload = () => res(img);
                img.onerror = rej;
                img.src = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
            });
        }

        async function makeCard() {
            const W = 1080;
            const H = 1350;
            const trees = [];   // [view, x, y, w, name, sub]
            let title = `${S.owner}의 ${S.year} 어드벤트 트리`;
            let sub = `💧 물 준 날 ${S.waters.length}일 · 장식 ${S.hung.length}개`;
            const gifts = [...S.hung, ...S.tray].filter((o) => o.src === 'gift');
            const friends = [...new Set(gifts.map((o) => o.from).filter(Boolean))];

            if (S.mode === 'couple' && S.couple?.id) {
                const p = unsnap(S.couple.snap) || { stage: 0, orns: [], star: 0, lights: false, mood: 'normal' };
                title = `${S.owner} 💗 ${S.couple.name}`;
                sub = `${S.year} 커플 트리 · 같이 물 준 날 ${S.couple.heartDays.length}일`;
                trees.push([viewOf(S), 40, 250, 490, S.owner], [p, 550, 250, 490, S.couple.name]);
            } else if (S.mode === 'forest' && S.forest) {
                const list = [[viewOf(S), S.owner], ...Object.values(S.forest.members).map((m) => [unsnap(m.snap) || { stage: 0, orns: [], star: 0, lights: false, mood: 'normal' }, m.name])].slice(0, MAX_FOREST);
                title = `🌲 ${S.forest.name}`;
                sub = `${S.year} 우리 숲 · ${list.length}그루 · 모두 합쳐 물 ${forestTotals(S).total}번`;
                const cols = list.length <= 4 ? 2 : list.length <= 9 ? 3 : 4;
                const rows = Math.ceil(list.length / cols);
                const cellW = Math.min(960 / cols, (880 / rows) * 0.75);
                const cellH = cellW / 0.75;
                const ox = (W - cellW * cols) / 2;
                const oy = 250 + (880 - cellH * rows) / 2;
                list.forEach(([v, name], i) => trees.push([v, ox + (i % cols) * cellW, oy + Math.floor(i / cols) * cellH, cellW, name]));
            } else {
                trees.push([viewOf(S), 190, 230, 700, '']);
            }

            const nested = trees.map(([v, x, y, w]) => `<svg x="${x}" y="${y}" width="${w}" height="${w / 0.75}" viewBox="0 0 300 400">${treeInner({ ...v, star: S.opened ? Math.max(v.star, 1) : v.star })}</svg>`).join('');
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${DEFS}
                <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1530"/><stop offset="1" stop-color="#22325a"/></linearGradient>
                <rect width="${W}" height="${H}" fill="url(#bg)"/>${nested}</svg>`;
            const img = await loadSvgImage(svg);

            const cv = document.createElement('canvas');
            cv.width = W;
            cv.height = H;
            const g = cv.getContext('2d');
            g.drawImage(img, 0, 0);
            for (let i = 0; i < 90; i++) {
                g.fillStyle = `rgba(255,255,255,${(Math.random() * 0.5 + 0.2).toFixed(2)})`;
                g.beginPath();
                g.arc(Math.random() * W, Math.random() * 230, Math.random() * 2.4 + 0.6, 0, Math.PI * 2);
                g.fill();
            }
            const font = (w, s) => `${w} ${s}px Pretendard, -apple-system, sans-serif`;
            const fit = (text, max) => {
                let t = text;
                while (g.measureText(t).width > max && t.length > 1) t = t.slice(0, -1);
                return t === text ? t : `${t}…`;
            };
            g.textAlign = 'center';
            g.fillStyle = '#f5b83d';
            g.font = font(800, 32);
            g.fillText('🎄 ADVENT TREE', W / 2, 100);
            g.fillStyle = '#ffffff';
            g.font = font(900, 64);
            g.fillText(fit(title, 980), W / 2, 178);
            g.fillStyle = '#cbd5e1';
            g.font = font(700, 34);
            g.fillText(fit(sub, 980), W / 2, 226);

            if (trees.length > 1) {
                g.font = font(800, trees.length > 6 ? 26 : 34);
                g.fillStyle = '#ffffff';
                trees.forEach(([, x, y, w, name]) => g.fillText(fit(name, w - 10), x + w / 2, y + w / 0.75 + (trees.length > 6 ? 10 : 6)));
            }
            g.fillStyle = '#e2e8f0';
            g.font = font(700, 30);
            const tail = friends.length ? `🎁 함께해 준 사람: ${friends.join(', ')}` : `${STAGE_NAME[stageOf(S.waters.length)]} · 메리 크리스마스!`;
            g.fillText(fit(tail, 980), W / 2, H - 92);
            g.fillStyle = '#94a3b8';
            g.font = font(600, 24);
            g.fillText('미니게임 천국 · 어드벤트 트리', W / 2, H - 44);
            return new Promise((res) => cv.toBlob(res, 'image/png'));
        }

        async function saveCard() {
            try {
                const blob = await makeCard();
                if (!blob) throw new Error('blob');
                await saveToGallery(blob, `advent-tree-${S.year}.png`);
            } catch {
                toast('카드를 만들지 못했어요. 다시 시도해 주세요');
            }
        }

        // ════════════════════════════════════════════════════════════
        //  백업 코드
        // ════════════════════════════════════════════════════════════
        function openBackup() {
            const code = `AT${Codec.pack(S)}`;
            openSheet(`<h2>💾 백업 코드</h2>
                <p class="hint">폰을 바꾸거나 다른 브라우저에서 이어 키울 때 쓰세요. 이 코드에는 받은 메시지도 들어 있으니 남에게 보내지 마세요.</p>
                <textarea class="txt code-box" id="backup-out" readonly>${esc(code)}</textarea>
                <button class="btn btn-primary btn-block" data-act="backup-copy" type="button" style="margin-top:8px">📋 코드 복사</button>
                <label class="field" for="backup-in">다른 곳의 코드 불러오기</label>
                <textarea class="txt code-box" id="backup-in" placeholder="AT로 시작하는 코드를 붙여 넣으세요"></textarea>
                <p class="error" id="backup-error"></p>
                <div class="btn-row"><button class="btn btn-ghost" data-act="sheet-close" type="button">닫기</button><button class="btn btn-festive" data-act="backup-import" type="button">불러오기</button></div>`);
        }

        function importBackup(raw) {
            const code = raw.replace(/\s+/g, '');
            if (!code.startsWith('AT')) throw new Error('AT로 시작하는 백업 코드가 아니에요.');
            const st = Codec.unpack(code.slice(2));
            if (st.v !== 1 || !isId(st.id) || !Array.isArray(st.waters) || !Array.isArray(st.hung) || !Array.isArray(st.tray)) throw new Error('트리 정보가 맞지 않아요.');
            return st;
        }

        // ════════════════════════════════════════════════════════════
        //  버튼 동작 (모든 클릭을 여기서 나눈다)
        // ════════════════════════════════════════════════════════════
        const ACT = {
            home() { closeSheet(); $('overlay').hidden = true; if (S) renderTree(); else renderPlant(); },
            'go-plant'() { renderPlant(); },
            'sheet-close': closeSheet,
            'overlay-close'() { $('overlay').hidden = true; renderTree(); },
            external() {
                const url = UI.lastLink || location.href;
                location.href = `kakaotalk://web/openExternal?url=${encodeURIComponent(url)}`;
            },
            async 'copy-last'() {
                if (await copyText(UI.lastLink || location.href)) toast('링크를 복사했어요. 사파리·크롬 주소창에 붙여 넣어 주세요');
            },
            plant() {
                const owner = $('owner').value.trim();
                const invite = $('v-plant').dataset.invite ? JSON.parse($('v-plant').dataset.invite) : null;
                const mode = invite?.kind === 'p' ? 'couple' : invite?.kind === 'f' ? 'forest' : (document.querySelector('input[name="mode"]:checked')?.value || 'solo');
                const err = (m) => { $('plant-error').textContent = m; };
                if (!owner) return err('이름을 적어 주세요.');
                let forestName = '';
                if (mode === 'forest' && !invite) {
                    forestName = $('forest-name').value.trim();
                    if (!forestName) return err('숲 이름을 적어 주세요.');
                }
                Store.set('nick', owner);
                S = newTree(owner, mode);
                if (mode === 'forest') {
                    S.forest = invite
                        ? { id: invite.p.f, name: invite.p.fn, members: {}, goalDone: false, sentNews: '' }
                        : { id: rid(10), name: forestName, members: {}, goalDone: false, sentNews: '' };
                }
                if (invite?.kind === 'p') {
                    const p = invite.p;
                    applyPartner({ id: p.i, name: str(p.n, MAX_NAME) || '짝꿍', snap: unsnap(p.s) ? p.s : '', waters: unmask(p.w, S.year), at: Number(p.at) || 0 });
                }
                save();
                Sound.pop();
                renderTree();
                if (invite?.kind === 'p') askReply();
                else if (invite?.kind === 'f') askNews();
                else toast('🌱 트리를 심었어요! 바구니의 빨간 볼을 달아 보세요');
            },
            water() {
                const today = Clock.today();
                if (S.waters.includes(today)) return;
                S.waters.push(today);
                S.waters.sort();
                const hearts = syncHearts(S);
                const reached = checkForestGoal(S);
                save();
                Sound.water();
                buzz();
                renderTree();
                if (reached) toast('🌨️ 숲 공동 목표 달성! 숲에 눈이 내려요');
                else if (hearts) toast(`💗 오늘 둘 다 물을 줬어요! 하트가 생겼어요`);
                else toast(stageOf(S.waters.length) > stageOf(S.waters.length - 1) ? `🌲 트리가 자랐어요! (${STAGE_NAME[stageOf(S.waters.length)]})` : '💧 물을 줬어요. 이제 캡슐을 열어 보세요!');
            },
            draw() {
                const today = Clock.today();
                if (!S.waters.includes(today) || S.draws[today]) return;
                const type = drawFor(S, today);
                S.draws[today] = type;
                const o = addOrn(S, type, 'self');
                save();
                renderTree();
                showCapsule(type, o.uid);
            },
            pick(el) {
                closeSheet();
                $('overlay').hidden = true;
                UI.pick = { uid: el.dataset.uid };
                renderTree();
                if (firstEmpty(S) == null) toast('빈 자리가 없어요. 달린 장식을 바구니로 옮기거나 트리를 더 키워 주세요');
            },
            move(el) {
                closeSheet();
                UI.pick = { uid: el.dataset.uid };
                renderTree();
            },
            'cancel-pick'() { UI.pick = null; renderTree(); },
            slot(el) {
                if (!UI.pick) return;
                const slot = Number(el.dataset.slot);
                const uid = UI.pick.uid;
                const ti = S.tray.findIndex((o) => o.uid === uid);
                if (ti >= 0) {
                    const [o] = S.tray.splice(ti, 1);
                    o.slot = slot;
                    S.hung.push(o);
                } else {
                    const o = S.hung.find((x) => x.uid === uid);
                    if (o) o.slot = slot;
                }
                UI.pick = null;
                save();
                Sound.pop();
                renderTree();
            },
            orn(el) { openOrnSheet(el.dataset.uid); },
            'to-tray'(el) {
                const i = S.hung.findIndex((o) => o.uid === el.dataset.uid);
                if (i >= 0) {
                    const [o] = S.hung.splice(i, 1);
                    delete o.slot;
                    S.tray.unshift(o);
                    save();
                }
                closeSheet();
                renderTree();
            },
            'gift-to'(el) { renderGift({ id: el.dataset.id, name: el.dataset.name }); },
            'gift-pick'(el) {
                giftTarget.type = el.dataset.type;
                document.querySelectorAll('.gift-opt').forEach((b) => b.setAttribute('aria-pressed', String(b === el)));
            },
            async 'gift-make'() {
                const from = $('gift-from').value.trim();
                const msg = $('gift-msg').value.trim().slice(0, MAX_MSG);
                const err = (m) => { $('gift-error').textContent = m; };
                if (!giftTarget.type) return err('장식을 하나 골라 주세요.');
                if (!from) return err('보내는 사람 이름을 적어 주세요.');
                err('');
                Store.set('nick', from);
                const url = linkFor('g', { i: giftTarget.id, n: giftTarget.name, g: rid(8), o: giftTarget.type, f: from, x: Codec.hide(msg, giftTarget.id) });
                const r = await share(url, `🎁 ${giftTarget.name}님, ${from}님이 트리 장식을 보냈어요! 링크를 열면 트리에 달려요.`);
                if (r === 'cancel') return;
                info('🎁 장식을 보냈어요!', `<b>${esc(giftTarget.name)}</b>님이 링크를 열면 트리에 달려요. 메시지는 12월 25일에 열려요.`,
                    [{ label: '🎁 하나 더 보내기', act: 'gift-again', primary: true }, { label: S ? '내 트리로' : '🌱 나도 트리 심기', act: 'home' }]);
            },
            'gift-again'() { renderGift({ id: giftTarget.id, name: giftTarget.name }); },
            member(el) {
                const m = S.forest?.members[el.dataset.id];
                if (!m) return;
                const v = unsnap(m.snap) || { stage: 0, orns: [], star: 0, lights: false, mood: 'normal' };
                openSheet(`<h2 class="center">🌲 ${esc(m.name)}의 트리</h2><div class="view-box" style="max-width:240px">${treeSvg(v, {}, m.name)}</div>
                    <p class="center hint">💧 ${Number(m.w) || 0}번 · ${agoText(m.at)}</p>
                    <div class="btn-row"><button class="btn btn-festive" data-act="gift-to" data-id="${esc(el.dataset.id)}" data-name="${esc(m.name)}" type="button">🎁 장식 보내기</button><button class="btn btn-ghost" data-act="sheet-close" type="button">닫기</button></div>`);
            },
            xmas() { startXmas(); },
            'letter-next'() { nextLetter(); },
            card() { $('overlay').hidden = true; renderTree(); saveCard(); },
            backup() { openBackup(); },
            async 'backup-copy'() { if (await copyText($('backup-out').value)) toast('백업 코드를 복사했어요'); },
            'backup-import'() {
                try {
                    const st = importBackup($('backup-in').value);
                    if (!confirm('지금 트리를 이 백업으로 바꿀까요? 지금 트리는 사라져요.')) return;
                    S = st;
                    save();
                    closeSheet();
                    renderTree();
                    toast('🌲 트리를 불러왔어요');
                } catch (e) {
                    $('backup-error').textContent = e.message === 'broken' || e.message === 'bad' ? '코드가 잘렸거나 깨졌어요.' : e.message;
                }
            },
            replant() {
                if (S && !confirm('지금 트리를 지우고 처음부터 심을까요? 받은 장식과 메시지도 사라져요. (먼저 카드나 백업 코드를 저장해 두세요)')) return;
                S = null;
                Store.clear();
                UI.pick = null;
                renderPlant();
            }
        };
        Object.keys(SHARES).forEach((k) => { ACT[k] = () => (S ? SHARES[k]() : null); });

        document.addEventListener('click', (e) => {
            const el = e.target.closest('[data-act]');
            if (!el) {
                if (e.target === $('sheet-bg')) closeSheet();
                return;
            }
            const fn = ACT[el.dataset.act];
            if (fn) { e.preventDefault(); fn(el, e); }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (!$('sheet-bg').hidden) closeSheet();
                else if (UI.pick) { UI.pick = null; renderTree(); }
            }
            // 키보드로 SVG 장식·빈 칸을 누를 수 있게
            if ((e.key === 'Enter' || e.key === ' ') && e.target.matches?.('svg [data-act]')) {
                e.preventDefault();
                e.target.dispatchEvent(new MouseEvent('click', { bubbles: true }));
            }
        });

        window.addEventListener('hashchange', route);

        // ── 시작 ──
        $('defs-host').innerHTML = DEFS;
        renderBanners();
        if (!route()) {
            if (S) renderTree();
            else renderPlant();
        }
    </script>
