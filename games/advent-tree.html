<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>어드벤트 트리 - 미니게임 천국</title>
    <meta name="description" content="12월 1일부터 25일까지 매일 물을 주고 장식을 뽑아 키우는 크리스마스 트리. 친구가 보낸 장식은 크리스마스에 열려요.">
    <link rel="stylesheet" href="../styles/pretendard.css?v=c17883c9">
    <link rel="stylesheet" href="../styles/design-system.css?v=d12c2b80">
    <link rel="stylesheet" href="../styles/game-common.css?v=2187f848">
    <script src="../scripts/game-common.js?v=efdc1560"></script>
    <style>
        :root {
            /* 이 페이지만의 겨울 밤 색 */
            --night-1: #0b1530;
            --night-2: #1b2a4a;
            --pine: #1e7d4f;
            --gold: #f5b83d;
            --berry: #c2263b;
            --berry-soft: #fdecee;
            --sky-text: #eef2ff;
            --sky-muted: #b8c2dc;
        }

        body {
            padding-top: max(1.25rem, env(safe-area-inset-top));
            padding-bottom: max(5rem, env(safe-area-inset-bottom));
        }

        @media (max-width: 768px) {
            body {
                padding-left: max(1rem, env(safe-area-inset-left));
                padding-right: max(1rem, env(safe-area-inset-right));
                padding-top: max(1rem, env(safe-area-inset-top));
            }
        }

        [hidden] {
            display: none !important;
        }

        .wrap {
            max-width: 720px;
            margin: 0 auto;
        }

        .wrap .game-header {
            margin-bottom: 1rem;
        }

        .panel {
            padding: 18px;
            margin-bottom: 12px;
            border: 1px solid var(--line);
            border-radius: var(--r-lg);
            background: var(--surface);
            box-shadow: var(--shadow-sm);
        }

        .panel h2,
        .panel h3 {
            margin: 0 0 6px;
            font-size: 1.08rem;
            font-weight: 800;
        }

        .hint {
            margin: 0 0 12px;
            font-size: .88rem;
            color: var(--text-2);
            line-height: 1.55;
        }

        .error {
            min-height: 1.2em;
            margin: 6px 0 0;
            font-size: .9rem;
            font-weight: 700;
            color: var(--bad);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 13px 16px;
            border: none;
            border-radius: var(--r-md);
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            text-decoration: none;
            line-height: 1.2;
        }

        .btn:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .btn:not(:disabled):active {
            transform: scale(.98);
        }

        .btn-primary {
            background: var(--accent);
            color: var(--on-accent);
        }

        .btn-festive {
            background: var(--berry);
            color: #fff;
        }

        .btn-water {
            background: #2563eb;
            color: #fff;
        }

        .btn-ghost {
            background: var(--surface-2);
            color: var(--text);
        }

        .btn-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-row .btn {
            flex: 1 1 140px;
        }

        .btn-block {
            width: 100%;
        }

        .text-btn {
            border: none;
            background: none;
            padding: 6px;
            color: var(--accent-ink);
            font-size: .9rem;
            font-weight: 700;
            cursor: pointer;
        }

        .badge-dot {
            display: inline-block;
            min-width: 8px;
            height: 8px;
            margin-left: 4px;
            border-radius: 50%;
            background: #f43f5e;
            vertical-align: top;
        }

        input.txt,
        textarea.txt {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            border: 1px solid var(--line-strong);
            border-radius: var(--r-md);
            background: var(--surface-2);
            color: var(--text);
        }

        textarea.txt {
            min-height: 90px;
            resize: vertical;
            line-height: 1.5;
        }

        label.field {
            display: block;
            margin: 12px 0 6px;
            font-size: .9rem;
            font-weight: 800;
        }

        .count {
            float: right;
            font-weight: 600;
            color: var(--muted);
        }

        /* ── 안내 배너 ── */
        .banner {
            padding: 12px 14px;
            margin-bottom: 12px;
            border-radius: var(--r-md);
            background: var(--warn-soft);
            color: var(--text);
            font-size: .9rem;
            line-height: 1.5;
        }

        .banner b {
            display: block;
            margin-bottom: 2px;
        }

        .banner .btn {
            margin-top: 8px;
            padding: 9px 12px;
            font-size: .9rem;
        }

        /* ── 심기 ── */
        .mode-grid {
            display: grid;
            gap: 10px;
        }

        .mode-card {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 14px;
            border: 2px solid var(--line);
            border-radius: var(--r-lg);
            background: var(--surface);
            cursor: pointer;
        }

        .mode-card:has(input:checked) {
            border-color: var(--accent);
            background: var(--accent-soft);
        }

        .mode-card input {
            margin-top: 4px;
            width: 18px;
            height: 18px;
            accent-color: var(--accent);
        }

        .mode-card b {
            display: block;
            font-size: 1.02rem;
        }

        .mode-card span {
            font-size: .88rem;
            color: var(--text-2);
            line-height: 1.45;
        }

        .invite-box {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 14px;
            margin-bottom: 12px;
            border-radius: var(--r-lg);
            background: var(--berry-soft);
        }

        .invite-box .e {
            font-size: 2rem;
        }

        .invite-box p {
            margin: 0;
            line-height: 1.5;
        }

        /* ── 밤하늘 무대 ── */
        .sky {
            position: relative;
            overflow: hidden;
            padding: 14px 12px 10px;
            border-radius: var(--r-lg);
            background:
                radial-gradient(circle at 20% 15%, rgba(255, 255, 255, .08), transparent 35%),
                linear-gradient(180deg, var(--night-1), var(--night-2));
            color: var(--sky-text);
        }

        .sky::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background-image:
                radial-gradient(1.5px 1.5px at 12% 18%, #fff, transparent),
                radial-gradient(1px 1px at 30% 8%, #fff, transparent),
                radial-gradient(1.5px 1.5px at 72% 12%, #fff, transparent),
                radial-gradient(1px 1px at 88% 30%, #fff, transparent),
                radial-gradient(1px 1px at 55% 22%, #fff, transparent),
                radial-gradient(1.5px 1.5px at 8% 42%, #fff, transparent),
                radial-gradient(1px 1px at 93% 55%, #fff, transparent);
            opacity: .7;
        }

        .sky.snowing::after {
            content: "";
            position: absolute;
            inset: -40px 0 0;
            pointer-events: none;
            background-image:
                radial-gradient(2px 2px at 10% 10%, #fff, transparent),
                radial-gradient(2.5px 2.5px at 40% 30%, #fff, transparent),
                radial-gradient(2px 2px at 70% 20%, #fff, transparent),
                radial-gradient(3px 3px at 85% 50%, #fff, transparent),
                radial-gradient(2px 2px at 25% 60%, #fff, transparent),
                radial-gradient(2.5px 2.5px at 55% 75%, #fff, transparent);
            background-size: 220px 220px;
            animation: snow 6s linear infinite;
            opacity: .85;
        }

        @keyframes snow {
            to {
                background-position: 30px 220px;
            }
        }

        .sky-head {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 4px;
        }

        .sky-head b {
            font-size: 1.05rem;
        }

        .sky-head .meta {
            margin-top: 3px;
            font-size: .85rem;
            color: var(--sky-muted);
        }

        .mode-tag {
            flex: none;
            padding: 4px 9px;
            border-radius: var(--r-pill);
            background: rgba(255, 255, 255, .12);
            font-size: .78rem;
            font-weight: 800;
        }

        .tree-box {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: center;
            gap: 6px;
        }

        .tree-box svg {
            display: block;
            width: 100%;
            max-width: 340px;
            height: auto;
            touch-action: manipulation;
        }

        .tree-box.duo>div {
            flex: 1;
            min-width: 0;
            text-align: center;
        }

        .tree-box.duo svg {
            max-width: 260px;
            margin: 0 auto;
        }

        .tree-name {
            margin-top: -4px;
            font-size: .85rem;
            font-weight: 800;
            color: var(--sky-text);
        }

        .tree-name small {
            display: block;
            font-weight: 600;
            color: var(--sky-muted);
        }

        .partner-wait {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 100%;
            min-height: 220px;
            padding: 10px;
            border: 2px dashed rgba(255, 255, 255, .22);
            border-radius: var(--r-md);
            color: var(--sky-muted);
            font-size: .88rem;
        }

        .heart-line {
            position: relative;
            z-index: 1;
            margin-top: 4px;
            text-align: center;
            font-size: .9rem;
            font-weight: 800;
        }

        .orn {
            cursor: pointer;
        }

        .slot-hint {
            fill: rgba(255, 255, 255, .14);
            stroke: #fde68a;
            stroke-width: 1.6;
            stroke-dasharray: 3 3;
            cursor: pointer;
            animation: pulse 1.1s ease-in-out infinite alternate;
        }

        @keyframes pulse {
            to {
                fill: rgba(253, 230, 138, .35);
            }
        }

        .orn.moving {
            opacity: .35;
        }

        .pick-bar {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-top: 6px;
            padding: 8px 12px;
            border-radius: var(--r-md);
            background: rgba(253, 230, 138, .16);
            font-size: .9rem;
            font-weight: 700;
        }

        .pick-bar .text-btn {
            color: #fde68a;
        }

        .xmas-call {
            position: relative;
            z-index: 1;
            margin-top: 8px;
        }

        /* ── 매일 할 일 ── */
        .daily {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 12px 0;
        }

        .daily .btn {
            min-height: 58px;
        }

        .btn.glow {
            animation: glow 1.2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            to {
                box-shadow: 0 0 0 4px rgba(194, 38, 59, .25);
            }
        }

        .tray {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 2px 6px;
            scrollbar-width: thin;
        }

        .tray-item {
            flex: none;
            width: 60px;
            padding: 6px 4px;
            border: 2px solid var(--line);
            border-radius: var(--r-md);
            background: var(--surface-2);
            cursor: pointer;
            text-align: center;
        }

        .tray-item[aria-pressed="true"] {
            border-color: var(--gold);
            background: #fff7e6;
        }

        .tray-item svg {
            width: 40px;
            height: 40px;
        }

        .tray-item span {
            display: block;
            font-size: .68rem;
            font-weight: 700;
            color: var(--text-2);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tray-empty {
            margin: 0;
            font-size: .88rem;
            color: var(--muted);
        }

        .share-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .share-grid .btn {
            padding: 12px 8px;
            font-size: .92rem;
        }

        .share-grid .wide {
            grid-column: 1 / -1;
        }

        .tools {
            display: flex;
            justify-content: center;
            gap: 4px;
            flex-wrap: wrap;
        }

        /* ── 숲 ── */
        .goal {
            margin: 6px 0 12px;
        }

        .goal-bar {
            height: 12px;
            border-radius: var(--r-pill);
            background: var(--surface-3);
            overflow: hidden;
        }

        .goal-bar i {
            display: block;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, #60a5fa, #a78bfa);
            transition: width .4s ease;
        }

        .goal-text {
            display: flex;
            justify-content: space-between;
            margin-top: 6px;
            font-size: .85rem;
            color: var(--text-2);
        }

        .forest-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
            gap: 8px;
        }

        .forest-tile {
            padding: 6px 4px 8px;
            border: none;
            border-radius: var(--r-md);
            background: linear-gradient(180deg, var(--night-1), var(--night-2));
            color: var(--sky-text);
            cursor: pointer;
            text-align: center;
        }

        .forest-tile svg {
            display: block;
            width: 100%;
            height: auto;
        }

        .forest-tile b {
            display: block;
            font-size: .82rem;
        }

        .forest-tile small {
            display: block;
            font-size: .7rem;
            color: var(--sky-muted);
        }

        .forest-tile.me {
            outline: 2px solid var(--gold);
        }

        /* ── 장식 보내기 ── */
        .gift-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .gift-opt {
            padding: 8px 4px;
            border: 2px solid var(--line);
            border-radius: var(--r-md);
            background: var(--surface-2);
            cursor: pointer;
            text-align: center;
        }

        .gift-opt[aria-pressed="true"] {
            border-color: var(--berry);
            background: var(--berry-soft);
        }

        .gift-opt svg {
            width: 44px;
            height: 44px;
        }

        .gift-opt span {
            display: block;
            font-size: .72rem;
            font-weight: 700;
            color: var(--text-2);
        }

        .view-box {
            max-width: 360px;
            margin: 0 auto;
        }

        /* ── 시트·덮개 ── */
        .backdrop {
            position: fixed;
            inset: 0;
            z-index: 10000;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            background: var(--scrim);
        }

        .sheet {
            width: 100%;
            max-width: 560px;
            max-height: 88vh;
            max-height: 88dvh;
            overflow-y: auto;
            padding: 20px 18px max(18px, env(safe-area-inset-bottom));
            border-radius: var(--r-lg) var(--r-lg) 0 0;
            background: var(--surface);
            box-shadow: var(--shadow-lg);
            animation: up .2s ease-out;
        }

        @media (min-width: 640px) {
            .backdrop {
                align-items: center;
                padding: 24px;
            }

            .sheet {
                border-radius: var(--r-lg);
            }
        }

        @keyframes up {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
        }

        .sheet h2 {
            margin: 0 0 6px;
            font-size: 1.2rem;
        }

        .sheet .big-orn {
            display: block;
            width: 96px;
            height: 96px;
            margin: 4px auto 8px;
        }

        .sheet .center {
            text-align: center;
        }

        .tier {
            display: inline-block;
            padding: 3px 9px;
            border-radius: var(--r-pill);
            background: var(--surface-2);
            font-size: .78rem;
            font-weight: 800;
            color: var(--text-2);
        }

        .tier.rare {
            background: #ede9fe;
            color: #6d28d9;
        }

        .tier.legend {
            background: #fef3c7;
            color: #92400e;
        }

        .tier.gift {
            background: var(--berry-soft);
            color: var(--berry);
        }

        .letter {
            margin: 10px 0;
            padding: 14px;
            border-radius: var(--r-md);
            background: #fffaf0;
            border: 1px solid #fde7b0;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: keep-all;
            overflow-wrap: anywhere;
        }

        .lock {
            margin: 10px 0;
            padding: 12px;
            border-radius: var(--r-md);
            background: var(--surface-2);
            text-align: center;
            font-weight: 700;
            color: var(--text-2);
        }

        .code-box {
            width: 100%;
            min-height: 110px;
            font-family: ui-monospace, Menlo, monospace;
            font-size: .78rem;
            word-break: break-all;
        }

        .overlay {
            position: fixed;
            inset: 0;
            z-index: 10001;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 24px;
            background: rgba(8, 14, 32, .94);
            color: #fff;
            text-align: center;
        }

        .overlay h2 {
            margin: 0;
            font-size: 1.5rem;
            word-break: keep-all;
        }

        .overlay p {
            margin: 0;
            color: var(--sky-muted);
            line-height: 1.55;
        }

        .overlay .btn {
            min-width: 220px;
        }

        .overlay .stage-svg {
            width: min(70vw, 300px);
            height: auto;
        }

        .capsule {
            position: relative;
            width: 120px;
            height: 120px;
        }

        .capsule i {
            position: absolute;
            left: 10px;
            right: 10px;
            height: 50px;
            border-radius: 50px 50px 0 0;
            background: linear-gradient(180deg, #f43f5e, #be123c);
        }

        .capsule i.top {
            top: 10px;
            animation: shake .5s ease-in-out 2, opentop .5s 1s ease-in forwards;
        }

        .capsule i.bottom {
            bottom: 10px;
            border-radius: 0 0 50px 50px;
            background: linear-gradient(180deg, #f8fafc, #cbd5e1);
            animation: shake .5s ease-in-out 2;
        }

        @keyframes shake {

            25% {
                transform: rotate(-8deg);
            }

            75% {
                transform: rotate(8deg);
            }
        }

        @keyframes opentop {
            to {
                transform: translateY(-60px) rotate(-25deg);
                opacity: 0;
            }
        }

        .reveal {
            animation: popin .5s cubic-bezier(.2, 1.6, .4, 1) both;
        }

        @keyframes popin {
            from {
                transform: scale(.3);
                opacity: 0;
            }
        }

        .sleigh {
            width: 180px;
            animation: fly 2.6s ease-in-out forwards;
        }

        @keyframes fly {
            from {
                transform: translate(-70vw, 30px) rotate(-6deg);
            }

            to {
                transform: translate(70vw, -40px) rotate(4deg);
            }
        }

        @media (prefers-reduced-motion: reduce) {

            .sky.snowing::after,
            .slot-hint,
            .btn.glow,
            .capsule i,
            .reveal,
            .sleigh {
                animation: none !important;
            }
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: max(24px, env(safe-area-inset-bottom));
            z-index: 10003;
            max-width: calc(100vw - 32px);
            padding: 12px 18px;
            border-radius: var(--r-pill);
            background: var(--text);
            color: var(--bg);
            font-size: .92rem;
            font-weight: 700;
            text-align: center;
            opacity: 0;
            transform: translate(-50%, 20px);
            pointer-events: none;
            transition: opacity .2s ease, transform .2s ease;
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }
    </style>
</head>

<body>
    <!-- 그라데이션은 문서에 한 번만 둔다. display:none 안의 정의를 참조하면 그려지지 않는 브라우저가 있어 크기 0으로 숨긴다 -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false" id="defs-host"></svg>

    <div class="wrap">
        <a href="../index.html" class="back-button">← 메인</a>

        <header class="game-header">
            <h1 class="game-title">🎄 어드벤트 트리</h1>
            <p class="game-description">12월 1일부터 25일까지, 매일 키우는 나만의 트리</p>
        </header>

        <div id="banners"></div>

        <section id="v-plant" hidden></section>
        <section id="v-tree" hidden></section>
        <section id="v-gift" hidden></section>
        <section id="v-view" hidden></section>
        <section id="v-info" hidden></section>
    </div>

    <div class="backdrop" id="sheet-bg" hidden>
        <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
    </div>
    <div class="overlay" id="overlay" hidden></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
        // ════════════════════════════════════════════════════════════
        //  어드벤트 트리 (#72)
        //  - 서버 없이 이 기기(localStorage)에 트리를 저장하고, 친구·짝꿍·숲 멤버와는 URL 해시 링크로만 주고받는다.
        //  - 링크는 해시(#)라서 서버로 전송되지 않는다. 받은 뒤에는 주소창에서 지운다.

                    }
                }
                return new Date();
            }

            const shift = (k, n) => { const d = parse(k); d.setDate(d.getDate() + n); return key(d); };

            function season(d = now()) {
                const y = d.getFullYear();
                const m = d.getMonth() + 1;
                const day = d.getDate();

            }

                const ks = stream(key, bytes.length);
                return toB64u(bytes.map((b, i) => b ^ ks[i]));

                if (!code) return '';

                    const ks = stream(key, bytes.length);
                    return new TextDecoder().decode(bytes.map((b, i) => b ^ ks[i]));
                } catch {
                    return '';
                }
            }
            return { pack, unpack, hide, reveal };
