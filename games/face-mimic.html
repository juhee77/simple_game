<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>네온 표정 따라하기 - 미니게임 천국</title>
<link rel="stylesheet" href="../styles/game-common.css">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0f172a;font-family:'Outfit',sans-serif;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
.back{position:absolute;top:20px;left:20px;z-index:10}
h1{font-size:1.8rem;margin:40px 0 5px;background:linear-gradient(135deg,#f472b6,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.face-card{width:90%;max-width:400px;aspect-ratio:.75;background:rgba(255,255,255,.05);border-radius:30px;border:2px solid rgba(236,72,153,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;margin:20px 0;font-size:8rem;position:relative;overflow:hidden}
.face-card .prompt{position:absolute;top:15px;font-size:1rem;color:#94a3b8;font-weight:600}
.face-card .player-tag{position:absolute;bottom:15px;padding:6px 20px;border-radius:20px;background:rgba(236,72,153,.2);color:#ec4899;font-weight:700;font-size:.9rem}
.btn{background:linear-gradient(135deg,#f472b6,#ec4899);border:none;color:#fff;padding:14px 40px;font-size:1.1rem;font-weight:700;border-radius:50px;cursor:pointer;margin:10px 0}
.expression-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:90%;max-width:400px;margin:15px 0}
.expr-btn{font-size:3rem;padding:20px;border-radius:20px;background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.1);cursor:pointer;transition:all .3s;text-align:center}
.expr-btn:hover{border-color:#ec4899;transform:scale(1.05)}
.expr-btn.selected{border-color:#ec4899;background:rgba(236,72,153,.1)}
.gallery{display:flex;flex-wrap:wrap;gap:15px;justify-content:center;margin:20px 0}
.gallery-item{text-align:center}
.gallery-item .face{font-size:4rem;width:100px;height:100px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.05);border-radius:20px}
.gallery-item .name{font-size:.85rem;color:#94a3b8;margin-top:5px}
</style>
</head>
<body>
<a href="../index.html" class="back back-button">← 메인</a>
<h1>🤪 네온 표정 따라하기</h1>
<div id="setup" style="text-align:center">
    <div class="face-card" style="font-size:5rem;margin:20px auto">🤔</div>
    <p style="color:#94a3b8;margin:15px 0">참가자 수를 입력하세요 (2~30명)</p>
    <input id="player-count" type="number" value="4" min="2" max="30" style="padding:15px;border-radius:15px;border:2px solid #ec4899;background:rgba(255,255,255,0.05);color:white;width:200px;text-align:center;font-size:1.2rem;outline:none">
    <br><button class="btn" onclick="startGame()">표정 릴레이 시작!</button>
</div>
<div id="game" style="display:none">
<div class="face-card" id="face-card">
<div class="prompt">이 표정을 따라해보세요!</div>
<span id="current-face">😄</span>
<div class="player-tag" id="player-tag">플레이어 1</div>
</div>
<p style="color:#94a3b8;text-align:center;margin:5px 0">표정을 따라한 뒤 어떤 표정인지 선택하세요!</p>
<div class="expression-grid" id="expr-grid"></div>
<button class="btn" onclick="nextTurn()">다음 사람에게 넘기기</button>
</div>
<div id="result" style="display:none;text-align:center;width:90%;max-width:500px;margin:0 auto">
<h2 style="font-size:2rem;margin:20px 0">📸 표정 갤러리</h2>
<div class="gallery" id="gallery"></div>
<button class="btn" onclick="location.reload()">다시 하기</button>
</div>
<script>
const faces=['😄','😢','😡','😱','🤔','😴','🤩','😤','🥺','😎','🤢','😜','🫣','😏','🥳'];
let totalPlayers=4,player=1,history=[],currentFace='',selectedFace='';

function startGame(){
    totalPlayers = Math.min(30, Math.max(2, +document.getElementById('player-count').value || 4));
    document.getElementById('setup').style.display = 'none';
    document.getElementById('game').style.display = 'block';
    newFace();
}
function newFace(){
currentFace=faces[Math.floor(Math.random()*faces.length)];
document.getElementById('current-face').textContent=currentFace;
document.getElementById('player-tag').textContent=`플레이어 ${player}`;
renderGrid();
}
function renderGrid(){
const shuffled=[...faces].sort(()=>Math.random()-.5).slice(0,9);
if(!shuffled.includes(currentFace)){shuffled[Math.floor(Math.random()*9)]=currentFace}
document.getElementById('expr-grid').innerHTML=shuffled.map(f=>
`<div class="expr-btn ${f===selectedFace?'selected':''}" onclick="selectFace('${f}')">${f}</div>`
).join('');
}
function selectFace(f){selectedFace=f;renderGrid()}
function nextTurn(){
history.push({player,target:currentFace,chosen:selectedFace||'❓'});
player++;selectedFace='';
    if(player>totalPlayers){showResult();return}
newFace();
}
function showResult(){
document.getElementById('game').style.display='none';
document.getElementById('result').style.display='block';
document.getElementById('gallery').innerHTML=history.map(h=>
`<div class="gallery-item"><div class="face">${h.target}</div><div class="name">P${h.player}: ${h.chosen}${h.target===h.chosen?' ✅':' ❌'}</div></div>`
).join('');
}
newFace();
</script>
    <script src="../scripts/game-common.js"></script>
</body>
</html>
