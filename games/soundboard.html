<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이벤트 사운드보드 | 미니게임 천국</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root {
      --bg: #0b0b1a;
      --card-bg: rgba(22, 22, 45, 0.7);
      --card-border: rgba(255, 255, 255, 0.1);
      --cyan: #00d4ff;
      --purple: #7c3aed;
      --pink: #ff006e;
      --yellow: #ffd166;
      --green: #06d6a0;
      --text-main: #ffffff;
      --text-dim: #94a3b8;
      --radius-card: 16px;
      --radius-btn: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Outfit', 'Pretendard', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 10px 0;
    }

    .back-btn {
      position: absolute;
      left: 0;
      background: none;
      border: none;
      color: var(--cyan);
      font-size: 24px;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      transition: background 0.2s;
    }

    .back-btn:hover { background: rgba(0, 212, 255, 0.1); }

    h1 {
      font-size: 24px;
      font-weight: 800;
      background: linear-gradient(90deg, var(--cyan), var(--purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(10px);
      border-radius: var(--radius-card);
      padding: 20px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--cyan);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sound-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .sound-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-btn);
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
      color: white;
      user-select: none;
    }

    .sound-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-2px);
    }

    .sound-btn:active, .sound-btn.playing {
      transform: scale(0.95);
      border-color: var(--cyan);
      box-shadow: 0 0 15px rgba(0, 212, 255, 0.4);
    }

    .sound-btn.btn-correct { border-color: rgba(6, 214, 160, 0.4); }
    .sound-btn.btn-wrong { border-color: rgba(255, 0, 110, 0.4); }
    .sound-btn.btn-drum { border-color: rgba(255, 209, 102, 0.4); }
    .sound-btn.btn-cheer { border-color: rgba(124, 58, 237, 0.4); }

    .btn-icon { font-size: 28px; }
    .btn-label { font-size: 15px; font-weight: 700; }
    .btn-desc { font-size: 11px; color: var(--text-dim); }

    .stop-all-btn {
      width: 100%;
      padding: 14px;
      margin-top: 16px;
      background: rgba(255, 0, 110, 0.2);
      border: 1px solid var(--pink);
      color: var(--pink);
      border-radius: var(--radius-btn);
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .stop-all-btn:hover { background: rgba(255, 0, 110, 0.3); }

    .help-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      cursor: pointer;
      border: 1px solid var(--card-border);
      z-index: 100;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-content {
      background: var(--bg);
      border: 1px solid var(--card-border);
      padding: 24px;
      border-radius: var(--radius-card);
      max-width: 400px;
      width: 100%;
    }

    .modal h2 { margin-bottom: 16px; color: var(--cyan); }
    .modal p { margin-bottom: 12px; line-height: 1.5; color: var(--text-dim); }
    .close-modal { margin-top: 16px; width: 100%; padding: 12px; background: var(--purple); border: none; border-radius: 8px; color: white; cursor: pointer; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <a href="../index.html" class="back-btn">←</a>
      <h1>이벤트 사운드보드</h1>
    </header>

    <div class="card">
      <div class="section-title">🔊 사회자 필수 효과음</div>
      <div class="sound-grid">
        <button class="sound-btn btn-drum" onclick="playDrumroll()">
          <span class="btn-icon">🥁</span>
          <span class="btn-label">두둥탁!</span>
          <span class="btn-desc">긴장감 넘치는 드럼롤</span>
        </button>

        <button class="sound-btn btn-correct" onclick="playCorrect()">
          <span class="btn-icon">🔔</span>
          <span class="btn-label">딩동댕~</span>
          <span class="btn-desc">정답 발표</span>
        </button>

        <button class="sound-btn btn-wrong" onclick="playWrong()">
          <span class="btn-icon">❌</span>
          <span class="btn-label">땡!</span>
          <span class="btn-desc">오답 / 감점</span>
        </button>

        <button class="sound-btn btn-cheer" onclick="playApplause()">
          <span class="btn-icon">👏</span>
          <span class="btn-label">박수 갈채</span>
          <span class="btn-desc">우승 및 환호</span>
        </button>

        <button class="sound-btn" onclick="playTension()">
          <span class="btn-icon">💣</span>
          <span class="btn-label">시한폭탄</span>
          <span class="btn-desc">초읽기 긴장감</span>
        </button>

        <button class="sound-btn" onclick="playFail()">
          <span class="btn-icon">🎺</span>
          <span class="btn-label">슬픈 트롬본</span>
          <span class="btn-desc">실패 / 아쉬움</span>
        </button>

        <button class="sound-btn" onclick="playFanfare()">
          <span class="btn-icon">🎺</span>
          <span class="btn-label">승리 뱃소리</span>
          <span class="btn-desc">시상식 브금</span>
        </button>

        <button class="sound-btn" onclick="playWhistle()">
          <span class="btn-icon">😙</span>
          <span class="btn-label">휘파람 환호</span>
          <span class="btn-desc">흥분과 야유</span>
        </button>
      </div>

      <button class="stop-all-btn" onclick="stopAllSounds()">⏹️ 모든 소리 즉시 정지</button>
    </div>
  </div>

  <div class="help-btn" id="helpBtn">?</div>

  <div class="modal" id="helpModal">
    <div class="modal-content">
      <h2>이용 방법</h2>
      <p>파티, 게임 진행, 회식, 레크리에이션 진행 시 상황에 맞는 효과음 버튼을 누르면 즉시 고품질 사운드가 재생됩니다.</p>
      <p>별도의 음원 파일 다운로드 없이 브라우저 Web Audio API로 작동합니다.</p>
      <button class="close-modal" id="closeHelpBtn">닫기</button>
    </div>
  </div>

  <script>
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    let activeNodes = [];

    function getAudioCtx() {
      if (!audioCtx) audioCtx = new AudioContext();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function stopAllSounds() {
      activeNodes.forEach(node => {
        try { node.stop(); } catch(e) {}
        try { node.disconnect(); } catch(e) {}
      });
      activeNodes = [];
    }

    function playDrumroll() {
      stopAllSounds();
      const ctx = getAudioCtx();
      const now = ctx.currentTime;

      // Snare roll noise
      const bufferSize = ctx.sampleRate * 2.0;
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }

      const noise = ctx.createBufferSource();
      noise.buffer = buffer;

      const filter = ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(1000, now);

      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.01, now);
      gain.gain.exponentialRampToValueAtTime(0.3, now + 1.8);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 2.0);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);

      noise.start(now);
      noise.stop(now + 2.0);
      activeNodes.push(noise);

      // Cymbal Crash at end
      setTimeout(() => playCrash(), 1800);
    }

    function playCrash() {
      const ctx = getAudioCtx();
      const now = ctx.currentTime;
      const bufferSize = ctx.sampleRate * 1.5;
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }
      const crash = ctx.createBufferSource();
      crash.buffer = buffer;

      const filter = ctx.createBiquadFilter();
      filter.type = 'highpass';
      filter.frequency.setValueAtTime(3000, now);

      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.5, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 1.5);

      crash.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);

      crash.start(now);
      crash.stop(now + 1.5);
      activeNodes.push(crash);
    }

    function playCorrect() {
      stopAllSounds();
      const ctx = getAudioCtx();
      const now = ctx.currentTime;

      [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now + i * 0.1);
        gain.gain.setValueAtTime(0, now + i * 0.1);
        gain.gain.linearRampToValueAtTime(0.3, now + i * 0.1 + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.5);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now + i * 0.1);
        osc.stop(now + i * 0.1 + 0.5);
        activeNodes.push(osc);
      });
    }

    function playWrong() {
      stopAllSounds();
      const ctx = getAudioCtx();
      const now = ctx.currentTime;

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(150, now);
      osc.frequency.setValueAtTime(120, now + 0.2);

      gain.gain.setValueAtTime(0.4, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.5);
      activeNodes.push(osc);
    }

    function playApplause() {
      stopAllSounds();
      const ctx = getAudioCtx();
      const now = ctx.currentTime;

      for (let i = 0; i < 40; i++) {
        const delay = Math.random() * 2.0;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300 + Math.random() * 600, now + delay);
        gain.gain.setValueAtTime(0.1, now + delay);
        gain.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.1);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now + delay);
        osc.stop(now + delay + 0.1);
        activeNodes.push(osc);
      }
    }

    function playTension() {
      stopAllSounds();
      const ctx = getAudioCtx();
      let now = ctx.currentTime;

      for (let i = 0; i < 10; i++) {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(800 + i * 30, now + i * 0.2);
        gain.gain.setValueAtTime(0.2, now + i * 0.2);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.2 + 0.1);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now + i * 0.2);
        osc.stop(now + i * 0.2 + 0.1);
        activeNodes.push(osc);
      }
    }

    function playFail() {
      stopAllSounds();
      const ctx = getAudioCtx();
      const now = ctx.currentTime;
      const freqs = [300, 280, 260, 200];

      freqs.forEach((f, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(f, now + i * 0.3);
        if (i === 3) {
          osc.frequency.linearRampToValueAtTime(140, now + i * 0.3 + 0.8);
        }
        gain.gain.setValueAtTime(0.3, now + i * 0.3);
        gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.3 + (i === 3 ? 0.9 : 0.28));

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now + i * 0.3);
        osc.stop(now + i * 0.3 + (i === 3 ? 0.9 : 0.28));
        activeNodes.push(osc);
      });
    }

    function playFanfare() {
      stopAllSounds();
      const ctx = getAudioCtx();
      const now = ctx.currentTime;
      const notes = [
        {f: 523.25, t: 0}, {f: 523.25, t: 0.15}, {f: 523.25, t: 0.3}, {f: 659.25, t: 0.45}, {f: 783.99, t: 0.75}
      ];

      notes.forEach(n => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(n.f, now + n.t);
        gain.gain.setValueAtTime(0.3, now + n.t);
        gain.gain.exponentialRampToValueAtTime(0.001, now + n.t + (n.t === 0.75 ? 0.8 : 0.14));

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now + n.t);
        osc.stop(now + n.t + (n.t === 0.75 ? 0.8 : 0.14));
        activeNodes.push(osc);
      });
    }

    function playWhistle() {
      stopAllSounds();
      const ctx = getAudioCtx();
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(1200, now);
      osc.frequency.linearRampToValueAtTime(2400, now + 0.2);
      osc.frequency.linearRampToValueAtTime(1800, now + 0.4);

      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.45);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.45);
      activeNodes.push(osc);
    }

    const helpBtn = document.getElementById('helpBtn');
    const helpModal = document.getElementById('helpModal');
    const closeHelpBtn = document.getElementById('closeHelpBtn');
    helpBtn.addEventListener('click', () => helpModal.style.display = 'flex');
    closeHelpBtn.addEventListener('click', () => helpModal.style.display = 'none');
  </script>
</body>
</html>
