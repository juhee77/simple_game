name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
    # 서버 코드만 바뀐 커밋은 사이트를 다시 올리지 않는다 (서버는 server.yml이 맡는다)
    paths-ignore: [ 'server/**', '.github/workflows/server.yml' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      # 서버 코드는 공개 사이트에 올리지 않는다
      - name: Stage site
        run: rsync -a --exclude '.git' --exclude '.github' --exclude '/server' ./ _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
