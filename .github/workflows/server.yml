name: Room Server

on:
  push:
    branches: [ main ]
    paths: [ 'server/**', '.github/workflows/server.yml' ]
  pull_request:
    paths: [ 'server/**', '.github/workflows/server.yml' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Testcontainers가 러너의 Docker로 Postgres를 띄운다
      - name: Test
        run: ./gradlew test

  image:
    # main에 들어온 것만 이미지로 올린다
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/simple_game-room-server:latest
            ghcr.io/${{ github.repository_owner }}/simple_game-room-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
