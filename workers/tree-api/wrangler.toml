# 어드벤트 트리 API (Cloudflare Workers + D1)
# 배포 전에 `npx wrangler d1 create advent-tree`로 DB를 만들고, 나온 database_id를 아래에 넣는다.
name = "advent-tree-api"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
# 브라우저 호출을 받을 사이트. 실제 서버는 공개 사이트만 받는다.
# 로컬 개발·테스트는 package.json의 dev 스크립트와 테스트가 `--var ALLOWED_ORIGINS:...`로 localhost를 더한다.
ALLOWED_ORIGINS = "https://juhee77.github.io"
# ALLOW_DEV(테스트용 날짜·IP 바꾸기)는 여기에 두지 않는다. 로컬에서만 `--var ALLOW_DEV:1`로 켠다.

[[d1_databases]]
binding = "DB"
database_name = "advent-tree"
database_id = "5a5e6d70-f4aa-467e-9b7a-67bd4d3a3bf9"
migrations_dir = "migrations"

# 매일 한국 시간 새벽 4시(UTC 19시)에 지난 시즌 데이터 정리
[triggers]
crons = ["0 19 * * *"]

[observability]
enabled = true
