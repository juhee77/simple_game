<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRIME SCENE</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700;900&family=Noto+Sans+KR:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0e0b07;--surface:#17120c;--card:#1e1810;--border:#2e2418;
  --gold:#c9a84c;--gold2:#e6c97a;--rust:#8b3012;--rust2:#c44820;
  --paper:#f2ece0;--ink:#1a130a;--muted:#7a6a58;
  --text:#c8bca8;--text2:#8a7a68;--blue:#1e3d5c;
}
html{scroll-behavior:smooth;}
body{background:var(--bg);font-family:'Noto Sans KR',sans-serif;color:var(--text);min-height:100vh;overflow-x:hidden;}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}

/* VIEWS */
.view{display:none;}
.view.active{display:block;animation:fadeUp .3s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

/* ── TOP BAR ── */
.top-bar{
  display:flex;align-items:center;gap:12px;
  padding:14px 20px;background:var(--surface);
  border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:100;
}
.back-btn{
  background:none;border:1px solid var(--border);color:var(--text2);
  padding:6px 14px;border-radius:4px;font-size:.75rem;cursor:pointer;
  transition:all .2s;display:flex;align-items:center;gap:6px;
  font-family:'Noto Sans KR',sans-serif;
}
.back-btn:hover{border-color:var(--gold);color:var(--gold);}
.top-bar-title{font-family:'Noto Serif KR',serif;font-size:.9rem;font-weight:700;color:var(--paper);}

/* ══════════════════════════════════
   LOBBY
══════════════════════════════════ */
.lobby-hero{
  padding:72px 32px 52px;text-align:center;
  border-bottom:1px solid var(--border);position:relative;overflow:hidden;
}
.lobby-hero::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 0%,rgba(201,168,76,.07) 0%,transparent 65%);
  pointer-events:none;
}
.hero-eyebrow{font-size:.6rem;letter-spacing:.35em;color:var(--rust2);text-transform:uppercase;font-weight:700;margin-bottom:14px;}
.hero-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(3.5rem,10vw,7rem);color:var(--gold);letter-spacing:.1em;line-height:1;margin-bottom:6px;text-shadow:0 0 80px rgba(201,168,76,.15);}
.hero-sub{font-family:'Playfair Display',serif;font-style:italic;font-size:.95rem;color:var(--text2);}

.filter-bar{display:flex;align-items:center;gap:8px;padding:18px 32px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;flex-wrap:wrap;}
.filter-bar::-webkit-scrollbar{display:none;}
.filter-btn{background:none;border:1px solid var(--border);color:var(--text2);padding:5px 14px;border-radius:20px;font-family:'Noto Sans KR',sans-serif;font-size:.72rem;cursor:pointer;transition:all .2s;white-space:nowrap;}
.filter-btn:hover,.filter-btn.active{background:var(--gold);border-color:var(--gold);color:var(--ink);font-weight:700;}
.filter-count{margin-left:auto;font-size:.68rem;color:var(--text2);white-space:nowrap;}

.scenario-list{max-width:860px;margin:0 auto;padding:24px 20px 80px;display:flex;flex-direction:column;gap:0;}
.scenario-item{
  display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:0 18px;
  padding:18px 20px;background:transparent;border:none;
  border-bottom:1px solid var(--border);cursor:pointer;text-align:left;
  transition:background .2s;width:100%;
}
.scenario-item:first-child{border-top:1px solid var(--border);}
.scenario-item:hover:not(.locked){background:var(--surface);}
.scenario-item.locked{opacity:.45;cursor:default;}
.s-num{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;color:var(--border);line-height:1;}
.scenario-item:hover:not(.locked) .s-num{color:var(--gold);}
.s-tag{font-size:.6rem;letter-spacing:.15em;color:var(--rust2);font-weight:700;text-transform:uppercase;margin-bottom:3px;}
.s-title{font-family:'Noto Serif KR',serif;font-size:1rem;font-weight:700;color:var(--paper);margin-bottom:3px;line-height:1.4;}
.scenario-item:hover:not(.locked) .s-title{color:var(--gold2);}
.s-desc{font-size:.76rem;color:var(--text2);line-height:1.6;}
.s-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
.s-badge{font-size:.58rem;letter-spacing:.1em;padding:2px 10px;border-radius:20px;font-weight:700;white-space:nowrap;}
.s-badge.done{background:rgba(201,168,76,.12);color:var(--gold);border:1px solid rgba(201,168,76,.25);}
.s-badge.wip{background:rgba(40,80,40,.2);color:#7acf7a;border:1px solid rgba(122,207,122,.2);}
.s-badge.lock{background:rgba(60,50,40,.15);color:var(--text2);border:1px solid var(--border);}
.s-players{font-size:.63rem;color:var(--text2);}
.s-arrow{color:var(--gold);font-size:.85rem;transition:transform .2s;}
.scenario-item:hover:not(.locked) .s-arrow{transform:translateX(4px);}

/* ══════════════════════════════════
   SCENARIO DETAIL
══════════════════════════════════ */
.s-hero{padding:40px 28px 32px;max-width:820px;margin:0 auto;border-bottom:1px solid var(--border);}
.s-hero-tag{font-size:.6rem;letter-spacing:.22em;color:var(--rust2);font-weight:700;text-transform:uppercase;margin-bottom:10px;}
.s-hero-title{font-family:'Playfair Display',serif;font-size:clamp(1.7rem,5vw,2.6rem);color:var(--gold2);line-height:1.2;margin-bottom:14px;}
.s-hero-overview{font-size:.86rem;line-height:1.95;color:var(--text);max-width:620px;white-space:pre-line;}
.s-hero-meta{display:flex;flex-wrap:wrap;gap:20px;margin-top:22px;padding-top:22px;border-top:1px solid var(--border);}
.meta-item{display:flex;flex-direction:column;gap:3px;}
.meta-label{font-size:.58rem;letter-spacing:.18em;color:var(--text2);text-transform:uppercase;}
.meta-value{font-size:.82rem;color:var(--paper);font-weight:500;}

/* GAME START BTN */
.game-start-wrap{max-width:820px;margin:0 auto;padding:24px 28px;border-bottom:1px solid var(--border);}
.game-start-btn{
  display:flex;align-items:center;gap:10px;
  background:rgba(139,48,18,.15);border:1px solid rgba(196,72,32,.3);
  color:var(--rust2);padding:12px 22px;border-radius:6px;
  font-size:.82rem;font-weight:700;cursor:pointer;
  font-family:'Noto Sans KR',sans-serif;transition:all .2s;
  letter-spacing:.05em;
}
.game-start-btn:hover{background:rgba(196,72,32,.2);border-color:var(--rust2);}
.game-start-btn.started{background:rgba(42,92,42,.2);border-color:rgba(122,207,122,.3);color:#7acf7a;cursor:default;}
.game-timer-display{font-size:.78rem;color:var(--text2);margin-top:8px;}

/* ROLE SELECT */
.role-select-section{max-width:820px;margin:0 auto;padding:32px 28px 80px;}
.section-eyebrow{font-size:.6rem;letter-spacing:.22em;color:var(--gold);text-transform:uppercase;font-weight:700;margin-bottom:18px;display:flex;align-items:center;gap:10px;}
.section-eyebrow::after{content:'';flex:1;height:1px;background:var(--border);}
.role-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;}
.role-btn{
  background:var(--card);border:1px solid var(--border);border-radius:6px;
  padding:20px 18px;cursor:pointer;text-align:left;
  transition:all .22s;display:flex;flex-direction:column;gap:8px;
  position:relative;overflow:hidden;
}
.role-btn:hover{transform:translateY(-3px);border-color:rgba(201,168,76,.4);box-shadow:0 10px 28px rgba(0,0,0,.4);}
.rb-icon{font-size:1.8rem;line-height:1;}
.rb-type{font-size:.58rem;letter-spacing:.15em;font-weight:700;text-transform:uppercase;color:#5a9fd4;}
.role-btn[data-gm="true"] .rb-type{color:var(--rust2);}
.rb-name{font-family:'Noto Serif KR',serif;font-size:1rem;font-weight:700;color:var(--paper);line-height:1.3;}
.rb-job{font-size:.72rem;color:var(--text2);line-height:1.5;}
.rb-arrow{align-self:flex-end;font-size:.78rem;color:var(--border);transition:all .2s;margin-top:auto;}
.role-btn:hover .rb-arrow{color:var(--gold);transform:translateX(4px);}

/* ══════════════════════════════════
   ROLE VIEW
══════════════════════════════════ */
#role-view{background:var(--bg);}
.rv-wrap{max-width:720px;margin:0 auto;padding:0 20px 80px;}

/* STICKY TIMER */
.rv-timer-bar{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:10px 20px;display:flex;align-items:center;gap:16px;
  position:sticky;top:57px;z-index:80;
}
.timer-display{
  font-family:'Bebas Neue',sans-serif;font-size:1.8rem;
  color:var(--gold);letter-spacing:.1em;line-height:1;
}
.timer-label{font-size:.65rem;color:var(--text2);letter-spacing:.1em;}
.timer-phase{
  margin-left:auto;font-size:.72rem;color:var(--text2);
  background:rgba(255,255,255,.04);padding:4px 12px;border-radius:20px;
  border:1px solid var(--border);
}
.timer-not-started{
  font-size:.75rem;color:var(--rust2);
  display:flex;align-items:center;gap:8px;
}

/* ROLE HEADER */
.rv-hero{
  padding:32px 0 24px;border-bottom:1px solid var(--border);margin-bottom:28px;
  display:flex;align-items:flex-start;gap:20px;
}
.rv-emoji{font-size:3.2rem;line-height:1;flex-shrink:0;}
.rv-name{font-family:'Playfair Display',serif;font-size:clamp(1.5rem,4vw,2rem);color:var(--gold2);line-height:1.2;margin-bottom:4px;}
.rv-age{font-size:.85rem;color:var(--text2);margin-left:6px;font-family:'Noto Sans KR',sans-serif;}
.rv-job{font-size:.82rem;color:var(--text2);margin-top:4px;}
.rv-status{display:inline-block;font-size:.6rem;letter-spacing:.15em;font-weight:700;padding:3px 12px;border-radius:20px;margin-bottom:10px;text-transform:uppercase;}

/* BLOCK */
.rv-block{margin-bottom:28px;}
.rv-block-title{
  font-size:.6rem;letter-spacing:.22em;color:var(--gold);text-transform:uppercase;font-weight:700;
  margin-bottom:14px;display:flex;align-items:center;gap:10px;
}
.rv-block-title::after{content:'';flex:1;height:1px;background:var(--border);}

/* INTRO */
.rv-intro{font-size:.88rem;line-height:2;color:var(--text);font-style:italic;border-left:2px solid var(--gold);padding-left:14px;opacity:.85;}

/* ── TIMELINE FIX ── */
.rv-tl{display:flex;flex-direction:column;}
.rv-tl-row{display:flex;gap:0;min-height:48px;}
.rv-tl-left{
  display:flex;flex-direction:column;align-items:center;
  width:64px;flex-shrink:0;
}
.rv-tl-time{
  font-size:.68rem;font-weight:700;color:var(--rust2);
  letter-spacing:.04em;text-align:center;padding-top:2px;
  width:64px;flex-shrink:0;
}
.rv-tl-spine{
  display:flex;flex-direction:column;align-items:center;
  width:20px;flex-shrink:0;padding-top:2px;
}
.rv-tl-dot{
  width:9px;height:9px;border-radius:50%;flex-shrink:0;
  background:var(--border);border:2px solid var(--bg);z-index:1;
}
.rv-tl-row.secret .rv-tl-dot{background:var(--rust2);}
.rv-tl-line{width:2px;flex:1;background:var(--border);opacity:.4;margin-top:2px;}
.rv-tl-row:last-child .rv-tl-line{display:none;}
.rv-tl-text{
  font-size:.82rem;color:var(--text);line-height:1.65;
  padding:2px 0 16px 8px;flex:1;
}
.rv-tl-secret-mark{
  font-size:.6rem;color:var(--rust2);font-weight:700;
  background:rgba(139,48,18,.15);border:1px solid rgba(196,72,32,.2);
  padding:1px 6px;border-radius:3px;display:inline-block;margin-left:6px;vertical-align:middle;
}

/* SECRETS */
.rv-secrets{display:flex;flex-direction:column;gap:10px;}
.rv-secret{border-radius:6px;padding:14px;display:flex;gap:10px;font-size:.83rem;line-height:1.75;align-items:flex-start;}
.rv-secret.critical{background:rgba(139,48,18,.1);border:1px solid rgba(139,48,18,.25);}
.rv-secret.normal{background:rgba(139,48,18,.06);border:1px solid rgba(139,48,18,.14);}
.rv-secret.info{background:rgba(201,168,76,.05);border:1px solid rgba(201,168,76,.15);}
.rv-secret-star{font-size:.95rem;flex-shrink:0;line-height:1.7;}
.rv-secret.critical .rv-secret-star,.rv-secret.normal .rv-secret-star{color:var(--rust2);}
.rv-secret.info .rv-secret-star{color:var(--gold);}
.rv-secret strong{color:var(--paper);}

/* DIALOGUES */
.rv-dialogues{display:flex;flex-direction:column;gap:8px;}
.rv-dialogue{background:var(--surface);border-left:3px solid var(--gold);padding:12px 16px;border-radius:0 6px 6px 0;font-size:.83rem;line-height:1.75;color:var(--text);font-style:italic;}
.rv-dialogue.cond{border-left-color:#3a6090;}
.rv-cond-tag{display:inline-block;background:#1a3050;color:#6a9fd0;font-size:.58rem;padding:2px 8px;border-radius:3px;font-style:normal;font-weight:700;letter-spacing:.05em;margin-right:6px;margin-bottom:3px;vertical-align:middle;}

/* RELATIONS */
.rv-rel-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.rv-rel{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:12px;}
.rv-rel-name{font-weight:700;color:var(--paper);display:block;margin-bottom:4px;font-size:.8rem;}
.rv-rel-body{font-size:.78rem;color:var(--text);line-height:1.65;}

/* OTHER CHARACTERS */
.other-char-grid{display:flex;flex-direction:column;gap:8px;}
.other-char{
  background:var(--surface);border:1px solid var(--border);border-radius:6px;
  padding:14px;display:grid;grid-template-columns:36px 1fr;gap:0 12px;
}
.oc-emoji{font-size:1.5rem;line-height:1;padding-top:2px;}
.oc-name{font-weight:700;color:var(--paper);font-size:.85rem;}
.oc-job{font-size:.72rem;color:var(--text2);margin-top:1px;}
.oc-why{font-size:.78rem;color:var(--text);line-height:1.65;margin-top:6px;}
.oc-alibi{font-size:.72rem;color:var(--text2);margin-top:4px;font-style:italic;}

/* ══════════════════════════════════
   CLUE CARDS
══════════════════════════════════ */
.clue-section{margin-top:8px;}
.clue-grid-wrapper{display:flex;flex-direction:column;gap:12px;}
.clue-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:8px;overflow:hidden;position:relative;
  transition:transform .2s,box-shadow .2s;
}
.clue-card.unlocked:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.5);}
.clue-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(to right,var(--rust),var(--gold));
}
.clue-card.locked::before{background:var(--border);}

.clue-inner{display:flex;gap:0;}
.clue-img-wrap{
  width:120px;flex-shrink:0;
  background:var(--surface);
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;min-height:100px;
}
.clue-img-wrap svg{width:100%;height:100%;display:block;}
.clue-locked-overlay{
  position:absolute;inset:0;
  background:rgba(14,11,7,.85);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px;
  backdrop-filter:blur(4px);
}
.lock-icon{font-size:1.6rem;opacity:.6;}
.lock-countdown{font-size:.65rem;color:var(--text2);text-align:center;letter-spacing:.05em;line-height:1.5;}

.clue-content{padding:14px 16px;flex:1;}
.clue-num-tag{
  display:inline-block;font-size:.58rem;letter-spacing:.15em;
  color:var(--rust2);border:1px solid rgba(196,72,32,.3);
  padding:1px 8px;border-radius:2px;font-weight:700;margin-bottom:6px;
}
.clue-locked .clue-num-tag{color:var(--text2);border-color:var(--border);}
.clue-name{font-family:'Noto Serif KR',serif;font-size:.9rem;font-weight:700;color:var(--paper);margin-bottom:4px;line-height:1.4;}
.clue-locked .clue-name{color:var(--text2);}
.clue-where{font-size:.7rem;color:var(--text2);margin-bottom:8px;}
.clue-meaning{font-size:.78rem;color:var(--text);line-height:1.65;}
.clue-locked .clue-meaning{color:var(--text2);filter:blur(5px);user-select:none;}
.clue-reveal-badge{
  display:inline-block;margin-top:8px;
  font-size:.6rem;letter-spacing:.1em;color:#5a9fd4;
  border:1px solid rgba(90,159,212,.25);
  padding:2px 8px;border-radius:2px;font-weight:700;
}

/* GM clue grid */
.gm-clue-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

/* Personal clue cards (player's own secrets as evidence) */
.personal-clue-card{
  background:var(--card);border:1px solid rgba(201,168,76,.25);
  border-radius:8px;overflow:hidden;position:relative;
  transition:transform .2s,box-shadow .2s;
}
.personal-clue-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.5);}
.personal-clue-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(to right,var(--gold),var(--gold2));
}
.personal-clue-card .clue-num-tag{color:var(--gold);border-color:rgba(201,168,76,.35);}
.clue-section-sep{
  display:flex;align-items:center;gap:10px;
  font-size:.6rem;letter-spacing:.18em;color:var(--text2);
  text-transform:uppercase;font-weight:700;margin:16px 0 12px;
}
.clue-section-sep::before,.clue-section-sep::after{content:'';flex:1;height:1px;background:var(--border);}
.personal-badge{
  display:inline-block;font-size:.58rem;padding:2px 8px;border-radius:3px;
  background:rgba(201,168,76,.12);color:var(--gold);
  border:1px solid rgba(201,168,76,.25);font-weight:700;margin-top:6px;
}

/* GM SPECIFIC */
.gm-phase{display:grid;grid-template-columns:40px 1fr;gap:0 14px;margin-bottom:4px;}
.gm-phase-num{width:40px;height:40px;border-radius:50%;background:var(--rust);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.82rem;font-weight:700;flex-shrink:0;margin-top:2px;}
.gm-phase-title{font-size:.9rem;font-weight:700;color:var(--paper);margin-bottom:4px;}
.gm-phase-time{display:inline-block;background:rgba(201,168,76,.12);color:var(--gold);font-size:.6rem;font-weight:700;padding:2px 10px;border-radius:20px;margin-bottom:8px;letter-spacing:.05em;border:1px solid rgba(201,168,76,.2);}
.gm-phase-desc{font-size:.8rem;color:var(--text2);line-height:1.75;padding-bottom:18px;border-bottom:1px solid var(--border);margin-bottom:18px;}
.gm-phase:last-child .gm-phase-desc{border-bottom:none;margin-bottom:0;padding-bottom:0;}
.gm-script{background:var(--surface);border-left:3px solid var(--gold);padding:14px 16px;border-radius:0 6px 6px 0;font-size:.83rem;line-height:1.9;color:var(--text);margin:8px 0;font-family:'Noto Serif KR',serif;white-space:pre-line;}
.gm-script-label{font-size:.58rem;letter-spacing:.18em;color:var(--rust2);font-weight:700;font-family:'Noto Sans KR',sans-serif;margin-bottom:6px;text-transform:uppercase;}
.gm-note{background:rgba(201,168,76,.05);border:1px dashed rgba(201,168,76,.2);border-radius:4px;padding:10px 14px;font-size:.78rem;color:var(--text2);line-height:1.7;margin:8px 0;}
.gm-note strong{color:var(--rust2);}

/* WITNESS TABLE */
.w-wrap{overflow-x:auto;}
.w-table{width:100%;border-collapse:collapse;font-size:.76rem;}
.w-table th{background:var(--surface);color:var(--gold);padding:9px 12px;text-align:left;font-size:.62rem;letter-spacing:.12em;font-weight:700;border-bottom:2px solid var(--border);}
.w-table td{padding:9px 12px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:top;line-height:1.55;}
.w-table tr:hover td{background:rgba(255,255,255,.02);}
.w-badge{display:inline-block;font-size:.58rem;padding:2px 8px;border-radius:20px;font-weight:700;letter-spacing:.05em;}
.w-badge.innocent{background:rgba(42,92,42,.3);color:#7acf7a;border:1px solid rgba(122,207,122,.2);}
.w-badge.witness{background:rgba(30,61,92,.3);color:#7ab8e0;border:1px solid rgba(90,159,212,.2);}
.w-badge.suspect{background:rgba(100,60,20,.3);color:#d4956a;border:1px solid rgba(196,120,60,.2);}
.w-badge.culprit{background:rgba(139,48,18,.4);color:#ff9a7a;border:1px solid rgba(196,72,32,.4);}

/* TRUTH */
.truth-box{background:linear-gradient(135deg,rgba(139,48,18,.08),rgba(0,0,0,.15));border:1px solid rgba(139,48,18,.35);border-radius:8px;padding:24px;position:relative;overflow:hidden;}
.truth-box::before{content:'TOP SECRET';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-20deg);font-family:'Bebas Neue',sans-serif;font-size:4.5rem;color:var(--rust);opacity:.06;letter-spacing:.3em;white-space:nowrap;pointer-events:none;}
.truth-title{color:var(--rust2);font-family:'Playfair Display',serif;font-size:.88rem;letter-spacing:.1em;margin-bottom:16px;display:flex;align-items:center;gap:10px;}
.truth-title::after{content:'';flex:1;height:1px;background:rgba(139,48,18,.3);}
.truth-body{font-size:.82rem;line-height:2;color:var(--text);white-space:pre-line;}
.truth-body strong{color:var(--gold2);}

/* FULL TIMELINE */
.full-tl{display:flex;flex-direction:column;gap:0;padding-left:0;}
.ftl-row{display:flex;gap:0;}
.ftl-left{display:flex;flex-direction:column;align-items:center;width:52px;flex-shrink:0;}
.ftl-time{font-size:.65rem;font-weight:700;color:var(--rust2);letter-spacing:.04em;padding-top:2px;text-align:center;width:52px;}
.ftl-spine{display:flex;flex-direction:column;align-items:center;width:18px;flex-shrink:0;padding-top:2px;}
.ftl-dot{width:8px;height:8px;border-radius:50%;background:var(--border);border:2px solid var(--bg);flex-shrink:0;z-index:1;}
.ftl-row.key .ftl-dot{background:var(--rust2);}
.ftl-line{width:2px;flex:1;background:var(--border);opacity:.35;margin-top:2px;}
.ftl-row:last-child .ftl-line{display:none;}
.ftl-text{font-size:.8rem;color:var(--text);line-height:1.6;padding:2px 0 14px 8px;flex:1;}

/* ── IMAGE MODAL ── */
.img-modal-backdrop{
  display:none;position:fixed;inset:0;z-index:999;
  background:rgba(0,0,0,.85);backdrop-filter:blur(6px);
  align-items:center;justify-content:center;
}
.img-modal-backdrop.open{display:flex;animation:fadeUp .2s ease;}
.img-modal-box{
  background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:20px;max-width:92vw;width:400px;position:relative;
}
.img-modal-close{
  position:absolute;top:12px;right:14px;
  background:none;border:none;color:var(--text2);font-size:1.2rem;
  cursor:pointer;transition:color .2s;line-height:1;
}
.img-modal-close:hover{color:var(--gold);}
.img-modal-svg{width:100%;border-radius:6px;overflow:hidden;margin-bottom:14px;}
.img-modal-title{font-family:'Noto Serif KR',serif;font-size:1rem;font-weight:700;color:var(--paper);margin-bottom:6px;}
.img-modal-tag{font-size:.6rem;letter-spacing:.15em;color:var(--rust2);font-weight:700;margin-bottom:8px;display:block;}
.img-modal-desc{font-size:.82rem;color:var(--text);line-height:1.75;}

/* secret hint in others */
.other-secret-hint{
  margin-top:10px;background:rgba(139,48,18,.1);
  border:1px dashed rgba(196,72,32,.3);border-radius:4px;
  padding:10px 12px;cursor:pointer;transition:background .2s;
}
.other-secret-hint:hover{background:rgba(139,48,18,.18);}
.hint-label{font-size:.58rem;letter-spacing:.15em;color:var(--rust2);font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:6px;}
.hint-name{font-size:.8rem;color:var(--paper);font-weight:600;margin-bottom:2px;}
.hint-preview{font-size:.73rem;color:var(--text2);line-height:1.55;}

/* clue card clickable */
.clue-card.unlocked{cursor:pointer;}

/* MOBILE */
@media(max-width:580px){
  .lobby-hero{padding:52px 20px 36px;}
  .filter-bar{padding:14px 16px;}
  .scenario-list{padding:16px 12px 60px;}
  .scenario-item{grid-template-columns:36px 1fr auto;gap:0 10px;padding:14px 12px;}
  .s-hero,.role-select-section,.game-start-wrap{padding-left:16px;padding-right:16px;}
  .role-grid{grid-template-columns:1fr 1fr;}
  .rv-wrap{padding:0 14px 60px;}
  .rv-rel-grid{grid-template-columns:1fr;}
  .clue-inner{flex-direction:column;}
  .clue-img-wrap{width:100%;height:120px;}
  .gm-clue-grid{grid-template-columns:1fr;}
}

<!-- ══ LOBBY ══ -->
<div id="lobby" class="view active">
  <div class="lobby-hero">
    <div class="hero-eyebrow">Interactive Mystery Game</div>
    <div class="hero-title">CRIME SCENE</div>
    <div class="hero-sub">누가, 어디서, 어떻게 — 당신이 밝혀라</div>
  </div>
  <div class="filter-bar">
    <button class="filter-btn active" onclick="filterScenarios('all',this)">전체</button>
    <button class="filter-btn" onclick="filterScenarios('done',this)">✅ 완성</button>
    <button class="filter-btn" onclick="filterScenarios('밀실',this)">🏨 밀실</button>
    <button class="filter-btn" onclick="filterScenarios('이벤트',this)">🎭 이벤트</button>
    <button class="filter-btn" onclick="filterScenarios('직장',this)">🏢 직장</button>
    <button class="filter-btn" onclick="filterScenarios('야외',this)">🌲 야외</button>
    <button class="filter-btn" onclick="filterScenarios('특수',this)">🎬 특수</button>
    <span class="filter-count" id="filter-count">20개</span>
  </div>
  <div class="scenario-list" id="scenario-list"></div>
</div>

<!-- ══ SCENARIO VIEW ══ -->
<div id="scenario-view" class="view">
  <div class="top-bar">
    <button class="back-btn" onclick="goTo('lobby')">← 목록</button>
    <span class="top-bar-title" id="sv-title"></span>
  </div>
  <div class="s-hero">
    <div class="s-hero-tag" id="sv-tag"></div>
    <div class="s-hero-title" id="sv-htitle"></div>
    <div class="s-hero-overview" id="sv-overview"></div>
    <div class="s-hero-meta" id="sv-meta"></div>
  </div>
  <div class="game-start-wrap">
    <button class="game-start-btn" id="game-start-btn" onclick="handleGameStart()">
      <span id="start-btn-icon">▶</span>
      <span id="start-btn-text">게임 시작 (GM이 누르세요)</span>
    </button>
    <div class="game-timer-display" id="game-timer-display"></div>
  </div>
  <div class="role-select-section">
    <div class="section-eyebrow">역할을 선택하세요</div>
    <div class="role-grid" id="role-grid"></div>
  </div>
</div>

<!-- ══ ROLE VIEW ══ -->
<div id="role-view" class="view">
  <div class="top-bar">
    <button class="back-btn" onclick="goTo('scenario-view')">← 역할 선택</button>
    <span class="top-bar-title" id="rv-top-title"></span>
  </div>
  <div class="rv-timer-bar" id="rv-timer-bar">
    <div>
      <div class="timer-display" id="rv-timer-display">00:00</div>
      <div class="timer-label">게임 경과 시간</div>
    </div>
    <div class="timer-phase" id="rv-timer-phase">대기 중</div>
  </div>
  <div class="rv-wrap" id="rv-content"></div>
</div>

<!-- IMAGE MODAL -->
<div class="img-modal-backdrop" id="img-modal" onclick="closeModal(event)">
  <div class="img-modal-box">
    <button class="img-modal-close" onclick="closeImgModal()">✕</button>
    <div class="img-modal-svg" id="modal-svg"></div>
    <span class="img-modal-tag" id="modal-tag"></span>
    <div class="img-modal-title" id="modal-title"></div>
    <div class="img-modal-desc" id="modal-desc"></div>
  </div>
</div>

function getTimerKey(sId){ return `cs_timer_s${sId}`; }

function getElapsed(sId){
  const v = localStorage.getItem(getTimerKey(sId));
  if(!v) return -1;
  return Math.floor((Date.now() - parseInt(v)) / 1000);
}

function startGameTimer(sId){
  if(localStorage.getItem(getTimerKey(sId))) return; // already started
  localStorage.setItem(getTimerKey(sId), Date.now().toString());
}

function resetGameTimer(sId){
  localStorage.removeItem(getTimerKey(sId));
}

function fmtTime(sec){
  if(sec < 0) return '--:--';
  const m = Math.floor(sec/60), s = sec%60;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function getPhaseLabel(sec){
  const m = Math.floor(sec/60);
  if(m < 5)  return '자기소개 단계';
  if(m < 15) return '1라운드 심문';
  if(m < 25) return '중간 투표';
  if(m < 35) return '2라운드 심문';
  if(m < 45) return '최후 변론 준비';
  return '최후 변론';
}

function startTimerLoop(){
  if(timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(()=>{
    if(!currentScenario) return;
    const el = getElapsed(currentScenario.id);
    const display = document.getElementById('rv-timer-display');
    const phase = document.getElementById('rv-timer-phase');
    if(display) display.textContent = el >= 0 ? fmtTime(el) : '--:--';
    if(phase) phase.textContent = el >= 0 ? getPhaseLabel(el) : '게임 미시작';
    // refresh clue locks
    refreshClues(currentScenario.id);
  }, 1000);
}

/* ══════════════════════════════════════
   LOBBY
══════════════════════════════════════ */
function renderLobby(){
  const list = document.getElementById('scenario-list');
  const arr = currentFilter==='all' ? SCENARIOS
    : currentFilter==='done' ? SCENARIOS.filter(s=>s.status==='done')
    : SCENARIOS.filter(s=>s.cat===currentFilter);
  document.getElementById('filter-count').textContent = arr.length+'개';
  list.innerHTML = arr.map(s=>`
    <button class="scenario-item ${s.status==='done'?'':'locked'}"
      onclick="${s.status==='done'?`openScenario(${s.id})`:''}">
      <div class="s-num">${String(s.id).padStart(2,'0')}</div>
      <div>
        <div class="s-tag">${s.catEmoji} ${s.tag||s.cat}</div>
        <div class="s-title">${s.title}</div>
        <div class="s-desc">${s.desc}</div>
      </div>
      <div class="s-right">
        <span class="s-badge ${s.status==='done'?'done':'wip'}">${s.status==='done'?'완성':'준비중'}</span>
        <span class="s-players">👤 ${s.players||'?'}인</span>
        ${s.status==='done'?'<span class="s-arrow">→</span>':''}
      </div>
    </button>`).join('');
}

function filterScenarios(cat,btn){
  currentFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderLobby();
}

/* ══════════════════════════════════════
   SCENARIO VIEW
══════════════════════════════════════ */
function openScenario(id){
  const s = SCENARIOS.find(x=>x.id===id);
  if(!s||!s.roles) return;
  currentScenario = s;

  document.getElementById('sv-title').textContent = s.title;
  document.getElementById('sv-tag').textContent = `${s.catEmoji} ${s.tag}`;
  document.getElementById('sv-htitle').textContent = s.title;
  document.getElementById('sv-overview').textContent = s.overview||s.desc;
  document.getElementById('sv-meta').innerHTML = (s.meta||[]).map(m=>`
    <div class="meta-item"><span class="meta-label">${m.label}</span><span class="meta-value">${m.value}</span></div>`).join('');

  // Game start button state
  const elapsed = getElapsed(s.id);
  const startBtn = document.getElementById('game-start-btn');
  const startIcon = document.getElementById('start-btn-icon');
  const startText = document.getElementById('start-btn-text');
  const timerDisp = document.getElementById('game-timer-display');
  if(elapsed >= 0){
    startBtn.classList.add('started');
    startIcon.textContent = '✓';
    startText.textContent = '게임 진행 중';
    timerDisp.textContent = `경과: ${fmtTime(elapsed)}`;
  } else {
    startBtn.classList.remove('started');
    startIcon.textContent = '▶';
    startText.textContent = '게임 시작 (GM이 누르세요)';
    timerDisp.textContent = '';
  }

  // Role grid — ALL shown as "참여자", no culprit reveal
  const grid = document.getElementById('role-grid');
  grid.innerHTML = s.roles.map(r=>`
    <button class="role-btn" data-gm="${r.isGM||false}" onclick="openRole('${r.id}')">
      <span class="rb-icon">${r.emoji}</span>
      <span class="rb-type">${r.isGM ? 'Game Master' : '참여자'}</span>
      <span class="rb-name">${r.name}${r.age?` <span style="font-size:.72rem;font-weight:400;color:var(--text2)">${r.age}</span>`:''}</span>
      <span class="rb-job">${r.job}</span>
      <span class="rb-arrow">→</span>
    </button>`).join('');

  goTo('scenario-view');
}

function handleGameStart(){
  if(!currentScenario) return;
  const elapsed = getElapsed(currentScenario.id);
  if(elapsed >= 0) return;
  startGameTimer(currentScenario.id);
  const startBtn = document.getElementById('game-start-btn');
  document.getElementById('start-btn-icon').textContent = '✓';
  document.getElementById('start-btn-text').textContent = '게임 진행 중';
  startBtn.classList.add('started');
  document.getElementById('game-timer-display').textContent = '경과: 00:00';
}

/* ══════════════════════════════════════
   ROLE VIEW
══════════════════════════════════════ */
function openRole(roleId){
  if(!currentScenario) return;
  const s = currentScenario;
  const r = s.roles.find(x=>x.id===roleId);
  if(!r) return;

  // Reset clue registry so indices are always fresh for this role view
  _clueReg.length = 0;

  document.getElementById('rv-top-title').textContent = r.isGM ? '📋 GM 패키지' : `${r.emoji} ${r.name}`;
  document.getElementById('rv-content').innerHTML = r.isGM ? buildGMContent(s) : buildPlayerContent(r, s);

  goTo('role-view');
  startTimerLoop();
  // initial timer display
  const el = getElapsed(s.id);
  const td = document.getElementById('rv-timer-display');
  if(td) td.textContent = el >= 0 ? fmtTime(el) : '--:--';
  const tp = document.getElementById('rv-timer-phase');
  if(tp) tp.textContent = el >= 0 ? getPhaseLabel(el) : '게임 미시작';
}

   PLAYER CONTENT BUILDER

function buildPlayerContent(r, s){
  let html = '';

  // Header
  html += `<div class="rv-hero">
    <div class="rv-emoji">${r.emoji}</div>
    <div>
      <div class="rv-status" style="background:${(r.statusColor||'rgba(92,62,42,.8)')};color:#fff;">${r.statusLabel||'참여자'}</div>
      <div class="rv-name">${r.name}<span class="rv-age">${r.age||''}</span></div>
      <div class="rv-job">${r.job}</div>
    </div>
  </div>`;

  // Intro
  html += `<div class="rv-block">
    <div class="rv-block-title">캐릭터 소개</div>
    <div class="rv-intro">${r.intro}</div>
  </div>`;

  // Timeline
  if(r.timeline){
    html += `<div class="rv-block"><div class="rv-block-title">⏱ 그날 밤 나의 타임라인</div><div class="rv-tl">`;
    r.timeline.forEach(t=>{
      html += `<div class="rv-tl-row ${t.secret?'secret':''}">
        <div class="rv-tl-time">${t.time}</div>
        <div class="rv-tl-spine">
          <div class="rv-tl-dot"></div>
          <div class="rv-tl-line"></div>
        </div>
        <div class="rv-tl-text">${t.text}${t.secret?'<span class="rv-tl-secret-mark">★ 비밀</span>':''}</div>
      </div>`;
    });
    html += `</div></div>`;
  }

  // Secrets
  if(r.secrets){
    html += `<div class="rv-block"><div class="rv-block-title">🔐 나만 아는 비밀</div><div class="rv-secrets">`;
    r.secrets.forEach(sc=>{
      html += `<div class="rv-secret ${sc.type}">
        <span class="rv-secret-star">${sc.type==='info'?'💡':'★'}</span>
        <div><strong>${sc.title}</strong><br>${sc.text.replace(/\n/g,'<br>')}</div>
      </div>`;
    });
    html += `</div></div>`;
  }

  // Dialogues
  if(r.dialogues){
    html += `<div class="rv-block"><div class="rv-block-title">🗣 심문받을 때 쓸 수 있는 대사</div><div class="rv-dialogues">`;
    r.dialogues.forEach(d=>{
      html += `<div class="rv-dialogue ${d.cond?'cond':''}">
        ${d.cond?`<span class="rv-cond-tag">${d.cond}</span>`:''}${d.text}
      </div>`;
    });
    html += `</div></div>`;
  }

  // Relations (my read on others)
  if(r.relations){
    html += `<div class="rv-block"><div class="rv-block-title">👥 다른 인물에 대한 나의 생각</div><div class="rv-rel-grid">`;
    r.relations.forEach(rel=>{
      html += `<div class="rv-rel"><span class="rv-rel-name">${rel.name}</span><span class="rv-rel-body">${rel.text}</span></div>`;
    });
    html += `</div></div>`;
  }

  // Other characters public info
  if(r.others){
    html += `<div class="rv-block"><div class="rv-block-title">📋 다른 참여자 공개 정보</div>
    <div style="font-size:.72rem;color:var(--text2);margin-bottom:10px;">모든 참여자가 알고 있는 공개 정보입니다. 🔴 표시가 있는 항목은 이 사람에게서 입수한 단서입니다.</div>
    <div class="other-char-grid">`;
    r.others.forEach(o=>{
      // Look up secretHint if present
      let hintHtml = '';
      if(o.secretHint && currentScenario){
        const hintRole = currentScenario.roles.find(x=>x.id===o.secretHint.roleId);
        if(hintRole && hintRole.personalClues){
          const hintClue = hintRole.personalClues[o.secretHint.clueIdx];
          if(hintClue){
            const rId = o.secretHint.roleId;
            const cIdx = o.secretHint.clueIdx;
            const regIdx = _regClue('나만 아는 증거 · '+hintClue.tag, hintClue.name, hintClue.desc, ()=>makePersonalSVG(rId, cIdx));
            hintHtml = `<div class="other-secret-hint" data-clue-reg="${regIdx}">
              <div class="hint-label">🔴 입수된 단서 — 클릭해서 보기</div>
              <div class="hint-name">${hintClue.name}</div>
              <div class="hint-preview">${hintClue.desc.slice(0,50)}…</div>
            </div>`;
          }
        }
      }
      html += `<div class="other-char">
        <div class="oc-emoji">${o.emoji}</div>
        <div>
          <div class="oc-name">${o.name}</div>
          <div class="oc-job">${o.job}</div>
          <div class="oc-why">방문 이유: ${o.why}</div>
          <div class="oc-alibi">주장 알리바이: ${o.alibi}</div>
          ${hintHtml}
        </div>
      </div>`;
    });
    html += `</div></div>`;
  }

  // Clues section (bottom, locked by timer)
  html += buildClueSection(s, r);

  return html;
}

/* ══════════════════════════════════════
   CLUE SECTION
══════════════════════════════════════ */
function buildClueSection(s, r){
  if(!s.clues) return '';
  const elapsed = currentScenario ? getElapsed(currentScenario.id) : -1;
  const gameStarted = elapsed >= 0;

  let html = `<div class="rv-block clue-section" id="clue-section">
    <div class="rv-block-title">🔍 단서 카드</div>`;

  // Personal clues (나만 아는 증거) — unlocked when game starts
  if(r && r.personalClues && r.personalClues.length){
    html += `<div style="font-size:.72rem;color:var(--gold);font-weight:700;letter-spacing:.08em;margin-bottom:8px;">나만 아는 증거</div>
    <div style="font-size:.7rem;color:var(--text2);margin-bottom:10px;">게임 시작 시 즉시 확인 가능한 나의 개인 증거입니다.</div>
    <div class="clue-grid-wrapper">`;
    r.personalClues.forEach((c,i)=>{
      html += buildPersonalClueCard(c, r.id, i, gameStarted);
    });
    html += `</div>`;

    html += `<div class="clue-section-sep"><span>공개 단서 (타이머 연동)</span></div>`;
  }

  // Shared clues — timer locked
  html += `<div style="font-size:.7rem;color:var(--text2);margin-bottom:12px;">타이머에 따라 순서대로 공개됩니다. GM이 게임을 시작해야 확인할 수 있습니다.</div>
  <div class="clue-grid-wrapper" id="clue-grid-wrapper">`;

  s.clues.forEach((c,i)=>{
    html += buildClueCard(c, i, elapsed);
  });

  html += `</div></div>`;
  return html;
}

function buildPersonalClueCard(c, roleId, idx, gameStarted){
  const svgStr = makePersonalSVG(roleId, idx);
  let regAttr = '';
  if(gameStarted){
    const regIdx = _regClue('나만 아는 증거 · '+c.tag, c.name, c.desc, ()=>makePersonalSVG(roleId, idx));
    regAttr = `data-clue-reg="${regIdx}"`;
  }

  return `<div class="clue-card personal-clue-card ${gameStarted?'unlocked':'locked'}" ${regAttr}>
    <div class="clue-inner">
      <div class="clue-img-wrap">
        ${svgStr}
        ${!gameStarted ? `<div class="clue-locked-overlay">
          <div class="lock-icon">🔒</div>
          <div class="lock-countdown">게임 시작 후&#10;즉시 공개</div>
        </div>` : ''}
      </div>
      <div class="clue-content">
        <div class="clue-num-tag" style="${gameStarted?'':'color:var(--text2);border-color:var(--border);'}">나만 아는 증거 · ${c.tag}</div>
        <div class="clue-name" style="${gameStarted?'':'color:var(--text2);'}">${gameStarted ? c.name : '???'}</div>
        <div class="clue-meaning" style="${gameStarted?'':'filter:blur(5px);user-select:none;'}">${c.desc}</div>
        ${gameStarted
          ? `<div class="personal-badge">🔎 탭하여 크게 보기</div>`
          : `<div class="clue-reveal-badge" style="color:var(--text2);border-color:var(--border);">⏱ 게임 시작 시 공개</div>`}
      </div>
    </div>
  </div>`;
}

function buildClueCard(c, idx, elapsedSec){
  const unlockMin = CLUE_UNLOCK[idx];
  const elapsedMin = elapsedSec < 0 ? -1 : Math.floor(elapsedSec / 60);
  const unlocked = elapsedSec >= 0 && elapsedMin >= unlockMin;
  const remainMin = Math.max(0, unlockMin - (elapsedMin < 0 ? 0 : elapsedMin));
  const svgStr = makeClueSVG(idx+1);
  let regAttr = '';
  if(unlocked){
    const desc = c.meaning + (c.where ? '\n\n📍 ' + c.where : '');
    const regIdx = _regClue('#'+c.num+' '+c.tag, c.name, desc, ()=>makeClueSVG(idx+1));
    regAttr = `data-clue-reg="${regIdx}"`;
  }

  return `<div class="clue-card ${unlocked?'unlocked':'locked'}" data-clue-idx="${idx}" ${regAttr}>
    <div class="clue-inner">
      <div class="clue-img-wrap">
        ${svgStr}
        ${!unlocked ? `<div class="clue-locked-overlay">
          <div class="lock-icon">🔒</div>
          <div class="lock-countdown">${elapsedSec < 0 ? '게임 시작 후&#10;공개' : remainMin+'분 후&#10;공개'}</div>
        </div>` : ''}
      </div>
      <div class="clue-content ${unlocked?'':'clue-locked'}">
        <div class="clue-num-tag">#${c.num} ${c.tag}</div>
        <div class="clue-name">${unlocked ? c.name : '???'}</div>
        <div class="clue-where">${unlocked ? '📍 '+c.where : '🔒 '+unlockMin+'분 후 공개'}</div>
        <div class="clue-meaning">${c.meaning}</div>
        ${unlocked
          ? `<div class="clue-reveal-badge">🔎 탭하여 크게 보기</div>`
          : `<div class="clue-reveal-badge" style="color:var(--text2);border-color:var(--border);">⏱ ${unlockMin}분 경과 시 공개</div>`}
      </div>
    </div>
  </div>`;
}

function refreshClues(sId){
  const wrapper = document.getElementById('clue-grid-wrapper');
  if(!wrapper || !currentScenario) return;
  const elapsed = getElapsed(sId);
  const clues = currentScenario.clues;
  if(!clues) return;

  // Refresh shared clues
  clues.forEach((c,i)=>{
    const card = wrapper.querySelector(`[data-clue-idx="${i}"]`);
    if(!card) return;
    const unlockMin = CLUE_UNLOCK[i];
    const elapsedMin = elapsed < 0 ? -1 : Math.floor(elapsed/60);
    const wasUnlocked = card.classList.contains('unlocked');
    const nowUnlocked = elapsed >= 0 && elapsedMin >= unlockMin;
    if(nowUnlocked !== wasUnlocked){
      card.outerHTML = buildClueCard(c, i, elapsed);
    } else if(!nowUnlocked){
      const overlay = card.querySelector('.lock-countdown');
      if(overlay){
        const remainMin = unlockMin - (elapsedMin < 0 ? 0 : elapsedMin);
        overlay.textContent = elapsed < 0 ? '게임 시작 후\n공개' : `${remainMin}분 후\n공개`;
      }
    }
  });

  // Refresh personal clues on game start
  if(elapsed >= 0){
    document.querySelectorAll('.personal-clue-card.locked').forEach(card=>{
      card.classList.remove('locked');
      card.classList.add('unlocked');
      const overlay = card.querySelector('.clue-locked-overlay');
      if(overlay) overlay.remove();
      const numTag = card.querySelector('.clue-num-tag');
      if(numTag) numTag.style = '';
      const nameEl = card.querySelector('.clue-name');
      if(nameEl) nameEl.style = '';
      const meaningEl = card.querySelector('.clue-meaning');
      if(meaningEl) meaningEl.style = '';
      const badge = card.querySelector('.clue-reveal-badge');
      if(badge) badge.outerHTML = `<div class="personal-badge">✓ 나만 아는 정보</div>`;
    });
  }
}

     clues:['단서 #8 공개 (초반)', '단서 #9, #10 공개 (중반)']},
    {num:6,title:'최후 변론 & 범인 지목',time:'⏱ 10분',
     desc:'각자 범인을 지목하고 이유를 설명. 진범도 다른 사람을 지목해야 함.',
     script:`"한 명씩 돌아가며 범인을 지목하고 이유를 말해주세요. 30초씩입니다."`,
     note:null,clues:[]},
    {num:7,title:'진실 공개',time:'⏱ 5분',
     desc:'GM이 아래 전말을 천천히 낭독합니다.',
     script: gd.closingScript,
     note:null,clues:[]},
  ];

  let html = `
  <div class="rv-hero" style="display:block;padding:32px 0 24px;">
    <div class="rv-status" style="background:rgba(139,48,18,.7);color:#fff;display:inline-block;border-radius:20px;padding:3px 14px;font-size:.6rem;letter-spacing:.15em;font-weight:700;margin-bottom:12px;">GAME MASTER ONLY</div>
    <div class="rv-name">GM 진행 패키지</div>
    <div class="rv-job">7단계 스크립트 · 단서 ${s.clues ? s.clues.length : 0}장 · 진실 전문 · 증언 정리표</div>
  </div>

  <div class="rv-block"><div class="rv-block-title">📋 7단계 진행 스크립트</div>`;

  phases.forEach(p=>{
    html += `<div class="gm-phase">
      <div class="gm-phase-num">${p.num}</div>
      <div>
        <div class="gm-phase-title">${p.title}</div>
        <span class="gm-phase-time">${p.time}</span>
        <div class="gm-phase-desc">${p.desc}</div>
        ${p.script?`<div class="gm-script"><div class="gm-script-label">🎙 낭독 스크립트</div>${p.script}</div>`:''}
        ${p.note?`<div class="gm-note"><strong>💡 GM 팁:</strong> ${p.note}</div>`:''}
        ${p.clues&&p.clues.length?`<div class="gm-note"><strong>📦 단서:</strong> ${p.clues.join(' / ')}</div>`:''}
      </div>
    </div>`;
  });
  html += `</div>`;

  // Clue cards — dynamic from scenario data, clickable
  html += `<div class="rv-block"><div class="rv-block-title">🔍 단서 카드 ${s.clues?s.clues.length:0}장</div><div class="gm-clue-grid">`;
  (s.clues||[]).forEach((c,i)=>{
    const regIdx = _regClue('#'+c.num+' '+c.tag, c.name, c.meaning+(c.where?'\n\n📍 '+c.where:''), ()=>makeClueSVG(i+1));
    html += `<div class="clue-card unlocked" data-clue-reg="${regIdx}">
      <div class="clue-inner">
        <div class="clue-img-wrap" style="width:90px;">${makeClueSVG(i+1)}</div>
        <div class="clue-content">
          <div class="clue-num-tag">#${c.num} ${c.tag}</div>
          <div class="clue-name">${c.name}</div>
          <div class="clue-where">📍 ${c.where}</div>
          <div class="clue-meaning">${c.meaning}</div>
          <div class="clue-reveal-badge">⏱ ${CLUE_UNLOCK[i]}분 후 공개 · 🔎 탭하여 크게 보기</div>
        </div>
      </div>
    </div>`;
  });
  html += `</div></div>`;

  // Truth — from gmData
  html += `<div class="rv-block"><div class="rv-block-title">⚠ 진실 전문 — GM 전용</div>
  <div class="truth-box">
    <div class="truth-title">CONFIDENTIAL — 진범: <strong>${gd.culpritName}</strong></div>
    <div class="truth-body">${gd.truth}</div>
  </div></div>`;

  // Witness table — from scenario roles
  const playerRoles = (s.roles||[]).filter(r=>!r.isGM);
  html += `<div class="rv-block"><div class="rv-block-title">📊 증언 & 알리바이 정리표</div>
  <div class="w-wrap"><table class="w-table">
    <thead><tr><th>인물</th><th>공식 알리바이</th><th>실제 행동</th><th>숨기는 핵심</th><th>역할</th></tr></thead>
    <tbody>${(gd.witness||[]).map(w=>`<tr>
      <td><strong>${w.name}</strong><br><small style="color:var(--text2)">${w.job}</small></td>
      <td>${w.alibi}</td><td>${w.real}</td><td>${w.secret}</td>
      <td><span class="w-badge ${w.badge}">${w.bt}</span></td>
    </tr>`).join('')}</tbody>
  </table></div></div>`;

  // Full timeline
  html += `<div class="rv-block"><div class="rv-block-title">🕐 실제 타임라인 (GM 전용)</div><div class="full-tl">`;
  (gd.timeline||[]).forEach(t=>{
    html += `<div class="ftl-row ${t.key?'key':''}">
      <div class="ftl-left">
        <div class="ftl-time">${t.time}</div>
        <div class="ftl-spine"><div class="ftl-dot"></div><div class="ftl-line"></div></div>
      </div>
      <div class="ftl-text">${t.text}</div>
    </div>`;
  });
  html += `</div></div>`;

  return html;
}

/* ══════════════════════════════════════
   IMAGE MODAL
══════════════════════════════════════ */
/* ══════════════════════════════════════
   CLUE REGISTRY — avoids all onclick escaping issues
══════════════════════════════════════ */
const _clueReg = [];
function _regClue(tag, title, desc, svgFn){
  const idx = _clueReg.length;
  _clueReg.push({tag, title, desc, svgFn});
  return idx;
}

function openImgModal(regIdx){
  const c = _clueReg[regIdx];
  if(!c) return;
  document.getElementById('modal-tag').textContent = c.tag;
  document.getElementById('modal-title').textContent = c.title;
  document.getElementById('modal-desc').textContent = c.desc;
  document.getElementById('modal-svg').innerHTML = c.svgFn();
  document.getElementById('img-modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeImgModal(){
  document.getElementById('img-modal').classList.remove('open');
  document.body.style.overflow = '';
}

function closeModal(e){
  if(e.target === document.getElementById('img-modal')) closeImgModal();
}

/* ══════════════════════════════════════
   NAVIGATION
══════════════════════════════════════ */
function goTo(viewId){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById(viewId).classList.add('active');
  window.scrollTo(0,0);
}

/* ══════════════════════════════════════
   INIT
══════════════════════════════════════ */
renderLobby();

// Global event delegation for clue card clicks (avoids onclick string escaping)
document.addEventListener('click', function(e){
  const card = e.target.closest('[data-clue-reg]');
  if(card){
    const idx = parseInt(card.getAttribute('data-clue-reg'), 10);
    if(!isNaN(idx)) openImgModal(idx);
  }
});
</script>
